releaseNotes: >-
  This patch includes bug fixes and security updates.


  Key changes in this release:
    - Fix settled payment lookups when using PostgreSQL
    - Fix routing fee updates to use your own LND channel policy
    - Fix startup crashes when the Core Lightning hold plugin is configured
    - Update dependencies with TLS certificate security mitigations


  Full release notes are found at https://github.com/getAlby/hub/releases/tag/v1.24.4
