manifestVersion: 1.1
id: fulcrum
implements:
  - electrs
category: bitcoin
name: Fulcrum
version: "2.1.3"
tagline: A fast and nimble Electrum Server
description: >-
  Run your personal Electrum server and connect your Electrum-compatible wallet,
  including BitBoxApp, BlueWallet, Electrum Wallet (Android and Desktop), Nunchuk 
  (Desktop), Phoenix, and Sparrow Wallet to it instead of using a third-party
  Electrum server.


  Powered by Fulcrum from Calin Culianu
developer: Calin Culianu
website: https://fulcrumserver.org/
submitter: Sahil Phule
submission: https://github.com/getumbrel/umbrel-apps/pull/1531
dependencies:
  - bitcoin
repo: https://github.com/cculianu/Fulcrum
support: https://github.com/cculianu/Fulcrum/issues
port: 2109
gallery:
  - 1.jpg
  - 2.jpg
  - 3.jpg
path: ""
defaultPassword: ""
releaseNotes: >-
  Fulcrum 2.1.3 is a minor maintenance update with an important Merkle cache bug fix and dependency refreshes.


  Key improvements:
    - Fixed an off-by-one bug in Fulcrum's internal Merkle cache handling
    - Updated the bundled jemalloc library to 5.4.0
    - Includes minor internal fixes and cleanup


  Full release notes are available at https://github.com/cculianu/Fulcrum/releases/tag/v2.1.3
backupIgnore:
  - data/fulcrum/fulc2_db
