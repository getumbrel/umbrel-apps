manifestVersion: 1.1
id: fulcrum
implements:
  - electrs
category: bitcoin
name: Fulcrum
version: "2.1.2"
tagline: A fast and nimble Electrum Server
description: >-
  Run your personal Electrum server and connect your Electrum-compatible wallet,
  including BitBoxApp, BlueWallet, Electrum Wallet (Android and Desktop), Nunchuk 
  (Desktop), Phoenix, and Sparrow Wallet to it instead of using a third-party
  Electrum server.


  Powered by Fulcrum from Calin Culianu
developer: Calin Culianu
website: https://fulcrumserver.org/
submitter: Sahil Phule
submission: https://github.com/getumbrel/umbrel-apps/pull/1531
dependencies:
  - bitcoin
repo: https://github.com/cculianu/Fulcrum
support: https://github.com/cculianu/Fulcrum/issues
port: 2109
gallery:
  - 1.jpg
  - 2.jpg
  - 3.jpg
path: ""
defaultPassword: ""
releaseNotes: >-
  Fulcrum 2.1.2 is a minor maintenance update with internal fixes and dependency refreshes.


  Key improvements:
    - Refreshed the internal hash map library used by Fulcrum
    - Improved mempool, block processing, and address handling internals
    - Includes assorted typo fixes, cleanup, and small code correctness improvements


  Full release notes are available at https://github.com/cculianu/Fulcrum/releases/tag/v2.1.2
backupIgnore:
  - data/fulcrum/fulc2_db
