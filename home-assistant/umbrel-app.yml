manifestVersion: 1.1
id: home-assistant
category: automation
name: Home Assistant
version: "2026.8.1"
tagline: Home automation that puts local control & privacy first
description: >-
  Open source home automation that puts local control and privacy
  first. Powered by a worldwide community of tinkerers and DIY enthusiasts.
  Once started, Home Assistant will automatically scan your network for known devices and allow you to easily set them up.
  Home Assistant integrates with over a thousand different devices and services.


  Once you have integrated all your devices at home, you can unleash Home Assistant's
  advanced automation engine to make your home work for you. Do things like:

  - Turn on the light when the sun sets or when coming home

  - Get an alert when you leave your garage door open


  Home Assistant keeps your data local, no need for a cloud. Home Assistant communicates with your devices locally, and will fallback to pulling in data from the cloud if there is no other option. No data is stored in the cloud, and everything is processed locally.


  Note: The USB adapter discovery feature (e.g., for Zigbee dongles connected directly to the device running Umbrel) may not work reliably for Umbrel users on Raspberry Pi.
developer: Home Assistant
website: https://home-assistant.io
dependencies: []
repo: https://github.com/home-assistant/core
support: https://community.home-assistant.io
port: 8123
gallery:
  - 1.jpg
  - 2.jpg
  - 3.jpg
path: ""
defaultUsername: ""
defaultPassword: ""
torOnly: false
permissions:
  - STORAGE_DOWNLOADS
releaseNotes: >-
  Home Assistant 2026.8.1 brings the 2026.8 monthly release plus the first patch fixes, focused on a more approachable interface, easier web server settings, cleaner device handling, and expanded integrations.


  Key highlights:
    - Web server settings can now be managed from the interface with safer rollback; existing Umbrel installs keep using port 8123 unless you change it
    - Home Assistant Cloud has a redesigned overview and guided setup flow
    - Entity IDs can be manually renamed and ordered to match your naming style
    - Devices used by multiple integrations are handled more cleanly, with repairs shown for unusual setups when needed
    - Adds new integrations including Dyson Infrared, Gatus, Google Health, LiteLLM, llama.cpp, Midea, and NeoPool
    - 2026.8.1 adds fixes for Matter covers, Seerr webhooks, SmartThings cooling setpoints, the REST API, frontend, and several integration dependencies


  Review the full notes if you use AirNow, Ohme, Paperless-ngx, affected vacuum integrations, or other integrations listed under backward-incompatible changes.


  Full release notes: https://www.home-assistant.io/blog/2026/08/05/release-20268/
submitter: Umbrel
