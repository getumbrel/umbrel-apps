id: kraskus-bch-solo
name: Bitcoin Cash by Kraskus
tagline: Bitcoin Cash solo mining directly to your external wallet
category: crypto
version: 0.5.13
port: 33073
description: 'Bitcoin Cash by Kraskus runs a pruned Bitcoin Cash Node 29.2.0 (wallet disabled, about 10 GB of block data) and a solo-mining dashboard. It uses an external CashAddr payout address only: the app has no wallet and never asks for a recovery phrase, password or private key. A fixed 1 percent developer fee is applied only to successfully mined blocks, as a separate coinbase output; the miner receives the remaining 99 percent. Mining capability is enabled on TCP port 1933. Each startup is paused; save a valid external BCH payout address, wait for node sync, then use the authenticated Start control. Do not forward this miner port to the public internet.'
