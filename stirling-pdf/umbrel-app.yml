releaseNotes: >-
  ⚠️ PDF conversion to the legacy .doc format is no longer supported; use .docx or .odt instead. Conversion of .wpd, .wps, .lwp, .abw, .hwp, and .xps files is also no longer supported. Update any affected pipelines or automations.


  Stirling Office Convert replaces LibreOffice and other conversion tools, improving conversion speed and quality. HTML to PDF supports zoom again, and damaged Office, ebook, and HTML files now show clearer messages.


  This update improves viewer and file-list performance, fixes duplicated or invisible form values, and resolves thumbnails getting stuck loading after changes.


  If you use custom groupsToRemove settings, entries for removed tools such as LibreOffice, Calibre, WeasyPrint, and OpenCV no longer disable conversions; review your settings.


  The PostScript vector conversion endpoints and backend text-editing API removed in the previous release remain unavailable. Use the web interface's Text Editor for text editing.


  Full release notes can be found at https://github.com/Stirling-Tools/Stirling-PDF/releases/tag/v3.5.0

