releaseNotes: >-
  The PDF Text Editor now works directly in the viewer, with better font matching for scanned documents, improved typing, and smaller saved files.


  New tools and improvements include PDF accessibility checks, custom page sizes, odd-even page merging, pixel comparison, and a Clear recents button.


  This update also fixes page numbering on rotated or cropped pages and Safari uploads, and includes security and stability improvements.


  The PostScript vector conversion endpoints have been removed (PS/EPS to PDF and PDF to PS/EPS/PCL/XPS). The previously deprecated backend text-editing API is also no longer available; use the web interface's Text Editor instead.


  Full release notes can be found at https://github.com/Stirling-Tools/Stirling-PDF/releases/tag/v3.4.0

