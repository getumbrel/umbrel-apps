dependencies: []
releaseNotes: >-
  This release adds image generation, improves document handling, and includes chat and agent fixes.


  - Added image generation through the /img command when a supported provider is configured
  - Improved the file picker with folder drag-and-drop, direct folder uploads, simpler URL fetching, and faster large-folder loading
  - Added the ability to toggle agent tools during a chat session
  - Improved stop generation so cancelled responses also stop the underlying inference
  - Fixed workspace chat, citations, MCP server handling, model defaults, and several provider-specific issues


  Full release notes can be found at https://github.com/Mintplex-Labs/anything-llm/releases/tag/v1.16.0
