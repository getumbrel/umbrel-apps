releaseNotes: >-
  This release adds more AI provider options, improves agent/web-search workflows, and includes security and reliability fixes.


  - Added LLMman as a local LLM provider, Google Vertex AI support, and a new generate-image agent skill
  - Switched the default web-search provider to You.com and added AnySearch and other search/provider options
  - Improved local-provider model-loading status, scraped web page formatting, PDF text extraction, literal document search, and watched-document sync cleanup
  - Added Hindi, Bulgarian, and Swedish language support
  - Fixed provider/chat-history issues, imported skill names, GitHub/GitLab/Confluence resync handling, and a security advisory


  Full release notes can be found at https://github.com/Mintplex-Labs/anything-llm/releases/tag/v1.16.2
