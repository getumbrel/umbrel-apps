releaseNotes: >-
  This release improves document handling, provider integrations, scheduled jobs, and agent/tool reliability.


  - Fixed chat attachment isolation, file embedding failures, and cleanup of referenced MBOX attachments
  - Improved handling for paginated document pickers, bulk scraping, uploads, and generated Office files
  - Fixed provider/tool-call edge cases across agents, retries, Anthropic, AstraDB, Paperless-ngx, Outlook, and Confluence
  - Improved scheduled-job behavior, prompt variable expansion, and error reporting in several setup and workspace flows


  Full release notes can be found at https://github.com/Mintplex-Labs/anything-llm/releases/tag/v1.18.0
