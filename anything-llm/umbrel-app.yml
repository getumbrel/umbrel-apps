releaseNotes: >-
  This release improves agent activity, provider support, and chat reliability.


  - Added a cleaner collapsible chain-of-thought and agent activity view
  - Warns before leaving a chat while a response is still generating
  - Added AWS Bedrock cross-region inference profiles and LocalAI image generation support
  - Improved prompt draft persistence, onboarding, LLM selection, and streaming UI behavior
  - Fixed Gemini and Anthropic/Bedrock streaming crashes, workspace creation, agent websocket timing, memory cleanup, and PDF OCR handling


  Full release notes can be found at https://github.com/Mintplex-Labs/anything-llm/releases/tag/v1.16.1
