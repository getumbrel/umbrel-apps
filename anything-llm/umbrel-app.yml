dependencies: []
releaseNotes: >-
  This release improves browser extension chat, agent tools, and document handling.


  - Chat from the updated browser extension sidebar and add selected text or images as context
  - Create PowerPoint presentations with new themes, layouts, and live slide previews
  - Edit Gmail and Outlook email drafts directly in approval cards before sending
  - Manage MCP servers through the developer API and configure per-server tool timeouts
  - Improve document selection, scanned PDF imports, chat history, and provider compatibility
  - Strengthen access checks for embedded chats, browser extension keys, and agent sessions


  Full release notes can be found at https://github.com/Mintplex-Labs/anything-llm/releases/tag/v1.20.0
