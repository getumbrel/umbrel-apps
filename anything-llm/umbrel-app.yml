releaseNotes: >-
  This release adds interface color palettes and improves chat, document imports, and provider reliability.


  - Customize the interface with new color palettes and tabbed branding settings
  - Preserve conversation history and current attachments when chat prompts are compressed
  - Improve document imports, repository connectors, file embedding progress, and PDF link scraping
  - Improve compatibility with Gemini, Mistral reasoning models, and MCP tools
  - Harden CSV chat exports, limit oversized requests, and keep API key fragments out of search errors


  Full release notes can be found at https://github.com/Mintplex-Labs/anything-llm/releases/tag/v1.19.0
