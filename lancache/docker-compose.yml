version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: lancache_web_1
      APP_PORT: 80

  web:
    image: nginx:1.27.4-alpine@sha256:4ff102c5d78d254a6f0da062b3cf39eaf07f01eec0927fd21e219d0af8bc0591
    restart: on-failure
    depends_on:
      - monolithic
    environment:
      - LANCACHE_IP=${LANCACHE_IP:-127.0.0.1}
      - UPSTREAM_DNS=${UPSTREAM_DNS:-1.1.1.1}
      - CACHE_DISK_SIZE=${CACHE_DISK_SIZE:-500g}
      - ENABLE_PREFILL=${ENABLE_PREFILL:-false}
      - PREFILL_SCHEDULE=${PREFILL_SCHEDULE:-0 4 * * *}
    volumes:
      - ${APP_DATA_DIR}/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${APP_DATA_DIR}/index.html:/usr/share/nginx/html/index.html:ro
      - ${APP_DATA_DIR}/data/logs:/var/log/lancache:ro

  monolithic:
    image: ghcr.io/opeitsmax/lancache-monolithic:0.2.1@sha256:1169ecfb0aaae7c18829f208d7bf96c1c607fc93f1d3866cb075c6a49be5bb04
    restart: on-failure
    environment:
      - USE_GENERIC_CACHE=true
      - LANCACHE_IP=${LANCACHE_IP:-127.0.0.1}
      - DNS_BIND_IP=0.0.0.0
      - UPSTREAM_DNS=${UPSTREAM_DNS:-1.1.1.1}
      - CACHE_DISK_SIZE=${CACHE_DISK_SIZE:-500g}
      - CACHE_INDEX_SIZE=${CACHE_MEM_SIZE:-500m}
      - CACHE_MAX_AGE=${CACHE_MAX_AGE:-3650d}
      - TZ=UTC
    ports:
      - "8261:80"
      - "8262:443"
    volumes:
      - ${APP_DATA_DIR}/data/cache:/data/cache
      - ${APP_DATA_DIR}/data/logs:/data/logs

  dns:
    image: ghcr.io/opeitsmax/lancache-dns:0.2.1@sha256:e88e05bf2421201c72bccf99531b0ef2137bf7ec55021757a9b9153dc7eb1ce6
    restart: on-failure
    environment:
      - USE_GENERIC_CACHE=true
      - LANCACHE_IP=${LANCACHE_IP:-127.0.0.1}
      - UPSTREAM_DNS=${UPSTREAM_DNS:-1.1.1.1}
      - TZ=UTC
    ports:
      - "53:53/udp"
      - "53:53/tcp"

  prefill:
    image: ghcr.io/opeitsmax/lancache-prefill:0.2.1@sha256:9f8911844ca89f277dec5ac00885853d5476ef224ea9b2853580ead25a4e329f
    restart: on-failure
    depends_on:
      - monolithic
      - dns
    environment:
      - ENABLE_PREFILL=${ENABLE_PREFILL:-false}
      - CRON_SCHEDULE=${PREFILL_SCHEDULE:-0 4 * * *}
      - LANCACHE_IP=${LANCACHE_IP:-127.0.0.1}
      - TZ=UTC
    volumes:
      - ${APP_DATA_DIR}/data/prefill:/Config
