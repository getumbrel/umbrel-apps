releaseNotes: >-
  New features:
    - Added a documentation site and in-app footer link.
    - Added dashboard chart period/direction selection across hours, days,
      months, and years.
    - Split dashboard counters into received/sent totals, with distinct mail
      domain counts on account cards.


  Improvements:
    - Added optional at-rest encryption for IMAP passwords, M365 client
      secrets, and MSA OAuth tokens.
    - Pre-computes and caches dashboard statistics to improve dashboard
      performance and reduce concurrent cold-load work.
    - Speeds up account storage refreshes without changing displayed values.


  Full release notes can be found at https://github.com/s1t5/mail-archiver/releases/tag/2610.1
