releaseNotes: >-
  You may need to sign in again after this update. If you still use the configured initial admin password, you will be required to change it when signing in.


  Improvements and fixes:
    - Preview XRechnung invoice attachments as readable PDFs.
    - Select or delete emails matching a search across multiple pages.
    - Jump directly to a page and resize columns in email and account lists.
    - Password changes, account deactivation, and role changes now invalidate other active sessions.
    - Restoring emails uses the stored original message when available.
    - Improved attachment previews, narrow-screen account controls, and deletion logs.


  Full release notes can be found at https://github.com/s1t5/mail-archiver/releases/tag/2611.3
