services:
  app_proxy:
    environment:
      APP_HOST: mailarchiver_app_1
      APP_PORT: 5000

  app:
    image: ghcr.io/s1t5/mailarchiver:2611.3@sha256:5d1e1a2b210f92186aade29bfecbac9001733ae9f51ea7a8375c9d23df24caaa
    restart: on-failure
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    volumes:
      - ${APP_DATA_DIR}/data/data-protection-keys:/app/DataProtection-Keys
      - ${APP_DATA_DIR}/data/appsettings.json:/app/appsettings.json
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18.3-alpine3.23@sha256:4da1a4828be12604092fa55311276f08f9224a74a62dcb4708bd7439e2a03911
    restart: on-failure
    user: 1000:1000
    environment:
      POSTGRES_DB: mailarchiver
      POSTGRES_USER: mailarchiver
      POSTGRES_PASSWORD: mailarchiver
    volumes:
      - ${APP_DATA_DIR}/data/database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailarchiver -d mailarchiver"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
