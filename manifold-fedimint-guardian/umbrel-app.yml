manifestVersion: 1
id: manifold-fedimint-guardian
category: bitcoin
name: Manifold Fedimint Guardian
version: "0.1.5"
tagline: Run guardian seats across many federations from one machine.
description: >-
  Manifold Fedimint Guardian lets you run guardian seats across multiple
  Fedimint federations from a single machine. Advertise your available capacity,
  get selected for federations, provision guardian seats locally, and earn fees
  for the seats you operate. Each seat runs as a distinct guardian with its own
  fedimintd instance and key, so you can serve multiple communities and earn fees.


  As part of a federation, you participate in the consensus with other guardians.
  No guardian controls a federation’s funds alone or sees users’ holdings.


  Manifold Fedimint Guardian is part of Manifold, the protocol for accelerating
  the deployment and decentralisation of Fedimint federations.
releaseNotes: |-
  This release lets your guardians host more seats and adds Bitcoin transfers to the Stability Pool.

  - Guardians now use about half as much memory per seat. This host now sets its seat limit from its memory, unless you chose a limit above 8.
  - This host offers new seats only while it stays online most of the time. Keep it running to keep selling seats.
  - Bitcoin transfers in the Stability Pool turn on when every guardian of a federation runs this release. Update soon so your federations can use them.

  No special upgrade steps are required for normal installations.

  Automatic guardian backups created or updated by this version require version 0.1.3 or later to restore. Older backups can still be restored with this version.
developer: Fedi
website: https://manifold.fedi.xyz/
dependencies:
  - bitcoin
repo: https://github.com/fedibtc/manifold
support: https://support.fedi.xyz/
port: 8483
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
path: ""
defaultUsername: ""
defaultPassword: ""
deterministicPassword: true
backupIgnore:
  - data/safe-events
  - data/seats/*/safe-events
submitter: Fedi
submission: https://github.com/getumbrel/umbrel-apps/pull/6110
