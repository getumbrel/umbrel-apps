manifestVersion: 1
id: manifold-fedimint-guardian
category: bitcoin
name: Manifold Fedimint Guardian
version: "0.1.18"
tagline: Run guardian seats across many federations from one machine.
description: >-
  Manifold Fedimint Guardian lets you run guardian seats across multiple
  Fedimint federations from a single machine. Advertise your available capacity,
  get selected for federations, provision guardian seats locally, and earn fees
  for the seats you operate. Each seat runs as a distinct guardian with its own
  fedimintd instance and key, so you can serve multiple communities and earn fees.


  As part of a federation, you participate in the consensus with other guardians.
  No guardian controls a federation’s funds alone or sees users’ holdings.


  Manifold Fedimint Guardian is part of Manifold, the protocol for accelerating
  the deployment and decentralisation of Fedimint federations.
releaseNotes: |-
  Your guardian now reports figures about its federation to the Federation Ambassador who runs it: the bitcoin the federation holds, how many wallets were active in the last 30 days, and its Lightning and on-chain payment volume. The Ambassador combines the reports from all guardians. Fedimint 0.12.0-fedi29 adds the volume counting.

  The Overview and Payouts pages no longer stay stuck loading while a payment wallet is recovering. They now say the wallet is recovering. The Overview page also invites you to set up mobile notifications when they are available.

  The temporary uptime reset added in 0.1.17 is removed.

  There are no configuration changes. The guardian adds two new database tables on its first start, and you do not need to do anything.

  Image commit: 520189cfd333e3a94435ac7c7668443395aa2efa. Fedimint: 0.12.0-fedi29.
developer: Fedi
website: https://manifold.fedi.xyz/
dependencies:
  - bitcoin
repo: https://github.com/fedibtc/manifold
support: https://support.fedi.xyz/
port: 8483
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
path: ""
defaultUsername: ""
defaultPassword: ""
deterministicPassword: true
backupIgnore:
  - data/safe-events
  - data/seats/*/safe-events
submitter: Fedi
submission: https://github.com/getumbrel/umbrel-apps/pull/6110
