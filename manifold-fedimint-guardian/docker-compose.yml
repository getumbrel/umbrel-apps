version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: manifold-fedimint-guardian_app_1
      APP_PORT: 8181
  app:
    image: ghcr.io/fedibtc/manifold-fman:3f1bfc6631440fa82b42935f342b63d6e2687b72@sha256:2c41e05da5fad1e693489a14d4bae2f0fab93669937edc3ecf2638e848e2dae3
    restart: on-failure
    stop_grace_period: 1m
    environment:
      FLEET_MANAGER_MANIFOLD_ENVIRONMENT: production
      FLEET_MANAGER_ESPLORA_URL: https://mempool.space/api
      FLEET_MANAGER_BITCOIND_URL: http://${APP_BITCOIN_NODE_IP}:${APP_BITCOIN_RPC_PORT}
      FLEET_MANAGER_BITCOIND_USERNAME: ${APP_BITCOIN_RPC_USER}
      FLEET_MANAGER_BITCOIND_PASSWORD: ${APP_BITCOIN_RPC_PASS}
      FLEET_MANAGER_ADMIN_HTTP_BIND: 0.0.0.0:8181
      # Other apps share Umbrel's network; the daemon must authenticate them too.
      FLEET_MANAGER_ADMIN_HTTP_AUTH: password
      FLEET_MANAGER_ADMIN_HTTP_PASSWORD_FILE: /admin-password
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${APP_DATA_DIR}/admin-password:/admin-password:ro
