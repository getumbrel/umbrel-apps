services:
  app_proxy:
    environment:
      APP_HOST: jupyterlab_server_1
      APP_PORT: 8888
      PROXY_AUTH_ADD: "false"

  server:
    image: quay.io/jupyter/base-notebook:lab-4.6.4@sha256:cadf552d9a462787f9c7dd4827d1edae95aeb3a6e638fdf70948767295841a57
    user: "1000:1000"
    volumes:
      - ${APP_DATA_DIR}/data:/home/jovyan/work
    command: start-notebook.py --IdentityProvider.token=${APP_PASSWORD}
    restart: on-failure
