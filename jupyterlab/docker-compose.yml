services:
  app_proxy:
    environment:
      APP_HOST: jupyterlab_server_1
      APP_PORT: 8888
      PROXY_AUTH_ADD: "false"

  server:
    image: quay.io/jupyter/base-notebook:lab-4.6.6@sha256:1bac999da107f2987abf891ce389d6f1b92a6367d225854eb9916c471d9bb66e
    user: "1000:1000"
    volumes:
      - ${APP_DATA_DIR}/data:/home/jovyan/work
    command: start-notebook.py --IdentityProvider.token=${APP_PASSWORD}
    restart: on-failure
