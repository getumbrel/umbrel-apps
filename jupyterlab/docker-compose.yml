services:
  app_proxy:
    environment:
      APP_HOST: jupyterlab_server_1
      APP_PORT: 8888
      PROXY_AUTH_ADD: "false"

  server:
    image: quay.io/jupyter/base-notebook:lab-4.6.5@sha256:0a8cbf83fe9fe098e51e876053feef50453e9a406ccf06f9e7c06c7f95e8490c
    user: "1000:1000"
    volumes:
      - ${APP_DATA_DIR}/data:/home/jovyan/work
    command: start-notebook.py --IdentityProvider.token=${APP_PASSWORD}
    restart: on-failure
