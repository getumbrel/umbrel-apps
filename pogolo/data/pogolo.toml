[pogolo]
# optional, required from sv1 clients if set
# password = ''
# will be replaced by default tag if too long (about 86 chars)
# customize it! add your swarm stats, like
# '/pogolo on Umbrel - gamma x1 - decentralize or die/'
tag = '/pogolo on Umbrel - decentralize or die/'
# default on-chain address to mine to if not provided by client
# pool_address = ''
# minimum 0.16
default_difficulty = 1024.0
# how often to send new work to clients, in seconds
job_interval = 60
# how often we want shares on average, in seconds
target_share_interval = 5
# maximum time pogolo will wait for the next share before acknowledging the batch, in seconds
# minimum: 1
share_batch_window = 15
# extranonce2 size in bytes, usually shouldnt be touched
# extranonce2_size = 4
# version bits as int32, ORed with the template version
# bip_version_bits = 0
# ignore the client-suggested difficulty
# ignore_suggested_difficulty = false
# disable automatic difficulty adjustment
# disable_vardiff = false
# whether to wait for the backend to sync before creating the first job
wait_for_sync = true
# the encoded stratumv2.Keypair used for the authority key
# can be generated with '--generate-authority-key'
# authority_keypair = ''
# file to log to (path resolution same as cookie)
# log_file = ''
# disables logging entirely
# disable_logs = false
