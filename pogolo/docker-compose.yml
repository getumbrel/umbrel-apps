version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: pogolo_webui_1
      APP_PORT: 5663

  pogolo:
    image: 0xf0xx0/pogolo:v1.1.5@sha256:a4f89ca4b1a1422ef16f5ff37e24fc111bc17a95f561ee85ff0c49c294ceb0a1
    restart: on-failure
    user: "1000:1000"
    stop_grace_period: 30s
    labels:
      - logopo
    ports:
      - 5661:5661 # stratum
      - 5662:5662 # api
    volumes:
      - "${APP_DATA_DIR}/data:/data"
    environment:
      POGOLO_HOST: "0.0.0.0"
      POGOLO_BACKEND_HOST: "$APP_BITCOIN_NODE_IP:$APP_BITCOIN_RPC_PORT"
      POGOLO_BACKEND_RPCAUTH: "$APP_BITCOIN_RPC_USER:$APP_BITCOIN_RPC_PASS"
      POGOLO_BACKEND_ZMQHOST: "tcp://$APP_BITCOIN_NODE_IP:$APP_BITCOIN_ZMQ_HASHBLOCK_PORT"
      # colorful logs
      FORCE_COLOR: 1
    command: ["/pogolo", "--conf", "/data/pogolo.toml", "--logfile", "/data/pogolo.log"]

  webui:
    image: 0xf0xx0/pogolo-umbrel-webui:v1.x@sha256:67c0ce5d8fc1d0fb5292f92a9263546de352ecf1a1b109d294a8ab9d0eee1b73
    restart: on-failure
    user: "1000:1000"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      POGOLO_API_URL: "http://pogolo_pogolo_1:5662"
      POGOLO_LOG: /data/pogolo.log # log file we tail for the live log stream
      POGOLO_DIR: /data # where pogolo.toml lives
      DEVICE_DOMAIN_NAME: "${DEVICE_DOMAIN_NAME}"
