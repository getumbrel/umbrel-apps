manifestVersion: 1.1
name: pogolo
id: pogolo
version: "1.1.5"
category: bitcoin
dependencies:
  - bitcoin
tagline: Local Go-based solo pool
description: >-
  solo db-less bitcoin-only mining pool,
  meant for lan swarms, not the internet;


  start it, point your miners to it, and watch the logs roll by


  think of this as public-pool but minimal and for self-sovereign nerds
releaseNotes: |-
  # New

  - Umbrel only: Web UI! Forked from the Bitcoin Core app and stripped down for my use uwu

  ## api

  - new `/gophers` endpoint to return detailed stats on all connected gophers

  - api now returns the height, difficulty, extranonce2, nonce, version, timestamp, and gopher alongside the hash of found blocks

  - openapi.yaml is now served at `/openapi.yaml`

  # Changed

  - the `/gopher/:idOrNickname` endpoint has been moved to `/gophers/:idOrNickname`

  - lots of small performance optimizations, pogolo goes toe-to-toe with the biggest without all the memory use :3

developer: 0xf0xx0
website: https://github.com/0xf0xx0/pogolo
repo: https://github.com/0xf0xx0/pogolo
support: https://github.com/0xf0xx0/pogolo/discussions
port: 5663
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
path: ""
submitter: 0xf0xx0
submission: https://github.com/getumbrel/umbrel-apps/pull/4622
widgets:
  - id: "pogolo-stats"
    type: "four-stats"
    refresh: "30s"
    endpoint: "webui:5663/api/widget/pool"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "Hashrate"
          text: "6.9"
          subtext: "Th/s"
        - title: "Gophers"
          text: "420,420"
        - title: "Height"
          text: "676,767"
        - title: "Best Share"
          text: "210"
          subtext: "Giga"
