version: '3.7'

services:
  app_proxy:
    environment:
      APP_HOST: titra_web_1
      APP_PORT: 3000
      PROXY_AUTH_ADD: "false"

  web:
    image: titraio/titra:v1.0.10@sha256:76eef3dee66eec759ec3ddc13a3053c21461e45868ded1018825475c7bf8c713
    restart: on-failure
    depends_on:
      - titra-mongodb
    environment:
      ROOT_URL: "http://${DEVICE_DOMAIN_NAME}:3471"
      MONGO_URL: "mongodb://titra:${APP_SEED}@titra-mongodb:27017/titra?authSource=admin&directConnection=true"
      PORT: "3000"

  titra-mongodb:
    image: mongo:7.0.37@sha256:340c1c56fb10e95cf79ff547f8664b96bc6ead9909bc355238cbf865a9695a6f
    restart: on-failure
    environment:
      MONGO_INITDB_ROOT_USERNAME: titra
      MONGO_INITDB_ROOT_PASSWORD: ${APP_SEED}
    volumes:
      - ${APP_DATA_DIR}/data/mongodb:/data/db
