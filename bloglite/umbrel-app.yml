manifestVersion: 2.0
id: bloglite
storage:
  dataRoot: data
environment:
  - name: BLOGLITE_DOMAIN
    services:
      - web
    note: >-
      Optional: the domain your blog is published at, without https://, such as blog.example.com. Used for links in the RSS feed and sitemap. Leave empty for local use.
category: social
name: bloglite
version: "3.1.0"
tagline: A lightweight self-hosted (micro)blog
description: >-
  bloglite (formerly fx) is a minimal Twitter/Bluesky-like (micro)blogging service you can self-host. It runs in just a few megabytes of memory.


  Write and edit posts directly in the browser, from desktop or mobile, and see the result within seconds. Use it as a public notebook for notes, code snippets, recipes and links.


  - Write posts in Markdown with built-in syntax highlighting

  - Math expressions using LaTeX syntax

  - Upload files and images to embed in posts

  - Built-in search, RSS feed and sitemap

  - Backup API that exports posts, files and settings as plain text


  Posts can be read by anyone who can reach the app, without an Umbrel login. Log in with the credentials shown by Umbrel to write.
releaseNotes: ""
developer: Rik Huijzer
website: https://github.com/rikhuijzer/bloglite
dependencies: []
repo: https://github.com/rikhuijzer/bloglite
support: https://github.com/rikhuijzer/bloglite/issues
port: 8232
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
path: ""
requiresHttps: true
defaultUsername: "admin"
defaultPassword: ""
deterministicPassword: true
submitter: Kanishk Pachauri
submission: https://github.com/getumbrel/umbrel-apps/pull/3956
