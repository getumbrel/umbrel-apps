manifestVersion: 1
id: remnic
name: Remnic
tagline: Local-first memory and context for AI agents
category: ai
version: "9.69.61"
port: 4318
description: >-
  Remnic is a local-first memory and context server for AI agents. It exposes
  memory over HTTP and MCP so tools such as OpenClaw, Codex, Cursor, and other
  agent runtimes can observe, recall, and search long-term context while keeping
  the underlying memory files on your Umbrel.


  The Umbrel app includes the Remnic admin dashboard, persistent memory storage,
  authenticated API access, and configuration controls for optional retrieval,
  enrichment, harness, and model settings. The default app password shown by Umbrel
  is the bearer token for the dashboard, HTTP API, and MCP clients including
  ZCode.
developer: Joshua Warren
website: https://github.com/joshuaswarren/remnic
dependencies: []
repo: https://github.com/joshuaswarren/remnic
support: https://github.com/joshuaswarren/remnic/issues
gallery: []
releaseNotes: >-
  Updated Remnic server to 9.69.61 with full MCP streamable-HTTP support, making
  the /mcp endpoint compatible with ZCode and other MCP clients out of the box.
path: "/engram/ui/"
deterministicPassword: true
defaultUsername: ""
submitter: Joshua Warren
submission: https://github.com/getumbrel/umbrel-apps/pull/5762
