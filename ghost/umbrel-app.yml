releaseNotes: >-
  This update lets you connect an SMTP email provider in Ghost's app settings on umbrelOS 2.0, so Ghost can send member sign-in links, staff invitations and password resets. Newsletters still use the Mailgun settings in Ghost's admin.


  Previous Ghost 6.77.0 release notes:


  Ghost 6.77.0 adds files to the welcome and automation email editor and shows how members joined in activity feeds. It also fixes saving design settings after uploading a theme, importing Ghost(Pro) exports, and custom field form layout.


  Full release notes can be found at https://github.com/TryGhost/Ghost/releases/tag/v6.77.0
dependencies: []
path: "/ghost"
defaultUsername: ""
defaultPassword: ""
