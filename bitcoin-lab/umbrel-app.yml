manifestVersion: 1
id: bitcoin-lab
storage:
  dataRoot: data
category: bitcoin
name: Bitcoin Lab
version: "2.0.2"
tagline: See which peers bring you new blocks first
description: >-
  Ever wondered which of your peers actually brings you new blocks first? Your peers decide how soon your node hears about a new block, and Bitcoin Core picks them at random. Bitcoin Lab notes for every block which peer delivered it first and ranks your peers by it.


  Then you act on it. Keep a good peer and Core holds on to it instead of letting it rotate away; drop one that never delivers and Core hands you a fresh random peer to rank in its place. An optional rotation runs this loop for you among Core's outbound connections; it is off by default. Your proven peers are put back after a restart, which Core itself will not do. Inbound peers are ranked too, but never promoted or replaced automatically.


  Not every connection is even in the running. A phone wallet, a network crawler, an address indexer - software like that passes no blocks on at all, so it can never deliver one. Those peers are marked "never first" in the list, with the reason shown on hover, rather than quietly counted among your competitors. Peer Map, in the same store, shows the same peers on a world map: where they are, who runs them and what they are.


  Stratum Race is the other half: it times how quickly each mining pool turns a new block into fresh work, your own local pool included, with eight public solo pools racing as the baseline. It is off until you switch it on, so installing this does not start talking to anybody's pool on its own. Every second a miner spends on an already-solved block is a stale share, and that is the window curated peers close. Whether that is worth chasing is a fair question: half a second off a ten-minute job is 0.08% of your miner's time. Bitcoin Lab is for people who enjoy chasing it anyway.


releaseNotes: ""
developer: Ben
website: https://github.com/benunskilled/bitcoin-lab
dependencies:
  - bitcoin
repo: https://github.com/benunskilled/bitcoin-lab
support: https://github.com/benunskilled/bitcoin-lab/issues

port: 8790
gallery: []
path: ""

defaultUsername: ""
defaultPassword: ""

widgets:
  - id: "stats"
    type: "four-stats"
    refresh: "60s"
    endpoint: "dashboard:8788/api/widget/stats"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "Live Peers"
          text: "42"
          subtext: "connected"
        - title: "Best Peer"
          text: "33%"
          subtext: "203.0.113.12:8333"
        - title: "Fastest Pool"
          text: "80ms"
          subtext: "AtlasPool"
        - title: "Manual"
          text: "8/8"
          subtext: "manual peers online"
  - id: "traffic"
    type: "three-stats"
    refresh: "3600s"
    endpoint: "dashboard:8788/api/widget/traffic"
    link: ""
    example:
      type: "three-stats"
      link: ""
      items:
        - text: "8.4 GB"
          subtext: "sent today"
        - text: "1.9 GB"
          subtext: "received today"
        - text: "312 GB"
          subtext: "last 30 days"

