manifestVersion: 1
id: blockhorizon
storage:
  dataRoot: data
category: bitcoin
name: BLOCKHORIZON
version: "0.18.0"
tagline: A calm, live Bitcoin dashboard where time is measured in blocks
description: >-
  BLOCKHORIZON shows your node's view of Bitcoin on one calm screen: the block height, the next halving,
  the difficulty adjustment, hashrate, fees, the mempool and the blocks on their way.


  It also draws the next block being mined live, sounds alarms at a block height, price or fee level, has a
  clock mode for a spare screen, history charts and a live trading chart, and "your block": the block mined on
  a day that matters to you.


  On Umbrel it reads block, fee, mempool and transaction data from your own Mempool app, so your browser never
  asks a third party for it. The price comes from Kraken's public feed. No accounts and no tracking; settings
  stay in your browser.
releaseNotes: >-
  Know when your payment confirms: on a waiting transaction's page, "Tell me when it is confirmed" gives a sound and a
  message once it is in a block, and with "On your phone" turned on, your node tells your phone too.


  Also new: a block clock for a spare screen. Open Clock mode with #/clock?kiosk for a screen that stays on, or
  #/clock?kiosk&eink for an e-ink display.

developer: Random21m
