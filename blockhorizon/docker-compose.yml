version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: blockhorizon_web_1
      APP_PORT: 80

  web:
    image: ghcr.io/random21m/blockhorizon:v0.23.0@sha256:59bccbea5b18fab5183fd648eb5ef1f78d0fb926b43d8205872ff9a1224c8312
    init: true
    restart: on-failure
    stop_grace_period: 30s
    environment:
      # The Mempool app's web container (exported by the Mempool app, as its own widget server uses it):
      # it serves the mempool REST API and live feed at /api, which this container proxies.
      MEMPOOL_URL: http://${APP_MEMPOOL_IP}:${APP_MEMPOOL_PORT}
    volumes:
      # alarms waiting to be sent to your phone (Alarm page, On your phone)
      - ${APP_DATA_DIR}/data:/var/lib/blockhorizon
