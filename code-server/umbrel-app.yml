manifestVersion: 1
id: code-server
storage:
  dataRoot: data
category: developer
name: code-server
version: "4.143.1"
tagline: Run VS Code on your Umbrel
description: >-
  Run VS Code on your Umbrel and access it in the browser so you can
  code on any device with a consistent development environment. This way you can
  use your Umbrel not only to code from any device, anywhere, but to also speed
  up tests, compilations, downloads, and more.


  By running all intensive tasks run on your Umbrel, preserve battery life of your devices when you're on the go.
releaseNotes: >-
  This update includes important security fixes and updates the VS Code editor to 1.143.1.


  - Fixes a remote code execution vulnerability in the bundled Node.js runtime and rejects compressed request bodies.

  - Fixes boolean settings that were not correctly disabled when set to false.

  - Adds Turkish language support.


  Full release notes are available at https://github.com/coder/code-server/releases/tag/v4.143.1
