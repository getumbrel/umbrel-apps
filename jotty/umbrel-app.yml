manifestVersion: 1
id: jotty
storage:
  dataRoot: data
category: files
name: Jotty
version: "1.28.0"
tagline: A simple app, for your checklists and notes
description: >-
  Tired of bloated, cloud-based to-do apps? Jotty is a lightweight alternative for managing your personal checklists and notes.


  Features:
    - Checklists: Create task lists with drag & drop reordering, progress bars, and categories. Supports both simple checklists and advanced task projects with Kanban boards and time tracking.
    - Rich Text Notes: A clean WYSIWYG editor for your notes, powered by TipTap with full Markdown support and syntax highlighting.
    - Sharing: Share checklists or notes with other users on your instance, including public sharing with shareable links.
    - File-Based: No database needed! Everything is stored in simple Markdown and JSON files in a single data directory.
    - User Management: An admin panel to create and manage user accounts with session tracking.
backupIgnore:
  - data/cache/*
developer: fccview
website: https://jotty.page
repo: https://github.com/fccview/jotty
support: https://github.com/fccview/jotty/issues
port: 8345
submitter: Kanishk Pachauri
submission: https://github.com/getumbrel/umbrel-apps/pull/3961
releaseNotes: >-
  Jotty 1.28.0 introduces relationship indexing for linked notes and checklists, with new item links, wikilinks, backlinks, inline suggestions, relationship details, and updated 2D/3D brain views.


  This release also adds an MCP server and expanded API/docs endpoints, new relationship-index controls, a checklist option to insert new items at the end, and autosaving user settings.


  It fixes several note, editor, sharing, menu, and session issues, including interrupted saves creating empty stubs, shared item permissions showing incorrectly, referenced-by links disappearing after edits, and user deletion leaving stale shares.


  Jotty now maintains a rebuildable relationship/index database alongside the existing file data; the release notes also call out stricter API validation and export behavior changes for integrations.


  Full release notes can be found at https://github.com/fccview/jotty/releases/tag/1.28.0
