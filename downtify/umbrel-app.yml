manifestVersion: 1
id: downtify
storage:
  dataRoot: data
category: media
name: Downtify
version: "3.12.0"
tagline: Download Spotify music with album art and metadata
description: >-
  Downtify allows you to download music by copy-pasting the Spotify link for a song, album, etc. The songs are downloaded from YouTube, along with album art, lyrics, and other metadata about the songs.
  As soon as your downloads are complete you will be notified!


  **⚠️ Important note on music sourcing from the app developers:**

  Users are responsible for their actions and potential legal consequences.
  We do not support unauthorized downloading of copyrighted material and take no responsibility for user actions.
developer: Henrique Sebastião
dependencies: []
permissions:
  - STORAGE_DOWNLOADS
repo: https://github.com/henriquesebastiao/downtify
port: 8789
releaseNotes: >-
  ⚠️ The music library is now shared across accounts: all users can see every downloaded song. Admins can hide songs, albums, or artists from listings, but hiding does not prevent access to a file whose address is already known. Do not use it to protect sensitive files.


  This update adds backup and restore, automatic YouTube cookie refresh, more lyrics sources, and improved album covers. Artist monitoring can show upcoming releases and download them on release day.


  It also prevents replaced uploads from being downloaded again, makes monitored downloads respect the parallel download limit, and improves duplicate-song and playlist repair tools.


  Full release notes can be found at https://github.com/henriquesebastiao/downtify/releases/tag/3.12.0
support: https://github.com/henriquesebastiao/downtify/issues
website: https://github.com/henriquesebastiao/downtify
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
path: ""
defaultUsername: "admin"
defaultPassword: "downtify"
submitter: Henrique Sebastião
submission: https://github.com/getumbrel/umbrel-apps/pull/2177
