manifestVersion: 1
id: downtify
storage:
  dataRoot: data
category: media
name: Downtify
version: "2.12.0-patch.1"
tagline: Download Spotify music with album art and metadata
description: >-
  Downtify allows you to download music by copy-pasting the Spotify link for a song, album, etc. The songs are downloaded from YouTube, along with album art, lyrics, and other metadata about the songs.
  As soon as your downloads are complete you will be notified!


  **⚠️ Important note on music sourcing from the app developers:**

  Users are responsible for their actions and potential legal consequences.
  We do not support unauthorized downloading of copyrighted material and take no responsibility for user actions.
developer: Henrique Sebastião
dependencies: []
permissions:
  - STORAGE_DOWNLOADS
repo: https://github.com/henriquesebastiao/downtify
port: 8789
releaseNotes: >-
  This update adds support for new storage management and configuration options being introduced with umbrelOS 2.0.


  Previous Downtify 2.12.0 release notes:


  This release adds a global mini player, bulk track deletion from the Library menu, and cleanup of lyrics and empty folders when deleting tracks.


  It adds a settings option to upload YouTube cookies, improves pagination displays, refreshes the app icons, and notifies users when a newer Downtify version is available.


  It also improves Spotify/YouTube matching for live tracks, moves internal HTTP calls to httpx, and includes fixes for download reliability and mobile styling.


  Full release notes can be found at https://github.com/henriquesebastiao/downtify/releases/tag/2.12.0
support: https://github.com/henriquesebastiao/downtify/issues
website: https://github.com/henriquesebastiao/downtify
gallery:
  - 1.jpg
  - 2.jpg
  - 3.jpg
path: ""
defaultUsername: ""
defaultPassword: ""
submitter: Henrique Sebastião
submission: https://github.com/getumbrel/umbrel-apps/pull/2177
