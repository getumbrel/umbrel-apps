manifestVersion: 1
id: downtify
storage:
  dataRoot: data
category: media
name: Downtify
version: "3.0.0"
tagline: Download Spotify music with album art and metadata
description: >-
  Downtify allows you to download music by copy-pasting the Spotify link for a song, album, etc. The songs are downloaded from YouTube, along with album art, lyrics, and other metadata about the songs.
  As soon as your downloads are complete you will be notified!


  **⚠️ Important note on music sourcing from the app developers:**

  Users are responsible for their actions and potential legal consequences.
  We do not support unauthorized downloading of copyrighted material and take no responsibility for user actions.
developer: Henrique Sebastião
dependencies: []
permissions:
  - STORAGE_DOWNLOADS
repo: https://github.com/henriquesebastiao/downtify
port: 8789
releaseNotes: >-
  This major update adds a redesigned Downtify 3 interface with liked songs, an experimental equalizer, and expanded built-in player controls.


  The Library can now repair or refresh existing metadata without redownloading audio, download selected tracks as a ZIP, and save playlist cover artwork alongside generated M3U playlists.


  It also adds optional slskd and Navidrome integrations, improves playlist and artist watch organization, honors selected audio bitrate more reliably, fixes OGG conversion, and backfills track year metadata from resolved albums.


  Full release notes can be found at https://github.com/henriquesebastiao/downtify/releases/tag/3.0.0
support: https://github.com/henriquesebastiao/downtify/issues
website: https://github.com/henriquesebastiao/downtify
gallery:
  - 1.jpg
  - 2.jpg
  - 3.jpg
path: ""
defaultUsername: ""
defaultPassword: ""
submitter: Henrique Sebastião
submission: https://github.com/getumbrel/umbrel-apps/pull/2177
