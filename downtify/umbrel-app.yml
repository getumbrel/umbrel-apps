manifestVersion: 1
id: downtify
storage:
  dataRoot: data
category: media
name: Downtify
version: "3.2.0"
tagline: Download and listen to your music and podcasts with album art and metadata
description: >-
  Downtify turns the music you find on Spotify into a library you own.
  Paste a Spotify link for a song, album, playlist or artist (or a YouTube Music link, a search, or a CSV export from Soundiiz, TuneMyMusic or Exportify), and Downtify downloads it as MP3, FLAC, M4A, OGG or OPUS.
  No Spotify account, Premium subscription or API key is needed.


  Every file comes tagged with title, artist, album, year, cover art and time-synced lyrics.
  Audio is matched on YouTube Music, with YouTube as a fallback, and can optionally come from Soulseek through your own slskd server.
  Wrong song or version? Pick the right one by hand and swap the audio without losing the track's place in your playlists.


  Keep your library growing on its own: Playlist Monitor watches Spotify and YouTube Music playlists and artists, and downloads new tracks and releases on a schedule.
  Songs that leave a live playlist like a Top 50 stay in your library.
  Downtify writes M3U playlists with cover art that Navidrome, Jellyfin and Plex pick up, and can mirror playlists into Navidrome directly.


  Listen right in the browser with the built-in player: synced lyrics, an editable queue, an equalizer, liked songs, podcasts, and Discover, which suggests artists you don't have yet based on your library.
  Library tools repair low-resolution covers, missing lyrics and incomplete tags on music you already have.


  **⚠️ Important note on music sourcing from the app developers:**

  Users are responsible for their actions and potential legal consequences.
  We do not support unauthorized downloading of copyrighted material and take no responsibility for user actions.
developer: Henrique Sebastião
dependencies: []
permissions:
  - STORAGE_DOWNLOADS
repo: https://github.com/henriquesebastiao/downtify
port: 8789
releaseNotes: >-
  This update adds user accounts with a username and password sign-in, admin and regular user roles, and an activity log, so everyone at home can have their own login.
  The default login is admin / downtify, so change the password after signing in.


  It also adds manual replacement of a downloaded song's audio, a Discover page with song previews, artist pages with photo, banner and bio, artist monitoring for new
  releases, and a setting to change the port. Organize by artist/album, playlist covers and artist photos are now on by default for new installs. It also fixes
  single-track downloads missing the album tag, duplicate queue entries, and importing many large playlists at o


  Full release notes can be found at https://github.com/henriquesebastiao/downtify/releases/tag/3.2.0
