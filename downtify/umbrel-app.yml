manifestVersion: 1
id: downtify
storage:
  dataRoot: data
category: media
name: Downtify
version: "3.14.0"
tagline: Download Spotify music with album art and metadata
description: >-
  Downtify allows you to download music by copy-pasting the Spotify link for a song, album, etc. The songs are downloaded from YouTube, along with album art, lyrics, and other metadata about the songs.
  As soon as your downloads are complete you will be notified!


  **⚠️ Important note on music sourcing from the app developers:**

  Users are responsible for their actions and potential legal consequences.
  We do not support unauthorized downloading of copyrighted material and take no responsibility for user actions.
developer: Henrique Sebastião
dependencies: []
permissions:
  - STORAGE_DOWNLOADS
repo: https://github.com/henriquesebastiao/downtify
port: 8789
releaseNotes: >-
  ⚠️ The music library is shared across accounts by default. Admins can now enable per-user libraries or hide songs from listings, but these controls do not prevent access to a file whose address is already known. Do not use them to protect sensitive files.


  This update adds download notifications through Discord, ntfy, Gotify, and webhooks. Playlists can now be downloaded as a single album with their own title and cover art.


  Enjoy a lighter, smoother interface, improved Soulseek searches, and Russian language support. Finished playlist watches no longer download songs again months later, and playlists appear in the library even when M3U files are disabled.


  Full release notes can be found at https://github.com/henriquesebastiao/downtify/releases/tag/3.14.0
support: https://github.com/henriquesebastiao/downtify/issues
website: https://github.com/henriquesebastiao/downtify
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
path: ""
defaultUsername: "admin"
defaultPassword: "downtify"
submitter: Henrique Sebastião
submission: https://github.com/getumbrel/umbrel-apps/pull/2177
