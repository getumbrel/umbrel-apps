manifestVersion: 1
id: satsbook
category: bitcoin
name: Satsbook
version: "2.1.0"
tagline: Bitcoin accounting and tax export for Lightning node operators
description: >-
  Track routing fees, import exchange transactions (Strike, River, Coinbase, Swan),
  and view your full Bitcoin portfolio — all on your own hardware. Satsbook connects
  to your LND node and provides a privacy-first dashboard with fee analytics,
  interactive portfolio breakdown, unified transaction ledger, and transfer tagging.
  Upgrade to Pro for FIFO/LIFO tax export (Form 8949), or Power
  to sync your BTC holdings to Monarch Money. No cloud required.
developer: brewgator
website: https://github.com/satsbook/satsbook
repo: https://github.com/satsbook/satsbook
support: https://github.com/satsbook/satsbook/issues
dependencies:
  - lightning
port: 3017
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
  - 4.webp
  - 5.webp
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  v2.1.0 — Annual report, nav overhaul, and stability fixes.
  New: year-in-review page with monthly routing fee chart, BTC purchase
  totals, and disposal count. Nav reorganized into grouped dropdowns
  (Node, Portfolio, Activity, Tax). Bug fixes: footer consistency,
  tax guide navigation, settings node indicator.
  v2.0.0: paid tiers, portfolio donut chart, unified transaction ledger,
  transfer tagging, 4 exchange imports, watched wallets, Form 8949 export,
  Monarch Money sync.
submitter: brewgator
submission: https://github.com/getumbrel/umbrel-apps/pull/5451
