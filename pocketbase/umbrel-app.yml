releaseNotes: >-
  PocketBase 0.40.3 is a follow-up to the recent 0.40.0 update. If you're updating from a pre-0.40 version and run custom PocketBase applications or chained commands, test them before relying on this update in production.


  This release fixes JSON response status handling when field picking fails or falls back, collection index validation for WHERE expressions with parentheses, geoDistance() edge cases, and self-referenced cascade deletes.


  It also improves JSON field validation compatibility with old jsonv1 data, includes minor admin UI fixes, changes the JSVM $app TypeScript definition to an interface, and bumps golang.org/x dependencies to silence security scanners.


  Full release notes can be found at https://github.com/pocketbase/pocketbase/releases/tag/v0.40.3
