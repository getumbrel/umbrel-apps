releaseNotes: >-
  This update includes OneDev 16.7.3. Upstream did not list fixed issues for this release.


  Important: OneDev lists incompatibilities for REST API review/assignment resources, Git LFS locks, CI/CD command interpreters and post-build issue creation, workspace shell defaults, and some cross-project issue/build references. Review upstream notes before upgrading if you rely on these areas.


  Note: If you're updating from a pre-16.5.0 version, OneDev may regenerate the system GPG signing key when changing the default system signing email. Commits previously signed with the old system key may show as unverified.


  Full release notes can be found at https://github.com/theonedev/onedev/releases/tag/v16.7.3
