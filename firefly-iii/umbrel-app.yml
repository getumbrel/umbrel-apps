  - 3.webp
path: ""
deterministicPassword: false
torOnly: false
releaseNotes: >-
  This update includes security fixes and improvements to accounts, budgets, and transactions.


  - Group accounts and categories, edit account names inline, and change transaction dates with rules.
  - Improve budget calculations and fix incorrect account balances in overview headers.
  - Fix recurring transactions, split-transaction editing, currency transfers, and transaction links.
  - Prevent failed multi-transaction updates from deleting the transaction group.
  - Improve two-factor authentication checks and secure preferences, and expire email-change undo codes.


  Full release notes can be found at https://github.com/firefly-iii/firefly-iii/releases/tag/v6.7.12
submitter: Umbrel
submission: https://github.com/getumbrel/umbrel-apps/pull/378
