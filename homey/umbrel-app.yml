releaseNotes: >-
  This update includes improvements and fixes:
    - Limits Homey's name to 63 characters to prevent local network discovery issues.
    - Fixes missing labels in Flow card dropdowns and incorrect actions in Flows created through the API without card groups.
    - Updates the camera streaming component and improves communication isolation for Python apps.


  Full release notes can be found at https://homey.app/en-us/wiki/homey-shs-changelog/
