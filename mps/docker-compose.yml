services:
  app_proxy:
    environment:
      APP_HOST: mps_web_1
      APP_PORT: 8099
  web:
    image: ghcr.io/matty03072/mps-media-payment-system:v1.0.2@sha256:900a2bfe343291f7534b7fa99f34724794d914a629b48cf8f3036c7e4b6dcbd3
    user: "1000:1000"
    init: true
    restart: on-failure
    environment:
      UMBREL_BOOTSTRAP_PASSWORD: ${APP_PASSWORD}
      PUBLIC_URL: http://${DEVICE_DOMAIN_NAME}:${APP_PROXY_PORT}
    volumes:
      - ${APP_DATA_DIR}/data/state:/state
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  worker:
    image: ghcr.io/matty03072/mps-media-payment-system:v1.0.2@sha256:900a2bfe343291f7534b7fa99f34724794d914a629b48cf8f3036c7e4b6dcbd3
    command: [worker]
    user: "1000:1000"
    init: true
    restart: on-failure
    environment:
      UMBREL_BOOTSTRAP_PASSWORD: ${APP_PASSWORD}
      PUBLIC_URL: http://${DEVICE_DOMAIN_NAME}:${APP_PROXY_PORT}
    volumes:
      - ${APP_DATA_DIR}/data/state:/state
    depends_on:
      web:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
