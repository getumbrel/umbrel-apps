manifestVersion: 1
id: mps
storage:
  dataRoot: data
category: media
name: MPS — Media Payment System
version: "0.1.0-beta.6"
tagline: Manage media memberships and payments
description: >-
  Manage media-server invitations, memberships and optional subscription payments
  from one dashboard. On first launch, unlock setup with username owner and the
  password shown by Umbrel, create your permanent administrator account, then
  enrol an authenticator for two-factor authentication.


  Connect your own Emby servers, Ombi, Sonarr, Radarr and SMTP service. MPS can
  provision linked member accounts, manage library access, track media requests,
  and send account notifications. Optional Stripe and PayPal integrations support
  subscription workflows. Configuration → Branding lets you set your site name
  and upload your own logo for the website and outgoing emails.


  This release is beta software. Integrations require your own servers or provider
  accounts and are not enabled automatically. The default installation is protected
  by Umbrel login. Public member invitations and external payment callbacks require
  a separately configured HTTPS deployment; they do not work as public endpoints
  with the default package. Live payment-provider workflows have not been verified
  for this package.

  Includes ten enabled non-admin members free. Larger installations require a
  GBP 5/month MPS unlock subscription for up to three applications. The licence
  service requires verified email and MFA. Source-available no-resale terms apply;
  operating paid membership services is permitted. Back up before upgrading.

releaseNotes: "Application licensing: ten enabled non-admin members free; GBP 5/month unlock for up to three applications. Back up the entire app data before updating. Installations over ten members need an active unlock to preserve access for all members; data is retained. Includes verified-email/MFA licence accounts, private signed-in support, period-end cancellation and full refunds requested within 14 days of payment. New source-available no-resale terms apply; commercial membership use is allowed. Preserve the existing installation and state. Release notes: https://github.com/matty03072/MPS-Media-Payment-System/releases/tag/v0.1.0-beta.6"

