manifestVersion: 1
id: libre-closet
storage:
  dataRoot: data
category: files
name: Libre Closet
version: "0.6.0"
tagline: Your wardrobe, self-hosted
description: >-
  Libre Closet is a free, open-source wardrobe organizer for your Umbrel. Catalog
  your clothes, upload photos, build outfits on a calendar, and open everything
  from your phone as an installable, offline-ready PWA.


  It installs as a single container with no separate database to run: it defaults
  to SQLite and local file storage, so your wardrobe lives on your own server.


  Organize garments by category, color, season, and custom tags, combine them into
  outfits, record wash and care details, and share a closet with a partner or a
  stylist with view-only or edit access.


  Libre Closet is licensed under AGPL-3.0 and has no ads, tracking, or data
  selling. This package runs behind Umbrel's login by default. Data is stored in
  the app's data folder and included in Umbrel backups.


  Learn more at https://github.com/Lazztech/Libre-Closet
releaseNotes: ""

