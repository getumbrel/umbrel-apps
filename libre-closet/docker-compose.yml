version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: libre-closet_server_1
      APP_PORT: 3000

  server:
    image: docker.io/lazztech/libre-closet:0.6.0@sha256:65d1e30cab596ad2b1c4a163a7c8bde61cc7e39d724e302730f8dfdf3ef955ae
    restart: on-failure
    environment:
      APP_NAME: Libre Closet
      DATA_PATH: /app/data
      AUTH_ENABLED: "false"
      PWA_ENABLED: "true"
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
