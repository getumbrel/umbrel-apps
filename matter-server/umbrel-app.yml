manifestVersion: 1.1
id: matter-server
storage:
  dataRoot: data
name: Matter Server
tagline: A Matter Controller Server over WebSockets
category: automation
version: "1.4.0"
port: 5580
description: >-
  🛜 Matter Server connects Matter devices to Home Assistant and other compatible applications through a WebSocket API. Built on matter.js and maintained by the Open Home Foundation, it supports commissioning, device control, firmware updates, and network diagnostics.


  🏠 The built-in dashboard lets you manage devices and explore Thread and Wi-Fi networks. Home Assistant can connect to the server at ws://umbrel.local:5580/ws; replace umbrel.local with your Umbrel's hostname or IP address if needed. Only allow trusted clients on your local network to access this port.
developer: Open Home Foundation
website: https://www.openhomefoundation.org/
repo: https://github.com/matter-js/matterjs-server
submitter: al-lac
submission: https://github.com/getumbrel/umbrel-apps/pull/1866
support: https://github.com/matter-js/matterjs-server/issues
gallery:
  - 1.jpg
  - 2.jpg
  - 3.jpg
releaseNotes: >-
  Matter Server now runs on the Open Home Foundation's matter.js implementation, replacing the retired Python server. Version numbers now follow the new project, so this update goes from 8.1.2 to 1.4.0.


  ⚠️ Your existing fabric and paired devices are migrated automatically on first start, which may take several minutes; you should not need to re-pair them. Back up your Umbrel before updating, as rolling back requires restoring that backup.


  Key improvements:
    - Enables the Matter network map in Home Assistant 2026.9
    - Adds Thread and Wi-Fi network diagnostics and saved network credential management
    - Improves sleepy-device support, device connections, and firmware updates
    - Lets you upload local OTA firmware files from the dashboard


  Full release notes are available at https://github.com/matter-js/matterjs-server/blob/v1.4.0/CHANGELOG.md
dependencies: []
path: ""
