version: "3.7"

services:
  server:
    image: ghcr.io/matter-js/matterjs-server:1.6.0@sha256:9eb98c839d0b4b07f9230b96ad52de570f7f2a7c286c5992b4c04b6b26c08a3f
    restart: on-failure
    user: "1000:1000"
    environment:
      STORAGE_PATH: /data
      PORT: "5580"
      VENDOR_ID: "65521"
      FABRIC_ID: "1"
      NOBLE_BINDINGS: dbus
    # Required for mDNS to work correctly
    network_mode: host
    # UI at default port 5580
    security_opt:
      # Needed for Bluetooth via dbus
      - apparmor:unconfined
    volumes:
      - ${APP_DATA_DIR}/data:/data/
      # Required for Bluetooth via D-Bus
      - /run/dbus:/run/dbus:ro
