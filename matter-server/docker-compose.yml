version: "3.7"

services:
  server:
    image: ghcr.io/matter-js/matterjs-server:1.5.0@sha256:b051f3f5bcc8df0f582773055d18e68136332135587d7bfc8b6c1bb8eacb75c7
    restart: on-failure
    user: "1000:1000"
    environment:
      STORAGE_PATH: /data
      PORT: "5580"
      VENDOR_ID: "65521"
      FABRIC_ID: "1"
      NOBLE_BINDINGS: dbus
    # Required for mDNS to work correctly
    network_mode: host
    # UI at default port 5580
    security_opt:
      # Needed for Bluetooth via dbus
      - apparmor:unconfined
    volumes:
      - ${APP_DATA_DIR}/data:/data/
      # Required for Bluetooth via D-Bus
      - /run/dbus:/run/dbus:ro
