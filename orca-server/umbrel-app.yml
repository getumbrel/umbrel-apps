manifestVersion: 1
id: orca-server
storage:
  dataRoot: data
category: developer
name: Orca Server
version: "1.4.224"
tagline: Keep your Orca agents, terminals, and worktrees running on your Umbrel
description: >-
  Orca is the ADE for running a fleet of parallel coding agents. This app runs a
  headless Orca server on your Umbrel: projects, worktrees, terminals, and agent
  sessions live here and keep running while your laptop sleeps. Connect from the Orca
  desktop app or from Orca's web client in your browser.


  Open the app to get an access link, then in Orca go to Settings → Remote Orca
  Servers → Add Server and paste it. The page that hands out access links asks for
  this app's password, which umbrelOS shows you.


  Agents run on the Umbrel with the Umbrel's own sign-ins. Install Claude Code, Codex,
  or OpenCode from the app's page, then start one in an Orca terminal to sign in.


  Orca clients connect directly to port 6768. Keep it on your LAN or tailnet; do not
  forward it to the internet.
releaseNotes: ""

developer: Stably AI
website: https://onorca.dev
dependencies: []
repo: https://github.com/yanffernandes/umbrel-orca-server
support: https://github.com/yanffernandes/umbrel-orca-server/issues

port: 6769
gallery: []
path: ""

defaultUsername: ""
deterministicPassword: true

backupIgnore:
  - data/home/.cache/*
  - data/home/.npm/*
  - data/home/.config/orca/orcad-artifacts/*
  - data/home/.config/orca/logs/*

submitter: Yan Fernandes
submission: https://github.com/yanffernandes/umbrel-orca-server
