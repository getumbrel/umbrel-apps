manifestVersion: 1
id: aginxbrowser
category: networking
name: AginxBrowser
version: "0.2.3"
tagline: A browser built for AI agents — fetch, search, screenshot, no Chromium
description: >-
  AginxBrowser is a server-side browser designed for AI agents instead of
  humans with a mouse: one Rust binary with an embedded V8, a stealth HTTP
  stack with real TLS fingerprints, and a CPU-only renderer. No Chromium
  anywhere.


  Agents call it over plain HTTP or MCP: fetch a page with full JS rendering
  (returns markdown or HTML), meta-search across multiple engines, take
  screenshots, download files, or drive stateful interactive sessions with
  login flows and pagination. It auto-solves Cloudflare-style challenges and
  ByteDance WAF proof-of-work pages.


  Note: the browser status page opens in Umbrel above. The API itself listens
  on host port 8189 so agents and MCP clients on your network can reach it
  without Umbrel login cookies — point them at
  http://umbrel.local:8189 (plain HTTP API) or
  http://umbrel.local:8189/mcp (MCP endpoint, e.g.
  `claude mcp add aginxbrowser --transport http http://umbrel.local:8189/mcp`).

developer: yinnho
