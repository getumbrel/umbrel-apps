releaseNotes: >-
  This update improves reliability for slow model responses and Anthropic thinking-block workflows.


  Provider header and streamed chunk timeouts now default to five minutes, with streamed chunk timeouts configurable to be disabled when needed.


  Anthropic thinking block binding can now be opted out of in config and is limited to Claude 5.1+ models so older deployments do not reject requests.


  Timed-out SSE reads now cancel more safely without unhandled errors.


  Full release notes can be found at https://github.com/anomalyco/opencode/releases/tag/v1.18.27
