releaseNotes: >-
  This update fixes Azure authentication so Azure CLI sign-in works without requiring Bun.


  Azure providers can now sign in with Microsoft Entra ID through the Azure CLI instead of requiring an API key.


  Bedrock reasoning responses no longer get cached into unreplayable empty messages, archived sessions disappear from the Home list immediately, and newer V2 config fields keep working in V1 mixed setups.


  Full release notes can be found at https://github.com/anomalyco/opencode/releases/tag/v1.18.25
