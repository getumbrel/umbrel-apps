releaseNotes: >-
  This update adds native OpenAI and Anthropic passthroughs for Cloudflare AI Gateway models and aligns Codex rate limits with ChatGPT subscription limits.


  It also fixes provider and model handling, including Qwen sampling defaults, authenticated providers in /connect, malformed pricing, OpenAI websocket message-size fallback, ChatGPT compute residency forwarding, and web search for the OpenCode Go provider.


  Existing v1 databases remain compatible, and saved desktop server details stay editable.


  Full release notes can be found at https://github.com/anomalyco/opencode/releases/tag/v1.18.19
