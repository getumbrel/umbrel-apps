releaseNotes: >-
  This update improves reliability for Claude, Bedrock, Azure, and tool-call workflows.


  Claude 5 sessions now tolerate stale thinking blocks after prompt or tool changes, and Bedrock reasoning/replay handling is more reliable.


  Azure CLI sign-in now asks for the resource name directly instead of querying Azure management APIs, tool-call timing stays accurate when metadata changes, and apply_patch permission metadata no longer includes empty move paths.


  Full release notes can be found at https://github.com/anomalyco/opencode/releases/tag/v1.18.26
