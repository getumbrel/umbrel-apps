releaseNotes: >-
  This update improves provider compatibility for OpenAI-compatible services, Amazon Bedrock, and Cloudflare AI Gateway, including Anthropic models routed through the gateway.


  Device login links now work when servers return relative verification URLs or use a base path.


  The model picker keeps provider headers visible while scrolling, GitHub auth works with immutable OIDC subject tokens, and session-aware providers no longer receive parent session IDs in request headers.


  Full release notes can be found at https://github.com/anomalyco/opencode/releases/tag/v1.18.23
