releaseNotes: >-
  This update improves the desktop experience with broader translation coverage, early right-to-left layout support, and locale-aware plural rules.


  It also fixes right-to-left layout issues across tabs, drawers, resizing, and titlebar interactions, keeps message rendering more responsive by moving markdown parsing off the main thread, and gives untitled sessions generated fallback names.


  OpenCode's terminal UI now includes pull request numbers and URLs when adding GitHub pull request review context.


  Full release notes can be found at https://github.com/anomalyco/opencode/releases/tag/v1.18.13
