releaseNotes: >-
  This update fixes MCP SSE connections getting stuck in reconnect loops after server errors and improves support for provider model configs that use custom reasoning fields.


  It also improves the desktop UI by opening external links in the system browser, fixing stale session tab state, improving the legacy directory picker, and correcting file tree and debug gutter layout issues.


  Full release notes can be found at https://github.com/anomalyco/opencode/releases/tag/v1.18.11
