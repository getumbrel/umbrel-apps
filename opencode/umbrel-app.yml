releaseNotes: >-
  This update improves reliability for agent and provider workflows, including retrying provider responses that end with network errors and retrying xAI capacity or temporary unavailability stream errors.


  It also fixes subagent failure handling by surfacing failed subagent tool calls with a resumable task ID and allowing permission requests triggered by subagents during opencode run to be answered.


  Cerebras max_completion_tokens are now preserved without applying an extra output cap.


  Full release notes can be found at https://github.com/anomalyco/opencode/releases/tag/v1.18.20
