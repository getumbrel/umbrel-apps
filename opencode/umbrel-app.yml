releaseNotes: >-
  This update improves MCP and provider reliability, including newer MCP/OAuth compatibility, reconnection after expired SDK sessions, configured callback ports, Gemini model request handling, and provider list/status refreshes.


  It also improves project and session workflows, including branch-specific repository caches, project selector scrolling and shortcuts, tab navigation, file opening on Windows, and fixes for freezes in the home and session views.


  Full release notes can be found at https://github.com/anomalyco/opencode/releases/tag/v1.18.8
