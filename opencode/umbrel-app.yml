releaseNotes: >-
  This update simplifies xAI login to a single device-code flow that works better in headless and remote environments.


  It also improves provider reliability by preserving structured mid-stream errors, retrying more transient provider and network failures, and waiting for queued ACP session updates before ending a turn.


  Remote workspace handling now avoids sending host directory paths to the workspace, and host logs include upstream 5xx response bodies to make proxy failures easier to debug.


  Full release notes can be found at https://github.com/anomalyco/opencode/releases/tag/v1.18.14
