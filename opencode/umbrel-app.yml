releaseNotes: >-
  This update fixes agent responses so they continue when a model reports an unknown finish reason instead of stopping early.


  It improves Vertex AI support by routing EU and US multi-region Gemini requests through the correct regional endpoints.


  File search results now stay visible while the next search is loading, and the archive session command is available in both desktop layouts.


  Full release notes can be found at https://github.com/anomalyco/opencode/releases/tag/v1.18.21
