releaseNotes: >-
  ⚠️ If you're updating from a pre-17 version, back up your instance first. Absolute links in repository documents now resolve relative to the repository root; use ./ for links relative to the document's directory. Custom duration settings must include valid units, such as 30s or 5m.


  This security update includes:

  - Fixes for pull request review workflows, repository visibility checks, package token scopes, and project access checks

  - Safer command-line instructions displayed in the web interface

  - More reliable repository mirroring and Forgejo Actions logs

  - Fixes for invalid commit statuses shown in the dashboard


  For users updating from pre-17, action run webhook events are deprecated. Review your receivers before manually switching existing webhooks to workflow run events.


  If you're updating from a pre-16.0 version, existing repositories remain compatible, and admins can optionally follow Forgejo's upgrade guide to clean up old per-repository hook/example files after making a backup.


  If you manually enabled Forgejo reverse proxy authentication on your Umbrel, review Forgejo's trusted-proxy configuration guidance before upgrading.


  Full release notes are available at https://codeberg.org/forgejo/forgejo/releases/tag/v17.0.1
submitter: John Wilddip
