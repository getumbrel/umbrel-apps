releaseNotes: >-
  Forgejo 16.0.2 is a security and bug-fix release. If you're updating from a pre-16.0 version, existing repositories remain compatible, and admins can optionally follow Forgejo's upgrade guide to clean up old per-repository hook/example files after making a backup.


  If you manually enabled Forgejo reverse proxy authentication on your Umbrel, review Forgejo's trusted-proxy configuration guidance before upgrading.


  This point release fixes arbitrary file reads from org-mode rendering, stored XSS in Actions pre-execution warnings/errors, CGNAT private-host matching, stuck Actions runner jobs, reverse-proxy authentication on Git routes, OAuth initialization when disabled, and session middleware state handling.


  Full release notes are available at https://codeberg.org/forgejo/forgejo/releases/tag/v16.0.2
