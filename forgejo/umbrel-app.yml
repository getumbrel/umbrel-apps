releaseNotes: >-
  ⚠️ Back up your instance before upgrading. Absolute links in repository documents now resolve relative to the repository root; use ./ for links relative to the document's directory. Custom duration settings must include valid units, such as 30s or 5m.


  Key highlights:

  - Donation buttons powered by FUNDING.yml

  - Auto-completion for issues and pull requests

  - Improved Git LFS navigation and organization invitations

  - Forgejo Actions job summaries, richer webhooks, and improved workflow APIs

  - Repository migration from Bitbucket Data Center

  - Security, accessibility, and repository reliability improvements


  Action run webhook events are deprecated. Review your receivers before manually switching existing webhooks to workflow run events.


  If you're updating from a pre-16.0 version, existing repositories remain compatible, and admins can optionally follow Forgejo's upgrade guide to clean up old per-repository hook/example files after making a backup.


  If you manually enabled Forgejo reverse proxy authentication on your Umbrel, review Forgejo's trusted-proxy configuration guidance before upgrading.


  Full release notes are available at https://codeberg.org/forgejo/forgejo/releases/tag/v17.0.0
submitter: John Wilddip
