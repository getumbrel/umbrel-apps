manifestVersion: 1.1
id: romm
environment:
  - name: IGDB_CLIENT_ID
    services:
      - server
    note: >-
      IGDB client ID, for game metadata and cover art. IGDB uses Twitch developer credentials: register an application at https://dev.twitch.tv/console and enter its client ID here and its client secret below.
  - name: IGDB_CLIENT_SECRET
    services:
      - server
    note: >-
      IGDB client secret, from the same Twitch application as the client ID above.
  - name: SCREENSCRAPER_USER
    services:
      - server
    note: >-
      Your ScreenScraper username, for metadata, artwork and screenshots. Also enter your ScreenScraper password below.
  - name: SCREENSCRAPER_PASSWORD
    services:
      - server
    note: >-
      Your ScreenScraper password.
  - name: MOBYGAMES_API_KEY
    services:
      - server
    note: >-
      MobyGames API key, for extra metadata, cover art and screenshots. MobyGames API access is a paid feature of your MobyGames account.
  - name: STEAMGRIDDB_API_KEY
    services:
      - server
    note: >-
      SteamGridDB API key, for alternative cover art. Create one in your SteamGridDB account preferences.
  - name: RETROACHIEVEMENTS_API_KEY
    services:
      - server
    note: >-
      RetroAchievements Web API key, for achievement data. Find it in your RetroAchievements account settings. Each RomM user then adds their own RetroAchievements username in their RomM profile.
category: media
name: RomM
version: "5.4.1-patch.1"
tagline: A beautiful, powerful, self-hosted rom manager
description: >-
  👾 RomM (ROM Manager) allows you to scan, enrich, browse and play your game collection with a clean and responsive interface.


  🎮 With support for multiple platforms, various naming schemes, and custom tags, RomM is a must-have for anyone who plays on emulators.


  **Features**
    - Scans your existing games library and enhances it with metadata from IGDB and MobyGames
    - Supports a large number of platforms
    - Play games directly from the browser using EmulatorJS and RuffleRS
    - Share your library with friends while limiting access and permissions
    - Supports MAME, Nintendo Switch, and Sony Playstation naming schemes
    - Detects and groups multifile games (e.g. PS1 games with multiple CDs)
    - Can parse tags in filenames (e.g. (E), (USA), (rev v1), etc.)
    - View, upload, update, and delete games from any modern web browser
developer: rommapp
website: https://github.com/rommapp/romm
repo: https://github.com/rommapp/romm
support: https://github.com/rommapp/romm/issues
port: 4002
submitter: Mateo Silguero
submission: https://github.com/getumbrel/umbrel-apps/pull/2020
gallery:
  - 1.jpg
  - 2.jpg
  - 3.jpg
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  This update lets you add metadata provider credentials, such as IGDB, ScreenScraper, SteamGridDB and RetroAchievements, in RomM's app settings on umbrelOS 2.0, so RomM can fetch game metadata, artwork and achievements.


  Previous RomM 5.4.1 release notes:


  RomM 5.4 includes database migrations that may take 15-20 minutes on large libraries. Do not restart RomM while the first start after upgrading is still migrating.


  This security update distrusts compromised eMudhra certificate intermediates and updates dependencies with security fixes. Upstream recommends upgrading promptly.


  If you're updating from a pre-4.9 version and manually enabled gamelist exports in config.yml, follow RomM's official config docs to update that setting: https://docs.romm.app/4.9.0/reference/configuration-file/#scangamelistexport


  Full release notes can be found at https://github.com/rommapp/romm/releases/tag/5.4.1
