releaseNotes: >-
  RomM 5.3 replaces the old library folder settings with structure rules. This update migrates both previously supported library layouts and saved folder settings automatically, preserving other settings and backing up the original config. If you've customized emulator streaming, review RomM's 5.3 migration notes before upgrading.


  Highlights include:
    - Added custom library structure rules with content-hashed ROM identity, so files can move while preserving saves, favorites, play history, and collections
    - Reworked emulator streaming with per-container configuration, save-state sync, multi-disc support, and session management
    - Added physical-game entries, barcode lookup support, walkthrough documents, and more metadata providers
    - Improved metadata caching, gallery performance, ROM matching, and security handling for generated ZIP manifests
    - Includes 5.3.1 security fixes for account sessions, access checks, and container packages, plus fixes for folder mappings and emulator streaming


  If you're updating from a pre-4.9 version and manually enabled gamelist exports in config.yml, follow RomM's official config docs to update that setting: https://docs.romm.app/4.9.0/reference/configuration-file/#scangamelistexport


  Full release notes can be found at https://github.com/rommapp/romm/releases/tag/5.3.1
