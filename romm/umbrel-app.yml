defaultPassword: ""
releaseNotes: >-
  RomM 5.1 is a follow-up to the recent RomM 5.0 major update. If you're updating from a pre-5.0 version and share your library with other users, review permissions after upgrading.


  Highlights include:
    - Added early emulator streaming support for server-side emulator containers
    - Added a scan settings UI, per-field artwork priority overrides, and manual cover search filters
    - Added support for self-hosted Playmatch instances, range requests for multi-file ROM downloads, scheduled resource cleanup, music favorites/playlists APIs, and more library/player controls
    - Improved asset caching, scanning, gallery/media handling, EmulatorJS player behavior, permissions enforcement, uploads, archives, metadata matching, and database migration reruns


  If you serve RomM through an external caching proxy, purge that proxy cache after upgrading to avoid stale UI bundles.


  If you're updating from a pre-4.9 version and manually enabled gamelist exports in config.yml, follow RomM's official config docs to update that setting: https://docs.romm.app/4.9.0/reference/configuration-file/#scangamelistexport


  Full release notes can be found at https://github.com/rommapp/romm/releases/tag/5.1.0
