manifestVersion: 1
version: "2.1.4"
id: bassin
name: Bassin
tagline: Solo Bitcoin Mining Pool (ckPool)
description: >-
  A zero-fee Bitcoin solo mining pool for Umbrel. Run your own ckPool at home.


  No setup, no hassle.
    - Make sure your Bitcoin Node is fully synchronized and running
    - Install the app, then follow the on-screen instructions
    - Be part of decentralized mining


  Check out the FAQ page: https://github.com/blockdyor/bassin/wiki/FAQ


  For academic and research purposes only.
category: bitcoin
dependencies:
  - bitcoin
releaseNotes: >-
  Sanitize user directory parsing against path traversal and autoindex
  parent links. Add safe localStorage parsing to prevent UI crashes from
  corrupted browser storage. Update build dependencies to resolve all
  audit vulnerabilities. Update footer repository link to point to
  blockdyor/bassin with safe new-tab attributes. This update does not
  change the underlying ckpool service.
port: 5008
submitter: duckaxe
developer: blockdyor
website: https://github.com/blockdyor
repo: https://github.com/blockdyor/bassin
support: https://github.com/blockdyor/bassin/issues
submission: https://github.com/getumbrel/umbrel-apps/pull/3375
gallery:
  - 1.jpg
  - 2.jpg
  - 3.jpg
path: ""
defaultUsername: ""
defaultPassword: ""
widgets:
  - id: "stats"
    type: "four-stats"
    refresh: "30s"
    endpoint: "widget-server:3000/widgets/pool"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "Hashrate"
          text: "2.10"
          subtext: "Th/s"
        - title: "Workers"
          text: "2"
        - title: "Best Share"
          text: "21"
          subtext: "G"
        - title: "Total Shares"
          text: "210"
          subtext: "M"
