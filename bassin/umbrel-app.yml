manifestVersion: 1
version: "2.1.20"
id: bassin
name: Bassin
tagline: Solo Bitcoin Mining Pool (ckPool)
description: >-
  A zero-fee Bitcoin solo mining pool for Umbrel. Run your own ckPool at home.


  No setup, no hassle.
    - Make sure your Bitcoin Node is fully synchronized and running
    - Install the app, then open Connect for Stratum V1 (port 3456) details
    - Optional Noise-encrypted Stratum V2 (port 3457) and Job Declaration (port 3458, with Bitcoin Core's IPC Mining Interface) can be enabled from Settings → Stratum V2
    - Be part of decentralized mining


  Check out the FAQ page: https://github.com/blockdyor/bassin/wiki/FAQ


  For academic and research purposes only.
category: bitcoin
dependencies:
  - bitcoin
releaseNotes: >-
  Bassin's mining engine (CKPool) is now maintained by blockdyor, Bassin's developer, who has taken over its upkeep from the Umbrel team. Your pool settings and payout address carry over unchanged.


  This update brings the redesigned Bassin interface, Stratum V2, and safer Settings while mining.


  - Optional Noise-encrypted Stratum V2 (port 3457) and Job Declaration (port 3458) can be enabled anytime in Settings → Stratum V2 (Stratum V1 remains active by default on port 3456)
  - Support for Bitcoin Core's mining interface (IPC) when enabled in Bitcoin Node, with automatic fallback to RPC and ZMQ (works with both Bitcoin Core and Bitcoin Knots)
  - Settings now requires your Bassin app password and uses Save and Save & Restart Pool, so the pool only restarts when you choose
  - New Worker Best Diff Leaderboard and Hashrate Averages widgets
  - Lower memory use


  Full changelog: https://github.com/blockdyor/bassin/blob/main/docs/whats-new.md
port: 5008
submitter: duckaxe
developer: blockdyor
website: https://github.com/blockdyor
repo: https://github.com/blockdyor/bassin
support: https://github.com/blockdyor/bassin/issues
submission: https://github.com/getumbrel/umbrel-apps/pull/3375
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
path: ""
defaultUsername: ""
deterministicPassword: true
