manifestVersion: 1
version: "2.1.9"
id: bassin
name: Bassin
tagline: Solo Bitcoin Mining Pool (ckPool)
description: >-
  A zero-fee Bitcoin solo mining pool for Umbrel. Run your own ckPool at home.


  No setup, no hassle.
    - Make sure your Bitcoin Node is fully synchronized and running
    - Install the app, then follow the on-screen instructions
    - Be part of decentralized mining


  Check out the FAQ page: https://github.com/blockdyor/bassin/wiki/FAQ


  For academic and research purposes only.
category: bitcoin
dependencies:
  - bitcoin
releaseNotes: >-
  Bassin has a new interface adapted from Umbrel's Bitcoin app, with familiar navigation
  and controls in Bassin's water-inspired colors.


  Explore pool and worker insights, round and all-time best shares, hashrate history,
  and searchable logs. All dashboard timestamps use UTC, with a live clock in Insights.


  Settings now includes mining, Bitcoin RPC, and ZMQ notification options through a
  configuration import/export editor. Configuration changes must still be applied manually.
  Connect includes Stratum details, a QR code, and clearer worker and zero-fee reward instructions.


  This update also upgrades CKPool to 1.2.0 using the Bassin maintainer's multi-architecture
  image, detects the running CKPool version automatically, and improves mobile graphics
  stability and small-screen layouts. Existing mining configuration and pool data are preserved.


  Full details: https://github.com/blockdyor/bassin-ui/blob/99b6772/README.md
port: 5008
submitter: duckaxe
developer: blockdyor
website: https://github.com/blockdyor
repo: https://github.com/blockdyor/bassin
support: https://github.com/blockdyor/bassin/issues
submission: https://github.com/getumbrel/umbrel-apps/pull/3375
gallery:
  - 1.jpg
  - 2.jpg
  - 3.jpg
path: ""
defaultUsername: ""
defaultPassword: ""
