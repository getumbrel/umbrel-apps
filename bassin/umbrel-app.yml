manifestVersion: 1
version: "2.1.17"
id: bassin
name: Bassin
tagline: Solo Bitcoin Mining Pool (ckPool)
description: >-
  A zero-fee Bitcoin solo mining pool for Umbrel. Run your own ckPool at home.


  No setup, no hassle.
    - Make sure your Bitcoin Node is fully synchronized and running
    - Install the app, then follow the on-screen instructions
    - Be part of decentralized mining


  Check out the FAQ page: https://github.com/blockdyor/bassin/wiki/FAQ


  For academic and research purposes only.
category: bitcoin
dependencies:
  - bitcoin
releaseNotes: >-
  Bassin 2.1.17 adds native Bitcoin Core v32+ IPC mining support, hardens the
  Config API for safe use with active miners/rentals, reduces RAM across the
  stack (2 app containers: ckpool + ui), and adds built-in Worker Best Diff
  Leaderboard and Hashrate Averages widgets!


  - Bitcoin Core IPC mining: mounts ${APP_BITCOIN_DATA_DIR}:/bitcoin:ro read-only
    on ckpool (never on ui), sets ipcmining to /bitcoin/${APP_BITCOIN_IPC_SOCKET_RELATIVE_PATH:-node.sock}
    on fresh installs with RPC + ZMQ fallback intact, and waits up to 30s at startup
    only when APP_BITCOIN_IPC_ENABLED=true (zero delay on Bitcoin Knots or non-IPC).
  - Hardened Config API: requires a per-app Bearer token (BASSIN_CONFIG_TOKEN via
    deterministicPassword) on GET/PUT /api/config inside Umbrel's Docker network,
    enforces a strict key allowlist blocking donation, btcaddress, logdir, proxy,
    and redirecturl, and confines SV2/IPC paths to /sv2/ and /bitcoin/.
  - Rental-safe Settings: explicit Save (no restart) and Save & Restart Pool
    (confirms active workers and triggers gated .reload-trigger). Umbrel's built-in
    proxy authentication protects the external dashboard.
  - Low RAM & 3 built-in widgets: drops separate www and widget-server containers,
    caps ckpool glibc arenas (MALLOC_ARENA_MAX=2), uses 256 KiB Python stacks and
    lazy-loaded UI chunks, and serves Pool Overview, Worker Best Diff Leaderboard,
    and Hashrate Averages directly from ui:8080.
  - CKPool v1.2.0-2 (upstream be3e1e07) with Noise-encrypted Stratum V2 (ports
    3457/3458 alongside 3456) and full compatibility with Bitcoin Core and Bitcoin Knots.


  Full details: https://github.com/blockdyor/bassin-ui/blob/14967e5ae09b0513567f3ba384b471fa3bcfd239/README.md
port: 5008
submitter: duckaxe
developer: blockdyor
website: https://github.com/blockdyor
repo: https://github.com/blockdyor/bassin
support: https://github.com/blockdyor/bassin/issues
submission: https://github.com/getumbrel/umbrel-apps/pull/3375
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
path: ""
defaultUsername: ""
deterministicPassword: true
widgets:
  - id: "stats"
    type: "four-stats"
    refresh: "30s"
    endpoint: "ui:8080/widgets/pool"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "Hashrate"
          text: "2.10"
          subtext: "Th/s"
        - title: "Workers"
          text: "2"
        - title: "Best Share"
          text: "21"
          subtext: "G"
        - title: "Total Shares"
          text: "210"
          subtext: "M"
  - id: "workers-leaderboard"
    type: "list"
    refresh: "30s"
    endpoint: "ui:8080/widgets/workers"
    link: ""
    example:
      type: "list"
      link: ""
      items:
        - text: "#1 nerdqaxe"
          subtext: "Best ever: 2.5T · 4.80 Th/s"
        - text: "#2 bitaxe-gamma"
          subtext: "Best ever: 147M · 1.20 Th/s"
        - text: "#3 bitaxe-ultra"
          subtext: "Best ever: 17.4M · 555 Gh/s"
  - id: "hashrate"
    type: "four-stats"
    refresh: "30s"
    endpoint: "ui:8080/widgets/hashrate"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "1m Avg"
          text: "2.15"
          subtext: "Th/s"
        - title: "5m Avg"
          text: "2.10"
          subtext: "Th/s"
        - title: "1h Avg"
          text: "2.05"
          subtext: "Th/s"
        - title: "24h Avg"
          text: "1.98"
          subtext: "Th/s"
