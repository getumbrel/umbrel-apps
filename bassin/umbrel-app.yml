manifestVersion: 1
version: "2.1.15"
id: bassin
name: Bassin
tagline: Solo Bitcoin Mining Pool (ckPool)
description: >-
  A zero-fee Bitcoin solo mining pool for Umbrel. Run your own ckPool at home.


  No setup, no hassle.
    - Make sure your Bitcoin Node is fully synchronized and running
    - Install the app, then follow the on-screen instructions
    - Be part of decentralized mining


  Check out the FAQ page: https://github.com/blockdyor/bassin/wiki/FAQ


  For academic and research purposes only.
category: bitcoin
dependencies:
  - bitcoin
releaseNotes: >-
  Bassin 2.1.15 introduces live auto-saving Settings and automatic CKPool reloads!
  Settings loads your running ckpool.conf automatically — toggle Stratum V2 on or
  adjust any mining or Bitcoin node option and valid changes save atomically (0600)
  and reload CKPool within seconds, with no manual export or restart required.
  Stored Bitcoin RPC passwords stay redacted on the server and are preserved
  automatically on save, while Umbrel's built-in proxy authentication protects the
  dashboard and live configuration API.


  Adds Noise-encrypted Stratum V2 support and updates CKPool to upstream revision
  be3e1e07 (docker-ckpool-solo v1.2.0-2) with 90 upstream fixes including
  multi-node block submission retries, workbase-matched network difficulty checks,
  escaped RPC address validation, startup hashrate decay fixes, and optional
  Mining IPC support. Standard JSON-RPC + ZMQ remains the default so both Bitcoin
  Core and Bitcoin Knots (including 29.3 and earlier versions) work out of the box.


  Bassin UI adds a Connect → Stratum V2 tab with QR code and auto-detected
  Base58Check authority public key (private keys stay isolated in data/sv2/, never
  mounted in the UI container), Stratum V2 & Job Declaration telemetry in Insights,
  a dedicated Settings → Stratum V2 tab, and full CKPool configuration controls
  across Mining, Bitcoin Node, and Advanced. Exposes host ports 3457 (SV2 Mining)
  and 3458 (SV2 Job Declaration) alongside 3456 (SV1).


  Also includes UI reliability, performance, and security fixes: CKPool
  scientific-notation hashrates (such as 1e+03G near 1 TH/s), empty log HTTP 416
  handling, single-file worker read resilience, elimination of 1-second Home/Globe
  re-renders, dark toast styling, and 0 npm dependency vulnerabilities.


  Interrupted first-time setup can now retry without leaving a partial CKPool configuration.
  Existing configurations are not regenerated.


  Bassin has a new interface adapted from Umbrel's Bitcoin app, with familiar navigation
  and controls in Bassin's water-inspired colors. Explore pool and worker insights,
  round and all-time best shares, hashrate history, animated water-column hashrate
  averages, UTC timestamps throughout, and searchable logs.


  The map's location helper requires HTTPS for public Bitcoin RPC endpoints.
  Private and loopback connections continue to use HTTP.


  Full details: https://github.com/blockdyor/bassin-ui/blob/292838b1de742b8f1278548278fa87fd9d7a3ad0/README.md
