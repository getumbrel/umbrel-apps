manifestVersion: 1
version: "2.1.4"
id: bassin
name: Bassin
tagline: Solo Bitcoin Mining Pool (ckPool)
description: >-
  A zero-fee Bitcoin solo mining pool for Umbrel. Run your own ckPool at home.


  No setup, no hassle.
    - Make sure your Bitcoin Node is fully synchronized and running
    - Install the app, then follow the on-screen instructions
    - Be part of decentralized mining


  Check out the FAQ page: https://github.com/blockdyor/bassin/wiki/FAQ


  For academic and research purposes only.
category: bitcoin
dependencies:
  - bitcoin
releaseNotes: >-
  This update improves the reliability of the Bassin UI.


  Improvements:
    - Prevent UI crashes caused by corrupted browser storage
    - Ignore invalid, duplicate, and parent directory links when loading user data
    - Update the footer link to the current Bassin repository and open it in a new tab


  The underlying ckpool service is unchanged.
port: 5008
submitter: duckaxe
developer: blockdyor
website: https://github.com/blockdyor
repo: https://github.com/blockdyor/bassin
support: https://github.com/blockdyor/bassin/issues
submission: https://github.com/getumbrel/umbrel-apps/pull/3375
gallery:
  - 1.jpg
  - 2.jpg
  - 3.jpg
path: ""
defaultUsername: ""
defaultPassword: ""
widgets:
  - id: "stats"
    type: "four-stats"
    refresh: "30s"
    endpoint: "widget-server:3000/widgets/pool"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "Hashrate"
          text: "2.10"
          subtext: "Th/s"
        - title: "Workers"
          text: "2"
        - title: "Best Share"
          text: "21"
          subtext: "G"
        - title: "Total Shares"
          text: "210"
          subtext: "M"
