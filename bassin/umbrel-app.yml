manifestVersion: 1
version: "2.1.14"
id: bassin
name: Bassin
tagline: Solo Bitcoin Mining Pool (ckPool)
description: >-
  A zero-fee Bitcoin solo mining pool for Umbrel. Run your own ckPool at home.


  No setup, no hassle.
    - Make sure your Bitcoin Node is fully synchronized and running
    - Install the app, then follow the on-screen instructions
    - Be part of decentralized mining


  Check out the FAQ page: https://github.com/blockdyor/bassin/wiki/FAQ


  For academic and research purposes only.
category: bitcoin
dependencies:
  - bitcoin
releaseNotes: >-
  Adds Noise-encrypted Stratum V2 support and updates CKPool to upstream revision
  be3e1e07 (docker-ckpool-solo v1.2.0-2) with 90 upstream fixes including
  multi-node block submission retries, workbase-matched network difficulty checks,
  escaped RPC address validation, startup hashrate decay fixes, and optional
  Mining IPC support. Standard JSON-RPC + ZMQ remains the default so Bitcoin Knots
  29.3 and all Bitcoin Core versions continue working out of the box.


  Bassin UI 2.1.14 adds a Connect → Stratum V2 tab with QR code and auto-detected
  Base58Check authority public key (private keys stay in the private /sv2 mount),
  Stratum V2 & Job Declaration telemetry in Insights, a dedicated Settings → Stratum V2
  tab, and full CKPool configuration controls across Mining, Bitcoin Node, and Advanced.
  Exposes host ports 3457 (SV2 Mining) and 3458 (SV2 Job Declaration) alongside 3456 (SV1).


  Also includes UI 2.1.13 reliability, performance, and security fixes: CKPool
  scientific-notation hashrates (such as 1e+03G near 1 TH/s), empty log HTTP 416
  handling, single-file worker read resilience, elimination of 1-second Home/Globe
  re-renders, dark toast styling, and 0 npm dependency vulnerabilities.


  Interrupted first-time setup can now retry without leaving a partial CKPool configuration.
  Existing configurations are not regenerated.


  Bassin has a new interface adapted from Umbrel's Bitcoin app, with familiar navigation
  and controls in Bassin's water-inspired colors.


  Explore pool and worker insights, round and all-time best shares, hashrate history,
  and searchable logs. All dashboard timestamps use UTC, with a live clock in Insights.


  Compare hashrate averages with animated water columns on a shared scale. Gentle waves
  and cursor interaction replace the decorative blocks, with all five averages visible on mobile.


  Bitcoin Node settings now provides clearer RPC labels, an independent Poll for new blocks
  control, a grouped polling interval, and improved ZMQ endpoint validation and guidance.


  Settings includes mining, Stratum V2, Bitcoin RPC, ZMQ notification, and advanced CKPool
  options through a configuration import/export editor. Configuration changes must still be
  applied manually. Connect includes Stratum V1, Stratum V2, QR codes, and clearer worker
  and zero-fee reward instructions.


  This update also upgrades CKPool using the Bassin maintainer's multi-architecture
  image, detects the running CKPool version automatically, and improves mobile graphics
  stability and small-screen layouts. The update uses the same configuration and pool data directories.


  The map's location helper now requires HTTPS for public Bitcoin RPC endpoints.
  Private and loopback connections can still use HTTP. This does not change how CKPool connects.


  Full details: https://github.com/blockdyor/bassin-ui/blob/fcfcac3856a65b2b83426e20e4ee718fb72eb4ec/README.md
