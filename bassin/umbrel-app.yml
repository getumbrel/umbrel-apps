manifestVersion: 1.1
version: "2.1.1"
id: bassin
name: Bassin
tagline: Solo Bitcoin Mining Pool (ckPool)
description: >-
  Run your own zero-fee Bitcoin solo mining pool at home with Bassin, powered
  by ckPool.


  Getting started:
    - Make sure your Bitcoin node is fully synchronized and running
    - Install Bassin and follow the on-screen instructions
    - Connect your miners and help make Bitcoin mining more decentralized

  For more information, check out the FAQ:
  https://github.com/duckaxe/bassin/wiki/FAQ


  For academic and research purposes only.
category: bitcoin
dependencies:
  - bitcoin
releaseNotes: >-
  Updates Bassin's mining backend to ckpool v1.1.1 and moves it to the
  actively maintained ckpool codebase.


  **What's changed:**
    - Improved pool performance and share processing.
    - Better difficulty adjustment for bursty and higher-hashrate miners.
    - Added compatibility for upcoming Bitcoin consensus changes, along with
      stability and miner-protocol fixes.
port: 5008
submitter: duckaxe
developer: duckaxe
website: https://github.com/duckaxe
repo: https://github.com/duckaxe/bassin
support: https://github.com/duckaxe/bassin/issues
submission: https://github.com/getumbrel/umbrel-apps/pull/3375
gallery:
  - 1.jpg
  - 2.jpg
  - 3.jpg
path: ""
defaultUsername: ""
defaultPassword: ""
widgets:
  - id: "stats"
    type: "four-stats"
    refresh: "30s"
    endpoint: "widget-server:3000/widgets/pool"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "Hashrate"
          text: "2.10"
          subtext: "Th/s"
        - title: "Workers"
          text: "2"
        - title: "Best Share"
          text: "21"
          subtext: "G"
        - title: "Total Shares"
          text: "210"
          subtext: "M"
