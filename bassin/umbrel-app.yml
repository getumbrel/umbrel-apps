          subtext: "Th/s"
        - title: "Workers"
          text: "2"
        - title: "Best Share"
          text: "21"
          subtext: "G"
        - title: "Total Shares"
          text: "210"
          subtext: "M"
  - id: "workers-leaderboard"
    type: "list"
    refresh: "30s"
    endpoint: "ui:8080/widgets/workers"
    link: ""
