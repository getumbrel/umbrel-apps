version: '3.7'

services:
  app_proxy:
    environment:
      APP_HOST: bassin_www_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  init:
    image: alpine:3.22.1@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
    entrypoint: >-
      /bin/sh -c '
        apk add --no-cache envsubst &&
        envsubst < /config/ckpool.conf.template > /config/ckpool.conf &&
        chown 1000:1000 /config/ckpool.conf
      '
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
    environment:
      - APP_BITCOIN_NODE_IP=${APP_BITCOIN_NODE_IP}
      - APP_BITCOIN_RPC_PORT=${APP_BITCOIN_RPC_PORT}
      - APP_BITCOIN_RPC_USER=${APP_BITCOIN_RPC_USER}
      - APP_BITCOIN_RPC_PASS=${APP_BITCOIN_RPC_PASS}
      - APP_BITCOIN_ZMQ_HASHBLOCK_PORT=${APP_BITCOIN_ZMQ_HASHBLOCK_PORT}

  ckpool:
    image: ghcr.io/blockdyor/docker-ckpool-solo:v1.1.1@sha256:faf0c1a21017915949e946141bad38aee9bfdcfffe0fc3952b2f8fb283965b1e
    entrypoint: /bin/sh -c './bin/ckpool -k -B -c /config/ckpool.conf'
    user: "1000:1000"
    depends_on:
      init:
        condition: service_completed_successfully
    restart: on-failure
    stop_grace_period: 30s
    ports:
      - "3456:3333/tcp"
    volumes:
      - ${APP_DATA_DIR}/data/config:/config:ro
      - ${APP_DATA_DIR}/data/www:/www

  ui:
    image: ghcr.io/blockdyor/bassin-ui:84f3c40@sha256:861c1a4d96a143aeca2e8a5a09e5248a076e68a490a9a28f036daa72eb715d03
    entrypoint: /bin/sh -c "cp -r /ui/* /www/"
    user: "1000:1000"
    volumes:
      - ${APP_DATA_DIR}/data/www:/www
    restart: on-failure

  www:
    image: halverneus/static-file-server:v1.8.11@sha256:2e91ce7ffb8519eeb882ba52d75c191ca6c921c16438447362128ef73ee2ea7e
    user: "1000:1000"
    environment:
      - FOLDER=/www
      - PORT=80
    volumes:
      - ${APP_DATA_DIR}/data/www:/www:ro
    depends_on:
      - ui
    restart: on-failure
    container_name: bassin_www_1

  widget-server:
    image: ghcr.io/blockdyor/umbrel-bassin-widget:main@sha256:0f2b9d16a709aecc09b6b1901e037587738a9706f633cdf824b298129f6b994b
    environment:
      - BASSIN_API_POOL_URL=http://bassin_www_1/pool/pool.status
    depends_on:
      - www
    restart: on-failure
