version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: bassin_ui_1
      APP_PORT: 8080

  init:
    image: alpine:3.22.1@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mkdir -p /sv2
        chmod 700 /sv2
        chown 1000:1000 /config /sv2
        if [ -f /config/ckpool.conf ]; then
          chown 1000:1000 /config/ckpool.conf
          exit 0
        fi
        apk add --no-cache envsubst
        tmp=$$(mktemp /config/.ckpool.conf.XXXXXX)
        trap 'rm -f "$$tmp"' EXIT
        envsubst < /config/ckpool.conf.template > "$$tmp"
        chown 1000:1000 "$$tmp"
        chmod 600 "$$tmp"
        ln -T "$$tmp" /config/ckpool.conf
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${APP_DATA_DIR}/data/sv2:/sv2
    environment:
      - APP_BITCOIN_NODE_IP=${APP_BITCOIN_NODE_IP}
      - APP_BITCOIN_RPC_PORT=${APP_BITCOIN_RPC_PORT}
      - APP_BITCOIN_RPC_USER=${APP_BITCOIN_RPC_USER}
      - APP_BITCOIN_RPC_PASS=${APP_BITCOIN_RPC_PASS}
      - APP_BITCOIN_ZMQ_HASHBLOCK_PORT=${APP_BITCOIN_ZMQ_HASHBLOCK_PORT}
      - APP_BITCOIN_IPC_SOCKET_RELATIVE_PATH=${APP_BITCOIN_IPC_SOCKET_RELATIVE_PATH:-node.sock}

  ckpool:
    image: ghcr.io/blockdyor/docker-ckpool-solo:v1.2.0-2@sha256:9a17c69583798c0ea4d79f754e7bb4298ee3dfe848a1bd5f2136ad2adf0d98b4
    # Keep the startup supervisor in Compose so existing installs receive it on update.
    entrypoint:
      - /bin/sh
      - -c
      - |
        # Export the compiled CKPool version, optionally wait briefly for Bitcoin Core IPC,
        # and supervise CKPool so it reloads ONLY when an explicit reload trigger is written.
        set -u
        binary=$${CKPOOL_BINARY:-/app/bin/ckpool}
        output=$${CKPOOL_VERSION_FILE:-/www/pool/version.json}
        poll_seconds=$${CKPOOL_RELOAD_INTERVAL:-2}
        ipc_wait_max=$${CKPOOL_IPC_WAIT_SECONDS:-30}
        version=$$(LC_ALL=C grep -aoE 'ckpool/[0-9]+(\.[0-9]+){1,3}([+-][0-9A-Za-z.-]+)?' "$$binary" 2>/dev/null | head -n 1)
        version=$${version#ckpool/}

        # Publish null if the binary no longer provides this identifier; never retain an old version.
        metadata=null
        if [ -n "$$version" ] && [ "$${#version}" -le 64 ]; then
            metadata=$$(printf '{"software":"ckpool","version":"%s"}' "$$version")
        fi
        if mkdir -p "$$(dirname "$$output")" && temporary=$$(mktemp "$${output}.XXXXXX"); then
            if printf '%s\n' "$$metadata" > "$$temporary" && chmod 644 "$$temporary"; then
                mv -f "$$temporary" "$$output" || rm -f "$$temporary"
            else
                rm -f "$$temporary"
            fi
        fi

        config_file=""
        prev=""
        for arg in "$$@"; do
            if [ "$$prev" = "-c" ] || [ "$$prev" = "--config" ]; then
                config_file=$$arg
                break
            fi
            prev=$$arg
        done

        if [ -z "$$config_file" ] || [ ! -f "$$config_file" ]; then
            exec "$$binary" "$$@"
        fi

        reload_file=$${CKPOOL_RELOAD_FILE:-$$(dirname "$$config_file")/.reload-trigger}
        reload_token() {
            cat "$$reload_file" 2>/dev/null || true
        }

        stop_requested=0
        child_pid=""
        sleep_pid=""
        on_stop() {
            stop_requested=1
            if [ -n "$$sleep_pid" ]; then
                kill -TERM "$$sleep_pid" 2>/dev/null || true
            fi
            if [ -n "$$child_pid" ]; then
                kill -TERM "$$child_pid" 2>/dev/null || true
            fi
        }
        trap on_stop TERM INT

        ipc_sock=$${CKPOOL_IPC_SOCKET:-/bitcoin/$${APP_BITCOIN_IPC_SOCKET_RELATIVE_PATH:-node.sock}}
        if [ "$${APP_BITCOIN_IPC_ENABLED:-false}" = "true" ]; then
            waited=0
            while [ ! -S "$$ipc_sock" ] && [ "$$waited" -lt "$$ipc_wait_max" ] && [ "$$stop_requested" -eq 0 ]; do
                sleep 1 &
                sleep_pid=$$!
                wait "$$sleep_pid" 2>/dev/null || true
                sleep_pid=""
                waited=$$((waited + 1))
            done
            if [ "$$stop_requested" -eq 1 ]; then
                exit 0
            fi
        fi

        while true; do
            current_token=$$(reload_token)
            "$$binary" "$$@" &
            child_pid=$$!
            reload=0
            while kill -0 "$$child_pid" 2>/dev/null; do
                sleep "$$poll_seconds" &
                sleep_pid=$$!
                wait "$$sleep_pid" 2>/dev/null || true
                sleep_pid=""
                if [ "$$stop_requested" -eq 1 ]; then
                    break
                fi
                next_token=$$(reload_token)
                if [ -n "$$next_token" ] && [ "$$next_token" != "$$current_token" ]; then
                    reload=1
                    kill -TERM "$$child_pid" 2>/dev/null || true
                    break
                fi
            done
            wait "$$child_pid" 2>/dev/null
            status=$$?
            if [ "$$stop_requested" -eq 1 ]; then
                wait "$$child_pid" 2>/dev/null || true
                exit 0
            fi
            child_pid=""
            if [ "$$reload" -eq 1 ]; then
                continue
            fi
            exit "$$status"
        done
      - bassin-ckpool
    command: ["-k", "-B", "-c", "/config/ckpool.conf"]
    user: "1000:1000"
    environment:
      - MALLOC_ARENA_MAX=2
      - APP_BITCOIN_IPC_ENABLED=${APP_BITCOIN_IPC_ENABLED:-false}
      - APP_BITCOIN_IPC_SOCKET_RELATIVE_PATH=${APP_BITCOIN_IPC_SOCKET_RELATIVE_PATH:-node.sock}
    depends_on:
      init:
        condition: service_completed_successfully
    restart: on-failure
    stop_grace_period: 30s
    ports:
      - "3456:3333/tcp"
      - "3457:3336/tcp"
      - "3458:3337/tcp"
    volumes:
      - ${APP_BITCOIN_DATA_DIR}:/bitcoin:ro
      - ${APP_DATA_DIR}/data/config:/config:ro
      - ${APP_DATA_DIR}/data/sv2:/sv2
      - ${APP_DATA_DIR}/data/www:/www

  ui:
    image: ghcr.io/blockdyor/bassin-ui:14967e5@sha256:4060d833acde4b8976393a139583f9375189ccf896ad536ff2046b4e2f705806
    user: "1000:1000"
    environment:
      - BASSIN_CONFIG_TOKEN=${APP_PASSWORD}
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${APP_DATA_DIR}/data/www:/www
    restart: on-failure
