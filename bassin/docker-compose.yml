version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: bassin_www_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  init:
    image: alpine:3.22.1@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
    entrypoint: >-
      /bin/sh -c '
        if [ ! -f /config/ckpool.conf ]; then
          apk add --no-cache envsubst &&
          envsubst < /config/ckpool.conf.template > /config/ckpool.conf
        fi &&
        chown 1000:1000 /config/ckpool.conf
      '
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
    environment:
      - APP_BITCOIN_NODE_IP=${APP_BITCOIN_NODE_IP}
      - APP_BITCOIN_RPC_PORT=${APP_BITCOIN_RPC_PORT}
      - APP_BITCOIN_RPC_USER=${APP_BITCOIN_RPC_USER}
      - APP_BITCOIN_RPC_PASS=${APP_BITCOIN_RPC_PASS}
      - APP_BITCOIN_ZMQ_HASHBLOCK_PORT=${APP_BITCOIN_ZMQ_HASHBLOCK_PORT}

  ckpool:
    image: ghcr.io/blockdyor/docker-ckpool-solo:v1.2.0-1@sha256:ac630bfd6675cb512317f3a75edff7940dcf0378dc8aeb61ba9ac592aa6bdb87
    # Keep the startup wrapper in Compose so existing installs receive it on update.
    entrypoint:
      - /bin/sh
      - -c
      - |
        # Export the compiled CKPool version, then replace this shell with the pool process.
        # CKPool embeds PACKAGE "/" VERSION in its Stratum implementation.
        set -u
        binary=$${CKPOOL_BINARY:-/app/bin/ckpool}
        output=$${CKPOOL_VERSION_FILE:-/www/pool/version.json}
        version=$$(LC_ALL=C grep -aoE 'ckpool/[0-9]+(\.[0-9]+){1,3}([+-][0-9A-Za-z.-]+)?' "$$binary" 2>/dev/null | head -n 1)
        version=$${version#ckpool/}

        # Publish null if the binary no longer provides this identifier; never retain an old version.
        metadata=null
        if [ -n "$$version" ] && [ "$${#version}" -le 64 ]; then
            metadata=$$(printf '{"software":"ckpool","version":"%s"}' "$$version")
        fi
        if mkdir -p "$$(dirname "$$output")" && temporary=$$(mktemp "$${output}.XXXXXX"); then
            if printf '%s\n' "$$metadata" > "$$temporary" && chmod 644 "$$temporary"; then
                mv -f "$$temporary" "$$output" || rm -f "$$temporary"
            else
                rm -f "$$temporary"
            fi
        fi
        # Metadata failure must not prevent mining or change CKPool's arguments/signals.
        exec "$$binary" "$$@"
      - bassin-ckpool
    command: ["-k", "-B", "-c", "/config/ckpool.conf"]
    user: "1000:1000"
    depends_on:
      init:
        condition: service_completed_successfully
    restart: on-failure
    stop_grace_period: 30s
    ports:
      - "3456:3333/tcp"
    volumes:
      - ${APP_DATA_DIR}/data/config:/config:ro
      - ${APP_DATA_DIR}/data/www:/www

  ui:
    image: ghcr.io/blockdyor/bassin-ui:af433d3@sha256:bc889247d9aaab8c709ad7abed9aa7a9fcd4342930f6531d76e490399173c7b7
    entrypoint: /bin/sh -c "cp -r /ui/* /www/ && exec python3 /opt/bassin/pool-location.py"
    user: "1000:1000"
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - ${APP_DATA_DIR}/data/config:/config:ro
      - ${APP_DATA_DIR}/data/www:/www
    restart: on-failure

  www:
    image: halverneus/static-file-server:v1.8.11@sha256:2e91ce7ffb8519eeb882ba52d75c191ca6c921c16438447362128ef73ee2ea7e
    user: "1000:1000"
    environment:
      - FOLDER=/www
      - PORT=80
    volumes:
      - ${APP_DATA_DIR}/data/www:/www:ro
    depends_on:
      - ui
    restart: on-failure

  widget-server:
    image: ghcr.io/blockdyor/umbrel-bassin-widget:main@sha256:0f2b9d16a709aecc09b6b1901e037587738a9706f633cdf824b298129f6b994b
    environment:
      - BASSIN_API_POOL_URL=http://bassin_www_1/pool/pool.status
    depends_on:
      - www
    restart: on-failure
