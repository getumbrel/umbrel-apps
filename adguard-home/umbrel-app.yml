manifestVersion: 1
id: adguard-home
storage:
  dataRoot: data
category: networking
name: AdGuard Home
version: "1.0.0"
tagline: Network-wide software for blocking ads and tracking
description: >-
  ⚠️ See below for important set-up instructions.

  
  AdGuard Home is a comprehensive solution designed to block ads and tracking across all devices in your home network. As the world increasingly embraces the Internet of Things,
  with a growing number of connected devices, maintaining control over your entire network is crucial. AdGuard Home empowers you to manage this with ease, ensuring a secure and
  clutter-free browsing experience for every device under your roof.


  🛠️ SET-UP INSTRUCTIONS

  In the setup wizard, it is important to set the "Port" of the Admin Web Interface to 8095.
  This ensures that the app will not conflict with other apps from the Umbrel App Store, and that the app will be accessible
  when clicking on the app icon in the umbrelOS homescreen.
releaseNotes: >-
  ⚠️ Back up your app data before updating. AdGuard Home 1.0 is now stable and keeps your existing configuration. Users upgrading from the 0.107 series will see a redesigned interface.


  ⚠️ If your DNS traffic goes through France and you use Quad9, change your upstream, bootstrap, and any fallback DNS addresses before November 24, 2026. Existing configurations are not changed automatically.


  This release includes:

  - A faster, lighter web interface with improved mobile support
  - Fixes for DNS rewrites, TCP DNS requests, and shutdown reliability
  - More reliable DHCP configuration, client settings, and blocked-service schedules
  - Fixes for setup, theme preferences, and filtering results
  - Cloudflare DNS defaults for new installations, while preserving existing DNS settings
  - Security fixes


  Full release notes can be found at https://github.com/AdguardTeam/AdGuardHome/releases/tag/v1.0.0
developer: Adguard
website: https://adguard.com/fr/adguard-home/overview.html
dependencies: []
repo: https://github.com/AdguardTeam/AdGuardHome
support: https://github.com/AdguardTeam/AdGuardHome/issues
port: 8095
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
  - 4.webp
path: ""
defaultUsername: ""
defaultPassword: ""
submitter: Julienpeps
submission: https://github.com/getumbrel/umbrel-apps/pull/1038
