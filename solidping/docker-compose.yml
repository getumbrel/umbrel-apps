version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: solidping_server_1
      APP_PORT: 4000
      PROXY_AUTH_ADD: "false"

  server:
    image: ghcr.io/fclairamb/solidping:0.36.0@sha256:37de188e930290428e621360572796ec68cf7e725934499d5323643b85fcb92c
    restart: on-failure
    user: "1000:1000"
    stop_grace_period: 1m
    environment:
      SP_BASE_URL: http://${DEVICE_DOMAIN_NAME}:${APP_PROXY_PORT}
      SP_AUTH_JWT_SECRET: ${APP_SEED}
    volumes:
      - ${APP_DATA_DIR}/data:/data
