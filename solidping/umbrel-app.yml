manifestVersion: 1
id: solidping
category: networking
name: SolidPing
version: "0.36.0"
tagline: Uptime monitoring, alerting and status pages
description: >-
  SolidPing watches your websites, servers and services and tells you when something breaks.


  First login: admin@solidping.io with the password solidpass. You are asked to set a new password right away.


  It runs 40 kinds of checks: HTTP(S), TCP, DNS, SSL certificate expiry, ICMP ping, databases (PostgreSQL, MySQL, MongoDB, Redis), message brokers, and scriptable browser and JavaScript checks for anything else. Alerts go out by email, Slack, Discord, Telegram, ntfy, Pushover, PagerDuty and webhooks, with escalation and maintenance windows.


  Features:


  - Public status pages with incident history

  - Sub-minute check intervals, not paywalled

  - Private agents to check networks Umbrel cannot see from the outside

  - Import of Uptime Kuma monitors

  - MCP server, so an AI assistant can read and manage your checks
