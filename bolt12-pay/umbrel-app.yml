releaseNotes: |
  BOLT12 Pay 0.3.27

  - Switch between LND and Phoenixd. Connect an existing Phoenixd wallet in Setup and switch backends from Pay or Console. Your Offers, aliases and Nostr Wallet Connect connections stay linked to their original wallet.
  - See both wallets in Lightning Activity or filter by LND or Phoenixd. Export either wallet or both as CSV for a date range you choose.
  - Pay LNURL links and Lightning addresses, use LNURL-auth to sign in, and redeem LNURL-withdraw vouchers by scanning a QR code or pasting a link.
  - Choose your wallet at the top of Setup. Use the updated QR menu to scan or decode, and open the Offer decoder from Create Offer when needed. Pay now previews BOLT12 minimum amounts.
  - Open Lightning Activity directly from Pay and view incoming and outgoing liquidity on your LND channels. Phoenixd supports receiving Nostr Zaps.
  - Tap a notification in Android Companion 1.1.4 to jump to the matching entry in Lightning Activity.
  - Import existing Phoenixd history silently with an already paired Companion. The upgrade stops queued notifications for historical Phoenixd payments, and new payments still notify.
  - Umbrel requires the Lightning Node app. Phoenixd is optional and can run on another server.

