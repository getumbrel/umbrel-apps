releaseNotes: |
  BOLT12 Pay 0.3.30

  - Connect an existing Phoenixd wallet alongside LND + LNDK and switch backends without changing the wallet assigned to Offers, aliases or NWC connections.
  - Filter Lightning Activity by wallet and export a selected date range as CSV. View channel liquidity from Pay.
  - Use LNURL-auth and LNURL-withdraw by scanning or pasting a link. Updated QR controls, grouped Offer decoding and BOLT12 minimum-amount previews simplify payments.
  - Android Companion 1.1.4 shows the receiving wallet and opens the matching payment. Historical Phoenixd imports no longer replay old notifications.
  - Pause/reactivate a Phoenixd connection, optionally hide alias pages, or remove saved credentials while choosing whether to retain local history.
  - Optionally clean up that wallet's Offers, aliases and matching Cloudflare publications without removing the public Setup address. Recognize chunked DNS TXT records.
  - Restore a missing public BIP353 record with LND after removing its former Phoenixd connection.
  - Umbrel still requires the Lightning Node app. Phoenixd is optional and may run on another server.

  - On fresh installs, Umbrel supplies the initial app password and displays it under Default credentials. Existing passwords are preserved.
  - Changing the app password signs out existing Pay sessions and locks NWC admin controls until you unlock them again.

  LNDK is unchanged.

  https://github.com/Alex71btc/lndk-pay/releases/tag/v0.3.30

