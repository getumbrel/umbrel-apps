releaseNotes: |
  Lightning Activity now displays the date and time for incoming and outgoing payments.

  Dates and times follow the selected German or English interface language and use your browser's local timezone.

  Older entries without a valid timestamp display a clear fallback message. The compact layout works on mobile and desktop.

  Existing application data and payment history are preserved. No manual migration is required.

