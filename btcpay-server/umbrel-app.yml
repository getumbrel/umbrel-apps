releaseNotes: >-
  BTCPay Server 2.4.2 fixes a critical TOTP two-factor authentication bypass through Greenfield Basic authentication that is being actively exploited. Update as soon as possible.


  Greenfield Basic authentication is now disabled by default five minutes after account creation, with opt-in available through account settings and the API. Most integrations use API keys and are not affected.


  If you're updating from a pre-2.4 version and use the Boltcards Extension or Shopify v2 plugins, upgrade those plugins to their latest versions for BTCPay Server 2.4 compatibility.


  This release also improves multisig PSBT signing and finalization, adds wallet transaction column controls, improves store settings, fixes right-to-left stylesheets, and updates the NBXplorer companion image to 2.6.10.


  Full BTCPay Server release notes can be found at https://github.com/btcpayserver/btcpayserver/releases/tag/v2.4.2
submitter: Umbrel
submission: https://github.com/getumbrel/umbrel/pull/353
