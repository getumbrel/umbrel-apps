manifestVersion: 1
id: btcpay-server
storage:
  dataRoot: data
category: bitcoin
name: BTCPay Server
version: "2.4.6"
tagline: Accept Bitcoin payments with 0 fees & no 3rd party
description: >-
  BTCPay Server is a payment processor that allows you to receive
  payments in Bitcoin (and altcoins) directly, with no fees, transaction cost or
  a middleman. It is a non-custodial invoicing system which eliminates the
  involvement of a third-party.


  Payments with BTCPay Server go directly to your wallet, which increases the privacy and security. Your private keys are never uploaded to your Umbrel. There is no address re-use, since each invoice generates a new address deriving from your xpubkey.


  You can not only attach an unlimited number of stores and use the Lightning Network but also become a payment processor for others. Thanks to the apps built on top of it, you can use BTCPay to receive donations, start a crowdfunding campaign or have an in-store Point of Sale.


  Please note: Due to your BTCPay instance running on your local network connecting remote applications, such as Shopify or WordPress for example, will fail to connect, unless you configure the dynamic DNS feature (see: https://docs.btcpayserver.org/Deployment/DynamicDNS).
developer: BTCPay Server Foundation
website: https://btcpayserver.org
dependencies:
  - bitcoin
  - lightning
repo: https://github.com/btcpayserver/btcpayserver
support: https://chat.btcpayserver.org
port: 3003
gallery:
  - 1.jpg
  - 2.jpg
  - 3.jpg
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: |-
  ⚠️ Per-invoice email notifications have been removed. Use merchant-controlled email rules instead.

  This release strengthens API-key and store permissions, browser actions, external URLs, and handling of untrusted input. It also includes runtime security updates.

  - Faster recent-invoice lists on large servers.
  - Clearer wallet filters, import/export controls, and fee-bump actions.
  - Improved QR-code scanning in dark mode and readable checkout payment-method names.
  - Persistent diagnostics for plugins disabled after failures.
  - Fixes for email rules, subscriptions, public forms, and invoice redirect URLs.
  - Updates NBXplorer to 2.6.21.

  For users skipping 2.4.5: manually configured connections to other apps on your home network may need updating. Advanced configuration: https://docs.btcpayserver.org/Operators/#allow-private-outbound-destinations
  Public invoice details are hidden one month after monitoring ends, and manual invoice notification URLs are deprecated in favor of webhooks.

  ⚠️ Security reminder for skipped-version updates. If you used BTCPay Server before 2.4.2 and have not rotated your Lightning Node credentials since updating to 2.4.2 or later, update first, then rotate your Lightning Node credentials immediately. Updating alone does not invalidate credentials that may have been exposed.

  Umbrel credential-rotation instructions: https://github.com/getumbrel/umbrel-apps/blob/ef1400c9571d4f317f0dae38130f42afc98e9af6/btcpay-server/umbrel-app.yml#L43-L65

  Prior security advisory: https://blog.btcpayserver.org/security-advisory-btcpay-server-2-4-2/

  Full release notes: https://github.com/btcpayserver/btcpayserver/releases/tag/v2.4.6
submitter: Umbrel
submission: https://github.com/getumbrel/umbrel/pull/353
