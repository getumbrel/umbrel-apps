manifestVersion: 1
id: n8n
storage:
  dataRoot: data
environment:
  - name: GENERIC_TIMEZONE
    services:
      - server
    note: IANA time zone used by Schedule nodes, such as America/New_York or Europe/London.
  - name: N8N_WEBHOOK_URL
    services:
      - server
    note: Only set this if n8n is already reachable through a public tunnel or reverse proxy. Enter the complete HTTPS base URL, such as https://n8n.example.com/. This setting does not expose n8n by itself.
category: automation
name: n8n
version: "2.45.4"
releaseNotes: >-
  ⚠️ If you're updating from n8n 2.27.3 or earlier, this update includes the database index migration for workflow executions introduced in 2.27.4. Large n8n instances may take several minutes to finish the migration.


  Deprecated Function, Function Item, and LangChain Code nodes can no longer be added or edited. Replace them with supported nodes before importing older workflows. Existing saved workflows can continue running.


  This update includes new features and improvements:
    - Refresh the editor design and improve light-mode text contrast.
    - Export migration reports as CSV and filter affected workflows by project.
    - Improve workflow scheduling reliability and execution handling.
    - Improve email, Postgres, and Microsoft Teams integrations.
    - Fix workflow execution redaction and credential access handling.


  Full release notes can be found at https://github.com/n8n-io/n8n/releases/tag/n8n%402.45.4
tagline: Build complex workflows, really fast
description: >-
  n8n is an extendable workflow automation tool. With a fair-code distribution model, n8n will always have visible source code, 
  be available to self-host, and allow you to add your own custom functions, logic and apps. 
  n8n's node-based approach makes it highly versatile, enabling you to connect anything to everything.


  n8n (pronounced n-eight-n) helps you to connect any app with an API with any other, and manipulate its data with little or no code.


  Customizable: highly flexible workflows and the option to build custom nodes.


  Privacy-focused: self-host n8n for privacy and security.
developer: n8n
website: https://n8n.io
dependencies: []
repo: https://github.com/n8n-io/n8n
support: https://docs.n8n.io/
port: 5678
gallery:
  - 1.jpg
  - 2.jpg
  - 3.jpg
path: ""
defaultUsername: ""
defaultPassword: ""
submitter: Pranshu Agrawal
submission: https://github.com/getumbrel/umbrel-apps/pull/283
