name: n8n
version: "2.36.7"
releaseNotes: >-
  ⚠️ If you're updating from n8n 2.27.3 or earlier, this update includes the database index migration for workflow executions introduced in 2.27.4. Large n8n instances may take several minutes to finish the migration.


  This update adds workflow automation improvements including expanded Agent Builder, AI Assistant, MCP, role API, and workflow history capabilities.


  It also improves workflow/runtime reliability, including schedule trigger catch-up handling, duplicated workflow state, task runner restarts, trigger authentication, and test webhook cleanup.


  Several integrations were updated or fixed, including Google Ads API v25, Microsoft Teams and SharePoint OAuth, Confluence, Discord, OpenRouter, MiniMax, WordPress, and OAuth proxy handling.


  Public Form Trigger paths (`/form/*`, `/form-test/*`, `/form-waiting/*`) remain available without Umbrel login, while the n8n editor remains protected by your Umbrel login.


  Full release notes can be found at https://github.com/n8n-io/n8n/releases/tag/n8n%402.36.7
tagline: Build complex workflows, really fast
description: >-
  n8n is an extendable workflow automation tool. With a fair-code distribution model, n8n will always have visible source code, 
  be available to self-host, and allow you to add your own custom functions, logic and apps. 
  n8n's node-based approach makes it highly versatile, enabling you to connect anything to everything.


  n8n (pronounced n-eight-n) helps you to connect any app with an API with any other, and manipulate its data with little or no code.


  Customizable: highly flexible workflows and the option to build custom nodes.


  Privacy-focused: self-host n8n for privacy and security.
