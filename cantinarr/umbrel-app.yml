manifestVersion: 1
id: cantinarr
category: media
name: Cantinarr
version: "0.15.0"
tagline: Media requests and server management in one app
description: >-
  Browse and request movies, shows, books, and music. Follow downloads and get notified when content is ready. Cantinarr brings media requests and server management into one app: household members get a simple web or phone app, while administrators manage Radarr, Sonarr, Chaptarr, Lidarr, and download clients, review approvals, and investigate stuck downloads.


  Connect only the services you use. Plex, Jellyfin, Emby, Audiobookshelf, Tautulli, and Tracearr integrations are available. Cantinarr also offers MCP tools for authorized clients. Service credentials and quality profiles stay out of the household app.


  AI is optional. Connect a provider if you want an assistant for library questions and requests or an agent that investigates persistent download problems and proposes actions for administrator review. You choose which actions it may take.


  Cantinarr uses its own accounts, so Umbrel's app login is bypassed for it: the web app opens ready for you, and household members and the phone apps sign in through connect links you send them. Sign-in is passwordless by default, with passwords and passkeys available if you want them. API keys and download client passwords are AES-256-GCM encrypted in Cantinarr's database and never come back out through the API.


  🛠️ SET-UP INSTRUCTIONS


  When adding your services inside Cantinarr, you can use the following addresses:
    - **Radarr:** radarr_server_1:7878
    - **Sonarr:** sonarr_server_1:8989


  For other services, use your Umbrel device's IP address and the service's port. You can find your device's IP address in the Umbrel Settings.
