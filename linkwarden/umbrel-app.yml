releaseNotes: >-
  This release refreshes Linkwarden's web interface with a new sidebar layout, navigation improvements, and a new search modal with recent search history.


  It also adds a system theme option, PNG support for link banners, and mobile app improvements for custom headers, self-signed certificates, and re-preserving saved link formats.


  Full release notes can be found at https://github.com/linkwarden/linkwarden/releases/tag/v2.16.0
