manifestVersion: 1

id: nodesignal-podcast-manager
category: media
name: Podcast Manager (Nodesignal)
version: "0.2.1"
releaseNotes: |-
  ### 📄 MIT license
  - The project is now MIT-licensed. The bitcoinlib (AGPL) and html2text (GPL) dependencies were removed as part of this; the automatic on-chain balance scan was discontinued.

  ### 💾 Unified backup
  - A single "Create backup" now produces one .nsbk file containing the database and all local assets (audio, cover art, intro/outro). A restore brings everything back.
  - Encrypted offsite copies (.nsbk.enc) can be restored directly from the cloud on the server.

  ### ❤️ Donations
  - New /support page with a Lightning donation address (Nodesignal@getalby.com) and one-click recurring donation setup.

  ### 📦 Both images rebuilt and bumped to 0.2.1
  - Web/bots image and worker image rebuilt and re-pinned.

tagline: Self-hosted Bitcoin Podcasting 2.0 studio
description: >-
  Nodesignal Podcast Manager is a self-hosted production hub for Podcasting
  2.0: episode management, transcription (faster-whisper, CPU), automatic
  LLM-generated summaries/show notes, YouTube video creation, Value4Value
  over Lightning (NWC), Nostr publishing, and a Telegram community bot.

  First run: after installation, log in as "admin" with the password shown
  by Umbrel (deterministicPassword). Wallet (NWC), PodHome token, LLM
  connections, and other integrations are configured on the in-app
  Configuration page in your browser — no SSH required.


  Note: the transcription worker runs CPU-only, so long episodes take a
  while. The Telegram community bot is activated on the Configuration page
  (set a bot token, Lightning address, and NWC URL) and then starts
  automatically — it idles until configured.
developer: Nodesignal
website: https://nodesignal.space
dependencies: []
repo: https://gitlab.com/nodesignal/podcasting_tools
support: https://gitlab.com/nodesignal/podcasting_tools/-/issues

port: 8210
gallery: []
path: ""

defaultUsername: "admin"
defaultPassword: ""
deterministicPassword: true

backupIgnore:
  - data/cache/*

permissions: []

submitter: Nodesignal
submission: https://github.com/getumbrel/umbrel-apps/pull/5934
