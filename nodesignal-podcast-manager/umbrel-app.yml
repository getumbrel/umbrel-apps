manifestVersion: 1

id: nodesignal-podcast-manager
category: media
name: Sovereigncast
version: "0.4.0"
tagline: Self-hosted Bitcoin Podcasting 2.0 studio
description: >-
  Sovereigncast is a self-hosted production hub for Podcasting
  2.0: episode management, transcription (faster-whisper, CPU), automatic
  LLM-generated summaries/show notes, YouTube video creation, Value4Value
  over Lightning (NWC), Nostr publishing, and a Telegram community bot.

  First run: after installation, log in as "admin" with the password shown
  by Umbrel (deterministicPassword). Wallet (NWC), PodHome token, LLM
  connections, and other integrations are configured on the in-app
  Configuration page in your browser — no SSH required.


  Note: the transcription worker runs CPU-only, so long episodes take a
  while. The Telegram community bot is activated on the Configuration page
  (set a bot token, Lightning address, and NWC URL) and then starts
  automatically — it idles until configured.
releaseNotes: ""

developer: Nodesignal
website: https://nodesignal.space
dependencies: []
repo: https://gitlab.com/nodesignal/podcasting_tools
support: https://gitlab.com/nodesignal/podcasting_tools/-/issues

port: 8210
gallery: []
path: ""

defaultUsername: "admin"
defaultPassword: ""
deterministicPassword: true

backupIgnore:
  - data/cache/*

permissions: []

submitter: Nodesignal
submission: https://github.com/getumbrel/umbrel-apps/pull/5936
