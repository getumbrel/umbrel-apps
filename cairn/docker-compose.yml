version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: cairn_web_1
      APP_PORT: 8080

  web:
    image: morgankryze/cairn:1.25.1@sha256:e1b159419bc66dd950ce99e665db2bd3502c210c13542ae4f05dc9ba6e218007
    restart: on-failure
    # cairn only ever reads this folder. Put a services.yaml in it to list your
    # own services; while it is empty cairn serves a getting-started page.
    volumes:
      - ${APP_DATA_DIR}/data/config:/config:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # The image has no shell, so the binary probes itself.
      test: ["CMD", "/cairn", "-healthcheck"]
      interval: 30s
      start_period: 5s
