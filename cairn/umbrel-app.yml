manifestVersion: 1
id: cairn
storage:
  dataRoot: data
folderAccess:
  - id: cairn-config
    name: Services configuration
    note: Select a folder holding your services.yaml, then edit the file there. cairn reads this folder and never writes to it. Leave it unset to use the app's own data folder.
    mounts:
      - service: web
        targetPath: /config
        readOnly: true
category: files
name: cairn
version: "1.25.1"
tagline: The directory page for the people you host services for
description: >-
  cairn opens on a getting-started page, so the first run works with nothing
  configured. You list your services by writing one YAML file in cairn's
  configuration folder, and cairn picks it up within seconds without a restart.
  Use the Services configuration setting to point cairn at a folder you can
  reach from your computer.


  cairn is the page you hand to the people you host services for: family, a
  club, whoever ends up using your server. It shows your services and nothing
  else, with no account to create, no database and no outbound requests. Each
  service can carry a live status pill pulled from Gatus or Uptime Kuma, so a
  visitor sees what is up before they click.


  The interface speaks eight languages and picks the visitor's own, and cairn
  serves its own legal and privacy pages, which associations and small hosts
  need. It ships as a single static Go binary in a scratch image, around 4 MB to
  pull, and it writes nothing at runtime, so it runs read-only with every Linux
  capability dropped and no shell inside.
releaseNotes: ""

developer: MorganKryze
website: https://cairn.libresoftware.cloud
dependencies: []
repo: https://github.com/MorganKryze/cairn
support: https://github.com/MorganKryze/cairn/issues

port: 8200
gallery: []
path: ""

defaultUsername: ""
defaultPassword: ""

submitter: MorganKryze
submission: https://github.com/getumbrel/umbrel-apps/pull/6258
