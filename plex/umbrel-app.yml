manifestVersion: 1
id: plex
storage:
  dataRoot: data
folderAccess:
  - id: umbrel-downloads
    name: Downloads
    note: Media files for your Plex libraries. Available inside Plex at /downloads.
    mounts:
      - service: server
        targetPath: /downloads
  - id: media-library
    name: Media Library
    note: Select an additional folder containing media, then add /media as a folder in a Plex library. Access is read-only to protect the original files.
    mounts:
      - service: server
        targetPath: /media
        readOnly: true
category: media
name: Plex
version: "1.43.4.10903-patch.1"
tagline: Stream Movies & TV Shows
description: >-
  Stream movies and TV shows, plus 300+ channels of live TV, instantly, without a subscription. Watch live TV and movies anywhere, from any device, with Plex.


  Plex uses a server to house your media library and player apps to playback the media. Add, access, and share all the entertainment that matters to you, on almost any device.


  ⚠️ If you encounter a "not authorized error" when attempting to access your Plex app, please follow the steps in this guide: https://community.umbrel.com/t/fixing-plexs-not-authorized-error/10523
developer: Plex
website: https://www.plex.tv/
dependencies: []
repo: ""
support: https://www.plex.tv/
port: 32400
gallery:
  - 1.jpg
  - 2.jpg
  - 3.jpg
path: /web
defaultUsername: ""
defaultPassword: ""
torOnly: false
permissions:
  - STORAGE_DOWNLOADS
  - GPU
releaseNotes: >-
  This update adds support for new storage management and configuration options being introduced with umbrelOS 2.0, including access to additional media folders.


  Previous Plex 1.43.4.10903 release notes:


  This update includes several improvements and bug fixes:
    - Adds HDR10+ filtering and metadata detection.
    - Adds HEVC transcode support for devices with 8-bit HEVC encoding support.
    - Fixes crashes caused by malformed WebP images, some POST/timeline/HTTP requests, and some metadata rematches.
    - Fixes a corrupt search index issue that could fail database integrity checks and block backups.
    - Improves metadata validation, ID3 year handling, and search results for items with missing parents.

  Full release notes are available at https://www.videohelp.com/software/Plex
submitter: Umbrel
submission: https://github.com/getumbrel/umbrel-apps/commit/60878f278d544b204d8e7c96240c797f43a9b319
