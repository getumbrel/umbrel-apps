manifestVersion: 1
id: horn-signal-studio
storage:
  dataRoot: data
category: developer
name: Horn Signal Studio
version: "1.0.0"
tagline: Rehearse horn signals, check crossing timing and estimate how far a horn carries
description: >-
  Horn Signal Studio is a small browser tool for people who work with horn and whistle signals: railway volunteers,
  model-railroad sound builders, boat-club safety officers and anyone writing a noise or quiet-zone memo.
  There is no account to create; the app opens straight to the tool behind your Umbrel login.


  - Signal catalog and timeline: US railway signals from GCOR 5.8.2 (including the grade-crossing long, long, short, long)
  and the COLREGS Rule 34 and 35 manoeuvring and fog signals, drawn to scale with adjustable short, long and gap durations.

  - Quiet preview: plays the cadence as a soft chord through the browser, so a pattern can be rehearsed without sounding a real horn.

  - Crossing onset: the distance window in which a locomotive horn must start before a public crossing (49 CFR 222.21).

  - Level at distance: a free-field estimate of a horn's sound level from its rating at 100 ft, checked against the
  96 to 110 dB(A) locomotive band of 49 CFR 229.129.

  - Saved patterns: keep club start signals, yard tests or custom cadences on your Umbrel.
