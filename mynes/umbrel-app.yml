manifestVersion: 1.1
id: mynes
category: networking
name: MyNeS
version: "1.3.0"
tagline: See every device on your network, including the ones an IP scan cannot find
description: >-
  MyNeS discovers, identifies and monitors every device on your home network.


  Beyond ARP and port scanning it speaks mDNS/Bonjour, SSDP/UPnP, Matter, Bluetooth LE and MQTT,
  so it also finds the radio devices an IP scan is blind to: Zigbee bulbs behind Zigbee2MQTT,
  Z-Wave sensors behind Z-Wave JS, BLE trackers and Tasmota nodes.


  ⚡️ Highlights


  - Device inventory with vendor lookup over a 1000+ entry OUI database and automatic device-type
    classification (router, NAS, camera, phone, console, smart plug, ...)

  - Network topology and force-directed graph views

  - Scan history, so you can see when a device first appeared and when it went quiet

  - Rule-based monitoring: alerts on new, missing or changed devices, delivered by Web Push,
    webhook, e-mail or Home Assistant

  - Two-way Home Assistant integration: MQTT Discovery pushes every device in as an entity, and the
    REST/WebSocket side compares what Home Assistant knows against what the network actually shows

  - Turkish and English UI, light and dark themes, installable as a PWA


  No cloud, no account, no telemetry. Everything stays on your umbrelOS box.


  ⚠️ MyNeS runs on the host network so it can send raw ARP frames and listen for mDNS/SSDP.
  Only scan networks you own.
