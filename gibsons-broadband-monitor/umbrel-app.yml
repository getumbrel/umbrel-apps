manifestVersion: 1
id: gibsons-broadband-monitor
storage:
  dataRoot: data
category: networking
name: Gibson's Broadband Monitor
version: 0.4.1
tagline: Track broadband speed, outages and server traffic
description: 'Monitor your connection with scheduled download, upload and latency
  tests, availability checks, outage history, historical graphs and CSV exports. Your
  measurements stay in a local SQLite database. Includes 16 interface languages and
  optional ntfy notifications.


  Umbrel login protects the dashboard. The app also uses the password displayed by
  Umbrel to protect direct access from other containers.


  Server Network Usage reads one host interface through a read-only /proc/1/net mount.
  It includes LAN transfers and is not an ISP billing meter or whole-household measurement.
  Allow two samples about a minute apart for usage totals. Full speed tests run hourly
  by default and consume internet data.'
