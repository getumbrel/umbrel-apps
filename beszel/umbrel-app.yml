manifestVersion: 1
id: beszel
category: networking
name: Beszel
version: "0.18.8"
tagline: Lightweight server monitoring with alerts and historical data
description: >-
  Beszel is a lightweight, self-hosted server monitoring platform. It tracks
  CPU, memory, disk, network, and temperature history for your Umbrel, with
  configurable alerts and a clean, fast dashboard.


  WORKS OUT OF THE BOX


  A monitoring agent for your Umbrel is included and connects automatically.
  After your first visit (create your admin account), click "Add System" and
  enter:


  - Name: umbrel (or anything you like)

  - Host: beszel_agent_1

  - Port: 45876


  You can also add any other machines running the Beszel agent from the same
  dashboard.
