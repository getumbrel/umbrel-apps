category: finance
name: Securo
version: "0.21.0"
tagline: Open-source finance for small businesses and households
description: >-
  Securo brings bank reconciliation, cash flow, budgets, invoices, investments and net worth into one place, and keeps the balance visible instead of hiding it behind a sync.


  Every imported row can be checked against the account's real balance, so you see what reconciled, what did not and why. Connect a bank through Pluggy (Brazil), Enable Banking (Europe) or SimpleFIN (United States), each with your own provider credentials, or import CSV files.


  On the first visit, create the administrator account on the welcome screen; nothing is pre-created. Bank sync providers are optional and configured inside the app or with the app's environment.
