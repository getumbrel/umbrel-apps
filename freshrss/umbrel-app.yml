manifestVersion: 1
id: freshrss
category: social
name: FreshRSS
version: "1.30.0"
tagline: A free, self-hostable aggregator for rss feeds
description: >-
  FreshRSS is an RSS aggregator and reader. It enables you to seamlessly read and follow content from multiple websites at
  a glance without the need to browse from one website to another.


  FreshRSS has a lot of features including:
  
  - RSS and Atom aggregation
  
  - Mark article as favorite if you liked it or if you want to read it later
  
  - Filter and search functionality helps to easily find articles
  
  - Statistics to show you the publishing frequency all the websites you follow
  
  - Import/export of your feeds into OPML format (more information)
  
  - and more!
releaseNotes: >-
  This FreshRSS security-oriented release includes important security patches and a local-network access change.


  Key highlights:
    - Patched several security attack scenarios, including login/register CSRFs and access-control issues
    - Disallows access to local networks (for example 127.0.0.1) by default; admins can allow selected local networks in System configuration if needed
    - Added feed list filtering by state/search, an option to hide unread badges, and refresh-only-current-view support
    - Improved user label sharing, saved queries, regex/search handling, and OPML/security-related import behavior


  Full release notes can be found at https://github.com/FreshRSS/FreshRSS/releases/tag/1.30.0
developer: FreshRSS Org
website: https://freshrss.org/
