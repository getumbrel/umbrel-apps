manifestVersion: 1
id: freshrss
storage:
  dataRoot: data
category: social
name: FreshRSS
version: "1.31.0"
tagline: A free, self-hostable aggregator for rss feeds
description: >-
  FreshRSS is an RSS aggregator and reader. It enables you to seamlessly read and follow content from multiple websites at
  a glance without the need to browse from one website to another.


  FreshRSS has a lot of features including:
  
  - RSS and Atom aggregation
  
  - Mark article as favorite if you liked it or if you want to read it later
  
  - Filter and search functionality helps to easily find articles
  
  - Statistics to show you the publishing frequency all the websites you follow
  
  - Import/export of your feeds into OPML format (more information)
  
  - and more!
releaseNotes: >-
  This release fixes critical security vulnerabilities affecting login, search, shared queries, and feed handling. Login now relies on HTTPS instead of the previous browser-side password challenge; use a secure HTTPS connection when signing in.


  Improvements include custom sorting for saved queries, faster batch marking of articles as read, improved HTML parsing, and fixes for JSON feed imports and saved searches.


  If you are upgrading from a version older than 1.30.0, access to local-network feed URLs is now blocked by default. Admins can allow selected local networks in System configuration if needed.


  Full release notes can be found at https://github.com/FreshRSS/FreshRSS/releases/tag/1.31.0
developer: FreshRSS Org
website: https://freshrss.org/
dependencies: []
repo: https://github.com/FreshRSS/FreshRSS
support: https://github.com/FreshRSS/FreshRSS/issues
port: 3432
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
path: ""
deterministicPassword: false
torOnly: false
submitter: Pranshu Agrawal
submission: https://github.com/getumbrel/umbrel-apps/pull/700
