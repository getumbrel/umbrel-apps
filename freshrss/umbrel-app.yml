manifestVersion: 1
id: freshrss
storage:
  dataRoot: data
category: social
name: FreshRSS
version: "1.30.2"
tagline: A free, self-hostable aggregator for rss feeds
description: >-
  FreshRSS is an RSS aggregator and reader. It enables you to seamlessly read and follow content from multiple websites at
  a glance without the need to browse from one website to another.


  FreshRSS has a lot of features including:
  
  - RSS and Atom aggregation
  
  - Mark article as favorite if you liked it or if you want to read it later
  
  - Filter and search functionality helps to easily find articles
  
  - Statistics to show you the publishing frequency all the websites you follow
  
  - Import/export of your feeds into OPML format (more information)
  
  - and more!
releaseNotes: >-
  This FreshRSS security-oriented release includes several security patches and bug fixes.


  If you are upgrading from a version older than 1.30.0, access to local-network feed URLs is now blocked by default. Admins can allow selected local networks in System configuration if needed.


  Key highlights:
    - Strengthens feed-content sanitization and prevents Fever API keys from being logged on failed authentication
    - Fixes local DNS leaks when fetching feeds through a proxy
    - Fixes WebSub updates, SQLite compatibility with PHP 8.5+, and search sort overrides
    - Reduces memory usage when exporting feeds and includes UI improvements


  Full release notes can be found at https://github.com/FreshRSS/FreshRSS/releases/tag/1.30.2
developer: FreshRSS Org
website: https://freshrss.org/
