manifestVersion: 1
id: tubehaus
storage:
  dataRoot: data
category: media
name: TubeHaus
version: "1.6.0"
tagline: Your own YouTube, without ads or tracking, for the whole household
description: >-
  TubeHaus is a YouTube app you host yourself. It looks and feels like YouTube, but there are no ads,
  no tracking and no account with Google: your subscriptions, history, playlists and resume points live
  on your Umbrel, and every phone, computer and TV in the house sees the same library.


  It asks YouTube itself (TubeHaus' own engine), so nothing else needs to be installed: no Invidious, no database.


  - A home screen of your subscriptions and recommendations made from what you watch, on this device only

  - Up to 4K, SponsorBlock, dubbed audio tracks, chapters, captions and translated subtitles

  - Live streams with live captions transcribed on your Umbrel (whisper.cpp)

  - Send to TV: a phone starts and controls playback on another open TubeHaus screen

  - Watch together: a room that keeps everyone on the same video and moment, with a short chat

  - Offline save, a music mode with lyrics, and a big-screen mode for TVs and remotes


  The free TubeHaus apps for Android, Android TV, Windows, macOS, Linux and iPad work on their own;
  this is the web app and the server for your household.
