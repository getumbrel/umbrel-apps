manifestVersion: 1.1
id: nextcloud
storage:
  dataRoot: data
category: files
name: Nextcloud
version: "34.0.4-patch.1"
tagline: Productivity platform that keeps you in control
description: >-
  Nextcloud puts your data at your fingertips, under your control.
  Store your documents, calendar, contacts and photos on your Umbrel instead of
  some company's data center. Features:


  - Mobile and desktop sync 

  - Versioning and undelete 

  - Galleries and activity feed 

  - File editing and preview support for PDF, images, text files, Open Document, Word files and more. 

  - Smooth performance and easy user interface. 

  - Fine-grained control over access to data and sharing capabilities by user and by group.


  Note: After logging in to Nextcloud please change the password to something secure before sharing the address with anyone.
releaseNotes: >-
  This update adds support for new storage management and configuration options being introduced with umbrelOS 2.0.


  Previous Nextcloud 34.0.4 release notes:


  Nextcloud 34.0.4 is a maintenance update for Nextcloud 34. If you're updating from a pre-34 version, the upgrade may take a few minutes while Nextcloud runs its update steps; leave the app running until it comes back online.


  Highlights:
    - 📁 Fixes issues across Files, WebDAV, file requests, external storage, previews, versions, trash cleanup, and link shares
    - 📅 Improves Activity, Contacts, notifications, federation, Photos, Text, Viewer, and sharing behavior
    - 🔐 Includes security and reliability maintenance for code signing, password and token checks, 2FA/WebAuthn, migrations, and sensitive config masking


  If you use extra Nextcloud apps, check for app updates in Nextcloud after upgrading.


  Full release notes are found at https://github.com/nextcloud-releases/server/releases/tag/v34.0.4
developer: Nextcloud GmbH
website: https://nextcloud.com
dependencies: []
repo: https://github.com/nextcloud/server
support: https://help.nextcloud.com/categories
port: 8081
gallery:
  - 1.jpg
  - 2.jpg
  - 3.jpg
path: ""
defaultUsername: umbrel
deterministicPassword: true
torOnly: false
submitter: Umbrel
