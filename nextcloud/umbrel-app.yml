manifestVersion: 1.1
id: nextcloud
storage:
  dataRoot: data
category: files
name: Nextcloud
version: "35.0.0"
tagline: Productivity platform that keeps you in control
description: >-
  Nextcloud puts your data at your fingertips, under your control.
  Store your documents, calendar, contacts and photos on your Umbrel instead of
  some company's data center. Features:


  - Mobile and desktop sync 

  - Versioning and undelete 

  - Galleries and activity feed 

  - File editing and preview support for PDF, images, text files, Open Document, Word files and more. 

  - Smooth performance and easy user interface. 

  - Fine-grained control over access to data and sharing capabilities by user and by group.


  Note: After logging in to Nextcloud please change the password to something secure before sharing the address with anyone.
releaseNotes: >-
  Nextcloud 35 is a major release. Updating from an older version can take a while as Nextcloud automatically works through each required upgrade. The app will be unavailable during the update; keep your Umbrel powered on until it finishes.


  This update also upgrades the database to MariaDB 10.11, as required by Nextcloud 35. Existing data is migrated automatically.


  Highlights:
    - 📁 Improves Files, WebDAV, sharing, file requests, trashbin, versions, previews, and external storage behavior
    - 📅 Includes maintenance fixes across Activity, Contacts, Calendar, notifications, federation, Photos, Text, Viewer, and workflow apps
    - 🔐 Includes security and reliability hardening for authentication, tokens, 2FA/WebAuthn, encryption, migrations, and sensitive configuration handling


  If you use extra Nextcloud apps, check for app updates in Nextcloud after upgrading.


  Full release notes are found at https://github.com/nextcloud-releases/server/releases/tag/v35.0.0

developer: Nextcloud GmbH
website: https://nextcloud.com
dependencies: []
repo: https://github.com/nextcloud/server
support: https://help.nextcloud.com/categories
port: 8081
gallery:
  - 1.jpg
  - 2.jpg
  - 3.jpg
path: ""
defaultUsername: umbrel
deterministicPassword: true
torOnly: false
submitter: Umbrel
submission: https://github.com/getumbrel/umbrel/commit/dcaae95daa8ee3d7e8044d55d13887d8ff353030
