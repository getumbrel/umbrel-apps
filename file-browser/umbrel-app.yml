manifestVersion: 1
id: file-browser
category: files
name: File Browser
version: "2.63.23"
tagline: Browse and manage the files you download on your Umbrel
description: >-
  File Browser lets you upload, delete, preview, rename and edit your folders and files.


  Easily manage files in the Umbrel's storage folder where your downloads from apps like Transmission, Sonarr, Radarr, and Lidarr are currently held.
releaseNotes: >-
  Key updates in this version:
    - File Browser is winding down; this is the last planned release, with the upstream repository scheduled to be archived on September 1, 2026
    - Tightened path and access-rule checks for safer scoped file operations
    - Fixed stalled and frozen uploads, recursive operation checks, and expired proxy-token handling
    - Updated project links, PWA icon URLs, sidebar scrolling, translations, and dependencies


  Full release notes are available at https://github.com/filebrowser/filebrowser/releases/tag/v2.63.23
developer: File Browser
website: https://filebrowser.org/
dependencies: []
repo: https://github.com/filebrowser/filebrowser
support: https://github.com/filebrowser/filebrowser/issues
port: 7421
gallery:
  - 1.jpg
  - 2.jpg
  - 3.jpg
path: "/files/"
deterministicPassword: false
torOnly: false
submitter: Umbrel
submission: https://github.com/getumbrel/umbrel-apps/pull/169
