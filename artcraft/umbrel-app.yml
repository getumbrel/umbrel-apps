manifestVersion: 2.0
id: artcraft
storage:
  dataRoot: data
category: media
name: ArtCraft
version: "0.16.0-ls9"
tagline: A creative desktop for photos, vectors, video, and PDFs
description: >-
  ArtCraft brings eight open-source creative applications to your browser in a shared desktop: PhotoCraft, VectorCraft, FilmCraft, LightCraft, PdfCraft, EffectCraft, DesignCraft, and FigCraft.


  Requires umbrelOS 2.0 or later. Open the app over HTTPS and sign in with the username and password shown by Umbrel. Launch a creative application from the desktop, and use the browser sidebar to transfer files. Save your projects in the home folder so they remain available after restarts and updates.


  Edit images with layers and masks in PhotoCraft, draw vector illustrations in VectorCraft, work with video in FilmCraft, and organize and develop photos in LightCraft. PdfCraft provides PDF tools, EffectCraft handles motion graphics and compositing, DesignCraft offers page layout, and FigCraft supports interface design and prototyping.


  The applications run on your Umbrel and stream their desktop to your browser. They are under active development, and feature completeness varies between applications. Large photos and video projects can require substantial CPU and memory resources. All browser sessions share the same desktop and files.


  This package contains the Craft creative suite distributed by LinuxServer.io. It does not include the separate ArtCraft AI image and video generation application.
