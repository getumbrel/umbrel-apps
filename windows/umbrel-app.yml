manifestVersion: 1
id: windows
category: networking
name: Windows
version: "6.05"
tagline: Run Windows inside a Docker container
description: >-
  Windows for Docker (by dockur) runs a full Windows installation inside a
  container using QEMU with KVM hardware acceleration, and streams the
  desktop to your browser via noVNC — no separate VM software required.

  On first start it downloads the selected Windows version directly from
  Microsoft and installs it unattended; no ISO or product key is needed to
  get started (evaluation media). The Windows version, language, disk size,
  RAM and CPU allocation can all be adjusted via environment variables in
  the app's docker-compose.yml.

  A standard RDP client can also be pointed at port 3389 for a lower-latency
  session instead of the browser viewer.
