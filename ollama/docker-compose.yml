version: '3.7'

services:
  app_proxy:
    environment:
      APP_HOST: ollama_ollama_1
      APP_PORT: 11434
      PROXY_AUTH_ADD: "false"

  ollama:
    image: ollama/ollama:0.40.14@sha256:ebaef4f4c5d93660e1f25f8ad085a112f51ccfb0e8458073e71793959dba91c9
    environment:
      GODEBUG: "multipathtcp=0"
      OLLAMA_ORIGINS: "*"
      OLLAMA_CONTEXT_LENGTH: 8192
      OLLAMA_VULKAN: "1"
      OLLAMA_IGPU_ENABLE: "1"
    volumes:
      - ${APP_DATA_DIR}/data:/root/.ollama
    restart: on-failure
