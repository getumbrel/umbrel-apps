category: files
name: Vikunja
version: "2.7.0"
tagline: The open-source, self-hostable to-do app
description: >-
  Think of Vikunja like the notebook you have with all your things to keep track of. But with superpowers.


  🗂️ Stay Organized

  Organize all of your tasks in projects. Create subprojects organize everything hierarchical and keep related stuff grouped together.


  👥 Collaborate With Peers

  Vikunja lets you easily share a project with another user or a whole team! Assignments show who's working on what.


  🛠️ Use It How You Need It

  You can view your tasks in the classic list view - or in a Gantt Chart, or Table view, or Kanban Board. Whatever you need!
releaseNotes: >-
  🚨 This release includes six security fixes. Upgrading is highly recommended.


  Key highlights in this release:
    - Adds an MCP server so AI assistants can work with tasks using scoped tokens
    - Introduces a redesigned date picker across due dates, reminders, filters, and Gantt views
    - Adds outgoing proxy support for webhooks, avatars, migrations, OpenID Connect, and Pro license checks
    - Improves performance for task and project access queries, database connections, and API token checks
    - Fixes and improvements for CalDAV, Todoist imports, checklists, rich-text descriptions, table view priorities, and OpenID account linking


  Note: The login cookie security fix can require older Vikunja desktop apps to log in more often.


  Full release notes are available at https://vikunja.io/changelog/vikunja-2.7.0-was-released/
