manifestVersion: 1
id: embroidery-converter
storage:
  dataRoot: data
category: files
name: Embroidery File Converter
version: "1.0.0"
tagline: View and convert PES, DST, JEF, EXP and VP3 embroidery files
description: >-
  Embroidery File Converter is a browser-only viewer and converter for machine embroidery files. Open a PES, DST, JEF,
  EXP or VP3 file, check the preview and the stitch facts, then download it as another format. Conversion runs in your
  browser, so your files never leave your device and nothing is uploaded to your Umbrel.


  It is a TypeScript port of pystitch, the library Ink/Stitch uses for machine files. The readers and writers are
  tested against pystitch: on a synthetic test corpus the writers produce the same bytes and the readers return the same stitches for the same input, with documented
  exceptions (stand-in colours for designs that store none). Limits: 1,000,000 stitches or 30 MB per file. Always test-stitch a converted file
  before production.


  Made by MavenWright, the team behind StitchKit (a commercial embroidery app). The converter itself is free and MIT
  licensed.
