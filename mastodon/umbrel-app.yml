description: >-
  Mastodon is a free, open-source, decentralized social network built on the
  ActivityPub protocol. Run your own instance on Umbrel and join the fediverse.


  FIRST-RUN SETUP


  Your admin account is created automatically on first start:


  - Username: admin

  - Password: mastodon-umbrel (change it after your first login under
  Preferences -> Account -> Security)


  Federation note: to federate beyond your LAN, point a real domain at this
  server and set LOCAL_DOMAIN accordingly.
