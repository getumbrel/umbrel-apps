services:
  app_proxy:
    environment:
      APP_HOST: kraskus-zec-solo_ui_1
      APP_PORT: 8080
  zallet-init:
    image: ghcr.io/kraskuscrypto/kraskus-zec-solo-wallet-controller:0.5.2@sha256:51c9eda6c7b601e200593f6a7b1cfab70f5fc31838508db88737f83038d1f157
    user: 0:0
    entrypoint:
    - /bin/sh
    - -c
    command:
    - 'mkdir -p /var/lib/zallet

      chown 10001:10001 /var/lib/zallet

      chmod 700 /var/lib/zallet

      mkdir -p /kraskus-config/app-token

      chown 0:0 /kraskus-config/app-token

      chmod 700 /kraskus-config/app-token

      '
    volumes:
    - ${APP_DATA_DIR}/data/kraskus/zallet:/var/lib/zallet
    - ${APP_DATA_DIR}/data/config:/kraskus-config
    restart: 'no'
    network_mode: none
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
  kraskus:
    image: ghcr.io/kraskuscrypto/kraskus-zec-solo-wallet-controller:0.6.4@sha256:c4feeac65b00521ff4c59b4e7e77f6addf73f073b70b1d2b50b07a1eb621392d
    restart: unless-stopped
    depends_on:
      zallet-init:
        condition: service_completed_successfully
      zebra:
        condition: service_started
    environment:
      KRASKUS_BASE: /data
      KRASKUS_PACKAGED_MODE: '1'
      KRASKUS_ZEBRA_RPC_URL: http://zebra:18232
      KRASKUS_ZEBRA_COOKIE_FILE: /zebra/.cookie
      KRASKUS_ZALLET_RPC_URL: http://127.0.0.1:28232
      KRASKUS_ZALLET_SUPERVISOR_URL: http://127.0.0.1:28233
      KRASKUS_MINER_ADDRESS_FILE: /kraskus-config/miner-address
      KRASKUS_NETWORK_FILE: /kraskus-config/network
      KRASKUS_STRATUM_HOST: 0.0.0.0
      KRASKUS_STRATUM_PORT: 3337
      KRASKUS_STRATUM_HEALTH_HOST: 127.0.0.1
      KRASKUS_STRATUM_HEALTH_PORT: 18402
      KRASKUS_STRATUM_STATUS_URL: http://127.0.0.1:18402/status
      KRASKUS_APP_TOKEN_FILE: /kraskus-config/app-token/token
    volumes:
    - ${APP_DATA_DIR}/data/kraskus:/data
    - ${APP_DATA_DIR}/data/zebra:/zebra:ro
    - ${APP_DATA_DIR}/data/config:/kraskus-config
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add:
    - DAC_OVERRIDE
    ports:
    - 3337:3337/tcp
  zebra:
    image: zfnd/zebra:7.0.0@sha256:a70d2be8ffef3a4b6e37355724e36a0e6c1838e46baa28bfb216739f00cf2d34
    restart: unless-stopped
    entrypoint:
    - /bin/bash
    - -c
    - "#!/usr/bin/env bash\n# Sync is independent of payout setup. Only the controller projects an explicitly\n# enabled external payout into miner-address; never read legacy wallet records.\nset -eu\nCONFIG_DIR=/kraskus-config\nMINER_FILE=\"$${KRASKUS_MINER_ADDRESS_FILE:-$$CONFIG_DIR/miner-address}\"\nNETWORK_FILE=\"$${KRASKUS_NETWORK_FILE:-$$CONFIG_DIR/network}\"\nchild=''\nstop_child() {\n    if [[ -n \"$$child\" ]]; then\n        kill -TERM \"$$child\" 2>/dev/null || true\n        wait \"$$child\" 2>/dev/null || true\n        child=''\n    fi\n}\ntrap 'stop_child; exit 0' TERM INT\nuntil [[ -f \"$$CONFIG_DIR/zebra-start-allowed\" ]]; do sleep 2 & wait $$! || true; done\nnetwork=$$(cat \"$$NETWORK_FILE\")\ncase \"$$network\" in Mainnet|Testnet) ;; *) echo 'Refusing invalid network' >&2; exit 78;; esac\nexport ZEBRA_NETWORK__NETWORK=\"$$network\"\n# Use Zebra's supported v28 -> v29 migration. Never remove/rename/symlink state.\nexport ZEBRA_STATE__DELETE_OLD_DATABASE=false\nunset CONFIG_FILE_PATH\n\
      cache=\"$${ZEBRA_STATE__CACHE_DIR:-/home/zebra/.cache/zebra}\"\ncookie_dir=\"$${ZEBRA_RPC__COOKIE_DIR:-$$cache}\"\nmkdir -p \"$$cache\" \"$$cookie_dir\"\nchown -R 10001:10001 \"$$cache\"\nif [[ \"$$cookie_dir\" != \"$$cache\" ]]; then chown -R 10001:10001 \"$$cookie_dir\"; fi\nread_payout() {\n    local value=''\n    [[ ! -f \"$$MINER_FILE\" ]] || value=$$(cat \"$$MINER_FILE\")\n    # Reject malformed text without blocking non-authoring synchronization.\n    if [[ \"$$network\" = Mainnet && \"$$value\" =~ ^t1[1-9A-HJ-NP-Za-km-z]{33}$$ ]] ||\n       [[ \"$$network\" = Testnet && \"$$value\" =~ ^tm[1-9A-HJ-NP-Za-km-z]{33}$$ ]]; then\n        printf '%s' \"$$value\"\n    fi\n}\nstart_child() {\n    if [[ -n \"$$payout\" ]]; then\n        export ZEBRA_MINING__MINER_ADDRESS=\"$$payout\"\n    else\n        unset ZEBRA_MINING__MINER_ADDRESS\n    fi\n    setpriv --reuid=10001 --regid=10001 --init-groups zebrad &\n    child=$$!\n}\npayout=$$(read_payout)\nstart_child\nwhile true; do\n    sleep\
      \ 2 & wait $$! || true\n    if ! kill -0 \"$$child\" 2>/dev/null; then\n        status=0\n        wait \"$$child\" || status=$$?\n        exit \"$$status\"\n    fi\n    # Networks are package-fixed. Refuse a runtime network change rather than\n    # silently switching chains or falling back to a different network.\n    if [[ ! -f \"$$NETWORK_FILE\" || \"$$(cat \"$$NETWORK_FILE\")\" != \"$$network\" ]]; then\n        stop_child\n        exit 78\n    fi\n    next_payout=$$(read_payout)\n    if [[ \"$$next_payout\" != \"$$payout\" ]]; then\n        stop_child\n        payout=\"$$next_payout\"\n        start_child\n    fi\ndone\n"
    environment:
      ZEBRA_NETWORK__LISTEN_ADDR: 0.0.0.0:18233
      ZEBRA_RPC__LISTEN_ADDR: 0.0.0.0:18232
      ZEBRA_RPC__COOKIE_DIR: /home/zebra/.cache/zebra
      ZEBRA_STATE__CACHE_DIR: /home/zebra/.cache/zebra
      KRASKUS_NETWORK_FILE: /kraskus-config/network
      KRASKUS_MINER_ADDRESS_FILE: /kraskus-config/miner-address
    volumes:
    - ${APP_DATA_DIR}/data/zebra:/home/zebra/.cache/zebra
    - ${APP_DATA_DIR}/data/config:/kraskus-config:ro
    security_opt:
    - no-new-privileges:true
    stop_grace_period: 10m
  ui:
    image: ghcr.io/kraskuscrypto/kraskus-zec-solo-wallet-controller:ui-0.6.2@sha256:b2a490afdd1ae4808c1bed704a9e76761a1f282246986f4233ac85556cc3535a
    restart: unless-stopped
    depends_on:
      zallet-init:
        condition: service_completed_successfully
      kraskus:
        condition: service_started
    environment:
      ADAPTER_HOST: kraskus
    volumes:
    - ${APP_DATA_DIR}/data/config/app-token:/run/kraskus-app-token:ro
    stop_grace_period: 5s
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q --spider http://127.0.0.1:8080/index.html
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - SETGID
    - SETUID
