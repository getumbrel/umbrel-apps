manifestVersion: 1
id: amp
storage:
  dataRoot: data
category: media
name: AMP
version: "28" # NOTE: version for the wrapper image; AMP itself is updated independently of this wrapper
tagline: Run and manage multiple game servers from your browser
description: >-
  ⚠️ AMP requires a paid licence. The app installs and opens without one, but game server instances cannot start until you activate a licence.


  AMP (Application Management Panel) is a web-based control panel for creating, configuring and managing game servers such as Minecraft, Factorio, Valheim, Garry's Mod, Team Fortress 2, Starbound and Satisfactory. Create multiple instances, install and update game files, edit configs, manage backups and watch consoles from one dashboard.


  First-run setup:

  1. Buy a licence at https://cubecoders.com/AMP

  2. Open AMP and sign in with the credentials shown in the Umbrel app

  3. In the ADS interface, go to `Configuration` → `Instance Deployment` → `Deployment Defaults`, choose `Reactivate Local Instances` and enter your licence key


  This app runs the community-maintained `mitchtalmadge/amp-dockerized` image. It is unofficial and is not affiliated with or supported by CubeCoders.

  The panel uses host networking so game servers you create can bind their own ports directly; game traffic is not protected by Umbrel's authentication
releaseNotes: ""
developer: CubeCoders
website: https://cubecoders.com/AMP
dependencies: []
repo: https://github.com/MitchTalmadge/AMP-dockerized
support: https://github.com/MitchTalmadge/AMP-dockerized/issues
port: 7443
gallery: []
path: ""
defaultUsername: "admin"
deterministicPassword: true
submitter: lachlanharrisdev
submission: https://github.com/getumbrel/umbrel-apps/pull/0 # TODO: update to actual submission
