releaseNotes: >-
  ⚠️ Back up your OpenReader data before updating. This release migrates the database automatically. If upgrading from v4 or earlier, export important documents first: v5 removes old generated-audio and audiobook caches, and older browser-only data may require the original browser to recover. Reading progress in EPUBs may reset when upgrading from before v5.2.


  - EPUB and PDF pages now follow the spoken word more precisely, including sentences that cross PDF page breaks.

  - Local EPUB and Markdown documents no longer automatically load remote resources that could reveal your IP address. Markdown lets you choose when to load remote images.

  - Connected OAuth apps can generate speech from short text using your speech settings without adding it to your library.


  Full release notes can be found at https://github.com/richardr1126/openreader/releases/tag/v5.5.3
