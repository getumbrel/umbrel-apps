manifestVersion: 1
id: technitium-dns
storage:
  dataRoot: data
category: networking
name: Technitium DNS Server
version: "15.5.0"
tagline: Block ads & malware at the DNS level for your entire network
description: >-
  Technitium DNS Server is an open source authoritative, as well as recursive, DNS server that can be used for self hosting a DNS server for privacy & security.
  It works out-of-the-box with no or minimal configuration.
releaseNotes: >-
  This update adds LDAP authentication support, a Zone File Editor for Primary and Conditional Forwarder zones, and new Docker environment options for static API sessions and custom web UI assets.


  It also fixes a DNS-over-HTTPS/3 denial-of-service issue, improves Docker shutdown handling, adds QUIC support in the container, and includes other minor bug fixes and improvements.


  Full release notes can be found at https://github.com/TechnitiumSoftware/DnsServer/releases/tag/v15.5.0
developer: Technitium
website: https://technitium.com/dns/
dependencies: []
repo: https://github.com/TechnitiumSoftware/DnsServer
support: https://github.com/TechnitiumSoftware/DnsServer/discussions
port: 5380
gallery:
