manifestVersion: 1
id: technitium-dns
storage:
  dataRoot: data
category: networking
name: Technitium DNS Server
version: "15.6.2"
tagline: Block ads & malware at the DNS level for your entire network
description: >-
  Technitium DNS Server is an open source authoritative, as well as recursive, DNS server that can be used for self hosting a DNS server for privacy & security.
  It works out-of-the-box with no or minimal configuration.
releaseNotes: >-
  This update includes security fixes and improvements:
    - Fixed a zone permission boundary issue that could allow users to modify records in a separate subdomain zone.
    - Fixed a denial-of-service issue caused by a stream of empty UDP packets.
    - Fixed configuration synchronization issues in cluster deployments.
    - Dashboard statistics now link to filtered query logs.


  Full release notes can be found at https://github.com/TechnitiumSoftware/DnsServer/releases/tag/v15.6.2
developer: Technitium
website: https://technitium.com/dns/
dependencies: []
repo: https://github.com/TechnitiumSoftware/DnsServer
support: https://github.com/TechnitiumSoftware/DnsServer/discussions
port: 5380
gallery:
  - 1.jpg
  - 2.jpg
  - 3.jpg
path: ""
defaultUsername: admin
deterministicPassword: true
submitter: highghlow
submission: https://github.com/getumbrel/umbrel/pull/1046
