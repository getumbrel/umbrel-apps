manifestVersion: 1
id: technitium-dns
storage:
  dataRoot: data
category: networking
name: Technitium DNS Server
version: "15.5.1"
tagline: Block ads & malware at the DNS level for your entire network
description: >-
  Technitium DNS Server is an open source authoritative, as well as recursive, DNS server that can be used for self hosting a DNS server for privacy & security.
  It works out-of-the-box with no or minimal configuration.
releaseNotes: >-
  This service update fixes recursive resolver limit issues that could affect resolution for some domain names.


  It also fixes a session token prefix oracle vulnerability, an XSS vulnerability in the Logs view, and includes other minor bug fixes and improvements.


  Full release notes can be found at https://github.com/TechnitiumSoftware/DnsServer/releases/tag/v15.5.1
developer: Technitium
website: https://technitium.com/dns/
dependencies: []
repo: https://github.com/TechnitiumSoftware/DnsServer
support: https://github.com/TechnitiumSoftware/DnsServer/discussions
port: 5380
gallery:
  - 1.jpg
  - 2.jpg
  - 3.jpg
path: ""
defaultUsername: admin
deterministicPassword: true
submitter: highghlow
submission: https://github.com/getumbrel/umbrel/pull/1046
