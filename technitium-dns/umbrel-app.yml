manifestVersion: 1
id: technitium-dns
storage:
  dataRoot: data
category: networking
name: Technitium DNS Server
version: "15.6.0"
tagline: Block ads & malware at the DNS level for your entire network
description: >-
  Technitium DNS Server is an open source authoritative, as well as recursive, DNS server that can be used for self hosting a DNS server for privacy & security.
  It works out-of-the-box with no or minimal configuration.
releaseNotes: >-
  This update adds a new setting to explicitly enable or disable Cache Prefetch.


  It also fixes recursive resolution issues in Prefer IPv6 mode, DNS cache CNAME shadowing issues, multiple authenticated DoS issues, a session token prefix oracle vulnerability, and a log injection vulnerability.


  Full release notes can be found at https://github.com/TechnitiumSoftware/DnsServer/releases/tag/v15.6.0
developer: Technitium
website: https://technitium.com/dns/
dependencies: []
repo: https://github.com/TechnitiumSoftware/DnsServer
support: https://github.com/TechnitiumSoftware/DnsServer/discussions
port: 5380
gallery:
