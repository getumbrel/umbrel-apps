manifestVersion: 1
id: originless
storage:
  dataRoot: data
name: Originless
version: "1.0.0"
tagline: "Zero-auth backend for signed events, binary blobs, and live P2P mesh"
category: files
description: >-
  Originless is a zero-auth, zero-account, zero-password backend for the open web.
  It delivers cryptographically signed event sourcing, content-addressed binary blob
  storage, real-time live streaming (SSE), and global peer-to-peer mesh sync in a
  single lightweight binary with zero external dependencies.

  Identity is an Ed25519 keypair you hold in your client or agent; the server
  only verifies cryptographic signatures. No user accounts, passwords, or API keys
  to leak or rotate.

  Includes an embedded web control panel, live SVG telemetry studio, in-browser
  Web Crypto Ed25519 signer, drag-and-drop blob vault, and /agent.txt AI skill
  instructions for Cursor, Claude, Copilot, ChatGPT, and Antigravity.
releaseNotes: >-
  v1.0.0 Genesis Mainnet Release:
  - Zero-Auth Backend: Cryptographic Ed25519 signatures, zero accounts or passwords.
  - Immutable Signed Events: Event sourcing with SHA-256 IDs, TTLs, and label queries.
  - Content-Addressed Binary Blobs: SHA-256 content verification and atomic multipart publishing.
  - Automatic P2P Mesh: Zero-config libp2p DHT discovery, WebSocket & QUIC-v1 on port 3232, and Bloom filter sync.
  - Real-Time Live SSE: Instant Server-Sent Events stream (/events/stream).
  - Autonomous AI Agent Skill: Every node serves /agent.txt machine-readable skill contract.
  - Embedded Control Panel: Pure-white dashboard with ORIGINLESS live telemetry hero and SVG visualizers.
  - Port Update: Streamlined down to single port 3232 (TCP & UDP) for both HTTP API and P2P mesh.
developer: "besoeasy"
