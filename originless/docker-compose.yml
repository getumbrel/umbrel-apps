version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: originless_app_1
      APP_PORT: 3232

  app:
    image: ghcr.io/besoeasy/originless:1.0.3@sha256:03a592fe5c1f0cc7fd5089304519e5bd13cd82e9a02ef1ad46fc9a7a4c23813b
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    ports:
      - "3232:3232/udp"
    volumes:
      - ${APP_DATA_DIR}/data:/data
