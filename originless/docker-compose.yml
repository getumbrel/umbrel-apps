version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: originless_app_1
      APP_PORT: 3232

  app:
    image: ghcr.io/besoeasy/originless:2026.10.29@sha256:0c4d26dc62be154213d7144c99e6cf979329414acd8c2ae98a5bb82416961d62
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    ports:
      - "3232:3232/udp"
    volumes:
      - ${APP_DATA_DIR}/data:/data
