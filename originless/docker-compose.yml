version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: originless_app_1
      APP_PORT: 3232

  app:
    image: ghcr.io/besoeasy/originless:1.0.8@sha256:2109d03f3ed39838eeb177db80dac829d7cdd314f1a57981eed3e3acff963cfb
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    ports:
      - "3232:3232/udp"
    volumes:
      - ${APP_DATA_DIR}/data:/data
