version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: originless_app_1
      APP_PORT: 3232

  app:
    image: ghcr.io/besoeasy/originless:1.0.0@sha256:29c22351dc87e1e18f53cd380a569db413b75032d3808e21cab456259efea342
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    ports:
      - "3232:3232/udp"
    volumes:
      - ${APP_DATA_DIR}/data:/data
