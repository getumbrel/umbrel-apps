manifestVersion: 1
id: bazarr
storage:
  dataRoot: data
category: media
name: Bazarr
version: "1.6.1-patch.1"
tagline: Manage and download subtitles for Sonarr and Radarr
description: >-
  Bazarr is a companion application to Sonarr and Radarr that manages and downloads subtitles based on your requirements.
  You define your preferences by TV show or movie and Bazarr takes care of everything for you.


  Bazarr does not scan your disk to detect series and movies. It only takes care of the series and movies that are indexed in Sonarr and Radarr.


  🛠️ SET-UP INSTRUCTIONS
  
  During initial set-up, you will need to input your Umbrel device's IP address to connect to Sonarr and/or Radarr.
  You can find your device's IP address by visiting your router's admin dashboard or by using an IP scanning tool like Angry IP Scanner.
  You will also need to input your API key for Sonarr and/or Radarr. You can find your API keys in the settings of the Sonarr and Radarr apps.
releaseNotes: >-
  This update adds support for new storage management and configuration options being introduced with umbrelOS 2.0.


  Previous Bazarr 1.6.1 release notes:


  Key improvements in this release include:
    - Improved Sonarr and Radarr sync reliability in edge racing-condition cases
    - Added SubsDump and SubtitleCat subtitle providers
    - Improved provider matching and resilience for Gestdown, OpenSubtitles, AnimeTosho, SubDL, LegendasNet, Jimaku, SuperSubtitles, and GreekSubs
    - Improved embedded subtitle indexing, language fallback, and regional language mappings
    - Redesigned settings areas, including split settings tabs, language mappings, Plex/Jellyfin settings, and login/history pages
    - Added database indexes and safer logging/path handling for better performance and security


  Full release notes are found at https://github.com/morpheus65535/bazarr/releases/tag/v1.6.1
developer: morpheus65535
