manifestVersion: 1.1
id: invidious
category: social
name: Invidious
version: "2.20261103.0"
tagline: Browse YouTube without tracking or ads
description: >-
  An open source alternative front-end to YouTube


  User Features:
   - Lightweight
   - No ads
   - No tracking
   - No JavaScript required
   - Light/Dark themes
   - Customizable homepage
   - Subscriptions independent from Google
   - Notifications for all subscribed channels
   - Audio-only mode (with background play on mobile)
   - Available in many languages, thanks to our translators

  Data Import/Export:
   - Import subscriptions from YouTube, NewPipe and Freetube
   - Import watch history from NewPipe
   - Export subscriptions to NewPipe and Freetube
   - Import/Export Invidious user data

  Technical features:
   - Embedded video support
   - Developer API
   - Does not use official YouTube APIs
   - No Contributor License Agreement (CLA)

developer: IV-Org
website: https://invidious.io/
dependencies: []
repo: https://github.com/iv-org/invidious
support: https://matrix.to/#/#invidious:matrix.org
port: 3420
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
path: ""
defaultUsername: ""
defaultPassword: ""
torOnly: false
releaseNotes: >-
  This release improves channel navigation, playback, subscription exports, and companion proxying.


  Key highlights:
    - Custom channel handle URLs now support tab paths, including streams
    - Clicking a timestamp starts playback and scrolls to the video
    - Channel pages now support the shows tab
    - A minute badge has been added to the watch page
    - Subscriptions can now be exported as JSON for NewPipe
    - Published dates and view counts for collaborative videos are parsed correctly
    - FreeTube OPML subscription exports have been fixed
    - Companion proxying has been improved


  Breaking changes: Reddit integration and the hd720 quality option have been removed.


  For full release notes, visit https://github.com/iv-org/invidious/releases
submitter: Jasper
submission: https://github.com/getumbrel/umbrel-apps/pull/129
