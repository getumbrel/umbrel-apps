version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: uchiyomi_server_1
      APP_PORT: 3000
      # Clients that cannot carry the Umbrel login: OPDS readers (HTTP Basic with a per-user token, and the
      # image routes those readers load covers and pages from), scripts using a personal API token, and the
      # Mihon/Tachiyomi extension, which checks its connection on /healthz and /auth/me before it browses
      # /api and /img. Each of those paths is protected by the app's own authentication (/healthz only says
      # the server is up). First-run setup stays behind Umbrel.
      PROXY_AUTH_WHITELIST: "/opds,/opds/*,/img,/img/*,/api,/api/*,/healthz,/auth/me"
      PROXY_AUTH_BLACKLIST: "/api/setup,/api/setup/*"

  server:
    image: ghcr.io/angelosha/uchiyomi:v0.61.2@sha256:a225e271d1e1f20f7a4d27f502324aa72e0f61d764654784e09a733785671642
    restart: on-failure
    # The app finishes the chapter it is writing on stop, then the embedded Postgres checkpoints.
    stop_grace_period: 40s
    environment:
      # The image's entrypoint starts as root, takes ownership of the app-owned paths, and drops to this uid.
      PUID: 1000
      PGID: 1000
      NODE_ENV: production
      PORT: "3000"
      # No DATABASE_URL: Postgres runs inside the container, on a unix socket, in /data.
      LIBRARY_BACKEND: owned
      PUBLIC_ORIGIN: http://${DEVICE_DOMAIN_NAME}:${APP_PROXY_PORT}
      JWT_SECRET: ${APP_UCHIYOMI_JWT_SECRET}
      FLARESOLVERR_URL: http://uchiyomi_flaresolverr_1:8191
      SOURCES_DIR: /sources
      CUSTOM_SITES_FILE: /config/sites.json
      BACKUP_KEEP: "14"
      # Tells Admin → Sources which setup steps to open on (v0.49.0), and nothing else: here, that an Umbrel app
      # cannot add the optional extension engine. An older image ignores it.
      UCHIYOMI_PLATFORM: umbrel
    volumes:
      - ${UMBREL_ROOT}/data/storage/downloads/manga:/library
      - ${APP_DATA_DIR}/data/db:/data
      - ${APP_DATA_DIR}/data/config:/config
      - ${APP_DATA_DIR}/data/downloads:/library-dl
      - ${APP_DATA_DIR}/data/cache:/cache
      - ${APP_DATA_DIR}/data/backups:/backups

  # Cloudflare solver: most manga aggregators sit behind Cloudflare, so the fetching half needs it. It is
  # only contacted when a source needs it. Chrome writes to shared memory, and Docker's default 64 MB makes
  # it crash mid-challenge; a memory cap turns its slow leak into a clean restart.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767
    restart: on-failure
    shm_size: 1gb
    mem_limit: 2g
    environment:
      LOG_LEVEL: warning
