releaseNotes: >-
  Gitea Mirror 3.34.0 lets multi-source installs choose which source an organization imports and mirrors from. The Add Organization dialog now includes a Source picker, organization cards get an inline source editor, and repository counts, mirror jobs, and deletion are scoped to the selected source. Single-source setups are unchanged.


  This release also preserves manually chosen organization source pins during bulk import, and fixes organization mirror jobs so another user's repositories with the same organization name are not picked up.


  Migration note: 3.34.0 runs migration 0020 on first start. It adds `organizations.source_id` and fills it only for organizations whose repositories all come from one source; organizations spanning multiple sources, or with no repositories, stay unpinned. Back up `data/gitea-mirror.db` and your Gitea or Forgejo instance before upgrading.


  If you're updating from a version older than 3.33.0, Gitea Mirror also creates the sources table, backfills repository source IDs, and widens repository uniqueness rules for multi-source support. Back up before upgrading, especially if you use repository move or cleanup flows.


  Reminder for users updating from 3.27.1 or older: repository cleanup no longer archives or deletes copies in Gitea or Forgejo automatically when the original GitHub repository is no longer found.


  If you're updating from a version older than 3.17 and use OAuth provider clients registered in Gitea Mirror, rotate the client secret for each client after upgrading because OAuth application secrets are stored hashed after migration.


  Full release notes can be found at https://github.com/RayLabsHQ/gitea-mirror/releases/tag/v3.34.0
