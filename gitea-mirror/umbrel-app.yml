releaseNotes: >-
  Gitea Mirror 3.35.1 includes the 3.35.0 public-organization mirroring update and a follow-up security rebuild. You can now add public GitHub, GitLab, or Gitea/Forgejo organizations without configuring a source account, then later attach credentials to the generated source if needed.


  Public-only sources can sync, schedule, and recover mirror jobs with only the destination token, and issue, pull request, label, and milestone mirroring now uses the repository's own source client. Public-only mirroring only covers public repositories and is rate-limited by unauthenticated provider limits; private repositories, starred lists, and personal discovery still need a token.


  The 3.35.1 image raises security-related dependency floors for Astro, @xmldom/xmldom, sharp, svgo, and js-yaml. Upstream reports no migration or configuration change is required beyond pulling the new image.


  If you're updating from a version older than 3.34.0, Gitea Mirror also adds organization source pins and earlier multi-source database migrations. Back up `data/gitea-mirror.db` and your Gitea or Forgejo instance before upgrading.


  Reminder for users updating from 3.27.1 or older: repository cleanup no longer archives or deletes copies in Gitea or Forgejo automatically when the original GitHub repository is no longer found.


  If you're updating from a version older than 3.17 and use OAuth provider clients registered in Gitea Mirror, rotate the client secret for each client after upgrading because OAuth application secrets are stored hashed after migration.


  Full release notes can be found at https://github.com/RayLabsHQ/gitea-mirror/releases/tag/v3.35.1


  Release notes for the included 3.35.0 update can be found at https://github.com/RayLabsHQ/gitea-mirror/releases/tag/v3.35.0
