releaseNotes: >-
  Gitea Mirror 3.28.0 adds release limits that can be set per repository or per organization, so mirrors with long release histories can keep only the newest releases and assets.


  Repository descriptions and topics are now kept in sync with GitHub on every sync. Existing mirrors pick up GitHub description changes automatically, but descriptions edited by hand in Gitea will be replaced by the GitHub description on the next sync.


  Mobile repository cards now use the full available width with improved badge, status, and last-sync layout.


  No migration is required for this update.


  Reminder for users updating from 3.27.1 or older: repository cleanup no longer archives or deletes copies in Gitea or Forgejo automatically when the original GitHub repository is no longer found.


  If you're updating from a version older than 3.17 and use OAuth provider clients registered in Gitea Mirror, rotate the client secret for each client after upgrading because OAuth application secrets are stored hashed after migration.


  Full release notes can be found at https://github.com/RayLabsHQ/gitea-mirror/releases/tag/v3.28.0
