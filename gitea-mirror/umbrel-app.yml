releaseNotes: >-
  Gitea Mirror 3.27.2 restores SSO sign-in with identity providers hosted on your home network, including split-DNS setups. The login page now also shows an error when SSO sign-in fails instead of silently returning to the sign-in button.


  Repository cleanup is now safer by default. When the original repository is no longer found on GitHub, cleanup only updates its entry in Gitea Mirror and leaves the copy in Gitea or Forgejo untouched. If you previously relied on cleanup to archive or delete those copies, that will no longer happen automatically after this update.


  If you're updating from a version older than 3.17 and use OAuth provider clients registered in Gitea Mirror, rotate the client secret for each client after upgrading because OAuth application secrets are stored hashed after migration.


  Full release notes can be found at https://github.com/RayLabsHQ/gitea-mirror/releases/tag/v3.27.2
