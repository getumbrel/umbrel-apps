releaseNotes: >-
  Gitea Mirror 3.32.1 rebuilds the container image with hardened permissions so the runner no longer ships setuid or setgid binaries, and documents why the Debian util-linux scan alerts do not affect this image.


  The bundled git-lfs binary was rebuilt with updated Go crypto/networking dependencies to address upstream security advisories. There are no application changes and no new migration for users already on 3.32.0.


  If you're updating from a version older than 3.32.0, back up `data/gitea-mirror.db` and your Gitea or Forgejo instance before using the mirror-move flow added in 3.32.0. The 3.31.0 startup migration records each repository's destination host.


  Reminder for users updating from 3.27.1 or older: repository cleanup no longer archives or deletes copies in Gitea or Forgejo automatically when the original GitHub repository is no longer found.


  If you're updating from a version older than 3.17 and use OAuth provider clients registered in Gitea Mirror, rotate the client secret for each client after upgrading because OAuth application secrets are stored hashed after migration.


  Full release notes can be found at https://github.com/RayLabsHQ/gitea-mirror/releases/tag/v3.32.1
