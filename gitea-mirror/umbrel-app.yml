releaseNotes: >-
  This update adds beta support for mirroring repositories from any Git host with an HTTP or HTTPS clone URL. Add repositories individually on the Repositories page; branches and tags are mirrored, but organizations, releases, issues, and SSH remotes are not supported. Use the Always Backup snapshot strategy to protect these mirrors against rewritten history.

  GitLab listings can optionally start with a smaller batch using GITLAB_PAGE_SIZE (10–100, default 100) for slow servers. Automatic batch reduction remains enabled.

  🔒 Includes Astro security fixes for image-endpoint file access and dynamic-tag attribute injection.

  🔒 This update also includes the earlier security fix that prevents externally linked Forgejo release assets from exhausting the mirror's memory. Linked downloads are limited to 512 MB and 15 minutes; assets exceeding either limit are skipped with a warning. Assets hosted directly by the source have no size cap.

  This update also includes the previous security fixes for source-token exposure when mirroring externally linked Forgejo release assets, requests to private addresses, and destination tokens following redirects to another host.

  If you mirror releases from a Forgejo source such as Codeberg using a token and mirror repositories you do not fully trust, rotate that source token. Externally linked assets on private or local addresses are now skipped with a warning.

  ⚠️ Back up your Gitea or Forgejo instance and review release limits and filters before upgrading. The next sync can delete older releases: retention and release filters now inspect all destination releases, not just the newest 30. Previously untrimmed releases beyond your limit or excluded by your filters will be removed.

  If you're updating from a version older than 3.50.0, you can also filter GitHub issues by state, optionally skip comments or media, and filter repositories by destination owner. Disabling media removes it from mirrored issue bodies on their next sync; existing comments keep their media.

  If you're updating from a version older than 3.49.0, you can also optionally remove attachments from older mirrored releases to reclaim storage. This setting is off by default; enabling it deletes attachments beyond each repository's asset limit while keeping release notes and tags. The Activity Log also loads correctly after release-filter warnings.

  Reminder: release filters added in 3.44.0 delete already-mirrored releases that no longer match on the next sync. Preview the affected releases in the tag rules dialog before saving, and back up your Gitea instance. Existing configurations keep mirroring all releases until you enable a filter.

  If you're updating from a version older than 3.42.0, GitHub App installation authentication is also available as an alternative to personal access tokens. GitHub App-backed mirrors require Gitea 1.27 or later. Keep Gitea Mirror's scheduler enabled for these mirrors, as Gitea's independent pull schedule is disabled. Use personal access tokens with older Gitea versions, Forgejo, starred repositories, or star lists. Existing token-based mirrors are unchanged.

  If you're updating from a version older than 3.36.2, Gitea Mirror also includes scheduling, organization ignore/include, and destination display fixes. Existing configurations are not touched. New configurations start with scheduling off unless `SCHEDULE_ENABLED=true`, `SCHEDULE_INTERVAL`, or `GITEA_MIRROR_INTERVAL` enables it.

  If you're updating from a version older than 3.34.0, Gitea Mirror also adds organization source pins and earlier multi-source database migrations. Back up `data/gitea-mirror.db` and your Gitea or Forgejo instance before upgrading.

  Reminder for users updating from 3.27.1 or older: repository cleanup no longer archives or deletes copies in Gitea or Forgejo automatically when the original GitHub repository is no longer found.

  If you're updating from a version older than 3.17 and use OAuth provider clients registered in Gitea Mirror, rotate the client secret for each client after upgrading because OAuth application secrets are stored hashed after migration.

  Full release notes can be found at https://github.com/RayLabsHQ/gitea-mirror/releases/tag/v3.53.0
