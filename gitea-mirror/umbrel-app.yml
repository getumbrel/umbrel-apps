releaseNotes: >-
  Gitea Mirror 3.27.0 adds per-repository and per-organization mirror options, so settings like Git LFS, issues, pull requests, releases, wikis, labels, and milestones can override the global defaults when needed.


  This release also disables options that cannot take effect and explains why, fixes updates that could clear a destination override, and makes scheduled syncs honor the configured mirror settings. Existing repositories and organizations keep inheriting the global options until you set an override.


  If you're updating from a pre-3.17 version and use OAuth provider clients registered in Gitea Mirror, rotate the client secret for each client after upgrading because OAuth application secrets are stored hashed after migration.


  Full release notes can be found at https://github.com/RayLabsHQ/gitea-mirror/releases/tag/v3.27.0
