releaseNotes: >-
  This update fixes multiple security issues and adds release mirroring for Gitea and Forgejo sources.


  Key highlights:
    - Fixed unauthenticated connection-test endpoints that could make server-side requests to user-supplied URLs.
    - Closed email sign-up after the first account exists unless `AUTH_ALLOW_SIGNUP=true` is explicitly set.
    - Scoped SSO provider management to the user who created each provider, and stopped returning OIDC client secrets from the API.
    - Hardened user-supplied notification and discovery URLs against link-local/cloud-metadata requests and redirects while keeping private-network mirroring supported.
    - Added release mirroring for Gitea and Forgejo sources, including Codeberg.


  Upgrade notes: if your instance has more than one account, rotate the OIDC client secrets of configured SSO providers after updating.


  If you're updating from a version older than 3.36.2, Gitea Mirror also includes scheduling, organization ignore/include, and destination display fixes. Existing configurations are not touched. New configurations start with scheduling off unless `SCHEDULE_ENABLED=true`, `SCHEDULE_INTERVAL`, or `GITEA_MIRROR_INTERVAL` enables it.


  If you're updating from a version older than 3.36.1, Gitea Mirror also includes fixes for duplicate release assets, organization destination overrides, crash recovery, duplicate source-row scheduling/import behavior, and progress checkpoint handling.


  If you're updating from a version older than 3.34.0, Gitea Mirror also adds organization source pins and earlier multi-source database migrations. Back up `data/gitea-mirror.db` and your Gitea or Forgejo instance before upgrading.


  Reminder for users updating from 3.27.1 or older: repository cleanup no longer archives or deletes copies in Gitea or Forgejo automatically when the original GitHub repository is no longer found.


  If you're updating from a version older than 3.17 and use OAuth provider clients registered in Gitea Mirror, rotate the client secret for each client after upgrading because OAuth application secrets are stored hashed after migration.


  Full release notes can be found at https://github.com/RayLabsHQ/gitea-mirror/releases/tag/v3.38.1
