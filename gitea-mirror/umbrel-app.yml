releaseNotes: >-
  Gitea Mirror 3.33.0 adds multi-source support so GitHub, GitHub Enterprise, GitLab, and Gitea/Forgejo sources can be connected side by side, with discovery, import, scheduling, cleanup, reconcile, and push-target flows using each source's own credentials.


  Organization mirroring now supports a per-organization Skip forks setting, and GitLab or Gitea/Forgejo sources now show source-specific organization/group wording, links, and validation.


  The release also fixes source-specific settings behavior and hardens token settings links so pasted JavaScript URLs cannot become link targets. The container includes an upstream VEX note for the currently unfixed Debian zlib advisory; upstream says the affected gz* file-writing API is not used by Git, git-lfs, or Bun's zlib stream bindings in this image.


  Migration note: 3.33.0 creates a new sources table, seeds it from your existing connection, backfills repository source IDs, and widens repository uniqueness rules to include the source. Back up `data/gitea-mirror.db` and your Gitea or Forgejo instance before upgrading, especially if you use repository move or cleanup flows.


  Reminder for users updating from 3.27.1 or older: repository cleanup no longer archives or deletes copies in Gitea or Forgejo automatically when the original GitHub repository is no longer found.


  If you're updating from a version older than 3.17 and use OAuth provider clients registered in Gitea Mirror, rotate the client secret for each client after upgrading because OAuth application secrets are stored hashed after migration.


  Full release notes can be found at https://github.com/RayLabsHQ/gitea-mirror/releases/tag/v3.33.0
