releaseNotes: >-
  🔒 Only the first account created can now manage SSO providers and OAuth applications. After upgrading a shared instance, review your SSO providers: providers added by other accounts stay disabled until the owner edits and saves them. Delete any you do not recognize. Affected accounts are signed out once, their OAuth tokens are removed, and their API keys are disabled.

    - Export settings, sources, and repository choices to a JSON file without credentials. Import the file with a preview of changes; new sources that need tokens stay disabled until you enter them.
    - Limit how many pre-releases keep downloaded assets without losing their release notes and tags. Optional old-asset pruning deletes attachments beyond this limit when enabled.
    - Repository cleanup now checks public-only sources correctly, including sources without a username or token.
    - GitLab and Gitea/Forgejo sources, Forgejo destinations, and Git LFS mirroring are no longer marked beta.

  🔒 Saved source, destination, and notification secrets are now hidden from configuration and source API responses, including read-only API keys. Scripts that read these endpoints must keep their own credentials. Leaving a secret blank preserves it; changing its scheme, host, or port requires entering a new token.

  SSO now restricts new accounts and account linking to the provider's configured email domain. If you use SSO, check that each provider's Domain is your users' email domain, not the provider's hostname. Existing SSO users are unaffected.

  Settings no longer reset at restart when credentials are set through environment variables. Large release assets now stream through temporary files instead of consuming excessive memory; keep enough free app-data space for the largest asset. Long-running initial imports are also handled more reliably.

  Back up data/gitea-mirror.db and your Gitea or Forgejo instance before upgrading, especially when skipping older versions. Release retention and filters inspect all destination releases and can delete older or excluded releases on the next sync. Preview tag rules before enabling filters. Optional attachment pruning also deletes attachments beyond the configured limit.

  Earlier security fixes prevent source-token exposure and unsafe redirects or private-address downloads for externally linked Forgejo assets. If you mirror untrusted Forgejo repositories with a token, rotate that source token. External assets are limited to 512 MB and 15 minutes; larger or slower assets are skipped.

  If updating from before 3.50.0, disabling issue media removes it from mirrored issue bodies on their next sync; existing comments keep it. GitHub App-backed mirrors require Gitea 1.27 or later and Gitea Mirror's scheduler; use personal access tokens with older Gitea, Forgejo, starred repositories, or star lists.

  New configurations start with scheduling off unless enabled through environment variables. Repository cleanup no longer automatically archives or deletes destination copies when a source disappears. If updating from before 3.17 and using registered OAuth provider clients, rotate each client secret after upgrading.

  Full release notes can be found at https://github.com/RayLabsHQ/gitea-mirror/releases/tag/v3.59.0
