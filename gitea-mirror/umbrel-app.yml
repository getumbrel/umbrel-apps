releaseNotes: >-
  Gitea Mirror 3.29.0 redesigns the activity log so rows are more compact, the whole row opens details, and status summaries above the log filter the current repository and organization states.


  Adding a repository or organization now accepts GitHub URLs, clone URLs, SSH remotes, owner/name shorthand, and deep links, filling in the owner and repository fields automatically.


  This update also fixes duplicate page scrollbars, improves tablet and list layouts, keeps repository filter controls clearer, and refreshes Settings and Identity Provider card presentation.


  No migration is required for this update. These changes are presentation-focused and do not change mirroring behavior.


  Reminder for users updating from 3.27.1 or older: repository cleanup no longer archives or deletes copies in Gitea or Forgejo automatically when the original GitHub repository is no longer found.


  If you're updating from a version older than 3.17 and use OAuth provider clients registered in Gitea Mirror, rotate the client secret for each client after upgrading because OAuth application secrets are stored hashed after migration.


  Full release notes can be found at https://github.com/RayLabsHQ/gitea-mirror/releases/tag/v3.29.0
