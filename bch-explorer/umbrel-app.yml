manifestVersion: 1
id: bch-explorer
category: crypto
name: BCH Explorer
version: "1.0.0"
tagline: Self-hosted Bitcoin Cash block explorer
description: >-
  Explore the Bitcoin Cash blockchain privately with your own node. Browse blocks, transactions and address histories without sending your lookups to a third-party explorer.


  BCH Explorer reads blocks and transactions from your Bitcoin Cash Node app and address histories from Fulcrum (BCH), so no setup is needed.


  **Network connections:** to show fiat prices, the explorer fetches exchange rates from Kraken, Coinbase, Bitfinex and Gemini. It also downloads a list of known mining pools from the developer's GitHub once a week, and your browser fetches CashToken names and icons from public token registries and IPFS when you view a token.


  Donations are never expected, but if LoneStrike Labs apps are useful to you, they help development continue: qpp8hg2n60mhhlsr2apw6l60x5vrdq0vp5pq3j4gyt
