manifestVersion: 1
id: mealie
storage:
  dataRoot: data
category: files
name: Mealie
version: "3.30.0"
tagline: A Place for All Your Recipes
description: >-
  Mealie is a self hosted recipe manager and meal planner. Easily add recipes by providing
  the url and Mealie will automatically import the relevant data or add a family recipe with the UI editor. Mealie also
  provides an API for interactions from 3rd party applications.


  Key Features:
  
  - Recipe imports: Create recipes, by importing from a URL or entering data manually

  - Meal Planner: Use the Meal Planner to plan your what you'll cook for the next week

  - Shopping List: Put the necessary ingredients on your Shopping List, organised into sections of your local supermarket

  - Cookbooks: Group recipes into Cookbooks based on your own criteria

  - Localisation: Translations for 35+ languages
developer: Hayden
website: https://docs.mealie.io/
dependencies: []
repo: https://github.com/hay-kot/mealie
support: https://github.com/hay-kot/mealie/issues
port: 9925
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
path: ""
defaultUsername: ""
defaultPassword: ""
torOnly: false
submitter: Umbrel
submission: https://github.com/getumbrel/umbrel-apps/pull/608
releaseNotes: >-
  This update adds customizable AI prompts in group settings, durations for individual recipe instructions, and meal plans for an entire week.


  You can also sort recipes by total time, import pasted Mealie recipe exports with their full structure, and see recipe owners. This release improves shopping list ingredient scaling, image upload handling, and permission checks.


  Mealie now blocks server-initiated requests to private network addresses by default for URL imports, recipe images, webhooks, and recipe actions. If you use these features with local network targets, configure Mealie's HTTP_ALLOW_LIST setting to explicitly allow those targets.


  Full release notes can be found at https://github.com/mealie-recipes/mealie/releases/tag/v3.30.0
