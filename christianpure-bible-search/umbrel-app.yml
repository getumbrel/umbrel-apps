name: Christian Pure Bible Search
version: "0.1.0"
tagline: Find what the Bible says about anything, and a prayer to pray
description: >-
  Type a worry, a question or a verse, and Christian Pure Bible Search shows the Bible passages on it, a prayer you
  can pray now, and Christian Pure articles to read next. Everything is searched on your Umbrel, so what you type
  stays with you, and it keeps working with no internet connection.


  - The whole Berean Standard Bible, with every chapter one click away from each verse.

  - 6,699 subjects, from anxiety and grief to money worries and marriage, with the verses from OpenBible.info's topical data and Christian Pure's verse pages.

  - 340 prayers from Christian Pure, for illness, grief, worry, money, meals, meetings and more.

  - Type a reference such as John 3:16 or Psalm 23 to read it straight away.
