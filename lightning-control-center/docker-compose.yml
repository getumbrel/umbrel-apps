version: "3.7"
services:
  app:
    image: sparkielabs/lightning-control-center:0.1.3@sha256:b96c12d9465577f48cbc65ead475d10cb04fe4536d85ff11d6cacedf6ed67aea
    restart: on-failure
    network_mode: host
    environment:
      - RPC_USER=${APP_BITCOIN_RPC_USER}
      - RPC_PASS=${APP_BITCOIN_RPC_PASS}
      - RPC_HOST=${APP_BITCOIN_RPC_HOST}
      - RPC_PORT=${APP_BITCOIN_RPC_PORT}
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
