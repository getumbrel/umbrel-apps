version: "3.7"
services:
  app:
    image: sparkielabs/lightning-control-center:0.1.3@sha256:b6414e5ac96da9f550fc8f3086c0ae5953c7e45ff3c6b54dadfb6a9cfddadab7
    restart: on-failure
    network_mode: host
    environment:
      - RPC_USER=${APP_BITCOIN_RPC_USER}
      - RPC_PASS=${APP_BITCOIN_RPC_PASS}
      - RPC_HOST=${APP_BITCOIN_RPC_HOST}
      - RPC_PORT=${APP_BITCOIN_RPC_PORT}
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
