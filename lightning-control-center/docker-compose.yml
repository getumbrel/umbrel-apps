version: "3.7"
services:
  app:
    image: sparkielabs/lightning-control-center:0.1.4@sha256:50aa5587154dd9175e89d98457599e37a809285decebe7fff661b894b6e7cd9e
    restart: on-failure
    network_mode: host
    command: uvicorn lcc_api:app --host 0.0.0.0 --port 8793
    environment:
      - RPC_USER=${APP_BITCOIN_RPC_USER}
      - RPC_PASS=${APP_BITCOIN_RPC_PASS}
      - RPC_HOST=${APP_BITCOIN_RPC_HOST}
      - RPC_PORT=${APP_BITCOIN_RPC_PORT}
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
