manifestVersion: 1.1
id: adventurelog
storage:
  dataRoot: data
category: files
name: AdventureLog
version: "v0.14.0"
tagline: Self-hostable travel tracker and trip planner
description: >-
  🗺️ Starting from a simple idea of tracking travel locations (called adventures), AdventureLog has grown into a full-fledged travel companion. With AdventureLog, you can log your adventures, keep track of where you've been on the world map, plan your next trip collaboratively, and share your experiences with friends and family.


  AdventureLog was created to solve a problem: the lack of a modern, open-source, user-friendly travel companion. Many existing travel apps are either too complex, too expensive, or too closed-off to be useful for the average traveler. AdventureLog aims to be the opposite: simple, beautiful, and open to everyone.
releaseNotes: >-
  🚨 Still signing in to AdventureLog with admin/admin? After this update that login stops working. Your admin password is changed to the password shown for AdventureLog in Umbrel. If you already changed your password, nothing changes and you keep signing in as before.


  ⚠️ Back up before updating. Apps or scripts that use the AdventureLog API need updating, because its addresses have changed. HTML typed into notes now shows as plain text. Markdown formatting is unchanged.


  This release fixes security issues and introduces day-by-day trip planning, sharing roles, guest links, and published travel stories.


  - Organize trips by dates or day numbers, with drag-and-drop stops, notes, and checklists.

  - Share plans with editors or viewers, control what appears in travel stories, and follow comments and activity.

  - Export printable Trip Books and Field Guides, and import activities from GPX, FIT, TCX, KML, or KMZ files.

  - Enjoy redesigned place and profile pages, background processing, and lower memory use.


  Full release notes can be found at https://github.com/seanmorley15/AdventureLog/releases/tag/v0.14.0
developer: Sean Morley
