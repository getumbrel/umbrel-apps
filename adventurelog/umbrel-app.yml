manifestVersion: 1.1
id: adventurelog
category: files
name: AdventureLog
version: "v0.13.1"
tagline: Self-hostable travel tracker and trip planner
description: >-
  🗺️ Starting from a simple idea of tracking travel locations (called adventures), AdventureLog has grown into a full-fledged travel companion. With AdventureLog, you can log your adventures, keep track of where you've been on the world map, plan your next trip collaboratively, and share your experiences with friends and family.


  AdventureLog was created to solve a problem: the lack of a modern, open-source, user-friendly travel companion. Many existing travel apps are either too complex, too expensive, or too closed-off to be useful for the average traveler. AdventureLog aims to be the opposite: simple, beautiful, and open to everyone.
releaseNotes: >-
  AdventureLog v0.13.1 "Cadillac" includes important security updates and improvements to travel logging and account management.


    - Detect duplicate places when adding locations and log today's visit in one click
    - Choose a preferred date format used throughout the app
    - Export and import richer collection ZIP files, including trip dates, lodging, transport, notes, and checklists
    - Sign in with a username or email and manage active sessions in reorganized settings
    - Improved maps, location editing, and long itinerary PDF exports
    - Security fixes across the backend, frontend, and container images


  CARTO map styles now require an API key. Without one, the app uses OpenFreeMap and falls back from previously saved CARTO styles automatically.


  Full release notes can be found at https://github.com/seanmorley15/AdventureLog/releases/tag/v0.13.1
