manifestVersion: 1.1
id: gitea
storage:
  dataRoot: data
category: developer
name: Gitea
version: "28.4.0"
tagline: A painless self-hosted Git service
description: >-
  Gitea is a painless self-hosted Git service. It is similar to
  GitHub, Bitbucket, and GitLab. It is a community managed lightweight code
  hosting solution written in Go. Gitea's minimal requirements allow it to run
  seamlessly on inexpensive hardware like a Raspberry Pi. Features:


    - Fully self-hosted and private
    - Issue tracker
    - Account/Organization/Repository management
    - Tor support
    - Repository Git hooks/deploy keys
    - Repository issues, pull requests and wiki
    - Add/Remove repository collaborators
    - Gravatar and custom source
    - Admin panel
developer: Gitea
website: https://gitea.io/en-us/
dependencies: []
repo: https://github.com/go-gitea/gitea
support: https://discourse.gitea.io
port: 8085
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  This update includes security improvements to access checks, organization and issue visibility, repository mirror credentials, and two-factor authentication. We recommend updating as soon as possible.


  Git pushes and issue notifications are more reliable. This release also improves Actions workflows and live synchronization, fixes wiki previews and pasted code formatting, and adds support for OCI 1.1 container image names.


  Full release notes: https://github.com/go-gitea/gitea/releases/tag/v28.4.0

torOnly: false
submitter: Umbrel
