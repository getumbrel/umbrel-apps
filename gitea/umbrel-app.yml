releaseNotes: >-
  Gitea 1.27.3 is a follow-up to the recent Gitea 1.27 major update. If you're updating from a pre-1.27 version, note that Gitea 1.27 includes breaking changes for reusable workflows and adds Content-Security-Policy script nonces, which may affect custom integrations that rely on old workflow behavior or inline scripts.


  If you're already on Gitea 1.27, this update fixes security issues around package access, repository attachments, markup access checks, Actions artifact signatures, API permissions, hidden repositories, Git hooks, and issue search. It also includes fixes for Actions workflow rendering and validation, repository migrations, pull request merge state, Swift package versioning, dashboard feeds, and user/API handling.


  Full release notes: https://github.com/go-gitea/gitea/releases/tag/v1.27.3
