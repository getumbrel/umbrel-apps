manifestVersion: 1.1
id: gitea
storage:
  dataRoot: data
category: developer
name: Gitea
version: "28.1.0"
tagline: A painless self-hosted Git service
description: >-
  Gitea is a painless self-hosted Git service. It is similar to
  GitHub, Bitbucket, and GitLab. It is a community managed lightweight code
  hosting solution written in Go. Gitea's minimal requirements allow it to run
  seamlessly on inexpensive hardware like a Raspberry Pi. Features:


    - Fully self-hosted and private
    - Issue tracker
    - Account/Organization/Repository management
    - Tor support
    - Repository Git hooks/deploy keys
    - Repository issues, pull requests and wiki
    - Add/Remove repository collaborators
    - Gravatar and custom source
    - Admin panel
developer: Gitea
website: https://gitea.io/en-us/
dependencies: []
repo: https://github.com/go-gitea/gitea
support: https://discourse.gitea.io
port: 8085
gallery:
  - 1.jpg
  - 2.jpg
  - 3.jpg
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  Gitea 28.1.0 improves npm package client compatibility and fixes a wide range of issues across Actions, pull requests, Git repository handling, markup rendering, OAuth scope approvals, API responses, protected-branch pushes, raw file caching, organization profiles, and MySQL/MariaDB transaction behavior.


  It also adds missing checks to several API and web handlers and tightens egress range handling.


  Full release notes: https://github.com/go-gitea/gitea/releases/tag/v28.1.0
torOnly: false
submitter: Umbrel
