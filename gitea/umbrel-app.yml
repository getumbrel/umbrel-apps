path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  Gitea 28.0.0 is a major update that changes Gitea's versioning scheme from 1.x to calendar-based releases. It includes breaking changes for Git network operations, egress settings, and Actions run retention, so review any custom Git/network or Actions configuration after updating.


  This release adds audit logging, admin user impersonation, bot account management, deploy tokens, expanded Actions APIs and queue views, project APIs, package/admin API improvements, personal access token regeneration, repository quick switching, diff search/filtering, and many repository, workflow, package, UI, and admin improvements.


  It also includes security fixes for Git object validation, SSH public-key identification, fork PR Actions approval gates, repository-scoped authorization, and SSH denial-of-service hardening.


  Full release notes: https://github.com/go-gitea/gitea/releases/tag/v28.0.0
