manifestVersion: 1.1
id: gitea
storage:
  dataRoot: data
category: developer
name: Gitea
version: "28.3.0"
tagline: A painless self-hosted Git service
description: >-
  Gitea is a painless self-hosted Git service. It is similar to
  GitHub, Bitbucket, and GitLab. It is a community managed lightweight code
  hosting solution written in Go. Gitea's minimal requirements allow it to run
  seamlessly on inexpensive hardware like a Raspberry Pi. Features:


    - Fully self-hosted and private
    - Issue tracker
    - Account/Organization/Repository management
    - Tor support
    - Repository Git hooks/deploy keys
    - Repository issues, pull requests and wiki
    - Add/Remove repository collaborators
    - Gravatar and custom source
    - Admin panel
developer: Gitea
website: https://gitea.io/en-us/
dependencies: []
repo: https://github.com/go-gitea/gitea
support: https://discourse.gitea.io
port: 8085
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  This update includes security improvements to access checks, token permissions, and account linking. We recommend updating as soon as possible.


  Issue and pull request dashboards and lists are faster. This release also improves code diffs and review comments, fixes Git LFS downloads and repository migrations, and improves Actions workflow reliability.


  Full release notes: https://github.com/go-gitea/gitea/releases/tag/v28.3.0

torOnly: false
