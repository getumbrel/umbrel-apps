services:
  app_proxy:
    environment:
      APP_HOST: litecoin-fulcrum_app_1
      APP_PORT: 3006
  app:
    image: ghcr.io/ryleastark/umbrel-litecoin-fulcrum-gui:v1.0.12@sha256:60fa47b8e6db311cac8744b0bf2f760bdf402aebb4ab25186478aac784ca8649
    depends_on: [fulcrum]
    restart: on-failure
    environment:
      ELECTRUM_HIDDEN_SERVICE: "${APP_LITECOIN_FULCRUM_RPC_HIDDEN_SERVICE}"
      ELECTRUM_LOCAL_SERVICE: "${DEVICE_DOMAIN_NAME}"
      FULCRUM_HOST: "${APP_LITECOIN_FULCRUM_NODE_IP}"
      FULCRUM_PORT: "${APP_LITECOIN_FULCRUM_NODE_PORT}"
      ELECTRUM_PORT: "${APP_LITECOIN_FULCRUM_NODE_PORT}"
      LITECOIN_HOST: "${APP_LITECOIN_NODE_IP}"
      RPC_USER: "${APP_LITECOIN_RPC_USER}"
      RPC_PASSWORD: "${APP_LITECOIN_RPC_PASS}"
      RPC_PORT: "${APP_LITECOIN_RPC_PORT}"
    volumes: ["${APP_DATA_DIR}/data/fulcrum-logs:/fulcrum-logs"]
    networks:
      default: {ipv4_address: $APP_LITECOIN_FULCRUM_IP}
  fulcrum:
    image: cculianu/fulcrum:v2.1.2@sha256:0af448db05f259206a55d68d099a4742168e9eaedb007e8f700b31920653375f
    init: true
    stop_grace_period: 5m
    restart: on-failure
    user: "1000:1000"
    environment:
      TCP: 0.0.0.0:${APP_LITECOIN_FULCRUM_NODE_PORT}
      ADMIN: 0.0.0.0:${APP_LITECOIN_FULCRUM_ADMIN_PORT}
      BITCOIND: ${APP_LITECOIN_NODE_IP}:${APP_LITECOIN_RPC_PORT}
      RPCUSER: ${APP_LITECOIN_RPC_USER}
      RPCPASSWORD: ${APP_LITECOIN_RPC_PASS}
      PEERING: "false"
      ANNOUNCE: "false"
      DATA_DIR: /data
    command: >
      sh -c 'rm -f /tmp/fulcrum.pipe; mkfifo /tmp/fulcrum.pipe;
      tee -a /logs/fulcrum.log < /tmp/fulcrum.pipe &
      exec Fulcrum -D /data --ts-format=utc _ENV_ > /tmp/fulcrum.pipe 2>&1'
    volumes:
      - "${APP_DATA_DIR}/data/fulcrum:/data"
      - "${APP_DATA_DIR}/data/fulcrum-logs:/logs"
    ports: ["${APP_LITECOIN_FULCRUM_NODE_PORT}:${APP_LITECOIN_FULCRUM_NODE_PORT}"]
    networks:
      default: {ipv4_address: $APP_LITECOIN_FULCRUM_NODE_IP}

  tor:
    image: ghcr.io/getumbrel/tor:0.4.9.11@sha256:e382b8629c0dfef6ceb396b062622d4e4e955b19d6f16b883fd2c0723ad5671a
    user: "1000:1000"
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/torrc:/etc/tor/torrc:ro
      - ${TOR_DATA_DIR}:/data
    environment:
      HOME: "/tmp"
    networks:
      default: {ipv4_address: $APP_LITECOIN_FULCRUM_TOR_IP}
