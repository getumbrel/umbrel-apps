path: ''
releaseNotes: >-
  This update brings Invoice Ninja from 5.13.53 to 5.14.0:

  - Clients can pick optional quote items when approving a quote.
  - Entity lists can show totals per currency.
  - Reports can be exported as XML.
  - Purchase order shipping addresses now name the recipient.
  - Improves task filters, payment failure handling, and access controls for related records.
  - Fixes e-invoice (ZUGFeRD) tax calculations, document filters, numbering, charts, exports, and Google re-authentication.


  Full release notes are available at https://github.com/invoiceninja/invoiceninja/releases
