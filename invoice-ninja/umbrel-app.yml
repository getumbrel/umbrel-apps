releaseNotes: >-
  This update adds new payment gateway integrations and improves taxes, reports, sync, and payment workflows.


  - Added CHIP and secure Helcim payment gateway integrations.


  - Improved QuickBooks sync, automatic tax handling, tax period reporting, and generated counters.


  - Fixed Stripe refunds, Authorize.net rounding, payment reports with archived invoices, webhook secrets, and several payment gateway flows.


  - Improved quote layout in the client portal, task ordering, rich text CSS layouts, translations, and client field validation.


  Full release notes are available at https://github.com/invoiceninja/invoiceninja/releases/tag/v5.13.27
