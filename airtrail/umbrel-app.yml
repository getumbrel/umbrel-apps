manifestVersion: 1
id: airtrail
storage:
  dataRoot: data
category: files
name: AirTrail
version: "3.14.0"
tagline: A modern, open-source personal flight tracking system
description: >-
  A web application that allows users to track their flights and view their flight history.


  Features:

  - **World Map**: View all your flights on an interactive world map.

  - **Flight History**: Keep track of all your flights in one place.

  - **Statistics**: Get insights into your flight history with statistics.

  - **Multiple Users**: Manage multiple users, share flights among them, secure your data with user authentication and integrate with your OAuth provider.

  - **Responsive Design**: Use the application on any device with a responsive design.

  - **Dark Mode**: Switch between light and dark mode.
  
  - **Import Flights**: Import flights from various sources including MyFlightRadar24, App in the Air and JetLog.
releaseNotes: >-
  This update introduces a redesigned statistics page with ranked lists, bar charts, and filters that open the matching flights.


  - Subscribe to your flights from a calendar app using the optional calendar feed in Settings → Export. Treat the feed URL like a password: anyone with it can see flight details, including notes and seats.

  - Import flights from LogMyTrip and fill takeoff and landing times from uploaded tracks.

  - View country flags in flight lists and optionally enable aircraft photos from Planespotters.net.

  - Fix shared flight lists being cut off, tracks crossing the antimeridian, and several OAuth sign-in and account-management issues.


  Full release notes: https://github.com/johanohly/AirTrail/releases/tag/v3.14.0

developer: Johan Ohly
website: https://airtrail.johan.ohly.dk
