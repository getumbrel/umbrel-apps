category: files
name: AirTrail
version: "3.13.0"
tagline: A modern, open-source personal flight tracking system
description: >-
  A web application that allows users to track their flights and view their flight history.


  Features:

  - **World Map**: View all your flights on an interactive world map.

  - **Flight History**: Keep track of all your flights in one place.

  - **Statistics**: Get insights into your flight history with statistics.

  - **Multiple Users**: Manage multiple users, share flights among them, secure your data with user authentication and integrate with your OAuth provider.

  - **Responsive Design**: Use the application on any device with a responsive design.

  - **Dark Mode**: Switch between light and dark mode.
  
  - **Import Flights**: Import flights from various sources including MyFlightRadar24, App in the Air and JetLog.
releaseNotes: >-
  This update adds roles and permissions, including editable built-in User and Administrator roles and custom roles that control who can view or edit flights.


  It also adds a versioned REST API and remote MCP server with scoped API keys, configurable basemap providers, richer flight-list indicators, guest passenger suggestions, and direct AeroDataBox API support.


  Existing accounts are migrated automatically to the new role model, existing API keys retain full access, and the legacy /api/flight/* endpoints remain available but are deprecated.


  This release also fixes mobile drawer behavior, preference changes resetting other preferences, iOS GPX/KML track selection, day/month date entry, and updates AirTrail's map dependencies.

