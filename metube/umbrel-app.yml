manifestVersion: 1
id: metube
category: media
name: MeTube
version: "2026.10.09"
tagline: Download videos from YouTube
description: >-
  Download videos from YouTube (and dozens of other sites) directly to your Umbrel.
developer: Alex Shnitman
dependencies: []
permissions:
  - STORAGE_DOWNLOADS
repo: https://github.com/alexta69/metube
port: 3700
releaseNotes: >-
  Key highlights:
    - Adds playlist browsing so you can pick entries before queuing them
    - Ships FFmpeg 8.1 so clip downloads keep their video
    - Asks for confirmation before clearing failed downloads
    - Improves the message shown when MeTube's own UI is refused behind a Host-rewriting proxy


  Full release notes can be found at https://github.com/alexta69/metube/releases/tag/2026.10.09
support: https://github.com/alexta69/metube/issues
website: https://github.com/alexta69/metube
gallery:
