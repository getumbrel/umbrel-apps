releaseNotes: >-
  This update adds sign-in through any OpenID Connect provider, such as Keycloak, Authentik, Authelia, Pocket ID or VoidAuth. Set it up in Admin, Settings, Auth, and register http://umbrel.local:3081/auth/oidc/callback (with your device's address) as the redirect URI at your provider.


  Senders can now give a bundle a download limit. Each file in the bundle is deleted after its last allowed download, and a download counts only once the whole file has been sent. A limited bundle needs an expiry.


  Google sign-in now checks a signed ID token. A Google account that Google does not report as verified can no longer sign in.


  Single sign-on links to an existing account only when HermitStash has confirmed that its owner controls the email address. Since Umbrel turns email verification off, existing users link single sign-on from their profile page, where they can also unlink it.


  The app now runs on Node.js 26.


  Full release notes can be found at https://github.com/dotCooCoo/hermitstash/releases/tag/v1.16.2 and in the v1.16.0 entry of https://github.com/dotCooCoo/hermitstash/blob/main/CHANGELOG.md
