releaseNotes: >-
  This update keeps a file's local copy when S3 storage reports a short upload, and stops S3 uploads and downloads from holding their data in memory for two minutes after they finish.


  It also reports a damaged vault key file as damaged rather than as a wrong passphrase, makes the daily database vacuum free space, prefers the strongest post-quantum key exchange a client supports, accepts vault uploads when the file size limit is off, and checks outbound TLS certificate chains up to a trusted root.


  If you moved files from local storage to S3 on 1.15.9, check the bucket for objects of 0 bytes and restore those files from a backup. The first start of this version rebuilds the database once, which needs free space of about the database's size.


  Full release notes can be found at https://github.com/dotCooCoo/hermitstash/releases/tag/v1.15.10
