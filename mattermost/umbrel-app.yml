releaseNotes: >-
  Mattermost 11.10.0 adds beta rich-text message composition, media gallery layouts for posts with multiple files, silent posts for bots and integrations, and personal access token expiry/rotation notifications.


  Admins also get new team and attribute-based access control improvements, non-compliant token revocation tools, real-time job status updates in the System Console, and CSV exports that include team memberships.


  This release includes no-downtime database schema changes, updates bundled plugins, and fixes issues with web notification privacy, Markdown rendering, search, shared channels, uploads, and more.


  Full release notes can be found at https://docs.mattermost.com/product-overview/mattermost-v11-changelog.html#release-v11-10-feature-release
