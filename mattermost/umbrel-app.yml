dependencies: []
releaseNotes: >-
  This update improves messaging, file sharing, and search.


  - Improved rich text editing with Markdown images, Markdown paste, and more consistent formatting.
  - Download all attachments from the media gallery as a single ZIP file.
  - Added an out-of-office notice when messaging someone with automatic replies enabled.
  - Fixed message search for numbers in hyphenated words and drafts reappearing after sending.


  If upgrading from a version earlier than 12.0, update community plugins to versions compatible with Mattermost 12 before upgrading.


  Full release notes can be found at https://github.com/mattermost/mattermost/releases/tag/v12.1.0
