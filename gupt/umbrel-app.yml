name: Gupt
version: "4.1.9"
releaseNotes: >-
  Gupt 4.1.9 simplifies private group rooms. Groups now use a single name-based ID, remove the old admin/roster metadata, and include member information in group messages. The group creation screen can also select trusted contacts directly.


  If you're updating from a pre-v2 version, your Gupt identity will remain, but conversations, Vault entries, and groups created in Gupt v1 will not be available in Gupt v2 or later. Gupt v2+ also cannot communicate with Gupt v1 clients, so your contacts will need to update as well.


  Before updating from a pre-v2 version, open Gupt v1 and copy anything you need from your chats, Vault, and groups, and back up your private key.


  Gupt 3 and 4 replace the old Vault with separate encrypted Bookmarks, Passwords, and Notes sections. Legacy Vault entries are no longer supported, so before updating, open Vault and back up any important entries, especially entries that may not have synced to relays.


  Encrypted chats, groups, Bookmarks, Passwords, Notes, and Share work on current Umbrel LAN URLs. Voice and video calls, screen sharing, and offline notifications require HTTPS and will become available once built-in HTTPS support lands.


  Full release notes can be found at https://github.com/besoeasy/gupt/releases/tag/4.1.9
tagline: Encrypted chat, passwords, notes, bookmarks, and ephemeral sharing
description: >-
  Encrypted chat, passwords, notes, bookmarks, and ephemeral sharing — with no phone number, no email, no account, and no central server.


  Key features include:
    - Anonymous — no phone number, no email, no account required
    - End-to-end encrypted direct messages
    - WebRTC voice & video calls
    - Encrypted media uploads via decentralized file storage
    - Group rooms via Nostr relays
    - Local-first with offline cache (IndexedDB)
    - Separate encrypted Bookmarks, Passwords, and Notes
    - Anonymous file sharing

  Gupt is fully client-side with no backend — it connects directly to public or private Nostr relays. Your keys, your messages, your privacy.
