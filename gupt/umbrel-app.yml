name: Gupt
version: "6.2.0"
releaseNotes: >-
  ⚠️ If you're upgrading from Gupt 5 or earlier, your existing Gupt data will not carry over to this update. Gupt 6 moves from Nostr to a new protocol called Rabta, and everyone starts with a new identity. Your current chats, contacts, groups, notes, passwords, bookmarks, and attachments won't appear in Gupt 6.


  Before updating, open Gupt and copy anything you want to keep, such as notes, passwords, and bookmarks, somewhere safe. After updating, you'll need to share your new profile with your contacts again.


  Signing in has also changed. Memory anchors are gone, and you now sign in with a secret or a secret file plus a PIN of at least 6 characters. Keep your secret or secret file and PIN safe: you'll need them to recover your account when this browser no longer remembers it.


  Gupt moved off Nostr to make syncing and file storage more reliable, and older data can't be brought across to the new protocol.


  ⚠️ Back up important notes, passwords, bookmarks, and other local data before updating. Gupt uses a browser-local cache. Signing in again clears local caches and relies on Rabta relays to restore your data. Keep your secret or secret file and PIN safe.


  New in this update:
    - Over HTTPS, Gupt now remembers your account across tabs and browser restarts, until 30 hours of inactivity, logout, or choosing Forget this device
    - Temporary accounts have been removed; back up anything important from an existing temporary session before updating
    - Secret-file sign-in and authenticator codes now also work over plain HTTP, but HTTP does not remember your account between page loads
    - The Integrations page offers a bot template and a prefilled prompt for building encrypted notification bots


  If you used custom relays, replace them with Rabta node addresses (starting with http:// or https://) in Settings → Relays. Nostr relay addresses (wss://) no longer work.


  If Gupt still shows the old sign-in screen right after updating, reload the page once.


  Use HTTPS for remembered sign-in, voice and video calls, screen sharing, and offline notifications. After this update, you may need to sign in again with your existing secret or secret file and PIN.


  Full release notes can be found at https://github.com/besoeasy/gupt/releases/tag/6.2.0
tagline: Encrypted chat, passwords, notes, bookmarks, and file sharing
description: >-
  Encrypted chat, passwords, notes, bookmarks, and file sharing — with no phone number, no email, no account, and no central server.


  Key features include:
    - Anonymous — no phone number, no email, no account required
    - End-to-end encrypted direct messages
    - WebRTC voice & video calls
    - Encrypted media uploads via Rabta nodes
    - Group rooms via Rabta relays
    - Local-first with offline cache (IndexedDB)
    - Separate encrypted Bookmarks, Passwords, and Notes
    - Invite codes to connect with contacts

  Gupt is fully client-side with no backend — it connects directly to public or private Rabta nodes. Your keys, your messages, your privacy.
