name: Gupt
version: "6.0.0"
releaseNotes: >-
  ⚠️ Important: your existing Gupt data will not carry over to this update. Gupt 6 moves from Nostr to a new protocol called Rabta, and everyone starts with a new identity. Your current chats, contacts, groups, notes, passwords, bookmarks, and attachments won't appear in Gupt 6.


  Before updating, open Gupt and copy anything you want to keep, such as notes, passwords, and bookmarks, somewhere safe. After updating, you'll need to share your new profile with your contacts again.


  Signing in has also changed. Memory anchors are gone, and you now sign in with a secret or a secret file plus a PIN of at least 6 characters. Keep your secret and PIN safe, because you'll need them every time you open Gupt in a new tab.


  Gupt moved off Nostr to make syncing and file storage more reliable, and older data can't be brought across to the new protocol.


  Also in this update:
    - Your data is stored on your device first, so Gupt keeps working offline
    - Encrypted file uploads go directly to Rabta nodes
    - Invite codes replace the old share and invite links
    - Faster call setup and a refreshed conversation list and settings


  If you used custom relays, replace them with Rabta node addresses (starting with http:// or https://) in Settings → Relays. Nostr relay addresses (wss://) no longer work.


  If Gupt still shows the old sign-in screen right after updating, reload the page once.


  Voice and video calls, screen sharing, and offline notifications require HTTPS.


  Full release notes can be found at https://github.com/besoeasy/gupt/releases/tag/6.0.0
tagline: Encrypted chat, passwords, notes, bookmarks, and file sharing
description: >-
  Encrypted chat, passwords, notes, bookmarks, and file sharing — with no phone number, no email, no account, and no central server.


  Key features include:
    - Anonymous — no phone number, no email, no account required
    - End-to-end encrypted direct messages
    - WebRTC voice & video calls
    - Encrypted media uploads via Rabta nodes
    - Group rooms via Rabta relays
    - Local-first with offline cache (IndexedDB)
    - Separate encrypted Bookmarks, Passwords, and Notes
    - Invite codes to connect with contacts

  Gupt is fully client-side with no backend — it connects directly to public or private Rabta nodes. Your keys, your messages, your privacy.
