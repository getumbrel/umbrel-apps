manifestVersion: 1
id: tautulli
storage:
  dataRoot: data
category: media
name: tautulli
version: "2.18.2"
tagline: Monitor your Plex Media Server
description: >-
  Tautulli is a 3rd party application that you can run alongside your Plex Media Server to monitor activity and track various statistics.
  Most importantly, these statistics include what has been watched, who watched it, when and where they watched it, and how it was watched.
  The only thing missing is "why they watched it", but who am I to question your 42 plays of Frozen.


  🛠️  SET-UP INSTRUCTIONS
  
  During initial set-up, you will need to input your Umbrel device's IP address to connect to your Plex Media Server.
  You can find your device's IP address by visiting your router's admin dashboard or by using an IP scanning tool like Angry IP Scanner.
developer: Tautulli
website: https://tautulli.com/
dependencies: []
repo: https://github.com/Tautulli/Tautulli
support: https://github.com/Tautulli/Tautulli/wiki
port: 8212
gallery:
  - 1.jpg
  - 2.jpg
  - 3.jpg
path: ""
defaultUsername: ""
defaultPassword: ""
torOnly: false
releaseNotes: >-
  This update fixes history regrouping issues, including live TV splits and non-live history grouping now requiring matching GUIDs.


  It also fixes newsletter filename path traversal, recently added and paused notification bugs, database backup/import issues, and several activity-card and UI display problems.


  New options and metadata include undisclosed email/newsletter recipients, richer grouped media titles, newsletter edition title data, loudness normalization export fields, and edition titles in the recently added API response.
submitter: Pranshu Agrawal
submission: https://github.com/getumbrel/umbrel-apps/pull/673
