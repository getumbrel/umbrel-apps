  - 2.jpg
  - 3.jpg
path: ""
defaultUsername: ""
defaultPassword: ""
torOnly: false
releaseNotes: >-
  ⚠️ Tautulli now requires its own login, in addition to Umbrel authentication. New installs and existing installs without a password generate temporary login credentials in the Tautulli logs. Use these to sign in, then change the password in Tautulli settings. API clients should send their key in the X-Api-Key header rather than the URL.


  This update adds user and library archiving while retaining watch history, restores deleted users and libraries, and improves database performance.


  It also improves notifications and newsletters, fixes history filtering and Plex mobile links, and addresses security issues involving request forgery, image URLs, command injection, and displayed media information. OneSignal notifications for the Tautulli Remote App are no longer supported.


  Full release notes: https://github.com/Tautulli/Tautulli/releases/tag/v2.19.0
submitter: Pranshu Agrawal
