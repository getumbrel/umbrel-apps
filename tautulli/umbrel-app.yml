torOnly: false
releaseNotes: >-
  This update adds Dolby Atmos support to activity cards, notifications, and API responses; adds edition titles to exports; and improves history query performance.


  It also adds the new Tautulli Remote App notification push relay ahead of OneSignal deprecation on Oct. 1, 2026, plus a setup/settings toggle for anonymous system analytics.


  Fixes include user/library table editing, Firefox dashboard card clipping, Plex log parsing, API error handling, search/log filtering, and security issues around update tarfile extraction and Plex token image proxy URLs. Tautulli now also sends security headers in web responses.
submitter: Pranshu Agrawal
