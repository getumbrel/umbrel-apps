manifestVersion: 1
id: deepseek-harness
category: ai
name: DeepSeek Harness
version: "0.1.2-rc.1"
tagline: Everything-is-a-plugin AI agent harness
description: >-
  DeepSeek Harness (dsh) is an open-source AI agent harness built on an
  everything-is-a-plugin architecture.


  Open the app from the Umbrel home screen and land straight in the Web UI —
  no tokens to copy. Then configure a model under Settings → Models (e.g. a
  DeepSeek API key or another OpenAI-compatible provider), choose the
  workspace directory, and run tasks from the browser. The agent can read and
  edit workspace files, run commands, and maintain plans, asking for approval
  under the active permission policy.


  Developer preview: upstream warns there will be compatibility-breaking
  changes. Review the upstream safety notice before running untrusted tasks.
  The browser session stays signed in for 30 days after first open.
