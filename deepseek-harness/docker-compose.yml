version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: deepseek-harness_web_1
      APP_PORT: 3080

  web:
    image: ghcr.io/nilsonpmjr/deepseek-harness-umbrel:0.2.2-rc.5-umbrel.2@sha256:247047f9d5ab111b747a16f967a5c3e7d17d8c08311d8360e9eaf061c1f6f15d
    restart: on-failure
    stop_grace_period: 30s
    user: "1000:1000"
    volumes:
      - ${APP_DATA_DIR}/data/dsh-home:/data/dsh-home
      - ${APP_DATA_DIR}/data/workspace:/data/workspace
      - ${APP_DATA_DIR}/data/home:/data/home
    environment:
      DSH_HOME: /data/dsh-home
      HOME: /data/home
      XDG_CONFIG_HOME: /data/home/.config
      XDG_CACHE_HOME: /data/home/.cache
      DSH_UMBREL_APP_PROXY_AUTH: "1"
