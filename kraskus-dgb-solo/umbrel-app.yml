description: 'BEFORE UPDATING: move any funds held in the old native wallet to another wallet you control, confirm receipt, and securely back up the wallet and recovery information. This release removes native-wallet controls. Never purge legacy app data to upgrade. Run a DigiByte Core node and three independent solo mining lanes: SHA-256 on1928, Scrypt on1929 and Skein on1930. The simple interface shows each algorithm''s own hashrate, workers, best shares, difficulty, graph and found blocks. Node syncing does not require a wallet. Mining uses an external DigiByte address that you confirm in the app; no native-wallet, recovery-phrase, private-key or send interface is exposed. Existing wallet files and funds are preserved during upgrades. A fixed 1 percent developer fee applies only to successfully mined blocks as three coinbase outputs (0.50,0.25 and0.25 percent); the miner receives the remaining99 percent, including rounding remainders.'
