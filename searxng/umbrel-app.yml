releaseNotes: >-
  ⚠️ Wikipedia, Wikidata and OpenStreetMap results now need a contact address, as their usage policies require. These engines stay off until you add a mailto: address or web page URL in SearXNG's app settings on umbrelOS 2.0. Other search engines work as before.


  This update also improves Wikimedia request compatibility and refreshes search-engine language data.
