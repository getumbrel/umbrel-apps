manifestVersion: 2.0
id: bananana-brain
storage:
  dataRoot: data
environment:
  - name: BANANANA_SETUP_TOKEN
    services:
      - server
    note: >-
      The setup token from https://bananana.dev/start (it starts with bst_). It links this brain to your bananana.dev account on its first start and is not used after that. Restart the app after adding it.
category: networking
name: bananana brain
version: "2026.11.5"
tagline: Your own control room for servers, Macs and PCs
description: >-
  **Before you start:** create a free account at https://bananana.dev/start and copy the setup token it shows (it starts with bst_). In umbrelOS, open this app's settings, paste the token into BANANANA_SETUP_TOKEN and restart the app. Until then, the brain opens to its sign-in page saying no account is configured yet.


  The bananana.dev brain keeps your machines' live readings, alerts, automations, files, terminals and history on your own hardware. You reach it from anywhere at your-name.bananana.dev and in the bananana.dev apps for iPhone and Android. It connects out through an end-to-end encrypted relay, so it opens no ports on your router and needs no VPN.


  Opening the app in umbrelOS shows the brain's own dashboard on your local network, with the same sign-in. It opens over HTTPS, because the brain's sign-in only works on a secure connection. After signing in, add your other machines from the brain's Nodes page.


  The brain's data (identity, settings, users and history) is kept in this app's data folder, with a nightly backup of it at 04:10.
releaseNotes: ""

developer: bananana.dev
website: https://bananana.dev
dependencies: []
repo: ""
support: https://bananana.dev/support

port: 18771
gallery: []
path: ""

defaultUsername: ""
defaultPassword: ""
requiresHttps: true
backupIgnore:
  - data/brain/backups/*

submitter: Roman Vaxman
submission: https://github.com/getumbrel/umbrel-apps/pull/TBD
