manifestVersion: 1
id: codex-agent
category: developer
name: Codex Agent
version: "0.3.8"
tagline: Connect Codex to your private Umbrel chat clients
description: >-
  Codex Agent is a private, OpenAI-compatible bridge for LibreChat or Open WebUI.
  LibreChat receives an optional Codex model entry; Open WebUI can add the same
  internal endpoint through its Connections settings. Both use this app's
  Umbrel password as the API key. Codex runs inside this app, with its projects
  and tools confined to the persistent app workspace.


  On first launch, authenticate safely from this app with Codex's device-code
  flow. Existing host-local credentials are migrated automatically when present.
  Projects are restricted to the app's persistent `projects` directory. Codex
  can modify files there automatically, while agent-tool network access is
  disabled. The internal HTTP bridge remains available to Umbrel chat clients.
