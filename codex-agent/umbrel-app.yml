manifestVersion: 1
id: codex-agent
category: developer
name: Codex Agent
version: "0.1.1"
tagline: Use Codex from your private Umbrel workspace
description: >-
  Codex Agent provides a private browser workspace for Codex on your Umbrel.
  Each browser session communicates with Codex over standard input and output
  inside the app container; Codex does not expose a WebSocket or TCP listener.


  An existing Codex authentication file must be placed at
  `${APP_DATA_DIR}/runtime-secrets/auth.json` before the first start. The file
  is mounted read-only and copied only to an in-memory filesystem at runtime.
  Projects are restricted to the app's persistent `projects` directory.
