manifestVersion: 1
id: codex-agent
category: developer
name: Codex Agent
version: "0.3.2"
tagline: Connect Codex to LibreChat on your private Umbrel
description: >-
  Codex Agent is a private, OpenAI-compatible bridge for LibreChat or Open WebUI.
  Select your preferred chat client during installation, then add this app's
  internal endpoint and enter this app's Umbrel password as its API key. Codex
  runs inside this app, with its projects and tools confined to the persistent app
  workspace.


  On first launch, authenticate safely from this app with Codex's device-code
  flow. Existing host-local credentials are migrated automatically when present.
  Projects are restricted to the app's persistent `projects` directory.
releaseNotes: ""
developer: OpenAI
website: https://developers.openai.com/codex
dependencies:
  - librechat
repo: https://github.com/earlvanze/umbrel-apps/tree/add-codex-agent/codex-agent
support: https://github.com/earlvanze/umbrel-apps/issues
port: 8137
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
deterministicPassword: true
submitter: EarlVanZe
submission: https://github.com/getumbrel/umbrel-apps/pull/5944
