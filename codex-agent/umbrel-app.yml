manifestVersion: 1
id: codex-agent
category: developer
name: Codex Agent
version: "0.2.0"
tagline: Connect Codex to LibreChat on your private Umbrel
description: >-
  Codex Agent is a private, OpenAI-compatible bridge for LibreChat. Select the
  included Codex Agent endpoint in LibreChat and enter this app's Umbrel password
  as its API key. Codex runs inside this app, with its projects and tools confined
  to the persistent app workspace.


  An existing Codex authentication file must be placed at
  `${APP_DATA_DIR}/runtime-secrets/auth.json` before the first start. The file
  is mounted read-only and copied only to an in-memory filesystem at runtime.
  Projects are restricted to the app's persistent `projects` directory.
releaseNotes: ""
developer: OpenAI
website: https://developers.openai.com/codex
dependencies: []
repo: https://github.com/earlvanze/umbrel-apps/tree/add-codex-agent/codex-agent
support: https://github.com/earlvanze/umbrel-apps/issues
port: 8137
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
deterministicPassword: true
submitter: EarlVanZe
submission: https://github.com/getumbrel/umbrel-apps/pull/5944
