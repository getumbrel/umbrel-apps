<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codex Agent</title><style>body{margin:0;background:#101513;color:#e9f1ec;font:15px system-ui,sans-serif}main{max-width:900px;margin:32px auto;padding:0 18px}h1{margin-bottom:4px}p{color:#a9b9af}form{display:flex;gap:8px}textarea{flex:1;min-height:76px}button,textarea{font:inherit;padding:10px;border-radius:6px;border:1px solid #496255;background:#18221d;color:inherit}button{background:#2c6942;cursor:pointer}.end{background:#614039}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#151b18;padding:14px;border-radius:6px;min-height:260px}.status{font-size:13px}</style></head><body><main><h1>Codex Agent</h1><p class="status" id="status">Connecting through Umbrel…</p><form id="prompt"><textarea id="input" placeholder="Ask Codex to work in the persistent /projects workspace." required></textarea><button>Send</button><button type="button" class="end" id="end">End session</button></form><pre id="output" aria-live="polite"></pre></main><script>
const output=document.querySelector('#output'),status=document.querySelector('#status'),input=document.querySelector('#input');const sessionKey='codex-agent-session';const sessionId=localStorage.getItem(sessionKey)||crypto.randomUUID();localStorage.setItem(sessionKey,sessionId);let socket,seq=0,threadId;
const show=value=>{output.textContent+=`${typeof value==='string'?value:JSON.stringify(value,null,2)}\n`;output.scrollTop=output.scrollHeight};
function send(method,params){const id=++seq;socket.send(JSON.stringify({jsonrpc:'2.0',id,method,params}));return id}
function connect(){socket=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws?session=${encodeURIComponent(sessionId)}`);socket.onopen=()=>status.textContent='Connected';socket.onmessage=event=>{const msg=JSON.parse(event.data);if(msg.method==='gateway/session'){status.textContent=msg.params.fresh?'New persistent Codex session':'Reattached to persistent Codex session';if(msg.params.fresh)send('initialize',{clientInfo:{name:'codex-agent',title:'Codex Agent',version:'0.1.1'}});return}if(msg.id===2&&msg.result?.thread?.id)threadId=msg.result.thread.id;if(msg.id===1){socket.send(JSON.stringify({method:'initialized',params:{}}));send('thread/start',{cwd:'/projects'})}show(msg)};socket.onclose=()=>{status.textContent='Browser detached — Codex continues; reconnecting…';setTimeout(connect,2000)};socket.onerror=()=>status.textContent='Connection error'}
document.querySelector('#prompt').onsubmit=event=>{event.preventDefault();if(!threadId){show('Waiting for Codex thread…');return}send('turn/start',{threadId,input:[{type:'text',text:input.value}]});input.value=''};connect();
document.querySelector('#end').onclick=()=>{if(socket?.readyState===WebSocket.OPEN)socket.send(JSON.stringify({method:'gateway/end'}));localStorage.removeItem(sessionKey);threadId=undefined};
</script></body></html>
