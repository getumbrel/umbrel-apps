id: trip
name: Trip
tagline: Minimalist Map Tracker and Trip Planner
category: files
version: "1.49.0"
port: 8980
description: >-
  🗺️ TRIP is a self-hostable minimalist Map tracker and Trip planner to visualize your points of interest (POI) and organize your next adventure details.


  Core Features:
    - Map and manage POIs on interactive maps
    - Plan multi-day trips with detailed itineraries
    - Collaborate and share with travel companions


  No telemetry. No tracking. No ads. Free, forever.
developer: itskovacs
website: https://itskovacs-trip.netlify.app/
repo: https://github.com/itskovacs/trip
support: https://github.com/itskovacs/trip/issues
submitter: itskovacs
submission: https://github.com/getumbrel/umbrel-apps/pull/3830
releaseNotes: >-
  This update adds the Photon search provider, a notifications panel, link title fetching (available in settings), collapsible trip days, and switches the default map tiles to OpenStreetMap after CARTO's free-tier change.

  It also adds weekday labels, Markdown rendering for plan item comments, a copy-coordinates map action, and fixes CSV export compatibility plus booking chip and input-number UI issues.

  Full release notes can be found at https://github.com/itskovacs/trip/releases/tag/1.49.0
