id: trip
name: Trip
tagline: Minimalist Map Tracker and Trip Planner
category: files
version: "1.46.0"
port: 8980
description: >-
  🗺️ TRIP is a self-hostable minimalist Map tracker and Trip planner to visualize your points of interest (POI) and organize your next adventure details.


  Core Features:
    - Map and manage POIs on interactive maps
    - Plan multi-day trips with detailed itineraries
    - Collaborate and share with travel companions


  No telemetry. No tracking. No ads. Free, forever.
developer: itskovacs
website: https://itskovacs-trip.netlify.app/
repo: https://github.com/itskovacs/trip
support: https://github.com/itskovacs/trip/issues
submitter: itskovacs
submission: https://github.com/getumbrel/umbrel-apps/pull/3830
releaseNotes: >-
  This update adds multi-image galleries for trip plans, Markdown support in notes and descriptions, train and boat booking types, multi-day bookings, GPX track display, paid totals, and attachment downloads.

  It also fixes backups getting stuck after restart, GPX and ICS export issues, Google Takeout CSV imports with embedded newlines, CSV formula injection in exports, TOTP reset URL exposure, OIDC configuration updates, and several trip-plan, booking, and shared-attachment issues.

  Full release notes can be found at https://github.com/itskovacs/trip/releases/tag/1.46.0
