submission: https://github.com/getumbrel/umbrel-apps/pull/3830
releaseNotes: >-
  This update groups checklist items by date, adds a delete button to the day edit modal, renders Markdown in booking notes, and shows usernames in settings.


  It also fixes link removal, EXIF orientation for uploaded images, Google geocode API key filtering, and geolocation timeout handling.

  Full release notes can be found at https://github.com/itskovacs/trip/releases/tag/1.50.0
