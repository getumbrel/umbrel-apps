manifestVersion: 1
id: equinox
storage:
  dataRoot: data
folderAccess:
  - id: umbrel-downloads
    name: Downloads
    note: Equinox downloads into Downloads/Equinox/incomplete and moves finished torrents to Downloads/Equinox/complete. To use another folder, add it under "Add your own folder", then select it in Equinox, where it appears by its Umbrel Files path.
    mounts:
      - service: server
        targetPath: /downloads
        readOnly: false
permissions:
  - STORAGE_DOWNLOADS
category: files
name: Equinox
version: "1.1.2"
tagline: A fast, tidy BitTorrent client
description: >-
  Equinox is a lightweight BitTorrent client with a clean web interface. Add magnet links or .torrent files and manage your downloads from your browser.


  Downloads go to Downloads/Equinox/incomplete and move to Downloads/Equinox/complete when finished. You can also add an external drive or another folder in the app's settings and select it in Equinox.


  Choose individual files and priorities, download sequentially, queue downloads and seeds, limit speeds and seeding by ratio or time, and organize torrents with labels and folders. Equinox supports DHT, PEX, uTP, encryption and IPv6, and can create .torrent files.


  Access is protected by your Umbrel login. No additional Equinox account is required.


  For incoming peer connections, Equinox attempts NAT-PMP port forwarding. If your router does not support it, forward TCP and UDP port 51420 to your Umbrel. Transfers use the normal internet connection, not Tor.
releaseNotes: ""
developer: Ozzvin
website: https://equinoxtorrent.com
dependencies: []
repo: https://github.com/Ozzvin/Equinox
support: https://github.com/Ozzvin/Equinox/issues
port: 9095
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
submitter: Ozzvin
submission: https://github.com/getumbrel/umbrel-apps/pull/6318
