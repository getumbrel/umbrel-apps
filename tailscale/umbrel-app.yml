releaseNotes: >-
  This update upgrades Tailscale to v1.102.2 with fixes for Tailscale Funnel connections, Peer Relay connectivity after client restarts, exit-node DNS dialing, and a memory leak after failed WireGuard handshakes.


  This release also includes a security fix for users of Tailscale SSH environment forwarding.


  It also improves performance on large tailnets and adds CLI/status improvements, including tailscale get, expanded whoami output, service listing, and Tailscale Serve traffic metrics.


  Full release notes can be found at https://tailscale.com/changelog#2026-08-04-client


  Tip: You can use Tailscale to back up one Umbrel to another. When adding the backup destination, enter its Tailscale IP address shown in the Tailscale app; device names aren't currently supported.
