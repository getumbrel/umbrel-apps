manifestVersion: 1
id: tailscale
storage:
  dataRoot: data
category: networking
name: Tailscale
version: "v1.104.7"
tagline: Zero config VPN to access your Umbrel from anywhere
description: >-
  Tailscale is zero config VPN that creates a secure network between
  your Umbrel and your other devices. Even when separated by firewalls or
  subnets, Tailscale just works.


  Tailscale will assign your Umbrel a stable IP and an auto-assigned domain that stays consistent, no matter what network your Umbrel is connected to. It's like a local network that works everywhere.


  Tailscale builds on top of WireGuard®'s Noise protocol encryption, a peer-reviewed and trusted standard.
developer: Tailscale Inc.
website: https://tailscale.com
dependencies: []
repo: https://github.com/tailscale/tailscale
support: https://tailscale.com/contact/support
port: 8240
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
path: ""
deterministicPassword: false
torOnly: false
submitter: Umbrel
submission: https://github.com/getumbrel/umbrel/pull/1248
releaseNotes: >-
  This update improves connection reliability and includes fixes from versions 1.104.5 through 1.104.7.


  - Fixes connections to Tailscale's control service failing behind some network devices.


  - Resolves a rare connectivity issue affecting dormant connections.

  - Fixes connection stalls on lossy networks when using Tailscale SSH or Tailscale Serve.

  - Keeps active Tailscale SSH sessions connected when check-mode approval expires, and fixes restart hangs and unexpected background-task termination.

  Tailscale SSH and Tailscale Serve are not enabled by default in the Umbrel app.


  Tip: You can use Tailscale to back up one Umbrel to another. When adding the backup destination, enter its Tailscale IP address shown in the Tailscale app; device names aren't currently supported.


  Full release notes can be found at https://github.com/tailscale/tailscale/releases/tag/v1.104.7
