releaseNotes: >-
  This update moves to Hermes 0.23.0. Your agents, chats and settings carry over.


  Key highlights:
    - Agents browse the web with Hermes's new built-in browser.
    - Password managers from Hermes's plugin catalog can sign your agent's browser in with your logins.
    - Type /model reset in a chat to go back to your usual model without losing the conversation.
    - Telegram's round video messages now reach your agent.
    - Exporting an agent after it filled in a saved card keeps all of its files as they were.
    - Security and reliability fixes.


  If your own skills or prompts mention the old browser tools, like browser_navigate, change them to browser_exec. If another app runs Hermes as its MCP server, the command is now hermes mcp-serve.


  Full release notes can be found at https://github.com/NousResearch/hermes-agent/releases/tag/v0.23.0
