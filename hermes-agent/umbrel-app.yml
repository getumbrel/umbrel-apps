releaseNotes: >-
  This update keeps Hermes 0.22.5 and adds more to the Umbrel build. Your agents, chats and settings carry over.


  Key highlights:
    - Speech to text and text to speech work on your Umbrel with nothing extra to install, and ElevenLabs works with your own key.
    - Web pages your agent opens show emoji and Chinese text properly.
    - Using Murmur with this app? Agents can have their own email, you can call them with voices on your Umbrel or on your ChatGPT plan, and you can watch an agent's browser and take over when it needs a hand.
