releaseNotes: >-
  Hermes Agent v0.20.5 is a stable patch release that rolls up improvements since v0.20.4, including Bot Mode group-room threads, foldable conversation summaries, blob-face avatars, and PDF/file attachments with drag and drop.


  This update also adds keyless web-tier provider rotation, CLI improvements like the fuzzy /model picker and Ctrl+P command palette, runtime stall guards, persistent-memory cron jobs, and desktop performance improvements.


  Full release notes can be found at https://github.com/NousResearch/hermes-agent/releases/tag/v2026.8.19
