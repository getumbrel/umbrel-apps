releaseNotes: >-
  Session auto-pruning is opt-in again. Hermes prompts when disk space is low instead of deleting old sessions by default. If you previously enabled sessions.auto_prune, set it to false to keep all session history.


  Hermes now uses semantic version numbers: v0.22.4 is newer than the previously packaged date-based releases.


  Key highlights:
    - See live progress notifications from MCP tools and an updated terminal chat layout.
    - Update installed plugins more easily and skip empty dependency-consent prompts.
    - Safely re-pair WhatsApp from the dashboard after logging out.
    - Explore new plugins, including options for exposing Hermes as an MCP server and importing other agents.


  Chats no longer reset automatically on idle or daily timers; use /new or /reset to start a fresh conversation. Several memory providers and integrations have moved to plugins and are migrated on startup.


  Full release notes can be found at https://github.com/NousResearch/hermes-agent/releases/tag/v0.22.4
