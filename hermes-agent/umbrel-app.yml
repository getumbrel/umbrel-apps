releaseNotes: >-
  Session auto-pruning is opt-in again. Hermes prompts when disk space is low instead of deleting old sessions by default. If you previously enabled sessions.auto_prune, set it to false to keep all session history.


  Hermes now uses semantic version numbers: v0.22.5 is newer than the previously packaged date-based releases.


  Key highlights:
    - Sign in to Nous with a clearer device-login flow and account confirmation.
    - Route subagents through pluggable delegation backends, with per-session selection.
    - Use interactive option pickers in plugin slash commands.
    - Get a clear message when a chat's working folder is no longer available.
    - Receive reliability fixes and dependency security updates.


  Agent importers, the MCP server, and the Singularity backend now live in plugins.


  Chats no longer reset automatically on idle or daily timers; use /new or /reset to start a fresh conversation. Several memory providers and integrations have moved to plugins and are migrated on startup.


  Full release notes can be found at https://github.com/NousResearch/hermes-agent/releases/tag/v0.22.5
