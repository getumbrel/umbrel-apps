releaseNotes: >-
  ⚠️ Ended sessions inactive for 90 days are now automatically deleted at startup. To keep all session history, set sessions.auto_prune to false in your Hermes config before updating. Pinned and open sessions are preserved.


  Hermes now uses semantic version numbers: v0.22.2 is newer than the previously packaged date-based release.


  Key highlights:
    - Connect hosted apps through connectors and browse the expanded plugin catalog.
    - Improved model selection, custom-provider profiles, and recovery from temporary provider failures.
    - More reliable gateway startup after restarts and improved handling of long local-model requests.
    - Browser password-manager integration, live subagent controls, and translation improvements.


  Chats no longer reset automatically on idle or daily timers; use /new or /reset to start a fresh conversation. Several memory providers and integrations have moved to plugins and are migrated on startup.


  Full release notes can be found at https://github.com/NousResearch/hermes-agent/releases/tag/v0.22.2
