port: 18790
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
  - 4.webp
path: "/chat"
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  This update adds support for new storage management and configuration options introduced with umbrelOS 2.0.


  Previous Hermes Agent 0.23.1 release notes:


  This update moves to Hermes 0.23.1. Your agents, chats and settings carry over.


  Key highlights:
    - Plugins added to Hermes's catalog since your last update can be found and installed again.
    - A chat can no longer get stuck refusing the same request over and over.
    - Telegram, WhatsApp pairing and group chats work more reliably.
    - Security and reliability fixes.


  Full release notes can be found at https://github.com/NousResearch/hermes-agent/releases/tag/v0.23.1
submitter: Umbrel
submission: https://github.com/getumbrel/umbrel-apps/pull/5376
