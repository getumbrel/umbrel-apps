manifestVersion: 1
id: mqttx-web
name: MQTTX Web
tagline: Your All-in-One MQTT Client Toolbox
category: automation
version: "1.13.2"
port: 9012
description: >-
  MQTTX Web is an open-source MQTT 5.0 WebSocket client on the browser to help you debug your MQTT services and applications faster.


  The user interface (UI) of MQTTX adopts a chat-based layout, simplifying operational logic. It enables users to establish multiple MQTT connections, thereby facilitating swift testing of MQTT/MQTTS connections, as well as message subscription and publication.
developer: EMQ
website: https://mqttx.app/
submitter: dirstel
submission: https://github.com/getumbrel/umbrel-apps/pull/1772
repo: https://github.com/emqx/MQTTX
support: https://github.com/emqx/MQTTX/discussions
gallery:
  - 1.jpg
  - 2.jpg
  - 3.jpg
releaseNotes: >-
  MQTT messaging improvements and fixes:


    - Adds an optional setting to decompress incoming GZIP messages
    - Supports deleting individual entries from publish topic history
    - Refreshes the empty connections page with quick connection actions
    - Corrects topic filtering for wildcards, system topics, shared subscriptions, and case sensitivity
    - Shows the active topic filter with an action to clear it
    - Fixes subscription dialog loading states and improves topic colors across themes


  Full release notes can be found at https://github.com/emqx/MQTTX/releases/tag/v1.13.2
