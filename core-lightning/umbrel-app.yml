releaseNotes: >-
  🚨 **Important security update**


  Please update Core Lightning as soon as possible. Version 26.06.7 includes fixes for recently reported security vulnerabilities.


  This update removes the temporary offline mode added in the previous Umbrel update. Your node will reconnect to the Lightning Network automatically and resume sending, receiving, and routing Lightning payments.


  [Read the Core Lightning v26.06.7 release notes](https://github.com/ElementsProject/lightning/releases/tag/v26.06.7)

