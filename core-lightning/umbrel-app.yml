releaseNotes: >-
  This updates Core Lightning from v26.06.8 to v26.06.9. The Core Lightning application (web UI) stays at v26.09.

  **CLN v26.06.9:**

  - Includes important security fixes and hardening for channel reestablishment, splicing, HTLC shutdown handling, onion handling, onchaind, gossip range queries, runes, and setconfig

  - Fixes a v26.06.8 gossip CPU throttle regression that could delay ordinary gossip, ping, onion, and channel traffic on busy nodes

  - Redacts sensitive values such as wallet recovery and RPC credentials in listconfigs output

  - Adds reproducible arm64 and armv7 binaries alongside the existing amd64 builds

  - Nodes that have run development builds cannot downgrade to this 26.06.x release because their database schema may be newer

  [Core Lightning release notes](https://github.com/ElementsProject/lightning/releases/tag/v26.06.9)

