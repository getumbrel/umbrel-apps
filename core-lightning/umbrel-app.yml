releaseNotes: >-
  🚨 **Important security update**


  Please update Core Lightning as soon as possible, even if you already installed version 26.06.7.


  Umbrel has rebuilt the Core Lightning 26.06.7 app from the official signed release binaries to ensure the security fixes are included.


  Your node will restart and reconnect automatically. No further action is required.


  [Core Lightning release notes](https://github.com/ElementsProject/lightning/releases/tag/v26.06.7) · [Umbrel image build](https://github.com/getumbrel/docker-core-lightning/tree/v26.06.7-umbrel.1)

