  - 2.jpg
  - 3.jpg
path: ""
defaultPassword: ""
submitter: Blockstream
submission: https://github.com/getumbrel/umbrel-apps/pull/475
releaseNotes: >-
  This update includes important security fixes and improvements for Core Lightning. The Core Lightning developers strongly recommend upgrading.


  - Improves security across dual funding and splicing, on-chain HTLC resolution, gossip, peer connections, runes and commando, plugins, and the signer, plus several remote-crash fixes.

  - Payments made with xpay now fail early when a route is too long to fit, and route finding slightly prefers shorter routes with fewer parts.

  - Channel opens from peers asking for an unusually high dust limit are now refused.

  - Plugins that fail or crash while handling an event no longer crash or hang your node.


  Full release notes are available at https://github.com/ElementsProject/lightning/releases/tag/v26.06.10

