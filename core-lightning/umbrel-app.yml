releaseNotes: >-
  This updates the Core Lightning application (web UI) to v26.09. Core Lightning itself stays at v26.06.8.

  **CLN Application v26.09:**

  - Updated dependencies, with no known vulnerabilities

  - Security hardening of authentication, sessions and request handling; logging out now also ends the session on the server

  - Fixes the session being lost when Ride The Lightning is open on the same device

  - Checks the amount of BOLT 12 offer invoices before paying

  - Invoice runes created from the Connect Wallet screen now work with wallets; recreate any rune made with an earlier version

  - Large balances are shown in millions (e.g. 1.25M sats) instead of thousands

  - Commando connections now reconnect on demand instead of giving up after a few attempts

  - Runs on Node 22 with a modernised build and release pipeline (pinned base images, provenance & SBOM attestations)


  [Application release notes](https://github.com/ElementsProject/cln-application/releases/tag/v26.09)


  **CLN v26.06.8:**
  This update includes important security fixes and bug fixes. The Core Lightning developers recommend updating as soon as possible.


  [Core Lightning release notes](https://github.com/ElementsProject/lightning/releases/tag/v26.06.8)

