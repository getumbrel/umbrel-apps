  - 3.jpg
path: ""
defaultPassword: ""
submitter: Blockstream
submission: https://github.com/getumbrel/umbrel-apps/pull/475
releaseNotes: >-
  🚨 **Important security update**


  Core Lightning developers have advised node operators to keep their nodes running but temporarily disconnect them from other Lightning nodes while they prepare a security fix. This update applies that change automatically.


  Your node will keep running and continue watching the Bitcoin blockchain, but it will not be able to send, receive, or route Lightning payments for now.


  Please leave Core Lightning running and do not uninstall it. Another Core Lightning update will appear in Umbrel as usual when the fix is ready. Install that update to reconnect your node and re-enable Lightning payments.


  [Read the security announcement from Core Lightning](https://x.com/Core_LN/status/2092755509510283423)

