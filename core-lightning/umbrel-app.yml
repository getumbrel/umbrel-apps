manifestVersion: 1.1
id: core-lightning
category: bitcoin
name: Core Lightning
version: "26.06.6-patch.1"
tagline: Run your personal Core Lightning node
description: >-
  **Important security notice:** This version starts Core Lightning in temporary offline mode, following [guidance from the Core Lightning maintainers](https://x.com/Core_LN/status/2092755509510283423). Your node will stay running and continue watching the Bitcoin blockchain, but it will not be able to send, receive, or route Lightning payments. Leave the app running and do not uninstall it. Another Core Lightning update will appear in Umbrel as usual when the fix is ready. Install that update to reconnect your node and re-enable Lightning payments.


  Get started with the Lightning network today with Core Lightning - a
  Lightning Network implementation focusing on spec compliance and performance.


  The Lightning Network allows ultra cheap and almost instant Bitcoin transactions.
  By running a Lightning node, you can not only self-custody your Bitcoin on
  Lightning, but also earn sats by routing payments on the network.


  Core Lightning and Application powered by Blockstream.

developer: Core Lightning
