manifestVersion: 1.1
id: core-lightning
category: bitcoin
name: Core Lightning
version: "26.06.10"
tagline: Run your personal Core Lightning node
description: >-
  Get started with the Lightning network today with Core Lightning - a
  Lightning Network implementation focusing on spec compliance and performance.


  The Lightning Network allows ultra cheap and almost instant Bitcoin transactions.
  By running a Lightning node, you can not only self-custody your Bitcoin on
  Lightning, but also earn sats by routing payments on the network.


  Core Lightning and Application powered by Blockstream.

developer: Core Lightning
website: https://blockstream.com/lightning/
dependencies:
  - bitcoin
repo: https://github.com/ElementsProject/cln-application
support: https://community.corelightning.org/home
port: 2103
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
path: ""
defaultPassword: ""
submitter: Blockstream
submission: https://github.com/getumbrel/umbrel-apps/pull/475
releaseNotes: >-
  This update includes important security fixes and improvements for Core Lightning.


  - Strengthens security for channel funding and splicing, on-chain payment resolution, remote access, and node communication.

  - Improves payment routing by preferring shorter routes and detecting payments that exceed routing limits earlier.

  - Improves plugin error handling and compatibility when increasing fees for pending splices.

  - Restricts income CSV exports to plain filenames ending in .csv, saved in the node's network directory.


  Full release notes are available at https://github.com/ElementsProject/lightning/releases/tag/v26.06.10

backupIgnore:
  - data/lightningd/bitcoin/lightningd.sqlite3
