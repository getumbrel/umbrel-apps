releaseNotes: >-
  This update brings Core Lightning to v26.06.9, a point release with security fixes and bug fixes. The Core Lightning developers strongly recommend upgrading.


  Highlights:

  - Security fixes in channel reestablishment, splicing, HTLC handling during shutdown, onion handling, onchaind, gossip range queries, runes and setconfig, plus several remote-crash and hardening fixes

  - Fixes a regression in v26.06.8 where busy nodes could throttle peers on ordinary gossip, pings and onion messages, delaying channel traffic

  - Runes with restrictions can no longer create unrestricted runes or relist blacklisted runes; use an unrestricted rune for those actions

  - listconfigs now hides sensitive values such as passwords


  [Core Lightning release notes](https://github.com/ElementsProject/lightning/releases/tag/v26.06.9)

