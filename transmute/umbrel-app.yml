manifestVersion: 1
id: transmute
storage:
  dataRoot: data
name: Transmute
tagline: An efficient tool for transforming files on your Umbrel
category: files
version: "2.1.1"
port: 3313
description: >-
  Transmute is a file conversion app for turning files into different formats through a clean and simple interface. It supports a wide range of file types, including images, videos, audio files, documents, structured data, spreadsheets, subtitles, fonts, and diagrams.


  The app is built for both manual conversions and automated workflows. Its API makes it possible to connect Transmute with other apps, scripts, or services, so files can be converted as part of a larger process without doing everything by hand.


  Transmute helps simplify everyday format changes, from converting media files into more compatible formats to transforming documents, data files, and diagrams for further use. It brings many different conversion tasks together in one place and makes them easy to access.
developer: Transmute
website: https://transmute.sh/
submitter: dennysubke
submission: https://github.com/getumbrel/umbrel-apps/pull/5844
repo: https://github.com/transmute-app/transmute
support: https://github.com/transmute-app/transmute/issues
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
releaseNotes: >-
  This maintenance update disables telemetry from the onnxruntime dependency used by document conversions.


  It also cleans up failed, completed, and cancelled jobs through the cleanup TTL and Clear Conversions/Compressions settings, adds Korean translations, and updates conversion dependencies including Pandoc and Draw.io.


  No configuration changes are required. After upgrading, the first cleanup run may remove old finished jobs according to your configured TTL.
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
