version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: transmute_web_1
      APP_PORT: 3313
      PROXY_AUTH_WHITELIST: "/api/*"
      # Keep first-admin creation behind Umbrel auth.
      PROXY_AUTH_BLACKLIST: "/api/users"

  web:
    image: ghcr.io/transmute-app/transmute:2.1.0@sha256:6e652284edfa61ab53a1ca2c1ff502ce6d89a055d33e3f3fa7482ea867d29cde
    restart: on-failure
    environment:
      # Keep JWT signing stable across restarts.
      AUTH_SECRET_KEY: ${APP_SEED}
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
