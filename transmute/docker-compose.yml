version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: transmute_web_1
      APP_PORT: 3313
      PROXY_AUTH_WHITELIST: "/api/*"
      # Keep first-admin creation behind Umbrel auth.
      PROXY_AUTH_BLACKLIST: "/api/users"

  web:
    image: ghcr.io/transmute-app/transmute:2.1.1@sha256:87b669d835d9e68bdbc4082ab061cb361cd3ecee69c14ccfa9a3814d326b6707
    restart: on-failure
    environment:
      # Keep JWT signing stable across restarts.
      AUTH_SECRET_KEY: ${APP_SEED}
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
