releaseNotes: >-
  ⚠️ Notifications to internal IP addresses are now blocked by default. If you use local webhook services, review the notifier network security settings at https://homebox.software/en/user-guide/notifiers/#network-security-for-notifiers.


  If you're updating from a pre-0.26 version, back up your HomeBox database and files first because 0.26 introduced a significant database rework. Integrations using the old /v1/items* or /v1/locations* API endpoints must migrate to /v1/entities*.


  This update improves inventory search and fixes multiple security vulnerabilities.
    - Search now handles individual words more effectively and supports full location paths.
    - Child items can have a storage location separate from their parent item.
    - Item photos load faster, backups use less memory, and thumbnail processing avoids database lockups.
    - Fixes include preserving asset IDs during re-import, date handling, barcode lookups, and label generation.


  Full release notes can be found at https://github.com/sysadminsmedia/homebox/releases/tag/v0.27.0
