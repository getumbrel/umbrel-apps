releaseNotes: >-
  ⚠️ Notifications to internal IP addresses are now blocked by default. If you use local webhook services, review the notifier network security settings at https://homebox.software/en/user-guide/notifiers/#network-security-for-notifiers.


  If you're updating from a pre-0.26 version, back up your HomeBox database and files first because 0.26 introduced a significant database rework. Integrations using the old /v1/items* or /v1/locations* API endpoints must migrate to /v1/entities*.


  This maintenance update fixes connections to optional Meilisearch servers on local networks and in Docker, while continuing to reject insecure HTTP connections to public IP addresses.


  Full release notes can be found at https://github.com/sysadminsmedia/homebox/releases/tag/v0.27.1
