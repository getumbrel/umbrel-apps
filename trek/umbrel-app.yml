manifestVersion: 1
id: trek
storage:
  dataRoot: data
category: files
name: TREK
version: "4.3.3"
tagline: Plan trips together, from itinerary to budget
description: >-
  ✈️ TREK is a self-hosted travel planner that keeps your whole trip in one place: the day-by-day itinerary, an interactive map, bookings, shared costs, packing lists, and a travel journal. Everyone you invite works on the same plan in real time, so there's no more juggling spreadsheets, screenshots, and group chats.


  🔑 On first launch, sign in with the credentials shown by Umbrel. TREK will then ask you to choose a new password.


  - Day-by-day itineraries with drag-and-drop, times, notes, and automatic route sorting

  - Interactive map with place search, weather forecasts, and imports from Google Maps, GPX, and KML

  - Bookings for flights, trains, hotels, restaurants, and tours, with confirmation codes and import from booking emails, PDFs, and wallet passes

  - Shared budget with expense splitting, multiple currencies, and settle-up suggestions

  - Packing lists and to-dos with templates, assignees, and reminders

  - Real-time collaboration with roles and permissions, invite links, public sharing, and a group chat with polls

  - Journey for a photo journal of your travels, Atlas for mapping the countries you've visited, and Vacay for planning time off around public holidays

  - PDF and calendar export, an installable mobile web app that works offline, and more than 20 languages

  - Two-factor authentication, passkeys, and single sign-on with your own OpenID provider


  Your trips, documents, and photos stay on your Umbrel.
