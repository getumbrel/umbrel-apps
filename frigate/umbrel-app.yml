manifestVersion: 1.1
id: frigate
category: automation
name: Frigate
version: "0.18.0"
tagline: A complete and local NVR
description: >-
  A complete and local NVR designed for Home Assistant with AI object detection. 
  Uses OpenCV and Tensorflow to perform realtime object detection locally for IP cameras.


  🛠️ SET-UP


  - You can configure your cameras directly within the Frigate app, there is no need to manually edit the configuration files.


  - Sign in to Frigate with username `admin` and the "default app password" displayed on Frigate's page in the app store (shown after install). The same default app password is also used as your RTSP password if needed.
releaseNotes: >-
  Frigate 0.18 is a major upgrade. Back up your Frigate config and database before upgrading; Frigate will attempt to migrate existing configs automatically, but some setups may need manual changes.


  - Adds complete UI-based configuration management, profiles for switching camera settings, expanded GenAI/Chat features, motion review/search, debug replay, and export case management.


  - Changes snapshot storage from annotated JPG files on disk to clean WebP snapshots, updates FFmpeg to 8, and includes authentication, role, export, and SQL security hardening.


  - Intel GPU stats now require host kernel 6.5 or newer, and go2rtc streams that transcode with hardware acceleration may need the upstream FFmpeg 8 config adjustment.


  Full release notes can be found at https://github.com/blakeblackshear/frigate/releases/tag/v0.18.0
developer: Blake Blackshear
website: https://frigate.video/
repo: https://github.com/blakeblackshear/frigate
support: https://github.com/blakeblackshear/frigate/issues
port: 5004
gallery:
  - 1.jpg
  - 2.jpg
  - 3.jpg
path: ""
defaultUsername: "admin"
deterministicPassword: true
dependencies: []
permissions:
