releaseNotes: >-
  If updating from Stalwart v0.15.x or earlier, Umbrel runs the v0.16 migration automatically as part of the update. Make sure you have a backup and leave Stalwart running until it comes back online. Upgrading guide: https://github.com/stalwartlabs/stalwart/blob/main/UPGRADING/v0_16.md


  Changes since v0.16.18 include:
    - Adds WebUI support for a separate OAuth client, new Sieve spam-score variables, and a CalDAV default vCard version setting
    - Improves MySQL and MariaDB key columns; users with manually configured MySQL/MariaDB storage should review the upstream one-time ALTER TABLE guidance
    - Fixes ACME renewal handling, CalDAV scheduling and collection properties, directory discovery/sync edge cases, IMAP ACL casing, JMAP email/mailbox/address book/calendar/file handling, MTA relay and local-address matching, search indexing tasks, and Sieve/spam filtering behavior


  Full release notes can be found at https://github.com/stalwartlabs/stalwart/releases/tag/v0.16.19
dependencies: []
path: "/admin"
deterministicPassword: true
defaultUsername: admin
