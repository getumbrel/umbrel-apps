releaseNotes: >-
  ⚠️ Upgrading from v0.15.x or earlier is a breaking migration. Back up first, including any external databases and blob storage, and allow time for the migration to finish. Umbrel migrates accounts and supported settings, but custom mail routing, listeners, spam rules, ACME renewal settings, and other unsupported configuration must be reviewed and recreated as needed.


  After a legacy upgrade, recalculate account disk quotas from the Tasks section of Stalwart, followed by tenant quotas if used. Clients using STARTTLS submission (10587), IMAP (10143), or POP3 (10110) need their listeners recreated or must switch to implicit TLS on 10465, 10993, or 10995 respectively. Update CalDAV, CardDAV, and WebDAV paths to use full email addresses with @ encoded as %40, and update external-directory filters where applicable. Your Umbrel-provided admin login remains available; custom administrator roles must be reassigned.


  Read the full migration guide before upgrading: https://github.com/stalwartlabs/stalwart/blob/v0.16.27/UPGRADING/v0_16.md


  These migration steps do not apply to existing v0.16 installations.


  Changes in v0.16.27 include:
    - Fixes mail change notifications when messages are appended, copied, or moved into another account's mailbox
    - Fixes incomplete IMAP search results when combining minimum, maximum, and saved-result options
    - Fixes calendar updates that could display both the original and rescheduled occurrence in Apple Calendar
    - Fixes OAuth loopback redirects and WebDAV file and folder names in Windows Explorer


  Full release notes: https://github.com/stalwartlabs/stalwart/releases/tag/v0.16.27

dependencies: []
