releaseNotes: >-
  ⚠️ Expect a longer update. This release migrates your mail and settings to Stalwart v1, and Stalwart is unavailable until it finishes. Umbrel may remain at 99% while the migration is running. Larger mailboxes take longer. Keep Umbrel powered on and do not restart it during the update.


  Back up your app before updating, and make sure there is free space for a second copy of your mail store plus 512 MiB. The migration uses Stalwart's official migration tool and verifies every account. Your v0.16 data is kept untouched. If the migration cannot complete, Stalwart stays stopped with your data intact, and restarting the app retries it.


  After updating, apps signed in with OAuth must sign in again and may need to be registered again. Calendar and contact clients resynchronise, and searches may be incomplete while indexes rebuild. On a fresh installation, restart the app after completing setup to enable the admin login.


  If you are upgrading from v0.15.x or earlier, your data is first migrated to v0.16. Custom mail routing, listeners, spam rules and other unsupported configuration must be recreated, and custom administrator roles reassigned. See https://github.com/stalwartlabs/stalwart/blob/v0.16.27/UPGRADING/v0_16.md


  Changes in v1.0 and v1.1 include:
    - Full-text search of documents in mail attachments and file storage
    - OpenPGP and S/MIME encryption with key management and an encryption gateway
    - Blob encryption and zstd compression at rest
    - More control over OAuth application access and connected applications
    - Multiple bug and security fixes


  Full release notes: https://github.com/stalwartlabs/stalwart/releases/tag/v1.1.0

dependencies: []
path: "/admin"
deterministicPassword: true
defaultUsername: admin
