manifestVersion: 1
id: gobrrr-pool
storage:
  dataRoot: data
category: bitcoin
name: Go Brrr Pool
version: "1.2.4"
tagline: Bitcoin Solo Mining, Done Right!
description: >-
  Go Brrr Pool is a self-hosted solo Bitcoin mining pool powered by ckpool-solo.
  Connect your miners directly to your own node and keep 100% of block rewards.
  No third-party pool, no KYC, no fees, no middleman.


  Features a customizable real-time web dashboard with hashrate monitoring,
  worker statistics, pool-wide leaderboard, efficiency dashboard, and local
  mempool API integration, using your local Mempool app when installed. ZMQ
  enables instant block notifications and automatic difficulty adjustment
  accepts diff proposals from miners.


  Two stratum ports: port 21420 for standard mining, port 21422 for
  high-difficulty mode (min diff 1,000,000) suited for powerful machines and
  hashrate rentals. Workers connect using their Bitcoin address as the username —
  any block found pays out directly and entirely to the miner's own wallet.


  Built on ckpool, the same battle-tested open-source pool software powering
  solo.ckpool.org.


  This software is free as in FREEDOM!


  Homescreen widget developed by RodB.
releaseNotes: >-
  The web dashboard now runs on Node.js 24, as Node.js 20 no longer receives
  security updates. The dashboard image is also less than half its previous
  size.


  New read-only public API for monitoring apps, so you can follow your pool's
  hashrate, best share and workers from a phone app next to your rigs. It is
  read-only and never exposes miner IP addresses. For each worker it shows the
  best share ever, the best share since the miner connected, and when it
  connected.


  Fixed the per-worker best share showing only the current session's best on
  fresh installs.


  Fixed ckpool receiving full blocks over ZMQ instead of only block hashes on
  nodes that publish both on the same port, which caused log spam.


  Backups no longer include the ever-growing pool log file; pool and worker
  statistics are still backed up.
developer: GoBrrr
website: https://gobrrr.me
dependencies:
  - bitcoin
repo: https://github.com/gobrrrme/GoBrrr-Pool
support: https://github.com/gobrrrme/GoBrrr-Pool/issues
port: 21421
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
path: ""
defaultUsername: ""
defaultPassword: ""
backupIgnore:
  - data/ckpool-logs/ckpool.log
  - data/ckpool-logs/ckpool.log.old
  - data/ckpool-socket
widgets:
  - id: "stats"
    type: "four-stats"
    refresh: "30s"
    endpoint: "gobrrr-stats:23002/widget-api/widget/stats"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "Hash Rate"
          text: "0"
          subtext: "H/s"
        - title: "Miners"
          text: "0"
          subtext: "Active"
        - title: "Best Share"
          text: "0"
          subtext: "Diff"
        - title: "Share Rate"
          text: "0.0"
          subtext: "/min"
submitter: GoBrrr
submission: "https://github.com/getumbrel/umbrel-apps/pull/5449"
