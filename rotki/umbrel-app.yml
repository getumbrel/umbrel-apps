manifestVersion: 1
id: rotki
category: finance
name: rotki
version: "1.44.0"
tagline: Portfolio tracking, analytics, accounting and tax reporting
description: >-
  rotki is an open source portfolio tracking, analytics, accounting and tax reporting tool that protects your privacy. 
  

  The mission of rotki is to bring transparency into the crypto and financial sectors through the use of open source. 
  

  Most importantly unlike virtually every other competing service which consists of closed source SaaS onto which you are forced to hand over all your financial data, with rotki your data is stored encrypted locally in your computer. 
  

  It enables you to take ownership of your financial data!
  
  
  ⚠️ IMPORTANT ⚠️ Rotki is meant to be accessed locally. Hosting it on a publicly accessible machine should be avoided at all cost, unless you know what you're doing!
backupIgnore:
  - data/logs/*
developer: Rotki
website: https://rotki.com
dependencies: []
repo: https://github.com/rotki/rotki
support: https://github.com/rotki/rotki/issues
port: 8084
releaseNotes: >-
  This major release adds new portfolio analysis workflows, expanded exchange/protocol support, and a Docker runtime overhaul.


  Key highlights include:
    - Added a local MCP server for premium users to analyze rotki data with compatible AI assistants
    - Redesigned filters, saved views, and history-event actions across the app
    - Added cross-chain bridge matching, a rebuilt balance snapshot editor, and support for Gate, CoinEx, and Bit2Me
    - Added new decoders and support for Project X, Frankencoin Savings, Kinetiq, Yearn vesting escrows, Solana staking, Jupiter Lend Earn, Across, LI.FI, and more
    - History events may need to be redecoded after upgrade; edited events are left untouched
    - The Docker image now uses a distroless runtime, stops more cleanly, and keeps existing ports, volumes, and environment variables working


  Full release notes are found at https://github.com/rotki/rotki/releases/tag/v1.44.0
