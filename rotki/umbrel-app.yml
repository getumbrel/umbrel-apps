manifestVersion: 1
id: rotki
storage:
  dataRoot: data
category: finance
name: rotki
version: "1.44.2"
tagline: Portfolio tracking, analytics, accounting and tax reporting
description: >-
  rotki is an open source portfolio tracking, analytics, accounting and tax reporting tool that protects your privacy. 
  

  The mission of rotki is to bring transparency into the crypto and financial sectors through the use of open source. 
  

  Most importantly unlike virtually every other competing service which consists of closed source SaaS onto which you are forced to hand over all your financial data, with rotki your data is stored encrypted locally in your computer. 
  

  It enables you to take ownership of your financial data!
  
  
  ⚠️ IMPORTANT ⚠️ Rotki is meant to be accessed locally. Hosting it on a publicly accessible machine should be avoided at all cost, unless you know what you're doing!
backupIgnore:
  - data/logs/*
developer: Rotki
website: https://rotki.com
dependencies: []
repo: https://github.com/rotki/rotki
support: https://github.com/rotki/rotki/issues
port: 8084
releaseNotes: >-
  ⚠️ If you use premium sync, update every device to rotki 1.44.2 or later. Older versions cannot restore backups created by this release. Existing old-format backups can still be restored.


  This release includes important security updates and portfolio tracking improvements:
    - Updated certificate trust lists to reject certificates affected by the eMudhra key compromise
    - Stronger encryption and faster compression for premium backups, with clearer upload and restore errors
    - Added Bonds, ETFs, and Collectibles as locations for manual balances, snapshots, and history events
    - Improved NFT balances, Hyperliquid history, ZKSync Lite history, and SafeNet withdrawal tracking
    - Reduced redundant price and blockchain requests to improve loading and avoid rate limits


  Full release notes are found at https://github.com/rotki/rotki/releases/tag/v1.44.2
gallery:
