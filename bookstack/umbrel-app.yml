manifestVersion: 1
id: bookstack
storage:
  dataRoot: data
environment:
  - name: MAIL_HOST
    services:
      - server
    note: >-
      SMTP server host name, such as smtp.example.com. After saving, use Send a Test Email under Settings > Maintenance in BookStack to check your settings.
  - name: MAIL_PORT
    services:
      - server
    default: "587"
    note: >-
      SMTP server port. Use 587 for most providers, or 465 for providers that require an encrypted connection from the start.
  - name: MAIL_USERNAME
    services:
      - server
    note: >-
      SMTP username.
  - name: MAIL_PASSWORD
    services:
      - server
    note: >-
      SMTP password or app password.
  - name: MAIL_FROM
    services:
      - server
    default: "bookstack@example.com"
    note: >-
      Sender address, such as bookstack@example.com. Use an address your SMTP provider lets you send from.
name: BookStack
tagline: A simple, self-hosted platform for organizing documentation
category: files
version: "26.09.3-patch.1"
port: 6875
description: >-
  BookStack is a free and open source platform for creating and organizing documentation. It provides a familiar book, chapter, and page structure that makes it easy to build wikis, knowledge bases, manuals, and internal documentation.


  Important: On first launch, sign in with the default credentials shown by Umbrel, then change the admin email address and password in BookStack.


  The editor is designed for everyday writing, while permissions, shelves, search, diagrams, attachments, comments, and revision history help teams keep information organized and useful over time.


  BookStack is self-hosted and stores your content on your Umbrel, so your documentation remains under your control.
developer: BookStack
website: https://www.bookstackapp.com/
repo: https://github.com/BookStackApp/BookStack
support: https://www.bookstackapp.com/docs/admin/
submitter: Umbrel
submission: https://github.com/getumbrel/umbrel-apps/pull/5687
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
  - 4.webp
  - 5.webp
releaseNotes: >-
  This update lets you connect an SMTP email provider in BookStack's app settings on umbrelOS 2.0, for notifications, invitations and password resets.


  Previous BookStack 26.09.3 release notes:


  This security update improves protection of private content. Updating is recommended.
    - Fixed access to images and drawings attached to inaccessible draft or deleted pages.
    - Fixed personal editor drafts being visible to other users in certain situations.
    - Fixed book and chapter conversions incorrectly deleting content in the recycle bin.
    - Prevented attachment responses from revealing whether inaccessible pages exist.


  Full release notes can be found at https://github.com/BookStackApp/BookStack/releases/tag/v26.09.3
dependencies: []
path: ""
defaultUsername: "admin@admin.com"
defaultPassword: "password"
backupIgnore:
  - data/config/log/*
