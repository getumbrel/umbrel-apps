manifestVersion: 1
id: gathergate
storage:
  dataRoot: data
category: files
name: GatherGate
version: "1.1.1"
tagline: Self-hosted magic-link client document checklist and encrypted intake vault
description: >-
  Open GatherGate in your browser after installation to create your operator workspace and brand your client portal. Before sending links to external clients, expose GatherGate behind your preferred TLS reverse proxy or tunnel and set your public domain in BASE_URL; on LAN, links default to http://umbrel.local:3088.


  GatherGate is an open-source, self-hosted alternative to Content Snare and FileInvite built on Node.js 24, SQLite WAL, and per-record AES-256-GCM encryption with zero telemetry.


  - Send passwordless magic-link checklists with optional 6-digit email OTP verification

  - Catch mistyped tax and bank IDs at submission with deterministic AU, UK, US, and EU checksums

  - Verify real file magic bytes before encrypting uploads and review decrypted PDFs inline

  - Automate reminders, canonical ZIP exports, 6 HMAC-signed webhook events, and metadata-only MCP 2.0 triage
