manifestVersion: 1
id: nodeguard-node
category: files
name: NodeGuard Node
version: "1.0.13"
tagline: Share spare disk space and earn free storage or money
description: >-
  NodeGuard is cloud storage that runs on people's computers instead of giant data centres.
  NodeGuard Node shares space on your Umbrel with the network: you get 1 GB of NodeGuard storage
  for every 2 GB you share, or you can be paid monthly instead.


  Everything stored on your Umbrel is encrypted on its owner's device first and split into pieces,
  so nobody can read it, including you and us. You choose how much space to share, how fast it
  may upload and when. It connects out to the network, so nothing on your home network is opened up.


  Open the app, sign in or create a free NodeGuard account, choose your space and you're sharing.
