version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: bitboard_app_1
      APP_PORT: 3711

  app:
    image: ghcr.io/egzola/bitboard:1.0.2@sha256:5805a2f8ed667e9972aba0d8f98615a3a36d9ec5088868dde7a375e0148fecb7
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PORT: 3711
    volumes:
      - ${APP_DATA_DIR}/data:/data
