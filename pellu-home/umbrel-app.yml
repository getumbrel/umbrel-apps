manifestVersion: 1
id: pellu-home
storage:
  dataRoot: data
folderAccess:
  - id: umbrel-downloads
    name: Downloads
    note: Your Downloads folder, read-only. In Pellu Home Server's settings it is /media/Downloads.
    mounts:
      - service: server
        targetPath: /media/Downloads
        readOnly: true
  - id: media-library
    name: Media Library
    note: Select a folder with your videos. In Pellu Home Server's settings it is /media/Library. Access is read-only.
    mounts:
      - service: server
        targetPath: /media/Library
        readOnly: true
category: media
name: Pellu Home Server
version: "1.0.1"
tagline: Your videos on Pellu, on every screen at home
description: >-
  Pellu Home Server shares the videos (and their subtitles) in the folders you choose with the Pellu
  apps on your phones, tablets and TV at home. Files play as they are: nothing is transcoded, and
  nothing is uploaded.


  Pick your folders in its settings page (your Downloads folder is there already, read-only), and
  link the server to your free Pellu account. The Pellu apps on your home network then find it by
  themselves.
releaseNotes: ""
developer: Pellu
website: https://pellu.co/home-server/linux
dependencies: []
repo: ""
support: https://pellu.co/support
port: 8484
gallery: []
path: /admin
defaultUsername: ""
deterministicPassword: true
permissions:
  - STORAGE_DOWNLOADS
submitter: Pellu
submission: https://github.com/getumbrel/umbrel-apps/pull/0000
