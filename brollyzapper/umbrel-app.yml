gallery: []
path: ""

defaultUsername: ""
defaultPassword: ""
deterministicPassword: true

# The credential volume is NOT backed up (spec §10, §11, d46.26).
#
# It holds recv.macaroon — an LND credential that, in a stolen backup, streams
# every invoice on the node for every app over LND's Tor-published gRPC. The
# caveats and the dedicated root key bound that; keeping it out of the backup
# removes the copy entirely.
#
# Nothing is lost by it: the guard bakes on its own start (EnsureReceiveMacaroon,
# §6), so a restore recovers unattended with a FRESH, correctly caveated
# credential — better than restoring a stale one whose time-before may have
# passed. guard-state.json lives in data/guard, not here, so the recorded root
# key ids survive the restore and revocation still works afterwards.
#
# The database stays in backup: it holds the zap-receipt signing key, and losing
# it changes the nostrPubkey the lightning address advertises.
backupIgnore:
  - data/credentials

submitter: davotoula
submission: https://github.com/getumbrel/umbrel-apps/pull/6049
