manifestVersion: 1
id: brollyzapper
category: bitcoin
name: BrollyZapper
version: "0.1.18"
tagline: Receive Nostr zaps and connect wallets to your own Lightning node
description: >-
  BrollyZapper adds Nostr zap receiving (NIP-57) and Nostr Wallet Connect
  (NIP-47) to the Lightning node you already run.


  It is receive-only until you turn sending on. A fresh install holds a macaroon
  granting five RPC methods, none of which can move a satoshi, and enabling
  sending bakes a second, separately revocable macaroon that expires on its own
  and is locked to this app's own address. You can revoke it at any time, and
  your node stops honouring it immediately.


  Sending, when you enable it, is bounded by a spending ceiling you set. That
  ceiling is bookkeeping this app applies to itself: it is not enforced by your
  node, so an attacker who compromised this app while sending was enabled could
  spend up to your node's outbound channel balance. The credentials live in a
  second container with no network listener at all, which is what stops that
  attacker obtaining anything wider.


  A public domain is optional. Nostr Wallet Connect works without one; a
  lightning address needs one, and BrollyZapper checks the domain actually
  reaches this instance rather than assuming DNS is enough.
