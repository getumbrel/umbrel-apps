id: iobroker
category: automation
name: ioBroker
version: "11.1.0"
tagline: Open source home automation platform for every use case
description: >-
  ioBroker is an open source home automation platform that connects hundreds of devices and services, including Zigbee, Z-Wave, KNX, MQTT, Shelly, Philips Hue, Sonos, and Alexa, from a browser-based dashboard.


  Build automations with the visual logic editor (Blockly) or JavaScript, create custom dashboards with VIS, and extend the system with over 400 community adapters such as Node-RED, BackItUp, and cloud assistants.


  Runs entirely on your Umbrel. On first launch, open the app from the Umbrel home screen and follow the setup wizard in the Admin UI to create your admin user and configure adapters.


  Learn more at https://www.iobroker.net and https://forum.iobroker.net.
