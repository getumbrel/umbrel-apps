manifestVersion: 1
id: iobroker
storage:
  dataRoot: data
environment:
  - name: TZ
    services:
      - server
    default: Europe/Berlin
    note: >-
      Optional: your time zone, for example America/New_York. ioBroker uses it for schedules and log times. Leave empty to keep the default, Europe/Berlin.
category: automation
name: ioBroker
version: "12.0.0"
tagline: Connect everything. Automate anything.
description: >-
  ioBroker is open source home automation that brings your devices, services, protocols, and data together in one place. Use it to control, automate, and monitor a smart home built from products by many different vendors.


  With hundreds of adapters, ioBroker integrates with technologies and services such as MQTT, KNX, Shelly, Philips Hue, Sonos, Alexa, and many more. Build automations visually with Blockly or write advanced logic in JavaScript and TypeScript, for example to:


  - Turn lights, heating, or devices on based on time, presence, or sensor values

  - Combine devices from different manufacturers into a single automation

  - Collect and process data from sensors, energy meters, and online services


  ⚙️ After installing, open ioBroker and follow the setup wizard. The admin interface is protected by your Umbrel login.


  ⚠️ On Umbrel, ioBroker runs on an isolated network: add devices by their IP address, as automatic discovery can't see your home network. Adapters that serve their own web pages on other ports, such as vis dashboards, can't be opened from other devices. USB devices such as Zigbee or Z-Wave sticks aren't passed through, so use network-based gateways instead.
releaseNotes: ""
developer: ioBroker GmbH
website: https://www.iobroker.net/
dependencies: []
repo: https://github.com/ioBroker/ioBroker
support: https://forum.iobroker.net
port: 8105
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
path: ""
defaultUsername: ""
defaultPassword: ""
submitter: Aland Baban
submission: https://github.com/getumbrel/umbrel-apps/pull/3033
