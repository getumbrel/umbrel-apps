name: ioBroker
version: "11.1.0"
tagline: Connect everything. Automate anything.
description: >-
  Open source home automation built to bring your devices, services, protocols, and data together in one powerful platform. ioBroker connects smart home ecosystems that normally live in separate worlds and gives you one place to control, automate, visualize, and extend them.

  With its extensive adapter ecosystem, ioBroker integrates with technologies and services such as Zigbee, Z-Wave, KNX, MQTT, Shelly, Philips Hue, Sonos, Alexa, and many more. Mix products from different vendors without building your smart home around a single ecosystem.

  Once your devices are connected, use ioBroker's flexible automation tools to make your home work the way you want. Build automations visually with Blockly or create advanced logic with JavaScript and TypeScript. Do things like:

  * Turn lights, heating, or devices on automatically based on time, presence, sensor values, or other events

  * Combine devices from different manufacturers into a single automation

  * Collect and process data from sensors, energy meters, APIs, and connected services

  * Build personalized dashboards and control interfaces with ioBroker visualization tools

  * Extend your system with additional adapters and integrations as your smart home grows

  ioBroker runs on your own Umbrel server, keeping the core automation platform and configuration under your control. Individual adapters may communicate with external devices or cloud services depending on the integrations you choose.

  After installation, open ioBroker from the Umbrel home screen and follow the setup wizard to configure your system, create your admin user, and start adding adapters.
