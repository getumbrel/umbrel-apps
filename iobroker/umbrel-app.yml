name: ioBroker
version: "11.1.0"
tagline: Your smart home. Connected, automated, yours.
description: >-
  Bring your entire smart home together with ioBroker — a powerful open source automation platform built to connect devices, services, protocols, and data in one central system.

  Whether you're working with Zigbee, Z-Wave, KNX, MQTT, Shelly, Philips Hue, Sonos, or countless other ecosystems, ioBroker gives you the flexibility to integrate them through its extensive adapter ecosystem and manage everything from one place.

  Go beyond simple device control. Build sophisticated automations with Blockly, JavaScript, or TypeScript, combine data from different systems, and create personalized dashboards and control interfaces with ioBroker's visualization tools.

  ioBroker is designed for both simple setups and advanced smart homes. Start with a few devices and expand over time with new integrations, automation logic, visualizations, and community-developed adapters — without being locked into a single vendor or ecosystem.

  On Umbrel, your ioBroker installation and configuration run on your own server. Some adapters may connect to external devices or cloud services depending on the integrations you choose.

  After installation, open ioBroker from the Umbrel home screen and follow the setup wizard to configure your system and start adding adapters.

  Learn more at https://www.iobroker.net or join the community at https://forum.iobroker.net.
