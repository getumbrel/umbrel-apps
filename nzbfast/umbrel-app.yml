manifestVersion: 1
id: nzbfast
category: networking
name: nzbfast
version: "1.1.2"
tagline: Fast Usenet downloader with a SABnzbd-compatible API
description: >-
  nzbfast is a speed-focused Usenet (NZB) downloader written in Rust. It is one
  small binary with a low memory footprint, and it saturates a fast line with a
  handful of connections.


  Articles are verified while they arrive, so most jobs finish with no separate
  verify pass. Repair and unpack run only when they are actually needed, and
  extraction starts before the last article lands.


  🛠️ SET-UP INSTRUCTIONS


  Open nzbfast and add your Usenet provider in the Welcome panel. Nothing else
  needs configuring.


  To connect Sonarr, Radarr, Prowlarr or any other app that speaks to SABnzbd,
  add nzbfast as a SABnzbd download client. Go to Settings, then Security, to
  copy the API key that was generated for you on first run. Host is
  nzbfast_web_1 and port is 6789 for apps running on the same Umbrel.


  Finished downloads land in your Umbrel's shared Downloads folder. You can also
  drop an .nzb file into the app's watch folder and it is picked up
  automatically.
releaseNotes: ""

developer: nzbfast
website: https://nzbfast.github.io/nzbfast/
dependencies: []
repo: https://github.com/nzbfast/nzbfast
support: https://github.com/nzbfast/nzbfast/issues

port: 6789
gallery: []
path: ""

defaultUsername: ""
defaultPassword: ""

permissions:
  - STORAGE_DOWNLOADS

