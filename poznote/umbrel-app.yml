releaseNotes: |-
  Poznote 6.73.2 improves sidebar organization, sharing, Git sync, and editing polish:

  - Adds direct sidebar renaming for folders and notes, per-note content width controls, a toolbar theme switcher, and quicker workspace settings access.
  - Adds GitLab synchronization, clearer share management, temporarily disabled shares, in-place workspace creation, and more reliable API/MCP user-profile selection.
  - Adds manual note ordering, sidebar undo/redo and copy/cut/paste, folder duplication with attachments, nested Kanban groups, and task grouping by note.
  - Improves Markdown editing and preview behavior for wrapped lists, nested ordered lists, heading insertion, split-view note widths, and mobile modal stacking.
  - Fixes workspace-creation modal styling and sidebar folder/note margins.

  If you're updating from before Poznote 6.51.0, you may need to log in again because of the remember-me cookie security changes.

  If you're updating from before Poznote 6.21.0, existing Excalidraw diagrams may need to be opened, slightly modified, and saved again before their generated images match the current dark/light theme.

  Full release notes can be found at https://github.com/timothepoznanski/poznote/releases/tag/6.73.2
