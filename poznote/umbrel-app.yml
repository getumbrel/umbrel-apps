releaseNotes: |-
  ⚠️ MCP clients now require authentication. Your existing MCP URL and port 8340 stay the same, but connections will fail until you add an access token. Sign in to Poznote as an administrator, then open http://umbrel.local:8389/umbrel-mcp.php to get your token and setup instructions. Replace umbrel.local with your Umbrel's address if needed. Configure your client with an Authorization header of Bearer YOUR_TOKEN. The token stays the same across app restarts and updates. The built-in AI assistant does not need this token.

  Poznote 6.79.0 refreshes Settings, navigation, dashboard organization, and AI-assisted workflows:

  - Redesigns the desktop Settings page with a section list, remembered section selection, direct section links, row-based cards, and keyboard-friendly switches.
  - Adds customizable separator lines to the icon sidebar, regroups the default sidebar order, removes the Support heart button, and moves Favorites access to the Favorites system folder and dashboard.
  - Adds live note refresh and conflict-safe autosave so changes made by another tab, the API, MCP, or the AI assistant can be picked up without manual reloads.
  - Expands dashboard organization with drag-and-drop card ordering, wide cards, saved scopes, workspace tags/colors, multi-workspace views, and tag/date/color filters.
  - Improves the AI assistant panel, dashboard assistant access, current-note awareness, note/folder/task/reminder tools, and model/provider setup.
  - Adds richer embedded task lists and bearer-token authentication for MCP clients.

  If you're updating from before Poznote 6.51.0, you may need to log in again because of the remember-me cookie security changes.

  If you're updating from before Poznote 6.21.0, existing Excalidraw diagrams may need to be opened, slightly modified, and saved again before their generated images match the current dark/light theme.

  Full release notes can be found at https://github.com/timothepoznanski/poznote/releases/tag/6.79.0
dependencies: []
path: "/login.php"
defaultUsername: "admin_change_me"
defaultPassword: "admin"
