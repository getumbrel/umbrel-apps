releaseNotes: |-
  Poznote 6.68.4 improves shared links and public-note navigation:

  - Fixes shared item links behind reverse proxies that do not send `X-Forwarded-Port`, so copied and opened links no longer include the container's internal port.
  - Shows public-note "Copy section link" anchors only while hovering headings on desktop, while keeping them available on touch devices.
  - Removes the extra shadow from the "Close all tabs" button so it blends into the tab bar.

  If you're updating from before Poznote 6.51.0, you may need to log in again because of the remember-me cookie security changes.

  If you're updating from before Poznote 6.21.0, existing Excalidraw diagrams may need to be opened, slightly modified, and saved again before their generated images match the current dark/light theme.

  Full release notes can be found at https://github.com/timothepoznanski/poznote/releases/tag/6.68.4
dependencies: []
path: "/login.php"
defaultUsername: "admin_change_me"
defaultPassword: "admin"
