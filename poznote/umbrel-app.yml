releaseNotes: |-
  ⚠️ MCP clients require authentication. If you have not updated since Poznote 6.81.5, your existing MCP URL and port 8340 stay the same, but connections will fail until you add an access token. Sign in to Poznote as an administrator, then open http://umbrel.local:8389/umbrel-mcp.php to get your token and setup instructions. Replace umbrel.local with your Umbrel's address if needed. Configure your client with an Authorization header of Bearer YOUR_TOKEN. The token stays the same across app restarts and updates. The built-in AI assistant does not need this token.

  Poznote 6.86.0 adds voice, journal, account, and MCP/API improvements:

  - Adds optional self-hosted dictation, audio note recording, and attachment actions to open, download, transcribe, or delete files from a note.
  - Adds a framed journal view, diary management actions, customizable icon colors, manual workspace ordering, a refreshed first-account guide, and a dedicated My Account settings area.
  - Extends MCP and API support for note attachments, moving notes and folders between workspaces, creating diary entries, reaching templates, and paging note lists.
  - Adds a setting for safety snapshot retention before AI or MCP edits, faster note loading, more translated documentation/UI text, and clearer template guidance.
  - Fixes empty Markdown checkbox rendering, note/API/MCP workspace handling, MCP template conversion and folder moves, audio-file validation and transcription errors, Git Sync help text, and My Account navigation.

  If you're updating from before Poznote 6.51.0, you may need to log in again because of the remember-me cookie security changes.

  If you're updating from before Poznote 6.21.0, existing Excalidraw diagrams may need to be opened, slightly modified, and saved again before their generated images match the current dark/light theme.

  Full release notes can be found at https://github.com/timothepoznanski/poznote/releases/tag/6.86.0
dependencies: []
path: "/login.php"
defaultUsername: "admin_change_me"
defaultPassword: "admin"
