releaseNotes: |-
  Poznote 6.70.3 improves sharing, sync, backups, and note organization:

  - Full backup exports, restore uploads, S3 restores, S3 backups, and ZIP note imports now run as background jobs with progress, improving reliability for large accounts.
  - Adds editable folder shares, workspace-scoped Git sync, note archiving, Kanban sorting, reorderable tabs, middle-click tab opening, and stronger edit-lock protections.
  - Improves shortcuts and attachments with inherited shortcut icons, working shortcut attachment links on shared notes/folders, better attachment row alignment, and long filename wrapping.
  - Expands the sidebar note menu with duplicate, shortcut, print, convert, attachments, reminder, snapshots, search/replace, and information actions.
  - Adds a Favorites separator in the sidebar and fixes tab scroll position restoration.

  If you're updating from before Poznote 6.51.0, you may need to log in again because of the remember-me cookie security changes.

  If you're updating from before Poznote 6.21.0, existing Excalidraw diagrams may need to be opened, slightly modified, and saved again before their generated images match the current dark/light theme.

  Full release notes can be found at https://github.com/timothepoznanski/poznote/releases/tag/6.70.3
