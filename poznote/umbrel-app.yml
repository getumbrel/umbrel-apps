manifestVersion: 1
id: poznote
storage:
  dataRoot: data
name: Poznote
tagline: A powerful app for taking notes
category: files
version: "6.98.0"
port: 8389
description: >-
  📝 Poznote is a clean and focused application designed to help users capture, structure, and refine information in a flexible workspace. It combines a rich text editor with Markdown formatting to support both quick jotting and long form writing, allowing thoughts to grow and change without friction.


  External MCP clients require an access token. Sign in to Poznote as an administrator, then open http://umbrel.local:8389/umbrel-mcp.php to get your connection URL and token. If your Umbrel uses a different address, use that address instead of umbrel.local.


  The interface encourages fluid organization through tags, search, and customizable workspaces so ideas remain easy to find even as the collection expands. Poznote supports attachments for images, documents, and other files, making it possible to keep related material together within a single note.


  It includes tools for creating checklists, tasks, and reminders that integrate directly into the writing flow rather than feeling like separate modules. A built in drawing and diagramming tool powered by an Excalidraw integration allows users to sketch concepts, create charts, or visualize ideas alongside text.


  Notes can be edited, restored from the trash, exported for safekeeping, or duplicated to act as templates for recurring structures. Poznote aims to create a writing environment where text, media, ideas, and tasks coexist naturally, offering a streamlined way to manage information with clarity and continuity.
developer: Timothé Poznanski
website: https://poznote.com/
submitter: dennysubke
submission: https://github.com/getumbrel/umbrel-apps/pull/4268
repo: https://github.com/timothepoznanski/poznote
support: https://github.com/timothepoznanski/poznote/issues
gallery:
  - 1.jpg
  - 2.jpg
  - 3.jpg
  - 4.jpg
releaseNotes: |-
  Poznote 6.98.0 adds offline and organization improvements:

  - Adds an Offline sidebar page for notes and folders available without a network.
  - Adds a folder archive action that moves a folder, subfolders, and notes into the Archives workspace.
  - Improves short-screen sidebar behavior, rich text note wording, and the welcome note.
  - Fixes outline, snapshot-only attachment list, and wide-screen note info display issues.

  ⚠️ MCP clients require authentication. If you have not updated since Poznote 6.81.5, your existing MCP URL and port 8340 stay the same, but connections will fail until you add an access token. Sign in to Poznote as an administrator, then open http://umbrel.local:8389/umbrel-mcp.php to get your token and setup instructions. Replace umbrel.local with your Umbrel's address if needed. Configure your client with an Authorization header of Bearer YOUR_TOKEN. The token stays the same across app restarts and updates. The built-in AI assistant does not need this token.

  If you're updating from before Poznote 6.51.0, you may need to log in again because of the remember-me cookie security changes.

  If you're updating from before Poznote 6.21.0, existing Excalidraw diagrams may need to be opened, slightly modified, and saved again before their generated images match the current dark/light theme.

  Full release notes can be found at https://github.com/timothepoznanski/poznote/releases/tag/6.98.0
dependencies: []
path: "/login.php"
defaultUsername: "admin_change_me"
defaultPassword: "admin"
