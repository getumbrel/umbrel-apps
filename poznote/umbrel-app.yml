releaseNotes: |-
  Poznote 6.51.1 adds more editor customization and fixes sharing/export issues:

  - Added per-heading-level Markdown colors and a configurable code block background.
  - Added a confirmation toast when saving with Ctrl+S.
  - Moved pinned settings cards into user settings so they sync across browsers and devices, with automatic migration for existing pins.
  - Improved dashboard card pin controls on touch devices.
  - Fixed shared links for notes inside shared folders opening in a fresh browser session.
  - Fixed stray XML processing instructions and repeated non-breaking spaces appearing in HTML note content and exports.

  If you're updating from before Poznote 6.51.0, you may need to log in again because of the remember-me cookie security changes.

  If you're updating from before Poznote 6.21.0, existing Excalidraw diagrams may need to be opened, slightly modified, and saved again before their generated images match the current dark/light theme.

  Full release notes can be found at https://github.com/timothepoznanski/poznote/releases/tag/6.51.1
dependencies: []
path: "/login.php"
defaultUsername: "admin_change_me"
defaultPassword: "admin"
