releaseNotes: |-
  Poznote 6.68.2 fixes sharing and editor bugs:

  - Frees custom public links when shared notes, folders, or workspaces are deleted, including links that were stuck from earlier versions.
  - Pauses public links and attachments for notes moved to the trash until the note is restored.
  - Makes custom public link validation messages clearer and translated.
  - Fixes Backspace/Delete behavior around rich text headings so merged text keeps the right style and empty headings are removed cleanly.

  If you're updating from before Poznote 6.51.0, you may need to log in again because of the remember-me cookie security changes.

  If you're updating from before Poznote 6.21.0, existing Excalidraw diagrams may need to be opened, slightly modified, and saved again before their generated images match the current dark/light theme.

  Full release notes can be found at https://github.com/timothepoznanski/poznote/releases/tag/6.68.2
