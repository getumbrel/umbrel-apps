releaseNotes: |-
  ⚠️ MCP clients require authentication. If you have not updated since Poznote 6.81.5, your existing MCP URL and port 8340 stay the same, but connections will fail until you add an access token. Sign in to Poznote as an administrator, then open http://umbrel.local:8389/umbrel-mcp.php to get your token and setup instructions. Replace umbrel.local with your Umbrel's address if needed. Configure your client with an Authorization header of Bearer YOUR_TOKEN. The token stays the same across app restarts and updates. The built-in AI assistant does not need this token.

  Poznote 6.84.3 includes backup fixes, templates, app passwords, and interface improvements:

  - Fixes backup, export, restore, and download memory issues that could break large backups when custom themes or CSS were configured.
  - Adds reusable note templates, Markdown default view mode settings, app passwords for extensions/mobile clients/scripts, theme-list controls, and safer draft recovery.
  - Adds automatic snapshots before AI and MCP edits, manual snapshot shortcuts, live page customization controls, and SVG branding updates.
  - Improves streaming exports/restores, default-credential warnings, admin user password reset flows, PHP worker/memory settings, mobile back-button behavior, and Settings quick links.
  - Fixes Markdown preview spacing and dark-theme rendering issues, login/SSO theme styling, default note title and color-name localization, public-note line numbers, and cache busting for update-sensitive assets.

  If you're updating from before Poznote 6.51.0, you may need to log in again because of the remember-me cookie security changes.

  If you're updating from before Poznote 6.21.0, existing Excalidraw diagrams may need to be opened, slightly modified, and saved again before their generated images match the current dark/light theme.

  Full release notes can be found at https://github.com/timothepoznanski/poznote/releases/tag/6.84.3
dependencies: []
path: "/login.php"
defaultUsername: "admin_change_me"
defaultPassword: "admin"
