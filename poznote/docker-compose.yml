version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: poznote_app_1
      APP_PORT: 80

  app:
    image: ghcr.io/timothepoznanski/poznote:6.80.0@sha256:045035db3a207e246781f38d2623dc2fdc73d09ad9084c1708c2a7efaf4a2646
    restart: on-failure
    environment:
      SQLITE_DATABASE: /var/www/html/data/database/poznote.db
      HTTP_WEB_PORT: 80
    volumes:
      - ${APP_DATA_DIR}/data:/var/www/html/data
      - ${APP_DATA_DIR}/umbrel-mcp.php:/var/www/html/umbrel-mcp.php:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--timeout=5", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  mcp:
    image: ghcr.io/timothepoznanski/poznote-mcp:6.80.0@sha256:f0efc00e499bb8e8d07f3a9cdea4416be964069a8306be6757136bde52b6c8f5
    restart: on-failure
    environment:
      POZNOTE_API_URL: http://poznote_app_1:80/api/v1
      POZNOTE_DEBUG: ${POZNOTE_DEBUG:-false}
      POZNOTE_MCP_AUTH_TOKEN: ${APP_POZNOTE_MCP_AUTH_TOKEN:?MCP authentication token is required}
    ports:
      # External MCP clients need LAN access; authentication uses the required bearer token.
      - "8340:8045"
    volumes:
      - "${APP_DATA_DIR}/data:/var/www/html/data:ro"
    depends_on:
      - app
