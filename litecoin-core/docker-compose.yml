services:
  app_proxy:
    environment:
      APP_HOST: litecoin-core_app_1
      APP_PORT: 3000

  app:
    image: ghcr.io/ryleastark/umbrel-litecoin-core-gui:v0.3.1@sha256:23dfbcb53ada2df4fe24cb0a1784b6bca7f27a389ed28bcf001ec7c9fc408341
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 15m30s
    ports:
      - "${APP_LITECOIN_P2P_PORT}:${APP_LITECOIN_P2P_PORT}"
      - "${APP_LITECOIN_RPC_PORT}:${APP_LITECOIN_RPC_PORT}"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      LITECOIN_DIR: /data/litecoin
      APP_STATE_DIR: /data/app
      APPS_SUBNET: "${NETWORK_IP}/16"
      P2P_PORT: "${APP_LITECOIN_P2P_PORT}"
      P2P_WHITEBIND_PORT: "${APP_LITECOIN_P2P_WHITEBIND_PORT}"
      RPC_PORT: "${APP_LITECOIN_RPC_PORT}"
      TOR_PORT: "${APP_LITECOIN_TOR_PORT}"
      ZMQ_RAWBLOCK_PORT: "${APP_LITECOIN_ZMQ_RAWBLOCK_PORT}"
      ZMQ_RAWTX_PORT: "${APP_LITECOIN_ZMQ_RAWTX_PORT}"
      ZMQ_HASHBLOCK_PORT: "${APP_LITECOIN_ZMQ_HASHBLOCK_PORT}"
      ZMQ_SEQUENCE_PORT: "${APP_LITECOIN_ZMQ_SEQUENCE_PORT}"
      ZMQ_HASHTX_PORT: "${APP_LITECOIN_ZMQ_HASHTX_PORT}"
      TOR_HOST: "${APP_LITECOIN_TOR_PROXY_IP}"
      TOR_SOCKS_PORT: "9050"
      TOR_CONTROL_PORT: "9051"
      TOR_CONTROL_PASSWORD: "moneyprintergobrrr"
      LITECOIND_IP: "${APP_LITECOIN_NODE_IP}"
      RPC_USER: "${APP_LITECOIN_RPC_USER}"
      RPC_PASS: "${APP_LITECOIN_RPC_PASS}"
      DEVICE_DOMAIN_NAME: "${DEVICE_DOMAIN_NAME}"
      P2P_HIDDEN_SERVICE: "${APP_LITECOIN_P2P_HIDDEN_SERVICE}"
      RPC_HIDDEN_SERVICE: "${APP_LITECOIN_RPC_HIDDEN_SERVICE}"
    networks:
      default:
        ipv4_address: "${APP_LITECOIN_NODE_IP}"

  tor:
    image: ghcr.io/getumbrel/tor:0.4.9.11@sha256:e382b8629c0dfef6ceb396b062622d4e4e955b19d6f16b883fd2c0723ad5671a
    user: "1000:1000"
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/torrc:/etc/tor/torrc:ro
      - ${TOR_DATA_DIR}:/data
    environment:
      HOME: "/tmp"
    networks:
      default:
        ipv4_address: "${APP_LITECOIN_TOR_PROXY_IP}"
