manifestVersion: 1
id: shelfmark
storage:
  dataRoot: data
folderAccess:
  - id: umbrel-downloads:books
    name: Book downloads
    note: Downloaded books are stored here and are available inside Shelfmark at /books.
    mounts:
      - service: app
        targetPath: /books
name: Shelfmark
tagline: Search for and manage e-books and audiobooks
category: files
version: v1.4.0
port: 8184
description: >-
  Shelfmark is a self-hosted web app for discovering and managing e-books and
  audiobooks from configured sources. It supports metadata search, multiple
  download sources, request workflows, and a unified download queue.


  Configure the sources and download clients you want to use in Shelfmark.
  Only access or download content you have the right to use.
releaseNotes: ""
developer: Calibrain
website: https://github.com/calibrain/shelfmark
dependencies: []
repo: https://github.com/calibrain/shelfmark
support: https://github.com/calibrain/shelfmark/issues
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
permissions:
  - STORAGE_DOWNLOADS
submitter: telskamp
submission: https://github.com/getumbrel/umbrel-apps/pull/6188
