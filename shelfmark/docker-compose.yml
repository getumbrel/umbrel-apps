version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: shelfmark_app_1
      APP_PORT: 8084

  app:
    image: ghcr.io/calibrain/shelfmark:v1.4.0@sha256:4ef757349c3c7a7d90ba95b1e2a46ce4dd460a4776efbcf2aa1b1c476e7d5de5
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ}
      FLASK_PORT: 8084
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/books
