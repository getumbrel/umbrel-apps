description: 'BEFORE UPDATING: send any crypto held in the app native wallet to another wallet you control, confirm receipt, and back up the old wallet and recovery information. This version removes native-wallet access from the app. Never delete legacy wallet data or assume uninstalling will preserve it. Run a Monero node and connect your RandomX miners on TCP 1921. Use an external primary address or subaddress you control. Each found block pays 99% directly to that address and a separate fixed 1% developer output, rounded down to whole piconero. No hashrate is diverted and the app never requests your seed or private keys. Includes live worker telemetry, hashrate history, block records, appearance choices and read-only chain lookup. Native-wallet access is removed. Existing wallet files are preserved during an upgrade; they are never deleted, automatically swept or exposed by this app. Kraskus Pool remains under development.'
