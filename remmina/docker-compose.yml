version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: remmina_server_1
      APP_PORT: 3000

  server:
    image: linuxserver/remmina:1.4.43@sha256:fd394933f0c1d290153ddf278f332fad6575c98e67d5ed36d5cc643b72d8b921
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
    restart: on-failure
    environment:
      - PUID=1000
      - PGID=1000
    shm_size: "1gb"
