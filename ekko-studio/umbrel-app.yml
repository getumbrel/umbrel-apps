manifestVersion: 1
id: ekko-studio
storage:
  dataRoot: data
category: ai
name: Ekko Studio
version: "0.8.32"
tagline: Manage your AI agent from your browser
description: >-
  Ekko Studio is a browser workspace for AI agents, with conversations, file tools, persistent memory, skills, and model settings. It includes both the Ekko and Hermes runtimes so you can choose an agent for each conversation.


  🔑 On first launch, sign in with the default credentials shown by Umbrel and change your password when prompted.


  Connect your own supported model provider in the app; provider subscriptions or API usage may cost extra.


  To use Hermes, add your provider and model in Models, then select Hermes when starting a new chat. Ask it to work with files in /opt/data or explicitly save something to memory. Chats, provider settings, agent memory, and workspace files are stored on your Umbrel across restarts. Ekko and Hermes have separate memory; select the same runtime when continuing your work.


  This package provides the browser interface. Native-app cloud connectivity, peer-to-peer connections, and preview-server ports are not exposed. Optional subscription sign-in requires approval with the provider; API-key setup is available in the browser.
releaseNotes: >-
  ⚠️ Providers are now shared across all Profiles within a Studio account. Providers with the same name are merged, preferring the default Profile even if endpoints or credentials differ. Before updating, give providers distinct names if you need to keep different endpoints. Existing conversations with merged providers will use the retained endpoint.


  ⚠️ Trusted plugin pages can now access the host page and browser-stored login credentials. Only install plugins you trust.


  This update improves model compatibility and chat usability:


  - Preserves prompt-cache settings when converting model requests and improves Moonshot cache-usage reporting.
  - Shows installation guidance for supported plugin agents whose command-line tools are missing.
  - Refreshes cumulative token usage after plugin-agent replies.
  - Removes the group-chat migration popup and improves remote-device dialogs on narrow windows.
  - Improves clickable local file links in agent summaries and code reviews.
  - Fixes conversation reconnection when Studio inherits a Hermes worker's Bridge endpoint.


  Full release notes can be found at https://github.com/EKKOLearnAI/ekko-studio/releases/tag/v0.8.32
