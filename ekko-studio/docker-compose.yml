services:
  app_proxy:
    environment:
      APP_HOST: ekko-studio_server_1
      APP_PORT: 6060
  server:
    image: ekkoye8888/hermes-web-ui:v0.7.33@sha256:9dc2d2656ce870a8a006e664212e6ab0db48b5e25131b38d8a73c43243346809
    user: "1000:1000"
    init: true
    restart: on-failure
    environment:
      PORT: "6060"
      HOME: /home/agent
      HERMES_HOME: /home/agent/.hermes
      HERMES_BIN: /opt/hermes/.venv/bin/hermes
      HERMES_WEB_UI_MANAGED_GATEWAY: "1"
    volumes:
      # Keep agent settings and native CLI state writable and persistent.
      - ${APP_DATA_DIR}/data/home:/home/agent
      - ${APP_DATA_DIR}/data/hermes:/home/agent/.hermes
      - ${APP_DATA_DIR}/data/studio:/home/agent/.hermes-web-ui
      # Override the image's anonymous workspace volume with Umbrel-owned data.
      - ${APP_DATA_DIR}/data/workspace:/opt/data
