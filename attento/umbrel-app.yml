name: Attento!
version: "1.2.0"
tagline: Phone alerts from your ONVIF and RTSP cameras
description: >-
  Attento! watches the cameras on your home network and sends an alert to your phone when someone or something moves where you said: the gate, the yard, the barn. Every alert comes with its clip, and with Attento! Pro it also tells a person from a vehicle or an animal.


  📷 CAMERAS


  The requirement: ONVIF or RTSP cameras, the ones that send their video over your home network without going through a cloud. Attento! finds them by itself and works with these brands: Tapo, VIGI and Mercusys (TP-Link), Reolink, Hikvision, HiLook, Annke, Ezviz, Dahua, Amcrest, Lorex, Imou, Uniview, Hanwha Wisenet, Axis, Bosch, Vivotek, Milesight, Foscam, D-Link, Eufy, ICSee and XMeye, CamHi, Vstarcam, Yoosee, Tuya and Smart Life. Other ONVIF cameras are asked where their video is.


  Some come out of the box with RTSP off (Reolink, Ezviz, Eufy) or ONVIF off (Tuya, Smart Life): turn it on in the camera's app. Cloud-only cameras (Ring, Nest, Arlo, Blink, Xiaomi) cannot work, nor can battery cameras that keep no continuous video, such as the Tapo and Reolink battery models.


  This app is the Attento! home program, the same one that runs on a Mac or a Windows PC, so your Umbrel does the watching and no computer has to stay on. It finds the cameras on your network by itself and keeps their passwords on your Umbrel, encrypted with its own key: they never go to the Attento! server.


  🖥️ THE CONTROL ROOM


  Open Attento! from your Umbrel on a computer, a tablet or the TV: every camera live, the alerts with their clips and the alarm, like the Control room of the Mac app. In TV mode, the camera that moved comes to the front.


  ⚠️ Attento! speaks English and Italian. It needs an Attento! account (there is a free plan with one camera, at attento.online) and the Attento! app on your phone. If Attento! already runs on a Mac or a PC at home, quit it there before you link your Umbrel: two home programs on the same cameras disturb each other.


  🛠️ SET-UP


  - On your phone, open Attento! → Settings → Link a computer and tap Show code for the computer.


  - Open Attento! on your Umbrel and type the 6-character code.


  - For each camera it finds, type the camera's username and password, tap Save, then Test connection.
