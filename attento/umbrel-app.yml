manifestVersion: 1
id: attento
storage:
  dataRoot: data
category: automation
name: Attento!
version: "1.1.0"
tagline: Phone alerts from your Tapo and Reolink cameras
description: >-
  Attento! watches the Tapo and Reolink cameras on your home network and sends an alert to your phone when someone or something moves where you said: the gate, the yard, the barn. Every alert comes with its clip, and with Attento! Pro it also tells a person from a vehicle or an animal.


  This app is the Attento! home program, the same one that runs on a Mac or a Windows PC, so your Umbrel does the watching and no computer has to stay on. It finds the cameras on your network by itself and keeps their passwords on your Umbrel, encrypted with its own key: they never go to the Attento! server.


  🖥️ THE CENTRALE


  Open Attento! from your Umbrel on a computer, a tablet or the TV: every camera live, the alerts with their clips and the alarm, like the Centrale (the dashboard) of the Mac app. In TV mode, the camera that moved comes to the front.


  ⚠️ Attento! is in Italian. It needs an Attento! account (there is a free plan with one camera, at attento.online) and the Attento! app on your phone. If Attento! already runs on a Mac or a PC at home, quit it there before you link your Umbrel: two home programs on the same cameras disturb each other.


  🛠️ SET-UP


  - On your phone, open Attento! → Impostazioni → Collega un computer and tap Mostra codice per il computer.


  - Open Attento! on your Umbrel and type the 6-character code.


  - For each camera it finds, type the camera's username and password, tap Salva, then Prova collegamento.
