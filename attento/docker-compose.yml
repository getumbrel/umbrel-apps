version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: attento_web_1
      APP_PORT: 8080

  agent:
    # The Attento! home program. Host networking is needed to find the cameras
    # on the home network: ONVIF WS-Discovery (multicast), the ARP table (each
    # camera's MAC, so a camera keeps its identity when the router gives it a
    # new address) and a scan of the local /24 for RTSP/ONVIF ports. It opens
    # no port: its page is a unix socket in data/run, served by `web` below,
    # behind Umbrel's login.
    image: ghcr.io/claudiosperindio-sketch/attento-home:1.1.3@sha256:8d446858354531142a91ca328f103eb2e97983a5b1f3cefacc34c392d875c53c
    network_mode: host
    user: "1000:1000"
    init: true
    read_only: true
    restart: on-failure
    stop_grace_period: 20s
    environment:
      # encrypts the camera passwords in data/attento/config.json (exports.sh)
      ATTENTO_SECRET_KEY: ${APP_ATTENTO_SECRET_KEY}
    volumes:
      - ${APP_DATA_DIR}/data/attento:/data
      - ${APP_DATA_DIR}/data/run:/run/attento
    tmpfs:
      # the last 30 seconds of each camera, rewritten all the time: in memory, not on the SSD
      - /tmp:size=1g

  web:
    # The door between app_proxy and the program's socket (bytes only).
    image: ghcr.io/claudiosperindio-sketch/attento-home:1.1.3@sha256:8d446858354531142a91ca328f103eb2e97983a5b1f3cefacc34c392d875c53c
    command: ["node", "web.mjs"]
    user: "1000:1000"
    init: true
    read_only: true
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data/run:/run/attento
