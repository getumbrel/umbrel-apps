manifestVersion: 1
id: drivenest
name: DriveNest
tagline: Private two-way cloud file sync with a local dashboard
category: files
version: "0.2.0"
description: >-
  DriveNest keeps a private local mirror of your Google Drive files on Umbrel
  using rclone bisync. Browse and manage mirrored files, preview changes with a
  dry run, trigger synchronization manually, watch local changes, and poll for
  remote changes from a built-in dashboard.


  Setup is browser-based: generate an rclone configuration on another computer,
  paste it into DriveNest, and run a dry sync before enabling live two-way sync.
  All configuration, sync state, and mirrored files remain inside Umbrel-managed
  app data.


  Google Drive is a trademark of Google LLC. DriveNest is an independent
  community project and is not affiliated with, endorsed by, or sponsored by
  Google LLC.
