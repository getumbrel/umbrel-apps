manifestVersion: 1
id: plausible
category: developer
name: Plausible Analytics
version: "3.2.2"
tagline: Easy to use and privacy-friendly Google Analytics alternative
description: >-
  Plausible is intuitive, lightweight and open source web analytics.
  No cookies and fully compliant with GDPR, CCPA and PECR.


  ⚙️ You may need to expose Plausible to the web in order to use the app in its intended way with websites.
  The easiest way to do this is to use the 'Cloudflare Tunnel' app from the Umbrel app store, and expose Plausible to the internet using your own domain.
releaseNotes: >-
  This security update fixes a vulnerability that could allow someone with a Plugins API token to execute code on the server. Updating is recommended for all users.


  Plugins API pagination cursors are now signed and verified. API clients using an older cursor must restart pagination from the first page. Pending invitation IDs are also no longer exposed to site editors.


  Note: Plausible uses port 9093. If you still have bookmarks or reverse proxy rules using its previous port, update them accordingly.


  Full release notes can be found at https://github.com/plausible/analytics/releases/tag/v3.2.2
developer: Plausible Community Edition
website: https://plausible.io/
repo: https://github.com/plausible/analytics
support: https://github.com/plausible/community-edition/issues
port: 9093
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
path: ""
defaultUsername: ""
defaultPassword: ""
dependencies: []
submitter: ~dibref-labter
submission: https://github.com/getumbrel/umbrel-apps/pull/1371
