manifestVersion: 1
id: blinko
storage:
  dataRoot: data
environment:
  - name: BLINKO_MCP_STDIO_ALLOWLIST
    services:
      - app
    default: "[]"
    note: >-
      Optional: only needed for MCP integrations that run local commands (stdio). Enter a JSON array with each integration’s exact command, args, and env. Only approve commands you trust: they can access your Blinko data. Leave empty or use [] to keep local commands blocked.
name: Blinko
tagline: An AI-powered hub for your ideas and notes
category: files
version: "1.8.9"
port: 1111
description: >-
  😉 Blinko is an open-source application that combines note-taking, microblogging, pastebin functionality, task management, and AI-powered features in a self-hosted environment. The platform allows users to quickly and efficiently capture their thoughts, with full Markdown support for easy formatting.


  With the integration of AI models like OpenAI or Ollama, content can be intelligently searched and organized.

  If you want to use the Ollama instance of your Umbrel, enter the following URL in the settings to connect to it: **http://ollama_ollama_1:11434**


  The application provides a flexible way to manage notes, which can remain private or be shared publicly. Regular automatic backups and seamless data import and export ensure that users always retain control over their content. Since Blinko is self-hosted, users maintain full data sovereignty and can rely on a secure environment without commercial restrictions.


  Built on Next.js, Blinko is optimized for speed and efficiency, offering a responsive and modern user experience. As an open-source project, it encourages collaboration and is available for free without hidden fees. It is designed for anyone looking for a powerful and customizable solution for digital organization.
developer: Blinko
website: https://blinko-demo.vercel.app/
submitter: dennysubke
submission: https://github.com/getumbrel/umbrel-apps/pull/2183
repo: https://github.com/blinko-space/blinko
support: https://github.com/blinko-space/blinko/issues
gallery:
  - 1.jpg
  - 2.jpg
  - 3.jpg
  - 4.jpg
  - 5.jpg
releaseNotes: >-
  This update improves Blinko’s security and compatibility. No extra setup is needed for regular note-taking or AI features.


  If you use Blinko’s desktop or mobile apps, update those too. If you were halfway through signing in with two-factor authentication, start the sign-in again.


  🔧 **Only for users of MCP integrations that run local commands (stdio):** These integrations now need your approval before they can run. MCP integrations that connect through a URL (HTTP) are unaffected.


  To approve a local integration, open Blinko’s app settings **in Umbrel** → Advanced → Environment variables. Set `BLINKO_MCP_STDIO_ALLOWLIST` to a JSON array containing the integration’s exact `command`, `args`, and `env` values. Only approve commands you trust, as they can access your Blinko data.


  Saving restarts Blinko. Your approvals are kept across restarts and app updates. This setting requires umbrelOS 2.0 or later.


  Back up your Blinko data before updating.


  [Full release notes](https://github.com/blinko-space/blinko/releases/tag/1.8.9)
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
