manifestVersion: 1
id: papra
storage:
  dataRoot: data
name: Papra
tagline: The minimalistic document archiving platform
category: files
version: "26.7.1"
description: >-
  Papra is a minimalistic document management and archiving platform. It is designed to be simple to use and accessible to everyone. 
  
  
  Papra is a platform for long-term document storage and management, like a digital archive for your documents.


  Forget about that receipt of that gift you bought for your friend last year, or that warranty for your new phone. With Papra, you can easily store, forget, and retrieve your documents whenever you need them.
developer: Papra
website: https://papra.app
submitter: Kanishk Pachauri
repo: https://github.com/papra-hq/papra
submission: https://github.com/getumbrel/umbrel-apps/pull/3949
support: https://github.com/papra-hq/papra/issues
port: 8112
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
releaseNotes: >-
  This update improves document search and processing and includes security fixes.


  - Search across all pages in the advanced PDF viewer with Ctrl+F or Cmd+F, including match highlighting and navigation.

  - Reprocess existing documents to run content extraction and tagging again.

  - Use Papra offline without downloading fonts from an external service.

  - Improved OCR for rotated images and fixed reinviting users to organizations.

  - Security fixes for registration through custom OAuth providers, email intake webhook validation, and the underlying runtime.


  If you have manually enabled email intake, you must explicitly configure INTAKE_EMAILS_WEBHOOK_SECRET. API integrations should also account for document deletion returning HTTP 204 with no response body and profile updates returning only public user fields.


  Full release notes can be found at https://github.com/papra-hq/papra/releases/tag/%40papra/app%4026.7.1
