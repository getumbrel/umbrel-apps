manifestVersion: 1
id: trilium-notes
storage:
  dataRoot: data
category: files
name: Trilium Notes
version: "v0.106.0"
tagline: Build your personal knowledge base with Trilium Notes
description: >-
  Features


  - Notes can be arranged into arbitrarily deep tree. Single note can be placed into multiple places in the tree (see cloning)

  - Rich WYSIWYG note editing including e.g. tables, images and math with markdown autoformat

  - Support for editing notes with source code, including syntax highlighting

  - Fast and easy navigation between notes, full text search and note hoisting

  - Seamless note versioning

  - Note attributes can be used for note organization, querying and advanced scripting

  - Synchronization with self-hosted sync server (there's a 3rd party service for hosting synchronisation server)

  - Sharing (publishing) notes to public internet

  - Strong note encryption with per-note granularity

  - Sketching diagrams with bult-in Excalidraw (note type "canvas")

  - Relation maps and link maps for visualizing notes and their relations

  - Scripting - see Advanced showcases

  - REST API for automation

  - Scales well in both usability and performance upwards of 100 000 notes

  - Touch optimized mobile frontend for smartphones and tablets

  - Night theme

  - Evernote and Markdown import & export

  - Web Clipper for easy saving of web content
developer: TriliumNext
website: https://github.com/TriliumNext
dependencies: []
repo: https://github.com/TriliumNext/Trilium
support: https://github.com/TriliumNext/Trilium/wiki
port: 3779
gallery:
  - 1.jpg
  - 2.jpg
  - 3.jpg
  - 4.jpg
path: /#root
defaultUsername: ""
defaultPassword: ""
torOnly: false
submitter: Pranshu Agrawal
submission: https://github.com/getumbrel/umbrel-apps/pull/199
releaseNotes: >-
  Trilium v0.106.0 includes a Kanban board overhaul, improved search, Markdown import/export improvements, and a new loading screen.


  Highlights:
    - Rebuilds Kanban boards with column icons/colors/limits, an optional inbox, filtering, multi-select card actions, keyboard shortcuts, and better large-board performance
    - Improves search with better fuzzy matching, searchable link previews/reference targets, multiline full search, syntax highlighting, and autocomplete
    - Improves Markdown import/export, PDF OCR support, note sorting, geomaps, presentations, Mermaid previews, quick search, and mobile API logs
    - Adds Google Antigravity as an LLM provider and improves GitHub Copilot shim detection
    - Includes many bug fixes, including sync, browser navigation, in-page search, list editing, quick search, and deleted-note display fixes


  Breaking change: direct `main.cjs` launch configurations must be updated, and exact-value search now requires full-value equality. If you're updating from a pre-v0.104.0 version, backend scripting and SQL console access are also now disabled by default for safer server operation.


  Full release notes are available at https://github.com/TriliumNext/Trilium/releases/tag/v0.106.0
