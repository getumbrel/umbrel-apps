manifestVersion: 1
id: trilium-notes
storage:
  dataRoot: data
category: files
name: Trilium Notes
version: "v0.107.0"
tagline: Build your personal knowledge base with Trilium Notes
description: >-
  Features


  - Notes can be arranged into arbitrarily deep tree. Single note can be placed into multiple places in the tree (see cloning)

  - Rich WYSIWYG note editing including e.g. tables, images and math with markdown autoformat

  - Support for editing notes with source code, including syntax highlighting

  - Fast and easy navigation between notes, full text search and note hoisting

  - Seamless note versioning

  - Note attributes can be used for note organization, querying and advanced scripting

  - Synchronization with self-hosted sync server (there's a 3rd party service for hosting synchronisation server)

  - Sharing (publishing) notes to public internet

  - Strong note encryption with per-note granularity

  - Sketching diagrams with bult-in Excalidraw (note type "canvas")

  - Relation maps and link maps for visualizing notes and their relations

  - Scripting - see Advanced showcases

  - REST API for automation

  - Scales well in both usability and performance upwards of 100 000 notes

  - Touch optimized mobile frontend for smartphones and tablets

  - Night theme

  - Evernote and Markdown import & export

  - Web Clipper for easy saving of web content
developer: TriliumNext
website: https://github.com/TriliumNext
dependencies: []
repo: https://github.com/TriliumNext/Trilium
support: https://github.com/TriliumNext/Trilium/wiki
port: 3779
gallery:
  - 1.jpg
  - 2.jpg
  - 3.jpg
  - 4.jpg
path: /#root
defaultUsername: ""
defaultPassword: ""
torOnly: false
submitter: Pranshu Agrawal
submission: https://github.com/getumbrel/umbrel-apps/pull/199
releaseNotes: >-
  Update all desktop and mobile clients alongside your server: this release changes the sync protocol, so older clients cannot sync. Your database is automatically backed up and migrated on first start; older Trilium versions cannot open the migrated database.


  - Compose notes with editable embedded notes, live excerpts, block references, columns, drawings, and media
  - Merge and sort table cells, with improved table editing on touchscreens
  - Refreshed search, navigation, shared pages, and mobile layouts
  - AI tool calls can request approval before reading or changing notes
  - Fixes lost note modifications during sync, protected-note searches, and Markdown imports containing dollar signs


  The old interface layout has been removed. Multi-level #sorted expressions must prefix label names with # (for example, #priority desc, #dueDate). ETAPI login and new-device synchronization require a TOTP code when two-factor authentication is enabled.


  Upgrading from an older release? Exact-value search requires full-value equality. If you're updating from a pre-v0.104.0 version, backend scripting and SQL console access are disabled by default for safer server operation.


  Full release notes are available at https://github.com/TriliumNext/Trilium/releases/tag/v0.107.0
