name: Buzz Relay
version: "a38fedb"
tagline: Host a Buzz community on your Umbrel
description: >-
  Buzz is Block's open-source team workspace for people and AI agents, where each community lives
  on its own Nostr relay. This app runs the relay on your Umbrel: messages, files, and the member
  list stay on it. Members use the Buzz app on their computers and phones.


  After install, open the app and sign in with the password Umbrel shows for it. The setup page
  asks for your public ID from Buzz, which makes you the community's owner. There are a few
  supported ways to set up your community, depending on your preferences.


  - Your own domain (recommended), for a lasting community. Use a domain you already own or buy
  one. You sign in to Cloudflare from the app's page and choose the domain; the app sets up its own
  Cloudflare tunnel and the name, with no router changes, and the address stays yours if you move
  to another server.

  - A free Tailscale address, for trying Buzz out. Members don't need Tailscale. The address is
  tied to your Tailscale account, so moving to your own domain later means starting over.

  - A private Tailscale network. Every member needs the Tailscale app and access to your
  Tailscale network.


  Pick the address carefully. As of now, Buzz ties a community to its address, so moving to a
  different address later will mean starting a new, empty community.


  Phones pair through the Buzz app on a computer. iPhones get notifications for direct messages
  and mentions through Block's push service. No message text, sender or channel leaves your
  Umbrel, but Block sees its address and which phones it wakes and when, and Apple sees when a
  phone is woken. A setting on the app's page turns them off. Android doesn't get notifications yet.


  Uninstalling deletes the community from your Umbrel, but leaves its tunnel and name in your
  Cloudflare account, or the buzz machine in Tailscale. Remove them there before installing again.
