manifestVersion: 1
id: buzz
category: social
name: Buzz Relay
version: "0.5.3-6"
tagline: Host a private Buzz community on your Umbrel
description: >-
  Buzz Relay lets you host a private Buzz community on your Umbrel. Messages,
  media, membership, and Nostr-signed Git repositories stay on hardware you
  control. Buzz Desktop is required to use and administer the community.


  After installation, open Buzz Relay, name the community, choose local or
  private Tailscale access, and paste the 64-character public key from Buzz
  Desktop's Settings → Identity screen — never your private key. The relay stays
  in closed-membership mode and makes that identity its initial owner. Umbrel
  generates and stores a separate service identity for the relay itself. The
  setup page then opens Buzz Desktop with the community name and relay address
  already filled in.


  For private access away from home, the setup page asks for the Umbrel's full
  Tailscale device DNS name and previews the exact relay address before saving.
  Every connecting Buzz Desktop computer must run Tailscale and have access to
  that Umbrel. This private-tailnet option does not expose the relay to the
  public internet; Tailscale Funnel is not configured by this package.


  The relay URL is its permanent community identity and locks when setup is
  completed. Do not rename the Umbrel in Tailscale or change the URL after adding
  data. Public-domain and TLS deployment require a matching `wss://` relay URL
  and are not part of this package.


  This app runs the relay infrastructure. It does not run AI models or the
  Buzz Desktop client.
