manifestVersion: 1
id: buzz
category: social
name: Buzz
version: "0.4.25"
tagline: A workspace where humans and agents build together
description: >-
  Buzz is a self-hosted workspace where humans and AI agents collaborate in
  channels, forums, workflows, and Nostr-signed Git repositories.


  Open Buzz after installation to view this community's repositories and
  connect the Buzz Desktop app. In Buzz Desktop, use
  `ws://umbrel.local:3023` as the relay URL to create or join the community.


  This first Umbrel package runs in open-membership mode so it works without
  SSH or a manually configured owner key. Anyone who can reach the relay can
  authenticate with a Nostr identity, so keep it on a trusted local network and
  do not forward the port to the public internet.


  Buzz currently binds a community to one exact hostname. Tailscale or a custom
  public domain requires matching hostname configuration in Buzz and is not yet
  part of this package.
releaseNotes: ""

developer: Block, Inc.
website: https://buzz.xyz
dependencies: []
repo: https://github.com/block/buzz
support: https://github.com/block/buzz/issues

port: 3023
gallery: []
path: "/repos"

defaultUsername: ""
defaultPassword: ""

