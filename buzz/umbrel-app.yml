manifestVersion: 1
id: buzz
category: social
name: Buzz Relay
version: "0.5.3-7"
tagline: Host a Buzz community on your Umbrel
description: >-
  Buzz Relay hosts your community's messages, media, membership, and
  Nostr-signed Git repositories on your Umbrel. Buzz Desktop is required to use
  and administer the community.


  Tailscale Funnel gives the relay a stable public, encrypted address so members
  can connect without installing Tailscale. Sign in to the Tailscale app on your
  Umbrel once, then Buzz Relay prepares the public address automatically.


  Name the community and paste the 64-character public key from Buzz Desktop's
  Settings → Identity screen. The relay stays in closed-membership mode and
  makes that identity its initial owner. Never paste a private key.
releaseNotes: ""

developer: Block, Inc.
website: https://buzz.xyz
dependencies:
  - tailscale
repo: https://github.com/block/buzz
support: https://github.com/block/buzz/issues

port: 3023
gallery: []
path: "/setup"

defaultUsername: ""
defaultPassword: ""

submitter: Pavlenex
submission: https://github.com/getumbrel/umbrel-apps/pull/5928
