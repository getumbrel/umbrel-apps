manifestVersion: 1
id: buzz
category: social
name: Buzz Relay
version: "0.5.3"
tagline: Your private relay for Buzz communities
description: >-
  Run the open-source Buzz relay on your Umbrel. Your messages, media,
  membership, and Nostr-signed Git repositories stay on hardware you control.


  After installation, open Buzz Relay and paste your 64-character public key
  from Buzz Desktop. The relay stays in closed-membership mode and makes that
  identity its owner. Then join `ws://umbrel.local:3023` from Buzz Desktop and
  invite other members there.


  The relay URL is its permanent community identity. This package is configured
  for local Umbrel access; do not expose port 3023 publicly or change the URL
  after adding data. Public-domain and TLS deployment require a matching
  `wss://` relay URL and are not part of this package.


  Buzz Desktop is required to use and administer the community. This app runs
  the relay infrastructure; it does not run AI models or the desktop client.
releaseNotes: ""

developer: Block, Inc.
website: https://buzz.xyz
dependencies: []
repo: https://github.com/block/buzz
support: https://github.com/block/buzz/issues

port: 3023
gallery: []
path: "/setup"

defaultUsername: ""
defaultPassword: ""

submitter: Pavlenex
submission: https://github.com/getumbrel/umbrel-apps/pull/5928
