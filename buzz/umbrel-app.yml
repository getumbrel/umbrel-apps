manifestVersion: 1
id: buzz
category: social
name: Buzz Relay
version: "0.5.3"
tagline: Host a private Buzz community on your Umbrel
description: >-
  Buzz Relay lets you host a private Buzz community on your Umbrel. Messages,
  media, membership, and Nostr-signed Git repositories stay on hardware you
  control. Buzz Desktop is required to use and administer the community.


  After installation, open Buzz Relay and paste the 64-character public key
  from Buzz Desktop's Settings → Identity screen — never your private key. The
  relay stays in closed-membership mode and makes that identity its permanent
  owner. Then choose Join an existing community in Buzz Desktop, enter
  `ws://umbrel.local:3023`, and invite the people and agents you want there.


  The relay URL is its permanent community identity. This package is configured
  for local Umbrel access; do not expose port 3023 publicly or change the URL
  after adding data. Public-domain and TLS deployment require a matching
  `wss://` relay URL and are not part of this package.


  This app runs the relay infrastructure. It does not run AI models or the
  Buzz Desktop client.
releaseNotes: ""

developer: Block, Inc.
website: https://buzz.xyz
dependencies: []
repo: https://github.com/block/buzz
support: https://github.com/block/buzz/issues

port: 3023
gallery: []
path: "/setup"

