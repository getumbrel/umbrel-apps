releaseNotes: >-
  On first startup, this update cleans existing rich text and tag names. Text that exceeds its field limit after cleaning is shortened; downgrading does not restore removed content. Back up your data before updating.


  Security improvements strengthen validation of federated content, remote attachments, and file downloads.


  Remote trails, lists, comments, and summit logs synchronize more reliably, with limits that protect against slow or oversized remote content. Previously downloaded content remains readable if a refresh fails.


  If a federated delivery is rejected shortly after upgrading, repeat the action on the sending instance. Accounts created before changing your instance hostname or port cannot publish new federated content to updated peers.


  Full release notes: https://github.com/open-wanderer/wanderer/releases/tag/v0.21.2
