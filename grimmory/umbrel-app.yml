manifestVersion: 1
id: grimmory
category: files
name: Grimmory
version: "3.3.3"
tagline: A self-hosted digital library for people who take their reading seriously
description: >-
  Grimmory is an independent community fork of BookLore. It gathers your ebooks, comics, and audiobooks into a single library that can be browsed and read directly in the browser, with covers, descriptions, and ratings fetched automatically from Google Books, Open Library, and Amazon.


  All libraries must be created within directories mounted on the host. Use the "books" folder in the Files app at Apps/grimmory/data/books for your library, or the "bookdrop" folder at Apps/grimmory/data/bookdrop to drop files for automatic detection, metadata enrichment, and import review.


  Features:

  - Smart Shelves with rule-based filtering, tagging, and full-text search

  - A built-in reader for PDFs, EPUBs, and comics with annotations, highlights, and reading progress tracking

  - Device sync with Kobo, OPDS-compatible apps, and KOReader

  - Multi-user support with separate shelves, progress, and preferences, including local or OIDC authentication

  - One-click sharing of books to a Kindle, email address, or another user


  Supported formats: EPUB, MOBI, AZW, AZW3, FB2, PDF, CBZ, CBR, CB7, M4B, M4A, MP3, OPUS.


  Create your admin account on first launch.
