manifestVersion: 1
id: frameleaf
storage:
  dataRoot: data
folderAccess:
  - id: external-library
    name: External Library
    note: Select a folder containing photos or videos, then add /mnt/external-library as an import path for an External Library in Frameleaf. Access is read-only to protect the original files.
    mounts:
      - service: server
        targetPath: /mnt/external-library
        readOnly: true
category: files
name: Frameleaf
version: "1.2.3"
tagline: Your photos. Your server. Everywhere.
description: >-
  Frameleaf is a photo and video library that runs on your own NAS, home server or Linux machine with Docker. Your originals stay as ordinary files on your own disks. Faces, smart search and AI captions are worked out on your own hardware, and there is no telemetry. It has native apps for iPhone, iPad, Android, Apple TV and Android TV, a desktop app for Mac, Windows and Linux, a photo editor, Studio (a video editor), Boards for references and design files, and client galleries for photographers. The server is open source (AGPLv3) and a fork of Immich. Frameleaf is in beta.


  ⚠️ While Frameleaf is in beta, keep another copy of your photos and videos and do not use it as the only place they are stored.


  On first launch, Frameleaf asks you to create the admin account in the browser. There are no default credentials. The mobile, TV and desktop apps sign in with your Frameleaf account, so the Frameleaf API is reachable without the Umbrel login.


  Frameleaf needs about 6 GB of RAM and 2 CPU cores. The first time faces and smart search run, the machine-learning service downloads its models.
releaseNotes: ""
developer: Frameleaf
website: https://frameleaf.app
dependencies: []
repo: https://github.com/Frameleaf/frameleaf-app
support: https://github.com/Frameleaf/frameleaf-app/issues
port: 2284
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
backupIgnore:
  - data/model-cache/*
submitter: Frameleaf
submission: https://github.com/getumbrel/umbrel-apps/pull/6313
