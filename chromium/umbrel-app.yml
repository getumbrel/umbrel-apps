releaseNotes: >-
  Chromium is back with the latest version and many security and performance improvements.


  ⚠️ Chromium now requires HTTPS. umbrelOS will open the app over HTTPS automatically.


  The app now runs on a new streaming desktop, so the interface looks different from before.


  Full release notes can be found at https://developer.chrome.com/release-notes
