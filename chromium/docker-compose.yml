version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: chromium_chromium_1
      APP_PORT: 3000

  chromium:
    image: ghcr.io/linuxserver/chromium:b8f70cfa-ls65@sha256:03e51eb010a4c3ff93ae0440c5b5d22ff5ae0a3c2898e292cf4d0bcd1ef9088e
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - ${APP_DATA_DIR}/data:/config
    shm_size: "1gb"
    restart: on-failure
