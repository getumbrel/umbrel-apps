manifestVersion: 1
id: ai-marketplace-monitor
storage:
  dataRoot: data
category: automation
name: AI Marketplace Monitor
version: "0.10.12"
tagline: Find Facebook Marketplace deals with AI
description: >-
  AI Marketplace Monitor (aimm) watches Facebook Marketplace for the items you want,
  rates each new listing with AI, and notifies you of good deals by email, phone,
  Discord, Slack, Telegram and more.


  After installing, open the app and sign in with the username and password Umbrel
  shows for it. In the config editor, set the username and password of the Facebook
  account aimm logs in with in [marketplace.facebook], and the AI and notification
  services you want (or let the Configure chat set them up). If Facebook asks for a
  CAPTCHA or a security code, click Open browser in the app and complete it there.


  The default configuration uses one UnitySVC API key (https://unitysvc.com) both for
  the AI that rates listings (OpenAI, Anthropic and other engines) and for email and
  phone notifications.
releaseNotes: ""

