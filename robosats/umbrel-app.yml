name: RoboSats
version: "v0.8.7-alpha"
tagline: Simple and Private Bitcoin P2P Exchange
description: >-
  RoboSats is a simple and private app to exchange bitcoin for national currencies. 
  Robosats simplifies the P2P user experience and uses lightning hold invoices to 
  minimize custody and trust requirements. The deterministically generated robot 
  avatars help users stick to best privacy practices.


  Features:


  - Privacy focused: your robot avatar is deterministically generated, no need for registration.

  - More than 10 languages available and over 60 fiat currencies

  - Safe: simply lock a lightning hodl invoice and show you are real and committed.

  - No data collection. Your communication with your peer is PGP encrypted, only you can read it.

  - Lightning fast: the average sovereign trade finishes in ~ 8 minutes. Faster than a single block confirmation!

  - Fully collateralized escrow: your peer is always committed and cannot run away with the funds.

  - Strong incentives system: attempts of cheating are penalized with the slashing of the Sats in the fidelity bond.

  - Guides and video tutorials available at https://learn.robosats.org/watch/en


  You can join other cool Robots and get community support at https://t.me/robosats telegram group.
  
releaseNotes: >-
  ⚠️ Back up your robot tokens before updating. Open RoboSats and click the download button beside “Robot Garage”. Repeat this in each browser or device where you have saved robots, and keep the downloaded file private.


  This update requires umbrelOS 2.0 or later and opens RoboSats over HTTPS.


  If you previously used RoboSats over HTTP, your saved robots will not appear automatically at the HTTPS address. Open RoboSats over HTTPS and use Recovery to restore each robot with its saved token. The garage download contains a list of these tokens.


  After updating, hard-refresh RoboSats once (Ctrl/Cmd + Shift + R) to load the new client.


  Highlights:

  - Added encrypted image uploads in chat on coordinators that support them.

  - Added federation consensus and live coordinator ranking by DevFund donations.

  - Added Eleuteria, Freeport, and Ammanaya coordinators; removed FreedomSats.

  - Added eBay Gift Card, MobilePay, and PYUSD payment methods.

  - Fixed PGP verification, order creation with a blank premium, and sensitive information appearing on password-protected orders.


  Full release notes are available at https://github.com/RoboSats/robosats/releases/tag/v0.8.7-alpha
