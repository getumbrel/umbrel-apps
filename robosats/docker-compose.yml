version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: robosats_web_1
      APP_PORT: 12596

  web:
    image: recksato/robosats-client:v0.8.8-alpha@sha256:22efbf7d7e88b83878d9f57f7335d81c24e657b4add183af812db462ec012f15
    # umbrelOS protects browser connections with HTTPS and authentication.
    # HTTP is only used inside the device, between Umbrel's proxy and RoboSats.
    command:
      - sh
      - -ec
      - |
        sed -i 's/listen 12596 ssl;/listen 12596;/' /etc/nginx/nginx.conf
        exec sh robosats-client.sh
    restart: on-failure
    stop_grace_period: 1m
    init: true
    environment:
      TOR_PROXY_IP: ${TOR_PROXY_IP}
      TOR_PROXY_PORT: ${TOR_PROXY_PORT}
