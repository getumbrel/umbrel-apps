      APP_PORT: 8000

  server:
    image: qmcgaw/ddns-updater:v2.10.0@sha256:3e2aa558946b5a293def4d73008fa4651c072b2c12932cecd02126fb23979831
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data:/updater/data
