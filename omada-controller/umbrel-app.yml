category: networking
name: Omada Controller
version: "6.3.0.111"
tagline: Manage your TP-Link Omada network from your Umbrel
description: >-
  ⚠️ Omada Controller needs at least 2 GB of free memory.


  Omada Controller (also called Omada Network) is TP-Link's free software controller for Omada access points, switches and routers. It lets you adopt, configure and monitor all of your Omada devices from one place, without a hardware controller or a cloud subscription.


  On first launch you can create a local account, or sign in with a TP-Link ID if you want to use Omada's optional Cloud Access and mobile app remotely.


  Omada devices on the same local network as your Umbrel are discovered automatically and can be adopted from the Devices page.


  Features:


  - Central management for Omada access points, JetStream switches and Omada gateways

  - Live network topology, dashboards and client insights

  - Guest Wi-Fi with captive portals and vouchers

  - Firmware updates, scheduled reboots and backups for all devices

  - Multi-site management from a single controller
