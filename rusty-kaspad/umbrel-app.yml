releaseNotes: >-
  This release updates Rusty Kaspa to v2.1.0 with node synchronization improvements, security hardening, and bug fixes.


  Key highlights in this release:
    - P2P protocol version 11 streams large initial sync payloads in smaller chunks to avoid message-size bottlenecks and timeouts, while remaining compatible with protocol version 10 peers
    - Stricter P2P message limits and validation, including immediate rejection of banned inbound peers
    - Arithmetic overflow protections across node components
    - RPC decoding and transaction validation fixes


  Full release notes can be found at https://github.com/kaspanet/rusty-kaspa/releases/tag/v2.1.0
