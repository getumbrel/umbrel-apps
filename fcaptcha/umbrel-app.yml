manifestVersion: "2.0"
id: fcaptcha
storage:
  dataRoot: data
environment:
  - name: FCAPTCHA_ALLOWED_HOSTNAMES
    services:
      - server
    note: Comma-separated hostnames of the forms served by FCaptcha.
category: developer
name: FCaptcha
version: "1.52.0"
tagline: Protect forms with a self-hosted CAPTCHA
description: >-
  FCaptcha serves a browser widget and verifies form tokens on your Umbrel.
  Start with its demo, then use the setup page to obtain the backend
  verification key. The setup page uses the application credentials shown by
  Umbrel. Keep that key server-side.
releaseNotes: ""
developer: WebDecoy
website: https://webdecoy.com/product/fcaptcha/
dependencies: []
repo: https://github.com/WebDecoy/FCaptcha
support: https://github.com/WebDecoy/FCaptcha/issues
port: 8162
requiresHttps: true
gallery: []
path: "/setup/index.html"
defaultUsername: admin
defaultPassword: ""
deterministicPassword: true
submitter: WebDecoy
submission: https://github.com/getumbrel/umbrel-apps/pull/6427
