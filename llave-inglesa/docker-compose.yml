version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: llave-inglesa_web_1
      APP_PORT: 8080

  web:
    # Caddy serving the reproducible release zip; see umbrel/README.md in the upstream repo.
    image: ghcr.io/prvsatsdev/llave-inglesa:0.4.1@sha256:99993ca1b1439e495d093a967f07a56743a8781c1a7ab34451f30bd135d75e54
    restart: on-failure
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
