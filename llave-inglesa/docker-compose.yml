version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: llave-inglesa_web_1
      APP_PORT: 8080

  web:
    # Caddy serving the reproducible release zip; see umbrel/README.md in the upstream repo.
    image: ghcr.io/prvsatsdev/llave-inglesa:0.5.0@sha256:0c40b84c3981d5021dfd985c74843dd1b0d2fcdeb483e032b242390b9216fd2e
    restart: on-failure
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
