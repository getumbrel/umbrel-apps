version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: llave-inglesa_web_1
      APP_PORT: 8080

  web:
    # Caddy serving the reproducible release zip; see umbrel/README.md in the upstream repo.
    image: ghcr.io/prvsatsdev/llave-inglesa:0.7.0@sha256:4b0a94b5d6b7b3db926e97cb041e38c5ec8a4c9c46de33a7188b494b62e33026
    restart: on-failure
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
