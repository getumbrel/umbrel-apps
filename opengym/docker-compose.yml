version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: opengym_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  api:
    image: ghcr.io/duartesantos8/opengym-api:1.4.1@sha256:4bc07fe7d1f05a57c0fa25da3563d54dfe27223506637d67fc64088a2a2f140b
    restart: on-failure
    environment:
      PORT: 3000
      DATA_DIR: /data
      RP_ID: ${DEVICE_DOMAIN_NAME}
      ORIGIN: https://${DEVICE_DOMAIN_NAME}:${APP_PROXY_PORT}
      RP_NAME: openGym
      PASSWORD_LOGIN: "1"
      FIRST_USER_ADMIN: "1"
      TRUST_PROXY: "1"
    volumes:
      - ${APP_DATA_DIR}/data/api:/data

  web:
    image: ghcr.io/duartesantos8/opengym-web:1.4.1@sha256:e32cae9d2f4aad0c5e1b7888c9bfc712b2306ddfe3c65bc4cfefd4b0002e86d3
    restart: on-failure
    depends_on:
      - api
    environment:
      BACKEND: api
      PORT: 3000