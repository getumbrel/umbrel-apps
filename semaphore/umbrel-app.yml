manifestVersion: 1
id: semaphore
storage:
  dataRoot: data
category: developer
name: Semaphore UI
version: "2.19.16"
tagline: Modern web UI for Ansible, Terraform, OpenTofu, and more
description: >-
  Log in with the username and password shown by Umbrel. If you change the admin password inside Semaphore, use the new password from then on.


  Semaphore UI is a self-hosted web interface for running automation tools such as Ansible, Terraform, OpenTofu, Terragrunt, and Bash scripts. Instead of running playbooks and plans from the command line, you manage them from your browser and keep a full history of every run.


  - Connect Git repositories that contain your playbooks, Terraform code, or scripts

  - Store SSH keys, passwords, and other credentials encrypted in Semaphore's key store

  - Define inventories and environment variables, then build reusable task templates

  - Run tasks on demand or on a schedule and watch the live output

  - Invite teammates, organize work into projects, and control who can run what


  Ideal for managing a homelab or any infrastructure that Umbrel can reach over your network.
releaseNotes: ""
developer: Semaphore UI
website: https://semaphoreui.com
dependencies: []
repo: https://github.com/semaphoreui/semaphore
support: https://github.com/semaphoreui/semaphore/discussions
port: 3270
gallery: []
path: ""
defaultUsername: admin
deterministicPassword: true
backupIgnore:
  - data/repos/*
submitter: Aiacos
submission: https://github.com/getumbrel/umbrel-apps/pull/6169
