manifestVersion: 1
id: valorgrid
storage:
  dataRoot: data
category: finance
name: ValorGrid
version: "3.36.0-patch.1"
tagline: Private and auditable investment portfolio tracking
description: >-
  ValorGrid is a local-first portfolio tracker for recording, importing and
  analysing investment movements with SQLite persistence, local backups and a
  browser UI. Portfolio data stays on your Umbrel server; market price lookups
  are sent only to the configured market data provider for the requested symbol.
releaseNotes: >-
  This update adds support for new storage management and configuration options being introduced with umbrelOS 2.0.


  Previous ValorGrid 3.36.0 release notes:


  This update adds encrypted backup support and improves backup and instrument handling.

  - Adds optional encrypted SQLite backups using a passphrase
  - Adds backup and decrypt flows for encrypted backup files
  - Fixes backup listing, download, deletion, and retention when plain and encrypted backups are mixed
  - Derives an empty instrument ticker from the Yahoo symbol when available

