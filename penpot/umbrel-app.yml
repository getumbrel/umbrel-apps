manifestVersion: 1
id: penpot
storage:
  dataRoot: data
category: developer
name: Penpot
version: "2.18.0"
tagline: Design and prototyping platform
description: >-
  Penpot is a pioneering open-source platform for design and prototyping, tailored specifically for product teams.
  Unconstrained by operating systems, Penpot utilizes the flexibility of web-based platforms and the interoperability
  of open standards, specifically SVG. Penpot invites designers all over the world to fall in love with open source
  while getting developers excited about the design process in return.
releaseNotes: >-
  This update adds drawing-tool flyouts, dedicated Line and Arrow tools, and support for showing and managing comments while designing in the workspace.

  It also fixes MCP integration hanging when the browser backgrounds or freezes a Penpot tab, along with design-editor bugs affecting synced components, comments, typography, gradients, tokens, fonts, and clipboard handling.

  Full release notes can be found at https://github.com/penpot/penpot/releases/tag/2.18.0
developer: Penpot
website: https://penpot.app/
