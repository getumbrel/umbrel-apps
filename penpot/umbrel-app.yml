manifestVersion: 1
id: penpot
storage:
  dataRoot: data
category: developer
name: Penpot
version: "2.18.1"
tagline: Design and prototyping platform
description: >-
  Penpot is a pioneering open-source platform for design and prototyping, tailored specifically for product teams.
  Unconstrained by operating systems, Penpot utilizes the flexibility of web-based platforms and the interoperability
  of open standards, specifically SVG. Penpot invites designers all over the world to fall in love with open source
  while getting developers excited about the design process in return.
releaseNotes: >-
  This update fixes workspace freezes when opening the context menu on shapes from other pages, repeated error toasts caused by third-party browser scripts, registration from workspace links, and empty API responses when exporting bins.

  Full release notes can be found at https://github.com/penpot/penpot/releases/tag/2.18.1
developer: Penpot
website: https://penpot.app/
