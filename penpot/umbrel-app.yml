category: developer
name: Penpot
version: "2.19.0"
tagline: Design and prototyping platform
description: >-
  Penpot is a pioneering open-source platform for design and prototyping, tailored specifically for product teams.
  Unconstrained by operating systems, Penpot utilizes the flexibility of web-based platforms and the interoperability
  of open standards, specifically SVG. Penpot invites designers all over the world to fall in love with open source
  while getting developers excited about the design process in return.
releaseNotes: >-
  ⚠️ Back up your designs before updating. File and version-history storage is migrated automatically on startup. Very large installations with millions of snapshots or hundreds of GB of database storage must complete the upstream migration procedure before updating: https://github.com/penpot/penpot/blob/2.19.0/operations/2.19.0-migrate-legacy-file-data.md


  This update adds configurable keyboard shortcuts, improved path editing, individual stroke widths for each side, and shared design-token libraries. It also enables the Admin Console and improves saving, rendering, exports, and security.


  Full release notes can be found at https://github.com/penpot/penpot/releases/tag/2.19.0
