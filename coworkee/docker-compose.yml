version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: coworkee_server_1
      APP_PORT: 3000

  server:
    image: ghcr.io/fgilde/coworkeenextjs:sha-0d875b1@sha256:8d14e41e8f86f36e943c3df7deec81b61042268ba736fc459d7c58369fcdf7d1
    restart: on-failure
    stop_grace_period: 1m
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://coworkee:${APP_POSTGRES_PASSWORD}@coworkee_db_1:5432/coworkee?schema=public"
      AUTH_SECRET: "${APP_AUTH_SECRET}"
      AUTH_TRUST_HOST: "true"
    volumes:
      # Uploaded documents.
      - ${APP_DATA_DIR}/data/storage:/app/storage

  db:
    image: postgres:16.10-alpine@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
    restart: on-failure
    stop_grace_period: 1m
    user: "1000:1000"
    environment:
      POSTGRES_USER: coworkee
      POSTGRES_PASSWORD: "${APP_POSTGRES_PASSWORD}"
      POSTGRES_DB: coworkee
    volumes:
      - ${APP_DATA_DIR}/data/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coworkee"]
      interval: 10s
      timeout: 5s
      retries: 10
