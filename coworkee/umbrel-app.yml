manifestVersion: 1
id: coworkee
category: automation
name: Coworkee
version: "1.1.2"
tagline: Self-hosted HR software for your company
description: >-
  Coworkee is HR software for one company, in the spirit of Personio or HR-Works, with its
  own PostgreSQL.


  The first visit opens a setup wizard that creates the administrator. There is no default
  login and no demo data.


  👥 PEOPLE


  - Employee directory with search and filters, detail profiles and an org chart

  - Absence: leave balances, a request-and-approval workflow and a team overview

  - Time tracking: clock in and out, weekly hours and manual entries


  📄 PAPERWORK


  - Documents in access-controlled private storage

  - Onboarding with checklist templates and a process per employee

  - Performance goals and reviews


  📊 THE REST


  - An HR dashboard with the usual figures

  - Recruiting: jobs and a Kanban application pipeline

  - A news feed with in-app notifications

  - Role-based access (ADMIN, HR, MANAGER, EMPLOYEE), an audit log for every HR write action,
    light and dark mode, and the whole interface in English and German
