id: planka
storage:
  dataRoot: data
category: files
name: Planka
version: "2.3.0"
tagline: Self-hosted Kanban boards for workgroups
description: >-
  Planka is a beautiful, real-time Kanban board for managing projects and tasks
  with your team. Think Trello, but fully self-hosted and under your control.


  Create projects, boards, lists, and cards with an intuitive drag-and-drop
  interface. Assign team members to cards, set due dates, track time, attach
  files, and collaborate through comments - all with Markdown support.


  Changes sync instantly across all users, so your whole team stays on the same
  page without refreshing. Filter tasks by members or labels, customize your
  board backgrounds, and organize work exactly how you want.


  Whether you're managing a software project, planning a home renovation, or
  coordinating with a small team, Planka gives you a clean, focused workspace
  without the clutter of enterprise tools—and without sending your data to
  someone else's server.
releaseNotes: >-
  ⚠️ PLANKA Community no longer includes OIDC/SSO. If you're updating from a
  pre-2.2 version and use SSO accounts, create or confirm a local admin account
  before updating because SSO-only users will be deactivated.


  - Save named board filters and filter by lists, unassigned cards, or excluded labels

  - Reply to comments and mention teammates in card descriptions

  - Scope webhooks to a project or account

  - Discover keyboard shortcuts from the user menu and reorder cards in list view

  - Restore unsaved card descriptions after a browser crash

  - Improved sign-in protection, two-factor authentication, and protected file access

  - Fixed filtered card pagination and blank views caused by deleted projects


  Full release notes can be found at https://github.com/plankanban/planka/releases/tag/v2.3.0
developer: PLANKA Software GmbH
