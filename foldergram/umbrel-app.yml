releaseNotes: >-
  ⚠️ Back up your library database before updating. Stop Foldergram before copying the database, or take a consistent snapshot including its WAL and SHM files. If upgrading from before 1.3.0 with folders named "carousels", review the migration choice in Settings → General Settings, then run Scan Library.


  - Play newly added videos without generating full previews first. Incompatible formats are converted on demand; the first play or seek may take longer and use additional CPU.
  - Browse videos in a full-screen Reels viewer with direct links, improved navigation, and better playback recovery.
  - Import captions and dates from companion .txt and .nfo files. Captions you already set in Foldergram are kept; an older companion file won't replace them.
  - Fix HEIC photos saved with JPEG extensions and keep acknowledged scan issues dismissed after restarts.


  Existing videos keep their playback mode and saved previews. To switch them to streaming and reclaim preview space, use Settings → Scan & Library → Switch to streaming and remove video previews. Original media is not changed.


  Full release notes: https://github.com/foldergram/foldergram/releases/tag/v1.4.1
