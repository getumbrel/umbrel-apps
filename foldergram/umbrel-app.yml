releaseNotes: >-
  ⚠️ Back up your library database before updating. Stop Foldergram before copying the database, or take a consistent snapshot including its WAL and SHM files. If upgrading from before 1.3.0 with folders named "carousels", review the migration choice in Settings → General Settings, then run Scan Library.


  - Open large libraries faster and browse folders with improved search and pagination.
  - Scan for changes without rechecking derivatives for unchanged media.
  - Enjoy a larger, borderless post viewer with improved Carousel and navigation layouts.
  - Play compatible MP4 videos directly and keep your sound preference across players.
  - Improved database locking and scan reliability. Recent database changes can be lost after a power failure, so keep regular backups.


  Full release notes: https://github.com/foldergram/foldergram/releases/tag/v1.3.1
