version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: syncnest_server_1
      APP_PORT: 8477

  server:
    image: ghcr.io/earlvanze/umbrel-dropbox-client:v1.2.12@sha256:f23760a55c236a7b0f20335209f76c64bd17bdda4c17931272f3f22608703717
    restart: on-failure
    user: "1000:1000"
    volumes:
      - ${APP_DATA_DIR}/data/app:/data
      - ${APP_DATA_DIR}/data/sync:/dropbox
    environment:
      - UDC_CONFIG=/data/config.json
      - UDC_DB=/data/state.db
      - UDC_ROOT=/dropbox
      - UDC_REMOTE_PATH=/
      - UDC_TOKEN_FILE=/data/token.json
      - UDC_REMOTE_DELTA=auto
      - UDC_LIVE_SCOPE=/
      - UDC_DRY_RUN=true
      - UDC_ALLOW_LIVE=false
      - UDC_WATCH=true
      - UDC_SCAN_INTERVAL_SECONDS=300
      - UDC_HEALTH_ADDR=0.0.0.0:8477
