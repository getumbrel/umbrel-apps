version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: syncnest_server_1
      APP_PORT: 8477

  server:
    image: ghcr.io/earlvanze/umbrel-dropbox-client:v1.2.10@sha256:a5cf5be2376b67d5f6a8a887e236e20d0005a020862511063ed546d737d7c4df
    restart: on-failure
    user: "1000:1000"
    volumes:
      - ${APP_DATA_DIR}/data/app:/data
      - ${APP_DATA_DIR}/data/sync:/dropbox
    environment:
      - UDC_CONFIG=/data/config.json
      - UDC_DB=/data/state.db
      - UDC_ROOT=/dropbox
      - UDC_REMOTE_PATH=/
      - UDC_TOKEN_FILE=/data/token.json
      - UDC_REMOTE_DELTA=auto
      - UDC_LIVE_SCOPE=/
      - UDC_DRY_RUN=true
      - UDC_ALLOW_LIVE=false
      - UDC_WATCH=true
      - UDC_SCAN_INTERVAL_SECONDS=300
      - UDC_HEALTH_ADDR=0.0.0.0:8477
