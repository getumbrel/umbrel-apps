manifestVersion: 1
id: syncnest
category: files
name: SyncNest
version: "1.2.7"
tagline: Safe, scoped file sync for Dropbox

description: >-
  SyncNest keeps Dropbox files synchronized with storage managed by your Umbrel.
  New installs start in dry-run mode, allowing you to review sync activity before
  enabling file transfers through the setup dashboard.


  Connect a Dropbox account using OAuth, select remote folders, monitor status,
  browse synchronized files, and resolve conflicts from the built-in web interface.
  SyncNest supports cursor-based remote updates, filesystem watching, guarded
  uploads and downloads, and durable SQLite state.


  Dropbox is a trademark of Dropbox, Inc. SyncNest is an independent community
  project and is not affiliated with, endorsed by, or sponsored by Dropbox, Inc.
