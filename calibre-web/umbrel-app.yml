manifestVersion: 1
id: calibre-web
category: files
name: Calibre Web
version: "0.6.27"
tagline: A clean web app for your eBooks
description: >-
  Calibre-Web is a web app providing a clean interface for browsing, reading and downloading eBooks using an existing Calibre database.
  It is also possible to integrate google drive and edit metadata and your calibre library through the app itself. 
  
  
  🛠️ SET-UP INSTRUCTIONS

    - Library Setup: On the initial setup screen, enter /books as your calibre library location.
    - Uploading eBooks: If you wish to enable the upload feature, navigate to Admin > Edit Basic Configuration > Feature Configuration and toggle "Enable Upload".
    - Documentation: It is recommended to read through the official documentation available at https://github.com/janeczku/calibre-web/wiki
developer: Janeczku
website: https://github.com/janeczku/calibre-web
dependencies: []
repo: https://github.com/janeczku/calibre-web
support: https://github.com/linuxserver/docker-calibre-web/issues
port: 8098
gallery:
  - 1.jpg
  - 2.jpg
  - 3.jpg
path: ""
defaultUsername: "admin"
defaultPassword: "admin123"
torOnly: false
releaseNotes: >-
  This update includes new features, bug fixes, and security improvements:


    - Added MOBI metadata extraction on upload and reverse proxy login with a shared secret header
    - Fixed Kobo sync behind reverse proxies, shelf dropdown rendering, mobile infinite scroll, and duplicate tag handling
    - Improved OPDS, metadata search, eReader, conversion, sorting, download, and email behavior
    - Fixed security issues involving XSS, remote command execution (CVE-2025-7404), ReDoS (CVE-2025-6998), SQL injection, LDAP injection, XXE injection, IDOR, OAuth account relinking, and unauthorized file or shelf access


  Full release notes can be found here: https://github.com/janeczku/calibre-web/releases/tag/0.6.27
submitter: Xosten
submission: https://github.com/getumbrel/umbrel-apps/pull/74
