category: files
name: Parenthèse
version: "1.0.3"
tagline: A family tree with the photos, voices and memories of each person
description: >-
  Parenthèse is a family tree you explore like a map. Each person has a portrait, photos, videos, voice recordings and memories. You can start from scratch or import a GEDCOM file from your genealogy software, and export it again at any time.


  Create your account on first launch, then create or import a tree. To share a tree with relatives, Parenthèse gives each tree a link and a password: relatives can look around and suggest additions without creating an account, and the owner reviews what gets added.


  Umbrel login stays on by default, so only you can open the app from your network. If you want relatives to open a shared link, they need a way to reach your Umbrel, and you can turn off "Require Umbrel login" for this app in its settings.


  The interface is available in English and French.
