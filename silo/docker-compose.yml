version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: silo_server_1
      APP_PORT: 9001

  server:
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z@sha256:c20d112390b9a9ce8c11b8af95ad35bcaa62f4759663c09c936cd8d2b511f329
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: umbrel
      MINIO_ROOT_PASSWORD: ${APP_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data/objects:/data
    ports:
      # S3 clients authenticate with Silo access keys, independently of app_proxy.
      - "9131:9000"
