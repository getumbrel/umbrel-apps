releaseNotes: >-
  This update includes database changes. Back up your Open WebUI data before updating.


  Key highlights:
    - Opens notes, channels, and workspace pages as tabs alongside chats
    - Adds folder boards, chat statuses, colored tags, and folder automations
    - Keeps queued messages on the server so you can leave the page during a reply
    - Adds optional interactive visualizations and video generation
    - Improves long replies, large PDF previews, and folder loading
    - Shows a review of changed administrator settings before saving


  Direct Connections and Direct Integrations have been replaced by Tether. Models, tools, and terminals added in personal settings must be added again in the Tether app (0.1.14 or later; 0.1.16 for MCP servers). Server-managed model connections are unaffected.


  Connections to a Terminals server require Terminals 0.4.0 or later and its manual migration from 0.3.x. Select new terminals for affected models, folders, automations, and chats. Re-select coding agent models in pins, defaults, and automations; existing agent chats start a new agent session with their previous conversation as context.


  Existing image settings migrate to image connections. Image environment variables are no longer read when persistent configuration is enabled. Custom API clients should use write_access for chat reply permissions and update listeners to the new typed events socket messages.


  Attached files are no longer preloaded by default with native function calling. If your model lacks file tools, enable Preload files in the model's Features (previously Capabilities). Side chats are saved as regular chats unless Temporary Chat is enabled. Custom pipes should support context arriving as hidden tool results.


  Chat files, system prompts, and advanced parameters are now in Controls next to the message input. Desktop and browser tabs require a separately configured compatible Open Terminal connection. Sub-agent limits now default to unlimited; review these limits in Admin Settings if you use agent workflows.


  Existing note attachments move to the end of the note's first page.


  Change sharing through each item's Access settings. Custom functions, tools, and Python packages must support Python 3.12.


  Selected and model-attached skills still send their full instructions by default. Enable on-demand skill loading in Admin Settings > General to avoid unnecessary prompt length.


  Full release notes are available at https://github.com/open-webui/open-webui/releases/tag/v0.13.4
