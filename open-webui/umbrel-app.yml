releaseNotes: >-
  Open WebUI 0.11.1 includes database schema changes. Back up your Open WebUI data before updating.


  Key highlights in this release:
    - Adds human-in-the-loop tool approval, model question prompts, terminal file previews, channel automation destinations, and expanded admin/user settings
    - Reworks response streaming and improves performance for chats, folders, model lists, permissions, JSON handling, file access, and busy instances
    - Improves files, attachments, knowledge bases, document previews, notes, search, provider/model management, accessibility, mobile UI, and terminal browser workflows
    - Includes security and access-control fixes for knowledge search, web fetching, tool/code execution, sessions, password changes, role changes, sharing, workspace models, folder permissions, memory access, and provider routes
    - Fixes conversations, streaming replies, queued messages, notes, shared folders/chats/files, web loaders, OAuth/SSO sign-in, automations/timers, admin/workspace interfaces, and model/provider connections

  Full release notes are available at https://github.com/open-webui/open-webui/releases/tag/v0.11.1
