releaseNotes: >-
  This update includes database changes. Back up your Open WebUI data before updating.


  Key highlights:
    - Includes security fixes and more consistent sharing-permission enforcement
    - Adds optional on-demand skill loading and clearer context-compaction progress in chats
    - Adds bulk file downloads and deletion, multi-chat selection, and improved knowledge-upload progress
    - Improves chat streaming, reconnects, accessibility, and settings persistence across tabs
    - Fixes archived chats being deleted with folders and database connection leaks


  Direct tool and terminal integrations now require Direct Integrations to be enabled in Admin Settings > Connections. Change sharing through each item's Access settings. Custom functions, tools, and Python packages must support Python 3.12.


  Selected and model-attached skills still send their full instructions by default. Enable on-demand skill loading in Admin Settings > General to avoid unnecessary prompt length.


  Full release notes are available at https://github.com/open-webui/open-webui/releases/tag/v0.12.4
path: ""
