defaultUsername: ""
defaultPassword: ""
dependencies:
  - ollama
releaseNotes: >-
  This update includes database changes. Back up your Open WebUI data before updating.


  Key highlights:
    - Adds workspace search across chats, shared folders, channel messages, and notes
    - Adds optional end-to-end encrypted channel chats, disabled by default
    - Improves revision comparisons, document previews, and collaboration in shared chats
    - Fixes PDF exports of long chats and notes, imported chat tags, and shared-folder access settings
    - Improves OAuth token refresh, tool behavior, and read-aloud playback


  Model-attached and selected skills now send their full instructions with each message. Remove skills attached only for discovery to avoid extra prompt length.

  Full release notes are available at https://github.com/open-webui/open-webui/releases/tag/v0.12.3
path: ""
