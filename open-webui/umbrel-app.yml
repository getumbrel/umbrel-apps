releaseNotes: >-
  Open WebUI 0.11.3 includes security, access-control, and database migration fixes. Back up your Open WebUI data before updating.


  Key highlights in this release:
    - Adds richer previews for terminal-generated documents and slide decks, a request filter step for model calls, interface font selection, touch resizing, and broader accessibility mode coverage
    - Reduces overhead for deployments without pipelines, model list refreshes, Redis-backed websocket sessions, and streamed tool-call handling
    - Fixes chat and reasoning streaming issues, pinned model tools, stopped replies across instances, disabled models disappearing, shared chat search, and SQLite case-insensitive tag search
    - Improves automations and calendar/repeating-event behavior, admin user counts, model/defaults panels, mobile/dropdown layouts, file previews, and code interpreter startup
    - Fixes database migrations failing during startup, and now stops startup clearly if a future migration fails
    - Fixes chat branches losing replies after reloads, custom fonts not applying throughout the interface, and incorrect OAuth disconnect controls for MCP servers

  Full release notes are available at https://github.com/open-webui/open-webui/releases/tag/v0.11.3
