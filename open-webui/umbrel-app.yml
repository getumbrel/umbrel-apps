releaseNotes: >-
  This update includes database changes. Back up your Open WebUI data before updating.


  Key highlights:
    - Adds coding agents to scheduled automations when a compatible terminal connection is configured
    - Lets you change terminals and working folders during chats, keeping file tabs and agent lists in sync
    - Fixes copy buttons and clipboard feedback over plain HTTP
    - Improves tool-call labels and knowledge searches containing punctuation
    - Fixes DeepSeek thinking-mode chats with skills, knowledge, and memories on llama.cpp connections
    - Fixes side chats when Temporary Chat is disabled


  Attached files are no longer preloaded by default with native function calling. If your model lacks file tools, enable Preload files in the model's Capabilities. Side chats are now saved as regular chats unless Temporary Chat is enabled. Custom pipes should support context arriving as hidden tool results.


  Chat files, system prompts, and advanced parameters are now in Controls next to the message input. Desktop and browser tabs require a separately configured compatible Open Terminal connection. Sub-agent limits now default to unlimited; review these limits in Admin Settings if you use agent workflows.


  Existing note attachments move to the end of the note's first page.


  Direct tool and terminal integrations now require Direct Integrations to be enabled in Admin Settings > Connections. Change sharing through each item's Access settings. Custom functions, tools, and Python packages must support Python 3.12.


  Selected and model-attached skills still send their full instructions by default. Enable on-demand skill loading in Admin Settings > General to avoid unnecessary prompt length.


  Full release notes are available at https://github.com/open-webui/open-webui/releases/tag/v0.13.3
path: ""
