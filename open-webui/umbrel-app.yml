releaseNotes: >-
  Open WebUI 0.12.0 adds realtime voice calls, multi-user collaboration improvements, model/workspace version history, and interface fixes. Back up your Open WebUI data before updating.


  Key highlights in this release:
    - Adds Realtime voice calls with optional animated avatars and new administrator audio settings
    - Adds two-factor sign-in support, nested groups, group default models, and shared-chat reply/fork workflows
    - Adds version history for workspace models, tools, functions, prompts, and multi-file skills
    - Adds knowledge-base file browsing, model controls, tool search, and redesigned model/editor settings
    - Improves chat/tool handling, background replies, compaction, settings labels, file attachments, and Ollama/native tool-call behavior

  Full release notes are available at https://github.com/open-webui/open-webui/releases/tag/v0.12.0
