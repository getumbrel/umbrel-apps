manifestVersion: 1.1
id: jellyfin
storage:
  dataRoot: data
folderAccess:
  - id: umbrel-downloads
    name: Downloads
    note: Media files for your Jellyfin libraries. Available inside Jellyfin at /downloads.
    mounts:
      - service: server
        targetPath: /downloads
  - id: media-library
    name: Media Library
    note: Select an additional folder containing media, then add /media as a library folder in Jellyfin. Access is read-only to protect the original files.
    mounts:
      - service: server
        targetPath: /media
        readOnly: true
category: media
name: Jellyfin
version: "10.11.11-patch.3"
tagline: The Free Software Media System
description: >-
  Jellyfin is the volunteer-built media solution that puts you in control of your media. Stream to any device from your own server, with no strings attached. Your media, your server, your way.


  Run the Jellyfin server on your system and gain access to the leading free-software entertainment system, bells and whistles included.


  Watch your media from a web browser on your computer, apps on your Roku, Android, iOS (including AirPlay), Android TV, or Fire TV device, or via your Chromecast or existing Kodi installation.


  Jellyfin has no tracking, phone-home, or central servers collecting your data. We believe in keeping our software open and transparent, and anything we might collect (crash logs, etc.) is opt-in only. We're also not in the media business, so the only media you see is your own.


  The Jellyfin server and clients are free to download, now and always. There are no costs, hidden or otherwise, to use Jellyfin, either for yourself, for your friends, or for your company. All our incidental costs are paid through donations from users like you.
developer: Jellyfin
website: https://jellyfin.org/
dependencies: []
repo: https://github.com/jellyfin/jellyfin
support: https://github.com/jellyfin/jellyfin/issues
port: 8096
gallery:
  - 1.jpg
  - 2.jpg
  - 3.jpg
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  This update adds support for new storage management and configuration options being introduced with umbrelOS 2.0, including access to additional media folders.


  Previous Jellyfin 10.11.11 release notes:


  This bugfix release improves Jellyfin server reliability.


  Key improvements in this release:
    - Improved user management reliability by adding locking around UserManager operations


  Full release notes can be found at https://github.com/jellyfin/jellyfin/releases/tag/v10.11.11
torOnly: false
permissions:
  - STORAGE_DOWNLOADS
  - GPU
submitter: Umbrel
submission: https://github.com/getumbrel/umbrel-apps/commit/60878f278d544b204d8e7c96240c797f43a9b319
