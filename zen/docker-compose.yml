version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: zen_app_1
      APP_PORT: 8080

  app:
    image: ghcr.io/sheshbabu/zen/zen:2.0.0@sha256:3ec9c007b194ca0873c358b9306b1c5f11d75261cbde4e78bbfce94bef00c17c
    user: "1000:1000"
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data/app:/data
      - ${APP_DATA_DIR}/data/images:/images
