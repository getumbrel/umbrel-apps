manifestVersion: 1
id: grafana
storage:
  dataRoot: data
environment:
  - name: GF_SMTP_ENABLED
    services:
      - web
    default: "false"
    options:
      - "true"
    note: >-
      Select true to send email alerts, invitations and password resets, then fill in the settings below. Add recipients in Grafana's alerting contact points.
  - name: GF_SMTP_HOST
    services:
      - web
    default: "localhost:25"
    note: >-
      SMTP server and port, such as smtp.example.com:587.
  - name: GF_SMTP_USER
    services:
      - web
    note: >-
      SMTP username.
  - name: GF_SMTP_PASSWORD
    services:
      - web
    note: >-
      SMTP password or app password.
  - name: GF_SMTP_FROM_ADDRESS
    services:
      - web
    default: "admin@grafana.localhost"
    note: >-
      Sender address, such as grafana@example.com. Use an address your SMTP provider lets you send from.
  - name: GF_SERVER_ROOT_URL
    services:
      - web
    default: "http://localhost:3000/"
    note: >-
      Address used for links in emails, such as http://umbrel.local:3030/. Set this so links in alert, invitation and password reset emails open your Grafana.
name: Grafana
tagline: The open-source platform for monitoring and observability
category: networking
version: "13.3.1-patch.1"
port: 3030
description: >-
  Grafana allows you to query, visualize, alert on and understand your metrics no matter where they are stored. Create, explore, and share dashboards with your team and foster a data-driven culture:


  - Visualizations: Fast and flexible client side graphs with a multitude of options. Panel plugins offer many different ways to visualize metrics and logs.

  
  - Dynamic Dashboards: Create dynamic & reusable dashboards with template variables that appear as dropdowns at the top of the dashboard.

  
  - Explore Metrics: Explore your data through ad-hoc queries and dynamic drilldown. Split view and compare different time ranges, queries and data sources side by side.

  
  - Explore Logs: Experience the magic of switching from metrics to logs with preserved label filters. Quickly search through all your logs or streaming them live.

  
  - Alerting: Visually define alert rules for your most important metrics. Grafana will continuously evaluate and send notifications to systems like Slack, PagerDuty, VictorOps, OpsGenie.

  
  - Mixed Data Sources: Mix different data sources in the same graph! You can specify a data source on a per-query basis. This works for even custom datasources.


developer: Grafana Labs
website: https://grafana.com
repo: https://github.com/grafana/grafana
support: https://grafana.com/help/
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
releaseNotes: >-
  This update lets you connect an SMTP email provider in Grafana's app settings on umbrelOS 2.0, for email alerts, invitations and password resets.


  Previous Grafana 13.3.1 release notes:


  This update fixes six security vulnerabilities and updates time zone data for 2026. It also allows same-host URL changes for connection-backed provisioning repositories.


  If you're updating from before Grafana 13.1, Prometheus Azure/SigV4 authentication and the Zipkin core plugin were removed from Grafana core. Review the upstream notes if you use those integrations.


  Full release notes: https://github.com/grafana/grafana/releases/tag/v13.3.1
submitter: phelipebf
submission: https://github.com/getumbrel/umbrel-apps/pull/1664
dependencies: []
path: ""
defaultUsername: "admin"
defaultPassword: "admin"
