version: "3.7"

services:
  app_proxy:
    environment:
      # Front nginx: /umbrel-setup/ → setup-api, everything else → Buzz relay.
      # Config is generated in the container entrypoint (never bind-mount nginx.conf —
      # a prior broken mount turned the conf path into a directory and broke opens).
      APP_HOST: buzz-relay_proxy_1
      APP_PORT: 8080
      # Buzz Desktop and other Nostr clients cannot present Umbrel session cookies.
      PROXY_AUTH_ADD: "false"

  # Setup UI (set RELAY_OWNER_PUBKEY) + reverse proxy to the relay (WebSockets included).
  proxy:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: on-failure
    depends_on:
      - relay
      - setup-api
    entrypoint:
      - /bin/sh
      - -euc
      - |
        cat > /etc/nginx/conf.d/default.conf <<'NGINX'
        map $$http_upgrade $$connection_upgrade {
            default upgrade;
            ''      close;
        }
        server {
            listen 8080;
            server_name _;
            client_max_body_size 0;

            location /umbrel-setup/ {
                proxy_pass http://buzz-relay_setup-api_1:8090/;
                proxy_http_version 1.1;
                proxy_set_header Host $$http_host;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $$scheme;
            }
            location = /umbrel-setup {
                return 301 /umbrel-setup/;
            }

            location / {
                proxy_pass http://buzz-relay_relay_1:3000;
                proxy_http_version 1.1;
                # Must use $$http_host (not $$host). Buzz binds the community to
                # RELAY_URL's authority including port (e.g. umbrel.local:3737).
                # nginx $$host strips the port → "no community is configured for
                # this host". $$http_host preserves Host as the browser sent it.
                proxy_set_header Host $$http_host;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $$scheme;
                proxy_set_header Upgrade $$http_upgrade;
                proxy_set_header Connection $$connection_upgrade;
                # Disable upstream compression so sub_filter can inject the banner.
                proxy_set_header Accept-Encoding "";
                proxy_read_timeout 86400s;
                proxy_send_timeout 86400s;
                # People often land on / (empty Buzz UI) and hit the invite wall.
                # Point them at the Umbrel join page with the WebSocket URL.
                sub_filter_types text/html;
                sub_filter '</body>' '<div id="umbrel-buzz-join-banner" style="position:fixed;bottom:0;left:0;right:0;z-index:2147483647;padding:12px 16px;background:#111;color:#f5f5f5;font:14px/1.4 ui-sans-serif,system-ui,sans-serif;box-shadow:0 -4px 24px #0008;">First-time join? <a href="/umbrel-setup/" style="color:#7dd3fc;font-weight:600;">Open Umbrel setup</a> to set your owner pubkey and copy the Join URL.</div></body>';
                sub_filter_once on;
            }
        }
        NGINX
        exec nginx -g 'daemon off;'

  # Editable /umbrel-setup/ UI — paste Desktop pubkey as RELAY_OWNER_PUBKEY.
  setup-api:
    image: python:3.12.13-alpine3.23@sha256:601d3d3797e90e2534782e69c85fafb7971b43f24c7b1b079b7e48dd435e458d
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data/secrets:/secrets
      - ${APP_DATA_DIR}/data/setup:/setup
    environment:
      BUZZ_SECRETS_DIR: /secrets
      BUZZ_SETUP_DIR: /setup
      BUZZ_SETUP_PORT: "8090"
      BUZZ_WS_URL: ${APP_BUZZ_RELAY_WS_URL}
      BUZZ_HTTP_ORIGIN: ${APP_BUZZ_RELAY_HTTP_ORIGIN}
    entrypoint:
      - python3
      - /setup/server.py

  relay:
    image: ghcr.io/block/buzz:0.2.0@sha256:a0f67203d71d15d237fa7517788799957c30c8acdb81cbcff711e07e951c2710
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data/git:/data/git
      # Secrets + entrypoint: setup UI can request an in-process restart that
      # re-reads RELAY_OWNER_PUBKEY without docker.sock / umbreld access.
      - ${APP_DATA_DIR}/data/secrets:/secrets
      - ${APP_DATA_DIR}/data/setup/relay_entrypoint.sh:/relay_entrypoint.sh:ro
    entrypoint:
      - /bin/bash
      - /relay_entrypoint.sh
    env_file:
      - ${APP_DATA_DIR}/data/secrets/relay.env
    environment:
      BUZZ_SECRETS_DIR: /secrets
      BUZZ_BIND_ADDR: 0.0.0.0:3000
      BUZZ_HEALTH_PORT: "8080"
      BUZZ_METRICS_PORT: "9102"
      BUZZ_DOMAIN: ${APP_BUZZ_RELAY_DOMAIN}
      RELAY_URL: ${APP_BUZZ_RELAY_WS_URL}
      BUZZ_MEDIA_BASE_URL: ${APP_BUZZ_RELAY_HTTP_ORIGIN}/media
      BUZZ_MEDIA_SERVER_DOMAIN: ${APP_BUZZ_RELAY_DOMAIN}
      BUZZ_CORS_ORIGINS: ${APP_BUZZ_RELAY_HTTP_ORIGIN}
      BUZZ_REQUIRE_AUTH_TOKEN: "true"
      BUZZ_REQUIRE_RELAY_MEMBERSHIP: "true"
      BUZZ_ALLOW_NIP_OA_AUTH: "true"
      BUZZ_AUTO_MIGRATE: "true"
      BUZZ_GIT_REPO_PATH: /data/git
      # Postgres/Redis: Umbrel full container DNS (safe on the shared app network).
      # MinIO/S3: MUST use the Compose service name `minio` — AWS/MinIO reject
      # underscores in Host (`buzz-relay_minio_1` → HTTP 400 invalid hostname).
      BUZZ_S3_ENDPOINT: http://minio:9000
      BUZZ_S3_ADDRESSING_STYLE: path
      BUZZ_S3_ACCESS_KEY: ${APP_BUZZ_RELAY_S3_ACCESS_KEY}
      BUZZ_S3_SECRET_KEY: ${APP_BUZZ_RELAY_S3_SECRET_KEY}
      BUZZ_S3_BUCKET: buzz-media
      BUZZ_GIT_HOOK_HMAC_SECRET: ${APP_BUZZ_RELAY_GIT_HOOK_HMAC_SECRET}
      DATABASE_URL: postgres://buzz:${APP_BUZZ_RELAY_POSTGRES_PASSWORD}@buzz-relay_postgres_1:5432/buzz
      REDIS_URL: redis://:${APP_BUZZ_RELAY_REDIS_PASSWORD}@buzz-relay_redis_1:6379
      BUZZ_DB_POOL_SIZE: "10"
      BUZZ_DB_READ_POOL_SIZE: "5"
      # Soft depends_on means MinIO may still be warming; don't kill the UI for that.
      # Do not declare this key twice — Compose/go-yaml rejects duplicate mapping keys
      # and Umbrel install fails immediately.
      BUZZ_GIT_CONFORMANCE_PROBE: "false"
      RUST_LOG: buzz_relay=info,buzz_db=info,buzz_auth=info,buzz_pubsub=info,tower_http=info
    # IMPORTANT: do not use condition: service_healthy / service_completed_successfully.
    # A failed one-shot (minio-init) or never-healthy DB makes `compose up` hang and
    # Umbrel install stalls forever. Relay restarts until deps are ready.
    depends_on:
      - postgres
      - redis
      - minio
      - minio-init
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /_readiness HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'",
        ]
      interval: 10s
      timeout: 3s
      retries: 18
      start_period: 120s

  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    restart: on-failure
    stop_grace_period: 1m
    environment:
      POSTGRES_DB: buzz
      POSTGRES_USER: buzz
      POSTGRES_PASSWORD: ${APP_BUZZ_RELAY_POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buzz -d buzz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    restart: on-failure
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${APP_BUZZ_RELAY_REDIS_PASSWORD}",
      ]
    environment:
      REDIS_PASSWORD: ${APP_BUZZ_RELAY_REDIS_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: on-failure
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${APP_BUZZ_RELAY_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${APP_BUZZ_RELAY_S3_SECRET_KEY}
    volumes:
      - ${APP_DATA_DIR}/data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      - minio
    environment:
      BUZZ_S3_ACCESS_KEY: ${APP_BUZZ_RELAY_S3_ACCESS_KEY}
      BUZZ_S3_SECRET_KEY: ${APP_BUZZ_RELAY_S3_SECRET_KEY}
      BUZZ_S3_BUCKET: buzz-media
    entrypoint:
      - /bin/sh
      - -euc
      - |
        echo "App: buzz-relay - waiting for MinIO bucket setup..."
        i=0
        # Use service DNS name `minio` (no underscores) — MinIO rejects _ in Host.
        until mc alias set local http://minio:9000 "$${BUZZ_S3_ACCESS_KEY}" "$${BUZZ_S3_SECRET_KEY}"; do
          i=$$((i+1))
          if [ "$$i" -gt 30 ]; then
            echo "App: buzz-relay - MinIO not reachable after retries" >&2
            exit 1
          fi
          sleep 2
        done
        mc mb --ignore-existing "local/$${BUZZ_S3_BUCKET}"
        mc anonymous set none "local/$${BUZZ_S3_BUCKET}"
        echo "App: buzz-relay - MinIO bucket ready"
    # Retry on failure so a previous exited-1 one-shot cannot wedge forever.
    restart: on-failure
