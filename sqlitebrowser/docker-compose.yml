services:
  app_proxy:
    environment:
      APP_HOST: sqlitebrowser_app_1
      APP_PORT: 3000

  app:
    image: linuxserver/sqlitebrowser:3.13.1@sha256:5a7f74ac3878b14b71891caff746e4c3413fafa51dadd2e1dd9a5157dea59452
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/CET
    shm_size: "1gb"
