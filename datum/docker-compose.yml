version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: datum_datum_1
      APP_PORT: 21000

  datum:
    image: ghcr.io/retropex/datum-gateway:v0.5.1@sha256:c254f162b0b09b637e5b53a16eca074998487cb7042a6c93c225a8cc982f53c9
    entrypoint: ["/app/datum_gateway"]
    command: ["--config=/app/conf/datum_gateway_config.json"]
    user: 1000:1000
    restart: on-failure
    # Match Debian's DATUM Gateway systemd service (LimitNOFILE=65535).
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - ${APP_DATA_DIR}/data/settings/:/app/conf/
    ports:
      # datum gateway port
      - 23334:23334
