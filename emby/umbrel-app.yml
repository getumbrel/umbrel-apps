releaseNotes: >-
  This update adds support for new storage management and configuration options being introduced with umbrelOS 2.0, including access to additional media folders.


  Emby 4.10.0.40 release notes:


  This update includes Emby 4.10 improvements and fixes, including better search performance, refreshed home screen section options, HLS codec improvements, and fixes for startup wizard, transcoding, subtitle rendering, live TV, Chromecast playback, SMB libraries, and DVD/Blu-ray folders with dots in their names.


  The Umbrel package still uses Emby's newer port, 8103. Opening Emby from Umbrel will use the correct address automatically. If you use a saved bookmark or configured Emby clients with your Umbrel's old Emby address, update them to use port 8103.


  Full release notes can be found at https://github.com/MediaBrowser/Emby.Releases/releases/tag/4.10.0.40
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
permissions:
  - STORAGE_DOWNLOADS
  - GPU
