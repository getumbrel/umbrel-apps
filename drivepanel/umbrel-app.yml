manifestVersion: 1
id: drivepanel
storage:
  dataRoot: data
category: files
name: DrivePanel
version: "1.0.9"
tagline: Your own lightweight Google Drive at home
description: >-
  Important: the first user who registers becomes the DrivePanel administrator, so create
  your account right after installing. Later accounts stay pending until the administrator
  approves them in Users.


  DrivePanel is a lightweight personal cloud drive (about 40 MB of RAM) built for the
  Raspberry Pi and any small home server. Its interface is in English and Spanish (it follows your browser and can be changed in Settings),
  with light and dark mode.


  - My Drive with folders, grid view with thumbnails or list view, search, rename, move and folder properties

  - Upload files and whole folders, with chunked uploads, retries, duplicate warnings and live speed

  - Photos grouped by month and by album, recent files, viewer for photos, video, PDF and text, and .zip download

  - Trash with restore, also for files deleted over WebDAV

  - Share with other users or with a public link that can expire

  - Multiple users with admin approval, quotas and profile pictures

  - Activity dashboard: uploads per day, disk usage, file types and live system status

  - WebDAV per user at /dav/, so your phone can back up photos automatically

  - Disk full warnings (85 % and 95 % by default) in the web, the Android app and, optionally, Telegram

  - Watch videos and listen to music without downloading them

  - Installable on your phone as an app (PWA), plus an Android app


  For automatic photo uploads from your phone, use a WebDAV app (FolderSync, PhotoSync...)
  with the server http://umbrel.local:8590/dav/ and your DrivePanel username and password.


  License: PolyForm Noncommercial 1.0.0. Free for personal, family, school and non-profit use;
  commercial use is not allowed.
releaseNotes: ""

developer: pctecnikk
website: https://github.com/pctecnikk/drivepanel
dependencies: []
repo: https://github.com/pctecnikk/drivepanel
support: https://github.com/pctecnikk/drivepanel/issues

port: 8590
gallery: []
path: ""

defaultUsername: ""
defaultPassword: ""

backupIgnore:
