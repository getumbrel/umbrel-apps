manifestVersion: 1
id: pubky-homeserver
category: networking
name: Pubky Homeserver
version: "0.16.1"
tagline: Self-host your account and data for the Pubky open web
description: >-
  Pubky is an open protocol for apps where you own your identity: your account is a key that you hold, and what you publish lives on a server you choose, called a homeserver.
  Pubky Homeserver runs that server on your Umbrel, so your account and your data for Pubky apps, such as the pubky.app social network, stay at home instead of on someone else's server.


  The dashboard has its own password, which Umbrel shows when you first open the app.


  To get started, open the app and follow the three steps on the Overview: give your homeserver a public address, create an invite, and scan it with Pubky Ring to create your account.
  Pubky Ring is the Pubky app for your phone, available at pubkyring.app.


  A public address lets Pubky apps reach your homeserver from outside your home network.
  The app sets one up for you through a Cloudflare Tunnel, so there is no port forwarding to configure.
  For a permanent address you need a free Cloudflare account with a domain. If you have neither, Preview mode gives you a temporary address to try things out.
  After you set up or change the address, restart the app from Umbrel to publish it.


  From the dashboard you can also invite family and friends, browse the files stored on your homeserver, and read its logs.
releaseNotes: ""
developer: Synonym
website: https://pubky.org
dependencies: []
repo: https://github.com/pubky/pubky-homeserver
support: https://github.com/pubky/pubky-homeserver/issues
port: 8812
gallery: []
path: ""
deterministicPassword: true
defaultUsername: ""
defaultPassword: ""
backupIgnore:
  - data/homeserver/homeserver.log
  - data/cloudflare/preview/*
submitter: Synonym
submission: https://github.com/getumbrel/umbrel-apps/pull/6223
