manifestVersion: 1
id: tandoor
storage:
  dataRoot: data
name: Tandoor Recipes
tagline: Organize recipes, meal plans, and shopping lists
category: files
version: "2.7.6"
port: 9456
description: >-
  Tandoor Recipes is a self-hosted recipe manager for collecting and organizing your growing collection of digital recipes.


  Import recipes from thousands of websites, plan meals, build shopping lists, organize recipes with cookbooks and tags, and share recipes with family and friends.


  Tandoor is optimized for mobile use and stores your recipes, meal plans, shopping lists, cookbooks, and uploaded media on your Umbrel.
developer: Tandoor Recipes
website: https://tandoor.dev/
repo: https://github.com/TandoorRecipes/recipes
support: https://github.com/TandoorRecipes/recipes/issues
submitter: Umbrel
submission: https://github.com/getumbrel/umbrel-apps/pull/5688
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
  - 4.webp
  - 5.webp
releaseNotes: >-
  This update fixes security issues affecting private recipes, account information, import logs, and the Nextcloud storage integration.


  Other improvements include:
    - Fixed sharing recipes that contain sub-recipes
    - Restricted shared recipe links to showing only the creator's display name
    - Fixed resetting food inheritance affecting other spaces
    - Fixed errors when saving ingredients without a unit or editing steps without a sub-recipe
    - Further fixes for permissions, imports, and AI recipe import links


  If you use a third-party app that signs in to Tandoor with the old API token login, it will need to switch to a supported sign-in method. See https://docs.tandoor.dev/features/authentication/.


  Known issue: you can now enter fractional servings in the cook log, but Tandoor saves them rounded to a whole number (for example, 1.5 is saved as 2). A future Tandoor update is expected to fix this.


  Full release notes can be found at https://github.com/TandoorRecipes/recipes/releases/tag/2.7.6
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
backupIgnore:
  - data/staticfiles/*
