manifestVersion: 1
id: crafty
category: developer
name: Crafty Controller
version: "4.11.0"
tagline: Create and manage your own Minecraft servers
description: >-
  🎮 Run your own game servers with Crafty Controller. Create, import, configure,
  and manage Minecraft servers from a convenient web dashboard.


  Sign in as admin using the password shown by Umbrel. You can change your
  password in Crafty's account settings after signing in.


  Start and stop servers, use the live console, manage players and files, monitor
  resource usage, and schedule tasks and backups. Server worlds, settings,
  backups, and custom branding are stored persistently on your Umbrel.


  Connect Minecraft Java clients to your Umbrel's IP address and the port you
  choose between 25500 and 25600 (the default is 25565). Bedrock or Geyser uses
  UDP port 19132. Hytale servers can use UDP ports 5520 through 5550. An optional
  Dynmap plugin listening on port 8123 is accessible at your Umbrel's IP address
  on port 18123. Game and Dynmap ports are separate from Umbrel's web login;
  configure access controls in your game server or plugin before sharing them.


  Minecraft Java servers work on both Intel/AMD and ARM devices. Native Bedrock
  servers and SteamCMD games require compatible Intel/AMD hardware.
  Allocate server memory conservatively so other Umbrel apps have enough RAM.
