manifestVersion: 1
id: convertx
storage:
  dataRoot: data
category: files
name: ConvertX
version: "0.20.0"
tagline: Self-hosted online file converter
description: >
  ConvertX is a self-hosted file converter. Supports over a thousand different formats.


  Features:
    - Convert files to different formats.
    - Process multiple files at once
    - Password protection
    - Multiple accounts
developer: Emrik Östling
website: https://github.com/C4illin/ConvertX
dependencies: []
repo: https://github.com/C4illin/ConvertX
support: https://github.com/C4illin/ConvertX/issues
port: 8386
gallery:
  - 1.jpg
  - 2.jpg
  - 3.jpg
path: ""
defaultPassword: ""
releaseNotes: >-
  This update adds DjVu conversion support and improves audio conversion reliability.


  Key highlights include:
    - Added support for converting DjVu files
    - Improved the login failure page
    - Fixed audio conversions with embedded cover art and preserved cover art when converting to M4B
    - Fixed long automatic file-deletion intervals
    - Improved database shutdown handling


  Full release notes can be found at https://github.com/C4illin/ConvertX/releases/tag/v0.20.0
submitter: Kanishk Pachauri
submission: https://github.com/getumbrel/umbrel-apps/pull/3832
