manifestVersion: 1
id: convertx
storage:
  dataRoot: data
category: files
name: ConvertX
version: "0.19.0"
tagline: Self-hosted online file converter
description: >
  ConvertX is a self-hosted file converter. Supports over a thousand different formats.


  Features:
    - Convert files to different formats.
    - Process multiple files at once
    - Password protection
    - Multiple accounts
developer: Emrik Östling
website: https://github.com/C4illin/ConvertX
dependencies: []
repo: https://github.com/C4illin/ConvertX
support: https://github.com/C4illin/ConvertX/issues
port: 8386
gallery:
  - 1.jpg
  - 2.jpg
  - 3.jpg
path: ""
defaultPassword: ""
releaseNotes: >-
  This release adds custom branding, more supported conversion formats, and many bug fixes.


  Key highlights include:
    - Added support for AZW3, additional video/audio inputs, MKA output, PDF-to-PostScript, and spreadsheet conversions
    - Added custom branding support
    - Improved image conversion handling for EXIF orientation and multi-page PDFs
    - Fixed encoded download filenames, failed-conversion actions, unauthorized page redirects, and long FFmpeg conversions
    - Added PUID/PGID support for running conversion processes as a non-root user


  Full release notes can be found at https://github.com/C4illin/ConvertX/releases/tag/v0.19.0
submitter: Kanishk Pachauri
submission: https://github.com/getumbrel/umbrel-apps/pull/3832
