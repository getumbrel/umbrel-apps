manifestVersion: 1
id: pyload-ng
storage:
  dataRoot: data
category: files
name: pyload-ng
version: "0.5.0-0b3.dev102"
tagline: The free and open-source Download Manager
description: >-
  Pyload is a powerful, open-source download manager designed to simplify your file downloads. All common video-sites, one-click-hosters, container formats and well known web standards are supported to allow you to download your files. 
  

  Additionally, Pyload has a great variety of plugins to automate common tasks and make unattended running possible.
  

  Pyload has a fully featured and well documented Application Programming Interface, easily extendable and accessible by external tools, cross-platform apps or other softwares.
developer: pyload
website: https://pyload.net/
repo: https://github.com/pyload/pyload/
support: https://github.com/pyload/pyload/issues
port: 8783
submitter: Kanishk Pachauri
submission: https://github.com/getumbrel/umbrel-apps/pull/4124
releaseNotes: >-
  This update brings pyLoad up to 0.5.0b3.dev102, with security fixes, new features and plugin updates.


  Highlights from this release include the following:


  - Fixes 9 security advisories, including session invalidation, API key handling, trusted proxy and client IP handling, archive extraction and SSRF protection.

  - Adds decompression-bomb protection and disk space validation to archive extractors.

  - Adds file upload size validation to prevent denial-of-service attacks.

  - Adds a QR code for connecting the mobile app when generating a new API key.

  - Shows a favicon badge when a captcha is waiting to be solved.

  - Adds an option to allow embedding the web interface in an iframe.

  - Adds CaptchaAI and Solvecha captcha solvers and a new OrigridIo hoster plugin.

  - Adds chunked downloads with resume support for MegaCoNz.

  - Fixes package and file reordering, plus several thread-safety and race-condition issues.

  - Fixes the OneFichierCom, TurbobitNet, YadiSk, DdownloadCom and MegaDebridEu plugins.

  - Removes the deprecated AndroidPhoneNotify and WindowsPhoneNotify plugins.


  Full release notes can be found at https://github.com/linuxserver/docker-pyload-ng/releases/tag/0.5.0b3.dev102-ls261
dependencies: []
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
permissions:
  - STORAGE_DOWNLOADS
path: ""
defaultUsername: "pyload"
defaultPassword: "pyload"
