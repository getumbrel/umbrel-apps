manifestVersion: 1
id: pyload-ng
storage:
  dataRoot: data
category: files
name: pyload-ng
version: "0.5.0-0b3.dev102"
tagline: The free and open-source Download Manager
description: >-
  Pyload is a powerful, open-source download manager designed to simplify your file downloads. All common video-sites, one-click-hosters, container formats and well known web standards are supported to allow you to download your files. 
  

  Additionally, Pyload has a great variety of plugins to automate common tasks and make unattended running possible.
  

  Pyload has a fully featured and well documented Application Programming Interface, easily extendable and accessible by external tools, cross-platform apps or other softwares.
developer: pyload
website: https://pyload.net/
repo: https://github.com/pyload/pyload/
support: https://github.com/pyload/pyload/issues
port: 8783
submitter: Kanishk Pachauri
submission: https://github.com/getumbrel/umbrel-apps/pull/4124
releaseNotes: >-
  This release includes many security fixes, new features and plugin updates.

  Security:
    - Fixed 9 security advisories, including session invalidation, API key handling, trusted proxy and client IP handling, archive extraction (TAR/ZIP decompression-bomb protection) and SSRF protection when fetching certificates
    - Added file upload size validation to prevent DoS attacks
    - Added a check that SSL certificate and key files exist before configuring SSL
    - Raised the minimum pycurl version to 7.45.7


  New features:
    - Generate a QR code for the mobile app when creating a new API key
    - Favicon badge when a captcha is waiting
    - Option to allow embedding the web interface in an iframe
    - Client-side setting to reset "Don't ask again" dialog answers
    - Added CaptchaAI and Solvecha captcha solvers
    - Added OrigridIo hoster plugin
    - MegaCoNz now supports chunked downloads with resume


  Fixes and improvements:
    - Fixed package/file reordering and job retrieval bugs
    - Fixed several thread-safety and race-condition issues (accounts, cookies, API key cache)
    - Improved handling of long-waiting downloads
    - Fixed plugins: OneFichierCom, TurbobitNet, YadiSk, DdownloadCom, MegaDebridEu, DailyuploadsNet, UnZip
    - Removed deprecated AndroidPhoneNotify and WindowsPhoneNotify plugins
dependencies: []
gallery:
  - 1.jpg
  - 2.jpg
  - 3.jpg
permissions:
  - STORAGE_DOWNLOADS
path: ""
defaultUsername: "pyload"
defaultPassword: "pyload"
