version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: pyload-ng_web_1
      APP_PORT: "8000"

  web:
    image: linuxserver/pyload-ng:0.5.0@sha256:8505c2a9b6ef6dafb7e57daa91d896b8bb11f3a396c939a7dc6c47533b89ec79
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
