version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: kiwix_web_1
      APP_PORT: 8080

  web:
    image: ghcr.io/kiwix/kiwix-serve:3.8.2@sha256:e478554a9920412eeb5ce1d73f24e4b28445ebed233187cdd03c623c32be46a5
    user: "1000:1000"
    restart: on-failure
    volumes:
      - ${UMBREL_ROOT}/data/storage/downloads:/data
    command: >
      /data/*.zim -k
