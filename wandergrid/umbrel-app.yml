manifestVersion: 1
id: wandergrid
category: files
name: WanderGrid
version: "1.1.0"
tagline: Plan trips, log flights and manage your leave
description: >-
  WanderGrid is a self-hosted travel planner, flight log and leave manager. Create an account the first time you open it; the first user becomes the admin.


  Features:

  - **Trip planner**: Build itineraries with flights, road trips, stays and activities, and see each trip on a map.

  - **Flight log**: Import your flights from a spreadsheet or look them up by flight number, then group them into journeys.

  - **World map and atlas**: See every route you have travelled and the countries you have visited.

  - **Leave calendar**: Track vacation days, public holidays and your trips in one calendar, with an iCal feed for other calendar apps.

  - **Multiple users**: Share a household or team workspace with separate accounts.

  - **Private by default**: Your data stays in a PostgreSQL database on your Umbrel. Optional flight and map integrations use keys you add yourself in Settings.
