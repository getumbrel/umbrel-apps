name: WanderGrid
version: "1.2.1"
tagline: Plan trips, log flights and manage your leave
description: >-
  WanderGrid is a self-hosted travel planner, flight log and leave manager. Create an account the first time you open it; the first user becomes the admin.


  Features:

  - **Trip planner**: Build itineraries with flights, road trips, stays and activities, and see each trip on a map.

  - **Flight log**: Import your flights from a spreadsheet or look them up by flight number, then group them into journeys.

  - **World map and atlas**: See every route you have travelled and the countries you have visited.

  - **Leave calendar**: Track vacation days, public holidays and your trips in one calendar, with an iCal feed for other calendar apps.

  - **Leave meets trips**: See how many leave days a trip costs and book them against a leave type in one step.

  - **Trip expenses**: Log what you spend in any currency, converted at the day's rate, split between travellers, with who owes whom.

  - **Entry requirements and jet lag**: Check passports and visas against a trip's destinations, and get a sleep and light plan for each flight.

  - **Loyalty wallet**: Keep frequent-flyer and hotel numbers for each member, shown on the matching boarding pass, with status progress from your flights.

  - **Booking import and offline packs**: Add a trip from a confirmation email, and save a trip with its map area to read without a connection.

  - **Year in review, achievements and route replay**: Look back on a year of travel, earn stamps for how you travel, and replay your routes on the map.

  - **Shareable trip links**: Give family a read-only page for a trip, with no account needed, and turn it off at any time.

  - **Multiple users**: Share a household or team workspace with separate accounts.

  - **Private by default**: Your data stays in a PostgreSQL database on your Umbrel. Optional flight and map integrations use keys you add yourself in Settings.
