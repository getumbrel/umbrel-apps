manifestVersion: 1
id: bob-wallet
storage:
  dataRoot: data
category: crypto
name: Bob DNS
version: "2.3.19"
tagline: Handshake DNS wallet and full node
description: >-
  Bob DNS is a Handshake (HNS) wallet with a built-in full node. Use it to
  manage HNS, bid on name auctions, and manage your Handshake domains and DNS records.


  ⚠️ Always back up your seed phrase. Uninstalling this app permanently deletes
  its data, including your wallet files.


  The initial sync of the Handshake blockchain can take several days. As of October 2026, a full node
  requires about 150 GB of disk space. Until your full node has finished syncing, the best approach is
  to run in SPV mode whenever you need the wallet, and switch back to full-node mode when you want the
  sync to make progress. Once your node is fully synced, there's no need to switch back to SPV mode.


  This app runs Bob LearnHNS as a web app: its wallet, Handshake full node and
  services run on your Umbrel, and you use Bob's own interface directly in
  your browser. Your node keeps syncing when you close the browser tab. Ledger hardware
  wallets are not supported in this version.


  Bob Wallet and Handshake are open decentralized projects, so there's no such thing as official.
  But if you have questions or want to join the community, GitHub or
  [Discord](https://discord.gg/Q2HfjDGfz) are a good place to start.
releaseNotes: ""

developer: Shadstone
website: https://bobwallet.org
dependencies: []
repo: https://github.com/shadstoneofficial/bob-wallet
support: https://github.com/shadstoneofficial/bob-wallet/issues

port: 8337
gallery: []
path: ""

defaultUsername: ""
defaultPassword: ""

backupIgnore:
  - "data/config/.config/Bob*LearnHNS/hsd_data/blocks/*"
  - "data/config/.config/Bob*LearnHNS/hsd_data/chain/*"
  - "data/config/.config/Bob*LearnHNS/hsd_data/tree/*"
  - "data/config/.config/Bob*LearnHNS/hsd_data/spvchain/*"

submitter: galetaire
submission: https://github.com/getumbrel/umbrel-apps/pull/0
