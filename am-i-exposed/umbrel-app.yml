manifestVersion: 1
id: am-i-exposed
category: bitcoin
name: "am-i.exposed"
version: "0.37.2"
tagline: Bitcoin privacy scanner - see what the blockchain reveals about you
description: >-
  Paste a Bitcoin address, transaction ID, xpub or descriptor, or an unsigned
  PSBT and get a privacy score from 0 to 100 with clear findings and fixes. The
  engine runs 34 heuristics and 10 chain analysis modules covering address
  reuse, change detection, CoinJoin detection (Whirlpool, WabiSabi,
  JoinMarket), script types, timing, wallet fingerprinting and entity
  proximity, plus Boltzmann entropy computed on-device and an interactive
  transaction graph explorer.


  All analysis runs client-side in the browser. Blockchain data comes from the
  local Umbrel mempool instance, so addresses and transactions never leave the
  network. The optional Chainalysis check is routed over Tor. No tracking, no
  logging, no third-party analytics.
releaseNotes: >-
  A redesigned interface. The new UI replaces the classic one and follows the
  system light or dark theme. Results load faster and read more clearly: the
  transaction flow is drawn as soon as it is fetched, and the verdict, findings
  and score breakdown are easier to scan. The graph explorer starts compact
  with a few ranked neighbours. New examples to learn from, including one
  CoinJoin of each kind; WabiSabi rounds are recognised exactly by the Wasabi
  protocol's standard denominations; more accurate scores for single-input
  transactions, consolidations, peel chains and dust attacks; the Link
  Probability Matrix now handles JoinMarket rounds where makers combine
  inputs; the Chainalysis check says when the Chainalysis service itself is
  failing; and opening a page such as the guide directly no longer redirects
  to the wrong port.
