version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: changedetection-io_app_1
      APP_PORT: 5000

  app:
    image: ghcr.io/dgtlmoon/changedetection.io:0.70.1@sha256:72e761d84463553c4a276127df46a4967e9feea8878b88b05d8c058ddbe1a4c8
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    environment:
      BASE_URL: http://${DEVICE_DOMAIN_NAME}:5037
      USE_X_SETTINGS: "1"
      HIDE_REFERER: "true"
      TZ: "Etc/UTC"
      DISABLE_VERSION_CHECK: "true"
    volumes:
      - ${APP_DATA_DIR}/data:/datastore
