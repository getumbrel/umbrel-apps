version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: changedetection-io_app_1
      APP_PORT: 5000

  app:
    image: ghcr.io/dgtlmoon/changedetection.io:0.60.3@sha256:ecacd9fd0c664a786b77daadbbbf51373519b29178a32df3ddbc5c594bc067ed
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    environment:
      BASE_URL: http://${DEVICE_DOMAIN_NAME}:5037
      USE_X_SETTINGS: "1"
      HIDE_REFERER: "true"
      TZ: "Etc/UTC"
      DISABLE_VERSION_CHECK: "true"
    volumes:
      - ${APP_DATA_DIR}/data:/datastore
