manifestVersion: 1
id: changedetection-io
storage:
  dataRoot: data
name: changedetection.io
category: automation
version: "0.70.2"
tagline: Website change detection and alerts
description: >-
  Never miss an important change on the web again. changedetection.io watches websites, pages, JSON APIs,
  and PDFs for you and sends an alert the moment something changes.


  Track price drops and restocks on product pages, monitor release notes and changelogs,
  watch status pages for outages, follow legal or policy document updates, or keep an eye
  on any page that matters to you. Set a check interval, define what to watch for, and let it run quietly in the background.
developer: dgtlmoon
website: https://changedetection.io/
repo: https://github.com/dgtlmoon/changedetection.io
support: https://github.com/dgtlmoon/changedetection.io/issues
port: 5037
path: ""
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
  - 4.webp
  - 5.webp
defaultUsername: ""
defaultPassword: ""
dependencies: []
submitter: al-lac
releaseNotes: >-
  This update improves the optional MCP integration with more watch controls,
  clearer permissions, custom instructions for connected assistants, and a
  separate public MCP address setting.


  It also fixes errors when clearing watch history, prevents newly created
  watches from being queued twice, and fixes AI settings so API keys can be
  edited and saving no longer resets hidden options. The watch API now includes
  paused and muted-notification status.


  Full release notes can be found at https://github.com/dgtlmoon/changedetection.io/releases/tag/0.70.2
submission: https://github.com/getumbrel/umbrel-apps/pull/5704
