manifestVersion: 1
id: peerloom-seeder
category: networking
name: PeerLoom Seeder
version: "1.0.0"
tagline: Keeps your PeerLoom apps in sync while your phones sleep
description: >-
  Your PeerLoom apps sync phone to phone. When everyone's phones are asleep or
  out of signal, nothing moves until two of them are online together. PeerLoom
  Seeder fixes that: pair your phones with it once, and your Umbrel keeps a
  copy of your shared lists, calendars, circles and files for them. A phone that wakes up
  catches up from the seeder, even if the person who made the change is
  offline.


  One seeder serves every PeerLoom app, such as PearList and PearOffice. You
  decide who pairs with it, and how much each device may store (25 GB to
  start).


  It stores your data scrambled and cannot read it: it never gets the keys to
  your data. A new phone or member still needs someone already sharing with
  them to be online once to let them in.


  To pair a phone: open the seeder, enter the password shown next to the app,
  choose Pair a device, then scan the code in your PeerLoom app's seeder
  settings.
developer: PeerLoom
