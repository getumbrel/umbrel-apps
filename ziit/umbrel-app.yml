manifestVersion: 2.0
id: ziit
storage:
  dataRoot: data
environment:
  - name: ZIIT_DISABLE_REGISTRATION
    services:
      - app
    default: "false"
    options:
      - "false"
      - "true"
    note: >-
      Set to true to stop new accounts from being created once you have registered yours.
  - name: ZIIT_BASE_URL
    services:
      - app
    note: >-
      Only needed for GitHub login. The address you open Ziit at, including https://, for example https://umbrel.local:3029.
  - name: ZIIT_GITHUB_CLIENT_ID
    services:
      - app
    note: >-
      GitHub OAuth client ID, for signing in with GitHub. Also enter the client secret below and set the base URL above.
  - name: ZIIT_GITHUB_CLIENT_SECRET
    services:
      - app
    note: >-
      GitHub OAuth client secret, from the same OAuth app as the client ID above.
category: developer
name: Ziit
version: "1.3.3"
tagline: The Swiss army knife of code time tracking
description: >-
  Ziit (pronounced 'tseet') is an open-source, self-hostable alternative to WakaTime. It provides a clean, minimal, and fast dashboard for displaying coding statistics, while ensuring privacy by keeping all data on your own server. Ziit tracks coding activity such as projects, languages, editors, files, branches, operating systems, and time spent coding all presented in a familiar interface inspired by Plausible Analytics.
releaseNotes: ""
developer: PandaDEV
website: https://ziit.app
dependencies: []
repo: https://github.com/0PandaDEV/Ziit
support: https://github.com/0PandaDEV/Ziit/issues
port: 3029
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
path: ""
requiresHttps: true
defaultUsername: ""
defaultPassword: ""
submitter: PandaDEV
submission: https://github.com/getumbrel/umbrel-apps/pull/3407
