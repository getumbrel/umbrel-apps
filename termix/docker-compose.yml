version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: termix_web_1
      APP_PORT: 8080

  web:
    image: ghcr.io/lukegus/termix:release-2.9.1@sha256:79206f0774bc146121c7c4664da2592fa3b482d7bba12da69ed1108ce1d6c68d
    restart: on-failure
    depends_on:
      - guacd
    environment:
      GUACD_HOST: guacd
      GUACD_TUNNEL_HOST: web
      GUACD_RECORDING_PATH: /termix-data/session_recordings/guacamole
      POSTHOG_API_KEY: ""
      ENABLE_TELEMETRY: "false"
    volumes:
      - ${APP_DATA_DIR}/data:/app/data

  guacd:
    image: guacamole/guacd:1.6.0@sha256:8974eaa9ba32f713daf311e7cc8cd7e4cdfba1edea39eed75524e78ef4b08f4f
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data:/termix-data
