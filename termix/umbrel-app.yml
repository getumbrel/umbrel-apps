releaseNotes: >-
  Important: this release rebuilds Termix around a new plugin system. Update any Termix mobile clients to the latest version (v1.5.1) before using them with this server version. The upstream project also notes that the next release will move from semantic versioning to calendar versioning.


  New features and improvements:
    - Rebuilt core features such as terminals, file manager, tunnels, remote desktop, automations, AI, and login methods as signed plugins on a shared SDK
    - Added a dedicated sync page with more control over what syncs, including device-only hosts/folders and conflict resolution
    - Added an alerts inbox, redesigned split screen, inherited host defaults, host maintenance mode, fleet sharing, and new terminal/session controls
    - Improved file manager behavior, SFTP downloads, host status checks, desktop linking, and overall UI loading
    - This Umbrel package keeps upstream telemetry disabled


  Bug fixes:
    - Fixed many terminal, file manager, SFTP, remote desktop, tunnel, host metrics, sync, sharing, desktop, and UI issues
    - Fixed split-screen layouts over plain HTTP, private-address homepage service checks, LDAP bind DN handling, AI response streaming, and several dependency security advisories


  Full release notes can be found at https://github.com/Termix-SSH/Termix/releases/tag/release-2.9.0-tag
