manifestVersion: 1
id: lanscape
storage:
  dataRoot: data
environment:
  - name: RESET_PASSWORD
    services:
      - server
    note: Set to yes and restart LANscape to reset its password to the one Umbrel shows. Clear it afterwards, or each restart resets it again.
category: networking
name: LANscape
version: "1.1.0"
tagline: See what's happening on your home network
description: >-
  LANscape signs you in with the password Umbrel shows for it in the app's
  menu. You can change it in LANscape's settings.


  LANscape watches your home network from your Umbrel. Run speed tests on
  demand or on a schedule and see how your speed and latency change over
  time. A ping check every minute tracks router and internet latency and
  packet loss with almost no data.


  Every device on your network is listed with its maker and the name it
  announces, and you can name the rest yourself or identify one by switching
  it off and on. See when each device came and went, and get alerted when a
  device you care about goes offline or a new one joins.


  Alerts for slow speeds, packet loss, new devices or offline devices can go
  to ntfy, Telegram, Discord, Slack or a webhook. Everything stays on your
  Umbrel, and you can export it as CSV.
releaseNotes: ""

developer: Luis Suarez
website: https://github.com/SuarezLuis/lanscape
dependencies: []
repo: https://github.com/SuarezLuis/lanscape
support: https://github.com/SuarezLuis/lanscape/issues

port: 4545
gallery: []
path: ""

defaultUsername: ""
defaultPassword: ""
deterministicPassword: true

submitter: Luis Suarez
submission: https://github.com/getumbrel/umbrel-apps/pull/TBD
