manifestVersion: 1
id: lanscape
storage:
  dataRoot: data
environment:
  - name: RESET_PASSWORD
    services:
      - server
    note: Set to yes and restart LANscape to reset its password to the one Umbrel shows. Clear it afterwards, or each restart resets it again.
category: networking
name: LANscape
version: "1.14.1"
tagline: See what's happening on your home network
description: >-
  LANscape signs you in with the password Umbrel shows for it in the app's
  menu. You can change it in LANscape's settings.


  LANscape watches your home network from your Umbrel. The Overview shows
  at a glance whether the internet is up, a 0–100 health score, the latest
  speed test, outages, services with trouble, new devices and recent alerts.


  Run speed tests on demand or on a schedule and see how speed and latency
  change over time and by hour of the week, against your plan. A ping check
  every minute tracks router and internet latency and packet loss with
  almost no data, and spots outages: when the internet was down, for how
  long, and whether the problem was your internet provider or your home
  network.


  Every device on your network is listed with its maker, model and name,
  and keeps its history even when phones switch to a new private address.
  Name devices yourself, see a best guess at what each mystery device is,
  identify one by switching it off and on (or, with Pi-hole, by pausing its
  internet for a few minutes), and get
  alerted when a new one joins or one you care about goes offline or comes
  home. See which ports each device has open and what actually answers on
  them (or scan all 65,535 ports of one device), and hear when one opens a new port. Watch the services you rely on (web apps, ports, DNS) and hear when
  they go down. Diagnostics checks each link from the router to the
  internet and gives you a report to send your provider.


  Alerts go to ntfy, Telegram, Discord, Slack or a webhook, with an optional
  weekly summary. Optionally, ask an AI assistant about your network in
  plain language (with a model on your own network, like Ollama, or Claude
  or OpenAI), or connect AI agents over MCP. The assistant can also suggest
  changes, like naming a device or adding a service check, that happen only
  when you approve them and can be undone. Everything else stays on your
  Umbrel, and you can back it up or export it as CSV.
releaseNotes: ""

