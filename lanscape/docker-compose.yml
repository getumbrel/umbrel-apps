version: "3.7"

services:
  server:
    image: ghcr.io/suarezluis/lanscape:1.1.0@sha256:2df719aa15c335bec266bec1c4e594119937ef9085a92d7050fc702bfdad9ae4
    restart: on-failure
    # Node runs as PID 1; init reaps the speed test processes it starts
    init: true
    # Host network so ARP scans and mDNS see the real LAN, not a Docker bridge
    network_mode: host
    environment:
      PORT: 4545
      # Seeds LANscape's own login (host-network apps aren't behind Umbrel's login); shown via deterministicPassword
      APP_PASSWORD: $APP_PASSWORD
    volumes:
      - ${APP_DATA_DIR}/data/db:/data
