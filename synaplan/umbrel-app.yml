manifestVersion: 1
id: synaplan
category: ai
name: Synaplan
# Maintained by CI together with APP_VERSION and the image pin in
# docker-compose.yml — scripts/set-release-version.mjs owns this field.
version: "4.6.0"
tagline: Private AI workspace with chat, document search and embeddable widgets
description: >-
  Synaplan is a self-hosted AI workspace. Chat with the model of your choice,
  upload documents and search them by meaning, and publish a chat widget you can
  embed on any website.


  On first launch, sign in with the username and password shown above, then open
  Admin > AI Providers and add an API key for the provider you want to use
  (OpenAI, Anthropic, Google Gemini, Groq, Mistral or xAI). Synaplan ships
  without a key, so this step is required before the first answer.


  What you get:


  - Chat with several AI providers side by side, with per-model settings

  - Upload PDFs, Office documents and images, then search them by meaning
    instead of keywords

  - Long-term memories the assistant can recall across conversations

  - Embeddable chat widgets for your own websites, each with its own assistant

  - Multi-user accounts with roles, usage statistics and per-user limits


  Note: features that require your server to be reachable from the public
  internet do not work on a LAN-only Umbrel. That includes WhatsApp media
  delivery and signing in through Google, GitHub or Apple. Everything else runs
  entirely on your own hardware.
