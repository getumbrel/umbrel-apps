manifestVersion: 1
id: openpost
storage:
  dataRoot: data
environment:
  - name: OPENPOST_APP_URL
    services:
      - server
    note: Set the complete public HTTPS origin after configuring a reverse proxy or tunnel, for example https://post.example.com. This also configures callback and media URLs. It does not expose the app by itself.
  - name: OPENPOST_DISABLE_REGISTRATIONS
    services:
      - server
    options:
      - "false"
      - "true"
    note: Keep false until you create your first account. Set true to close public signup after setup.
category: social
name: OpenPost
version: "7.23.0"
tagline: Create, edit, and schedule your social content
description: >-
  Create your OpenPost account in the browser after installation. No OpenPost Hosted subscription is required.


  Social integrations require your own provider credentials and a public HTTPS address reachable by OAuth callbacks and media downloads. Configure a reverse proxy or tunnel, then set OPENPOST_APP_URL in Umbrel's app settings. Provider approval or paid API access may be required. Local writing and editing work without connecting a social account.


  OpenPost brings writing, image design, video editing, and social publishing into one workspace. Turn ideas into posts and destination-specific variants, organize drafts, and schedule content. Use the image editor for graphics and carousels, and the video editor for clips.


  Keep your database, uploaded media, and configuration on your Umbrel. Optional AI features require separately configured providers.
releaseNotes: ""

developer: OpenPost
website: https://openpo.st
dependencies: []
repo: https://github.com/getopenpost/openpost
support: https://github.com/getopenpost/openpost/issues

port: 3457
gallery: []
path: ""

defaultUsername: ""
defaultPassword: ""

submitter: Rodrigo Dias
