manifestVersion: 1
id: ferret
storage:
  dataRoot: data
environment:
  - name: PUBLIC_URL
    services:
      - web
    default: ""
    note: >-
      Optional: the address you open Ferret at, for example http://umbrel.local:8785. Signing in works without it; links Ferret sends (invitations, share links, calendar feeds), passkeys and single sign-on need it.
category: files
name: Ferret
version: "2026.11.4"
tagline: Find anything you own
description: >-
  Ferret is a self-hosted home inventory for the whole household. Open it and sign up: the first account runs the
  server. Ferret makes its own encryption keys on first start — once it runs, make a key file (Settings → Server → Keys)
  and keep it somewhere else, because uploaded photos and documents can't be read without the key.


  - Add things by photo, barcode or a walk through a room, and find them again by what they are, not only by name

  - Print QR labels for boxes and shelves, and scan them to see what's inside

  - Keep warranties, manuals, receipts and maintenance schedules with each thing, with reminders

  - An insurance report with values and photos, ready to print

  - Several households, and people with roles (owner, admin, member, viewer)

  - A REST API and an MCP server, so AI assistants can look things up and add them for you

  - Optional AI on your own models: photo descriptions, search by meaning, reading manuals and receipts
releaseNotes: ""
developer: Ferret
website: https://github.com/ferret-project/ferret
dependencies: []
repo: https://github.com/ferret-project/ferret
support: https://github.com/ferret-project/ferret/issues
port: 8785
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
submitter: UmbrellaCodr
submission: https://github.com/getumbrel/umbrel-apps/pull/6316
