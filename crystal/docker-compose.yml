version: '3.7'

services:
  app_proxy:
    environment:
      APP_HOST: crystal_frontend_1
      APP_PORT: 80

  frontend:
    image: ghcr.io/samerberjawi/crystal:frontend-v3.1.0@sha256:f44419e0b85c90ed465a1e39f58ae76c79a4b69fb29faec5fee1307dc87ce16d
    restart: on-failure
    depends_on:
      backend:
        condition: service_healthy
    networks:
      default:
        aliases:
          - frontend

  backend:
    image: ghcr.io/samerberjawi/crystal:backend-v3.1.0@sha256:271b98178475792a8a86da28d911c45bbe935ebee14e4e0e9042f01ad52c4f41
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      NODE_ENV: production
      AUTH_COOKIE_SECURE: "false"
      JWT_SECRET: ${APP_CRYSTAL_JWT_SECRET}
      DATABASE_HOST: crystal_db_1
      DATABASE_PORT: 5432
      DATABASE_USER: crystal
      DATABASE_PASSWORD: ${APP_CRYSTAL_DB_PASSWORD}
      DATABASE_NAME: crystal
    networks:
      default:
        aliases:
          - backend

  db:
    image: postgres:15.19-alpine@sha256:aae6554de426ae1990f1a939ff183a0299146cf7142a6f4c379c3357af9cc2d8
    restart: on-failure
    environment:
      POSTGRES_DB: crystal
      POSTGRES_USER: crystal
      POSTGRES_PASSWORD: ${APP_CRYSTAL_DB_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crystal -d crystal"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      default:
        aliases:
          - db
