tagline: Personal wealth tracker with predictive cashflow & future forecasting
description: >-
  Crystal is an open-source, self-hosted personal wealth operating system and portfolio intelligence platform designed for complete financial clarity and data sovereignty.


  Unlike static budget trackers, Crystal features a deterministic wealth forecasting and cashflow simulation engine. By synthesising your historical financial habits with scheduled future transactions, recurring obligations, debt amortizations, and savings goals, Crystal projects your daily cash position and net-worth trajectory up to 2 years into the future.


  Features:

  - Predictive Wealth & Cashflow Engine: Project daily account balances, anticipate liquidity crunches before they happen, and model savings goal horizons based on historical cashflow and scheduled future events.

  - Comprehensive Asset Tracking: Unify liquid cash, investment portfolios, crypto, real estate, vehicles, commodities, and equity grants in one secure hub.

  - Real-Time Market Analytics: Live asset valuations, interactive historical charts, performance metrics, and geospatial transaction spending maps.

  - Complete Privacy & Sovereignty: 100% self-hosted with dedicated local PostgreSQL persistence. Your financial records never leave your Umbrel node.

  - Modern Responsive Interface: Fluid, interactive desktop and mobile views with one-click privacy blur modes for public viewing.
