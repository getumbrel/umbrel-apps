releaseNotes: >-
  This update adds document previews and improves recovery key checks, room notifications, and calls.


  ⚠️ Element no longer upgrades very old browser sessions. If you last used Element in a browser before August 2024, that browser may show "Missing saved data" and offer to remove the device. Only continue if you have your recovery key or Element is still signed in on another device, so you can restore your encrypted messages after signing in again. Browsers that have opened Element since August 2024 aren't affected.


  Improvements include:
    - Preview documents directly in Element
    - Check your recovery key without leaving the sign-out dialog
    - Export encryption keys even when key storage is out of sync or your device is unverified
    - Rejoin an Element Call after reloading
    - More reliable room notification menus and URL preview thumbnails


  Full release notes can be found at https://github.com/element-hq/element-web/releases/tag/v1.12.36
