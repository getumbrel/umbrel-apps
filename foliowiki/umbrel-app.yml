manifestVersion: 1
id: foliowiki
storage:
  dataRoot: data
environment:
  - name: CURSOR_API_KEY
    services:
      - server
    note: >-
      Optional. A Cursor API key for the built-in Folio AI assistant, used when nobody has set a key in Folio itself. Administrators can also add keys in Folio's own settings, and those win over this one.
name: Folio Wiki
tagline: A Git-backed wiki your team and AI agents edit together
category: ai
version: "0.4.6"
port: 4870
description: >-
  Folio (foliowiki) is an open-source wiki that keeps every page as a plain file in a Git repository you control. People write in the browser together, in real time, and AI agents read and write the same pages.


  After you install it, open the app and create the first account. That account becomes the administrator. Folio has its own sign-in; people you invite get their own accounts.


  Pages, data tables, Excalidraw whiteboards, Mermaid diagrams, forms, PDFs and Word files live in one page tree, with access rights per space and per page, page history, search, and offline editing. The built-in assistant, a per-space agent and a full MCP server let agents work on the same content as your team.


  Folio builds its links from the address you opened it at on this Umbrel (the .local name and port). If you open it by IP address, signing in works, but invitation and share links will still use the .local name.


  The app runs three containers (Folio, PostgreSQL and Redis) and needs about 2 GB of free memory.
releaseNotes: ""
developer: Evergreen
website: https://foliowiki.online
dependencies: []
repo: https://github.com/evergreen-it-dev/folio
support: https://github.com/evergreen-it-dev/folio/issues
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
