manifestVersion: 1
id: had-homeassistantdashboard
storage:
  dataRoot: data
environment:
  - name: HASS_URL
    services:
      - web
    default: http://umbrel.local:8123
    note: >-
      The Home Assistant instance that validates dashboard sign-ins. The default points at the Home Assistant app on this Umbrel. Change it if Home Assistant runs elsewhere, for example http://192.168.1.50:8123.
category: automation
name: HAD - Home Assistant Dashboard
version: "0.8.0"
tagline: Sleek, high-performance Home Assistant dashboard with responsive bento grid
description: >-
  HAD is a modern, high-performance dashboard for Home Assistant engineered for wall-mounted tablets, touch displays, desktops, and mobile devices. It requires an existing Home Assistant instance.


  On first launch, sign in with your Home Assistant URL and a long-lived access token (created from your Home Assistant user profile). Sign-ins are validated against the Home Assistant instance set in the app settings (default: the Home Assistant app on this Umbrel).


  Featuring a fluid responsive grid, real-time WebSocket state synchronization, interactive climate controls, media players, and automated scene activation, HAD brings an elevated, futuristic aesthetic to your smart home.


  Features:


  - Instant Auto-Discovery: Seamlessly reads your Home Assistant areas, entities, and devices.

  - Interactive Widgets: Sleek control cards for lights, switches, thermostats, covers, locks, and sensors.

  - Multi-Device Synchronization: Saved layouts and settings persist locally and sync across all your displays.

  - Private & Sovereign: Runs 100% locally with zero cloud dependencies or external tracking.
releaseNotes: ""
developer: Samer Berjawi
website: https://github.com/SamerBerjawi/had-homeassistantdashboard
dependencies: []
repo: https://github.com/SamerBerjawi/had-homeassistantdashboard
support: https://github.com/SamerBerjawi/had-homeassistantdashboard/issues
port: 8124
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
submitter: Samer Berjawi
submission: https://github.com/getumbrel/umbrel-apps/pull/6325
