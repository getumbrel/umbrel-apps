releaseNotes: |
  This update includes important security fixes for project access, guest visibility, file uploads, editor content, and sign-in sessions. Self-hosted users are encouraged to update.

  - Fixed pages loading blank when opened for the first time in a browser.
  - Fixed direct file uploads and errors in burndown charts and progress views.
  - Fixed project invitations and preserved invite links through sign-in and sign-up.
  - Fixed email notification delivery and recently visited items.
  - Improved mobile navigation and prevented links from opening twice.
  - Restricted guest access to project data and other members' email addresses.

  If you use email invitations with SMTP configured, password-based accounts must accept the emailed invite link or verify their email first. OAuth sign-in requires the corresponding provider to be enabled in the admin settings. Points estimates now require numeric values; category estimates still accept text.

  Full release notes can be found at https://github.com/makeplane/plane/releases/tag/v1.5.1
