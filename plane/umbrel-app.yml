releaseNotes: |
  This update includes important security fixes for workspace and project access, published boards, file uploads, and sign-in sessions. Self-hosted users are encouraged to update.

  - Refreshed the interface across Plane, published boards, and the admin panel.
  - Added Bulgarian, Georgian, and Dutch translations.
  - Fixed attachment upload and download errors, work item history, and module counts in the API.
  - Fixed disappearing sub-work items and reload loops when a session expires.
  - Improved editor collaboration, timeline scrolling, and profile settings.

  Full release notes can be found at https://github.com/makeplane/plane/releases/tag/v1.5.0
