manifestVersion: 2.0
id: actual
storage:
  dataRoot: data
category: finance
name: Actual
version: "26.11.0"
tagline: Powerful budgeting made simple
description: >-
  Actual Budget is a super fast and privacy-focused app for managing your finances. At its heart is the well proven and much loved Envelope Budgeting methodology.


  You own your data and can do whatever you want with it. Featuring multi-device sync, optional end-to-end encryption and so much more.


  - Envelope budgeting: you can only budget cash you have on hand, so your budget stays realistic

  - Manage split transactions and transfers all in the same editor

  - Net worth and cash flow reports, plus a powerful custom report engine

  - Import transactions from QIF, OFX, QFX, CAMT.053 and CSV files

  - Built-in YNAB4 and nYNAB importers that keep all of your history

  - Bank sync with supported providers
releaseNotes: >-
  This update adds automatic bank syncing while Actual is open, reports grouped by tags, and customizable sidebar pages and start page.


  It also improves performance for large budgets, fixes transaction imports and schedules, makes budget saves more resilient, and includes security improvements for sign-in and bank connections.


  If you use a custom SimpleFIN bridge on a private network, you must now explicitly allow it in the server configuration.


  Full release notes can be found at https://actualbudget.org/blog/release-26.11.0

developer: Actual Budget
website: https://actualbudget.org/
