manifestVersion: 2.0
id: actual
storage:
  dataRoot: data
category: finance
name: Actual
version: "26.9.0"
tagline: Fast, private budgeting made simple
description: >-
  Actual is a fast, privacy-focused app for managing your personal finances. It's built around envelope budgeting, so you give every dollar a job and plan with the money you actually have.


  Your budget is stored on your Umbrel and syncs across your devices. Actual keeps working when you're offline, and optional end-to-end encryption keeps your budget private even from the server.


  - Envelope budgeting with rollover, or a simpler tracking budget

  - Quick transaction entry with split transactions, transfers, and rules that categorize transactions for you

  - Import from OFX, QFX, QIF, CSV, and CAMT files, or migrate from YNAB

  - Net worth and cash flow reports, plus custom reports and dashboards

  - Multiple budgets, with optional bank sync through supported providers
