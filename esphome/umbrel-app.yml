releaseNotes: >-
  ⚠️ Review the upstream upgrade checklist before updating device firmware. ESP8266 now uses the native Arduino toolchain and the first compile is a clean build; set `toolchain: platformio` under `esp8266:` temporarily if your board or custom framework needs the old toolchain. Sendspin requires Music Assistant 2.10.7 or newer (or 2.11.0b4 or newer).


  Check existing light boot-state settings, speaker codec and mute automations, remote-receiver buffer sizes, Climate IR modes, USB UART filters, e-paper settings, and custom lambdas or external components for breaking changes described upstream.


  This update fixes firmware compilation with custom includes, version-less library dependencies, and infinite numeric values. It also improves MQTT fan-state retries, ESP32 coprocessor OTA reliability, and compatibility for light effects and climate automations.


  Upgrade checklist: https://esphome.io/blog/2026/10/21/esphome-2026-10/


  Full release notes can be found at https://github.com/esphome/esphome/releases/tag/2026.10.1
