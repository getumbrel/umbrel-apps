releaseNotes: >-
  ESPHome 2026.9.0 is a major monthly update with faster parallel build-tool setup, ESP8266 native-toolchain groundwork and RAM savings, Noise-encrypted OTA updates, six new components, and expanded LVGL, Modbus, Tuya, networking, and sensor support.


  Review the upstream breaking changes before updating if your configs use Modbus Controller `custom_command`, `register_count`, `force_new_range`, or `skip_updates`; ESP32 custom eFuse MACs with Ethernet, Bluetooth, Thread, or Zigbee; custom lambdas or external components; or components with unsupported non-default UART settings such as `mhz19`, `daly_bms`, or `teleinfo`.


  Full release notes can be found at https://github.com/esphome/esphome/releases/tag/2026.9.0
