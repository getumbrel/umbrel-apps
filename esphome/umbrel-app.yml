releaseNotes: >-
  ⚠️ Review the upstream upgrade checklist before rebuilding device firmware. Sub-devices under `esphome: devices:` now need `relation: via` or `relation: child`. ESP32 builds require ESP-IDF 5.1 or newer. HTTP-request scripts may need `mode: queued` or `mode: parallel` to preserve repeated runs. Check power-meter calibration on Beken and Realtek chips, renamed configuration options, custom lambdas, and external components.


  If upgrading from before 2026.10, ESP8266 now defaults to the native Arduino toolchain; `toolchain: platformio` remains a temporary fallback for custom frameworks. Sendspin requires Music Assistant 2.10.7 or newer (or 2.11.0b4 or newer). Review the October upgrade checklist too: https://esphome.io/blog/2026/10/21/esphome-2026-10/


  This update fixes ESP8266 preference saving and rejects incomplete web firmware uploads instead of flashing them. It also improves ESP32 HTTPS request reliability, fixes voice-assistant responses stopped before playback, corrects image and grayscale rendering, and resolves build conflicts when using WireGuard with Sendspin.


  Upgrade checklist: https://esphome.io/blog/2026/11/18/esphome-2026-11/


  Full release notes can be found at https://github.com/esphome/esphome/releases/tag/2026.11.1
