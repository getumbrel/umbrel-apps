releaseNotes: >-
  ESPHome 2026.9.1 fixes OTA encryption-key handling for safe-mode uploads without the API server, masks password text-entity values more consistently in the web server, and includes stability fixes for MIPI displays, LVGL build flags, ESP32/RP2040 crash logging, ESP32-P4 builds, SPI Ethernet, and mixer task handling.


  Review the upstream 2026.9 breaking changes before updating if your configs use Modbus Controller `custom_command`, `register_count`, `force_new_range`, or `skip_updates`; ESP32 custom eFuse MACs with Ethernet, Bluetooth, Thread, or Zigbee; custom lambdas or external components; or components with unsupported non-default UART settings such as `mhz19`, `daly_bms`, or `teleinfo`.


  Full release notes can be found at https://github.com/esphome/esphome/releases/tag/2026.9.1
