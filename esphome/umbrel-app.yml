releaseNotes: >-
  ESPHome 2026.8.0 is a major monthly update with an upstream upgrade checklist. Before updating, review the checklist if your configs use explicit BLE tracker IDs (`esp32_ble_id` -> `ble_hub_id`), `voc`/`nox` sensor keys, Modbus controller/server options, RC522 I²C defaults, custom web server integrations, RP2 on-die temperature ADC, LED strip color-order keys, or interrupt-pin `inverted`/`allow_other_uses` settings.

  This release adds a platform-neutral BLE layer with BLE tracking/proxy support across more chips including Raspberry Pi Pico W, BK72xx, and LN882H; improves build speed and ESP-IDF toolchain size; adds multi-interface Ethernet/Wi-Fi support, the new `modbus_client` component, multi-key OTA signature verification, runtime wake word management, Device Builder startup/upload/config-migration improvements, and fixes ESP32 BLE scan reliability, ESP8266 encrypted API/OTA stalls, crash reporting, and many components.

  Full release notes can be found at https://github.com/esphome/esphome/releases/tag/2026.8.0
