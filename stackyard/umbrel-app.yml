category: files
name: Stackyard
version: "1.21.0"
tagline: A calm dashboard for your home server
description: >-
  Most dashboards are a wall of numbers and charts. Stackyard is the opposite: a calm, launcher-style grid of app tiles, folders and a small number of genuinely useful widgets. Built to be glanced at a hundred times a day without feeling cluttered.


  - **Attention goes where it's needed.** No charts or counters. A health badge appears only when something is wrong.

  - **A glance tells you more than a number would.** Widgets are small visuals: what's playing on Plex or Jellyfin, what's next from Sonarr and Radarr, your downloads, backups, DNS, disks and weather.

  - **Anything can be a badge.** Point a tile at any API and show what it reports, with its own colour and threshold. No code.

  - **Configured by clicking, not by editing files.** Everything is set up in the web interface. Homepage and Dashy configs can be imported.

  - **Installs like an app.** A mobile layout that opens in its own window from your home screen.

  - **Six languages, right-to-left included.**


  On first open, Stackyard offers to set its own dashboard password. It is optional, because your Umbrel login already protects the app. Widgets reach the other apps on your Umbrel over your local network.
