version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: stackyard_web_1
      APP_PORT: 80

  web:
    image: ghcr.io/sandobserver/stackyard:1.21.0@sha256:b8492befd87da365a53be5f9ae262d8769fc08c14e3c5eced1ce42fb114e2221
    restart: on-failure
    init: true
    volumes:
      - ${APP_DATA_DIR}/data/data:/data
      - ${APP_DATA_DIR}/data/icons:/icons
    environment:
      ALLOW_PRIVATE_IPS: "true"
      TRUST_PROXY: "true"
      TRUSTED_PROXY: ${NETWORK_IP}/16
