manifestVersion: 1.1
id: lx-family-planner
category: files
name: LX Family
version: "1.19.0"
tagline: Private Family OS for every generation
description: >-
  LX Family brings calendars, tasks, shopping, meals, family chat,
  files and reminders together on your own server. Adults get a calm planning
  workspace, children get playful missions and rewards, and pet profiles only
  show care and health-related information.

  Data stays on your Umbrel. Every family member receives a role-based profile,
  while parents keep control over task approval, notifications, integrations
  and child-safe media widgets. Optional integrations include Nextcloud,
  Home Assistant, Bring!, Gotify and the native LX Android app.
