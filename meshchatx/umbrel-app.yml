manifestVersion: 1
id: meshchatx
storage:
  dataRoot: data
name: MeshChatX
category: social
version: "4.10.2"
port: 8985
tagline: The future of off-grid communication. Secure, decentralized, and unstoppable
description: >-
  A Reticulum Network-based communication application with the goal of providing everything you need for Reticulum, LXMF, and LXST in one beautiful and feature-rich application. 


  This project is separate from the original Reticulum MeshChat project, and is not affiliated with the original project.


  Features:
    - Full LXST support
    - Custom voicemail
    - Phonebook
    - Contact sharing
    - Ringtone support
    - Multi-identity handling
    - Modern UI/UX
    - Offline documentation
    - Expanded tools
    - Page archiving
    - Integrated maps
    - Improved application security
developer: Quad4
website: https://quad4.io
repo: https://github.com/Quad4-Software/MeshChatX
support: https://github.com/Quad4-Software/MeshChatX/issues
gallery:
  - 1.jpg
  - 2.jpg
  - 3.jpg
  - 4.jpg
  - 5.jpg
releaseNotes: >-
  This update fixes several messaging, Contacts, Maps, NomadNet, and Network Visualiser issues. Failed outbound messages are now saved for retry instead of being dropped, privacy-mode map CSP handling preserves user-configured tile/search endpoints, and page translation/rendering and image-heavy media serving are more reliable.


  It also improves desktop popout crash isolation, telemetry backoff for unreachable peers, contact address sharing, theme switch visibility, and Android Bluetooth RNode interface setup.


  Full release notes can be found at https://github.com/Quad4-Software/MeshChatX/releases/tag/v4.10.2
dependencies: []
permissions: []
path: ""
defaultUsername: ""
defaultPassword: ""
submitter: phelipebf
submission: "https://github.com/getumbrel/umbrel-apps/pull/4623"
