releaseNotes: >-
  This update improves WebSocket disconnect handling, dialog accessibility, collapsed sidebar state, map announce behavior, and map catalog discovery.


  It fixes Relay Chat room-key prompts and loopback commands, map catalog hangs, in-process memory growth, message path waits, file/import sanitization, plugin symlink safety, identity-switch cleanup, message upserts, NomadNet polling, telephone call teardown, and local tile URL handling.


  Full release notes can be found at https://github.com/Quad4-Software/MeshChatX/releases/tag/v4.8.4
