manifestVersion: 1
id: meshchatx
storage:
  dataRoot: data
name: MeshChatX
category: social
version: "4.9.3"
port: 8985
tagline: The future of off-grid communication. Secure, decentralized, and unstoppable
description: >-
  A Reticulum Network-based communication application with the goal of providing everything you need for Reticulum, LXMF, and LXST in one beautiful and feature-rich application. 


  This project is separate from the original Reticulum MeshChat project, and is not affiliated with the original project.


  Features:
    - Full LXST support
    - Custom voicemail
    - Phonebook
    - Contact sharing
    - Ringtone support
    - Multi-identity handling
    - Modern UI/UX
    - Offline documentation
    - Expanded tools
    - Page archiving
    - Integrated maps
    - Improved application security
developer: Quad4
website: https://quad4.io
repo: https://github.com/Quad4-Software/MeshChatX
support: https://github.com/Quad4-Software/MeshChatX/issues
gallery:
  - 1.jpg
  - 2.jpg
  - 3.jpg
  - 4.jpg
  - 5.jpg
releaseNotes: >-
  This update adds Reticulum 1.5.5, a new clustered network visualizer, smoother tutorial controls, and improved NomadNet image rendering.


  It also fixes visualizer layout settling, map dragging, message forwarding and resend edge cases, relay chat delivery state, telephone/voicemail audio handling, and several security protections around plugins, Reticulum config redaction, file sync, and docs archive imports.


  Full release notes can be found at https://github.com/Quad4-Software/MeshChatX/releases/tag/v4.9.3
dependencies: []
permissions: []
path: ""
defaultUsername: ""
defaultPassword: ""
submitter: phelipebf
submission: "https://github.com/getumbrel/umbrel-apps/pull/4623"
