manifestVersion: 1
id: meshchatx
storage:
  dataRoot: data
name: MeshChatX
category: social
version: "4.12.0"
port: 8985
tagline: The future of off-grid communication. Secure, decentralized, and unstoppable
description: >-
  A Reticulum Network-based communication application with the goal of providing everything you need for Reticulum, LXMF, and LXST in one beautiful and feature-rich application. 


  This project is separate from the original Reticulum MeshChat project, and is not affiliated with the original project.


  Features:
    - Full LXST support
    - Custom voicemail
    - Phonebook
    - Contact sharing
    - Ringtone support
    - Multi-identity handling
    - Modern UI/UX
    - Offline documentation
    - Expanded tools
    - Page archiving
    - Integrated maps
    - Improved application security
developer: Quad4
website: https://quad4.io
repo: https://github.com/Quad4-Software/MeshChatX
support: https://github.com/Quad4-Software/MeshChatX/issues
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
  - 4.webp
  - 5.webp
releaseNotes: >-
  This update adds Reticulum 1.6 tuning options, vector basemaps, and offline PMTiles map uploads. It also improves Relay Chat history performance and NomadNet browsing.


  Security fixes strengthen trusted-proxy IP checks, message filtering, attachment handling, and web content sanitization. Messaging reliability and shutdown behavior are also improved.


  Automatic announce and sync intervals now have a 15-minute minimum; existing shorter intervals are clamped. The new signed updater is opt-in and disabled by default. Continue updating this Umbrel app through the App Store.


  Full release notes can be found at https://github.com/Quad4-Software/MeshChatX/releases/tag/v4.12.0
dependencies: []
permissions: []
path: ""
defaultUsername: ""
defaultPassword: ""
submitter: phelipebf
submission: "https://github.com/getumbrel/umbrel-apps/pull/4623"
