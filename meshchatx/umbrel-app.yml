releaseNotes: >-
  This update adds database backup tooling before migrations, a grouped sidebar and tools layout, public demo mode, map publishing/discovery, KML/KMZ sanitization, and Mesh Server executable page support.


  It improves slow-interface path/link waits, community interface presets, map performance, settings search, hardware permission handling, mobile/desktop startup flows, and WebSocket origin/auth checks.


  It also fixes backend reconnect navigation, AppImage/database-backup startup failures, Docker frontend builds, KMZ imports, message/sidebar issues, security sanitizers, WebSocket gating, and NomadNet tab layout on short screens.


  Full release notes can be found at https://github.com/Quad4-Software/MeshChatX/releases/tag/v4.8.3
