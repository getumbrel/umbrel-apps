manifestVersion: 1
id: meshchatx
storage:
  dataRoot: data
name: MeshChatX
category: social
version: "4.12.1"
port: 8985
tagline: The future of off-grid communication. Secure, decentralized, and unstoppable
description: >-
  A Reticulum Network-based communication application with the goal of providing everything you need for Reticulum, LXMF, and LXST in one beautiful and feature-rich application. 


  This project is separate from the original Reticulum MeshChat project, and is not affiliated with the original project.


  Features:
    - Full LXST support
    - Custom voicemail
    - Phonebook
    - Contact sharing
    - Ringtone support
    - Multi-identity handling
    - Modern UI/UX
    - Offline documentation
    - Expanded tools
    - Page archiving
    - Integrated maps
    - Improved application security
developer: Quad4
website: https://quad4.io
repo: https://github.com/Quad4-Software/MeshChatX
support: https://github.com/Quad4-Software/MeshChatX/issues
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
  - 4.webp
  - 5.webp
releaseNotes: >-
  New limited bandwidth mode reduces background mesh traffic on metered connections without changing your saved settings.


  MeshChatX restricts access to profile and Reticulum files to the app's user at startup. This release also improves database restore safety, reduces background disk writes, and fixes messaging, NomadNet browsing, and web security issues.


  Full release notes can be found at https://github.com/Quad4-Software/MeshChatX/releases/tag/v4.12.1
dependencies: []
permissions: []
path: ""
defaultUsername: ""
defaultPassword: ""
submitter: phelipebf
submission: "https://github.com/getumbrel/umbrel-apps/pull/4623"
