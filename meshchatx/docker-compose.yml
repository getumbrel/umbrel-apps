version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: meshchatx_web_1
      APP_PORT: 8000

  web:
    image: ghcr.io/quad4-software/meshchatx:4.8.1@sha256:f0c6d70bcce25bfe67e3b66b978f098f5770daa94def353b632bd4c4814fb8ab
    restart: on-failure
    user: "1000:1000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/status')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    volumes:
      - ${APP_DATA_DIR}/data:/config
    environment:
      MESHCHAT_NO_HTTPS: "true" # disable https
