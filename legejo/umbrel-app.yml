manifestVersion: 1
id: legejo
storage:
  dataRoot: data
category: media
name: Legejo
version: "1.23.1"
tagline: A self-hosted library for your EPUB books
description: >-
  Sign in with the username and password shown in Umbrel. The password is used to create the admin account on the first start; if you change it in Legejo, Umbrel keeps showing the original.


  Legejo is a library for your EPUB books that you run yourself. Upload books and they get their covers and details, from Libris or Open Library if you like, and land on shelves you arrange. Read them in the browser, with highlights, notes and read-aloud, or take them along: a Kobo syncs books, reading positions and highlights with Legejo, reading apps such as KOReader or Thorium connect over OPDS, and KOReader keeps its place in step.


  Several people can share one Legejo. Each has a library of their own and can share shelves with the others, or with someone on another Legejo through a private link. Legejo also keeps PDFs, comics (CBZ) and audiobooks, which you can listen to in the browser or as a podcast feed.


  Optional extras are turned on in the admin settings or with environment variables: searching inside the text of the books, a read-only MCP server for AI assistants, single sign-on, and mail for invitations and password reset.
