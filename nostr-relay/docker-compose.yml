version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: nostr-relay_web_1
      APP_PORT: 3000
      PROXY_AUTH_ADD: "false"

  web:
    image: ghcr.io/getumbrel/umbrel-nostr-relay:v1.2.1@sha256:afc30c2714fdec3f29d1bc0cd16031bf9e9d001da2a4cd4df968700c796812bf
    user: "1000:1000"
    restart: on-failure
    environment:
      RELAY_HOST: "nostr-relay_relay_1"
      RELAY_PORT: "8080"
      RELAY_PROXY_HOST: "nostr-relay_relay-proxy_1"
      RELAY_PROXY_PORT: "80"

  relay:
    image: ghcr.io/getumbrel/nostr-rs-relay:0.10.0-v1.2.1@sha256:cf30a5a753fa20263525cd6021e53875acfe002a81017d3ada7e4afb71969fd5
    user: "1000:1000"
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data/relay/config.toml:/app/config.toml
      - ${APP_DATA_DIR}/data/relay/db:/app/db

  relay-proxy:
    image: ghcr.io/getumbrel/umbrel-nostr-relay-proxy:v1.2.1@sha256:0943a791d136bca937bf54a97a92bf6322de9769b09720febbc88928fbe43d9b
    user: "1000:1000"
    restart: on-failure
    environment:
      RELAY_HOST: "nostr-relay_relay_1"
      RELAY_PORT: "8080"
    volumes:
      - ${APP_DATA_DIR}/data/relay-proxy:/app/data
    depends_on:
      - relay
