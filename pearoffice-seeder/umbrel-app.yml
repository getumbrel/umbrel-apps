manifestVersion: 1
id: pearoffice-seeder
category: networking
name: PearOffice Seeder
version: "0.1.0"
tagline: Keep your shared PearOffice files online 24/7
description: >-
  Run a blind seeder for your PearOffice files on your Umbrel, so the people
  you share a spreadsheet, document or slide deck with stay in sync even when
  every device is off.


  PearOffice is a peer-to-peer office app with no accounts and no servers: a
  file lives only on the devices of the people it is shared with and syncs
  directly between them. That means a file is only reachable while one of
  those devices is online. This app keeps an always-on copy of each file your
  devices back up to it, so everyone catches up whoever is online. With a
  seeder, your recovery phrase also brings your files back on a new device.


  It is a "blind" seeder: it stores and serves only encrypted data and is never
  given a file's key, so your Umbrel keeps your files available without ever
  being able to read them.


  To pair a device: open the seeder, enter the password shown next to the app,
  choose Pair a device, then scan the code in PearOffice under Settings >
  Seeder.
