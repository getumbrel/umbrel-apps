manifestVersion: 1
id: octoprint
storage:
  dataRoot: data
category: files
name: OctoPrint
version: "2.0.2"
tagline: A snappy web interface for your 3D printer
description: >-
  OctoPrint provides a snappy web interface for controlling consumer 3D printers.
  OctoPrint's powerful plugin system allows extending its functionality with awesome plugins from the community.


  Plug your 3D printer into your Umbrel to control and monitor every aspect of your 3D printer and your printing jobs right from within your browser.
developer: OctoPrint
website: https://octoprint.org/
repo: https://github.com/OctoPrint/OctoPrint
support: https://community.octoprint.org/
port: 5003
submitter: mateosilguero
releaseNotes: >-
  ⚠️ This major update removes deprecated plugin APIs. Check that your installed third-party plugins support OctoPrint 2.0 before updating. If you configured authentication through a reverse proxy, review your trusted reverse proxies before updating and trusted authentication proxies afterward.


  Highlights:


    - New printer connectors allow plugins to support additional printer interfaces.
    - Improved file management with printer-side storage and native G-code thumbnails.
    - Better print-time estimates and fixes for paused controls, custom sliders, thumbnails, and serial connections.
    - Security fixes improve setup, uploads, API permissions, and protection of connection and webcam credentials.


  Full release notes can be found at https://github.com/OctoPrint/OctoPrint/releases/tag/2.0.2
submission: https://github.com/getumbrel/umbrel-apps/pull/449
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
