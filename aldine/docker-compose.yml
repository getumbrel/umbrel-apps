version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: aldine_app_1
      APP_PORT: 3000

  app:
    image: ghcr.io/trahloff/aldine-app:1.22.1@sha256:040863196b0c133bdf932ae52962c8b36af8e1b862115a9a3374fc1f1dc05ca8
    init: true
    restart: on-failure
    environment:
      # The container name, not the service name: a bare "compiler" could
      # resolve to another app's service on the shared Umbrel network.
      COMPILER_URL: http://aldine_compiler_1:4020
    volumes:
      - ${APP_DATA_DIR}/data/data:/data
      - ${APP_DATA_DIR}/data/secrets:/secrets
    networks:
      - default
      - compiler

  compiler:
    image: ghcr.io/trahloff/aldine-compiler:1.22.1@sha256:aebdbc400706ea7d1ac2ff48bd7292224b0ba6bca5e8584088c42397e889b256
    init: true
    restart: on-failure
    # The compiler runs untrusted LaTeX. It is only on the internal network
    # below, so it has no route to the internet or to other Umbrel apps, and
    # it never mounts /secrets (accounts, sessions, API keys).
    volumes:
      - ${APP_DATA_DIR}/data/data:/data
    networks:
      - compiler
    mem_limit: 2g
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  compiler:
    internal: true
