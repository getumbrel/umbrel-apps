version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: aldine_app_1
      APP_PORT: 3000

  app:
    image: ghcr.io/trahloff/aldine-app:1.20.0@sha256:508ad08c46794db6e39299ddaa92030d14cee4f026cbdce33c84943883c70c7a
    init: true
    restart: on-failure
    environment:
      # The container name, not the service name: a bare "compiler" could
      # resolve to another app's service on the shared Umbrel network.
      COMPILER_URL: http://aldine_compiler_1:4020
    volumes:
      - ${APP_DATA_DIR}/data/data:/data
      - ${APP_DATA_DIR}/data/secrets:/secrets
    networks:
      - default
      - compiler

  compiler:
    image: ghcr.io/trahloff/aldine-compiler:1.20.0@sha256:b59f931678c3263b214f8a9827ef12df7b47d6fe81b03eb3d4e7c52d4b5243ce
    init: true
    restart: on-failure
    # The compiler runs untrusted LaTeX. It is only on the internal network
    # below, so it has no route to the internet or to other Umbrel apps, and
    # it never mounts /secrets (accounts, sessions, API keys).
    volumes:
      - ${APP_DATA_DIR}/data/data:/data
    networks:
      - compiler
    mem_limit: 2g
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  compiler:
    internal: true
