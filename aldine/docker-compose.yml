version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: aldine_app_1
      APP_PORT: 3000

  app:
    image: ghcr.io/trahloff/aldine-app:1.23.1@sha256:2b87273f157f910418284a02f3f66db96824e9cf9e7d2cbe2b811a436b52bb0a
    init: true
    restart: on-failure
    environment:
      # The container name, not the service name: a bare "compiler" could
      # resolve to another app's service on the shared Umbrel network.
      COMPILER_URL: http://aldine_compiler_1:4020
    volumes:
      - ${APP_DATA_DIR}/data/data:/data
      - ${APP_DATA_DIR}/data/secrets:/secrets
    networks:
      - default
      - compiler

  compiler:
    image: ghcr.io/trahloff/aldine-compiler:1.23.1@sha256:c054630a43624a65e5b96d696298d61d7a1a8cd4f92145263dfe993eb922790f
    init: true
    restart: on-failure
    # The compiler runs untrusted LaTeX. It is only on the internal network
    # below, so it has no route to the internet or to other Umbrel apps, and
    # it never mounts /secrets (accounts, sessions, API keys).
    volumes:
      - ${APP_DATA_DIR}/data/data:/data
    networks:
      - compiler
    mem_limit: 2g
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  compiler:
    internal: true
