category: developer
name: Aldine
version: "1.3.1"
tagline: Collaborative LaTeX editor you host yourself
description: >-
  Aldine is an open-source LaTeX editor for writing papers, theses and reports together, an alternative to Overleaf that runs on your own hardware.


  Several people can edit the same document at once, with live cursors. Every project is a git repository with branches, history and merges, and can sync with GitHub, GitLab, Gitea and Forgejo. You can import an Overleaf project from its ZIP download, pull references from Zotero, a DOI or an arXiv id, leave comments and suggested changes, and switch to a visual editing mode.


  Documents are typeset by a separate compiler container with TeX Live. It runs on a network with no internet access, with all Linux capabilities dropped and bounded memory and processes. The compiler image is large: about 2.4 GB to download and 5 GB on disk, so the first install takes a while.


  Aldine has no login of its own by default; your Umbrel login protects it. Projects are plain files and git repositories in the app's data folder, and there is no database to look after.
