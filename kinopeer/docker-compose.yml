version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: kinopeer_web_1
      APP_PORT: 8080

  web:
    image: ghcr.io/kinopeer/kinopeer:1.1.0@sha256:e6e5619c0f40b65b12697d8f4368cc394644d805e970f686287b33151d6203aa
    restart: on-failure
    user: "1000:1000"
    environment:
      # Umbrel's app_proxy asks for Umbrel's login in front of Kinopeer, so Kinopeer's own login is off.
      KINOPEER_AUTH: "off"
      # Umbrel serves Kinopeer at umbrel.local, its IP, Tor and names of the owner's own (Tailscale, a
      # reverse proxy); app_proxy's login already keeps a rebound page out, so every host is let in.
      KINOPEER_ALLOWED_HOSTS: "*"
      # Umbrel's qBittorrent app. admin/adminadmin is its default login: if it was
      # changed, Kinopeer asks for the login once and keeps it in /data.
      QBITTORRENT_URL: http://qbittorrent_server_1:8080
      QBITTORRENT_USERNAME: admin
      QBITTORRENT_PASSWORD: adminadmin
      # Umbrel's Prowlarr app. Its API key is read from its config.xml (mounted read-only below).
      # Without it, the key can be entered in Kinopeer's Settings → Connections.
      PROWLARR_URL: http://prowlarr_server_1:9696
      PROWLARR_CONFIG_XML: /prowlarr/config.xml
    volumes:
      # Settings saved from the app (a TMDB key of your own, the qBittorrent login,
      # download defaults) and which movie or series each torrent is.
      - ${APP_DATA_DIR}/data:/data
      # The folder, not the file: a file mount would keep the old file after Prowlarr rewrites it.
      - ${UMBREL_ROOT}/app-data/prowlarr/data/config:/prowlarr:ro
