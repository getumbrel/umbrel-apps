manifestVersion: 1
id: kinopeer
storage:
  dataRoot: data
category: media
name: Kinopeer
version: "1.0.0"
tagline: Find movies and series, pick a release, download it with qBittorrent
description: >-
  Kinopeer is a qBittorrent web UI built around movies and TV series. Find a
  title, pick a release found by Prowlarr and send it to qBittorrent, then
  follow the download, on your phone, where it installs as an app, or on a
  computer.


  Add your indexers in Prowlarr: Kinopeer finds them on its own, and connects
  to qBittorrent with Umbrel's default login (if you changed it, Kinopeer asks
  once).


  - **From a title to a release.** Resolution, source, HDR, voice-over and
  seasons are read from each release's name, and filters narrow the list down.


  - **Download only what you need.** Pick single files or seasons, and see
  beforehand whether they fit in the free space.


  - **Downloads as a film collection.** Each torrent shows its movie or series
  with a poster and a title instead of the release name.


  - **Managing torrents.** Pause and delete, several at once too, file
  priorities, speed limits, moving files and categories, without opening
  qBittorrent's own web UI.


  Kinopeer comes with no content and no indexers, and doesn't play video.
