releaseNotes: >-
  This update fixes issues with OIDC visibility, all-user subscription filtering, 2FA QR codes for non-ASCII usernames, currency conversion in iCal feeds, database-restore migrations, setup token logging, and logo upload failures.

  It also improves exchange-rate refreshes and subscription page query performance.

