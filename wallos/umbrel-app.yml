manifestVersion: 1
id: wallos
storage:
  dataRoot: data
name: Wallos
tagline: Track your recurring subscriptions and expenses
category: finance
version: "5.10.4"
port: 8282
description: >-
  Wallos is a self-hosted personal subscription tracker for managing recurring expenses, upcoming payments, categories, payment methods, and household budgets.


  It helps you keep subscription costs visible, organize payments across multiple currencies, and review your spending from dashboards, statistics, and calendar views while keeping your financial data on your Umbrel.
developer: Wallos
website: https://wallosapp.com
repo: https://github.com/ellite/Wallos
support: https://github.com/ellite/Wallos/issues
submitter: Umbrel
submission: https://github.com/getumbrel/umbrel-apps/pull/5690
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
  - 4.webp
releaseNotes: >-
  This update fixes security vulnerabilities in subscription lists and statistics that could allow saved names to run scripts in your browser. It also fixes saving profile details and prevents unwanted Touch to Search popups in Chrome on Android.


  Full release notes are available at https://github.com/ellite/Wallos/releases/tag/v5.10.4
dependencies: []
path: ""
