manifestVersion: 1
id: wallos
storage:
  dataRoot: data
name: Wallos
tagline: Track your recurring subscriptions and expenses
category: finance
version: "5.11.1"
port: 8282
description: >-
  Wallos is a self-hosted personal subscription tracker for managing recurring expenses, upcoming payments, categories, payment methods, and household budgets.


  It helps you keep subscription costs visible, organize payments across multiple currencies, and review your spending from dashboards, statistics, and calendar views while keeping your financial data on your Umbrel.
developer: Wallos
website: https://wallosapp.com
repo: https://github.com/ellite/Wallos
support: https://github.com/ellite/Wallos/issues
submitter: Umbrel
submission: https://github.com/getumbrel/umbrel-apps/pull/5690
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
  - 4.webp
releaseNotes: >-
  This update adds colored folders for organizing subscriptions, buttons to mark payments as paid or unpaid, and statistics and calendar views that can follow your pay period.


  It also adds a second exchange-rate provider and shared notification-service settings for your household, improves payment totals and notification reliability, and fixes folder-name escaping and cached app assets.


  Full release notes are available at https://github.com/ellite/Wallos/releases/tag/v5.11.1
dependencies: []
path: ""
