manifestVersion: 1
id: litecoin-space
category: bitcoin
name: "Litecoin Space"
version: "3.3.1"
tagline: "Explore your own Litecoin node"

description: >-
  Litecoin Space is a self-hosted Litecoin block explorer and mempool visualizer.
  Transparent-chain queries use your Litecoin Core node and Electrs (LTC) server,
  keeping ordinary explorer traffic on your Umbrel.


  The MWEB explorer uses Litecoin Space's public MWEB API because the fork's dedicated
  MWEB indexer is not currently distributed. This product includes GeoLite2 data created
  by MaxMind, available from https://www.maxmind.com.

releaseNotes: ""

developer: "Litecoin Foundation and Rylea Stark"
website: https://litecoinspace.org
dependencies:
  - litecoin-core
  - litecoin-electrs
repo: https://github.com/RyleaStark/umbrel-litecoin-ltcspace
support: https://github.com/RyleaStark/umbrel-litecoin-ltcspace/issues

port: 3012
gallery: []
path: ""

defaultUsername: ""
defaultPassword: ""

submitter: "Rylea Stark"
submission: https://github.com/getumbrel/umbrel-apps/pull/6013
