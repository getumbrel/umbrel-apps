category: files
name: ONLYOFFICE Docs
version: "10.0.0"
tagline: Online office for Nextcloud
description: >-
  An online office suite for Nextcloud that enables you to create, edit and collaborate on text documents, spreadsheets and presentations in real time.


  Simply install ONLYOFFICE Docs and follow the in-app instructions to connect it to Nextcloud running on your Umbrel.
releaseNotes: >-
  This major update adds new document, spreadsheet, presentation, PDF, and form editor features, including chart data tables, SVG-to-shape conversion, spreadsheet XLS saving, new presentation print/view/export options, PDF redaction and form improvements, and OFD conversion support.


  It also includes many security fixes across document conversion, WOPI, PDF handling, macros, Docker image dependencies, and editor APIs.


  ⚠️ If you have not already done this from the previous ONLYOFFICE Docs update, sign in to Nextcloud as an administrator and set Administration settings → ONLYOFFICE → Advanced server settings → "ONLYOFFICE Docs address for internal requests from the server" to http://onlyoffice-nextcloud-documentserver, then click Save.


  Full release notes can be found at https://github.com/ONLYOFFICE/DocumentServer/blob/master/CHANGELOG.md#1000
