path: ""
deterministicPassword: true
releaseNotes: >-
  ⚠️ Boltz swaps are no longer available in RTL. Upstream removed the integration after the Boltz service was suspended. This update removes the bundled Boltz client but preserves its existing data.


  This security release includes:

  - Session and security cookies are now limited to RTL's own path, reducing their exposure to other apps on a shared origin

  - Updated container certificate trust protections following a certificate authority compromise

  - A fix for a vulnerability in handling compressed requests before authentication


  Block explorer URLs are now managed through configuration rather than the settings UI. Previously saved URLs are preserved.


  Full release notes: https://github.com/Ride-The-Lightning/RTL/releases/tag/v0.15.16

