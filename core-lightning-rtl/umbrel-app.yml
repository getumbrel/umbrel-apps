path: ""
deterministicPassword: true
releaseNotes: >-
  ⚠️ Boltz swaps are no longer available in RTL. Upstream removed the integration after the Boltz service was suspended. This update removes the bundled Boltz client but preserves its existing data.


  This release also includes:

  - Stricter validation for BOLT 12 offer payments

  - More efficient loading of Core Lightning payment history

  - Fixes for first-login failures and node selection


  Full release notes: https://github.com/Ride-The-Lightning/RTL/releases/tag/v0.15.13

