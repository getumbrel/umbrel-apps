releaseNotes: >-
  ⚠️ Boltz swaps are no longer available in RTL. Upstream removed the integration after the Boltz service was suspended. This update removes the bundled Boltz client but preserves its existing data.


  This release also includes:

  - Clearer channel-closing details, including timelock countdowns and closing transaction history

  - Fixes for node selection and expired sessions

  - On-chain payment confirmations that show the amount in sats and the exchange rate used

  - Safer logout, CSV exports, and external links


  Block explorer URLs are now managed through configuration rather than the settings UI. Previously saved URLs are preserved.


  Full release notes: https://github.com/Ride-The-Lightning/RTL/releases/tag/v0.15.14

