name: T3 Code
version: "0.1.7"
tagline: The open-source control plane for coding agents.
description: >-
  T3 Code is an "agent harness control surface". It enables control of the agents
  on your machine with a best-in-class mobile app (iOS, Android), web app and
  Electron-based desktop app.

  Works with your subscriptions on Claude Code, Codex, Cursor, Grok Build,
  OpenCode, Google Antigravity, and fx. If they're set up on your computer, T3
  Code can control them.

