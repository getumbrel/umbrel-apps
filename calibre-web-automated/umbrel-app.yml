manifestVersion: 1
id: calibre-web-automated
storage:
  dataRoot: data
folderAccess:
  - id: calibre-library
    name: Calibre library
    note: CWA reads and updates books in this library folder.
    mounts:
      - service: server
        targetPath: /calibre-library
  - id: book-ingest
    name: Book ingest folder
    note: Books placed here are processed and removed from this folder. Do not use it as a download destination.
    mounts:
      - service: server
        targetPath: /cwa-book-ingest
name: Calibre-Web Automated
tagline: An automated, all-in-one e-book library
category: files
version: v4.0.8
port: 8186
description: >-
  Calibre-Web Automated combines Calibre-Web with automated e-book ingest,
  conversion, metadata management, and library tools.


  Sign in with the upstream default credentials `admin` / `admin123` and
  change the password after your first login.


  The library is available inside the app at `/calibre-library`. Add books
  to `/cwa-book-ingest` for processing. CWA removes files from the ingest
  folder after processing, so do not download directly into that folder.
releaseNotes: ""
developer: Crocodile Sticks
website: https://github.com/crocodilestick/Calibre-Web-Automated
dependencies: []
repo: https://github.com/crocodilestick/Calibre-Web-Automated
support: https://github.com/crocodilestick/Calibre-Web-Automated/issues
gallery: []
path: ""
defaultUsername: admin
defaultPassword: admin123
submitter: telskamp
submission: https://github.com/getumbrel/umbrel-apps/pull/6189
