version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: calibre-web-automated_server_1
      APP_PORT: 8083

  server:
    image: crocodilestick/calibre-web-automated:v4.0.8@sha256:5e00373854247750cc3e4479b492ae09293ff5e06ed10177f226634d97888679
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ}
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${APP_DATA_DIR}/data/book-ingest:/cwa-book-ingest
      - ${APP_DATA_DIR}/data/calibre-library:/calibre-library
