version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: karakeep_web_1
      APP_PORT: 3000

  web:
    image: ghcr.io/karakeep-app/karakeep:0.34.1@sha256:placeholder
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      MEILI_ADDR: http://karakeep_meilisearch_1:7700
      BROWSER_WEB_URL: http://karakeep_chrome_1:9222
      DATA_DIR: /data
      NEXTAUTH_SECRET: ${APP_SEED}
      NEXTAUTH_URL: http://${DEVICE_DOMAIN_NAME}:${APP_PROXY_PORT}
    depends_on:
      - meilisearch
      - chrome

  chrome:
    image: ghcr.io/karakeep-app/karakeep-chrome:0.34.1@sha256:placeholder
    restart: on-failure
    init: true
    command:
      - --disable-gpu
      - --disable-dev-shm-usage
      - --hide-scrollbars
      - --disable-blink-features=AutomationControlled
      - --window-size=1440,900

  meilisearch:
    image: getmeili/meilisearch:v1.41.0@sha256:placeholder
    restart: on-failure
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${APP_SEED}
    volumes:
      - ${APP_DATA_DIR}/data/meilisearch:/meili_data
