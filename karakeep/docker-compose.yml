version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: karakeep_web_1
      APP_PORT: 3000

  web:
    image: ghcr.io/karakeep-app/karakeep:0.34.1@sha256:8e8a2f07265fca1f04dfabd29e70a57cd4491449de20b9c9c7de360b4c4d08cd
    restart: on-failure
    volumes:
      - /data:/data
    environment:
      MEILI_ADDR: http://karakeep_meilisearch_1:7700
      BROWSER_WEB_URL: http://karakeep_chrome_1:9222
      DATA_DIR: /data
      NEXTAUTH_SECRET: 
      NEXTAUTH_URL: http://:
      MEILI_MASTER_KEY: 
    depends_on:
      - meilisearch
      - chrome

  chrome:
    image: ghcr.io/karakeep-app/karakeep-chrome:156.0.8078.47-r1@sha256:4ad61127638dd27bfe685222787c5780dd1d083d23a7658c39af657775814c44
    restart: on-failure
    init: true
    command:
      - --disable-gpu
      - --disable-dev-shm-usage
      - --hide-scrollbars
      - --disable-blink-features=AutomationControlled
      - --window-size=1440,900

  meilisearch:
    image: getmeili/meilisearch:v1.41.0@sha256:7f95cdd482dab97abe881d7639320672a5f89e3affaf6c8038c0a008f9fe6cdc
    restart: on-failure
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: 
    volumes:
      - /data/meilisearch:/meili_data