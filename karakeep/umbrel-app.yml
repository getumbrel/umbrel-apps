manifestVersion: 1
id: karakeep
storage:
  dataRoot: data
category: files
name: Karakeep
version: "0.34.1"
tagline: Self-hostable bookmark-everything app with AI
description: >-
  Karakeep (previously Hoarder) is a self-hostable bookmark-everything app with a touch of AI for the data hoarders out there. It helps you collect, organize, and find anything you want to save.


  **Features:**


  - Bookmark links, take simple notes and store images and pdfs

  - Automatic fetching for link titles, descriptions and images

  - Sort your bookmarks into lists and collaborate on them

  - Full text & semantic search of all the content stored

  - LLM-based automatic tagging and summarization

  - OCR for extracting text from images

  - Full page archival to protect against link rot

  - Auto video archiving with yt-dlp

  - REST API and multiple clients including iOS, Android, and browser extensions

  - Multi-language support

  - Dark mode support

  - Self-hosting first
releaseNotes: >-
  This release includes security updates. See the full release notes at https://github.com/karakeep-app/karakeep/releases/tag/v0.34.1
