  - 5.webp
releaseNotes: >-
  Fixes running exported workflows whose component code is stored as lines of text.


  Fixes public MCP workflows so callers can provide their own credentials when running a flow.


  Full release notes can be found at https://github.com/langflow-ai/langflow/releases/tag/v1.12.8
