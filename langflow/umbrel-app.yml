releaseNotes: >-
  Fixes component loading and upgrade behavior, including preserving flow edges after 1.12 upgrades and preventing duplicate or missing custom components.

  Improves model-provider behavior for Watsonx behind LiteLLM, Memory embeddings, provider refreshes, MCP server startup timing, and environment-variable sync for existing users.

  Fixes Knowledge Base name reuse after deletion, failed CLI serve cleanup, and a logging issue when LANGFLOW_LOG_FILE is set.
