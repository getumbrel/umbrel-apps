  - 5.webp
releaseNotes: >-
  Fixes MCP server/session cleanup, timeout retries, discovery concurrency, global-variable headers, credential redaction, and configured tool-argument handling.


  Tightens security for authenticated execution, administrator-only built-in code execution, and stored chat attachment access.


  Fixes vulnerable dependencies, memory ingestion cancellation status, DataFrame/table handling, duplicate tool names, and playground chat session handling.


  Full release notes can be found at https://github.com/langflow-ai/langflow/releases/tag/v1.12.5
