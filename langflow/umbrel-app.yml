releaseNotes: >-
  Adds the foundations for role-based authorization, SSO identity flows, provider policies, and expanded telemetry.

  Improves Knowledge Base and Memory Base vector database support, deployment workflows, and accessibility across the interface.

  Includes security hardening for MCP, public sharing, model-provider SSRF protections, generated code, file/storage handling, and secret export redaction.
