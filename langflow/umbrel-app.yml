releaseNotes: >-
  Fixes file-write AWS fallback handling, flow updates on SQLite locks, model selection, Azure AI Foundry model discovery, MCP and upgrade checks, payload bounds, and missing PWA icon assets.

  Improves security hardening for markdown sanitization, SQL connection targets, file inputs, Git extraction, URL parsing, OpenAI model discovery, proxy headers, S3 cleanup, and MCP redirect checks.
