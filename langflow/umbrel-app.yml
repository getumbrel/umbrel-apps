releaseNotes: >-
  ⚠️ Before updating, back up Langflow's database and knowledge base data. Local Chroma knowledge and memory bases are automatically copied to SQLite on first startup; allow roughly four times each store's size in free disk space and wait for the bases to show Ready before using them.


  Flows using Chroma or Local DB components need those components replaced with a knowledge base or supported remote vector store. Chroma Cloud requires manual migration, and retired ALTK components need replacing with Agent. See https://docs.langflow.org/knowledge-storage-upgrade for guidance.


  External MCP and A2A clients may now require the project or flow owner's API key. Copy the updated configuration from the project's MCP Server tab, and configure webhook senders to include the flow owner's API key. Custom-code authoring now requires an administrator by default.


  This update strengthens flow access, credential handling, and session security. It also preserves document identities during knowledge base ingestion, fixes list-input ordering and numeric values in Parser output, and prevents duplicate flows from repeated clicks.


  Full release notes can be found at https://github.com/langflow-ai/langflow/releases/tag/v1.13.2
