manifestVersion: 1
id: caravan
name: Caravan
tagline: A stateless coordinator for secure Bitcoin multisig wallets
category: bitcoin
version: "1.19.2"
port: 8376
description: >-
  🏜️ Caravan is a stateless Bitcoin multisig coordinator for creating wallets, generating receive addresses, reviewing balances, constructing transactions, and coordinating signatures without handing custody of private keys to the application.
  
  
  It supports common multisig workflows based on output descriptors and partially signed Bitcoin transactions, allowing participants to exchange wallet configurations, public keys, and signatures between separate devices or locations.
  
  
  Caravan can work with supported hardware wallets and with manually imported or exported key and signature data. Blockchain information can be obtained from public providers such as mempool.space and Blockstream, or from a separately configured Bitcoin Core endpoint.
  
  
  Wallet configuration files and recovery information must be backed up independently. Caravan is intentionally stateless and does not store the information required to reconstruct a multisig wallet on the Umbrel device.
developer: Caravan Bitcoin
