version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: libre-webui_app_1
      APP_PORT: 3001

  app:
    image: librewebui/libre-webui:0.31.0@sha256:1e09f8496a5521cbfd6c743b64e4a2dc1257a3db2df6d2b9af8b51a7c0bba7cf
    restart: on-failure
    environment:
      NODE_ENV: production
      DOCKER_ENV: "true"
      PORT: 3001
      DATA_DIR: /app/backend/data
      PLATFORM_PREFLIGHT_TMP_DIR: /app/backend/temp/preflight
      JWT_SECRET: ${APP_LIBRE_WEBUI_JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      ENABLE_SIGNUP: "false"
      CORS_ORIGIN: "*"
      # Default UmbrelOS address of the official Ollama app. Works out of the
      # box if Ollama is installed; otherwise connection attempts fail
      # gracefully and Libre WebUI still runs with cloud model providers.
      OLLAMA_BASE_URL: http://ollama_ollama_1:11434
    volumes:
      - ${APP_DATA_DIR}/data:/app/backend/data
      - ${APP_DATA_DIR}/temp:/app/backend/temp
