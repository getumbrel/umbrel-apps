manifestVersion: 1
id: libre-webui
category: ai
name: Libre WebUI
version: "0.30.0"
tagline: Private, self-hosted AI chat with local and cloud models
description: >-
  Libre WebUI is a privacy-first, self-hosted AI platform for chatting with
  language models, running agents, building automations, and organizing a
  personal knowledge base. Everything is stored in the app's own local
  database on your Umbrel; no account, API key, or telemetry is required
  just to use it.


  Connect it to a local Ollama instance for fully private, offline model
  inference, or add your own API keys for cloud model providers. Both can be
  configured at the same time, and switching between them does not require
  restarting the app.


  **Getting Started:**

  On first launch, create an account in the Libre WebUI web UI. The first
  account created becomes the administrator, and new sign-ups are disabled
  by default.


  **Using local models:**

  Install the Ollama app from the Umbrel App Store before or after
  installing Libre WebUI. This package points Libre WebUI at Ollama's
  default UmbrelOS address automatically, so no extra setup is needed once
  Ollama is installed. Without Ollama installed, Libre WebUI still works
  fully with cloud model providers configured inside the app.


  **Note:** This packaging runs Libre WebUI without its optional "Work"
  sandboxed task-container feature, which needs direct access to the host's
  container runtime and is not enabled for App Store installs. Chat,
  agents, automations, and knowledge features are unaffected.
