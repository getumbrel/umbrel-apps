services:
  app_proxy:
    environment:
      APP_HOST: appwrite_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  # Functions and Sites require a nested daemon. It has no host Docker socket
  # or host networking; published nested ports stay inside this container.
  docker:
    image: docker:27.2.0-dind@sha256:f9f72ad901a78f27be922b2d320bbc263174f12919c1b37e6a01f828fa904565
    <<: *logging
    privileged: true
    stop_grace_period: 1m
    restart: on-failure
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        rm -f /data/docker.pid /data/run/docker.sock
        exec dockerd-entrypoint.sh dockerd \
          --data-root /data/data \
          --exec-root /data/exec \
          --host unix:///data/run/docker.sock \
          --pidfile /data/docker.pid \
          --bip 10.33.0.1/24 \
          --default-address-pool base=10.34.0.0/16,size=24
    volumes:
      - ${APP_DATA_DIR}/data/docker:/data
      - ${APP_DATA_DIR}/data/builds:/storage/builds:rw
      - ${APP_DATA_DIR}/data/functions:/storage/functions:rw
      - ${APP_DATA_DIR}/data/sites:/storage/sites:rw
      - ${APP_DATA_DIR}/data/tmp:/tmp:rw
    healthcheck:
      test: ["CMD", "docker", "--host", "unix:///data/run/docker.sock", "info"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  web:
    image: nginx:1.31.2-alpine@sha256:54f2a904c251d5a34adf545a72d32515a15e08418dae0266e23be2e18c66fefa
    <<: *logging
    restart: on-failure
    depends_on:
      - appwrite
      - console
      - realtime
    command:
      - /bin/sh
      - -c
      - |
        cat > /etc/nginx/conf.d/default.conf <<'EOF'
        map $$http_upgrade $$connection_upgrade {
          default upgrade;
          '' close;
        }

        server {
          listen 80;
          server_name _;
          client_max_body_size 0;
          proxy_read_timeout 3600s;
          proxy_send_timeout 3600s;
          proxy_buffering off;

          location /v1/realtime {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $$http_upgrade;
            proxy_set_header Connection $$connection_upgrade;
            proxy_set_header Host $$http_host;
            proxy_set_header X-Real-IP $$remote_addr;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
            proxy_pass http://appwrite_realtime_1;
          }

          location /console {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $$http_upgrade;
            proxy_set_header Connection $$connection_upgrade;
            proxy_set_header Host $$http_host;
            proxy_set_header X-Real-IP $$remote_addr;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
            proxy_pass http://appwrite_console_1;
          }

          location / {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $$http_upgrade;
            proxy_set_header Connection $$connection_upgrade;
            proxy_set_header Host $$http_host;
            proxy_set_header X-Real-IP $$remote_addr;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
            proxy_pass http://appwrite_appwrite_1;
          }
        }
        EOF
        nginx -g 'daemon off;'

  appwrite:
    image: appwrite/appwrite:1.9.5@sha256:6ff3a9b006981911ba0190b364d4945f10c106d16f5916df5634c206462d2684
    <<: *logging
    restart: on-failure
    depends_on:
      openruntimes-executor:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      postgresql:
        condition: service_healthy
    volumes:
      - ${APP_DATA_DIR}/data/uploads:/storage/uploads:rw
      - ${APP_DATA_DIR}/data/imports:/storage/imports:rw
      - ${APP_DATA_DIR}/data/cache:/storage/cache:rw
      - ${APP_DATA_DIR}/data/config:/storage/config:rw
      - ${APP_DATA_DIR}/data/certificates:/storage/certificates:rw
      - ${APP_DATA_DIR}/data/functions:/storage/functions:rw
      - ${APP_DATA_DIR}/data/sites:/storage/sites:rw
      - ${APP_DATA_DIR}/data/builds:/storage/builds:rw
    environment: *appwrite-env

  console:
    image: appwrite/console:8.7.5@sha256:71892d67498225ef2926b4333eb1c711074c25bdc4cebfff9b9ea346b35aa09b
    <<: *logging
    restart: on-failure

  realtime:
    image: appwrite/appwrite:1.9.5@sha256:6ff3a9b006981911ba0190b364d4945f10c106d16f5916df5634c206462d2684
    entrypoint: realtime
