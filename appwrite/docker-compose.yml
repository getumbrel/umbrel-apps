    environment:
      DOCKER_HOST: "unix:///var/run/docker.sock"
      EXECUTOR_IMAGE: "openruntimes/executor:0.25.1@sha256:f638aacd3627b39b5c398480a0f72f8cefa1f1b0591cf4d7eabee924f492ce6a"
      OPR_EXECUTOR_ENV: "production"
      OPR_EXECUTOR_SECRET: "${APP_APPWRITE_EXECUTOR_SECRET}"
      OPR_EXECUTOR_NETWORK: "appwrite-runtimes"
      OPR_EXECUTOR_INACTIVE_THRESHOLD: "60"
      OPR_EXECUTOR_MAINTENANCE_INTERVAL: "3600"
      OPR_EXECUTOR_STORAGE_DEVICE: "local"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        docker image inspect "$$EXECUTOR_IMAGE" >/dev/null 2>&1 || docker pull "$$EXECUTOR_IMAGE"
        if docker container inspect appwrite-executor >/dev/null 2>&1; then
          docker stop --time 30 appwrite-executor
          docker rm -f appwrite-executor >/dev/null 2>&1 || true
        fi
        exec docker run --rm --pull=never \
          --name appwrite-executor --hostname appwrite-executor \
          --stop-signal SIGINT \
          --log-driver json-file --log-opt max-file=5 --log-opt max-size=10m \
          --publish 3000:80 \
          --volume /data/run/docker.sock:/var/run/docker.sock \
          --volume /storage/builds:/storage/builds \
          --volume /storage/functions:/storage/functions \
          --volume /storage/sites:/storage/sites \
          --volume /tmp:/tmp \
          --env OPR_EXECUTOR_ENV --env OPR_EXECUTOR_SECRET \
          --env OPR_EXECUTOR_NETWORK --env OPR_EXECUTOR_INACTIVE_THRESHOLD \
          --env OPR_EXECUTOR_MAINTENANCE_INTERVAL --env OPR_EXECUTOR_STORAGE_DEVICE \
          --health-cmd='curl -fsS -H "Authorization: Bearer $$OPR_EXECUTOR_SECRET" http://127.0.0.1/v1/health >/dev/null' \
          --health-interval=10s --health-timeout=5s --health-retries=12 \
          --health-start-period=30s \
          "$$EXECUTOR_IMAGE"
    healthcheck:
      test:
        - CMD-SHELL
        - 'test "$$(docker inspect --format "{{.State.Running}} {{.State.Health.Status}}" appwrite-executor 2>/dev/null)" = "true healthy"'
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 30s

  mongodb:
    image: mongo:8.2.5@sha256:60aa240412f473f672ec8b282fd5651aa156dcc7a220f81f5381ce768ccc3167
    <<: *logging
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data/mongodb:/data/db
      - ${APP_DATA_DIR}/data/mongodb-keyfile:/data/keyfile
    environment:
      MONGO_INITDB_ROOT_USERNAME: "root"
      MONGO_INITDB_ROOT_PASSWORD: "${APP_APPWRITE_MONGODB_ROOT_PASSWORD}"
      MONGO_INITDB_DATABASE: "appwrite"
      MONGO_INITDB_USERNAME: "appwrite"
      MONGO_INITDB_PASSWORD: "${APP_APPWRITE_MONGODB_PASSWORD}"
    entrypoint:
      - /bin/bash
      - -ec
      - |
        KEYFILE_PATH="/data/keyfile/mongo-keyfile"
        if [ ! -s "$$KEYFILE_PATH" ]; then
          umask 077
          openssl rand -base64 756 > "$$KEYFILE_PATH"
        fi
        chmod 400 "$$KEYFILE_PATH"
        chown mongodb:mongodb "$$KEYFILE_PATH"
        cat > /docker-entrypoint-initdb.d/10-appwrite.js <<'JS'
        db.getSiblingDB('admin').createUser({
          user: process.env.MONGO_INITDB_USERNAME,
          pwd: process.env.MONGO_INITDB_PASSWORD,
          roles: [{role: 'readWrite', db: process.env.MONGO_INITDB_DATABASE}]
        });
        JS
        # The official entrypoint creates users on a loopback-only temporary
        # server, fixes data ownership and drops privileges before serving.
        exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all \
          --auth --keyFile "$$KEYFILE_PATH"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet -u "$${MONGO_INITDB_ROOT_USERNAME}"
          -p "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase admin
          --eval 'try { const hello = db.hello();
          if (hello.setName === "rs0" && hello.isWritablePrimary) quit(0);
          rs.status(); } catch (e) { if (e.code === 94)
          rs.initiate({_id: "rs0", members: [{_id: 0, host: "appwrite_mongodb_1:27017"}]}); }
          quit(1);'
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s

  postgresql:
    image: appwrite/postgres:0.1.0@sha256:77156232a16d80f5830d914edb44f52a0853058939f2365cc3301d08db9d05e9
    <<: *logging
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data/postgresql:/var/lib/postgresql
    environment:
      POSTGRES_DB: "appwrite"
      POSTGRES_USER: "appwrite"
      POSTGRES_PASSWORD: "${APP_APPWRITE_POSTGRES_PASSWORD}"
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  appwrite-embedding:
    image: appwrite/embedding:0.1.0@sha256:0ba6942b5a7d560523ae1ef8673e41da47468fa85f5d3992badaa5abe9714b54
    <<: *logging
    restart: on-failure
    user: "1000:1000"
    environment:
      EMBEDDING_MODELS: "nomic-embed-text"
      EMBEDDING_CACHE_DIR: "/home/embedder/models"
    volumes:
      - ${APP_DATA_DIR}/data/models:/home/embedder/models

  redis:
    image: redis:7.4.7-alpine@sha256:02f2cc4882f8bf87c79a220ac958f58c700bdec0dfb9b9ea61b62fb0e8f1bfcf
    <<: *logging
    restart: on-failure
    environment:
      REDISCLI_AUTH: "${APP_APPWRITE_REDIS_PASSWORD}"
    command: >
      redis-server
      --requirepass ${APP_APPWRITE_REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --maxmemory-samples 5
    volumes:
      - ${APP_DATA_DIR}/data/redis:/data:rw
    healthcheck:
      test: ["CMD-SHELL", 'test "$$(redis-cli ping)" = PONG']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
