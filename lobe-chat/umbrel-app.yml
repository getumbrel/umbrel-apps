releaseNotes: >-
  Open Lobe Hub over HTTP. If it opens with https://, change that to http:// in the address bar. HTTPS access is not supported by this Umbrel package yet.


  Back up your Lobe Hub data before updating. This update runs automatic database migrations on startup. Leave Lobe Hub running until they finish. Upstream has not verified downgrading after these migrations.


  This update adds dashboards and widgets, faster local-first loading, and new ways to organize your agent workspace.


  - Added batch Goal workflows with review checkpoints

  - Added agent document folders, sorting, and batch moves

  - Added conversation forks from assistant replies

  - Improved task management, project organization, and settings search

  - Added remote terminals and access to models on connected devices


  Full release notes are available at https://github.com/lobehub/lobehub/releases/tag/v2.2.20
