releaseNotes: >-
  This update runs an automatic Lobe Hub database migration on startup. Leave Lobe Hub running until it finishes.


  This weekly patch expands agent, workspace, provider, and artifact workflows.
  Key changes:
    - Added more provider-backed heterogeneous Agent options, including Claude Code and Codex deployment-backed models plus Kimi Code and Pi provider paths
    - Improved Goals, Tasks, Acceptance, and long-running Agent recovery/intervention flows
    - Added public Artifact, Workbench, and Workspace collaboration improvements, including per-member Resource grants and transfer requests
    - Improved Home, global font settings, model availability, settings search, desktop, and workspace UI behavior
    - Tightened security and reliability around scoped Resource checks, operation authorization, context compression, provider retries, and tool-approval settings


  Full release notes are available at https://github.com/lobehub/lobehub/releases/tag/v2.2.15
