releaseNotes: >-
  ⚠️ This update runs an automatic Lobe Hub database migration on startup. Back up your Umbrel before updating and leave Lobe Hub running until it finishes.


  This weekly patch improves Agent review workflows, model access, chat generation tools, and desktop reliability.
  Key changes:
    - Added structured acceptance review with checks, metrics, and accept/reject actions
    - Added a built-in chat image-generation tool and broader model support
    - Added ChatGPT subscription authentication, Claude Opus 5, and newer Gemini Flash models
    - Improved Agent work visibility with durable Works, file summaries, and completion notifications
    - Improved desktop file preview/source mode, provider error handling, sync reliability, and security hardening


  Full release notes are available at https://github.com/lobehub/lobehub/releases/tag/v2.2.12
