releaseNotes: >-
  Open Lobe Hub over HTTP. If it opens with https://, change that to http:// in the address bar. HTTPS access is not supported by this Umbrel package yet.


  Back up your Lobe Hub data before updating. This update runs automatic database migrations on startup. Leave Lobe Hub running until they finish. Upstream has not verified downgrading after these migrations.


  Large memory databases may take longer to upgrade while new indexes are created. Review goal and subscription-account visibility after upgrading: upstream adds workspace visibility with public defaults for existing records.


  Bots now participate proactively by default. Turn off Proactive participation in each bot's channel settings if you prefer keyword-only wake-ups.


  - Added wake records explaining when bots respond, wait, or stay quiet

  - Improved channel replies with quotes, threads, and a compact composer

  - Added real-time page collaboration and structured memory stories

  - Improved dashboards, task model selection, and goal sharing

  - Added topic Favorites and improved chat history loading and scrolling

  - Improved authentication security and concurrent agent reliability


  Full release notes are available at https://github.com/lobehub/lobehub/releases/tag/v2.3.0
