releaseNotes: >-
  ⚠️ This update runs an automatic Lobe Hub database migration on startup. Back up your Umbrel before updating and leave Lobe Hub running until it finishes.


  This weekly patch adds Projects and Goals as first-class containers for agent work, expands Lobe Hub's public API and scoped API keys, and improves the Home dashboard.
  Key changes:
    - Added Projects and Goals for longer-running agent work and task planning
    - Added OpenAPI/SDK support, expanded v1 API endpoints, and scoped API keys
    - Added Home customization presets, daily briefs, and scheduled task views
    - Improved chat, resource-library, onboarding, desktop tab, and workspace-agent flows
    - Improved Redis streaming, file parsing, provider-error handling, startup performance, and security around provider URLs and restricted knowledge bases


  Full release notes are available at https://github.com/lobehub/lobehub/releases/tag/v2.2.14
