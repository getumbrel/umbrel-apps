releaseNotes: >-
  This update runs an automatic Lobe Hub database migration on startup. Leave Lobe Hub running until it finishes.


  This weekly patch improves agent workflows, search, collaboration, and runtime reliability.
  Key changes:
    - Added more heterogeneous Agent options and provider bindings, including Factory Droid, TRAE, Grok Build, Claude Code, Codex, Kimi Code, and Pi paths
    - Improved Goals, Tasks, Acceptance, and long-running Agent execution with better planning, supervision, liveness, and result-review flows
    - Added project-scoped Acceptance, direct Agent sharing controls, document comments/likes, member-aware task actions, and workspace explorer improvements
    - Added an optional Elasticsearch-backed full-text search path with resumable indexing and recovery tooling
    - Improved large-file and upload performance, CLI workspace/goal tooling, gateway/device failure handling, and operation/tool reliability


  Full release notes are available at https://github.com/lobehub/lobehub/releases/tag/v2.2.16
