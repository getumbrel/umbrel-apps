releaseNotes: >-
  Back up your Lobe Hub data before updating. This update runs an automatic database migration on startup. Leave Lobe Hub running until it finishes. Upstream has not verified downgrading after this migration.


  This weekly patch improves agent workflows, Acceptance reviews, Desktop and local-file tools, model support, startup performance, and messaging reliability.
  Key changes:
    - Added durable Goal planning, Task activity history, reusable Acceptance checks, grouped review flows, comments, region notes, and approvals
    - Improved Desktop computer-use workflows, local-file editing, spreadsheet previews, and local HTML Artifact publishing from the CLI
    - Added new Meta, Unsloth, GPT-6 Astra, Qwen3.8 Max, Gemini 3.8 Flash, and Meta Muse Spark model/provider options
    - Improved startup performance by deferring more analytics, model catalog, icon picker, editor, and cold-tab loading work
    - Improved message reliability, team/private Topic isolation, upload reservation handling, Elasticsearch indexing support, and bot collaboration fixes


  Full release notes are available at https://github.com/lobehub/lobehub/releases/tag/v2.2.17
