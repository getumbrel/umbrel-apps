releaseNotes: >-
  Open Lobe Hub over HTTP. If it opens with https://, change that to http:// in the address bar. HTTPS access is not supported by this Umbrel package yet.


  Back up your Lobe Hub data before updating. This update runs automatic database migrations on startup. Leave Lobe Hub running until they finish. Upstream has not verified downgrading after these migrations.


  This update improves agent reliability and adds a recycle bin for deleted conversations, agents, and messages.


  - Improved Goals and task workflows, including summaries of completed Goals

  - Added document comments and improved document previews

  - Improved chat streaming, file uploads, and self-hosted startup reliability

  - Fixed installation failures and database startup on Umbrel Home


  Full release notes are available at https://github.com/lobehub/lobehub/releases/tag/v2.2.19
