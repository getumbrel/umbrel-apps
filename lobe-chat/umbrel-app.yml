releaseNotes: >-
  Open Lobe Hub over HTTP. If it opens with https://, change that to http:// in the address bar. HTTPS access is not supported by this Umbrel package yet.


  Back up your Lobe Hub data before updating. This update runs automatic database migrations on startup. Leave Lobe Hub running until they finish. Upstream has not verified downgrading after these migrations.


  This update brings conversations, channels, and tasks together in projects, with new tools for reviewing goals and organizing documents.


  - Added project workspaces and multi-agent channels

  - Added goal review reports, decision trees, and progress charts

  - Reorganized Resources into Docs and added sidebar Favorites

  - Improved document editing with alerts, charts, footnotes, and a table of contents

  - Added Linear integration and in-conversation search

  - Improved session reliability and authentication security


  Full release notes are available at https://github.com/lobehub/lobehub/releases/tag/v2.2.21
