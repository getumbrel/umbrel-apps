manifestVersion: 1
id: bitrom-miner
category: bitcoin
name: Bitrom Miner
version: "1.0.0"
tagline: Solo CPU Bitcoin miner with a live dashboard
description: >-
  Mine Bitcoin solo with your device's CPU and watch everything on a live
  dashboard, right from your browser. No terminal, no SSH, and no external
  mining pools to trust — connect directly to a solo pool with your own
  wallet.


  On first launch, open the app and enter your Bitcoin address, worker name
  and pool in Settings. The miner starts immediately and the dashboard shows
  your hashrate, accepted and submitted shares, rejected shares, and any
  blocks found, updated in real time.


  Use the Cooling / power slider (1-10) to trade hash speed for heat and fan
  noise — level 1 uses all cores, level 10 uses the fewest threads. Settings
  changes restart the miner automatically.


  Mining solo means you only earn when you find a block. Hashrate shown is
  real, but expected earnings are unpredictable.
releaseNotes: ""
developer: Bitrom
website: https://github.com/BitromNO/bitrom-miner-v1
dependencies: []
repo: https://github.com/BitromNO/bitrom-miner-v1
support: https://github.com/BitromNO/bitrom-miner-v1/issues
port: 7563
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
