version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: bitrom-miner_server_1
      APP_PORT: 8080

  server:
    # Store gates: prebuilt multi-arch image (linux/amd64 + linux/arm64),
    # pinned by digest, no "build:" key. Build + publish first (see README.md),
    # then replace the digest below.
    image: ghcr.io/bitromno/bitrom-miner:1.2.0@sha256:00d532eb2a9980f291eb1f271d83e5146a7fed23525c92d9959fd9e32392d554
    restart: on-failure
    init: true
    stop_grace_period: 30s
    volumes:
      - ${APP_DATA_DIR}/data:/app/data