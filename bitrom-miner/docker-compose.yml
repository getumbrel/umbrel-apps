version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: bitrom-miner_server_1
      APP_PORT: 8080

  server:
    # Store gates: prebuilt multi-arch image (linux/amd64 + linux/arm64),
    # pinned by digest, no "build:" key. Build + publish first (see README.md),
    # then replace the digest below.
    image: ghcr.io/bitromno/bitrom-miner:1.0.0@sha256:ee3f85c48b0ad63e06fd0e9dcae80726833e15e9ddfeb29d32b84faf3aee0078
    user: "1000:1000"
    restart: on-failure
    init: true
    stop_grace_period: 30s
    volumes:
      - ${APP_DATA_DIR}/data:/app/data