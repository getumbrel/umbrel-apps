version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: bitrom-miner_server_1
      APP_PORT: 8080

  server:
    # Store gates: prebuilt multi-arch image (linux/amd64 + linux/arm64),
    # pinned by digest, no "build:" key. Build + publish first (see README.md),
    # then replace the digest below.
    image: ghcr.io/bitromno/bitrom-miner:1.0.1@sha256:028ace5cd39719fe7d9289133b20fed2be37a8bb3bb0ff28712a0c8930c11a45
    user: "1000:1000"
    restart: on-failure
    init: true
    stop_grace_period: 30s
    volumes:
      - ${APP_DATA_DIR}/data:/app/data