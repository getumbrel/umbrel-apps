manifestVersion: 1
id: lyftr
storage:
  dataRoot: data
environment:
  - name: REGISTRATION
    services:
      - backend
    default: first-user
    options:
      - first-user
      - open
      - closed
    note: "Who may create an account. first-user: only the first account can sign up, then sign-up closes. open: anyone who can reach the app. closed: nobody."
category: files
name: Lyftr
version: "0.1.0-beta.9"
tagline: Log workouts, track nutrition and follow your bodyweight
description: >-
  Open Lyftr and create your account. Only the first account can sign up; after that, sign-up is closed. To let someone else join, set Registration to open in the app's settings, then back to first-user once they have an account.


  Lyftr is a workout and nutrition tracker. Build training programs from a library of 800+ exercises with instructions and photos, log sets with a rest timer, and follow one exercise at a time in Gym Mode. Personal bests, a per-exercise weight chart, a muscle diagram and a consistency heatmap show how training is going.


  The nutrition diary logs calories and macros against your own targets, with food search and barcode scanning through Open Food Facts. A bodyweight log shows the trend in lbs or kg.


  All data is stored in a single SQLite database in the app's data folder. The server downloads the exercise catalog from the hosted open-exercise-db instance at startup and once a day, and food search queries Open Food Facts, so both need internet access.


  Lyftr is in beta. An Android app is available from the project's GitHub releases and can connect to this server.
