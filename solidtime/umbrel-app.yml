defaultUsername: "umbrel@umbrel.local"
deterministicPassword: true
defaultPassword: ""
dependencies: []
releaseNotes: >-
  ⚠️ If you created shared reports through the API, review their member filters before updating. Reports saved with an empty member_ids array previously showed no data; after this update, the empty filter means all members and may reveal time totals through an existing public link. Make affected reports private or set explicit member filters before updating.


  This urgent security release updates PHP to 8.3.36 to fix two critical vulnerabilities (CVE-2026-109618 and CVE-2026-109619), and updates FrankenPHP to 1.13. Updating promptly is recommended.


  Full release notes can be found at https://github.com/solidtime-io/solidtime/releases/tag/v0.22.1
path: ""
