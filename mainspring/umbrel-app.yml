category: ai
name: Mainspring
version: "1.0.0"
tagline: One endpoint for all your AI subscriptions
description: >-
  Mainspring pools the AI subscriptions you already pay for: Claude, Codex
  (ChatGPT), Grok, Cursor, OpenCode Console and any OpenAI-compatible API.
  Every other machine you own points Claude Code, Codex, Cursor, OpenCode or
  anything that speaks the OpenAI or Anthropic API at one address on your
  Umbrel, with a key you create in the panel.


  It keeps every login fresh, keeps each coding session on one account so its
  prompt cache stays warm, rests an account that hits its limit until it
  resets, and sends new sessions to the account whose limit resets soonest, so
  quota you've paid for doesn't expire unused.


  The panel shows each account's limits and when they reset, the live
  sessions, a usage meter at API list price, and the keys you hand to your
  tools. It can also give Mainspring its own HTTPS address on your Tailscale
  network.


  Using subscriptions through a proxy may be against a provider's terms. Use
  your own accounts, for your own work.
