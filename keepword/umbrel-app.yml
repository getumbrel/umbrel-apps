manifestVersion: 1
id: keepword
storage:
  dataRoot: data
category: automation
name: Keepword
version: "2.5.0"
tagline: Know when web pages change without notice
description: >-
  Keepword keeps a copy of the web pages you care about, like privacy policies and terms of service, and tells you when they change without notice.


  Log in with the password Umbrel shows for Keepword, then add the pages you want to watch. Alerts can go to your phone or a chat through ntfy, Discord, Slack or any webhook.


  To join the network of witnesses, choose "At home, behind a router" in Keepword's settings. You don't need to open any ports. Witnesses run by different people compare what they saw, so nobody can quietly fake or erase what a page said, and anyone can check the proof. Once you join, the other witnesses see your internet provider and country, and the witness that relays for your Keepword sees your IP address.
releaseNotes: ""

developer: Keepword
website: https://keepword.net
dependencies: []
repo: https://git.keepword.net/keepword/keepword
support: https://git.keepword.net/keepword/keepword/issues

port: 8480
gallery: []
path: ""

defaultUsername: ""
deterministicPassword: true
backupIgnore:
  - data/ip2asn-combined.tsv

submitter: Keepword
submission: https://github.com/getumbrel/umbrel-apps/pull/6281
