id: lawallet-nwc
category: bitcoin
name: LaWallet NWC
version: "2.5.1"
tagline: Lightning Address platform and Nostr CRM
description: >-
  LaWallet NWC is an open-source platform for creating, managing, and serving
  Lightning Addresses connected to Nostr Wallet Connect. It includes an admin
  dashboard for operators, a user wallet, BoltCard workflows, and NWC-based
  routing for Lightning payments.


  Give your community members a Lightning Address on your own domain, an
  integrated wallet, and a Nostr identity, on a progressive self-custody model:
  members start receiving payments instantly through address aliasing, then
  upgrade to their own NWC wallet at their own pace.


  LaWallet NWC is pre-alpha software. Do not use it with real funds until you
  are comfortable with the risks.
