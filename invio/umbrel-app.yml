manifestVersion: 1
id: invio
storage:
  dataRoot: data
category: finance
name: Invio
version: "2.3.0"
tagline: Invio is a self-hosted invoicing app without the bloat
description: >-
  Invio is a self-hosted invoicing without the bloat. A fast, minimalist, and
  privacy-friendly invoicing system built for freelancers and small teams who
  want control, not clutter.


  Create and share invoices in seconds, host your data yourself, and share
  secure, password-free links with clients. Lightweight by design, no CRM
  overhead and no SaaS lock-in.
releaseNotes: >-
  This update improves invoicing with searchable customer selection and a product
  selection dropdown.


  - Choose a language for each invoice and set a fallback invoice language.

  - Add shipping dimensions, weight, country of origin, and customs codes to products.

  - Draft invoices are no longer incorrectly marked as overdue.

  - Leave product units empty when they are not needed.

  - Adds Argentine Spanish and improves translations.


  Full release notes can be found at https://github.com/kittendevv/Invio/releases/tag/v2.3.0
developer: kittendevv
