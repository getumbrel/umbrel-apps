manifestVersion: 1
id: invio
storage:
  dataRoot: data
category: finance
name: Invio
version: "2.6.0"
tagline: Invio is a self-hosted invoicing app without the bloat
description: >-
  Invio is a self-hosted invoicing without the bloat. A fast, minimalist, and
  privacy-friendly invoicing system built for freelancers and small teams who
  want control, not clutter.


  Create and share invoices in seconds, host your data yourself, and share
  secure, password-free links with clients. Lightweight by design, no CRM
  overhead and no SaaS lock-in.
releaseNotes: >-
  This update improves invoice numbering, logo layout, and template installation security.


  - Choose a starting number for the invoice counter to continue an existing numbering sequence.
  - Customize the padding of global and per-customer invoice counters in numbering patterns.
  - Keep wide logos inside their designated area on portrait invoice templates.
  - Strengthen checks that prevent remote template installations from accessing internal network addresses.


  Full release notes can be found at https://github.com/kittendevv/Invio/releases/tag/v2.6.0
developer: kittendevv
website: https://github.com/kittendevv/invio
dependencies: []
repo: https://github.com/kittendevv/invio
support: https://github.com/kittendevv/invio/issues
port: 8003
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
path: ""
defaultUsername: admin
deterministicPassword: true
submitter: Maurice Wipf
submission: https://github.com/getumbrel/umbrel-apps/pull/3953
