manifestVersion: 1
id: invio
storage:
  dataRoot: data
category: finance
name: Invio
version: "2.5.0"
tagline: Invio is a self-hosted invoicing app without the bloat
description: >-
  Invio is a self-hosted invoicing without the bloat. A fast, minimalist, and
  privacy-friendly invoicing system built for freelancers and small teams who
  want control, not clutter.


  Create and share invoices in seconds, host your data yourself, and share
  secure, password-free links with clients. Lightweight by design, no CRM
  overhead and no SaaS lock-in.
releaseNotes: >-
  This update adds sales statistics to the dashboard and improves invoice accuracy.


  - View sales by month, country, customer, and product.
  - Keep saved currencies when editing invoices and preserve taxes when duplicating them.
  - Exclude draft and voided invoices from Total Billed.
  - Improve tax calculations and customer details in electronic invoice exports, and fix Factur-X PDF embedding.
  - Show checkbox settings with their saved state.


  Full release notes can be found at https://github.com/kittendevv/Invio/releases/tag/v2.5.0
developer: kittendevv
website: https://github.com/kittendevv/invio
dependencies: []
repo: https://github.com/kittendevv/invio
support: https://github.com/kittendevv/invio/issues
port: 8003
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
path: ""
defaultUsername: admin
deterministicPassword: true
submitter: Maurice Wipf
submission: https://github.com/getumbrel/umbrel-apps/pull/3953
