name: Vaultwarden
version: "1.37.4"
tagline: Unofficial Bitwarden® compatible server
description: >-
  Vaultwarden is an unofficial Bitwarden-compatible server for self-hosting your encrypted password vault on Umbrel. It works with many official Bitwarden clients and provides a lightweight alternative to the official Bitwarden server.


  **Connecting your devices**


  Some Bitwarden clients require a secure HTTPS connection. Options include:


  - **Tailscale Serve:** A private HTTPS address that works at home and away, with Tailscale connected on your devices.

  - **Local HTTPS:** Available on umbrelOS 2.0 or later for connections on your local network. This requires installing and trusting Umbrel's certificate on each device, following the instructions under **Settings → Advanced settings**.

  - **Another HTTPS reverse proxy:** Connect through an HTTPS address you've configured for Vaultwarden.


  Use your chosen HTTPS address as the self-hosted server URL in your Bitwarden client.


  **Features:** Vaultwarden supports personal vaults, organizations, attachments, Bitwarden Send, website icons, two-factor authentication, emergency access, and the Vaultwarden admin backend.


  **Disclaimer:** Vaultwarden is not associated with Bitwarden or 8bit Solutions LLC. For Vaultwarden issues, contact Vaultwarden/Umbrel support rather than Bitwarden's official support channels.

releaseNotes: >-
  This release includes important security fixes for organization member revocation, two-factor authentication, organization invitations, attachments, event logs, cipher sharing, and organization API keys.


  For shared organizations: if you have admins you don’t fully trust, rotate the organization’s API key after updating under Admin Console → Settings → Rotate API key.


  No proxy changes are needed for standard Umbrel installations. If you have a custom setup using IP_HEADER=X-Forwarded-For with multiple reverse proxies, list all trusted proxies in IP_HEADER_TRUSTED_PROXIES so rate limiting and logs use the correct client IP address.


  On umbrelOS 2.0 or later, Vaultwarden opens directly from your Umbrel dashboard over HTTPS, without needing Tor Browser. On older umbrelOS versions, continue using Tor Browser or your existing HTTPS setup.
