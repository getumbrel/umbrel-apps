manifestVersion: 1
id: bisq2-node
storage:
  dataRoot: data
category: bitcoin
name: Bisq 2 Node
version: "2.1.15.0"
tagline: Run your own Bisq 2 node for private Bitcoin trading
description: >-
  Bisq Connect lets you buy and sell Bitcoin peer-to-peer from your phone. This
  app runs a Bisq 2 node for Bisq Connect, allowing your phone to connect through
  a node you control instead of relying on someone else's.


  The node joins the Bisq P2P network over its bundled Tor connection. Open this
  app to check its status and scan the pairing QR code with Bisq Connect.


  This is not a Bitcoin full node and does not download the Bitcoin blockchain.


  Treat the pairing code like a password. Anyone who has it can pair with your
  node and control trades.
developer: Bisq
website: https://bisq.network
dependencies: []
repo: https://github.com/bisq-network/bisq2
support: https://github.com/bisq-network/bisq-mobile/issues
port: 8390
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
path: ""
defaultUsername: ""
defaultPassword: ""
submitter: rodvar
submission: https://github.com/getumbrel/umbrel-apps/pull/5850
releaseNotes: >-
  **Security update. Update now to keep trading.** A Bisq security alert requires version 2.1.15 or newer for trading. Until this node is updated, Bisq Connect cannot take offers through it and asks you to have the node upgraded, and offers published through it cannot be taken. Bisq Connect stays paired and needs no update.


  This update moves the node to Bisq 2 API 2.1.15.


  - **Tor:** The node now runs the Tor bundled with Bisq (Tor 0.4.9.15) inside a sandbox, instead of a Tor package installed in the image. The sandbox keeps a compromised Tor away from the node's files and keys.

  - **Hardening:** Oversized responses from the network are refused instead of using unbounded memory, and file cleanup no longer follows links.


  Bisq 2 release: https://github.com/bisq-network/bisq2/releases/tag/v2.1.15


  Full changes: https://github.com/bisq-network/bisq2/compare/7f68c09...cfe8ab2 (bisq2 @ cfe8ab2)
