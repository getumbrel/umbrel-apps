manifestVersion: 1
id: bisq2-node
storage:
  dataRoot: data
category: bitcoin
name: Bisq 2 Node
version: "2.1.13.0"
tagline: Run your own Bisq 2 node for private Bitcoin trading
description: >-
  Bisq Connect lets you buy and sell Bitcoin peer-to-peer from your phone. This
  app runs a Bisq 2 node for Bisq Connect, allowing your phone to connect through
  a node you control instead of relying on someone else's.


  The node joins the Bisq P2P network over its bundled Tor connection. Open this
  app to check its status and scan the pairing QR code with Bisq Connect.


  This is not a Bitcoin full node and does not download the Bitcoin blockchain.


  Treat the pairing code like a password. Anyone who has it can pair with your
  node and control trades.
developer: Bisq
website: https://bisq.network
dependencies: []
repo: https://github.com/bisq-network/bisq2
support: https://github.com/bisq-network/bisq-mobile/issues
port: 8390
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
path: ""
defaultUsername: ""
defaultPassword: ""
submitter: rodvar
submission: https://github.com/getumbrel/umbrel-apps/pull/5850
releaseNotes: "Security update. Upgrades the node's Tor daemon to 0.4.9.13, the Tor Project's emergency security release of 23 September 2026 that fixes a series of high-severity issues affecting clients, onion services and relays (it also includes the 0.4.9.12 fixes). Moves the node to Bisq 2 API 2.1.13, which Bisq 2 marks as required to continue trading. Update your node as soon as possible, then update the Bisq Connect app. Tor advisory: https://forum.torproject.org/t/security-release-0-4-9-13/22178 — Bisq 2 release: https://github.com/bisq-network/bisq2/releases/tag/v2.1.13 — Full changes: https://github.com/bisq-network/bisq2/compare/v2.1.13...3e07b59 (bisq2 @ 3e07b59)"