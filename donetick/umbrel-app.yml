releaseNotes: >-
  You may need to sign in to Donetick again after updating.


  - Import tasks in bulk and drag tasks between sections on the project board.

  - Set scheduling bounds for recurring tasks, with fixes for due dates and timezone handling.

  - Enable automatic reward approval and use more specific webhook events.

  - Optionally enable the built-in MCP server for API-token access to tasks.


  Full release notes can be found at https://github.com/donetick/donetick/releases/tag/v0.1.89
