version: '3.7'

services:
  app_proxy:
    environment:
      APP_HOST: donetick_app_1
      APP_PORT: 2021
      PROXY_AUTH_ADD: "false"

  app:
    image: donetick/donetick:v0.1.82@sha256:44fce161cb2cd4c46acb184f76212ed77ed961dca6f4face6528064b9b0f5ca5
    user: "1000:1000"
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data/app:/donetick-data
      - ${APP_DATA_DIR}/data/config:/config
    environment:
      - DT_ENV=selfhosted
      - DT_JWT_SECRET=${APP_SEED}
      - DT_SQLITE_PATH=/donetick-data/donetick.db
