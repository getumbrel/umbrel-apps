manifestVersion: 1
id: homedex
category: networking
name: Homedex
version: "0.2.3"
tagline: Read-only inventory of the services, hosts, ports and routes in your homelab
description: >-
  Homedex signs in with the password Umbrel shows for the app; there is no username. On Umbrel it inventories your other machines and services over the network. It does not read this Umbrel's own containers, because App Store apps cannot access the Docker socket.


  Homedex builds a searchable record of the services, hosts, ports, routes, certificates, domains and changes your infrastructure reports, instead of another spreadsheet to maintain. It only reads: it never starts, stops or reconfigures anything, and it sends no telemetry.


  - Proxmox VE: nodes, VMs and containers, with a read-only API token.

  - Tailscale: tailnet devices, each shown on the machine it runs on.

  - Docker on other hosts: containers, images, Compose stacks, ports and networks, through a read-only socket proxy on that host, or agentless over SSH.

  - Reverse proxies: Traefik, Caddy and Nginx Proxy Manager routes, followed from domain to container, with broken chains flagged.

  - Expiry and changes: TLS certificates and domain registrations by days remaining, image updates, and what moved between scans.


  On the first-run page choose "Skip, add another source": every source is added and tested read-only from the web UI under Sources.
