releaseNotes: >-
  This security update upgrades PHP to 8.5.12 to fix two critical remote code execution vulnerabilities (CVE-2026-109618 and CVE-2026-109619). Updating promptly is recommended. Wavelog remains on version 3.2.4.


  If you're updating from a pre-3.0.0 version, note that Wavelog 3.0.0 introduced a new multiuser contesting engine and QSL card designer.


  If you use WavelogGate, upstream recommends updating WavelogGate as well.


  Full release notes can be found at https://www.php.net/archive/2026.php#2026-10-21-5
