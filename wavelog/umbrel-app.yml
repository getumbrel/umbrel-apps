releaseNotes: >-
  This update adds PSKReporter live reporting, Clublog OQRS synchronization (beta), an export for unworked MMMonVHF gridsquares, and an improved QRB calculator.


  It also improves callsign lookups, duplicate contact handling, QSL printing, and LoTW certificate uploads, fixes contact logging across midnight and ADIF date parsing, and strengthens dashboard permission checks.


  If you're updating from a pre-3.0.0 version, note that Wavelog 3.0.0 introduced a new multiuser contesting engine and QSL card designer.


  If you use WavelogGate, upstream recommends updating WavelogGate as well.


  Full release notes can be found at https://github.com/wavelog/wavelog/releases/tag/3.2.5
