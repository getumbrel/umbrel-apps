releaseNotes: >-
  Wavelog 3.2.0 adds more APIv2 coverage, including contest, logbook, catalog, and station resources. If you use WavelogGate or other API integrations, make sure they support Wavelog's APIv2 changes.


  This release adds IOTA, reference, and geolocation search improvements to the Activation Planner, a label designer with import/export, an adjustable duplicate-QSO time slider, a Distances Worked mode filter, right-click dashboard menus, and redesigned AMSAT Status and QSL Statistics views.


  It also improves award tracking, contest and DCL handling, QSO editing, satellite/TLE handling, LoTW/QRZ/eQSL workflows, Advanced Logbook database tools, image-upload validation, and security hardening across login, awards, details popups, widgets, and external-service data.


  If you're updating from a pre-3.0.0 version, note that Wavelog 3.0.0 introduced a new multiuser contesting engine and QSL card designer.


  Full release notes can be found at https://github.com/wavelog/wavelog/releases/tag/3.2.0
