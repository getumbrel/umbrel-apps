manifestVersion: 1
id: opensoho
storage:
  dataRoot: data
category: networking
name: OpenSOHO
version: "0.15.2"
tagline: Lightweight network management for OpenWRT devices
description: >-
  Sign in with the username and password shown in Umbrel. Point your OpenWRT
  devices at http://<umbrel-ip>:18090 so OpenSOHO sees their real IP
  addresses. Their shared secret is the same password.


  OpenSOHO is a lightweight network management system for small office/home
  office (SOHO) environments, designed to manage 2 to 20 OpenWRT-based network
  devices. It is a simpler alternative to OpenWISP for networks that are too
  small to need a full-blown controller.


  Features include WiFi SSID configuration across 2.4, 5 and 6 GHz radios,
  radio frequency management, LED configuration, device health monitoring,
  connected client tracking, VLAN support, PoE and LLDP network overviews, and
  Home Assistant integration.


  Compatible with openwisp-config and openwisp-monitoring packages on
  OpenWRT 24.10.x DSA.
releaseNotes: ""

developer: rubenbe
website: https://opensoho.github.io
dependencies: []
repo: https://github.com/rubenbe/opensoho
support: https://github.com/rubenbe/opensoho/issues

port: 8290
gallery: []
path: ""

defaultUsername: "admin@opensoho.local"
deterministicPassword: true

