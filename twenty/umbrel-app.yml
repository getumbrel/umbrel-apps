releaseNotes: >-
  This update adds two-factor authentication backup codes, improves message attachments and voice-note playback, and adds workflow overview and run-health views. It also strengthens SAML sign-in validation and preserves blank lines when converting rich text.


  ⚠️ The legacy workflow and automated-trigger objects are removed from the record APIs. Update integrations using these APIs before upgrading. Favorites and attachment/timeline links to legacy workflow records are removed; review existing workflows and related links before updating.


  For users upgrading from older versions: existing rich-text content and AI workflow steps are migrated automatically; allow extra time for Twenty to start after updating.


  ⚠️ Some older application connections are removed if their personal/workspace scope differs from their provider's scope. Affected accounts need to be connected again. Connections to workspace-scoped providers are shared with the workspace.


  ⚠️ Existing restricted records become private. Records previously set to view-only for everyone return to role-based access, so review their sharing settings after updating.


  To restore a personal application connection, a server administrator can enable IS_FEATURE_FLAG_MANAGEMENT_ENABLED in Settings → Admin Panel → Config. Refresh the page, open the workspace under Admin Panel → General, and enable App preferences in its Feature Flags tab. Refresh again, then reconnect under Settings → Apps preferences. This feature is opt-in and is not enabled automatically by this update.


  API integrations should use markdown or tiptap rich-text fields instead of the deprecated blocknote field. Creating webhooks now requires a roleId and the ROLES permission. Record-sharing and metadata APIs have also changed; review the upstream release notes before updating custom integrations.


  Full changelog: https://github.com/twentyhq/twenty/compare/twenty/v2.57.1...twenty/v2.58.0
