releaseNotes: >-
  This update adds recurring calendar events, Reply all for email threads, and improvements to summary columns and record search. It also fixes updates for some older workspaces.


  ⚠️ Access to emails, calendar events and their attachments now follows each connected mail or calendar account's sharing setting instead of a member's role. Check your sharing settings after updating. Some existing emails and events may take a short while to reappear while Twenty processes them in the background.


  ⚠️ If you connect other tools to Twenty through its API, several API fields for views, workflows, permissions and select options have changed or been removed. Check your integrations against the full release notes before updating.


  ⚠️ Members joining through single sign-on (SSO) now need a personal invitation, as a public invite link alone is no longer enough. Members who haven't verified their email must verify it or reset their password first.


  Full changelog: https://github.com/twentyhq/twenty/compare/twenty/v2.63.0...twenty/v2.64.1
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
