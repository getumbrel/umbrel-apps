manifestVersion: 1
id: nyxiontech-pdf-tools
storage:
  dataRoot: data
category: files
name: Nyxiontech PDF Tools
version: "1.2.0"
tagline: 25 PDF and image tools that never upload your files
description: >-
  Nyxiontech PDF Tools is 25 tools for PDF and image files that run inside the browser tab.
  There is no backend. The container serves static files, every operation is JavaScript and
  WebAssembly running on the page, and the document never reaches the server. On Umbrel that
  means the work happens on the machine you are reading this on rather than on the one running
  the app, and nothing to open a document is ever sent over your network.


  Pages: merge, split, extract, rotate, reorder and delete pages, add page numbers and
  watermarks, and compare two versions of a document with both a text diff and a pixel diff.


  Conversion: PDF to Word, to plain text or to images, images to PDF, Word to PDF, HEIC to
  JPG, image compression and background removal.


  Security: set or remove a password, fill forms, add a signature, strip metadata including
  the XMP packet, and redact. Redaction re-renders the page as an image with the boxes burnt
  in, so the text underneath is removed rather than covered over.


  OCR makes a scanned page searchable, in Polish or English.


  The interface follows the system language across English, Polish, German, Spanish, French
  and Ukrainian. No account, no limit on file size or file count, no watermark, no
  advertising. Source under AGPL-3.0-or-later.


  The Content-Security-Policy is `default-src 'self'` with `form-action 'none'`, so the claim
  that nothing is uploaded can be checked in the browser's network panel instead of taken on
  trust.
