manifestVersion: 1
id: camp-pack
storage:
  dataRoot: data
category: files
name: Camp Pack
version: "1.0.0"
tagline: Reusable packing lists for camping trips
description: >-
  Camp Pack keeps your camping packing lists on your own server and reuses them trip after trip.
  Pick a list (car camping kitchen, backpacking kitchen, bike tour with a kitchen trailer or day hike),
  enter how many people and nights, and tick items as you pack.


  Quantities are only shown where a public source exists: water at about 1 gallon per person per day,
  up to twice that in hot weather (Ready.gov), cold food at 40 °F or below (USDA), and about 1 tablespoon
  of unscented bleach per gallon to sanitize dishes (CDC). A bear-country switch turns food-storage items
  into the National Park Service rule. Add your own items, print a list, or export it as a plain-text checklist.


  Camp Pack is a packing checklist, not a trip planner: it has no maps, itineraries or bookings,
  and pairs well with a trip planner app.


  No account and no tracking: data lives in one JSON file in the app's data folder.
