version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: grocy_server_1
      APP_PORT: 80

  server:
    image: linuxserver/grocy:4.7.1@sha256:d63bffe9afb2ef1a23fa7ce0749cdaeba9c169fb644b16eed270884a1b2f4ac9
    restart: on-failure
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - GROCY_BASE_URL=/
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
