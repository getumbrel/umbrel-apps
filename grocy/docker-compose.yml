version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: grocy_server_1
      APP_PORT: 80

  server:
    image: linuxserver/grocy:4.7.0@sha256:f20d27df7b7056797c2eefd13647c2feb462e32519ad84280381b18fb4ef5f08
    restart: on-failure
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - GROCY_BASE_URL=/
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
