version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: grocy_server_1
      APP_PORT: 80

  server:
    image: linuxserver/grocy:4.7.1@sha256:e45d96ef40cce8f39ad96f1b32c151ddb7a2527c68899ee5637978a5bb2dfc3c
    restart: on-failure
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - GROCY_BASE_URL=/
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
