manifestVersion: 1.2
id: slskdn
category: media
name: slskdN
version: "0.1.0"
tagline: Soulseek client with discovery, downloads, and mesh features
description: >-
  slskdN is an AGPL-3.0 Soulseek client with a web interface, multi-source
  downloads, library sharing, discovery, DHT, and optional mesh networking.
  Forward TCP 50300 for incoming Soulseek traffic and enable UDP 50300 only
  when DHT or mesh rendezvous is required.
developer: Snapetech
website: https://github.com/snapetech/slskdn
repo: https://github.com/snapetech/slskdn
support: https://github.com/snapetech/slskdn/issues
dependencies: []
port: 5030
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
torOnly: false
permissions:
  - STORAGE_DOWNLOADS
submitter: Snapetech
submission: https://github.com/getumbrel/umbrel-apps/pulls
releaseNotes: >-
  Initial slskdN submission using the stable public Docker image.
