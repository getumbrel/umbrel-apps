manifestVersion: 1
id: hedgedoc
storage:
  dataRoot: data
category: files
name: HedgeDoc
version: "1.12.0"
tagline: Write and edit Markdown notes together in real time
description: >-
  HedgeDoc is a real-time, collaborative Markdown editor. Open a note in your browser and write together with others, with a live preview right next to the text.


  Create an account with your email address and a password on the HedgeDoc start page, or start writing straight away as a guest. Notes created as a guest are not tied to an account, so sign in first if you want to find them again later.


  Features:

  - Live collaboration with several people editing the same note at once

  - Markdown preview with code highlighting, tables, task lists, math and diagrams such as Mermaid and Graphviz

  - Turn a note into a slide presentation

  - Upload images straight into your notes

  - Share notes as a read-only page and control who can view or edit each note

  - Note history, tags and a personal overview of your notes
releaseNotes: ""
