releaseNotes: >-
  Agent Zero v2.7 is a follow-up to the recent v2.0 major update. If you're updating from a pre-v2.0 version, Agent Zero recommends creating a backup from Settings > Check for Updates > Backup & Restore before upgrading, then checking chats, projects, memory, settings, and plugins after the update.


  Important changes in this release:
    - Fixes native Responses output routing so active goal overrides, response-tool cleanup, and empty-payload handling work correctly
    - Improves streaming resilience for partial tool arguments, text rendering, legacy response fields, and live response logs
    - Adds Cerebras as a native model provider with API-key onboarding guidance and a bundled logo
    - Adds project-scoped HTTP and SOCKS proxy settings for the internal Docker browser, including bypass rules and optional authentication
    - Hardens remote Linux computer use with focus verification and clearer action receipts
    - Fixes Codex OAuth reasoning-effort forwarding at the Responses proxy boundary


  Full release notes can be found at https://github.com/agent0ai/agent-zero/releases/tag/v2.7
