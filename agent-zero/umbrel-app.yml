releaseNotes: >-
  Agent Zero v2.11 is a follow-up to the recent v2.0 major update. If you're updating from a pre-v2.0 version, Agent Zero recommends creating a backup from Settings > Check for Updates > Backup & Restore before upgrading, then checking chats, projects, memory, settings, and plugins after the update.


  Important changes in this release:
    - Adds new bundled plugins for context window usage, Context Doctor JSON repair, vision sidecar model presets, result extension handling, and WebUI plugin slots
    - Improves live streaming and real-time WebUI synchronization with safe Markdown/LaTeX rendering, progressive tool output, stable message actions, and faster chat/sidebar updates
    - Improves memory, embeddings, and context handling, including provider-prefixed embedding model IDs, JSON-safe relevance scores, cached local embedding models, and preserved compacted context summaries
    - Adds configurable keyboard layouts for the interactive browser and improves browser input and legacy CDP endpoint handling
    - Changes the default LiteLLM transport to Chat Completions; providers that depended on implicit Responses transport now need explicit Responses mode
    - Fixes mobile canvas hiding, onboarding model preset flow, empty vision summaries, ACP artwork, launcher links, and Context Doctor dependency installation after self-update


  Full release notes can be found at https://github.com/agent0ai/agent-zero/releases/tag/v2.11
