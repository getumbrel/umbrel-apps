releaseNotes: >-
  Agent Zero v2.10 is a follow-up to the recent v2.0 major update. If you're updating from a pre-v2.0 version, Agent Zero recommends creating a backup from Settings > Check for Updates > Backup & Restore before upgrading, then checking chats, projects, memory, settings, and plugins after the update.


  Important changes in this release:
    - Improves the internal browser with a shared persistent Chromium/Xvfb/Xpra runtime, authenticated interactive viewport, automatic tab restore, and bot-detection hardening
    - Adds scoped composer references, per-chat composer draft restore, Goal mode shortcuts, and quieter reload handling for project- and agent-scoped plugin changes
    - Improves Responses/Codex OAuth streaming recovery and subordinate agent lifecycle persistence
    - Adds a bundled ACP session bridge plus standalone user API and authenticated user WebUI extension routes
    - Fixes backup restores so destination allowed origins are preserved, and pins desktop runtime packages to known multi-architecture builds


  Full release notes can be found at https://github.com/agent0ai/agent-zero/releases/tag/v2.10
