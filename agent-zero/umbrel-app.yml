dependencies: []
releaseNotes: >-
  Important changes in this release:
    - Improves startup, chat loading, browser rendering, sidebar activity, and chat-switch performance
    - Upgrades LiteLLM and the OpenAI SDK with automatic startup migration for existing Docker instances
    - Adds native LiteLLM routing for Nebius, Venice chat, Z.AI/Coding, OpenRouter embeddings, and Agent Zero API cache routing
    - Fixes disappearing chats, stale preset editor drafts, chat naming, context pruning, SSH command truncation, and Responses prompt caching for long conversations
    - Improves Codex OAuth reconnect/device-code feedback, subordinate task handling, terminal I/O, scheduler editing, and plugin/provider merge precedence
    - Raises security floors for aiohttp, anyio, urllib3, filelock, fsspec, and multidict


  Full release notes can be found at https://github.com/agent0ai/agent-zero/releases/tag/v2.14
