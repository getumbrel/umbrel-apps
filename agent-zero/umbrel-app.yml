dependencies: []
releaseNotes: >-
  ⚠️ If you use Telegram, review and remove project- or profile-scoped configurations; Telegram is now global-only and those configurations pause the bot. Restart and reconnect existing host browsers to refresh the browser helper. Remote input now also requires remote terminal permission.


  Important changes in this release:
    - Added per-action tool permissions, standalone tool plugins, and a unified memory tool
    - Added customizable welcome panels, sidebar message search, and Pi chat imports
    - Improved response streaming, chat creation, model recovery, and agent switching
    - Preserved existing environment configuration during startup migration
    - Strengthened browser isolation and Telegram, WhatsApp, and remote terminal permissions


  Full release notes can be found at https://github.com/agent0ai/agent-zero/releases/tag/v2.15
