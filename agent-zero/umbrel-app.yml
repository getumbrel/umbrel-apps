releaseNotes: >-
  Agent Zero v2.12 is a follow-up to the recent v2.0 major update. If you're updating from a pre-v2.0 version, Agent Zero recommends creating a backup from Settings > Check for Updates > Backup & Restore before upgrading, then checking chats, projects, memory, settings, and plugins after the update.


  Important changes in this release:
    - Hardens connector and workspace file transfers with negotiated WebSocket payload limits, authenticated HTTP transfers, checksum verification, disk spooling, and safer cancellation/cleanup
    - Adds independent file and editor directory trees, a shared ACE-powered editor, Markdown preview, configurable transfer/editing limits, archive safeguards, and improved file-link handling
    - Improves Responses API native tool-call handling, Context Doctor repair/fallback behavior, prompt/profile compactness, provider usage reporting, Codex OAuth handling, and model-setting validation
    - Adds UI, canvas, browser, desktop, skills, plugins, terminal, and parallel-job improvements, including movable canvas rails, verbose-tool-call preferences, Safari setup guidance, and faster desktop startup
    - Includes security fixes for WhatsApp media path traversal, Telegram webhook authentication bypass, and IMAP sender whitelist bypass
    - Includes breaking changes for plugin authors and integrations: `hist_add_ai_response` now requires `llm_result`, `thoughts` is no longer auto-populated from `reasoning`, and plugin setup/cleanup must use `hooks.py`


  Full release notes can be found at https://github.com/agent0ai/agent-zero/releases/tag/v2.12
