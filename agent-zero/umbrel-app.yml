dependencies: []
releaseNotes: >-
  Important changes in this release:
    - Improves the file browser with breadcrumb or text path navigation, autocomplete, clickable file rows, inline rename/new-folder actions, better folder preservation, and configurable start folders
    - Adds sidebar project folders, including create/rename/delete actions, project metadata, and project-aware chat listings
    - Adds messaging slash commands and improves WhatsApp, Telegram, Discord, IMAP, and SMTP behavior
    - Improves native commentary streaming, provider routing, browser input replay, desktop environment behavior, plugin dependency handling, and WebUI responsiveness
    - Includes security and stability fixes for shell command execution, task queue isolation, local storage validation, file editing, and browser cleanup
    - Includes breaking changes for plugin and integration authors around message/result handling, thoughts vs. reasoning, and plugin `hooks.py` setup/cleanup


  Full release notes can be found at https://github.com/agent0ai/agent-zero/releases/tag/v2.13
