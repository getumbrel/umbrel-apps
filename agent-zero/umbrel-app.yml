  - 3.webp
defaultUsername: ""
defaultPassword: ""
dependencies: []
releaseNotes: >-
  ⚠️ Time Travel now expires older snapshots by default, keeping up to 500 recent snapshots within 30 days plus checkpoints. Existing explicit opt-outs are preserved. Custom clients calling local OAuth model proxies must now authenticate, and A2A connections must supply credentials explicitly.


  - Added automatic cleanup of old caches and temporary files, with per-area controls.
  - Scheduled tasks missed during downtime now run once when Agent Zero returns.
  - Improved secret handling, backup restore safety, and Time Travel capture and restore.
  - Restored scoped Telegram configuration and improved chat loading and startup performance.
  - Released idle browser resources while preserving saved tabs and sign-in profiles.


  Full release notes can be found at https://github.com/agent0ai/agent-zero/releases/tag/v2.16
path: ""
