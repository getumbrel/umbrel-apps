releaseNotes: >-
  ⚠️ Requires umbrelOS 2.0 or later. Endurain now opens over HTTPS.


  Back up Endurain before updating. This release migrates your database and files; restoring a backup is the only way back to 0.19.x. The first startup may take longer than usual.


  What's new:

  - Rebuilt activity processing and background imports for more reliable uploads, map previews, and notifications.

  - Improved privacy protections for activity details, maps, photos, and gear, alongside authentication and upload security fixes.

  - Added time spent in heart rate zones and corrected statistics to respect your timezone and week start.

  - Fixed Garmin sleep sync overwriting existing data and improved mobile SSO redirects.

  - Improved elevation and maximum-speed calculations for GPS imports, including recordings with pauses. Existing elevation totals are not recalculated.

  - Fixed re-uploading activities after deleting an earlier import.


  If you import files from disk, move pending bulk-import or Strava-export files into a subfolder named for your user ID before importing. You can also upload a Strava export ZIP from the Import page. Third-party REST API clients need updating for the new endpoints and response formats.


  If Endurain asks you to reconnect Garmin Connect, reconnect it in Endurain's settings.


  Full release notes can be found at https://github.com/endurain-project/endurain/releases/tag/v0.20.1
path: ""
