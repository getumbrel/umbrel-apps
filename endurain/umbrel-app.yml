releaseNotes: >-
  ⚠️ Requires umbrelOS 2.0 or later. Endurain now opens over HTTPS.


  Back up Endurain before updating. This release converts your activity data and renames stored files, and restoring that backup is the only way back. If you're updating from 0.19.x, Endurain first finishes the 0.20 data conversion, so the first start can take a while on large libraries. Keep the app running until it opens.


  Everyone must sign in again after updating. Third-party API clients need updating, and the Endurain mobile app must be version 0.11.0 or later. Profile archives exported before this release cannot be imported; export them again after updating.


  What's new:

  - Fixed large profile exports failing with insufficient memory.

  - Fixed large profile imports losing laps, sets, and activity streams.


  - Increased profile archive limits to 8 GB uncompressed and 100,000 files. The ZIP upload limit remains 500 MB.


  - Profile imports now stop without importing data when a laps, sets, or streams file exceeds its size limit, instead of silently skipping it.


  Also included from 0.21.x:

  - Fixed failed upgrades from 0.20.x and added recovery for databases left partially upgraded by 0.21.0.

  - Added security notifications, an audit trail, known-device management, and stronger protection for sensitive account changes.

  - Added administrator invitations and controls for requiring multi-factor authentication.

  - Moved email, session, reverse-geocoding, and retention settings into the administration interface.

  - Fixed privacy issues exposing account details and hidden activity metrics to other users.

  - Improved TCX, FIT, and GPX imports, cadence calculations, swimming times, and health-data editing.


  New installations no longer use admin/admin. Sign in as admin with the password shown in Umbrel. Existing accounts and passwords are unchanged.


  If Endurain asks you to reconnect Garmin Connect, reconnect it in Endurain's settings.


  Full release notes can be found at https://github.com/endurain-project/endurain/releases/tag/v0.21.2
path: ""
