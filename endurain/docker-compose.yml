version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: endurain_app_1
      APP_PORT: 8080
      PROXY_AUTH_ADD: "false"

  app:
    image: ghcr.io/endurain-project/endurain:v0.19.4@sha256:eafbafb1793ca04cb73a8f9b22841ca194b404699aab3cfeaf34fa8949961044
    environment:
      DB_TYPE: postgres
      DB_HOST: endurain_db_1
      DB_PORT: 5432
      DB_PASSWORD: endurain
      SECRET_KEY: ${APP_PASSWORD}
      BEHIND_PROXY: "true"
      TRUSTED_PROXIES: ${NETWORK_IP}/16
      RATE_LIMIT_STORAGE_URI: redis://:${APP_ENDURAIN_REDIS_PASSWORD}@endurain_redis_1:6379/0
      AUTH_SECURITY_STORAGE_URI: redis://:${APP_ENDURAIN_REDIS_PASSWORD}@endurain_redis_1:6379/0
    env_file:
      - ${APP_DATA_DIR}/settings.env
    volumes:
      - ${APP_DATA_DIR}/data/app:/app/backend/data
      - ${APP_DATA_DIR}/data/logs:/app/backend/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  db:
    image: postgres:17.4@sha256:4aed4b0525233308fc5de1b8d47f92326460d598dc5f004d14b41f183360b4e9
    user: "1000:1000"
    environment:
      POSTGRES_PASSWORD: endurain
      POSTGRES_DB: endurain
      POSTGRES_USER: endurain
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ${APP_DATA_DIR}/data/db:/var/lib/postgresql/data
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U endurain"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${APP_ENDURAIN_REDIS_PASSWORD}"]
    environment:
      REDISCLI_AUTH: ${APP_ENDURAIN_REDIS_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data/redis:/data
    restart: on-failure
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
