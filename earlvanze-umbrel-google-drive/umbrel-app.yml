manifestVersion: 1.1
id: earlvanze-umbrel-google-drive
category: files
name: Google Drive Client
version: "0.1.0"
tagline: rclone bisync Google Drive client for Umbrel
description: >-
  A Google Drive client for Umbrel powered by rclone bisync. Mirrors your
  Google Drive into /home/umbrel/umbrel/home/GoogleDrive and back, with a
  built-in web dashboard: a file browser for the local mirror (upload,
  download, preview, rename, delete, create folders) and a configuration page
  for the bisync pair (remote, paths, workdir, flags) plus one-click sync
  runs with a live log. Uses the existing rclone config on the host
  (~/.config/rclone/rclone.conf) and never modifies it.
