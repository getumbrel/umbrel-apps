name: Rowflare
version: "0.1.0"
tagline: Open-source Airtable alternative for your own server
description: >-
  First run: open Rowflare and sign up. The first account you create becomes the owner of this instance. After that, sign-up is closed and other people join through invite links you create in Settings.


  Rowflare is an open-source, Airtable-style database. Organize data in bases and tables, link records together, and look at the same records in different views. Everything is stored locally on your Umbrel.


  Features:

  - Grid, kanban, calendar, timeline, gallery and form views

  - 20 field types, including linked records, lookups, rollups, formulas, attachments and AI fields

  - Formulas in the Airtable formula language

  - Real-time collaboration with undo and redo

  - Automations triggered by record changes, schedules, dates, webhooks or buttons

  - Dashboards with number, bar, line, pie and summary widgets

  - Import from CSV, or directly from Airtable with a personal access token

  - REST API modeled on the Airtable Web API, and an MCP server for AI clients, both using personal access tokens

  - Workspaces with owner, editor and viewer roles


  The REST API (/api/v1), the MCP server (/mcp) and automation webhooks (/api/hooks) can be reached without an Umbrel login so that scripts and AI clients can connect; they require a Rowflare personal access token or webhook token.
