services:
  app_proxy:
    environment:
      APP_HOST: rowflare_web_1
      APP_PORT: 8787
      # Token-authenticated integration endpoints (REST API, MCP server, automation webhooks).
      # Rowflare checks a personal access token or webhook token on each of these paths.
      PROXY_AUTH_WHITELIST: "/api/v1/*,/mcp,/mcp/*,/api/hooks/*"

  web:
    image: rowflare/rowflare:sha-d7a4683@sha256:381e645cd7a377bbfde8a4215ce40b6a500cffea611223ad6437058c86e0e5c7
    restart: on-failure
    environment:
      MODE: selfhost
      # The first account created becomes the owner; after that people join by invite.
      ALLOW_SIGNUP: "false"
      # Encrypts AI service keys and SMTP/Resend credentials that workspace owners save.
      SECRET_KEY: ${APP_SEED}
    volumes:
      - ${APP_DATA_DIR}/data/rowflare:/data
