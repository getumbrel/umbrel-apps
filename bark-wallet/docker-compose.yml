version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: bark-wallet_web_1
      APP_PORT: 8080

  web:
    image: secondark/bark-web:0.8.0@sha256:c7ee6f6f92bc0e67d98dc0336ec85d4a3ac96e323cd8fb758175747532e1bcae
    restart: on-failure
    stop_grace_period: 1m
    depends_on:
      - api
      - barkd

  api:
    image: secondark/bark-web-api:0.8.0@sha256:2ccf75c99873e99182d61f64cd2d9ff03fb376812bbc9a9e43abd10d9afc38ab
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data/wallet:/wallet-data:ro
    environment:
      PORT: 4001
      WALLET_DIR: /wallet-data/.bark
      WALLET_DATA_PATH: /Apps/bark-wallet/data/wallet/.bark/
      # We usually use the full Umbrel container name here, but the web image's bundled nginx config also proxies to barkd.
      BARKD_URL: http://barkd:4000
      ARK_SERVER: https://ark.second.tech
      CHAIN_SOURCE: https://mempool.second.tech/api
      BARK_NETWORK: mainnet
    depends_on:
      - barkd

  barkd:
    image: secondark/bark:0.6.2@sha256:30a91f2c31a16ec7d1a4d7744989ff2113fd003febb75aedfe2449db9133e671
    # Fix bind mount ownership, then drop to UID 1000 so the API can read barkd's auth token.
    user: "0:0"
    restart: on-failure
    stop_grace_period: 1m
    # Enable the mnemonic endpoint for Bark Web's seed reveal flow.
    # User-facing access is gated by Umbrel authentication.
    command: >
      sh -c "mkdir -p /data/.bark
      && chown -R 1000:1000 /data
      && exec setpriv --reuid 1000 --regid 1000 --clear-groups /usr/local/bin/barkd --port 4000 --host 0.0.0.0 --datadir /data/.bark --expose-mnemonic"
    volumes:
      - ${APP_DATA_DIR}/data/wallet:/data
