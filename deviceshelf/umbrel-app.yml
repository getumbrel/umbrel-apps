manifestVersion: 1
id: deviceshelf
category: networking
name: DeviceShelf
version: "1.9.6"
tagline: See every device on your network, what it is, and what it has open
description: >-
  ⚠️ Paid software with a 7-day trial. See the note at the end.


  DeviceShelf scans your LAN and keeps an inventory of what is on it: vendor,
  hostname, operating system, device type, open ports and the services behind
  them. It runs entirely on your Umbrel — no account, and nothing about your
  network leaves the box unless you switch on one of the optional lookups.


  It alerts on new devices, on devices dropping offline and on newly opened
  ports, through ntfy, Gotify, a webhook or any of the ~120 Apprise targets. A
  digest mode keeps a rebooting switch from producing forty notifications.


  Favourites and infrastructure are published to Home Assistant over MQTT
  discovery and arrive as native entities with presence, IP and latency, plus an
  event entity for new_device, device_online, device_offline and new_port. Only
  the MQTT integration is needed, no add-on or custom component.


  Devices on other VLANs can be inventoried by reading the ARP tables of your
  routers and switches over SNMP, without an agent on each segment.


  💶 LICENCE


  DeviceShelf costs €59 once — no subscription — and the same licence covers the
  desktop apps for macOS, Windows and Linux and the mobile apps. A 7-day trial
  runs without a licence and without a card. Enter a licence under Settings.
