version: "3.7"

services:
  web:
    image: ghcr.io/music-assistant/server:2.10.0@sha256:c3790e837cfb9d5618026c36e36117d5c482711c88a3747a957123cb01c1d101
    restart: on-failure
    user: "1000:1000"
    environment:
      XDG_CACHE_HOME: /data/.cache
      TORCH_HOME: /data/.cache/torch
    # Network mode must be set to host for MA to work correctly
    network_mode: host
    # UI at data/settings.json defined port 8896
    # Streamserver at default port 8078
    # Sendspin at default port 8927
    volumes:
      - ${APP_DATA_DIR}/data:/data/
      - ${UMBREL_ROOT}/data/storage/downloads:/media
    # privileged caps (and security-opt) needed to mount smb folders within the container
    cap_add:
      - SYS_ADMIN
      - DAC_READ_SEARCH
    security_opt:
      - apparmor=unconfined
