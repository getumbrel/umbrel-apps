version: "3.7"

services:
  web:
    image: ghcr.io/music-assistant/server:2.10.1@sha256:e6edefe825b1cdc50223c16d9bc2fca909a158b36555a7763512b76ba04a1b9e
    restart: on-failure
    user: "1000:1000"
    environment:
      XDG_CACHE_HOME: /data/.cache
      TORCH_HOME: /data/.cache/torch
    # Network mode must be set to host for MA to work correctly
    network_mode: host
    # UI at data/settings.json defined port 8896
    # Streamserver at default port 8078
    # Sendspin at default port 8927
    volumes:
      - ${APP_DATA_DIR}/data:/data/
      - ${UMBREL_ROOT}/data/storage/downloads:/media
    # privileged caps (and security-opt) needed to mount smb folders within the container
    cap_add:
      - SYS_ADMIN
      - DAC_READ_SEARCH
    security_opt:
      - apparmor=unconfined
