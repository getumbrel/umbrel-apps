manifestVersion: 1
id: ghostfolio
storage:
  dataRoot: data
category: finance
name: Ghostfolio
version: "3.86.0"
tagline: Manage your wealth like a boss
description: >-
  Ghostfolio is a privacy-first, open source dashboard for your personal finances.
  

  Break down your asset allocation, know your net worth and make solid, data-driven
  investment decisions.


  Protect your assets. Refine your personal investment strategy.

  
  Ghostfolio empowers busy people to keep track of stocks, ETFs or cryptocurrencies
  without being tracked.
backupIgnore:
  - data/redis/*
developer: Ghostfolio
website: https://ghostfol.io/
dependencies: []
repo: https://github.com/ghostfolio/ghostfolio
support: https://github.com/ghostfolio/ghostfolio/discussions
port: 3334
gallery:
  - 1.jpg
  - 2.jpg
  - 3.jpg
path: ""
deterministicPassword: false
torOnly: false
releaseNotes: >-
  This update includes import and portfolio fixes:
    - Adds support for pasting a file in the activity import dialog
    - Improves the registration stepper and admin client labels
    - Improves German localization
    - Fixes the missing platform icon in the activity import preview
    - Fixes activity-page and dividend-timeline date range start dates
    - Fixes the Manage Asset Profile link in the holding detail dialog before a holding has loaded


  Full release notes can be found at https://github.com/ghostfolio/ghostfolio/releases/tag/3.86.0
submitter: BeauAgst
submission: https://github.com/getumbrel/umbrel-apps/pull/396
