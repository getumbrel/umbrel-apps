manifestVersion: 1
id: ghostfolio
storage:
  dataRoot: data
category: finance
name: Ghostfolio
version: "3.89.0"
tagline: Manage your wealth like a boss
description: >-
  Ghostfolio is a privacy-first, open source dashboard for your personal finances.
  

  Break down your asset allocation, know your net worth and make solid, data-driven
  investment decisions.


  Protect your assets. Refine your personal investment strategy.

  
  Ghostfolio empowers busy people to keep track of stocks, ETFs or cryptocurrencies
  without being tracked.
backupIgnore:
  - data/redis/*
developer: Ghostfolio
website: https://ghostfol.io/
dependencies: []
repo: https://github.com/ghostfolio/ghostfolio
support: https://github.com/ghostfolio/ghostfolio/discussions
port: 3334
gallery:
  - 1.jpg
  - 2.jpg
  - 3.jpg
path: ""
deterministicPassword: false
torOnly: false
releaseNotes: >-
  This update improves portfolio management and usability:
    - Improves the layout of account settings on mobile
    - Keeps the activities page in place when canceling an import
    - Improves loading feedback when importing files
    - Speeds up historical market data in the admin control panel
    - Fixes date picker localization in the FIRE calculator and asset details
    - Improves accessibility of logos and the About page


  Existing MCP access with permission to create activities also gains permission to update account balances when upgrading from versions before 3.88.0.


  Full release notes can be found at https://github.com/ghostfolio/ghostfolio/releases/tag/3.89.0
submitter: BeauAgst
submission: https://github.com/getumbrel/umbrel-apps/pull/396
