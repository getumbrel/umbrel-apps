manifestVersion: 1
id: ghostfolio
storage:
  dataRoot: data
category: finance
name: Ghostfolio
version: "3.85.0"
tagline: Manage your wealth like a boss
description: >-
  Ghostfolio is a privacy-first, open source dashboard for your personal finances.
  

  Break down your asset allocation, know your net worth and make solid, data-driven
  investment decisions.


  Protect your assets. Refine your personal investment strategy.

  
  Ghostfolio empowers busy people to keep track of stocks, ETFs or cryptocurrencies
  without being tracked.
backupIgnore:
  - data/redis/*
developer: Ghostfolio
website: https://ghostfol.io/
dependencies: []
repo: https://github.com/ghostfolio/ghostfolio
support: https://github.com/ghostfolio/ghostfolio/discussions
port: 3334
gallery:
  - 1.jpg
  - 2.jpg
  - 3.jpg
path: ""
deterministicPassword: false
torOnly: false
releaseNotes: >-
  This update includes activity import and portfolio fixes:
    - Adds a user setting for enabling experimental Ghostfolio AI
    - Shows the client used for each user's last request in the admin users table
    - Removes the deprecated SymbolProfile field from the activity creation API
    - Fixes the analysis investment timeline start date
    - Fixes experimental Ghostfolio AI activity-import matching for assets and accounts
    - Fixes activity updates changing asset class details for asset profiles that belong to another user


  Full release notes can be found at https://github.com/ghostfolio/ghostfolio/releases/tag/3.85.0
submitter: BeauAgst
submission: https://github.com/getumbrel/umbrel-apps/pull/396
