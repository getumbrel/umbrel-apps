manifestVersion: 1
id: ghostfolio
category: finance
name: Ghostfolio
version: "3.48.1"
tagline: Manage your wealth like a boss
description: >-
  Ghostfolio is a privacy-first, open source dashboard for your personal finances.
  

  Break down your asset allocation, know your net worth and make solid, data-driven
  investment decisions.


  Protect your assets. Refine your personal investment strategy.

  
  Ghostfolio empowers busy people to keep track of stocks, ETFs or cryptocurrencies
  without being tracked.
backupIgnore:
  - data/redis/*
developer: Ghostfolio
website: https://ghostfol.io/
dependencies: []
repo: https://github.com/ghostfolio/ghostfolio
support: https://github.com/ghostfolio/ghostfolio/discussions
port: 3334
gallery:
  - 1.jpg
  - 2.jpg
  - 3.jpg
path: ""
deterministicPassword: false
torOnly: false
releaseNotes: >-
  This release includes improvements and fixes:
    - Added quantity details to the accounts tab of the holding detail dialog
    - Improved the performance of the X-ray page
    - Refined impersonation mode to resolve the impersonated user once per request
    - Restricted impersonation-mode data and user settings changes to the authenticated user
    - Fixed allocation, account aggregation, currency, benchmark, and restricted-view display issues in impersonation mode


  Full release notes can be found at https://github.com/ghostfolio/ghostfolio/releases/tag/3.48.1
submitter: BeauAgst
submission: https://github.com/getumbrel/umbrel-apps/pull/396
