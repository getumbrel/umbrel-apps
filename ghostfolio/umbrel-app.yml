manifestVersion: 1
id: ghostfolio
storage:
  dataRoot: data
category: finance
name: Ghostfolio
version: "3.84.2"
tagline: Manage your wealth like a boss
description: >-
  Ghostfolio is a privacy-first, open source dashboard for your personal finances.
  

  Break down your asset allocation, know your net worth and make solid, data-driven
  investment decisions.


  Protect your assets. Refine your personal investment strategy.

  
  Ghostfolio empowers busy people to keep track of stocks, ETFs or cryptocurrencies
  without being tracked.
backupIgnore:
  - data/redis/*
developer: Ghostfolio
website: https://ghostfol.io/
dependencies: []
repo: https://github.com/ghostfolio/ghostfolio
support: https://github.com/ghostfolio/ghostfolio/discussions
port: 3334
gallery:
  - 1.jpg
  - 2.jpg
  - 3.jpg
path: ""
deterministicPassword: false
torOnly: false
releaseNotes: >-
  This update includes import, performance, and portfolio fixes:
    - Adds an experimental Ghostfolio AI endpoint for reading activities from CSV, JPEG, PDF, or PNG files
    - Extends experimental Ghostfolio AI imports to support more broker CSV files, images, and PDFs
    - Extends experimental MCP portfolio sharing with view and manage permissions
    - Improves historical market data query performance and German localization
    - Fixes negative-UTC-offset date ranges in analysis and benchmark comparison views
    - Fixes account values when filtering by non-liquidity asset classes


  Full release notes can be found at https://github.com/ghostfolio/ghostfolio/releases/tag/3.84.2
submitter: BeauAgst
submission: https://github.com/getumbrel/umbrel-apps/pull/396
