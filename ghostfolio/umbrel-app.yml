manifestVersion: 1
id: ghostfolio
storage:
  dataRoot: data
category: finance
name: Ghostfolio
version: "3.83.0"
tagline: Manage your wealth like a boss
description: >-
  Ghostfolio is a privacy-first, open source dashboard for your personal finances.
  

  Break down your asset allocation, know your net worth and make solid, data-driven
  investment decisions.


  Protect your assets. Refine your personal investment strategy.

  
  Ghostfolio empowers busy people to keep track of stocks, ETFs or cryptocurrencies
  without being tracked.
backupIgnore:
  - data/redis/*
developer: Ghostfolio
website: https://ghostfol.io/
dependencies: []
repo: https://github.com/ghostfolio/ghostfolio
support: https://github.com/ghostfolio/ghostfolio/discussions
port: 3334
gallery:
  - 1.jpg
  - 2.jpg
  - 3.jpg
path: ""
deterministicPassword: false
torOnly: false
releaseNotes: >-
  This update includes performance and analysis improvements:
    - Adds an experimental yearly grouping view to the analysis performance timeline
    - Extends the portfolio performance API with yearly grouping support
    - Improves benchmark comparisons when benchmark market data starts later than the portfolio
    - Improves historical market data performance by loading only the requested asset profiles
    - Fixes custom asset profile creation for symbols using the reserved GF_ prefix
    - Fixes horizontal overflow on the mobile home overview tab
    - Improves Chinese localization


  Full release notes can be found at https://github.com/ghostfolio/ghostfolio/releases/tag/3.83.0
submitter: BeauAgst
submission: https://github.com/getumbrel/umbrel-apps/pull/396
