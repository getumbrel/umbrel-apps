manifestVersion: 1
id: ghostfolio
storage:
  dataRoot: data
category: finance
name: Ghostfolio
version: "3.82.0"
tagline: Manage your wealth like a boss
description: >-
  Ghostfolio is a privacy-first, open source dashboard for your personal finances.
  

  Break down your asset allocation, know your net worth and make solid, data-driven
  investment decisions.


  Protect your assets. Refine your personal investment strategy.

  
  Ghostfolio empowers busy people to keep track of stocks, ETFs or cryptocurrencies
  without being tracked.
backupIgnore:
  - data/redis/*
developer: Ghostfolio
website: https://ghostfol.io/
dependencies: []
repo: https://github.com/ghostfolio/ghostfolio
support: https://github.com/ghostfolio/ghostfolio/discussions
port: 3334
gallery:
  - 1.jpg
  - 2.jpg
  - 3.jpg
path: ""
deterministicPassword: false
torOnly: false
releaseNotes: >-
  This update includes fixes for portfolio analysis and performance calculations:
    - Fixes the missing first data point in the portfolio evolution chart
    - Fixes calendar-year date range calculations for time zones with a negative UTC offset
    - Fixes missing list numbers in top and bottom holdings on Safari
    - Refreshes the cryptocurrency list and improves Spanish localization
    - Adds FAQ information for Interactive Brokers activity imports


  Full release notes can be found at https://github.com/ghostfolio/ghostfolio/releases/tag/3.82.0
submitter: BeauAgst
submission: https://github.com/getumbrel/umbrel-apps/pull/396
