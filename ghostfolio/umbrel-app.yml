manifestVersion: 1
id: ghostfolio
category: finance
name: Ghostfolio
version: "3.42.0"
tagline: Manage your wealth like a boss
description: >-
  Ghostfolio is a privacy-first, open source dashboard for your personal finances.
  

  Break down your asset allocation, know your net worth and make solid, data-driven
  investment decisions.


  Protect your assets. Refine your personal investment strategy.

  
  Ghostfolio empowers busy people to keep track of stocks, ETFs or cryptocurrencies
  without being tracked.
backupIgnore:
  - data/redis/*
developer: Ghostfolio
website: https://ghostfol.io/
dependencies: []
repo: https://github.com/ghostfolio/ghostfolio
support: https://github.com/ghostfolio/ghostfolio/discussions
port: 3334
gallery:
  - 1.jpg
  - 2.jpg
  - 3.jpg
path: ""
deterministicPassword: false
torOnly: false
releaseNotes: >-
  This release includes improvements and fixes:
    - Collapsed the holdings and cash breakdowns by default in the portfolio summary
    - Extended the Exclude from Analysis tag from accounts to activities
    - Improved assistant search performance by reusing cached portfolio snapshots
    - Improved validation for manual asset profile imports and custom asset profiles in the admin control panel
    - Fixed fuzzy search for holdings in the assistant


  Full release notes can be found at https://github.com/ghostfolio/ghostfolio/releases/tag/3.42.0
submitter: BeauAgst
submission: https://github.com/getumbrel/umbrel-apps/pull/396
