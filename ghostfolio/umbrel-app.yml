manifestVersion: 1
id: ghostfolio
category: finance
name: Ghostfolio
version: "3.46.0"
tagline: Manage your wealth like a boss
description: >-
  Ghostfolio is a privacy-first, open source dashboard for your personal finances.
  

  Break down your asset allocation, know your net worth and make solid, data-driven
  investment decisions.


  Protect your assets. Refine your personal investment strategy.

  
  Ghostfolio empowers busy people to keep track of stocks, ETFs or cryptocurrencies
  without being tracked.
backupIgnore:
  - data/redis/*
developer: Ghostfolio
website: https://ghostfol.io/
dependencies: []
repo: https://github.com/ghostfolio/ghostfolio
support: https://github.com/ghostfolio/ghostfolio/discussions
port: 3334
gallery:
  - 1.jpg
  - 2.jpg
  - 3.jpg
path: ""
deterministicPassword: false
torOnly: false
releaseNotes: >-
  This release includes improvements and fixes:
    - Added automatic Draft tags for activities dated in the future
    - Extended Draft tags to custom asset profile buy activities
    - Updated account activity counts to include draft activities
    - Fixed account dividend and interest totals by excluding draft activities
    - Improved German localization and upgraded bull-board
    - Fixed unknown country names in Financial Modeling Prep and Trackinsight data


  Full release notes can be found at https://github.com/ghostfolio/ghostfolio/releases/tag/3.46.0
submitter: BeauAgst
submission: https://github.com/getumbrel/umbrel-apps/pull/396
