manifestVersion: 1
id: ghostfolio
storage:
  dataRoot: data
category: finance
name: Ghostfolio
version: "3.81.0"
tagline: Manage your wealth like a boss
description: >-
  Ghostfolio is a privacy-first, open source dashboard for your personal finances.
  

  Break down your asset allocation, know your net worth and make solid, data-driven
  investment decisions.


  Protect your assets. Refine your personal investment strategy.

  
  Ghostfolio empowers busy people to keep track of stocks, ETFs or cryptocurrencies
  without being tracked.
backupIgnore:
  - data/redis/*
developer: Ghostfolio
website: https://ghostfol.io/
dependencies: []
repo: https://github.com/ghostfolio/ghostfolio
support: https://github.com/ghostfolio/ghostfolio/discussions
port: 3334
gallery:
  - 1.jpg
  - 2.jpg
  - 3.jpg
path: ""
deterministicPassword: false
torOnly: false
releaseNotes: >-
  This release includes improvements and fixes:
    - Moved total-return performance calculation, including dividends, out of experimental status
    - Improved German and Turkish translations
    - Fixed visibility of asset class, asset sub class, fee, and quantity fields in the create activity dialog
    - Fixed portfolio performance calculations for net percentage and calendar-year date ranges
    - Fixed a security-headers CSP issue with the Ghostfolio data provider status check


  Full release notes can be found at https://github.com/ghostfolio/ghostfolio/releases/tag/3.81.0
submitter: BeauAgst
submission: https://github.com/getumbrel/umbrel-apps/pull/396
