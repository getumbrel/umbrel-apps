manifestVersion: 1
id: ghostfolio
storage:
  dataRoot: data
category: finance
name: Ghostfolio
version: "3.87.0"
tagline: Manage your wealth like a boss
description: >-
  Ghostfolio is a privacy-first, open source dashboard for your personal finances.
  

  Break down your asset allocation, know your net worth and make solid, data-driven
  investment decisions.


  Protect your assets. Refine your personal investment strategy.

  
  Ghostfolio empowers busy people to keep track of stocks, ETFs or cryptocurrencies
  without being tracked.
backupIgnore:
  - data/redis/*
developer: Ghostfolio
website: https://ghostfol.io/
dependencies: []
repo: https://github.com/ghostfolio/ghostfolio
support: https://github.com/ghostfolio/ghostfolio/discussions
port: 3334
gallery:
  - 1.jpg
  - 2.jpg
  - 3.jpg
path: ""
deterministicPassword: false
torOnly: false
releaseNotes: >-
  This update improves portfolio analysis and fixes account balance handling:
    - Highlights negative values in the experimental performance timeline chart
    - Improves AI-assisted activity imports to prefer assets already in your holdings
    - Includes ISINs in experimental portfolio AI prompts and MCP portfolio results
    - Improves account balance date validation and fixes per-user balance uniqueness
    - Fixes authentication when the browser time zone is unavailable
    - Improves German localization


  Full release notes can be found at https://github.com/ghostfolio/ghostfolio/releases/tag/3.87.0
submitter: BeauAgst
submission: https://github.com/getumbrel/umbrel-apps/pull/396
