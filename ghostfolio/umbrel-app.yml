manifestVersion: 1
id: ghostfolio
storage:
  dataRoot: data
category: finance
name: Ghostfolio
version: "3.88.0"
tagline: Manage your wealth like a boss
description: >-
  Ghostfolio is a privacy-first, open source dashboard for your personal finances.
  

  Break down your asset allocation, know your net worth and make solid, data-driven
  investment decisions.


  Protect your assets. Refine your personal investment strategy.

  
  Ghostfolio empowers busy people to keep track of stocks, ETFs or cryptocurrencies
  without being tracked.
backupIgnore:
  - data/redis/*
developer: Ghostfolio
website: https://ghostfol.io/
dependencies: []
repo: https://github.com/ghostfolio/ghostfolio
support: https://github.com/ghostfolio/ghostfolio/discussions
port: 3334
gallery:
  - 1.jpg
  - 2.jpg
  - 3.jpg
path: ""
deterministicPassword: false
torOnly: false
releaseNotes: >-
  This update adds portfolio analysis options and improves market data handling:
    - Adds an experimental Return on Investment (ROI) performance calculation
    - Adds an experimental MCP tool for updating account cash balances
    - Improves ISIN searches with Financial Modeling Prep
    - Fixes investment chart bar alignment and data provider mappings
    - Improves accessibility on login and registration screens


  Existing MCP access with permission to create activities also gains permission to update account balances.


  Full release notes can be found at https://github.com/ghostfolio/ghostfolio/releases/tag/3.88.0
submitter: BeauAgst
submission: https://github.com/getumbrel/umbrel-apps/pull/396
