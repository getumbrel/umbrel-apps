manifestVersion: 1
id: havewa
category: finance
name: HaVeWa
version: "0.3.0"
tagline: Property management for rentals and HOAs
description: >-
  HaVeWa is property-management software for rental and HOA (WEG, the German form of
  condominium ownership) administration, in one app with its own PostgreSQL.


  The first visit opens a setup wizard that creates the administrator and the management
  company. There is no default login.


  🏠 PROPERTIES AND PEOPLE


  - Properties, units, people and meters, with custom fields and documents

  - Leases with stepped and index rent, deposits and deposit accounts

  - Tenant and owner portals


  💶 MONEY


  - Charges, payments, open items, SEPA mandates and dunning, with a portfolio-wide dunning view

  - Service-charge statements with a BetrKV allocation engine

  - camt.053 import and DATEV/SEPA export, management fees, insurance and property tax


  🏛️ HOA (WEG)


  - Co-ownership shares, economic plan, HOA fees, annual statement and reserves

  - Owners' meetings with agenda, voting and the §24 resolution collection


  🔧 THE REST


  - Maintenance tickets with workflow and time tracking, contractors and service intervals

  - Templates and mail merge, a report manager, a calendar and an outbox

  - A REST API and an MCP server with per-user tokens, so an AI agent works under the same
    permissions a person has

  - Multi-tenant, role-based, and bilingual: German and English
