releaseNotes: >-
  This update brings Formicaio to v0.8.9, which adapts to recent changes in the
  ant-node binary, fixes several issues, and upgrades dependencies:

  - Metrics now use 'System mode' by default, since current ant-node releases no longer serve the HTTP metrics endpoint. Existing installs set to HTTP are switched over automatically; a 'Disabled' setting is left unchanged
  - Dashboard no longer shows misleading zeros for Connected Peers, kBuckets Peers, Network Size, Shunned By and Relevant Chunks; these fields are hidden and the remaining stat cards are laid out in a single row
  - Fixed chunk counting on arm64, which now reads the correct amount from the node's chunks database
  - Chunk counting supports ant-node's upcoming file-based chunk store
  - Adapted to ant-node v0.14.3+ dropping the --bootstrap-cache-dir argument
  - MCP server updated for the latest MCP SDK changes
  - Dependencies upgraded across the board
