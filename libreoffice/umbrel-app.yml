manifestVersion: 2.0
id: libreoffice
storage:
  dataRoot: data
category: files
name: LibreOffice
version: "25.8.7"
tagline: Do more - easier, quicker, smarter
description: >-
  LibreOffice is a free and powerful office suite, and a successor to OpenOffice.org (commonly known as OpenOffice). Its clean interface and feature-rich tools help you unleash your creativity and enhance your productivity.


  LibreOffice includes several applications that make it the most versatile Free and Open Source office suite on the market: Writer (word processing), Calc (spreadsheets), Impress (presentations), Draw (vector graphics and flowcharts), Base (databases), and Math (formula editing).
developer:  The Document Foundation
website: https://www.libreoffice.org/
dependencies: []
repo: https://www.libreoffice.org/about-us/source-code/
support: https://www.libreoffice.org/get-help/community-support/
port: 5001
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
  - 4.webp
path: ""
requiresHttps: true
defaultUsername: ""
defaultPassword: ""
torOnly: false
submitter: Pranshu Agrawal
submission: https://github.com/getumbrel/umbrel-apps/pull/216
releaseNotes: >-
  This update brings LibreOffice from 7.6 to 25.8, covering four major releases of new features, improved Microsoft Office compatibility, and performance and security fixes.


  LibreOffice now streams to your browser with a new, smoother web desktop, and it opens over HTTPS. It now starts on a desktop with launchers for Writer, Calc, Impress and the other apps. Your documents and settings are kept.


  After this update LibreOffice may show a one-time "personal settings are locked" message. Choose Yes to continue. This also fixes the message that used to show after every restart.


  Full release notes are available at https://wiki.documentfoundation.org/ReleaseNotes/25.8
