version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: libreoffice_server_1
      APP_PORT: 3000

  server:
    image: linuxserver/libreoffice:25.8.7@sha256:cd95f41ecfc36dab3af29eb9dba21271a0d828dc512f2c46294cf3341e0cd0c3
    hostname: libreoffice
    restart: on-failure
    stop_grace_period: 1m
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
    shm_size: "1gb"
