manifestVersion: 1
id: mailflow
storage:
  dataRoot: data
category: networking
name: MailFlow
version: "3.5.7"
tagline: Unified self-hosted webmail client
description: >-
  MailFlow is a self-hosted unified webmail client. Connect multiple IMAP/SMTP
  accounts such as Gmail, iCloud, Outlook, or custom mail servers and read them
  in one web interface.


  It includes a unified inbox, search, compose/reply/forward, folder navigation,
  multiple themes, user management, SSO/OIDC support, and Microsoft 365 OAuth2
  support.
releaseNotes: >-
  This update improves MailFlow's behavior with connection-limited mail providers
  such as Yahoo, including more polite IMAP session use for message bodies, flag
  changes, folder checks, and retry backoff.


  It also fixes duplicate-message handling when the same email is delivered to
  multiple connected accounts, improves cache safety for providers that return
  inconsistent folder listings, adds keyboard triage shortcuts, and unwraps
  genuine 33Mail alias-forwarded messages so the original sender is shown.


  Full release notes can be found at https://github.com/maathimself/mailflow/releases/tag/v3.5.7

developer: maathimself
website: https://mailflow.sh
repo: https://github.com/maathimself/mailflow
support: https://github.com/maathimself/mailflow/issues
port: 3395
