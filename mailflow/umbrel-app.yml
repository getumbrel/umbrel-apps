manifestVersion: 1
id: mailflow
storage:
  dataRoot: data
category: networking
name: MailFlow
version: "4.0.0"
tagline: Unified self-hosted webmail client
description: >-
  MailFlow is a self-hosted unified webmail client. Connect multiple IMAP/SMTP
  accounts such as Gmail, iCloud, Outlook, or custom mail servers and read them
  in one web interface.


  It includes a unified inbox, search, compose/reply/forward, folder navigation,
  multiple themes, user management, SSO/OIDC support, and Microsoft 365 OAuth2
  support.
releaseNotes: >-
  This update adds dark email bodies, a unified Snoozed view, mailbox emoji icons,
  notification-preserving inbox rules, and easier navigation between messages.


  Remote images now load through your MailFlow server instead of your browser,
  with tracking-image blocking and faster image delivery. Security fixes improve
  email sanitization, session privacy, contact-photo handling, and private-network
  protections.


  CardDAV now works through the bundled web server. Contacts apps using passwords
  can no longer sign in when SSO-only or required two-factor authentication is enabled.


  It also improves threading, draft images, attachments, synchronization, and mobile
  layouts. Dark email bodies are enabled by default in dark themes; you can turn
  them off under Settings → Appearance → Theme.


  Full release notes can be found at https://github.com/maathimself/mailflow/releases/tag/v4.0.0

developer: maathimself
website: https://mailflow.sh
repo: https://github.com/maathimself/mailflow
support: https://github.com/maathimself/mailflow/issues
port: 3395
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
path: ""
defaultUsername: ""
defaultPassword: ""
dependencies: []
