manifestVersion: 1
id: mailflow
storage:
  dataRoot: data
category: networking
name: MailFlow
version: "4.3.0"
tagline: Unified self-hosted webmail client
description: >-
  MailFlow is a self-hosted unified webmail client. Connect multiple IMAP/SMTP
  accounts such as Gmail, iCloud, Outlook, or custom mail servers and read them
  in one web interface.


  It includes a unified inbox, search, compose/reply/forward, folder navigation,
  multiple themes, user management, SSO/OIDC support, and Microsoft 365 OAuth2
  support.
releaseNotes: >-
  Reload open MailFlow tabs after updating.


  - Create scoped personal API tokens for scripts and tools. An administrator must enable tokens first; tokens cannot send or delete mail or change settings.
  - Linking a single sign-on provider now requires additional confirmation to protect your account.
  - Reopened drafts retain their attachments, and the session-authenticated draft API now supports attachments.
  - Deleting an Inbox conversation no longer permanently deletes its messages already in Trash.
  - Improved Gmail message identity across labels and sign-in after an expired screen-lock session.


  Since version 4.0, contacts apps using passwords can no longer sign in through
  CardDAV when SSO-only or required two-factor authentication is enabled.


  Full release notes can be found at https://github.com/maathimself/mailflow/releases/tag/v4.3.0

developer: maathimself
