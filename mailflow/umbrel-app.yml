manifestVersion: 1
id: mailflow
category: networking
name: MailFlow
version: "3.4.1"
tagline: Unified self-hosted webmail client
description: >-
  MailFlow is a self-hosted unified webmail client. Connect multiple IMAP/SMTP
  accounts such as Gmail, iCloud, Outlook, or custom mail servers and read them
  in one web interface.


  It includes a unified inbox, search, compose/reply/forward, folder navigation,
  multiple themes, user management, SSO/OIDC support, and Microsoft 365 OAuth2
  support.
releaseNotes: >-
  Google OAuth support can now connect Gmail and Google Workspace mailboxes
  without app passwords, and the unified inbox can use a selected default sender.


  Folder/message counts now come from the IMAP server, drafts autosave more
  reliably, and Settings > About includes a diagnostics report for sync issues.


  Fixes improve Gmail self-sent mail handling, folder/account deletion recovery,
  mobile wake resync, search errors, background inbox-rule sweeps, thread-wide
  read/move/delete actions, and email sanitization security.
