manifestVersion: 1
id: mailflow
category: networking
name: MailFlow
version: "3.1.1"
tagline: Unified self-hosted webmail client
description: >-
  MailFlow is a self-hosted unified webmail client. Connect multiple IMAP/SMTP
  accounts such as Gmail, iCloud, Outlook, or custom mail servers and read them
  in one web interface.


  It includes a unified inbox, search, compose/reply/forward, folder navigation,
  multiple themes, user management, SSO/OIDC support, and Microsoft 365 OAuth2
  support.
releaseNotes: >-
  MailFlow 3.1.1 improves reliability for users with many accounts or difficult
  network paths.


  Message lists no longer show duplicate copies of the same email after a message
  is re-synced, and background snippet indexing now backs off cleanly when a mail
  server limits simultaneous IMAP connections.


  MailFlow can now automatically retry over IPv4 when a broken IPv6 path stalls an
  IMAP TLS handshake.


  This release also adds an optional per-host persistent IMAP connection limit for
  providers that cap the number of always-on connections.
