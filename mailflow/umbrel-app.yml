manifestVersion: 1
id: mailflow
category: networking
name: MailFlow
version: "3.0.0"
tagline: Unified self-hosted webmail client
description: >-
  MailFlow is a self-hosted unified webmail client. Connect multiple IMAP/SMTP
  accounts such as Gmail, iCloud, Outlook, or custom mail servers and read them
  in one web interface.


  It includes a unified inbox, search, compose/reply/forward, folder navigation,
  multiple themes, user management, SSO/OIDC support, and Microsoft 365 OAuth2
  support.
releaseNotes: >-
  MailFlow 3.0.0 adds a new plugin system, with GTD moved into the first bundled
  plugin and per-user plugin controls in Settings.


  This release adds Windows XP and Windows Classic retro themes, plus detached
  message windows for opening multiple messages in movable, resizable desktop
  windows.


  Attachment downloads now handle non-ASCII filenames correctly, and sent-mail
  copies use CRLF line endings for better compatibility with strict IMAP servers.


  The GTD plugin migration is automatic for existing users, with no manual upgrade
  steps required.
