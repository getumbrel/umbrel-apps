manifestVersion: 1
id: mailflow
storage:
  dataRoot: data
category: networking
name: MailFlow
version: "4.5.1"
tagline: Unified self-hosted webmail client
description: >-
  MailFlow is a self-hosted unified webmail client. Connect multiple IMAP/SMTP
  accounts such as Gmail, iCloud, Outlook, or custom mail servers and read them
  in one web interface.


  It includes a unified inbox, search, compose/reply/forward, folder navigation,
  multiple themes, user management, SSO/OIDC support, and Microsoft 365 OAuth2
  support.
releaseNotes: >-
  If upgrading from before 4.4, reload open MailFlow tabs and sign in again after the update.
  Single sign-on users with a MailFlow authenticator will be asked for its code.


  - New mail appears more reliably when a VPN or proxy silently drops an open tab's connection.
  - Reduced connection usage improves reliability with Gmail and Zoho mailboxes.
  - Dragging mail onto another account's folder now leaves it in place and explains why.
  - Fixed inbox rules failing to move mail when all available connections are busy.


  Existing HTML-only mail is indexed in the background after the update; large mailboxes may take a few minutes.


  Since version 4.0, contacts apps using passwords can no longer sign in through
  CardDAV when SSO-only or required two-factor authentication is enabled.


  Full release notes can be found at https://github.com/maathimself/mailflow/releases/tag/v4.5.1

developer: maathimself
