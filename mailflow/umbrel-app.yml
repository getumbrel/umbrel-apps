manifestVersion: 1
id: mailflow
storage:
  dataRoot: data
category: networking
name: MailFlow
version: "4.5.0"
tagline: Unified self-hosted webmail client
description: >-
  MailFlow is a self-hosted unified webmail client. Connect multiple IMAP/SMTP
  accounts such as Gmail, iCloud, Outlook, or custom mail servers and read them
  in one web interface.


  It includes a unified inbox, search, compose/reply/forward, folder navigation,
  multiple themes, user management, SSO/OIDC support, and Microsoft 365 OAuth2
  support.
releaseNotes: >-
  If upgrading from before 4.4, reload open MailFlow tabs and sign in again after the update.
  Single sign-on users with a MailFlow authenticator will be asked for its code.


  - Organize messages with colored tags and apply labels across accounts using inbox rules.
  - Save reusable composer snippets with the Templates plugin.
  - Receive new-mail notifications through optional outgoing webhooks.
  - Search full HTML-only message bodies and find more Gmail messages.
  - Choose how long to stay signed in and use a 12-hour or 24-hour clock.
  - Improved unread counts, search pagination, folder synchronization, and inbox loading.


  Existing HTML-only mail is indexed in the background after the update; large mailboxes may take a few minutes.


  Since version 4.0, contacts apps using passwords can no longer sign in through
  CardDAV when SSO-only or required two-factor authentication is enabled.


  Full release notes can be found at https://github.com/maathimself/mailflow/releases/tag/v4.5.0

developer: maathimself
website: https://mailflow.sh
repo: https://github.com/maathimself/mailflow
support: https://github.com/maathimself/mailflow/issues
port: 3395
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
path: ""
defaultUsername: ""
defaultPassword: ""
dependencies: []
submitter: yakitori
submission: https://github.com/getumbrel/umbrel-apps/pull/5737
