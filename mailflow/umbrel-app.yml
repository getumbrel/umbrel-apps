manifestVersion: 1
id: mailflow
category: networking
name: MailFlow
version: "2.7.1"
tagline: Unified self-hosted webmail client
description: >-
  MailFlow is a self-hosted unified webmail client. Connect multiple IMAP/SMTP
  accounts such as Gmail, iCloud, Outlook, or custom mail servers and read them
  in one web interface.


  It includes a unified inbox, search, compose/reply/forward, folder navigation,
  multiple themes, user management, SSO/OIDC support, and Microsoft 365 OAuth2
  support.
releaseNotes: >-
  MailFlow 2.7.1 improves connection stability so PurelyMail accounts stay
  connected and new mail refreshes after devices wake from sleep.


  This release fixes attached HTML/text files disappearing from the attachment
  list and improves light-mode admin toggle visibility.


  It also includes dependency and security hardening.


  No manual upgrade steps are required.
