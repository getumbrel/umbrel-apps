manifestVersion: 1
id: mailflow
category: networking
name: MailFlow
version: "2.8.0"
tagline: Unified self-hosted webmail client
description: >-
  MailFlow is a self-hosted unified webmail client. Connect multiple IMAP/SMTP
  accounts such as Gmail, iCloud, Outlook, or custom mail servers and read them
  in one web interface.


  It includes a unified inbox, search, compose/reply/forward, folder navigation,
  multiple themes, user management, SSO/OIDC support, and Microsoft 365 OAuth2
  support.
releaseNotes: >-
  MailFlow 2.8.0 lets self-hosters configure external PostgreSQL or Redis
  services, custom database ports, and bundled database container ownership while
  keeping existing defaults unchanged.


  Non-admin users can now connect Microsoft/Outlook accounts after an
  administrator configures the Microsoft OAuth integration.


  This release also fixes mobile compose overflow with tall signatures, makes
  bulk/keyboard archive actions update message lists immediately, and improves
  popover alignment under font scaling.


  No manual upgrade steps are required.
