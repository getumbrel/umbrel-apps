manifestVersion: 1
id: mailflow
storage:
  dataRoot: data
category: networking
name: MailFlow
version: "4.4.0"
tagline: Unified self-hosted webmail client
description: >-
  MailFlow is a self-hosted unified webmail client. Connect multiple IMAP/SMTP
  accounts such as Gmail, iCloud, Outlook, or custom mail servers and read them
  in one web interface.


  It includes a unified inbox, search, compose/reply/forward, folder navigation,
  multiple themes, user management, SSO/OIDC support, and Microsoft 365 OAuth2
  support.
releaseNotes: >-
  You will be signed out once after updating. Reload open MailFlow tabs and sign in again.
  Single sign-on users with a MailFlow authenticator will now be asked for its code.


  - Fixed security issues that could bypass two-factor sign-in through recovery email or single sign-on.
  - Changing a recovery email now requires confirmation, and administrators can indicate when an identity provider already enforces multi-factor authentication.
  - MailFlow now runs without Redis, with sessions and temporary data stored in PostgreSQL.
  - Added spam controls on phones and clearer folder-search scope.
  - Improved the composer toolbar, large-text menus, message-list layout, and Proton Mail Bridge message previews.


  Since version 4.0, contacts apps using passwords can no longer sign in through
  CardDAV when SSO-only or required two-factor authentication is enabled.


  Full release notes can be found at https://github.com/maathimself/mailflow/releases/tag/v4.4.0

developer: maathimself
website: https://mailflow.sh
repo: https://github.com/maathimself/mailflow
support: https://github.com/maathimself/mailflow/issues
port: 3395
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
path: ""
defaultUsername: ""
defaultPassword: ""
dependencies: []
