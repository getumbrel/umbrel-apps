manifestVersion: 1
id: mailflow
category: networking
name: MailFlow
version: "3.2.4"
tagline: Unified self-hosted webmail client
description: >-
  MailFlow is a self-hosted unified webmail client. Connect multiple IMAP/SMTP
  accounts such as Gmail, iCloud, Outlook, or custom mail servers and read them
  in one web interface.


  It includes a unified inbox, search, compose/reply/forward, folder navigation,
  multiple themes, user management, SSO/OIDC support, and Microsoft 365 OAuth2
  support.
releaseNotes: >-
  MailFlow 3.2 adds a beta Mailbox Cleanup tab that helps analyze bulk-mail
  bloat and safely move selected sender mail to Trash.


  This update also improves spam-folder syncing, message permalinks, on-behalf-of
  sender details, configurable OIDC account matching, and settings window
  behavior.


  Reliability fixes improve large-folder empty/mark-read operations, metadata
  preservation when moving or archiving mail, forwarded-attachment handling,
  session-scoped preference saves, and cleaner API error handling.
