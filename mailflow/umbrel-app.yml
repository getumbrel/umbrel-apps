manifestVersion: 1
id: mailflow
category: networking
name: MailFlow
version: "3.1.3"
tagline: Unified self-hosted webmail client
description: >-
  MailFlow is a self-hosted unified webmail client. Connect multiple IMAP/SMTP
  accounts such as Gmail, iCloud, Outlook, or custom mail servers and read them
  in one web interface.


  It includes a unified inbox, search, compose/reply/forward, folder navigation,
  multiple themes, user management, SSO/OIDC support, and Microsoft 365 OAuth2
  support.
releaseNotes: >-
  MailFlow 3.1.3 improves Gmail and multi-account reliability.


  Sent-message import now self-heals for some Gmail accounts where a saved folder
  mapping pointed at a non-selectable parent folder.


  Startup connection bursts across multiple accounts on the same provider are now
  smoothed out, and IPv4 fallback avoids extra retries when a mail server is
  refusing connections because of provider limits.


  This release also continues improving duplicate-message cleanup in unified
  message lists.
