manifestVersion: 1
id: mailflow
storage:
  dataRoot: data
category: networking
name: MailFlow
version: "4.0.3"
tagline: Unified self-hosted webmail client
description: >-
  MailFlow is a self-hosted unified webmail client. Connect multiple IMAP/SMTP
  accounts such as Gmail, iCloud, Outlook, or custom mail servers and read them
  in one web interface.


  It includes a unified inbox, search, compose/reply/forward, folder navigation,
  multiple themes, user management, SSO/OIDC support, and Microsoft 365 OAuth2
  support.
releaseNotes: >-
  Reload open MailFlow tabs after updating.


  - Admins can now control AI access per user, with server-enforced access and feature settings. Existing users keep AI access until an admin turns it off.
  - Crafted emails no longer freeze the browser during AI actions.
  - Newsletter images display correctly in email bodies, and browser translation works again.
  - Copying text from emails no longer carries unwanted page colors into the composer.
  - Trash and Spam folder confirmations now match their sidebar names.


  Since version 4.0, contacts apps using passwords can no longer sign in through
  CardDAV when SSO-only or required two-factor authentication is enabled.


  Full release notes can be found at https://github.com/maathimself/mailflow/releases/tag/v4.0.3

developer: maathimself
website: https://mailflow.sh
repo: https://github.com/maathimself/mailflow
support: https://github.com/maathimself/mailflow/issues
port: 3395
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
path: ""
defaultUsername: ""
defaultPassword: ""
dependencies: []
submitter: yakitori
submission: https://github.com/getumbrel/umbrel-apps/pull/5737
