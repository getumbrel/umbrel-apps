manifestVersion: 1
id: mailflow
storage:
  dataRoot: data
category: networking
name: MailFlow
version: "3.5.2"
tagline: Unified self-hosted webmail client
description: >-
  MailFlow is a self-hosted unified webmail client. Connect multiple IMAP/SMTP
  accounts such as Gmail, iCloud, Outlook, or custom mail servers and read them
  in one web interface.


  It includes a unified inbox, search, compose/reply/forward, folder navigation,
  multiple themes, user management, SSO/OIDC support, and Microsoft 365 OAuth2
  support.
releaseNotes: >-
  This update fixes subject and sender decoding for messages that use non-UTF-8
  charsets, prevents unrelated messages with matching subjects from being merged
  into one conversation, and keeps active sessions signed in instead of expiring
  after a fixed seven days.


  It also fixes the mark-unread icon and expands attachment safety warnings for
  bulk downloads, trailing-dot filenames, and more executable file types.


  Full release notes can be found at https://github.com/maathimself/mailflow/releases/tag/v3.5.2
developer: maathimself
website: https://mailflow.sh
repo: https://github.com/maathimself/mailflow
support: https://github.com/maathimself/mailflow/issues
port: 3395
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
path: ""
defaultUsername: ""
defaultPassword: ""
dependencies: []
submitter: yakitori
submission: https://github.com/getumbrel/umbrel-apps/pull/5737
