manifestVersion: 1
id: mailflow
storage:
  dataRoot: data
category: networking
name: MailFlow
version: "3.9.0"
tagline: Unified self-hosted webmail client
description: >-
  MailFlow is a self-hosted unified webmail client. Connect multiple IMAP/SMTP
  accounts such as Gmail, iCloud, Outlook, or custom mail servers and read them
  in one web interface.


  It includes a unified inbox, search, compose/reply/forward, folder navigation,
  multiple themes, user management, SSO/OIDC support, and Microsoft 365 OAuth2
  support.
releaseNotes: >-
  This release adds reply-draft markers, a per-message signature toggle, admin
  user-management tools, and better rendering for messages with broken HTML.


  Security fixes now require signed-in live-update websocket sessions, keep screen
  lock active across reloads until the server confirms the lock, and cancel old
  password-reset links when a recovery email changes.


  It also fixes plain-text rich mail rendering, mistyped 2FA-disable passwords
  signing users out, and undo send restoring automatic Cc/Bcc addresses.


  Full release notes can be found at https://github.com/maathimself/mailflow/releases/tag/v3.9.0

developer: maathimself
website: https://mailflow.sh
repo: https://github.com/maathimself/mailflow
support: https://github.com/maathimself/mailflow/issues
port: 3395
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
path: ""
defaultUsername: ""
defaultPassword: ""
dependencies: []
submitter: yakitori
submission: https://github.com/getumbrel/umbrel-apps/pull/5737
