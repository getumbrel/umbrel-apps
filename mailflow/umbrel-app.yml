manifestVersion: 1
id: mailflow
storage:
  dataRoot: data
category: networking
name: MailFlow
version: "3.5.9"
tagline: Unified self-hosted webmail client
description: >-
  MailFlow is a self-hosted unified webmail client. Connect multiple IMAP/SMTP
  accounts such as Gmail, iCloud, Outlook, or custom mail servers and read them
  in one web interface.


  It includes a unified inbox, search, compose/reply/forward, folder navigation,
  multiple themes, user management, SSO/OIDC support, and Microsoft 365 OAuth2
  support.
releaseNotes: >-
  This update improves reliability for connection-limited providers such as Yahoo,
  reducing repeated IMAP logins and backoff churn during background sync.


  It also reduces unnecessary PostgreSQL writes for servers without CONDSTORE,
  fixes Strato reconciliation, SMTP EHLO host identification, LAN OIDC issuer
  handling, and draft autosave overwrites, and adds message-list quality-of-life
  improvements such as undo shortcuts, modifier-click multi-select, customizable
  hover actions, bulk starring, and .eml downloads.


  Full release notes can be found at https://github.com/maathimself/mailflow/releases/tag/v3.5.9

developer: maathimself
