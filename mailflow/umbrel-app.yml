manifestVersion: 1
id: mailflow
storage:
  dataRoot: data
category: networking
name: MailFlow
version: "3.5.4"
tagline: Unified self-hosted webmail client
description: >-
  MailFlow is a self-hosted unified webmail client. Connect multiple IMAP/SMTP
  accounts such as Gmail, iCloud, Outlook, or custom mail servers and read them
  in one web interface.


  It includes a unified inbox, search, compose/reply/forward, folder navigation,
  multiple themes, user management, SSO/OIDC support, and Microsoft 365 OAuth2
  support.
releaseNotes: >-
  This update improves MailFlow's IMAP connection handling so slow message loads
  or provider refusals are less likely to stall syncing, deleting mail, folder
  checks, or other account work.


  It also improves backoff for rejected credentials and background connection
  refusals, avoids repeated retries for messages a server lists but will not send,
  and shows clearer mail-server error details in logs.


  Full release notes can be found at https://github.com/maathimself/mailflow/releases/tag/v3.5.4

developer: maathimself
website: https://mailflow.sh
repo: https://github.com/maathimself/mailflow
support: https://github.com/maathimself/mailflow/issues
port: 3395
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
path: ""
defaultUsername: ""
defaultPassword: ""
dependencies: []
submitter: yakitori
