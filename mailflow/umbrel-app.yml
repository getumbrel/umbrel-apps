manifestVersion: 1
id: mailflow
storage:
  dataRoot: data
category: networking
name: MailFlow
version: "3.5.8"
tagline: Unified self-hosted webmail client
description: >-
  MailFlow is a self-hosted unified webmail client. Connect multiple IMAP/SMTP
  accounts such as Gmail, iCloud, Outlook, or custom mail servers and read them
  in one web interface.


  It includes a unified inbox, search, compose/reply/forward, folder navigation,
  multiple themes, user management, SSO/OIDC support, and Microsoft 365 OAuth2
  support.
releaseNotes: >-
  This update adds native MailFlow desktop app builds for Windows, macOS, and
  Linux, with release-update notifications in the desktop apps.


  It also fixes the profile dialog on phones, adds a standard X-Mailer header to
  outgoing mail and rule forwards for better deliverability with strict hosts,
  and adds Brazilian Portuguese translations for layout and folder-name UI.


  Full release notes can be found at https://github.com/maathimself/mailflow/releases/tag/v3.5.8

developer: maathimself
website: https://mailflow.sh
repo: https://github.com/maathimself/mailflow
support: https://github.com/maathimself/mailflow/issues
port: 3395
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
path: ""
defaultUsername: ""
defaultPassword: ""
dependencies: []
submitter: yakitori
submission: https://github.com/getumbrel/umbrel-apps/pull/5737
