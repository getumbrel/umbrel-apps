manifestVersion: 1
id: mailflow
storage:
  dataRoot: data
category: networking
name: MailFlow
version: "3.8.3"
tagline: Unified self-hosted webmail client
description: >-
  MailFlow is a self-hosted unified webmail client. Connect multiple IMAP/SMTP
  accounts such as Gmail, iCloud, Outlook, or custom mail servers and read them
  in one web interface.


  It includes a unified inbox, search, compose/reply/forward, folder navigation,
  multiple themes, user management, SSO/OIDC support, and Microsoft 365 OAuth2
  support.
releaseNotes: >-
  This release adds undo send, forwarding messages as attachments, and per-sender
  or per-domain inbox category rules.


  Security fixes now prevent STARTTLS email sends from falling back to plain text,
  stop signed-out devices from receiving new-mail notifications, and reject large
  signed-out requests before their bodies are read.


  It also fixes deletes from folders with names like "drafts" or "trash" skipping
  the real Trash folder, forward-rule loops, failed-login backfill retries, OpenAI
  non-streaming calls, keyboard shortcuts, unread counts for collapsed folders,
  snooze behavior, and several UI issues.


  Full release notes can be found at https://github.com/maathimself/mailflow/releases/tag/v3.8.3

developer: maathimself
website: https://mailflow.sh
repo: https://github.com/maathimself/mailflow
support: https://github.com/maathimself/mailflow/issues
port: 3395
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
path: ""
defaultUsername: ""
defaultPassword: ""
dependencies: []
submitter: yakitori
submission: https://github.com/getumbrel/umbrel-apps/pull/5737
