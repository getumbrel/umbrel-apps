manifestVersion: 1
id: mailflow
storage:
  dataRoot: data
category: networking
name: MailFlow
version: "4.2.0"
tagline: Unified self-hosted webmail client
description: >-
  MailFlow is a self-hosted unified webmail client. Connect multiple IMAP/SMTP
  accounts such as Gmail, iCloud, Outlook, or custom mail servers and read them
  in one web interface.


  It includes a unified inbox, search, compose/reply/forward, folder navigation,
  multiple themes, user management, SSO/OIDC support, and Microsoft 365 OAuth2
  support.
releaseNotes: >-
  Reload open MailFlow tabs after updating.


  - Sort folders by date, sender, or subject, and optionally keep starred messages on top.
  - A new List first layout gives the message list the full window.
  - Category tabs and the Drafts sidebar now show message totals.
  - Fixed account ordering after reload, undoing actions after switching folders, and focusing Cc and Bcc fields.
  - Improved sign-in provider management and security logging. Password resets now remove linked providers when password sign-in is enabled.


  Since version 4.0, contacts apps using passwords can no longer sign in through
  CardDAV when SSO-only or required two-factor authentication is enabled.


  Full release notes can be found at https://github.com/maathimself/mailflow/releases/tag/v4.2.0

developer: maathimself
website: https://mailflow.sh
repo: https://github.com/maathimself/mailflow
support: https://github.com/maathimself/mailflow/issues
port: 3395
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
path: ""
defaultUsername: ""
defaultPassword: ""
dependencies: []
submitter: yakitori
