manifestVersion: 1
id: mailflow
category: networking
name: MailFlow
version: "3.1.4"
tagline: Unified self-hosted webmail client
description: >-
  MailFlow is a self-hosted unified webmail client. Connect multiple IMAP/SMTP
  accounts such as Gmail, iCloud, Outlook, or custom mail servers and read them
  in one web interface.


  It includes a unified inbox, search, compose/reply/forward, folder navigation,
  multiple themes, user management, SSO/OIDC support, and Microsoft 365 OAuth2
  support.
releaseNotes: >-
  MailFlow 3.1.4 fixes threading and background indexing issues.


  Sent messages now stay attached to the conversations they reply to instead of
  appearing as separate duplicate threads, and existing orphaned sent copies
  self-heal on the next folder sync.


  The snippet background indexer now stops repeatedly reprocessing messages that
  cannot produce a preview, reducing stuck indexing loops.
developer: maathimself
website: https://mailflow.sh
