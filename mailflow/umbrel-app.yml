manifestVersion: 1
id: mailflow
storage:
  dataRoot: data
category: networking
name: MailFlow
version: "3.4.2-patch.1"
tagline: Unified self-hosted webmail client
description: >-
  MailFlow is a self-hosted unified webmail client. Connect multiple IMAP/SMTP
  accounts such as Gmail, iCloud, Outlook, or custom mail servers and read them
  in one web interface.


  It includes a unified inbox, search, compose/reply/forward, folder navigation,
  multiple themes, user management, SSO/OIDC support, and Microsoft 365 OAuth2
  support.
releaseNotes: >-
  This update adds support for new storage management and configuration options being introduced with umbrelOS 2.0.


  Previous MailFlow 3.4.2 release notes:


  Drafts no longer gain a duplicate signature each time they are reopened, and
  attachment-only messages no longer display decoded binary content as the body.


  Move-to-folder pickers now show searchable parent paths, and inbox rules show
  the selected move destination more clearly.


  No action is required after upgrading. Reload any open MailFlow tab to pick up
  the new frontend.
developer: maathimself
