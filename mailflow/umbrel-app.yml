manifestVersion: 1
id: mailflow
storage:
  dataRoot: data
category: networking
name: MailFlow
version: "4.1.0"
tagline: Unified self-hosted webmail client
description: >-
  MailFlow is a self-hosted unified webmail client. Connect multiple IMAP/SMTP
  accounts such as Gmail, iCloud, Outlook, or custom mail servers and read them
  in one web interface.


  It includes a unified inbox, search, compose/reply/forward, folder navigation,
  multiple themes, user management, SSO/OIDC support, and Microsoft 365 OAuth2
  support.
releaseNotes: >-
  Reload open MailFlow tabs after updating.


  - Schedule emails to send later, even with your browser closed, and manage them in the new Scheduled view.
  - Open messages faster and use consistent action buttons in conversations.
  - Fixed duplicate sends, Delete forever removing the wrong message, and unreliable moves on some mail servers.
  - Improved new-mail syncing, unread counts, reconnecting after sleep, and Microsoft account connection errors.
  - Strengthened ownership checks and validation of encrypted credentials.


  Since version 4.0, contacts apps using passwords can no longer sign in through
  CardDAV when SSO-only or required two-factor authentication is enabled.


  Full release notes can be found at https://github.com/maathimself/mailflow/releases/tag/v4.1.0

developer: maathimself
website: https://mailflow.sh
repo: https://github.com/maathimself/mailflow
support: https://github.com/maathimself/mailflow/issues
port: 3395
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
path: ""
defaultUsername: ""
defaultPassword: ""
dependencies: []
submitter: yakitori
