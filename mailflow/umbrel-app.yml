manifestVersion: 1
id: mailflow
category: networking
name: MailFlow
version: "3.3.0"
tagline: Unified self-hosted webmail client
description: >-
  MailFlow is a self-hosted unified webmail client. Connect multiple IMAP/SMTP
  accounts such as Gmail, iCloud, Outlook, or custom mail servers and read them
  in one web interface.


  It includes a unified inbox, search, compose/reply/forward, folder navigation,
  multiple themes, user management, SSO/OIDC support, and Microsoft 365 OAuth2
  support.
releaseNotes: >-
  Mailbox Cleanup can now archive selected sender mail instead of only moving it
  to Trash, and GTD classification actions can be safely undone from the context
  menu or with Ctrl/Cmd+Z.


  This update also adds a sanitized diagnostics report in Settings > About, makes
  AI summaries follow the interface language, adds the full per-message menu on
  mobile, and adds Czech translation support.


  Fixes improve AI provider testing with reasoning models, sidebar folder
  nesting, context-menu positioning, bulk-move picker positioning, and repeated
  email-link clicks.
