manifestVersion: 1
id: mailflow
storage:
  dataRoot: data
category: networking
name: MailFlow
version: "3.7.1"
tagline: Unified self-hosted webmail client
description: >-
  MailFlow is a self-hosted unified webmail client. Connect multiple IMAP/SMTP
  accounts such as Gmail, iCloud, Outlook, or custom mail servers and read them
  in one web interface.


  It includes a unified inbox, search, compose/reply/forward, folder navigation,
  multiple themes, user management, SSO/OIDC support, and Microsoft 365 OAuth2
  support.
releaseNotes: >-
  This update adds a built-in PDF and image attachment viewer, conversation-view
  message actions, one GTD state per conversation, more GTD keyboard shortcuts,
  sign-in password visibility, and admin profile photos.


  It also fixes several mail-safety issues around GTD labels, Done actions,
  replies, and servers without UIDPLUS, plus refused-recipient reporting, Google
  Contacts syncing, GitHub notification threads behind reverse proxies, favorite
  names in Move pickers, connection-error details, AI reply language, GTD
  summaries on labeled copies, and GTD-only message handling.


  Full release notes can be found at https://github.com/maathimself/mailflow/releases/tag/v3.7.1

developer: maathimself
website: https://mailflow.sh
repo: https://github.com/maathimself/mailflow
support: https://github.com/maathimself/mailflow/issues
port: 3395
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
path: ""
defaultUsername: ""
defaultPassword: ""
dependencies: []
submitter: yakitori
