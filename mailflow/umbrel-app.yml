manifestVersion: 1
id: mailflow
storage:
  dataRoot: data
category: networking
name: MailFlow
version: "4.0.4"
tagline: Unified self-hosted webmail client
description: >-
  MailFlow is a self-hosted unified webmail client. Connect multiple IMAP/SMTP
  accounts such as Gmail, iCloud, Outlook, or custom mail servers and read them
  in one web interface.


  It includes a unified inbox, search, compose/reply/forward, folder navigation,
  multiple themes, user management, SSO/OIDC support, and Microsoft 365 OAuth2
  support.
releaseNotes: >-
  Reload open MailFlow tabs after updating.


  - More embedded email images now display correctly instead of appearing as broken attachments. Previously opened messages are fetched again once to repair their images.
  - Unrelated receipts, alerts, and notifications are no longer grouped into one conversation. Existing conversations are automatically split where needed during the update.
  - AI actions receive cleaner message text, and applying suggestions preserves paragraph breaks without turning markup into formatting.
  - Pasting into signatures and quoted replies no longer carries unwanted page colors.
  - Fixed conversation-view right-click errors and the attachment preview toolbar on phones.


  Since version 4.0, contacts apps using passwords can no longer sign in through
  CardDAV when SSO-only or required two-factor authentication is enabled.


  Full release notes can be found at https://github.com/maathimself/mailflow/releases/tag/v4.0.4

developer: maathimself
website: https://mailflow.sh
repo: https://github.com/maathimself/mailflow
support: https://github.com/maathimself/mailflow/issues
port: 3395
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
path: ""
defaultUsername: ""
defaultPassword: ""
dependencies: []
