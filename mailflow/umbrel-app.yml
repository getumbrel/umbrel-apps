manifestVersion: 1
id: mailflow
storage:
  dataRoot: data
category: networking
name: MailFlow
version: "3.6.0"
tagline: Unified self-hosted webmail client
description: >-
  MailFlow is a self-hosted unified webmail client. Connect multiple IMAP/SMTP
  accounts such as Gmail, iCloud, Outlook, or custom mail servers and read them
  in one web interface.


  It includes a unified inbox, search, compose/reply/forward, folder navigation,
  multiple themes, user management, SSO/OIDC support, and Microsoft 365 OAuth2
  support.
releaseNotes: >-
  This update changes a few defaults: the Default sender setting now applies to
  every new message, the new System theme follows your OS light/dark setting, the
  first-visit login screen uses your browser language when available, and nested
  special folders such as Sent, Drafts, Trash, Junk, and Archive are shown at the
  top level in the sidebar.


  It also fixes Yahoo read-state and unread-count syncing on reused connections,
  restores desktop .eml downloads, fixes download failures for some long emoji
  subjects, prevents browser translation from breaking the app, and avoids mail
  loss when moving or deleting messages in several edge cases.


  Full release notes can be found at https://github.com/maathimself/mailflow/releases/tag/v3.6.0

developer: maathimself
website: https://mailflow.sh
repo: https://github.com/maathimself/mailflow
support: https://github.com/maathimself/mailflow/issues
port: 3395
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
path: ""
defaultUsername: ""
defaultPassword: ""
dependencies: []
