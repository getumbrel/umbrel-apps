manifestVersion: 1
id: mailflow
storage:
  dataRoot: data
category: networking
name: MailFlow
version: "3.8.1"
tagline: Unified self-hosted webmail client
description: >-
  MailFlow is a self-hosted unified webmail client. Connect multiple IMAP/SMTP
  accounts such as Gmail, iCloud, Outlook, or custom mail servers and read them
  in one web interface.


  It includes a unified inbox, search, compose/reply/forward, folder navigation,
  multiple themes, user management, SSO/OIDC support, and Microsoft 365 OAuth2
  support.
releaseNotes: >-
  This security update fixes additional denial-of-service issues where emails with
  inline images or slow-to-build previews could stall incoming mail processing.


  It also fixes a folder rename issue that could delete messages marked as
  deleted by another mail app, and improves conversation view layout and
  navigation on phones.


  Full release notes can be found at https://github.com/maathimself/mailflow/releases/tag/v3.8.1

developer: maathimself
website: https://mailflow.sh
repo: https://github.com/maathimself/mailflow
support: https://github.com/maathimself/mailflow/issues
port: 3395
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
path: ""
defaultUsername: ""
defaultPassword: ""
dependencies: []
submitter: yakitori
submission: https://github.com/getumbrel/umbrel-apps/pull/5737
