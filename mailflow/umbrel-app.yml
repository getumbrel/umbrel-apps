manifestVersion: 1
id: mailflow
storage:
  dataRoot: data
category: networking
name: MailFlow
version: "4.0.5"
tagline: Unified self-hosted webmail client
description: >-
  MailFlow is a self-hosted unified webmail client. Connect multiple IMAP/SMTP
  accounts such as Gmail, iCloud, Outlook, or custom mail servers and read them
  in one web interface.


  It includes a unified inbox, search, compose/reply/forward, folder navigation,
  multiple themes, user management, SSO/OIDC support, and Microsoft 365 OAuth2
  support.
releaseNotes: >-
  Reload open MailFlow tabs after updating.


  - Connect personal Outlook.com and Hotmail accounts without registering your own Microsoft app. Work and school accounts still require your own app.
  - A new account chooser and clearer connection errors make adding and reconnecting mailboxes easier.
  - Email provider settings have moved to the admin-only Email providers page; existing settings are preserved.
  - GTD state chips now appear in the inbox, and GTD states lead the move picker. Fixed conversations returning after Done and messages becoming unread again.
  - Includes security updates for email sanitization, address parsing, and request handling.


  Since version 4.0, contacts apps using passwords can no longer sign in through
  CardDAV when SSO-only or required two-factor authentication is enabled.


  Full release notes can be found at https://github.com/maathimself/mailflow/releases/tag/v4.0.5

developer: maathimself
website: https://mailflow.sh
repo: https://github.com/maathimself/mailflow
support: https://github.com/maathimself/mailflow/issues
port: 3395
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
path: ""
defaultUsername: ""
defaultPassword: ""
dependencies: []
submitter: yakitori
