version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: mailflow_frontend_1
      APP_PORT: 80

  frontend:
    image: ghcr.io/maathimself/mailflow-frontend:4.5.1@sha256:bda596d18aabb510a3e88d82871e5b709914666c2ee5347e58e2169f2c9ba1c1
    restart: on-failure
    stop_grace_period: 1m
    environment:
      TLS_MODE: "off"
      BACKEND_HOST: mailflow_backend_1
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO/dev/null http://127.0.0.1:2080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  backend:
    image: ghcr.io/maathimself/mailflow-backend:4.5.1@sha256:1376df954db75ccd127d6937c24c1bf7f4183fc4e141f75b66e22c9bd2dc1998
    restart: on-failure
    stop_grace_period: 1m
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: "http://${DEVICE_DOMAIN_NAME}:3395"
      FRONTEND_URL: "http://${DEVICE_DOMAIN_NAME}:3395"
      SESSION_SECRET: "${APP_SEED}"
      ENCRYPTION_KEY: "${APP_SEED}"
      DB_HOST: mailflow_postgres_1
      DB_PORT: 5432
      DB_NAME: mailflow
      DB_USER: mailflow
      DB_PASSWORD: mailflow
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
      VAPID_PUBLIC_KEY: ""
      VAPID_PRIVATE_KEY: ""
      VAPID_SUBJECT: ""
      IMAP_MAX_PERSISTENT_PER_HOST: ""
      TRUST_PROXY_HOPS: 2
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    user: "1000:1000"
    restart: on-failure
    environment:
      POSTGRES_DB: mailflow
      POSTGRES_USER: mailflow
      POSTGRES_PASSWORD: mailflow
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailflow -d mailflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
