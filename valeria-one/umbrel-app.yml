manifestVersion: 1
id: valeria-one
category: automation
name: Valeria One
version: "0.67.0"
tagline: The open-source back office for any business
description: >-
  Valeria One is a self-hosted business back office in one app. It gives a small business its whole front desk:
  a website with an online store and online bookings, a CRM with follow-ups and NPS surveys, invoicing (including
  Mexican CFDI 4.0), gift cards, and an AI website assistant that streams its answers and can speak and listen.


  AI, messaging and payments are optional and use your OWN provider accounts (OpenAI/Anthropic/Gemini, Twilio or
  Meta, Stripe, Facturapi) — so there is no per-use cost and nothing phones home. It runs fine with no AI key at all.


  After the app starts, open it and create your admin account from the Server page or a setup link (see the project
  README). Licensed AGPL-3.0.
