manifestVersion: 1
id: nostos
storage:
  dataRoot: data
folderAccess:
  - id: external-media
    name: Books and audiobooks
    note: Optional. Ebooks and audiobooks you already have. Nostos reads them in place and never changes them. After choosing a folder, open Settings, This server, External media in Nostos.
    mounts:
      - service: web
        targetPath: /external/media
        readOnly: true
category: media
name: Nostos
version: "2026.10.25"
tagline: A home for your reading life
description: >-
  Nostos keeps reading, thinking and writing in one place. Collect physical books, EPUBs, PDFs and audiobooks.
  Read or listen in the app, save highlights, notes and whole passages next to the page they came from,
  connect ideas across books, and bring it all into a draft when you are ready to write.


  There is no account to create: Nostos opens straight to your library, protected by your Umbrel login.
  The OPDS catalog for e-reader apps (/opds/) is reachable without the Umbrel login so that readers such as
  KOReader can connect. It is read-only, but anyone who can reach your Umbrel can browse and download your books through it.


  - One library for physical books, EPUB, PDF, TXT, MOBI and audiobooks (MP3, M4A, M4B)

  - Free books built in: Project Gutenberg, Standard Ebooks, Wikisource and LibriVox

  - EPUB and PDF readers and an audiobook player, with highlights, notes and passages

  - The Brain: link ideas with [[Topic]] and follow them back to their source

  - Writing Studio: quote your notes with @ and write in plain Markdown

  - Local backups, and a portable .nostos export you can move to any Nostos
releaseNotes: ""

developer: Christian Gennari
website: https://nostos.page
dependencies: []
repo: https://github.com/Christian-Gennari/Nostos
support: https://github.com/Christian-Gennari/Nostos/issues

port: 5099
gallery: []
path: ""

defaultUsername: ""
defaultPassword: ""

submitter: Christian Gennari
submission: https://github.com/getumbrel/umbrel-apps/pull/0
