manifestVersion: 1
id: datum-verified
category: bitcoin
name: DATUMVerified
version: "1.0.0"
tagline: Verify DATUM Gateway miners in your own Discord and Telegram communities
description: >-
  DATUMVerified runs the DATUM Gateway Discord and Telegram verify bots on your Umbrel. Members prove they own a Bitcoin address, then the bots check that the address is submitting DATUM Gateway shares before granting access.


  Open this app after install and paste your bot tokens in the browser. You can enable Discord, Telegram, or both. The bots stay off until you save settings, then they start on this homeserver and keep rechecking miners every 24 hours.


  A pool outage does not strip access. Access is removed only when every pool answers and none of them still show fresh DATUM shares.


  For Discord, create a bot in the Discord Developer Portal and copy the token, application id, server id, and verified role id into this app. Invite the bot with Manage Roles and keep the bot role above the verified role. Members run /verify, sign a message, and get the role if they are hashing through DATUM Gateway.


  For Telegram, create a bot with BotFather and paste the token here. Add the bot to your community as an admin with Invite users and Ban users. Send /chatid in the community, paste that id here, and save again. Members verify in a private Mini App. Sending stays locked until both checks pass.
