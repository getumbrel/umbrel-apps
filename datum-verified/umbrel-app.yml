manifestVersion: 1
id: datum-verified
category: bitcoin
name: DATUMVerified
version: "1.0.1"
tagline: Verify DATUM Gateway miners in your own Discord and Telegram communities
description: >-
  DATUMVerified runs the DATUM Gateway Discord and Telegram verify bots on your Umbrel. Members prove they own a Bitcoin address, then the bots check that the address is submitting DATUM Gateway shares before granting access.


  Open this app after install and paste your bot tokens in the browser. You can enable Discord, Telegram, or both, and add every Discord server or Telegram community you want to verify. The bots stay off until you save settings, then they start on this homeserver and keep rechecking miners every 24 hours.


  A pool outage does not strip access. Access is removed only when every pool answers and none of them still show fresh DATUM shares.


  For Discord, create one bot in the Discord Developer Portal, invite it into each server with Manage Roles, and add each server id plus verified role id here. Members verify once and get the role in every configured server.


  For Telegram, create one bot with BotFather, add it to each community as an admin with Invite users and Ban users, send /chatid in each community, and add those chat ids here. Members verify once and sending unlocks in every configured chat.
releaseNotes: >-
  Fix settings fields clearing while typing. Status refresh no longer rewrites the form.
