version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: datum-verified_web_1
      APP_PORT: 8080

  web:
    image: ghcr.io/yudikorsou/datum-verified:1.0.1@sha256:9b215e6bec069eb7c227d8febdace7781fd77468a25b88713ac69f244a9fa55c
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    init: true
    environment:
      PORT: 8080
      DATA_DIR: /data
    volumes:
      - ${APP_DATA_DIR}/data:/data

  discord:
    image: ghcr.io/yudikorsou/datum-gateway-verify-bot:922a9a1414fd5de18d2c2f92e31fa9c009085f85@sha256:1e677cfbc8c7865720f0b6677d7c74eac79e23007217db98201420920b34b390
    restart: on-failure
    stop_grace_period: 1m
    init: true
    environment:
      SETTINGS_FILE: /data/settings.json
      DATABASE_PATH: /data/discord/bot.sqlite
    volumes:
      - ${APP_DATA_DIR}/data:/data

  telegram:
    image: ghcr.io/yudikorsou/datum-gateway-telegram-verify-bot:eb49f01c87fa0a83d1beb300e99e1297792d9f2c@sha256:4dcdbeb56d7b9880103449f8cee72d9ad5afb9f8de66b3254229bc06beb8d80a
    restart: on-failure
    stop_grace_period: 1m
    init: true
    environment:
      SETTINGS_FILE: /data/settings.json
      DATABASE_PATH: /data/telegram/bot.sqlite
    volumes:
      - ${APP_DATA_DIR}/data:/data
