version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: ersatztv-legacy_web_1
      APP_PORT: 8409
      PROXY_AUTH_WHITELIST: "/iptv/*,/discover.json,/device.xml,/lineup.json,/lineup_status.json"

  web:
    image: ghcr.io/ersatztv/legacy:v26.14.0@sha256:d1e9085db8e61b4ea42700d473cd918dd71079fab110f26840eabb63b0b0ff60
    restart: on-failure
    user: "1000:1000"
    environment:
      HOME: /config
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${APP_DATA_DIR}/data/transcode:/transcode
      - ${UMBREL_ROOT}/data/storage/downloads:/media:ro
