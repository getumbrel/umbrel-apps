version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: ersatztv-legacy_web_1
      APP_PORT: 8409
      PROXY_AUTH_WHITELIST: "/iptv/*,/discover.json,/device.xml,/lineup.json,/lineup_status.json"

  web:
    image: ghcr.io/ersatztv/legacy:v26.13.0@sha256:834dd0e086ec1fab4fd06bf0c33195c6424cff6636672c051a9fab245b85bc7f
    restart: on-failure
    user: "1000:1000"
    environment:
      HOME: /config
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${APP_DATA_DIR}/data/transcode:/transcode
      - ${UMBREL_ROOT}/data/storage/downloads:/media:ro
