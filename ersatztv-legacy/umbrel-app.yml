manifestVersion: 1
id: ersatztv-legacy
storage:
  dataRoot: data
category: media
name: ErsatzTV Legacy
version: "26.12.0"
tagline: Build your own live TV channels
description: >-
  ErsatzTV Legacy transforms your personal media library into custom live TV channels with IPTV, XMLTV guide data, channel scheduling, and browser playback.


  Connect local media from Umbrel's Downloads folder or libraries from Plex, Jellyfin, and Emby, then create channels that can be watched from IPTV clients, media servers, or a web browser.


  Hardware acceleration can be enabled on supported devices by creating a hardware-accelerated FFmpeg profile in ErsatzTV and assigning it to your channels.


  This package uses the ErsatzTV Legacy release stream, which upstream continues to maintain for security updates while ErsatzTV Next remains an experimental rewrite.
releaseNotes: >-
  All channels now use the Next streaming engine. Existing legacy channels migrate automatically on startup: MPEG-TS (Legacy) becomes MPEG-TS, and HLS Direct becomes HLS Segmenter. Existing legacy playlist and lineup URLs redirect to the Next engine. Check channel playback after updating.


  - Fixes QSV streams failing shortly after playback starts on older Intel GPUs, and improves playback when video color information changes mid-stream.

  - Adds a unified hardware troubleshooting view and clearer hardware-acceleration compatibility warnings in FFmpeg profiles.

  - Fixes disappearing watermarks, subtitle problems during filler playback, and several hardware-encoding failures.

  - Prevents one invalid media item from breaking an entire channel's playout.

  - Applies watermark and decoration changes sooner and reduces unnecessary disk writes when syncing playouts.


  Full release notes can be found at https://github.com/ErsatzTV/legacy/releases/tag/v26.12.0
developer: ErsatzTV
website: https://ersatztv.org
dependencies: []
repo: https://github.com/ErsatzTV/legacy
support: https://discuss.ersatztv.org
port: 8409
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
path: ""
defaultUsername: ""
defaultPassword: ""
backupIgnore:
  - data/transcode/*
permissions:
  - STORAGE_DOWNLOADS
  - GPU
submitter: phelipebf
submission: https://github.com/getumbrel/umbrel-apps/pull/4624
