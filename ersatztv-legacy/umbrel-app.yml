manifestVersion: 1
id: ersatztv-legacy
storage:
  dataRoot: data
category: media
name: ErsatzTV Legacy
version: "26.10.0"
tagline: Build your own live TV channels
description: >-
  ErsatzTV Legacy transforms your personal media library into custom live TV channels with IPTV, XMLTV guide data, channel scheduling, and browser playback.


  Connect local media from Umbrel's Downloads folder or libraries from Plex, Jellyfin, and Emby, then create channels that can be watched from IPTV clients, media servers, or a web browser.


  Hardware acceleration can be enabled on supported devices by creating a hardware-accelerated FFmpeg profile in ErsatzTV and assigning it to your channels.


  This package uses the ErsatzTV Legacy release stream, which upstream continues to maintain for security updates while ErsatzTV Next remains an experimental rewrite.
releaseNotes: >-
  - Adds full graphics engine support for the Next engine, plus new hardware-accelerated QSV and AMF video processing options where supported.
  - Adds automatic cleanup for unused artwork cache files, Dolby Vision and HDR10 metadata probing for local libraries, and music video credits in the playback troubleshooter.
  - Improves Next engine playback pipelines, including deinterlacing, anamorphic scaling, tonemapping, and clearer fallback error output.
  - Fixes Next engine subtitle and AAC encoding issues, playback troubleshooter reliability, `/api/sessions` responses, sequential schedule state restore, Plex tag generation, local library path validation, and remote stream `.yaml` library support.
  - Local libraries with HDR content will be re-scanned once after updating to refresh Dolby Vision and HDR10 metadata.

  Full release notes can be found at https://github.com/ErsatzTV/legacy/releases/tag/v26.10.0
developer: ErsatzTV
website: https://ersatztv.org
dependencies: []
repo: https://github.com/ErsatzTV/legacy
support: https://discuss.ersatztv.org
port: 8409
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
path: ""
defaultUsername: ""
defaultPassword: ""
backupIgnore:
  - data/transcode/*
permissions:
  - STORAGE_DOWNLOADS
  - GPU
submitter: phelipebf
submission: https://github.com/getumbrel/umbrel-apps/pull/4624
