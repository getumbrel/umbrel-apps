manifestVersion: 1
id: ersatztv-legacy
storage:
  dataRoot: data
category: media
name: ErsatzTV Legacy
version: "26.11.0"
tagline: Build your own live TV channels
description: >-
  ErsatzTV Legacy transforms your personal media library into custom live TV channels with IPTV, XMLTV guide data, channel scheduling, and browser playback.


  Connect local media from Umbrel's Downloads folder or libraries from Plex, Jellyfin, and Emby, then create channels that can be watched from IPTV clients, media servers, or a web browser.


  Hardware acceleration can be enabled on supported devices by creating a hardware-accelerated FFmpeg profile in ErsatzTV and assigning it to your channels.


  This package uses the ErsatzTV Legacy release stream, which upstream continues to maintain for security updates while ErsatzTV Next remains an experimental rewrite.
releaseNotes: >-
  - Migrates channels to the Next streaming engine by default while keeping per-channel rollback to the Legacy engine available.
  - Adds Next engine support for rotated phone videos, MPEG-2 video encoding, song playback, frame-rate normalization, and a deep-scan option for local libraries.
  - Updates the bundled ErsatzTV FFmpeg build to 8.1.2-4 and drops ARM32v7 Docker/native support.
  - Improves Next engine stream copying, watermarks, hardware acceleration, playback troubleshooting, scheduling, and media duration handling.
  - Fixes multiple playback and hardware-acceleration issues, Jellyfin 12 collection handling, Docker health warnings on arm64, block schedule skips/repeats, and song background changes.
  - Breaking: custom Next engine channel config overlays must now include `"version": "https://ersatztv.org/channel/version/0.1.0"`; older overlays will be rejected until updated.

  Full release notes can be found at https://github.com/ErsatzTV/legacy/releases/tag/v26.11.0
developer: ErsatzTV
website: https://ersatztv.org
dependencies: []
repo: https://github.com/ErsatzTV/legacy
support: https://discuss.ersatztv.org
port: 8409
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
path: ""
defaultUsername: ""
defaultPassword: ""
backupIgnore:
  - data/transcode/*
permissions:
  - STORAGE_DOWNLOADS
  - GPU
submitter: phelipebf
submission: https://github.com/getumbrel/umbrel-apps/pull/4624
