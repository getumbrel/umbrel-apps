manifestVersion: 1
id: ersatztv-legacy
category: media
name: ErsatzTV Legacy
version: "26.8.1"
tagline: Build your own live TV channels
description: >-
  ErsatzTV Legacy transforms your personal media library into custom live TV channels with IPTV, XMLTV guide data, channel scheduling, and browser playback.


  Connect local media from Umbrel's Downloads folder or libraries from Plex, Jellyfin, and Emby, then create channels that can be watched from IPTV clients, media servers, or a web browser.


  Hardware acceleration can be enabled on supported devices by creating a hardware-accelerated FFmpeg profile in ErsatzTV and assigning it to your channels.


  This package uses the ErsatzTV Legacy release stream, which upstream continues to maintain for security updates while ErsatzTV Next remains an experimental rewrite.
releaseNotes: >-
  - Fixes a security issue affecting linked Plex and Emby media servers; after updating, Plex and Emby users should rotate their ErsatzTV credentials as upstream recommends.
  - Adds a Re-authenticate with Plex button so Plex credentials can be refreshed without recreating media sources.
  - Requires the X-Etv-Api-Key header for all /api requests; custom scripted schedule/API clients must send the key, while the bundled scripted schedule entrypoint handles it automatically.
  - Improves Plex server handling and fixes mirror channels falling out of sync when using the Next streaming engine.

  Full release notes can be found at https://github.com/ErsatzTV/legacy/releases/tag/v26.8.1
developer: ErsatzTV
website: https://ersatztv.org
dependencies: []
repo: https://github.com/ErsatzTV/legacy
support: https://discuss.ersatztv.org
port: 8409
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
path: ""
defaultUsername: ""
defaultPassword: ""
backupIgnore:
  - data/transcode/*
permissions:
  - STORAGE_DOWNLOADS
  - GPU
submitter: phelipebf
submission: https://github.com/getumbrel/umbrel-apps/pull/4624
