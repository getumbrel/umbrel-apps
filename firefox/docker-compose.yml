version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: firefox_server_1
      APP_PORT: 3000

  server:
    image: linuxserver/firefox:1161.0build1-1xtradeb1.2404.1-ls140@sha256:8ab8f9ab356aee2b076209af3004a00bde728a8f6c44adc3b43a494561e56446
    restart: on-failure
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
    shm_size: "1gb"
