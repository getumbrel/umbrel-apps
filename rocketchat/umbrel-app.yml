manifestVersion: 2.0
id: rocketchat
storage:
  dataRoot: data
category: social
name: Rocket.Chat
version: "9.0.0"
tagline: A real-time chat platform for teams
description: >-
  Rocket.Chat is an open source team chat platform. It brings direct messages, group conversations, channels and threads together in one workspace, so conversations stay organized even when many people are involved.


  Share images, videos, voice messages and files, mention teammates, react to messages and search your history. Connect other services with webhooks, integrations and bots, and use the desktop and mobile apps to stay in touch on the go.


  ⚠️ Rocket.Chat needs to reach Rocket.Chat's servers. During setup you register the workspace with a free Rocket.Chat Cloud account, which activates the free Starter plan for up to 50 users. The workspace then sends daily usage statistics to Rocket.Chat (including the server address and user, room and message counts), and switches to read-only if it can't reach them for about 10 days.


  ⚠️ Open Rocket.Chat at umbrel.local:3112. To use it from another address, such as your Umbrel's IP address or Tailscale, first change the Site URL under Administration > Settings > General, otherwise the app stays offline.
releaseNotes: ""
developer: Rocket.Chat
website: https://www.rocket.chat
dependencies: []
repo: https://github.com/RocketChat/Rocket.Chat
support: https://github.com/RocketChat/Rocket.Chat/issues
port: 3112
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
path: ""
requiresHttps: true
defaultUsername: ""
defaultPassword: ""
submitter: dennysubke
submission: https://github.com/getumbrel/umbrel-apps/pull/4192
