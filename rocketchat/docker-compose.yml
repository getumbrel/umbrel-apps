services:
  app_proxy:
    environment:
      APP_HOST: rocketchat_app_1
      APP_PORT: 3000
      # Rocket.Chat has its own login, and the mobile and desktop apps can't use Umbrel's
      PROXY_AUTH_ADD: "false"

  app:
    image: rocketchat/rocket.chat:9.0.0@sha256:ce4f33c7efc0f0cc672ed9c3de46d32d811a4b109df2247817d9a80ba283f415
    restart: on-failure
    environment:
      MONGO_URL: mongodb://rocketchat_db_1:27017/rocketchat?replicaSet=rs0
      ROOT_URL: https://${DEVICE_DOMAIN_NAME}:3112
      PORT: "3000"
      DEPLOY_METHOD: docker
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mongo:8.0.38@sha256:479e85ced54ffb8a40dade1dcde2da2a9ae858515b9415e9cc54bfb8f0575d01
    user: "1000:1000"
    restart: on-failure
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - ${APP_DATA_DIR}/data/db:/data/db
    healthcheck:
      # Also initiates the single-node replica set on first start
      test: >
        echo "try { rs.status() } catch (err) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'rocketchat_db_1:27017' }] }) }"
        | mongosh --quiet
      interval: 10s
      timeout: 30s
      start_period: 0s
      start_interval: 1s
      retries: 30
