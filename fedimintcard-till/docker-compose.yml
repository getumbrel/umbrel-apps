services:
  app_proxy:
    environment:
      APP_HOST: fedimintcard-till_server_1
      APP_PORT: 9878
  server:
    image: ghcr.io/fedimintcard/till:sha-74e63372db0682cef0e05a7335f3fcce35b8423e@sha256:04ed4a2c43aa8195d279567288c4c6bb59eb4686a3445357b28e96435dbcbdeb
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 60s
    environment:
      TILL_POS_PUBLIC_URL: "http://${APP_DOMAIN}:9877"
      TILL_ADMIN_PASSWORD: ${APP_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data/wallet:/data
    ports:
      - "9877:9877/tcp"
