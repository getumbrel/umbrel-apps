manifestVersion: 2.0
id: fedimintcard-till
storage:
  dataRoot: data
environment:
  - name: OPS_URL
    services:
      - server
    default: "https://registry.fedimintcard.org"
    note: >-
      Enter the HTTPS address of your Card 4.0 registry before connecting the till.
      Leave this setting empty to use https://registry.fedimintcard.org.
category: bitcoin
name: Fedimint Card 4.0 Till
version: "0.1.0"
tagline: Accept Fedimint Card 4.0 payments
description: >-
  Requires a Card 4.0 registry. This till accepts Card 4.0 and compatible later 4.x cards only.
  Keep using a 3.0 till for Card 3.0 cards or a 3.0 registry.


  Pair a point-of-sale phone to take card payments into your federation wallet.
  Open the till, sign in with the password from Umbrel and enter your federation invite.
  In the Umbrel app settings, set OPS_URL to the address of your Card 4.0 registry before connecting the till. Then scan the pairing code on your phone.


  Review sales and set up payouts to a Lightning address. You can also withdraw eCash to a wallet in the same federation.
releaseNotes: ""
developer: Fedimint Card
website: https://fedimintcard.org
dependencies: []
repo: https://github.com/fedimintcard/fedimintcard
support: https://github.com/fedimintcard/fedimintcard/issues
port: 19878
gallery: []
path: ""
requiresHttps: true
defaultUsername: ""
defaultPassword: ""
deterministicPassword: true
submitter: Fedimint Card
submission: "https://github.com/getumbrel/umbrel-apps/pull/6423"
