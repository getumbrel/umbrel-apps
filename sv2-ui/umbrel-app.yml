manifestVersion: 1.1
id: sv2-ui
category: bitcoin
name: Stratum V2 UI
version: "0.8.1"
tagline: Setup and monitor Stratum V2 mining
description: >-
  Stratum V2 UI is a setup wizard and monitoring dashboard for running a
  Stratum V2 mining stack on Umbrel. It guides you through pool mining, solo
  mining, and Job Declaration flows where your Bitcoin node can provide custom
  block templates.


  The app starts and manages the required Translator Proxy and optional Job
  Declaration Client containers, helping SV1 miners connect to Stratum V2
  infrastructure. After setup, the dashboard lets you monitor pool connection
  status, total hashrate, active workers, submitted shares, and hashrate history
  from one place.
port: 8077
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
  - 4.webp
  - 5.webp
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: |-
  - Fixed an issue where found blocks could fail to submit if your node moved to Bitcoin Core 32 after you set up the app. The app now reads your node's version every time it starts mining and updates it by itself, so there's nothing for you to do.
  - Added support for Bitcoin Core 32.x, the version Bitcoin Node uses by default.
  - The setup wizard now shows the Bitcoin Core version your node reports instead of asking you to choose one.
  - The dashboard now tells you when a found block could not be submitted, and when mining switches to a fallback pool.
  - You can now add several custom pools, and edit settings in place on the review step before you start mining.
  - Added experimental Telegram notifications for found blocks, best difficulty and worker connections.
  - Updated the bundled Stratum V2 apps (Translator Proxy and Job Declarator Client) to sv2-apps v0.9.1.

  Full release notes: https://github.com/stratum-mining/sv2-ui/releases/tag/v0.8.1
dependencies:
  - bitcoin
developer: "The Stratum V2 Developers"
website: "https://stratumprotocol.org/"
repo: "https://github.com/stratum-mining/sv2-ui"
support: "https://github.com/stratum-mining/sv2-ui/issues"
submitter: "The Stratum V2 Developers"
submission: "https://github.com/getumbrel/umbrel-apps/pull/5721"
