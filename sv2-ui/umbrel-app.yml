manifestVersion: 1.1
id: sv2-ui
category: bitcoin
name: Stratum V2 UI
version: "0.7.0"
tagline: Setup and monitor Stratum V2 mining
description: >-
  Stratum V2 UI is a setup wizard and monitoring dashboard for running a
  Stratum V2 mining stack on Umbrel. It guides you through pool mining, solo
  mining, and Job Declaration flows where your Bitcoin node can provide custom
  block templates.


  The app starts and manages the required Translator Proxy and optional Job
  Declaration Client containers, helping SV1 miners connect to Stratum V2
  infrastructure. After setup, the dashboard lets you monitor pool connection
  status, total hashrate, active workers, submitted shares, and hashrate history
  from one place.
port: 8077
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
  - 4.webp
  - 5.webp
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: |-
  - Updated the bundled Stratum V2 apps (Translator Proxy and Job Declarator Client) to sv2-apps v0.8.0, now pinned by image digest.
  - Security hardening following the Project Loupe audit: stricter input validation, authenticated API access without wildcard CORS, Noise authority key validation, and safer handling of local state, logos and Bitcoin RPC responses.
  - Pool mode now requires the username to be set explicitly.
  - Clearer error messages when Docker is unreachable, and a unified look for alerts, field errors and status indicators.

  Full release notes: https://github.com/stratum-mining/sv2-ui/releases/tag/v0.7.0
dependencies:
  - bitcoin
developer: "The Stratum V2 Developers"
website: "https://stratumprotocol.org/"
repo: "https://github.com/stratum-mining/sv2-ui"
support: "https://github.com/stratum-mining/sv2-ui/issues"
submitter: "The Stratum V2 Developers"
submission: "https://github.com/getumbrel/umbrel-apps/pull/5721"
