# SilentSuite app router: one origin for the web app and the Etebase server.
# Keeps the external Host (including port), binary bodies, POST trailing slashes
# and websocket upgrades. Adds no authorization or registration headers.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    access_log off;
    # HTTP error records append the request line; nginx cannot redact it here.
    # Discard request-specific errors, including proxy failures. Master/startup
    # diagnostics retain the image's main error logger.
    error_log /dev/null;
    client_max_body_size 64m;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_redirect off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location /api/ {
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_pass http://silentsuite_server_1:3735;
    }

    location / {
        proxy_pass http://silentsuite_web_1:3000;
    }
}
