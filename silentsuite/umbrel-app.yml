manifestVersion: 2.0
id: silentsuite
category: files
name: SilentSuite
version: "0.5.16-beta"
tagline: End-to-end encrypted calendar, contacts, tasks and notes
description: >-
  SilentSuite keeps your calendar, contacts, tasks and notes end-to-end encrypted.
  Your data is encrypted in your browser before it reaches this server.


  To create your account, open SilentSuite, choose Sign up and enter the app password
  that Umbrel shows for SilentSuite as the installation password. Then choose your own
  account password. Your account password encrypts your data and is never sent to this
  server, so keep it safe: it cannot be recovered.


  This package uses the published SilentSuite 0.5.16-beta images. Mobile and desktop sync
  clients, backup restore and arm64 devices have not been verified with it yet.
developer: SilentSuite
website: https://silentsuite.io
dependencies: []
repo: https://github.com/silent-suite/silentsuite
support: https://github.com/silent-suite/silentsuite/issues
port: 39128
gallery: []
path: ""
deterministicPassword: true
requiresHttps: true
storage:
  dataRoot: data
releaseNotes: ""
submitter: SilentSuite
submission: ""
