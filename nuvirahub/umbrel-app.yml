manifestVersion: 1
id: nuvirahub
storage:
  dataRoot: data
category: networking
name: NuviraHub
version: "0.99.1"
tagline: Your own server for the NuviraHub remote desktop apps
description: >-
  NuviraHub is an open-source remote desktop app for Windows, macOS and Linux. This app runs your own NuviraHub server on Umbrel: the apps on your computers sign in to it to find each other, connect directly when they can, and relay the session through it when they cannot. No account is needed.


  Open the app after installing it: its page shows the address to enter in the NuviraHub apps (Settings, Server), the port to forward on your router to reach your computers from outside your home network, and what to back up.


  The server uses port 21216, UDP and TCP. The apps for your computers are at https://nuvirahub.dev/en/download/.
releaseNotes: ""

developer: NuviraHub
website: https://nuvirahub.dev
dependencies: []
repo: https://github.com/nuvira-hub/nuvira
support: https://github.com/nuvira-hub/nuvira/issues

port: 21280
gallery: []
path: ""

defaultUsername: ""
defaultPassword: ""

submitter: Alessandro Blason
submission: https://github.com/getumbrel/umbrel-apps/pull/6422
