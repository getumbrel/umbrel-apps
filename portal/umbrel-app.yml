manifestVersion: 1
id: portal
category: bitcoin
name: Portal
version: "0.1.0"
tagline: A Bitcoin wallet with private swaps over Tor
description: >-
  Portal is under active development. Mainnet use is not recommended.


  Portal is a Bitcoin wallet and OpenSwap client with Wallet and Router modes.
  It includes Tor and supports a public Electrum server or your own Bitcoin Core
  RPC connection. No other Umbrel app is required.


  On first launch, create your Portal owner password, configure your chain
  connection, and wait for Tor and the chain backend to connect. Then create or
  open a wallet. Portal runs entirely in your browser; no desktop app is needed.
releaseNotes: ""
developer: Citadel FOSS
website: https://citadelfoss.xyz
dependencies: []
repo: https://github.com/citadel-foss/portal
support: https://github.com/citadel-foss/portal/issues
port: 3101
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
# Regenerated on every start: Tor state and the Portal process log. Wallets, the swap tracker
# and router state stay in the backup.
backupIgnore:
  - data/portal/home/.openswap/tor-cache/*
  - data/portal/home/.openswap/tor-manager-*
  - data/portal/home/.openswap/debug.log
submitter: Citadel FOSS
submission: https://github.com/getumbrel/umbrel-apps/pull/6125
