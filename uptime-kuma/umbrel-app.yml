releaseNotes: >
  New features:
    - Added new SMS Gateway, ClickUp, TurboSMTP, BearSMS, Pinglet, Milky, and OpenWA notification providers


  Bug fixes:
    - Fixed SQLite validation for the analytics type setting
    - Fixed RADIUS monitors so Access-Challenge responses are treated as successful
    - Fixed the 2.5.x release version metadata


  Full release notes can be found at https://github.com/louislam/uptime-kuma/releases/tag/2.5.3
