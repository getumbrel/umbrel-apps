manifestVersion: 1
id: uptime-kuma
category: networking
name: Uptime Kuma
version: "2.5.4"
tagline: Self-hosted uptime monitoring tool
description: >
  Uptime Kuma is a self-hosted monitoring tool like Uptime Robot.


  Features:


  - Monitoring uptime for HTTP(s) / TCP / HTTP(s) Keyword / Ping / DNS Record / Push / Steam Game Server.

  - Fancy, Reactive, Fast UI/UX.

  - Notifications via Telegram, Discord, Gotify, Slack, Pushover, Email (SMTP), and 70+ notification services.

  - 20 second intervals.

  - Multi Languages

  - Simple Status Page

  - Ping Chart

  - Certificate Info
developer: Louis Lam
website: https://uptime.kuma.pet
dependencies: []
repo: https://github.com/louislam/uptime-kuma
support: https://github.com/louislam/uptime-kuma/issues
port: 8385
gallery:
  - 1.jpg
  - 2.jpg
  - 3.jpg
path: ""
defaultPassword: ""
releaseNotes: >
  New features:
    - Added Signalgrid, Notify!, and Amoot SMS notification providers
    - Added an SFTP monitor type with password and private key authentication


  Improvements:
    - Added a hide/show password toggle to the login page


  Bug fixes and security fixes:
    - Fixed real-browser monitor cleanup, iOS PWA icons, ping timeout validation, and accepted status code ranges on tag creation
    - Updated jsonata to fix CVE-2026-77415 and addressed a denial-of-service weakness


  Full release notes can be found at https://github.com/louislam/uptime-kuma/releases/tag/2.5.4
submitter: Philipp Haussleiter
submission: https://github.com/getumbrel/umbrel/pull/1148
