path: ""
defaultPassword: ""
releaseNotes: >
  New features:
    - Added an NTP monitor type for network time protocol monitoring
    - Added new Plivo SMS/voice call, Ooredoo SMS, WxPusher SPT, and Flowtriq notification providers
    - Added rybbit analytics tracking support for status pages and custom SMTP notification headers
    - Monitoring intervals can now be set beyond the previous 24-day limit


  Bug fixes and security:
    - Fixed daily uptime statistics for monitors with large up/down counts
    - Fixed RSS status descriptions, badge generator URLs, DNS monitor resolver ports, and Steam monitor hostname resolution
    - Fixed saving the screenshot delay when editing browser engine monitors
    - Includes upstream dependency security updates and npm supply-chain cooldown hardening


  Full release notes can be found at https://github.com/louislam/uptime-kuma/releases/tag/2.5.0
submitter: Philipp Haussleiter
