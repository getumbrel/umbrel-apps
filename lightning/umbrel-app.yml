manifestVersion: 1.1
id: lightning
category: bitcoin
name: Lightning Node
version: "0.21.3-beta"
tagline: Run your personal Lightning Network node
description: >-
  Run your personal Lightning Network node, and join the future of Bitcoin today.


  The Lightning Network allows ultra cheap and almost instant Bitcoin transactions. By running a Lightning node, you can not only self-custody your Bitcoin on Lightning, but also earn sats by routing payments on the network.


  Connect Zeus Wallet, Zap, or any other wallet that supports lndconnect to remotely manage and access your node from anywhere.


  With the Advanced Settings feature, you can take control of your node and customize it to your needs. Personalize it with a name, enable larger channels, limit channel sizes, set your routing fees, optimize your routing strategy, add watchtower services, fine-tune its performance, and much more.


  Powered by LND.


  An official app from Umbrel.
releaseNotes: >-
  This update upgrades Lightning Node to LND v0.21.3-beta with reliability and security improvements. It fixes issues that could interrupt channel opening or cooperative closing, improves payment and transaction handling, prevents excessive resource use by misbehaving peers, and makes connections from wallets and other Lightning apps more reliable.


  Reminder for advanced users upgrading from a version before LND v0.21: If you manually added `protocol.custom-nodeann=39` or `protocol.custom-init=39` to your LND configuration for BOLT 12 or LNDK, remove those lines before updating or Lightning Node may not start. LND v0.21 also removed deprecated payment APIs and support for manually configured Tor v2 addresses, so please review the full release notes if you use custom scripts, integrations, or LND settings.


  Full LND release notes: https://github.com/lightningnetwork/lnd/blob/v0.21.3-beta/docs/release-notes/release-notes-0.21.3.md
developer: Umbrel
website: https://umbrel.com
dependencies:
  - bitcoin
repo: https://github.com/getumbrel/umbrel-lightning
support: https://community.getumbrel.com/c/bitcoin-and-lightning
port: 2101
gallery:
  - 1.jpg
  - 2.jpg
  - 3.jpg
  - 4.jpg
  - 5.jpg
path: ""
defaultPassword: ""
widgets:
  - id: "bitcoin-wallet"
    type: "text-with-buttons"
    refresh: "5s"
    endpoint: "app:3006/v1/lnd/widgets/bitcoin-wallet"
    link: ""
    example:
      type: "text-with-buttons"
      link: ""
      title: "Bitcoin Wallet"
      text: "1,845,894"
      subtext: "sats"
      buttons:
        - text: "Withdraw"
          icon: "arrow-up-right"
          link: "?action=send-bitcoin"
        - text: "Deposit"
          icon: "arrow-down-right"
          link: "?action=receive-bitcoin"
  - id: "lightning-wallet"
    type: "text-with-buttons"
    refresh: "2s"
    endpoint: "app:3006/v1/lnd/widgets/lightning-wallet"
    link: ""
    example:
      type: "text-with-buttons"
      link: ""
      title: "Lightning Wallet"
      text: "762,248"
      subtext: "sats"
      buttons:
        - text: "Send"
          icon: "arrow-up-right"
          link: "?action=send-lightning"
        - text: "Receive"
          icon: "arrow-down-right"
          link: "?action=receive-lightning"
  - id: "lightning-stats"
    type: "four-stats"
    refresh: "5s"
    endpoint: "app:3006/v1/lnd/widgets/lightning-stats"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "Connections"
          text: "5"
          subtext: "peers"
        - title: "Active channels"
          text: "3"
          subtext: "channels"
        - title: "Max send"
          text: "90K"
          subtext: "sats"
        - title: "Max receive"
          text: "45K"
          subtext: "sats"
submitter: Umbrel
submission: https://github.com/getumbrel/umbrel-apps/commit/576ecd2bef8d625abceed0f67ec9c487da9b2b1b
backupIgnore:
  - data/lnd/data/graph/*/channel.db
  - data/lnd/data/graph/*/wtclient.db
  - data/lnd/data/watchtower/*/*/watchtower.db
