category: files
name: Excaliself
version: "0.12.0"
tagline: Self-hosted, open-source alternative to Excalidraw+ for teams
description: >-
  The first account you create becomes the admin. Other people join with an invite link from Settings. Umbrel login protects the app by default, so to let teammates or guests open invite and share links, turn off "Require Umbrel login" in the app's settings.


  Excaliself is a self-hosted, open-source alternative to Excalidraw+ for teams. It runs the Excalidraw editor in a small web app and stores every drawing in its own PostgreSQL database on your Umbrel.


  - Live collaboration, with cursors and follow mode

  - A team space every member can edit, next to each member's private space

  - Share links for members only or for anyone, including guests without an account

  - Folders, stars, search by title and by text inside drawings, and a trash with restore

  - A shared team library of shapes

  - Import from Excalidraw+ with an API key
