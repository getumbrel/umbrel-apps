releaseNotes: >-
  Appsmith 2.4.3 keeps the automatic migration for older Umbrel installs, so Appsmith may take some time to come back online while the migration finishes. Please leave Appsmith running until it has started.

  Appsmith AI reached end of life on September 30, 2026. Existing Appsmith AI queries stop working on that date, whether or not you upgrade. Migrate remaining Appsmith AI queries to direct provider datasources such as OpenAI, Anthropic, or Google AI.

  MCP sessions now use Appsmith's Redis configuration. Standard Umbrel installs require no configuration change.

  This update includes security fixes for bundled dependencies.

  Highlights include:
    - Action executions now preserve useful timeout, network, gateway, and server-provided error messages.
    - Hashed static assets now use a separate, higher-capacity rate limit to prevent cold editor loads from failing with HTTP 429.
    - Added a font-family control to the Rich Text Editor toolbar.
    - Restored search, filtering, and sorting for plain-text values in Table widget HTML columns.

  Full release notes can be found at https://github.com/appsmithorg/appsmith/releases/tag/v2.4.3
