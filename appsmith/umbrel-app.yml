releaseNotes: >-
  Appsmith 2.4 keeps the automatic migration for older Umbrel installs, so Appsmith may take some time to come back online while the migration finishes. Please leave Appsmith running until it has started.

  Appsmith AI datasource connections are being retired: existing Appsmith AI datasources stop working on September 30, 2026 whether or not you upgrade. Migrate remaining AI queries to a direct provider datasource before then.

  Important upgrade notes:
    - Admin Settings now masks sensitive values returned by the admin environment API, and MongoDB/Redis URL fields are replaced with read-only connection status.
    - OpenAI, Anthropic, and Google AI datasource model lists were refreshed; saved Anthropic queries using manually entered modern model IDs may need binding updates.

  Highlights include:
    - Added the opt-in Appsmith MCP Server beta with per-user keys, expiry controls, permission-scoped actions, and human approval for destructive changes.
    - Added MSSQL read-only connections and readable-secondary routing for SQL Server Always On deployments.
    - Improved the evaluated value helper, widget-event lint clearing, Custom ECharts and Custom Widget stability, required-field markers, and form-login labels.
    - Improved datasource, SMTP, SSH, Git synchronization, and MongoDB URI reliability.
    - Fixed multiple security issues around custom JavaScript library access, export/fork credential handling, Git route permissions, OAuth redirects, restricted-host checks, and dependency CVEs.

  Full release notes can be found at https://github.com/appsmithorg/appsmith/releases/tag/v2.4
