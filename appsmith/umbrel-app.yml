releaseNotes: >-
  Appsmith 2.4.1 keeps the automatic migration for older Umbrel installs, so Appsmith may take some time to come back online while the migration finishes. Please leave Appsmith running until it has started.

  This update includes security fixes for Databricks JDBC URL validation, SQL filtering, AI and Google Sheets plugin requests, and vulnerable dependencies.

  Highlights include:
    - Fixed an AI plugin dependency conflict that could break AI queries and affect the shared Redis connection.
    - Added non-interactive appsmithctl restore support for automated restores.
    - Improved MCP server database URL selection and Anvil application categorization.
    - Made base-image package installs more resilient to transient mirror failures.

  Full release notes can be found at https://github.com/appsmithorg/appsmith/releases/tag/v2.4.1
