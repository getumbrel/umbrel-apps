releaseNotes: >-
  ⚠️ If you have manually customized docker.env, replace shell expressions with resolved literal values before updating and move JVM options to your container environment. Preserve your encryption password and salt. Generated defaults and Admin Settings values need no changes.


  This update includes security fixes for the Brotli decoder and application permissions, more reliable datasource connections, and fixes for Google Maps in public apps and navigation settings. Browser telemetry is now limited to app builders rather than visitors and end users.


  Redis queries must now use a static command name; dynamic bindings are supported only in argument values. DynamoDB regions must contain only letters, digits, and hyphens and be no longer than 63 characters. Review the full release notes if you use these connections.


  When upgrading from before 2.5, Elasticsearch queries with dynamic values or paths may need changes. Review the full release notes before updating.


  Other changes to be aware of:
    - Saved data connections keep their credentials unless you change the connection settings. After a change, re-enter the connection's credentials or reconnect its OAuth account.
    - Opening a Git-connected app in the editor may create a one-time automatic commit. Updated Git repositories and new exports cannot be used with older Appsmith versions that only support the previous format.
    - Appsmith AI was discontinued on September 30, 2026. Its queries have stopped working regardless of this update. Switch those queries to a direct connection to OpenAI, Anthropic, or Google AI.


  If you are updating from a version older than 2.0, startup may take longer while your data is migrated. Leave Appsmith running until it finishes.


  Full release notes can be found at https://github.com/appsmithorg/appsmith/releases/tag/v2.6.0
