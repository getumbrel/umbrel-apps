category: finance
name: Monido
version: "1.3.0"
tagline: Your family's net worth and cash flow, with an optional AI advisor
description: >-
  On the first start, open Monido within 15 minutes and set the family password: it protects the app inside your Umbrel. If you miss the window, restart the app to open it again.


  Monido tracks your net worth and cash flow, on your own or as a family. You enter monthly balances, income and expenses by hand, with no bank connections, then close the month and see where you stand.


  - Net worth over time, by owner and currency, with loans, property and investments

  - Income and expenses by category, savings rate and a cash-flow forecast

  - Goals and financial independence, with projected dates and what moves them

  - Financial health indicators with plain-language explanations

  - Multiple currencies at central-bank rates, English and Russian, light and dark themes


  An optional AI advisor lets Claude weigh a purchase, a loan or a goal against your own numbers and file bank statements into the month after your yes.
