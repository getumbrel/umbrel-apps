version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: obsidian_server_1
      APP_PORT: 3000

  server:
    image: linuxserver/obsidian:1.15.1@sha256:de6f29048621ee475bf14a7554eabf4799d83b2181566a4fdc9f58c009d6a1dc
    restart: on-failure
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
    shm_size: "1gb"
