manifestVersion: 2.0
id: obsidian
storage:
  dataRoot: data
category: files
name: Obsidian
version: "1.15.1"
tagline: The private and flexible writing app that adapts to the way you think
description: >-
  **Your thoughts are yours.**

  Obsidian stores notes on your device, so you can access them quickly, even offline. No one else can read them, not even us.


  **Your mind is unique.**

  With thousands of plugins and themes, you can shape Obsidian to fit your way of thinking.


  **Your knowledge should last.**

  Obsidian uses open, non-proprietary files, so you're never locked in, and can preserve your data for the long term.
releaseNotes: >-
  This update improves search, performance, and reliability.


  - Sort search results by relevance, with faster results and improved matching across accents and languages.
  - Open vaults, render notes, and navigate large canvases faster.
  - Fix links and backlinks becoming stale, settings not persisting on exit, and vaults failing to load when a folder cannot be read.
  - Improve handling of links to unfamiliar file types with a confirmation before opening them.


  If you use URI callbacks, re-enable Allow URI callbacks in Settings → Files and links on each device. This setting is now device-specific.


  Full release notes are available at https://obsidian.md/changelog/2026-11-12-desktop-v1.15.1/
developer: Obsidian
website: https://obsidian.md/
dependencies: []
repo: https://github.com/linuxserver/docker-obsidian
support: https://github.com/linuxserver/docker-obsidian/issues
port: 3435
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
path: ""
requiresHttps: true
submitter: al-lac
submission: https://github.com/getumbrel/umbrel-apps/pull/1921
