manifestVersion: 2.0
id: obsidian
storage:
  dataRoot: data
category: files
name: Obsidian
version: "1.15.0"
tagline: The private and flexible writing app that adapts to the way you think
description: >-
  **Your thoughts are yours.**

  Obsidian stores notes on your device, so you can access them quickly, even offline. No one else can read them, not even us.


  **Your mind is unique.**

  With thousands of plugins and themes, you can shape Obsidian to fit your way of thinking.


  **Your knowledge should last.**

  Obsidian uses open, non-proprietary files, so you're never locked in, and can preserve your data for the long term.
releaseNotes: >-
  This update brings Obsidian from 1.8.10 to 1.15.0, with many new features, improvements, and bug fixes.


  Obsidian now streams to your browser with a new, smoother web desktop, and it opens over HTTPS. Your vaults and settings are kept.


  Full release notes are available at https://obsidian.md/changelog/
developer: Obsidian
website: https://obsidian.md/
dependencies: []
repo: https://github.com/linuxserver/docker-obsidian
support: https://github.com/linuxserver/docker-obsidian/issues
port: 3435
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
path: ""
requiresHttps: true
submitter: al-lac
submission: https://github.com/getumbrel/umbrel-apps/pull/1921
