manifestVersion: 1
id: homebridge
storage:
  dataRoot: data
category: automation
name: Homebridge
version: "2.4.0-2026-09-25"
tagline: "HomeKit support for the impatient"
description: >-
  Bringing HomeKit support where there is none. Homebridge allows you to integrate with smart home devices that do not natively support HomeKit.
  There are over 2000 Homebridge plugins supporting thousands of different smart accessories.


  Some of the most popular plugins include:
  
  - Ring
  
  - Nest & Nest Cameras
  
  - TP-Link Kasa Smart Home
  
  - Hue / deCONZ (Zigbee)
  
  - Belkin Wemo
  
  - myQ
  
  - UniFi Protect
developer: Homebridge
website: https://homebridge.io/
dependencies: []
repo: https://github.com/homebridge/homebridge
support: https://github.com/homebridge/homebridge/issues
port: 8581
gallery:
  - 1.jpg
  - 2.jpg
  - 3.jpg
path: ""
defaultUsername: ""
defaultPassword: ""
torOnly: false
permissions:
  - GPU
releaseNotes: >-
  ⚠️ Major update reminder: If you are upgrading from a pre-2.x Homebridge release, check plugin readiness indicators and update outdated plugins before upgrading. Older plugins that use removed Homebridge or HAP-NodeJS APIs may fail until updated.


  This image refresh includes Homebridge 2.4.0, Homebridge UI 5.29.0, Node.js 24.21.0, and Homebridge APT Package 2.0.19.


  HAP-NodeJS now uses a built-in file storage replacement for node-persist. Saved Homebridge data is not migrated or rewritten, but rare plugins that call removed storage methods may need plugin updates.


  Full release notes can be found at https://github.com/homebridge/docker-homebridge/releases/tag/2026-09-25
submitter: Umbrel
submission: https://github.com/getumbrel/umbrel-apps/pull/606
