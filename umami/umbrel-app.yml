releaseNotes: >-
  This release adds two-factor authentication, session identity stitching, and reporting improvements.


  Some of the key highlights in this release include:
    - New TOTP two-factor authentication with backup codes, security settings, and admin/user reset controls
    - Session identity stitching for linking identified visitor sessions across visits and devices
    - New session and event property filtering, plus board cloning and table sparklines
    - Improved website setup with a guided tracking-code workflow
    - Better bounce detection, tracker behavior, reporting performance, and dashboard/table usability
    - Security hardening for website inputs, share links, event data deletion, board reports, and Docker runtime dependencies


  This update includes automatic database schema migrations for session linking, 2FA, and session data.


  Full release notes are found at https://github.com/umami-software/umami/releases/tag/v3.3.0
path: "/dashboard"
