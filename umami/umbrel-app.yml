dependencies: []
releaseNotes: >-
  This update adds browser error tracking and improves analytics, navigation, and account security. If you still use the default administrator password, you will be prompted to change it before continuing. Password settings are now under Settings → Security.


  Key highlights:
    - Capture browser errors alongside analytics and investigate grouped issues and affected visits
    - Improved date-range selection, comparison charts, timezone handling, and reporting performance
    - Easier replay navigation and dashboard access on mobile
    - Stronger two-factor authentication, team permissions, and shared-report access controls
    - Fixes session attribution, stale analytics caches, and tracking and display issues


  Full release notes are found at https://github.com/umami-software/umami/releases/tag/v3.5.0
path: "/dashboard"
