releaseNotes: >-
  This maintenance release improves upgrade safety, tracking accuracy, analytics reporting, and two-factor authentication configuration.


  Some of the key highlights in this release include:
    - Safer two-factor authentication enforcement and clearer feedback when the encryption key is missing or invalid
    - Fixes for event property filtering, event/session preservation, relational event pagination, funnel steps with null event values, and zero/false website values
    - Improved tracker visit-state handling, root-path handling with REMOVE_TRAILING_SLASH, expanded metrics performance, username conflict handling, and admin/menu UI polish
    - A database migration that lowercases usernames from pre-3.2 installs while safely handling soft-deleted-account conflicts


  This Umbrel package now provides Umami's persistent two-factor encryption key from the app seed so two-factor authentication can be used after upgrade.


  Full release notes are found at https://github.com/umami-software/umami/releases/tag/v3.3.1
path: "/dashboard"
