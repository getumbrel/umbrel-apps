manifestVersion: 1
id: umami
storage:
  dataRoot: data
name: Umami
tagline: Simple, fast, privacy-focused alternative to Google Analytics
category: developer
version: "3.5.0"
port: 25727
description: >-
  Empowering insights. Preserving privacy.


  Umami makes it easy to collect, analyze, and understand your web data — while maintaining visitor privacy and data ownership.


  ⚠️ Note

  You will be asked to change the default password the first time you log in. You can change it later under Settings → Security.

  You may need to expose Umami to the web in order to use the app in its intended way with websites.

  The easiest way to do this is to use the 'Cloudflare Tunnel' app from the umbrel app store, and expose the Umami app using your own domain.


  😌 Easy to use
  
  Umami is easy to use and understand without needing to run complicated reports. All data is available at a glance.


  💾 Own your data
  
  Data ownership is vitally important for maintinaing compliance with ever changing privacy laws. Rest assured knowing your data is in your control.


  🔒 Respect data privacy

  Umami lets you gather the data you need while respecting the privacy of your users. All data is anonymized and no personal data is ever collected. Cookie banners not required.
developer: Umami
website: https://umami.is
submitter: Sharknoon
submission: https://github.com/getumbrel/umbrel-apps/pull/1083
repo: https://github.com/umami-software/umami
support: https://github.com/umami-software/umami/discussions
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
defaultUsername: admin
defaultPassword: umami
dependencies: []
releaseNotes: >-
  This update adds browser error tracking, improved replay navigation, and security hardening.


  Key highlights:
    - Browser error tracking: capture JavaScript errors, group them into issues with stack traces, and resolve, ignore, or reopen them
    - Previous/next replay controls with keyboard shortcuts and distinct visitor IDs in replay lists
    - Reporting improvements, including chart zoom, a two-month date range calendar, and better period comparisons
    - The default administrator password must now be changed before continuing
    - Stronger two-factor authentication, share link, and team permission checks
    - Password changes have moved to Settings → Security
    - Many fixes across tracking, sessions, retention, and heatmaps


  Full release notes are found at https://github.com/umami-software/umami/releases/tag/v3.5.0
path: "/dashboard"
