name: Build Codex Agent image

on:
  workflow_dispatch:
  push:
    branches:
      - add-codex-agent
    paths:
      - codex-agent/**
      - .github/workflows/build-codex-agent-image.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: codex-agent
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ghcr.io/earlvanze/codex-agent:0.1.1
