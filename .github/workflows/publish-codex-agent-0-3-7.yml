name: Publish Codex Agent 0.3.7 image

on:
  push:
    branches:
      - add-codex-agent
    paths:
      - .github/workflows/publish-codex-agent-0-3-7.yml

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./codex-agent
          build-args: CODEX_VERSION=0.147.0
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/earlvanze/codex-agent:0.3.7
