name: Publish Codex Agent image

on:
  push:
    branches: [add-codex-agent]
    paths:
      - codex-agent/**
      - .github/workflows/publish-codex-agent.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./codex-agent
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: CODEX_VERSION=0.146.0
          tags: ghcr.io/earlvanze/codex-agent:0.2.0
