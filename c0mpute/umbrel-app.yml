manifestVersion: 1
id: c0mpute
storage:
  dataRoot: data
category: ai
name: c0mpute
version: "0.3.103"
tagline: Run a node on the c0mpute decentralized compute network
description: >-
  c0mpute is an open, decentralized compute network. This app runs a c0mpute worker on your Umbrel so it can serve jobs from the network: AI inference on open-weight models (through Infernet), speech, transcoding, and storage.


  The worker runs jobs from other people on your hardware, inside this app's container. Paid demand on the network is early: earnings depend on what the network asks for and vary, and estimates are not payouts.


  **Getting started:**

  Open the app to see the worker's status, node id and roles. Set a public nickname to find your node on the board at https://c0mpute.com/nodes, and add a payout address for inference earnings (earnings accrue without one; you need it to withdraw).


  The first start downloads speech models and AI runtimes (several GB) before the worker serves, so give it a while. No port forwarding is needed.


  Details on what the worker can touch and how releases are signed: https://github.com/profullstack/c0mpute/blob/master/docs/node-safety.md
releaseNotes: ""

