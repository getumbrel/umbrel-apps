manifestVersion: 1.1
id: bitcoin
storage:
  dataRoot: data
category: bitcoin
name: Bitcoin Node
version: "1.5.0"
tagline: Run your personal node powered by Bitcoin Core
description: >-
  Run your Bitcoin node, powered by Bitcoin Core. Independently store and validate every Bitcoin transaction.
  Connect your wallet directly to your node for unmatched privacy so your wallet provider can't track your activity - or worse, mislead you.


  Transacting through your own node also helps keep the Bitcoin network decentralized — win-win.


  With over 20 advanced settings, you're in full control. Choose which version of Bitcoin Core your node runs, 
  how your node connects to other nodes over Tor, clearnet, and I2P, adjust daily upload limits, set the maximum mempool size, 
  fine-tune performance, and much more.


  Don't trust. Verify. On steroids.


  An official app from Umbrel.
developer: Umbrel
website: https://umbrel.com
dependencies: []
repo: https://github.com/getumbrel/umbrel-bitcoin
support: https://community.getumbrel.com/c/bitcoin-and-lightning
port: 2100
gallery:
  - 1.jpg
  - 2.jpg
  - 3.jpg
  - 4.jpg
  - 5.jpg
path: ""
defaultPassword: ""
releaseNotes: >-
  This update adds Bitcoin Core v32.1, v31.2, v30.4, and v29.5, which fix security vulnerabilities that Bitcoin Core disclosed on October 28, 2026.


  If your node is set to always use the latest version, it will start running Bitcoin Core v32.1 after this update. If you have chosen to stay on a specific version, your node will keep running that version until you change it. We recommend switching in Settings to v32.1, or to v31.2 or v30.4 if you want to stay on the same major version. Bitcoin Core 29.x is now end of life and no longer receives security fixes, so if you have chosen to stay on 29.x, we recommend switching to a newer version.


  Bitcoin Core v32.1 adds new settings for the maximum number of RPC connections, the share of incoming connections that can relay transactions, and block validation prefetch threads. It also raises the default maximum number of peer connections from 125 to 200 on new installs. Existing nodes keep their current setting.


  Private transaction broadcasting is now only available on Bitcoin Core v32.1, which fixes an IP address leak that was not fixed in v31.x. If you have chosen to stay on Bitcoin Core v31.x, private transaction broadcasting will be turned off.


  The app now shows a warning if the version you have chosen to stay on is missing security fixes or no longer receives them.
widgets:
  - id: "stats"
    type: "four-stats"
    refresh: "5s"
    endpoint: "app:3000/api/widget/stats"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "Connections"
          text: "11"
          subtext: "peers"
        - title: "Mempool"
          text: "257"
          subtext: "MB"
        - title: "Hashrate"
          text: "590"
          subtext: "EH/s"
        - title: "Blockchain size"
          text: "600"
          subtext: "GB"
  - id: "sync"
    type: "text-with-progress"
    refresh: "2s"
    endpoint: "app:3000/api/widget/sync"
    link: ""
    example:
      type: "text-with-progress"
      link: ""
      title: "Blockchain sync"
      text: "83%"
      progressLabel: "In progress"
      progress: 0.83
