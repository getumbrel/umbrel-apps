repo: https://github.com/duplicati/duplicati
support: https://forum.duplicati.com/
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
releaseNotes: >-
  If upgrading from 2.4.0.1 or earlier, this update upgrades the local backup databases. To return to 2.4.0.1, first use Duplicati's DatabaseTool downgrade command. The database format is unchanged from 2.4.1.0.


  Highlights:
    - Compare backup versions and search for files across all versions when restoring
    - Run all backups from the home page and download job logs
    - Improved restore, repair, scheduling, and SMB reliability
    - Improved Microsoft 365 and Google Workspace backups
    - Added S3 role assumption and WebDAV client certificate support
    - Backups now stop when a source folder cannot be read, and incomplete restores report an error


  Full release notes can be found at https://github.com/duplicati/duplicati/releases/tag/v2.4.1.1_stable_2026-11-25
dependencies: []
permissions:
  - STORAGE_DOWNLOADS
path: ""
deterministicPassword: true
