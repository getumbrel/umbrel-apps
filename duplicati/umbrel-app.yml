releaseNotes: >-
  This patch release focuses on stability, security hardening, and restore reliability.


  Highlights:
    - Hardened login setup, remote-control requests, path redaction, and secret handling in lists
    - Improved restore and abort behavior, including fewer stuck operations and better missing-destination handling
    - Fixed sync-mode issues with Google Drive/Cloud uploads, folder sync, case-insensitive remotes, metadata, and memory use
    - Reduced SQLite/delete memory usage and improved database locking and connection cleanup
    - Updated the web UI with better backup setup navigation, reduced reporting support, and restore/file-browser fixes


  Full release notes can be found at https://github.com/duplicati/duplicati/releases/tag/v2.4.0.1_stable_2026-10-07
dependencies: []
