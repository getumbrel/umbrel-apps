releaseNotes: >-
  This release upgrades the local backup databases. To return to version 2.4.0.1, first downgrade the databases using Duplicati's DatabaseTool downgrade command.


  Highlights:
    - Added restore tests that recover and verify a sample of your backup, with an option to run them automatically after backups
    - Added incremental change tracking for Microsoft 365 and Google Workspace backups
    - Added labels for backup versions and saved logs for sync jobs
    - Improved restore reliability, backup cancellation, scheduling, and file browsing
    - Fixed reverse-proxy login cookies and hardened control-file restores and recovery tools


  Full release notes can be found at https://github.com/duplicati/duplicati/releases/tag/v2.4.1.0_stable_2026-10-29
dependencies: []
