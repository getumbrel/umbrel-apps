releaseNotes: >-
  This stable release hardens Duplicati's data-folder permission checks. Most Umbrel users should not need to take any action, but Duplicati can now refuse data folders with unsafe/lax permissions.


  New in 2.4.0.0:
    - Added sync copy mode for one-way source-to-destination file copies
    - Added PAR2 parity/error-correction support for remote backup volumes
    - Stores encrypted backup configurations with backup data by default to simplify recovery
    - Improved restore reliability, missing-source detection, filter accuracy, and TLS certificate validation
    - Added new storage backends and improved Microsoft 365 backup support, with older SharePoint/OneDrive for Business backends deprecated


  Full release notes can be found at https://github.com/duplicati/duplicati/releases/tag/v2.4.0.0_stable_2026-09-03
