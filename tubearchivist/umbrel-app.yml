manifestVersion: 1.1
id: tubearchivist
storage:
  dataRoot: data
category: media
name: Tube Archivist
version: "0.6.0"
tagline: Self hosted YouTube media server
description: >-
  Once your YouTube video collection grows, it becomes hard to search and find a specific video. 
  That's where Tube Archivist comes in: By indexing your video collection with metadata from YouTube, you can organize, search and enjoy your archived YouTube videos without hassle offline through a convenient web interface. 
  

  Core functionality includes:
    - Subscribe to your favorite YouTube channels
    - Download Videos using yt-dlp
    - Index and make videos searchable
    - Play videos
    - Keep track of viewed and unviewed videos
backupIgnore:
  - data/cache
  - data/redis
developer: tubearchivist
website: https://www.tubearchivist.com/
dependencies: []
repo: https://github.com/tubearchivist/tubearchivist
support: https://github.com/tubearchivist/tubearchivist/issues
port: 8079
gallery:
  - 1.jpg
  - 2.jpg
  - 3.jpg
path: ""
defaultUsername: "admin"
deterministicPassword: true
torOnly: false
submitter: Kanishk Pachauri
submission: https://github.com/getumbrel/umbrel-apps/pull/3944
releaseNotes: >-
  This update improves playlist artwork, manual imports, and subtitle handling.


  Update normally through Umbrel. Tube Archivist now runs as a non-root user, and Umbrel adjusts file permissions automatically during the first startup after updating. This may take longer for large libraries.


  Saved direct links to videos, subtitles, and artwork have changed. Refresh these links in any external integrations using the current URLs returned by Tube Archivist's API.


  Turning off Tube Archivist's built-in database snapshots now deletes existing snapshots.


  Full release notes can be found at https://github.com/tubearchivist/tubearchivist/releases/tag/v0.6.0
