manifestVersion: 1
id: docuseal
storage:
  dataRoot: data
category: files
name: DocuSeal
version: "3.3.4"
tagline: Open source document filling and signing
description: >
  DocuSeal is an open source platform that provides secure and efficient digital document signing and processing.


  Features:
    - PDF form fields builder (WYSIWYG)
    - 12 field types available (Signature, Date, File, Checkbox etc.)
    - Multiple submitters per document
    - Automated emails via SMTP
    - Files storage on disk or AWS S3, Google Storage, Azure Cloud
    - Automatic PDF eSignature
    - PDF signature verification
    - Users management
    - Mobile-optimized
    - 7 UI languages with signing available in 14 languages
    - API and Webhooks for integrations
developer: docusealco
website: https://www.docuseal.com/
dependencies: []
repo: https://github.com/docusealco/docuseal
support: https://github.com/docusealco/issues
port: 8387
gallery:
  - 1.jpg
  - 2.jpg
  - 3.jpg
  - 4.jpg
path: ""
defaultPassword: ""
releaseNotes: >-
  This release updates trusted SSL/TLS certificates and includes bug fixes and performance improvements. Upstream recommends this update for all self-hosted users.


  A database migration runs automatically during this update. It takes a few seconds for smaller installs and may take 1-2 minutes for databases with around 500,000 submissions. Please leave the app running until it starts.


  If you are upgrading from a version before 3.1.3, the database migration introduced in 3.1.3 may also run on first boot.


  Full release notes can be found at https://github.com/docusealco/docuseal/releases/tag/3.3.4
submitter: Kanishk Pachauri
submission: https://github.com/getumbrel/umbrel-apps/pull/3838
