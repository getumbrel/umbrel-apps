manifestVersion: 1
id: campfire
storage:
  dataRoot: data
category: social
name: Campfire
version: "1.5.4"
tagline: Self-hosted chat for teams
description: >-
  Campfire is a web-based chat application for teams. Run your own private chat server with all the features you need.


  Features:
    - Multiple chat rooms with access controls
    - Direct messages between users
    - File attachments with image and video previews
    - Search across all messages
    - Web Push notifications
    - @mentions to notify specific users
    - API with support for bot integrations
    - Modern, responsive web interface
    - Self-hosted and privacy-focused

  On first launch, you'll be guided through creating an admin account. This admin can then invite other users and manage rooms and permissions.
backupIgnore:
  - data/redis/*
releaseNotes: >-
  This update includes important security fixes and is recommended for all installations.


  - Prevents crafted chat messages and quoted mentions from running scripts in other members' browsers.
  - Requires your current password when changing passwords and signs out your other sessions. Other devices need to sign in again to receive push notifications.
  - Adds a stricter content security policy and serves non-media attachments as downloads.


  Sign-in links and QR codes created before this upgrade will no longer work; generate new ones if needed. Custom scripts and scripts injected by external proxies are now blocked.


  Full release notes can be found at https://github.com/basecamp/once-campfire/releases/tag/v1.5.4
developer: basecamp
website: https://once.com/campfire
dependencies: []
repo: https://github.com/basecamp/once-campfire
support: https://github.com/basecamp/once-campfire/issues
port: 8004
