manifestVersion: 1
id: archivebox
storage:
  dataRoot: data
category: files
name: ArchiveBox
version: "0.9.73"
tagline: Open-source self-hosted web archiving
description: >-
  ArchiveBox turns your Umbrel into a private internet time capsule.


  On first launch, complete the server access setup using the address you plan to keep using for ArchiveBox. For local HTTP access, choose Private Server, Single-domain DNS, and No TLS. Keep the detected URL, click Review and save in Machine config, then Save.


  Save any URL and it captures a durable offline copy: HTML, SingleFile page, screenshot, PDF, reader view, WARC archive, media, metadata, favicons, and links. Your archive stays on your disk as plain files, portable and vendor-free.


  Add pages manually or import bookmarks, RSS feeds, Pocket, Pinboard, and more. Browse, search, and manage captures from the built-in web UI.


  It bundles Chrome, wget, yt-dlp, SingleFile, and readability, so it works out of the box.
releaseNotes: >-
  ArchiveBox 0.9.73 adds cloud-document archiving, faster large-archive browsing, and more reliable captures.


  Google Docs, Sheets, Slides, Drawings, Google Drive folders, and Dropbox shares can now be archived with browsable saved files, everyday export formats, and optional text extraction for search.


  Snapshot file browsing is improved with sortable/filterable file lists, inline previews, individual file or folder downloads, and faster capture details/queue processing for large collections.


  Mobile replay captures additional phone-width resources, and fixes improve private-page captures, SingleFile/WACZ downloads, PDF text extraction, cookie/auth file handling, and bulk deletion reliability.


  ArchiveBox 0.9 migrates some files in your archive data directory lazily during use. Make a full backup of your archive before updating.


  After updating, complete the server access setup when prompted. For local HTTP access, choose Private Server, Single-domain DNS, and No TLS. Keep the detected URL, click Review and save in Machine config, then Save. Continue using that address to access ArchiveBox.


  Single-domain access disables JavaScript when viewing archived pages. JavaScript still runs while capturing them.


  Full release notes can be found at https://github.com/ArchiveBox/ArchiveBox/releases/tag/v0.9.73
