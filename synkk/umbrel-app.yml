manifestVersion: 2.0
id: synkk
storage:
  dataRoot: data
category: files
name: Synkk
version: "v1.0.1"
tagline: Self-hosted sync for your Obsidian vaults
description: >-
  Synkk hosts Obsidian vaults on your Umbrel. Manage Markdown notes, file
  history, and device sync from a web dashboard.


  Sign in with the administrator username and generated password shown by Umbrel.
  Install the Synkk Obsidian plugin from
  https://github.com/tawandajosephmutsena/synk-obsidian-plugin/releases/latest
  on each device and point it to the Synkk HTTPS URL on your Umbrel. For local
  HTTPS, trust Umbrel's certificate on each device from Umbrel Settings →
  Advanced settings, or use a trusted HTTPS address.


  Outgoing email is not configured by this package. Email verification,
  invitations, and password recovery require SMTP. Keep the initial admin
  email address until outgoing email is working.
releaseNotes: ""

developer: Ottomate
website: https://synkk.space
dependencies: []
repo: https://github.com/tawandajosephmutsena/synkk
support: https://github.com/tawandajosephmutsena/synkk/issues

port: 14965
gallery: []
path: "/login"
requiresHttps: true

defaultUsername: admin@umbrel.local
deterministicPassword: true

submitter: Tawanda Joseph Mutsena
submission: "https://github.com/getumbrel/umbrel-apps/pull/6161"
