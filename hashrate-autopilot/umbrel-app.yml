releaseNotes: >-
  v1.18.3 - security maintenance update. No new features and no behavior changes.


  Updates the app's software dependencies to their patched releases, clearing 28 published security advisories. The most relevant are in the web server and data-validation libraries the app uses (fastify, zod, fast-uri, js-yaml): request spoofing, URI confusion, and memory or CPU exhaustion from oversized input.


  Safe to upgrade from any 1.17.x or 1.18.x release; no new settings.
