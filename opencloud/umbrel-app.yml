manifestVersion: 2.0.0
id: opencloud
category: files
name: OpenCloud
version: "8.0.1"
tagline: Your files, your cloud, your control
description: >-
  OpenCloud is a fast, open-source platform for storing, syncing, and sharing your files. Keep your documents, photos, and folders on your own Umbrel and access them through a modern web interface or the OpenCloud desktop and mobile apps.


  This app requires umbrelOS 2.0 or later and opens over HTTPS. Install and trust your Umbrel's local HTTPS certificate on each device you use. OpenCloud uses your Umbrel's local hostname as its fixed server address, for example https://umbrel.local:8844. Opening the app through a different hostname or IP address redirects to this address. Your device must be able to resolve and reach that local hostname.


  Sign in as admin using the password shown by Umbrel. You can then create users, organize files into shared Spaces, upload and download files, and share links with other people who can reach your Umbrel. Demo accounts are disabled.


  OpenCloud's own authentication protects your files and enables compatible desktop and mobile clients. This package is configured for local network use; public domains and Tor access are not configured. Online office document editing requires a separately configured office integration and is not included.
releaseNotes: ""

developer: OpenCloud GmbH
website: https://opencloud.eu
dependencies: []
repo: https://github.com/opencloud-eu/opencloud
support: https://github.com/orgs/opencloud-eu/discussions

port: 8844
gallery: []
path: ""

defaultUsername: admin
defaultPassword: ""
deterministicPassword: true
requiresHttps: true

submitter: dennysubke
submission: https://github.com/getumbrel/umbrel-apps/pull/6131
