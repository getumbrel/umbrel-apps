manifestVersion: 2.0
id: snort
category: social
name: Snort
version: "v0.5.4"
tagline: Fast Nostr UI
description: >-
  Snort is a client for Nostr that is built using React, designed to be fast and lightweight while still offering a wide range of features. 
  Our focus is on providing users with an easy-to-use interface to interact with the Nostr network, making it accessible to all types of users. 
  With its clean and intuitive design, Snort makes it simple to navigate the Nostr network and access its features, allowing users to efficiently manage their data.
releaseNotes: >-
  ⚠️ Before updating, update your Umbrel to umbrelOS 2.0 or later and make sure you have your Nostr key or access to your signer. Snort now opens over HTTPS, so you’ll need to sign in again. Browser-local settings and wallet connections won’t transfer automatically.


  Image proxying is now off by default because the previous default provider is shutting down. You can configure your own image proxy in settings.


  - Improved timeline updates, relay reconnection, profile discovery, and cache reliability across tabs and reloads.

  - Fixed direct-message delivery, ordering, and persistence, with clearer feedback for messages that cannot be decrypted.

  - Improved media uploads with progress indicators, drag-and-drop, cancellation, and retry controls.

  - Added on-device reply spam filtering, NIP-22 comments, and embedded 3Speak videos.

  - Fixed saved lists, wallet history, PIN-locked accounts, and remote signer compatibility.


  Full release notes can be found at https://github.com/v0l/snort/compare/v0.5.3...v0.5.4
