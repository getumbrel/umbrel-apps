version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: komga_komga_1
      APP_PORT: 25600

  komga:
    image: ghcr.io/gotson/komga:1.30.1@sha256:d43bb3b57aeeafd274ea805214f5da71ff9306accf012fb14cc13dedc3307212
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${APP_DATA_DIR}/data/library:/data
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:25600/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
