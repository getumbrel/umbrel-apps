version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: murmur_web_1
      APP_PORT: 3000
      # Umbrel login stays on; only the files a phone fetches without cookies
      # when Murmur is added to the home screen are let through.
      PROXY_AUTH_WHITELIST: "/manifest.webmanifest,/favicon.svg,/icon.svg,/icon-192.png,/icon-512.png,/icon-maskable-512.png,/apple-touch-icon.png"

  web:
    image: ghcr.io/getumbrel/murmur:v0.4.0@sha256:38a6300eeeed74e90edf5a5fc3cb41c43ae01fdefdf3803bb267f90e4de7297e
    user: "1000:1000"
    init: true
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data/murmur:/data
    environment:
      # The Hermes that comes with Murmur (below), and how Murmur signs in to it.
      MURMUR_BUILTIN_HERMES_URL: "http://murmur_hermes_1:9119"
      MURMUR_BUILTIN_HERMES_USERNAME: "murmur"
      MURMUR_BUILTIN_HERMES_PASSWORD: ${APP_MURMUR_HERMES_PASSWORD}
      # The Hermes Agent app, if it's installed: offered on first run instead,
      # with the agents and chats already in it.
      MURMUR_FIND_HERMES: "Hermes Agent=http://hermes-agent_web_1:18789"
      # Umbrel's login sits in front of Murmur, so it answers to whatever name
      # or address the Umbrel is reached by (umbrel.local, an IP, a custom domain).
      MURMUR_ALLOWED_HOSTS: "*"

  # Murmur's own Hermes. Private: never published, never behind app_proxy, and
  # gated by a username and password only Murmur knows. Its data (and the API
  # keys in its .env) has its own folder, which Murmur's container can't see.
  hermes:
    image: ghcr.io/getumbrel/hermes-agent-umbrel:v0.22.0-1@sha256:1e27bebbb8998a2d54e47f1b838720440aea1a99c3465f03199277a16cda4e3c
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data/hermes:/opt/data
    environment:
      HERMES_UID: "1000"
      HERMES_GID: "1000"
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: "murmur"
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${APP_MURMUR_HERMES_PASSWORD}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${APP_MURMUR_HERMES_SECRET}
      # Routines and Telegram run in Hermes's messaging gateway.
      HERMES_GATEWAY_BOOTSTRAP_STATE: "running"
      # The app its agents should send people to for files, the terminal and restarts.
      UMBREL_APP_NAME: "Murmur"
    command: ["gateway", "run"]
