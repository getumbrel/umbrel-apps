manifestVersion: 1
id: questarr
storage:
  dataRoot: data
category: media
name: Questarr
version: "1.6.0"
tagline: Discover, track and download your video games
description: >-
  Questarr is a video game manager inspired by the *Arr apps (Sonarr, Radarr, Prowlarr). Track your collection, discover new releases through IGDB, RSS feeds and xREL, sync your Steam wishlist, search your Torznab and Newznab indexers, and send releases straight to your download client.


  🛠️ SETUP INSTRUCTIONS

  The first account you create in Questarr becomes the administrator. Add your indexers and a download client (qBittorrent, Transmission, rTorrent, Deluge, Synology Download Station, SABnzbd or NZBGet) in Settings.


  To let Questarr import finished downloads, add a path mapping under Settings -> Path Mappings that points your download client's folder to /data, which is Umbrel's Downloads folder.
