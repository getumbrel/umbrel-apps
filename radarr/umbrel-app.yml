path: ""
releaseNotes: >-
  This update brings Radarr up to v7.0.3.10918. Existing media information is migrated automatically; large libraries may take longer to start after updating.


  Improvements since the previous release:

  - Added detailed information for multiple audio and subtitle streams, with lower-memory media information migrations.

  - Added full Transmission label support, Trakt Smart Lists, and sorting movies by popularity.

  - Improved manual imports, custom format scoring, qBittorrent single-file imports, and import failure messages.

  - Fixed blank pages, interactive search failures, IMDb matching, and subtitle information extraction.

  - Removed deprecated Kometa metadata support.


  Full release notes for Radarr can be found at https://github.com/Radarr/Radarr/releases/tag/v7.0.3.10918
