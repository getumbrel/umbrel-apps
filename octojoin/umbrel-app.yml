manifestVersion: 1
id: octojoin
category: bitcoin
name: Octojoin
version: "0.1.1"
tagline: Private payments that hide the amount and the sender
description: >-
  Octojoin builds a payment that spends swapped coins alongside a single
  coin of your own, and splits the amount into standard denominations across
  several outputs, so the transaction looks ordinary on-chain and neither the
  sender nor the amount is obvious.


  Setup: the app uses a Bitcoin Core wallet on your Umbrel node, which it
  creates on first run. Send coins to it, then acquire coins from an off-chain
  swap (statechain, coinswap or submarine swap) and label them 'octojoin' in the
  app. A transaction needs at least two swapped coins plus one of your own.


  If you would rather not keep keys on your node, import a watch-only descriptor
  wallet instead: the app builds the PSBT, you sign it in Sparrow or a hardware
  signer, and paste it back to broadcast.


  Outputs are plain addresses. BIP 352 silent payments, which the Octojoin draft
  recommends, are not implemented yet.
