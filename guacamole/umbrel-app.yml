manifestVersion: 1
id: guacamole
storage:
  dataRoot: data
environment:
  - name: TOTP_ENABLED
    services:
      - web
    default: "false"
    options:
      - "true"
    note: >-
      Select true to require two-factor authentication (TOTP) for every Guacamole account. Each user sets up an authenticator app the next time they log in.
category: networking
name: Apache Guacamole
version: "1.6.0"
tagline: Access your computers from anywhere using just a web browser
description: >-
  🔑 Log in with the username "guacadmin" and the password shown in Umbrel. After logging in, open Settings to add your first connection and to create separate accounts for other people.


  Apache Guacamole is a clientless remote desktop gateway. It supports standard protocols like VNC, RDP, SSH, and Telnet, so you can reach the desktops and terminals of the computers on your network from any web browser, with no plugins or client software to install.


  Connections are saved on your Umbrel, so you can open them from any device. Guacamole also supports clipboard sharing, SFTP file transfer, connection sharing, and multiple users with their own permissions.
releaseNotes: ""

developer: The Apache Software Foundation
website: https://guacamole.apache.org/
dependencies: []
repo: https://github.com/apache/guacamole-client
support: https://guacamole.apache.org/support/

port: 8493
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
path: ""

defaultUsername: guacadmin
deterministicPassword: true

submitter: Umbrel
submission: https://github.com/getumbrel/umbrel-apps/pull/6364
