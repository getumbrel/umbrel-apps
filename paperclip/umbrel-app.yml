releaseNotes: |-
  - Chat-style tasks are now the default experience, with a Classic Task Interface preference available for the previous task view.
  - Added managed runtime HTTPS previews over Tailscale, in-product Claude and Codex sign-in flows, and stronger sandbox-provider capability checks.
  - Improved company onboarding, task navigation, review governance, activity handling, and large company imports/exports with resumable uploads.
  - Added automatic database migrations for onboarding tasks, device-login sessions, runtime exposure/leases, and environment references.
  - Fixed authenticated-proxy loading, account-scoped caches, security hardening, run/session reliability, sandbox plumbing, adapter reliability, and UI issues.
dependencies: []
