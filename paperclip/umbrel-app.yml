releaseNotes: |-
  Review your member roles after updating: Operators now gain company editing, agent configuration, invitation, connection, tool, and audit permissions. Demote members who should remain read-only. Budget policies now pause work with unpriced usage by default; resolve those charges or set the policy to allow unpriced usage if appropriate.

  - Adds private tasks and projects with explicit sharing and access controls.
  - Adds connections for your own model gateways, including OpenRouter, Bedrock, Gemini, and compatible API endpoints.
  - Improves cost accounting, subscription fee tracking, agent recovery, and workspace preservation.
  - On instances configured with an HTTPS public URL, connected MCP assistants can now edit tasks, upload files, and manage approved configurations.
  - Adds HTML report previews and CSV table views on tasks.
  - Existing GitHub review bots keep running, but their settings now require enabling Settings → Experimental → GitHub review bots.

  For upgrades from older versions, review stored tool grants and agent execution permissions: omitted execution settings may enable full-auto operation. Workspace restore locks use SQLite; stop old Paperclip processes before upgrading or rolling back, and do not delete `.lock.sqlite` files. Legacy Composio broker integrations require reconnecting through MCP aggregators.

  Full release notes can be found at https://github.com/paperclipai/paperclip/releases/tag/v2026.1023.0
