  - 4.webp
  - 5.webp
releaseNotes: |-
  - Adds experimental Assistant Connection (MCP) support so external tools like Claude Code, Codex, OpenCode, and other MCP clients can connect to Paperclip as signed-in users.
  - Adds Agent Chat-first navigation, a unified Connections catalog, connection instructions for agents, safer company skill updates, and refreshed Claude/Codex/OpenCode model/runtime support.
  - Improves Codex run recovery across server restarts, capacity-limit handling, workspace restore locking, sandbox/workspace reliability, and task creation flows.
  - Stored tool grants are now enforced more strictly; review custom grants if an agent loses access to a tool or connection after updating.
  - Workspace restore locks now use SQLite file locks. Stop old Paperclip processes before upgrading or rolling back, and do not delete the new `.lock.sqlite` files.

  Full release notes can be found at https://github.com/paperclipai/paperclip/releases/tag/v2026.1012.0
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
deterministicPassword: false
