releaseNotes: |-
  Paperclip now opens over HTTPS and requires umbrelOS 2.0 or later because its setup interface needs a secure browser context. Sign in again after updating.

  Private tasks are optional and off by default. Some private tasks may not run after this update. If you rely on them, consider waiting to update. Regular tasks are unaffected.

  The experimental Pipelines feature has been removed; existing records are preserved, and Cases and Routines remain available. All active human members can now view Audit → Commentary, subject to source-task privacy.

  - New agents use the Paperclip Runner on supported hosts; existing agents keep their current runner and can opt into an upgrade.
  - Adds automatic skill imports from project repositories and bulk model/connection changes for agents.
  - Adds optional model-backed prompt-injection checks and agent observability connections.
  - Improves task recovery, workspace preservation, startup speed, and task-page performance.
  - Finished task workspaces now discard regenerable, ignored build files after one hour while keeping source changes.

  For upgrades from older versions, review member roles and stored tool grants: Operators gain broader editing and administration permissions, and omitted agent execution settings may enable full-auto operation. Budget policies pause unpriced usage by default. Stop old Paperclip processes before upgrading or rolling back; do not delete `.lock.sqlite` files. Legacy Composio broker integrations require reconnecting through MCP aggregators.

  Full release notes can be found at https://github.com/paperclipai/paperclip/releases/tag/v2026.1106.0
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
deterministicPassword: false
