manifestVersion: 1.1
id: memos
storage:
  dataRoot: data
category: files
name: Memos
version: "26.11.0"
tagline: Easily capture and share your great thoughts
description: >-
  A privacy-first, lightweight note-taking service.
  Easily capture and share your great thoughts.

  - Open source and free forever. Embrace a future where creativity knows no boundaries with our open-source solution – free today, tomorrow, and always.

  - Self-hosting with Docker in just seconds. Enjoy the flexibility, scalability, and ease of setup that Docker provides, allowing you to have full control over your data and privacy.

  - Pure text with added Markdown support. Say goodbye to the overwhelming mental burden of rich formatting and embrace a minimalist approach.

  - Customize and share your notes effortlessly. With our intuitive sharing features, you can easily collaborate and distribute your notes with others.

  - RESTful API for third-party services. Embrace the power of integration and unleash new possibilities with our RESTful API support.
releaseNotes: >-
  Older installations are automatically upgraded through the required Memos 0.31.0 database checkpoint. A copy of the original database is retained before migration. Back up your data before upgrading.


  This update fixes Japanese and Korean typing in Safari, improves error messages when attachments cannot be loaded, and makes the server cache more reliable.


  Important notes for users upgrading from versions before 26.10.0:
    - Sign in again after updating; API clients must refresh access tokens or sign in again. Personal access tokens are unaffected
    - API routes move from /api/v1/ to /api/; third-party integrations need updating
    - Custom memo-length and upload-size limits are not carried over. Configure Settings → Usage limits again if needed; defaults are 8 KiB per memo and 32 MiB per file
    - Memo export is now an administrator action
    - Instance administrators can read and manage private and Space-only memos; users skipping 0.31.0 should also note that Shortcuts became Views and RSS support was removed


  Full release notes are available at https://github.com/usememos/memos/releases/tag/26.11.0
developer: Memos
website: https://www.usememos.com/
