# Umbrel app manifest for Sara. In the store repository (getumbrel/umbrel-apps) the folder is sara/
# with this file and docker-compose.yml. Gallery images and the icon go in the PR description, not
# in the folder (Umbrel hosts the final assets); outputs/umbrel/ has them.
manifestVersion: 1
id: sara
storage:
  dataRoot: data
category: ai
name: Sara
version: "1.1.0"
tagline: A self-hosted AI companion and coding partner
description: >-
  First start: open Sara and click "Set up Sara". Umbrel has already checked it's you, so one click
  makes you her owner. She then shows your owner token once: save it in your password manager (you
  need it to sign in on your phone or another device).


  Sara is a self-hosted AI companion and assistant for coding, creating and managing things: chat
  with memory, a planner, coding tools, photos and voice, all on your Umbrel. You choose the AI
  model (local with the Ollama app, or your own provider account); your data and keys stay on your
  Umbrel.


  Her phone apps and other apps (OpenAI-compatible API, MCP) connect with Sara's own sign-in.
releaseNotes: ""
developer: Frank Arena and Backstage Coding
website: https://sara.backstagecoding.com
dependencies: []
repo: https://github.com/farena-ai/sara
support: https://github.com/farena-ai/sara/issues
port: 7860
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
submitter: Backstage Coding
submission: https://github.com/getumbrel/umbrel-apps/pull/6269
