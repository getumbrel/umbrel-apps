manifestVersion: 1
id: yuvomi
category: files
name: Yuvomi
version: "2.2.0"
tagline: Self-hosted family planner — calendar, tasks, shopping, meals & budget
description: >-
  Yuvomi is a self-hosted, privacy-focused family planner that bundles everything
  a household needs into a single fast PWA — no cloud, no tracking, no ads.


  Everything runs on your Umbrel and stays on your Umbrel.


  ✨ FEATURES


  - Shared family calendar with recurring events, reminders and birthdays

  - CalDAV / Google Calendar / Apple iCloud / ICS subscription sync

  - Tasks with multi-assignment and due dates

  - Shopping lists and a kitchen/meal planner

  - Notes, contacts (CardDAV) and a household budget with recurring entries &
    split expenses

  - Housekeeping: staff, chores and supplies

  - Weather widget (Open-Meteo, no API key needed)

  - Optional single sign-on via OIDC

  - Full-text search across every module

  - Installable PWA, mobile-first, dark mode, multi-language


  🔒 PRIVACY


  Yuvomi keeps all data in a local SQLite database (optionally encrypted with
  SQLCipher). Nothing leaves your device unless you explicitly enable a calendar
  or contacts sync to a provider you choose.


  🛠️ SET-UP


  Open Yuvomi from your Umbrel dashboard and create the first account — that
  account becomes the family admin and can invite the rest of the household.
releaseNotes: "**The app has one colour again.** The violet of the app icon carries the navigation, the add button, buttons, switches, links and focus rings - in every module, the same. Module colours stay where they answer \"where am I\": the badge in the module header, the module's own bars and chips, its widget on the dashboard, its icon in the sidebar. Opening the budget no longer repaints the whole frame teal.\n**Warmer surfaces in both themes.** The page background moves from a cool grey to warm paper in light mode, and from near-black to warm charcoal in dark mode, where cards now separate visibly from the background instead of floating on it.\n**The add button sits inside the navigation bar** on phones and tablets, at its trailing end, instead of floating above it. On pages without an add action the bar uses the full width.\nThe sidebar shows every module's icon in its own colour, so the colour vocabulary is legible in one place instead of being worn by the whole app.\nThe calendar's colour moves from violet to azure - next to a violet app colour, the two were the same tone.\nTab bar labels are one step smaller (the size iOS itself uses for them), so the longest German label fits on one line down to 360 px wide.\n**The search in list modules collapses to its icon on phones**, as it already did in short windows. One header row instead of two.\nFilters and grouping share a single row in tasks and documents instead of wrapping onto two; the grouping choice shows its icons when the row gets narrow.\n\n**Phones lost up to three quarters of the screen to interface chrome.** On a 375x812 phone the task list left 210 px for content and now leaves 507 px; the budget goes from 329 to 514 px, shopping from 244 to 429, recipes from 413 to 598.\nThe add button reserved a full-width strip above the navigation on every screen - 92 px, whether or not anything lay underneath it.\nThe install banner sat 8 px inside the navigation bar instead of above it."
