manifestVersion: 1
id: yuvomi
category: files
name: Yuvomi
version: "2.27.0"
tagline: Self-hosted family planner — calendar, tasks, shopping, meals & budget
description: >-
  Yuvomi is a self-hosted, privacy-focused family planner that bundles everything
  a household needs into a single fast PWA — no cloud, no tracking, no ads.


  Everything runs on your Umbrel and stays on your Umbrel.


  ✨ FEATURES


  - Shared family calendar with recurring events, reminders and birthdays

  - CalDAV / Google Calendar / Apple iCloud / ICS subscription sync

  - Tasks with multi-assignment and due dates

  - Shopping lists and a kitchen/meal planner

  - Notes, contacts (CardDAV) and a household budget with recurring entries &
    split expenses

  - Housekeeping: staff, chores and supplies

  - Weather widget (Open-Meteo, no API key needed)

  - Optional single sign-on via OIDC

  - Full-text search across every module

  - Installable PWA, mobile-first, dark mode, multi-language


  🔒 PRIVACY


  Yuvomi keeps all data in a local SQLite database (optionally encrypted with
  SQLCipher). Nothing leaves your device unless you explicitly enable a calendar
  or contacts sync to a provider you choose.


  🛠️ SET-UP


  Open Yuvomi from your Umbrel dashboard and create the first account — that
  account becomes the family admin and can invite the rest of the household.
releaseNotes: >-
  Die Tagesansicht des Kalenders zeigt wieder alle Termine. Wer westlich von
  Greenwich lebt, dem fehlten dort synchronisierte Termine am spaeten Nachmittag
  und Abend, waehrend Monat, Woche und Agenda dieselben Termine anzeigten - fuer
  den Abgleich gehoerte ein Abendtermin bereits zum naechsten Tag. Ausserdem
  behalten wiederkehrende Google-Termine ihre Uhrzeit jetzt ueber die
  Zeitumstellung hinweg; bisher verschoben sie sich ab dem Wechsel um eine
  Stunde.


  Die Einkaufsliste laeuft nicht mehr auseinander, wenn sie mit einer
  Erinnerungsliste auf einem eigenen Kalenderserver abgeglichen wird.
  Umbenennen, Abhaken und Loeschen wurden schon immer uebertragen, ein in Yuvomi
  neu hinzugefuegter Artikel blieb aber liegen und tauchte auf dem Handy nie
  auf. Neue Artikel gehen jetzt ebenfalls hinaus, sofort und beim naechsten
  Abgleich.


  Wer sich per Single Sign-on anmeldet, kann sein Anbieter-Konto nun selbst mit
  einem bestehenden Yuvomi-Konto verbinden. Bisher legte die erste Anmeldung
  ueber den Anbieter ein zweites Konto an, sobald Yuvomi die Person nicht sicher
  zuordnen konnte - die bisherigen Daten blieben dann im alten Konto liegen.
  Dafuer meldet man sich wie gewohnt in Yuvomi an und verbindet beide unter
  Einstellungen, Konto. Ein gleicher Benutzername verbindet weiterhin nicht von
  allein, denn er waere ein Weg, sich ein fremdes Konto zu nehmen.


  Full release notes are available at
  https://github.com/ulsklyc/yuvomi/releases/tag/v2.27.0
backupIgnore:
