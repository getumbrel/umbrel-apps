manifestVersion: 1
id: yuvomi
storage:
  dataRoot: data
category: files
name: Yuvomi
version: "2.81.0"
tagline: Self-hosted family planner — calendar, tasks, shopping, meals & budget
description: >-
  Yuvomi is a self-hosted, privacy-focused family planner that bundles everything
  a household needs into a single fast PWA — no cloud, no tracking, no ads.


  Everything runs on your Umbrel and stays on your Umbrel.


  ✨ FEATURES


  - Shared family calendar with recurring events, reminders and birthdays

  - CalDAV / Google Calendar / Apple iCloud / ICS subscription sync

  - Tasks with multi-assignment and due dates

  - Shopping lists and a kitchen/meal planner

  - Notes, contacts (CardDAV) and a household budget with recurring entries &
    split expenses

  - Housekeeping: staff, chores and supplies

  - Weather widget (Open-Meteo, no API key needed)

  - Optional single sign-on via OIDC

  - Full-text search across every module

  - Installable PWA, mobile-first, dark mode, multi-language


  🔒 PRIVACY


  Yuvomi keeps all data in a local SQLite database (optionally encrypted with
  SQLCipher). Nothing leaves your device unless you explicitly enable a calendar
  or contacts sync to a provider you choose.


  🛠️ SET-UP


  Open Yuvomi from your Umbrel dashboard and create the first account — that
  account becomes the family admin and can invite the rest of the household.
releaseNotes: >-
  This update fixes calendar sync with iCloud, improves wall tablets on older
  browsers and brings a quicker birthday import.


  Importing birthdays from contacts now has "Select all" and "Deselect all", so
  a large address book no longer has to be picked one by one. On a phone, the
  currency and long time zones in the appearance settings are no longer cut off.


  Calendar sync keeps more of what you set: assigning a household member to an
  iCloud event no longer turns its Apple Maps place into plain text, and a
  single occurrence changed on the iPhone keeps the person assigned to its
  series. A new event appears at its time in the day right away. A planned snack
  now shows up on the wall and in Today.


  Wall tablets with an older browser that cannot be updated get their footer
  back at the bottom of the screen, and buttons, selections and colors no longer
  disappear there.


  Creating a recipe through an AI assistant connected over MCP works again, and
  requests without a body now get a clear error instead of a server error. Three
  dependencies were updated for published security advisories.


  No database migration and no action is needed. As always, a backup before
  updating is a good idea.


  Full release notes are available at
  https://github.com/ulsklyc/yuvomi/releases/tag/v2.81.0
backupIgnore:
  - data/app/yuvomi.db.plaintext-backup*
  - data/backups/*.db

