manifestVersion: 1
id: yuvomi
storage:
  dataRoot: data
category: files
name: Yuvomi
version: "2.86.0"
tagline: Self-hosted family planner — calendar, tasks, shopping, meals & budget
description: >-
  Yuvomi is a self-hosted, privacy-focused family planner that bundles everything
  a household needs into a single fast PWA — no cloud, no tracking, no ads.


  Everything runs on your Umbrel and stays on your Umbrel.


  ✨ FEATURES


  - Shared family calendar with recurring events, reminders and birthdays

  - CalDAV / Google Calendar / Apple iCloud / ICS subscription sync

  - Tasks with multi-assignment and due dates

  - Shopping lists and a kitchen/meal planner

  - Notes, contacts (CardDAV) and a household budget with recurring entries &
    split expenses

  - Housekeeping: staff, chores and supplies

  - Weather widget (Open-Meteo, no API key needed)

  - Optional single sign-on via OIDC

  - Full-text search across every module

  - Installable PWA, mobile-first, dark mode, multi-language


  🔒 PRIVACY


  Yuvomi keeps all data in a local SQLite database (optionally encrypted with
  SQLCipher). Nothing leaves your device unless you explicitly enable a calendar
  or contacts sync to a provider you choose.


  🛠️ SET-UP


  Open Yuvomi from your Umbrel dashboard and create the first account — that
  account becomes the family admin and can invite the rest of the household.
releaseNotes: >-
  This update remembers what you paid when shopping, lets households make late
  chores pay less, and gives each wall tablet its own night hours.


  Ticking off a shopping item with a price now records the purchase, and the
  item sheet shows what you paid last time. Households that use rewards can
  switch on late completion decay: a task finished after its due day earns one
  point less per day, never below one. Administrators set night hours, idle
  delay, clock and photo fill per wall tablet under Settings, Wall tablets. On
  phones, the kitchen search moves into the tab bar.


  Calendar and reminder sync got several fixes. A new event in a synced calendar
  is uploaded when you save it, an event the provider cancels stops reminding,
  repeating reminders from iOS Reminders or Tasks.org arrive as a series and
  keep running there when ticked off here, and contacts from CardDAV no longer
  merge into one. Date pickers follow the household week start, CardDAV accepts
  long app passwords, and many settings pages now explain errors in your
  language instead of showing English server text.


  Every backup is now checked right after it is written, so a damaged one is
  discarded instead of handed out. Backup downloads are limited to ten per hour
  for each administrator.


  This update changes the database. The changes are applied automatically on the
  first start and need no action from you; as always, a backup before updating
  is a good idea.


  Full release notes are available at
  https://github.com/ulsklyc/yuvomi/releases/tag/v2.86.0
backupIgnore:
  - data/app/yuvomi.db.plaintext-backup*
  - data/backups/*.db

