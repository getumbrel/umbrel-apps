manifestVersion: 1
id: yuvomi
storage:
  dataRoot: data
category: files
name: Yuvomi
version: "2.67.0"
tagline: Self-hosted family planner — calendar, tasks, shopping, meals & budget
description: >-
  Yuvomi is a self-hosted, privacy-focused family planner that bundles everything
  a household needs into a single fast PWA — no cloud, no tracking, no ads.


  Everything runs on your Umbrel and stays on your Umbrel.


  ✨ FEATURES


  - Shared family calendar with recurring events, reminders and birthdays

  - CalDAV / Google Calendar / Apple iCloud / ICS subscription sync

  - Tasks with multi-assignment and due dates

  - Shopping lists and a kitchen/meal planner

  - Notes, contacts (CardDAV) and a household budget with recurring entries &
    split expenses

  - Housekeeping: staff, chores and supplies

  - Weather widget (Open-Meteo, no API key needed)

  - Optional single sign-on via OIDC

  - Full-text search across every module

  - Installable PWA, mobile-first, dark mode, multi-language


  🔒 PRIVACY


  Yuvomi keeps all data in a local SQLite database (optionally encrypted with
  SQLCipher). Nothing leaves your device unless you explicitly enable a calendar
  or contacts sync to a provider you choose.


  🛠️ SET-UP


  Open Yuvomi from your Umbrel dashboard and create the first account — that
  account becomes the family admin and can invite the rest of the household.
releaseNotes: >-
  This release adds a new optional module and a good deal of work on Health.
  Waste collection keeps track of your household's pickup days: define your
  waste types and their weekly or monthly rhythm, or subscribe to your
  municipality's calendar file and let it refresh itself. It stays off until you
  turn it on in Settings, and from there it can also appear on the dashboard and
  in the calendar.


  In Health, the cycle tab has grown into a full tracker, with flow strength
  shown on the calendar, feelings, more fertility signals, and a daily bubble
  that answers what today means for you. Some of what you note there stays yours
  alone, even on days the rest is shared with the family. Next to it, a fasting
  journal records your timers and the fasts you have already finished.


  One change is worth knowing before you update: housekeeping staff and
  shared-expense guests no longer turn up in the lists where you pick a person,
  such as assignees or reminder recipients. Anything already assigned to them
  stays as it is.


  The rest is everyday polish. Form fields, set-aside cards and checked-off
  shopping items are easier to read in both light and dark themes, a shopping
  list can be duplicated and follows what the rest of the household does while
  it is open, and the Schedule module had a full pass for clarity.


  This release applies database migrations. They run by themselves the first
  time the new version starts, and on a large household that can take a moment.


  Full release notes are available at
  https://github.com/ulsklyc/yuvomi/releases/tag/v2.67.0
