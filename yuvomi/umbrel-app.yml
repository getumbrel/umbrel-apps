manifestVersion: 1
id: yuvomi
storage:
  dataRoot: data
category: files
name: Yuvomi
version: "2.78.0"
tagline: Self-hosted family planner — calendar, tasks, shopping, meals & budget
description: >-
  Yuvomi is a self-hosted, privacy-focused family planner that bundles everything
  a household needs into a single fast PWA — no cloud, no tracking, no ads.


  Everything runs on your Umbrel and stays on your Umbrel.


  ✨ FEATURES


  - Shared family calendar with recurring events, reminders and birthdays

  - CalDAV / Google Calendar / Apple iCloud / ICS subscription sync

  - Tasks with multi-assignment and due dates

  - Shopping lists and a kitchen/meal planner

  - Notes, contacts (CardDAV) and a household budget with recurring entries &
    split expenses

  - Housekeeping: staff, chores and supplies

  - Weather widget (Open-Meteo, no API key needed)

  - Optional single sign-on via OIDC

  - Full-text search across every module

  - Installable PWA, mobile-first, dark mode, multi-language


  🔒 PRIVACY


  Yuvomi keeps all data in a local SQLite database (optionally encrypted with
  SQLCipher). Nothing leaves your device unless you explicitly enable a calendar
  or contacts sync to a provider you choose.


  🛠️ SET-UP


  Open Yuvomi from your Umbrel dashboard and create the first account — that
  account becomes the family admin and can invite the rest of the household.
releaseNotes: >-
  This update makes Yuvomi start faster, gives phones more room for content and
  reworks many screens, with a few new features along the way.


  You can now find your weather location by name instead of typing coordinates.
  Birthdays and name days have their own calendar feed, the budget ledger sorts
  by date or amount and filters by account, and on wide screens the calendar
  shows a sidebar with a mini month, people and what is up next. The search
  palette (Cmd+K or Ctrl+K) remembers the places you opened recently.


  New child accounts start with child defaults: budget off, household help
  read-only without amounts, and their own points first. Existing accounts keep
  their permissions. A household help payment task is now only visible to the
  adults who pay.


  On a phone the tab bar shrinks to a small pill while you read, headers take
  less space, and lists react faster when you tick off items. Budget figures are
  clearer: loans keep money you owe apart from money owed to you, statistics
  share one scale, and a missing pulse is no longer drawn as zero. Settings,
  dialogs and empty screens follow one layout across all modules.


  Two database migrations run automatically on first start: one prepares the
  birthday feed, the other moves open household help payment tasks to the adults
  who pay. No action is needed. As always, a backup before updating is a good
  idea.


  Full release notes are available at
  https://github.com/ulsklyc/yuvomi/releases/tag/v2.78.0
backupIgnore:
  - data/app/yuvomi.db.plaintext-backup*
  - data/backups/*.db

