manifestVersion: 1
id: yuvomi
storage:
  dataRoot: data
category: files
name: Yuvomi
version: "2.69.1"
tagline: Self-hosted family planner — calendar, tasks, shopping, meals & budget
description: >-
  Yuvomi is a self-hosted, privacy-focused family planner that bundles everything
  a household needs into a single fast PWA — no cloud, no tracking, no ads.


  Everything runs on your Umbrel and stays on your Umbrel.


  ✨ FEATURES


  - Shared family calendar with recurring events, reminders and birthdays

  - CalDAV / Google Calendar / Apple iCloud / ICS subscription sync

  - Tasks with multi-assignment and due dates

  - Shopping lists and a kitchen/meal planner

  - Notes, contacts (CardDAV) and a household budget with recurring entries &
    split expenses

  - Housekeeping: staff, chores and supplies

  - Weather widget (Open-Meteo, no API key needed)

  - Optional single sign-on via OIDC

  - Full-text search across every module

  - Installable PWA, mobile-first, dark mode, multi-language


  🔒 PRIVACY


  Yuvomi keeps all data in a local SQLite database (optionally encrypted with
  SQLCipher). Nothing leaves your device unless you explicitly enable a calendar
  or contacts sync to a provider you choose.


  🛠️ SET-UP


  Open Yuvomi from your Umbrel dashboard and create the first account — that
  account becomes the family admin and can invite the rest of the household.
releaseNotes: >-
  This is a security update and updating is recommended. It closes two places
  where an ordinary household member could reach further than their role allows.


  Only admins can manage CardDAV contact accounts now. Until this release, a
  member could change the server address of a household CardDAV account, and the
  next sync sent the stored credentials to that server. Members keep reading and
  editing contacts as before.


  The first single sign-on of a household member can no longer be steered by
  another member through their own profile email address. If you use SSO: a
  member whose account has a password and is not yet linked to SSO is no longer
  linked by email address. Their first SSO sign-in shows a message asking them
  to sign in with their password and link SSO under Settings, Account.
  Alternatively, an admin can switch the account to "SSO sign-in only" under
  Settings, Administration, Family. Accounts that are already linked are not
  affected.


  There are no database changes in this update.


  Full release notes are available at
  https://github.com/ulsklyc/yuvomi/releases/tag/v2.69.1
backupIgnore:
  - data/app/yuvomi.db.plaintext-backup*
  - data/backups/*.db

