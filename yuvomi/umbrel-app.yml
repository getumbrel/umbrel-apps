manifestVersion: 1
id: yuvomi
storage:
  dataRoot: data
category: files
name: Yuvomi
version: "2.75.0"
tagline: Self-hosted family planner — calendar, tasks, shopping, meals & budget
description: >-
  Yuvomi is a self-hosted, privacy-focused family planner that bundles everything
  a household needs into a single fast PWA — no cloud, no tracking, no ads.


  Everything runs on your Umbrel and stays on your Umbrel.


  ✨ FEATURES


  - Shared family calendar with recurring events, reminders and birthdays

  - CalDAV / Google Calendar / Apple iCloud / ICS subscription sync

  - Tasks with multi-assignment and due dates

  - Shopping lists and a kitchen/meal planner

  - Notes, contacts (CardDAV) and a household budget with recurring entries &
    split expenses

  - Housekeeping: staff, chores and supplies

  - Weather widget (Open-Meteo, no API key needed)

  - Optional single sign-on via OIDC

  - Full-text search across every module

  - Installable PWA, mobile-first, dark mode, multi-language


  🔒 PRIVACY


  Yuvomi keeps all data in a local SQLite database (optionally encrypted with
  SQLCipher). Nothing leaves your device unless you explicitly enable a calendar
  or contacts sync to a provider you choose.


  🛠️ SET-UP


  Open Yuvomi from your Umbrel dashboard and create the first account — that
  account becomes the family admin and can invite the rest of the household.
releaseNotes: >-
  This update adds pocket money and reworks how many pages are laid out and
  operated.


  Rewards can now hold pocket money: a money balance per child, separate from
  points, credited weekly or monthly on a day you choose. A child asks for a
  deposit or a withdrawal, a parent confirms it, and only the child and the
  parents see the balance. Recurring shared expenses have a place of their own:
  a group lists them, and they can be edited, paused and resumed.


  Many modules open on what you came for. The shift plan shows the plan before
  its master data, waste collection adds the recurring pickup with its main
  button, the budget tells planned from booked amounts, inventory opens on your
  things, and shared expenses show the figures of the group you are looking at.
  Dialogs now follow one pattern, with Cancel and the main button at the bottom
  right, and the settings list their options as rows that save the same way on
  every page. One settings page has a new name: "Integrations" is now "Photos
  and weather".


  On a phone, the calendar header shrinks to one row when you scroll, the
  document viewer uses the whole screen, and the budget month changes with a
  sideways swipe. On a desktop, filters in Tasks open beside the list instead of
  over it, and net worth, statistics and several lists use the width of the
  window. Lists, detail columns and the date picker move the same way
  everywhere.


  The update runs one database migration on first start, which adds the
  pocket-money balance to Rewards. No existing entry is changed and no action is
  needed; as always, a backup before updating is a good idea.


  Full release notes are available at
  https://github.com/ulsklyc/yuvomi/releases/tag/v2.75.0
backupIgnore:
  - data/app/yuvomi.db.plaintext-backup*
  - data/backups/*.db

