manifestVersion: 1
id: yuvomi
storage:
  dataRoot: data
category: files
name: Yuvomi
version: "2.79.0"
tagline: Self-hosted family planner — calendar, tasks, shopping, meals & budget
description: >-
  Yuvomi is a self-hosted, privacy-focused family planner that bundles everything
  a household needs into a single fast PWA — no cloud, no tracking, no ads.


  Everything runs on your Umbrel and stays on your Umbrel.


  ✨ FEATURES


  - Shared family calendar with recurring events, reminders and birthdays

  - CalDAV / Google Calendar / Apple iCloud / ICS subscription sync

  - Tasks with multi-assignment and due dates

  - Shopping lists and a kitchen/meal planner

  - Notes, contacts (CardDAV) and a household budget with recurring entries &
    split expenses

  - Housekeeping: staff, chores and supplies

  - Weather widget (Open-Meteo, no API key needed)

  - Optional single sign-on via OIDC

  - Full-text search across every module

  - Installable PWA, mobile-first, dark mode, multi-language


  🔒 PRIVACY


  Yuvomi keeps all data in a local SQLite database (optionally encrypted with
  SQLCipher). Nothing leaves your device unless you explicitly enable a calendar
  or contacts sync to a provider you choose.


  🛠️ SET-UP


  Open Yuvomi from your Umbrel dashboard and create the first account — that
  account becomes the family admin and can invite the rest of the household.
releaseNotes: >-
  This update reworks how Yuvomi looks and moves on every screen, and adds money
  transfers between budget accounts.


  Moving between pages now fades straight into the finished page, the calendar
  turns its periods with a swipe, and ticked-off items glide away without the
  list jumping. Text uses one calm type scale across all modules, the Overview
  and Health open as a short briefing of what matters today, and red in the
  budget only marks what needs doing. Forms point out problems right at the
  field, every list row works the same way, and many screens use the space on
  wide displays and on phones better. Add sheets open faster, and long lists
  scroll more smoothly.


  In the budget you can now move money between two of your accounts. Paired wall
  displays now also show today's meals, the shopping count, household help,
  waste pickups and expiring pantry items, and a device showing the wall pauses
  personal push notifications. Error messages appear in your language in more
  places, and a late answer after saving closes only its own dialog.


  Seven database migrations run automatically on first start. They prepare
  profile picture addresses, CalDAV task completions, pantry products, birthdays
  without a year, recipe sync errors, the wall push pause and budget transfers.
  Existing pantry stock is grouped into household products once, as groundwork
  for later pantry features; nothing changes on the page yet. No action is
  needed. As always, a backup before updating is a good idea.


  Full release notes are available at
  https://github.com/ulsklyc/yuvomi/releases/tag/v2.79.0
backupIgnore:
  - data/app/yuvomi.db.plaintext-backup*
  - data/backups/*.db

