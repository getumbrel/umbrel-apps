manifestVersion: 1
id: yuvomi
category: files
name: Yuvomi
version: "2.0.1"
tagline: Self-hosted family planner — calendar, tasks, shopping, meals & budget
description: >-
  Yuvomi is a self-hosted, privacy-focused family planner that bundles everything
  a household needs into a single fast PWA — no cloud, no tracking, no ads.


  Everything runs on your Umbrel and stays on your Umbrel.


  ✨ FEATURES


  - Shared family calendar with recurring events, reminders and birthdays

  - CalDAV / Google Calendar / Apple iCloud / ICS subscription sync

  - Tasks with multi-assignment and due dates

  - Shopping lists and a kitchen/meal planner

  - Notes, contacts (CardDAV) and a household budget with recurring entries &
    split expenses

  - Housekeeping: staff, chores and supplies

  - Weather widget (Open-Meteo, no API key needed)

  - Optional single sign-on via OIDC

  - Full-text search across every module

  - Installable PWA, mobile-first, dark mode, multi-language


  🔒 PRIVACY


  Yuvomi keeps all data in a local SQLite database (optionally encrypted with
  SQLCipher). Nothing leaves your device unless you explicitly enable a calendar
  or contacts sync to a provider you choose.


  🛠️ SET-UP


  Open Yuvomi from your Umbrel dashboard and create the first account — that
  account becomes the family admin and can invite the rest of the household.
releaseNotes: "The setup wizard follows the redesigned app. It already borrowed the app's design tokens, so in normal use it looked current, but the colours it falls back on when those tokens cannot be loaded still described the previous release: a packaging or volume mistake produced a page that looked like the old version and pointed the diagnosis in the wrong direction. The tinted wash across the top is gone as well, for the same reason the login screen lost it - the mark is carried by the tile, not by the backdrop\n\nOn the overview, the quick-action button behaved unlike the one in every other module. It slid out of sight whenever you scrolled down and only came back on the way up, which meant a single downward nudge you never made - an address bar sliding out on iOS, a widget growing as its data arrived - could take the button away and leave it away. It was also the last floating button still living inside the scrolling area, the arrangement that made it drift off screen on iPhone in the first place (#634). It now sits in the same place as every other module's button, keeps still while you scroll, and the room reserved for it below the last row comes from the same measurement the rest of the app uses, so the button can no longer cover a link at the bottom of a widget\nThe error panel in Settings, the one that appears when a page cannot load and offers to try again, printed its message and its button in tones that fell short of the contrast requirement against their own red tint, at 4.45:1 and 4.16:1. Both now use the darker ink tone the app already used on every other tinted surface, and the retry button belongs to the message it sits in rather than borrowing the module's colour"
backupIgnore:
  - data/app/yuvomi.db.plaintext-backup*
  - data/backups/*.db

