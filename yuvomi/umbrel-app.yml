manifestVersion: 1
id: yuvomi
storage:
  dataRoot: data
category: files
name: Yuvomi
version: "2.77.1"
tagline: Self-hosted family planner — calendar, tasks, shopping, meals & budget
description: >-
  Yuvomi is a self-hosted, privacy-focused family planner that bundles everything
  a household needs into a single fast PWA — no cloud, no tracking, no ads.


  Everything runs on your Umbrel and stays on your Umbrel.


  ✨ FEATURES


  - Shared family calendar with recurring events, reminders and birthdays

  - CalDAV / Google Calendar / Apple iCloud / ICS subscription sync

  - Tasks with multi-assignment and due dates

  - Shopping lists and a kitchen/meal planner

  - Notes, contacts (CardDAV) and a household budget with recurring entries &
    split expenses

  - Housekeeping: staff, chores and supplies

  - Weather widget (Open-Meteo, no API key needed)

  - Optional single sign-on via OIDC

  - Full-text search across every module

  - Installable PWA, mobile-first, dark mode, multi-language


  🔒 PRIVACY


  Yuvomi keeps all data in a local SQLite database (optionally encrypted with
  SQLCipher). Nothing leaves your device unless you explicitly enable a calendar
  or contacts sync to a provider you choose.


  🛠️ SET-UP


  Open Yuvomi from your Umbrel dashboard and create the first account — that
  account becomes the family admin and can invite the rest of the household.
releaseNotes: >-
  This update fixes calendar sync details, makes error messages on the health
  pages speak your language, and tightens how reminder and task sync talk to a
  CalDAV server.


  A "last day of the month" series now keeps the date you entered: it goes out
  with the same start on every upload, and the next sync no longer writes the
  start that came back into Yuvomi or moves its reminders. A timed series that
  ends on a date ends on the same occurrence in Google as in Yuvomi. Renaming an
  event no longer shifts it when the app and the server run in different time
  zones and no household time zone is set.


  The health pages and the waste source dialog now explain a failed save or
  refresh in the language of the app instead of showing the server's text. A
  contact or shopping item already deleted on a CalDAV or CardDAV server no
  longer blocks its sync, and reminder and task sync check every request against
  the account's address, as event sync already did.


  The update runs three database migrations on first start. They add columns the
  calendar sync and the waste sources need; no action is needed. As always, a
  backup before updating is a good idea.


  Full release notes are available at
  https://github.com/ulsklyc/yuvomi/releases/tag/v2.77.1
backupIgnore:
  - data/app/yuvomi.db.plaintext-backup*
  - data/backups/*.db

