manifestVersion: 1
id: yuvomi
storage:
  dataRoot: data
category: files
name: Yuvomi
version: "2.83.0"
tagline: Self-hosted family planner — calendar, tasks, shopping, meals & budget
description: >-
  Yuvomi is a self-hosted, privacy-focused family planner that bundles everything
  a household needs into a single fast PWA — no cloud, no tracking, no ads.


  Everything runs on your Umbrel and stays on your Umbrel.


  ✨ FEATURES


  - Shared family calendar with recurring events, reminders and birthdays

  - CalDAV / Google Calendar / Apple iCloud / ICS subscription sync

  - Tasks with multi-assignment and due dates

  - Shopping lists and a kitchen/meal planner

  - Notes, contacts (CardDAV) and a household budget with recurring entries &
    split expenses

  - Housekeeping: staff, chores and supplies

  - Weather widget (Open-Meteo, no API key needed)

  - Optional single sign-on via OIDC

  - Full-text search across every module

  - Installable PWA, mobile-first, dark mode, multi-language


  🔒 PRIVACY


  Yuvomi keeps all data in a local SQLite database (optionally encrypted with
  SQLCipher). Nothing leaves your device unless you explicitly enable a calendar
  or contacts sync to a provider you choose.


  🛠️ SET-UP


  Open Yuvomi from your Umbrel dashboard and create the first account — that
  account becomes the family admin and can invite the rest of the household.
releaseNotes: >-
  This update brings servings to recipes, your own defaults for new tasks and a
  broad round of fixes across the app.


  A recipe can now say how many servings it is for, and a stepper recalculates
  every amount; planning a meal or adding it to the shopping list takes the
  servings you chose. New tasks open with the visibility and lock setting you
  pick under Settings > Tasks. Shared expenses use your budget categories, and
  recipes mirrored from Mealie now bring their preparation steps along.


  Recurring tasks keep their repeat on a CalDAV server, old daily series show up
  in the calendar again, and imported calendars take on a new colour when you
  change it. Amount fields accept a comma or a point, weights in grams and
  kilograms share one chart, and email with encryption set to "None" now sends.
  Many smaller fixes make phone layouts, settings and the welcome tour easier to
  use.


  A member colour can now only be a real colour. Before, another account in the
  household could place its own styling on other members' screens through that
  field.


  This update changes the database. The changes are applied automatically on the
  first start and need no action from you; as always, a backup before updating
  is a good idea.


  Full release notes are available at
  https://github.com/ulsklyc/yuvomi/releases/tag/v2.83.0
backupIgnore:
  - data/app/yuvomi.db.plaintext-backup*
  - data/backups/*.db

