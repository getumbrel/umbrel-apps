manifestVersion: 1
id: yuvomi
storage:
  dataRoot: data
category: files
name: Yuvomi
version: "2.85.0"
tagline: Self-hosted family planner — calendar, tasks, shopping, meals & budget
description: >-
  Yuvomi is a self-hosted, privacy-focused family planner that bundles everything
  a household needs into a single fast PWA — no cloud, no tracking, no ads.


  Everything runs on your Umbrel and stays on your Umbrel.


  ✨ FEATURES


  - Shared family calendar with recurring events, reminders and birthdays

  - CalDAV / Google Calendar / Apple iCloud / ICS subscription sync

  - Tasks with multi-assignment and due dates

  - Shopping lists and a kitchen/meal planner

  - Notes, contacts (CardDAV) and a household budget with recurring entries &
    split expenses

  - Housekeeping: staff, chores and supplies

  - Weather widget (Open-Meteo, no API key needed)

  - Optional single sign-on via OIDC

  - Full-text search across every module

  - Installable PWA, mobile-first, dark mode, multi-language


  🔒 PRIVACY


  Yuvomi keeps all data in a local SQLite database (optionally encrypted with
  SQLCipher). Nothing leaves your device unless you explicitly enable a calendar
  or contacts sync to a provider you choose.


  🛠️ SET-UP


  Open Yuvomi from your Umbrel dashboard and create the first account — that
  account becomes the family admin and can invite the rest of the household.
releaseNotes: >-
  This update lets recurring tasks rotate through the household, reads stock per
  product and closes a gap in the guest access for shared expenses.


  A recurring task like taking out the bin can now hand itself to the next
  person in a fixed order with every new occurrence. In Stock, the minimum
  belongs to the product, so running low is read over all its batches together
  and the shopping list gets the real shortfall. The Overview can have its own
  tile arrangement on the phone, and Settings, Account lists the phones signed
  in with the native app and pairs a new one with a short code or QR code.


  The weather tile no longer shows your coordinates when no place name is set,
  deleting the first occurrence of a recurring event also stops its reminder,
  and renaming a shopping category now carries over to recipes, meals and stock.
  A birthday keeps the color you give it in the calendar. Page titles stand in
  full next to search and the month on narrow phones, and stopping the app no
  longer waits for a hard kill.


  A guest invited to shared expenses could read the household's account list;
  guests now reach only shared expenses and their own account.


  This update changes the database. The changes are applied automatically on the
  first start and need no action from you; as always, a backup before updating
  is a good idea.


  Full release notes are available at
  https://github.com/ulsklyc/yuvomi/releases/tag/v2.85.0
backupIgnore:
  - data/app/yuvomi.db.plaintext-backup*
  - data/backups/*.db

