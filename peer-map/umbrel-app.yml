id: peer-map
category: bitcoin
name: Peer Map
version: "2.0.0"
tagline: See where your peers are, who runs them and what they are
description: >-
  Ever wondered who all these connections are? Your node talks to dozens, often hundreds, of other nodes, and Bitcoin Core lists them as a wall of addresses. Peer Map tells you what they are: real nodes running Core, Knots or btcd, mining pools, phone wallets, light clients, address indexers, network crawlers, university scanners – and disguised peers that only pretend to be Core. Next to what each peer claims, it shows what Core actually observed: whether it offers services, relays transactions and follows a chain Core knows.


  It also shows where they are and who runs them: every peer on a world map, split into the manual peers you chose, the outbound peers Core picked for you and the inbound peers that found you, with the network operator behind each address. Three peers in three different countries can still be three rented machines at one company – the operator is where that shows. Peers with no place on a map are counted rather than dropped: Tor, I2P and CJDNS, and inbound IPv6 that umbrelOS hands over through Docker.


  Curious which of these peers delivers new blocks first? Bitcoin Lab, in the same store, measures it. With both installed, Peer Map follows each new block: who mined it and which peer delivered it first – and, with Stratum Race and your own pool added to it, the block's whole route to your mining job.


  It is built to cost nothing while you are not looking. There is no background job: Bitcoin Core is asked for its peer list only while the dashboard is open, at most every ten seconds, and a dashboard nobody has touched for half an hour pauses itself. The app is a single small binary with the map and the location database built in, so nothing is downloaded and no peer address ever leaves your node.


  IP geolocation and network data by DB-IP (https://db-ip.com), licensed CC BY 4.0. Map data from Natural Earth.


