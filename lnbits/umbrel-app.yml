manifestVersion: 1
id: lnbits
storage:
  dataRoot: data
category: bitcoin
name: LNbits
version: "1.7.1"
tagline: Multi-user wallet management system
description: >-
  LNbits is a simple multi-user and account system for Lightning
  Network that can be used for creating separate Lightning wallets for friends
  and family members. You can also create multiple accounts for yourself to
  mitigate the risk of exposing applications to your full balance via unique API
  keys for each wallet.


  LNbits is packaged with tools to help manage funds, such as a table of transactions, line chart of spending, export to CSV, and more to come. It provides an extendable platform for expanding Lightning Network functionality via LNbits extension framework, and can also be used as a fallback wallet for the LNURL scheme.
developer: LNbits
website: https://github.com/lnbits/lnbits-legend
dependencies:
  - lightning
repo: https://github.com/lnbits/lnbits-legend
support: https://t.me/lnbits
port: 3007
gallery:
  - 1.jpg
  - 2.jpg
  - 3.jpg
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  🚨 LNbits urges all users to update immediately. This security update rotates the authentication signing key, so you will need to sign in again. It also disables the default extension reviews service.


  If you are upgrading from before v1.7.0, funds on those earlier versions are at risk. Updating alone does not revoke wallet keys or other credentials that may have been exposed. After updating, open LNbits as the Super Admin, go to Settings → Users and select Reset Wallet Keys, then update connected apps with their new keys. Follow LNbits' full recovery guidance for replacing funding-source credentials, other stored secrets and extension connections: https://news.lnbits.com/news/lnbits-1-7-0-security-update


  Full release notes are available at https://github.com/lnbits/lnbits/releases/tag/v1.7.1
submitter: Umbrel
submission: https://github.com/getumbrel/umbrel/pull/372
