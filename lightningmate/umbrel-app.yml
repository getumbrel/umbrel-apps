# Official Umbrel App Store manifest (getumbrel/umbrel-apps).
# Per the packaging guide: bare `lightningmate` id, gallery [], NO icon field —
# the Umbrel team hosts the final icon + screenshots (provide them in the PR body).
manifestVersion: 1
id: lightningmate
storage:
  dataRoot: data
category: bitcoin
name: Lightning Mate
version: "0.9.1"
tagline: Profit-aware management & autopilot for your Lightning node
description: >-
  Lightning Mate manages your Lightning node so you don't have to babysit it.
  It connects automatically to your Umbrel Lightning (LND) node and asks three
  short questions the first time you open it: what the node is for, how much the
  app may use, and what that will do.


  The start page says what needs you today. Click any node for its details: how
  its channel is doing, what it earned, what each side charges and its place in
  the network, or how it scores as a peer if you are thinking of opening a
  channel. Every setting is still there for those who want it, under Advanced.


  See what each channel earned, a routing report, and a Profit & Loss overview
  (routing revenue against every cost). Get scored channel-peer suggestions from
  the network graph and open channels in a click, plus a node health score.


  Flip on the Autopilot and the node tunes its own pricing, runs only profitable
  rebalances, and opens channels to top peers, on recommended settings with safe
  caps and cooldowns.


  Buy and sell channel liquidity on the Amboss Magma marketplace right inside the
  app: purchase inbound, list your own offer, and let the Autopilot fulfil orders,
  opening channels to buyers within your capital, channel-size and on-chain
  reserve caps. Amboss decides which seller gets an order.


  LSP mode (experimental) turns your node into a Lightning Service Provider: wallets
  speaking the open LSPS1 standard (bLIP-51) can buy inbound channels from you
  directly, priced automatically, paid via a hold invoice that only settles
  once the channel is opening, refunded automatically on any failure. Off by
  default.


  Lightning Mate signs in with the per-app password Umbrel generates for it
  (shown when you open the app), so no other app on your server can read your
  node or move your funds.
releaseNotes: |-
  Lightning Mate is now as easy to use as it is thorough: the page says what
  needs you, and every setting is still there when you want it.

    Easier
    - A new install asks three short questions: what the node is for, how much
      the app may use, and what that will do. Skip them if you know better.
    - The start page opens with what needs you today, each line leading to where
      it is dealt with. Health, profit and the liquidity map open on a click.
    - Autopilot is one page: your strategy, one row per area with its switch and
      what it did last, and your limits. "Advanced" says how many settings you
      changed and can put them back.
    - Long explanations moved behind a "?". Settings has what the words mean.

    Node details
    - Click a node's name almost anywhere: one sentence says where you stand with
      it, then its channel, what it earned, what each side charges and its place
      in the network.
    - A node without a channel is scored the way the suggestions score it. Find
      any node by alias, key or key@host:port, and open a channel to it.
    - The Channels table shows four columns, with more on request.

    Selling on Magma (off by default)
    - Orders are accepted with a hold invoice: the buyer's payment settles only
      once Amboss confirms the channel, and every failure refunds it. Each step is
      recorded before it happens, so a restart never opens a second channel.
    - A buyer's node that takes a while to answer over Tor is dialed again until
      shortly before the order's deadline, not turned down at once.
    - Your offer can follow what is free on chain, and a sold channel can close
      itself after its lease unless it earns as much as selling again.
    - Amboss decides which seller gets an order, mostly by track record. Price and
      size don't buy a match, and the app doesn't say they do.

    Autopilot
    - Fees move in bounded steps and rise only when a channel drains; a refill
      never pays more than the profit check allowed; automatic opens wait for a
      fair fee rate and, where the node's routing yield is measured, must pay back;
      a peer briefly offline is no reason to close.
    - "Pause all" switches every automation off at once, and each area says what
      it last decided and why.

    Profit & loss
    - Every cost counts: closes and their sweeps, rebalances made with any tool,
      inbound bought on Magma.

    Privacy and security
    - With Umbrel's Tor proxy, every lookup the app makes goes through Tor; Settings
      → Privacy lists each destination and its switch.
    - The API refuses requests a browser marks as cross-site.
