# Official Umbrel App Store manifest (getumbrel/umbrel-apps).
# Per the packaging guide: bare `lightningmate` id, gallery [], NO icon field —
# the Umbrel team hosts the final icon + screenshots (provide them in the PR body).
manifestVersion: 1
id: lightningmate
storage:
  dataRoot: data
category: finance
name: Lightning Mate
version: "0.7.7"
tagline: Profit-aware management & autopilot for your Lightning node
description: >-
  Lightning Mate manages your Lightning node so you don't have to babysit it.
  It connects automatically to your Umbrel Lightning (LND) node.


  See channels with live balance bars and source / sink / router roles, a full
  Forwards routing report, and a Profit & Loss overview (routing revenue vs
  channel-open and rebalancing costs). Get scored channel-peer suggestions from
  the network graph and open channels in a click, plus a node health score.


  Flip on the Autopilot and the node tunes its own pricing, runs only profitable
  rebalances, and opens channels to top peers — all on recommended settings with
  safe caps and cooldowns.


  Buy and sell channel liquidity on the Amboss Magma marketplace right inside the
  app: purchase inbound, list your own offer, and let the Autopilot fulfil orders
  — opening channels to buyers within your capital, channel-size and on-chain
  reserve caps.


  LSP mode (beta) turns your node into a Lightning Service Provider: wallets
  speaking the open LSPS1 standard (bLIP-51) can buy inbound channels from you
  directly — priced automatically, paid via a hold invoice that only settles
  once the channel is opening, refunded automatically on any failure. Off by
  default.


  Lightning Mate signs in with the per-app password Umbrel generates for it
  (shown when you open the app), so no other app on your server can read your
  node or move your funds.
releaseNotes: |-
  Magma selling rebuilt around what buyers actually pay, the Autopilot can now
  size your offer as well as price it, and channel peers gained a trust signal.
  This bundles everything since 0.7.0.

  Offer sizing
  - New switch: let the Autopilot keep your Magma offer's size range and lease
    length in step with the market, up to a maximum order size you set. Size
    decides whether a buyer can be matched with you at all; price only decides
    what you earn once they are. Sizing never touches your price: unless you
    also delegate pricing, the price stays exactly what you set, and the
    smallest order admitted is worked out from that price so it cannot let in
    orders that would lose money.
  - The caps now tell you what they are worth: the share of real Magma orders you
    can serve today, and what each larger maximum would unlock. If your on-chain
    balance rather than your setting is the limit, the app says so instead of
    letting you tune the wrong knob.

  Magma
  - Offers are now priced against Amboss's real completed orders instead of the
    prices other sellers are asking. Listed prices are wishes; this is what money
    changed hands at.
  - Removed a feedback loop that quietly ruined offers. The Autopilot used to cut
    the price a little more for every day without a sale, which sounds like price
    discovery but is not: a Magma purchase carries no offer id, so Amboss picks
    the seller. Being cheapest wins nothing and only gives away the margin.
    Offers already driven to the floor are lifted back.
  - Fixed a bug where the fee rate hit its minimum and the real price silently
    became whatever the base fee happened to be, often a fraction of the price
    the app believed it had set.
  - New: "your size window reaches X% of real orders". This is usually the true
    reason an offer sits unsold, because a window that misses the median order
    size cannot be matched at any price. The app shows what a larger maximum
    channel size would unlock, and the Autopilot now keeps an offer's size range
    and lease length in step with the market, not just its price.
  - Available liquidity on the market page subtracts each offer's committed
    orders, so a fully booked seller no longer looks wide open.
  - Buying: pick a specific seller from the ranked list and the order goes to
    them.
  - An expired Amboss key now shows you why nothing is selling instead of an
    empty page, and is called out in Settings rather than failing silently.

  Channel peers
  - Peer suggestions now include reputation from lightningnetwork.plus: rank,
    Prime status and the ratings real operators gave each other. A network graph
    can show that a node is well connected; it cannot tell you whether people who
    opened channels to it would do it again. Peers without an LN+ profile are
    never penalised, and the reputation only refines the ranking rather than
    driving it.
  - New LN+ view under Market: browse Liquidity Pool nodes and open Swaps, with
    an upfront check of whether your node actually qualifies for each swap.

  Rebalancing and analytics
  - The rebalance autopilot no longer gets stuck raising a busy channel's price
    forever instead of refilling it, and the daily budget goes to the most
    profitable moves first.
  - New Routing view with per-channel flow direction, routing corridors and the
    forwards that were refused for lack of liquidity.
  - Cleaner Performance tab with the eight metrics that matter.
