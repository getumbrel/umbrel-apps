manifestVersion: 1
id: teslamate
category: automation
name: TeslaMate
version: "4.0.1"
tagline: A powerful, self-hosted data logger for your Tesla
description: >-
  TeslaMate is a powerful, self-hosted data logger for your Tesla.


  After install, open the app and sign in with your Tesla account so TeslaMate can start logging. Dashboards live in Grafana at http://umbrel.local:4070 — log in with admin / admin and set a new password when prompted.


  ⚠️ Keep TeslaMate on your home network or behind a VPN. It stores Tesla API tokens; do not expose it to the public internet without additional hardening.


  Your Umbrel needs to stay online with internet access so TeslaMate can poll Tesla continuously. About 1–2 GB of RAM is recommended.


  Features:


  - Detailed drive, charge, and battery history with beautiful Grafana dashboards


  - Efficiency, costs, and geofence-aware insights


  - MQTT topics for Home Assistant and other automations (broker is internal to this app)


  - TeslaMateApi JSON REST API at http://umbrel.local:4071/api for Home Assistant and other clients (read endpoints; vehicle commands are not enabled)


  - Import support for historical data via the app's import directory


  Grafana default credentials: username admin, password admin (change on first login).
