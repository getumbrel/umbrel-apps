manifestVersion: 1
id: seawise
storage:
  dataRoot: data
category: networking
name: Seawise.io Client
version: "1.0.13"
tagline: Share your self-hosted apps without port forwarding
description: >-
  Requires a free Seawise.io account. After install, open the app to set a
  password, then pair it with your account.


  Seawise.io Client connects your Umbrel to Seawise.io over an outbound-only
  tunnel, so you can share apps like Jellyfin, Immich, Home Assistant or
  Nextcloud with family and friends without opening ports or setting up a VPN.


  Add an app by its local address, for example http://umbrel.local:8096, and
  Seawise.io gives it a secure link you can share. You can also group apps into
  portals.
releaseNotes: ""
developer: Seawise.io
