manifestVersion: 2.0
id: brave
category: networking
name: Brave
version: "1.96.59"
tagline: Browse privately with built-in ad and tracker blocking
description: >-
  Brave is a web browser with built-in ad and tracker blocking. Run it on your Umbrel and access the browser remotely from your own devices.


  This app requires umbrelOS 2.0 or later and opens over HTTPS. On first use, your browser may ask you to accept your Umbrel's local certificate. Sign in with the username and password shown in the app's credentials dialog.


  Browse websites, manage bookmarks, install Chrome-compatible extensions, and keep your browsing profile on your Umbrel. Browser settings, bookmarks, extensions, and downloaded files persist across app restarts and updates.


  Use the file manager in the remote session's sidebar to access downloaded files. All users with access to this app share the same browser profile and session.
releaseNotes: ""

developer: Brave Software
website: https://brave.com
dependencies: []
repo: https://github.com/brave/brave-browser
support: https://github.com/linuxserver/docker-brave/issues

port: 3436
gallery: []
path: ""
requiresHttps: true

defaultUsername: umbrel
defaultPassword: ""
deterministicPassword: true

submitter: dennysubke
submission: https://github.com/getumbrel/umbrel-apps
