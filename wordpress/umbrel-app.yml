releaseNotes: >-
  🚨 This security update upgrades PHP to 8.3.36, fixing two critical vulnerabilities (CVE-2026-109618 and CVE-2026-109619) that can allow unauthenticated remote code execution.
  Update as soon as possible, especially if your site is reachable from the internet.
  WordPress remains on version 7.1.3.


  Security advisory: https://www.php.net/archive/2026.php#2026-10-21-5


  ⚠️ To fully update your WordPress instance, you need to go to the admin interface and update from there as well.


  WordPress 7.1.3 is a security and maintenance release with seven security fixes and four bug fixes.


  Full release notes can be found at https://wordpress.org/documentation/wordpress-version/version-7-1-3/
