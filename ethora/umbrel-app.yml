manifestVersion: 1
id: ethora
category: social
name: Ethora
version: "2610.10"
tagline: Your own chat server with a web app, admin panel and SDKs
description: >-
  Ethora is a chat and messaging platform you run yourself: a web chat and
  admin panel, an API, an XMPP server (ejabberd) and file storage, with
  mobile and web SDKs on top. Create apps, users and chat rooms, and connect
  your own clients through the API and the SDKs.


  Sign in with the username and password Umbrel shows for this app. Open the
  app through its Umbrel address (umbrel.local): file links that users share
  point at it.


  This is Ethora Core: free, with per-server limits of 5 apps and 500 user
  accounts, raised to 10 and 5,000 by registering for free on the License
  page of the admin panel. Licence: https://ethora.com/legal/ethora-core-license/
releaseNotes: >-
  First release of Ethora Core for umbrelOS: web chat, admin panel, API,
  XMPP server and file storage in one app, release line 2610.

developer: Dappros
website: https://ethora.com
dependencies: []
repo: https://github.com/dappros/ethora-install
support: https://github.com/dappros/ethora-install/issues

port: 8456
gallery:
