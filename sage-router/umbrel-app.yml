manifestVersion: 1.1
id: sage-router
name: Sage Router
tagline: Intelligent multi-provider AI router
category: ai
version: "1.0.5"
port: 8790
description: >-
  Sage Router is a dynamic multi-provider AI router that discovers available
  LLM providers and routes requests intelligently based on intent, model
  capabilities, cost, and health.


  The dashboard includes a built-in setup flow for adding credentials for
  DeepSeek, OpenAI-compatible services, Anthropic, Google Gemini, OpenRouter,
  Ollama, Codex, and other supported providers. Credentials and imported auth
  JSON are written only to Sage Router's own app data under `/config`.


  Sage Router is harness and provider agnostic. OpenClaw is not required. The
  app connects to the Ollama Umbrel app through its exported app-to-app URL and
  stores its internal provider configuration in Sage Router's own app data.


  Local Ollama works through the required Ollama app. Cloud providers become
  available only after the user adds their own API key or subscription in the
  Sage Router dashboard.


  Features:
  - Intent-aware routing (code, frontier, eco, local, agentic)
  - OpenAI Chat Completions + Anthropic Messages + Google Generative AI bridges
  - Streaming SSE for chat and code completions
  - Built-in dashboard with provider health, latency, and usage analytics
  - Optional client API-key enforcement via `SAGE_ROUTER_CLIENT_AUTH_REQUIRED`
  - Tool/function calling with Codex Responses API schema translation
