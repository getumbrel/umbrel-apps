manifestVersion: 1
id: kwant
storage:
  dataRoot: data
category: ai
name: kwant
version: "0.9.17"
tagline: Your own team of AI bots that check each other's work
description: >-
  kwant asks for a sign-in token the first time you open it: use the password Umbrel shows for
  kwant (right-click the app icon and choose Show default credentials). The browser then stays
  signed in for a year.


  kwant is an open-source, self-hosted team of AI bots. They share chats, hand work to each other
  and run on a schedule, and a step only counts as done once kwant has seen the proof, not when a
  bot says so. Add an AI account you already have (an API key, or a Claude, Codex or Grok sign-in)
  and ask your first question.


  Your bots, chats, settings and files stay in kwant's own folder on your Umbrel. This image has
  no AI command-line tools inside; add an account in the app to start.
releaseNotes: ""
