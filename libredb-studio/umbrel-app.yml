manifestVersion: 1
id: libredb-studio
category: developer
name: LibreDB Studio
version: "0.13.7"
tagline: MIT-licensed open source SQL IDE for 16 database engines
description: >-
  LibreDB Studio is a MIT-licensed, self-hosted SQL IDE that connects to 16
  engines including PostgreSQL, MySQL, Oracle, SQL Server, SQLite, libSQL,
  DuckDB, MongoDB, Redis, Couchbase, ClickHouse, Druid, Elasticsearch,
  OpenSearch, Apache Trino and Apache Cassandra, all from the browser. On
  first start it creates an initial admin account and stores its own data in
  a local SQLite file, so no external database is required to run it.


  The AI assistant is optional and works with Gemini, OpenAI or a local
  Ollama model. With a local model, prompts, schema and data stay on your
  network.
releaseNotes: Updated to LibreDB Studio 0.13.7 and switched to the Docker Hub image.
