version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: libredb-studio_server_1
      APP_PORT: 3000

  server:
    image: libredb/libredb-studio:0.16.1@sha256:1d0aa4f090ac596837cb71c6c9325eaf9eee61db2d747a1ee92c1798cfb7ac95
    restart: on-failure
    user: "1000:1000"
    environment:
      PORT: "3000"
      STORAGE_PROVIDER: sqlite
      STORAGE_SQLITE_PATH: /app/data/libredb-storage.db
      ADMIN_EMAIL: admin@libredb.org
      ADMIN_PASSWORD: $APP_PASSWORD
      JWT_SECRET: $APP_LIBREDB_STUDIO_JWT_SECRET
      AUTH_COOKIE_SECURE: "false"
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
