version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: libredb-studio_server_1
      APP_PORT: 3000

  server:
    image: libredb/libredb-studio:0.18.2@sha256:1b4051ca999ab6418a2bbaee2c56374abe4918ab84e7176255d7ec2c9fea8e60
    restart: on-failure
    user: "1000:1000"
    environment:
      PORT: "3000"
      STORAGE_PROVIDER: sqlite
      STORAGE_SQLITE_PATH: /app/data/libredb-storage.db
      ADMIN_EMAIL: admin@libredb.org
      ADMIN_PASSWORD: $APP_PASSWORD
      JWT_SECRET: $APP_LIBREDB_STUDIO_JWT_SECRET
      AUTH_COOKIE_SECURE: "false"
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
