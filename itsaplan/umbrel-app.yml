manifestVersion: 1
id: itsaplan
storage:
  dataRoot: data
category: files
name: It's a Plan
version: "1.5.0"
tagline: Open-source project management and issue tracking
description: >-
  It's a Plan is an open-source, self-hosted alternative to Linear and Plane.
  Project management and issue tracking where teams and AI agents work side by side
  to plan and ship products.


  Features
    - Issues: create and manage tasks with a rich text editor, sub-properties, and related-issue references.
    - Projects, teams, and workspaces with role-based access.
    - Agent-friendly: MCP server, SCIM provisioning, and an AI-agent runtime built in.
    - Attachments stored in an S3-compatible object store (RustFS).
    - Optional Telegram bot, webhooks, and email/SSO integrations configured in god mode.


  The first account you register becomes the instance admin. The admin (god mode)
  panel is reachable at `/god-mode` on the web origin.
