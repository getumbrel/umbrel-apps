# Umbrel It's a Plan nginx reverse proxy

map $http_x_forwarded_port $final_port {
    default $http_x_forwarded_port;
    ""      8790;
}

map $http_x_forwarded_proto $final_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
  listen 8790;

  client_max_body_size 50m;

  port_in_redirect off;
  absolute_redirect off;

  proxy_set_header Host                $http_host;
  proxy_set_header X-Real-IP           $remote_addr;
  proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto   $final_proto;
  proxy_set_header X-Forwarded-Host    $http_host;
  proxy_set_header X-Forwarded-Port    $final_port;

  # MCP / OAuth discovery at the host root reaches the api.
  location /.well-known/ {
    proxy_pass http://itsaplan_api_1:3000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }

  location = /mcp {
    proxy_pass http://itsaplan_api_1:3000/mcp;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }

  # API: strip the /api prefix so the api receives its native paths.
  location /api/ {
    proxy_pass http://itsaplan_api_1:3000/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }

  location / {
    proxy_pass http://itsaplan_web_1:3001;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }
}
