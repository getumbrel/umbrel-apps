manifestVersion: 1
id: quireink
category: files
name: Quire Ink
version: "2.2.1"
tagline: A self-hosted blog with a real editor, book-style reading, and no third-party requests
description: >-
  ⚠️ First run: the blog has no owner until you claim it. Open Quire Ink's logs from the
  Troubleshoot screen right after installing — the app prints a one-time claim link there
  at every start. Open that link, create your account, and everything after it happens in
  the browser: your password, the authenticator QR code, and ten recovery codes shown once.


  Quire Ink is a complete blog in one small process: a real editor over Markdown with
  tables, footnotes, mathematics, callouts and video; scheduled publishing; series;
  newsletters over your own SMTP; comments with a spam gate that needs no account anywhere;
  cookie-free analytics; full-text search; and a book mode that sets a post in two columns
  on paper, with a drop cap. Readers download between 3.8 and 8.7 KB of JavaScript and
  nothing from any third party — no CDN, no fonts service, no tracker.


  The interface speaks eleven languages — English, Tiếng Việt, Deutsch, 日本語, 简体中文,
  한국어, Français, Español, Português (Brasil), Italiano, Русский — on the reader's side
  and in the admin.


  Moving in is one upload: importers for WordPress, Ghost, Substack and Medium bring posts,
  pages and images across, write redirects for the old URLs, and fetch images still pointing
  at the old host into your own library.


  An AI agent can do the writing — and the stewarding — over MCP: connect Claude or any MCP
  client and it can draft, tag, schedule and publish, read your traffic, moderate comments
  and audit the archive, through exactly the rules the admin follows.


  Backups are one button that downloads the whole install, scheduled snapshots kept on the
  server, and optional offsite copies to any S3-compatible bucket. Everything lives in two
  SQLite files and one uploads directory on your Umbrel.


  ⚠️ Your published blog will be available at "http://umbrel.local:3477". The easiest way to
  expose it to the public internet is the 'Cloudflare Tunnel' app from the Umbrel App Store,
  tunneling to your own domain — then set the new address in Settings → Site.
