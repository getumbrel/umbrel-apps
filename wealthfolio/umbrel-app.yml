manifestVersion: 1
id: wealthfolio
storage:
  dataRoot: data
name: Wealthfolio
tagline: Private investment portfolio tracking
category: finance
version: "3.9.0"
port: 8880
description: >-
  Wealthfolio is an open source investment portfolio tracker for monitoring holdings, accounts, performance,
  and market activity from your own server. It is designed for private wealth tracking, with a browser-based dashboard
  and local SQLite storage for portfolio data.


  Use Wealthfolio to keep a self-hosted view of your investments without sending portfolio details to a third-party
  tracking service. It supports portfolio and account management, performance views, market data workflows, and a
  focused web interface for personal finance monitoring.
developer: Wealthfolio
website: https://wealthfolio.app/
repo: https://github.com/wealthfolio/wealthfolio
support: https://github.com/wealthfolio/wealthfolio/issues
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
  - 4.webp
releaseNotes: >-
  Important: back up your Wealthfolio data directory before updating. Wealthfolio 3.9.0 adds separate profiles, optional database encryption, app locking, and portable backups. Existing data appears in a Personal profile, and backups now need to include the full persistent data directory, not only the original database file.


  Profiles and app locking let each person keep separate finances, require a password after inactivity, and recover access with a recovery code.


  Portable backups can be password-protected, previewed before restore, and used on another installation; restores require reconnecting external services.


  Insights and Spending gain customizable dashboard widgets, better net-worth and spending controls, improved import/date handling, quote-history fixes, and new formatting-region/timezone behavior.


  Device setup has a single add/join/recover guide. Update receiving devices to Wealthfolio 3.9 before pairing.


  Full release notes can be found at https://github.com/wealthfolio/wealthfolio/releases/tag/v3.9.0
dependencies: []
