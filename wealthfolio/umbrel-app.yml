manifestVersion: 1
id: wealthfolio
storage:
  dataRoot: data
name: Wealthfolio
tagline: Private investment portfolio tracking
category: finance
version: "3.10.0"
port: 8880
description: >-
  Wealthfolio is an open source investment portfolio tracker for monitoring holdings, accounts, performance,
  and market activity from your own server. It is designed for private wealth tracking, with a browser-based dashboard
  and local SQLite storage for portfolio data.


  Use Wealthfolio to keep a self-hosted view of your investments without sending portfolio details to a third-party
  tracking service. It supports portfolio and account management, performance views, market data workflows, and a
  focused web interface for personal finance monitoring.
developer: Wealthfolio
website: https://wealthfolio.app/
repo: https://github.com/wealthfolio/wealthfolio
support: https://github.com/wealthfolio/wealthfolio/issues
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
  - 4.webp
releaseNotes: >-
  Wealthfolio 3.10.0 introduces a new portfolio calculation engine, cost basis methods, loan tracking, and encrypted cloud backups for Wealthfolio Connect subscribers.


  Holdings, cash, valuations, returns, transfers, shorts, splits, FX, and rounding now use one shared engine across desktop, mobile, and the server. The first launch recalculates history after creating a backup, so derived values such as cost basis, realized gains, and past values may change slightly.


  Transaction-tracked accounts can now use FIFO, weighted average cost, LIFO, or HIFO cost basis methods, and liabilities can be tracked as loans or mortgages with amortization schedules and repayments.


  Device sync users should update all devices before using the new cost-basis and return-of-capital data. Self-hosting needs no configuration changes.


  Full release notes can be found at https://github.com/wealthfolio/wealthfolio/releases/tag/v3.10.0
