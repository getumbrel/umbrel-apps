manifestVersion: 1
id: wealthfolio
storage:
  dataRoot: data
name: Wealthfolio
tagline: Private investment portfolio tracking
category: finance
version: "3.9.1"
port: 8880
description: >-
  Wealthfolio is an open source investment portfolio tracker for monitoring holdings, accounts, performance,
  and market activity from your own server. It is designed for private wealth tracking, with a browser-based dashboard
  and local SQLite storage for portfolio data.


  Use Wealthfolio to keep a self-hosted view of your investments without sending portfolio details to a third-party
  tracking service. It supports portfolio and account management, performance views, market data workflows, and a
  focused web interface for personal finance monitoring.
developer: Wealthfolio
website: https://wealthfolio.app/
repo: https://github.com/wealthfolio/wealthfolio
support: https://github.com/wealthfolio/wealthfolio/issues
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
  - 4.webp
releaseNotes: >-
  Wealthfolio 3.9.1 fixes device sync, portfolio returns, and Linux startup reliability.


  Encrypted device transfers are faster and smaller, include broker holdings, and show clearer pairing progress. Update both devices to Wealthfolio 3.9.1 before pairing.


  Holdings-account returns are now consistent after full and partial recalculations. If older return history is incorrect, run a full portfolio rebuild.


  Self-hosted profile startup errors are clearer, and interrupted sessions recover more reliably.


  Full release notes can be found at https://github.com/wealthfolio/wealthfolio/releases/tag/v3.9.1
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
deterministicPassword: false
submitter: al-lac
submission: https://github.com/getumbrel/umbrel-apps/pull/5769
