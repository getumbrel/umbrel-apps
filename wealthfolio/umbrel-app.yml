releaseNotes: >-
  Important: back up your Wealthfolio database before updating. Wealthfolio 3.8.0 migrates older transactions so amounts include fees and taxes, which can change historical cash balances and returns. After updating, review Activities → Needs review and update all synced devices before adding or editing transactions.


  Spending and investment activity lists now load more efficiently, show filtered and selected totals, support foreign-currency cash entries, and add amount-based categorization rules.


  Retirement planning adds pension payout-rate options, improved return assumptions, better negative-return and comma-decimal handling, and Lean/Fat FIRE target calculations.


  This release adds Italian, Brazilian Portuguese, and Traditional Chinese, expands regional formatting options, improves asset-logo handling, and includes many fixes for cash balances, net worth, imports, performance, privacy mode, quotes, self-hosted OIDC key rotation, and mobile/desktop interface behavior.


  Full release notes can be found at https://github.com/wealthfolio/wealthfolio/releases/tag/v3.8.0
