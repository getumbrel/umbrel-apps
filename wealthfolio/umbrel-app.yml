manifestVersion: 1
id: wealthfolio
storage:
  dataRoot: data
name: Wealthfolio
tagline: Private investment portfolio tracking
category: finance
version: "3.11.0"
port: 8880
description: >-
  Wealthfolio is an open source investment portfolio tracker for monitoring holdings, accounts, performance,
  and market activity from your own server. It is designed for private wealth tracking, with a browser-based dashboard
  and local SQLite storage for portfolio data.


  Use Wealthfolio to keep a self-hosted view of your investments without sending portfolio details to a third-party
  tracking service. It supports portfolio and account management, performance views, market data workflows, and a
  focused web interface for personal finance monitoring.
developer: Wealthfolio
website: https://wealthfolio.app/
repo: https://github.com/wealthfolio/wealthfolio
support: https://github.com/wealthfolio/wealthfolio/issues
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
  - 4.webp
releaseNotes: >-
  ⚠️ In rare cases, the first broker sync after updating can reset a holding's average cost to zero, including costs you entered manually. This can affect holdings with three or more decimal places when the broker supplies no average cost. Later syncs will not restore the previous cost.


  Wealthfolio 3.11.0 adds running balances, daily activity grouping, per-currency number formats, Arabic with a right-to-left layout, and currency exchanges within an account. The refreshed interface improves tables, menus, and keyboard accessibility.


  This release also improves income and performance calculations, device sync, loan rate changes, and CSV import templates on self-hosted HTTP connections.


  If you used external credits, custom Other holdings, same-account currency conversions, or currency codes such as USDT on 3.10.0, run Settings → Market Data → History → Refresh full history once to correct past values. Income now uses historical exchange rates and local-time months, and performance includes currency gains and losses on cash.


  Update all devices if you use device sync.


  Upgrading from before 3.10.0 also introduces the new calculation engine: first launch creates a backup and recalculates history, which may change derived cost basis, realized gains, and past values.


  Full release notes can be found at https://github.com/wealthfolio/wealthfolio/releases/tag/v3.11.0
