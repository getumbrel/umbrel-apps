version: '3.7'

services:
  app_proxy:
    environment:
      APP_HOST: baikal_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"
  web:
    image: ghcr.io/aalmenar/baikal:0.13.0-nginx@sha256:45f70865d30a2c86d9591e78ac0441bf2153bb94022d6ccbe07cfb856c08a39b
    # aalmenar/baikal-docker is a maintained fork of ckulka/baikal-docker that publishes upstream Baikal 0.13.0.
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data/config:/var/www/baikal/config
      - ${APP_DATA_DIR}/data/Specific:/var/www/baikal/Specific
