releaseNotes: >-
  This update brings Baikal from 0.11.1 to 0.13.0 and includes a security fix.


  ⚠️ After updating, open Baikal, go to its admin page, and click "Start upgrade". Calendar and contact sync stays paused until you do. Upstream recommends backing up your Baikal data before updating.


  Highlights:
    - Fixed an XSS vulnerability where an authenticated user could take over the admin interface by renaming their calendar (0.12.1)
    - Fixed calendar sharing on old SQLite installs (0.13.0)
    - Fixed emoji encoding on MySQL (0.13.0)
    - Fixed deprecation notices on PHP 8.4 and 8.5, and updated dependencies (0.12.0)
    - Ships with sabre/dav 4.7.1


  Full release notes can be found at https://github.com/sabre-io/Baikal/releases
