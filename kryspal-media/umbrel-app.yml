manifestVersion: 1.1
id: kryspal-media
storage:
  dataRoot: data
folderAccess:
  - id: umbrel-downloads
    name: Downloads
    note: Media files for your Kryspal Media libraries. Available in Kryspal Media at /downloads.
    mounts:
      - service: server
        targetPath: /downloads
  - id: media-library
    name: Media Library
    note: Select a folder containing movies or TV shows, then add /media as a library folder in Kryspal Media. Access is read-only to protect the original files.
    mounts:
      - service: server
        targetPath: /media
        readOnly: true
category: media
name: Kryspal Media
version: "0.9.14"
tagline: A media server that stays fast at any library size
description: >-
  Open Kryspal Media and create the first administrator in the setup wizard, then add a library from /downloads or from the Media Library folder you selected in the app settings (/media).
  To watch in Infuse, SenPlayer or VidHub, add an Emby or Jellyfin server at http://umbrel.local:5797.


  Kryspal Media is a self-hosted media server for your movies and TV shows. Browsing, sorting and filtering run in PostgreSQL, so it stays fast even with very large libraries.


  - Original quality: direct play keeps 4K, HDR and lossless audio. Video is never transcoded.

  - Works with your players: Emby and Jellyfin player apps such as Infuse, SenPlayer and VidHub connect as usual, and a web player is built in.

  - Tidy, even with messy names: flexible folder layouts and version grouping.

  - Members with separate watch history and parental controls.

  - Open-source plugins for metadata and subtitles, and an Apache-2.0 Plugin SDK.

  - No account needed: the FREE plan is a complete media server. PRO and MAX add features such as automatic intro detection and encrypted backups.


  Kryspal Media is proprietary software. This is a beta release.
releaseNotes: ""
developer: Kryspal
website: https://media.kryspal.net
dependencies: []
repo: https://github.com/kryspal/kryspal-media
support: https://github.com/kryspal/kryspal-media/discussions
port: 5797
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
backupIgnore:
  - data/server/cache/*
permissions:
  - STORAGE_DOWNLOADS
submitter: Kryspal
submission: https://github.com/getumbrel/umbrel-apps/pull/6275
