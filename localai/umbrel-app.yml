manifestVersion: 1.1
id: localai
storage:
  dataRoot: data
category: ai
name: LocalAI
version: "v5.0.1"
tagline: Drop-in OpenAI replacement
description: >-
  LocalAI is the free, Open Source OpenAI alternative. LocalAI act as a drop-in replacement REST API that's compatible with OpenAI API specifications for local inferencing.
  
  
  It allows you to run LLMs, generate images, audio locally with consumer grade hardware, supporting multiple model families and architectures.


  ⚠️ Note

  Before running a model, make sure your device has enough free RAM to support it. Attempting to run a model that exceeds your available memory could cause your device to crash or become unresponsive. Always check the model requirements before downloading or starting it.
permissions:
  - GPU
releaseNotes: |-
  This update keeps existing model files until replacement downloads are verified, fixes add-on catalog downloads, and improves chat automation settings and permission handling.

  Chats are now stored on the server. Without separate LocalAI accounts, people with access to this app share the same chat history. To keep older browser-only chats, follow the upgrade guide to export and import them from the browser that holds them.

  New chats turn on agent tools by default, which need more context than small models have. If a chat fails with a context window error, turn tools off in the chat or use a model with a larger context size.

  Studio and Talk are now available as separate add-ons. Models configured with the removed liquid-audio backend need a compatible replacement.

  Upgrade guide: https://localai.io/docs/features/chats-migration/
  Full release notes: https://github.com/mudler/LocalAI/releases/tag/v5.0.1
backupIgnore:
  - data/models/*
  - data/backends/*
developer: Ettore Di Giacinto
website: https://localai.io/
dependencies: []
repo: https://github.com/mudler/LocalAI
support: https://github.com/mudler/LocalAI/discussions
port: 8793
gallery:
  - 1.webp
  - 2.webp
  - 3.webp
  - 4.webp
path: ""
defaultUsername: ""
defaultPassword: ""
submitter: highghlow
submission: https://github.com/getumbrel/umbrel-apps/pull/1079
