manifestVersion: 1
id: inkvoice
storage:
  dataRoot: data
category: finance
name: Inkvoice
version: "0.3.8"
tagline: Open-source invoicing you actually own
description: >-
  Inkvoice is open-source invoicing for freelancers and small teams. Send
  professional invoices, get paid online and keep every record in a single
  SQLite file on your own Umbrel.


  - Invoices, quotes, recurring invoices and credit notes with customizable PDF templates

  - Online payments through your own Stripe and PayPal accounts

  - Read receipts and customer statements

  - Expenses, multi-currency with live exchange rates, and reports that export to CSV

  - Opt-in German and French e-invoicing (XRechnung, ZUGFeRD, Factur-X)

  - Multi-user with roles, single sign-on (OIDC) and a UI in English, Turkish, Spanish, German and French


  Sign in as "admin" with the password shown by Umbrel. Outgoing email
  (SMTP) and payment providers are set up inside the app under Settings.
  To let clients open invoice links or to use the mobile apps from outside
  your home network, expose Inkvoice through your own https reverse proxy
  or tunnel.
releaseNotes: ""
developer: Pigon
website: https://inkvoice.app
