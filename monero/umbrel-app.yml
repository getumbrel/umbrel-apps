releaseNotes: >-
  This update makes the "RPC (IP - Restricted Access)" connection option work from other devices on your network. Its port (18089) is now published, so wallets such as Feather and Monero GUI can connect to it using your RPC username and password.

  This is still Monero v0.18.5.4. Full release notes can be found at https://www.getmonero.org/2026/10/16/monero-0.18.5.4-released.html
