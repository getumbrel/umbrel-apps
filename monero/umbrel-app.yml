releaseNotes: >-
  This is the v0.18.5.3 release of the Monero software. This is a highly recommended release that includes a large number of bug fixes.

  Some highlights of this release are:
    - Daemon: fix P2P connection stalls
    - Daemon: restore transaction relay after restart
    - Daemon: improve block relay handling
    - Daemon: improve duplicate handshake and timeout handling
    - Daemon: group public IPv6 connection limits by /64
    - Daemon: flush rejected block spans from disconnected peers
    - Daemon: improve transaction serialization and validation
    - Daemon: limit output offsets cache size
    - Daemon: improve LMDB resizing and transaction handling
    - Daemon: disable get_transaction_pool in restricted mode
    - Daemon: improve restricted RPC privacy filtering
    - Daemon: restrict get_public_nodes to public zone peers
    - Daemon: reject deep block submissions on restricted RPC
    - ZMQ: recover from oversized requests
    - ZMQ: hide request contents from logs in restricted mode
    - RandomX: update to v1.2.3
    - Prevent log injection from malformed JSON and HTTP headers
    - Fix HTTP connection reuse after remote disconnects

  Full release notes can be found at https://www.getmonero.org/2026/10/06/monero-0.18.5.3-released.html
