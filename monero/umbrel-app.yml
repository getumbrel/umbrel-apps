path: ""
defaultPassword: ""
releaseNotes: >-
  This is the v0.18.5.4 release of the Monero software. This is a minor release that includes bug fixes.

  Some highlights of this minor release are:
    - Daemon: fix DNSSEC validation for checkpoints, blocklists and update checks
    - RPC: restore string-to-integer conversion in JSON requests (to be removed in v0.19 as a breaking change)

  Full release notes can be found at https://www.getmonero.org/2026/10/16/monero-0.18.5.4-released.html
