manifestVersion: 1
id: romarr
category: media
name: ROMarr
version: "1.15.0"
tagline: The *arr for games
description: >-
  Request a title and ROMarr searches your indexers through Prowlarr, hands the
  winner to your download client, verifies what arrived and files the game into
  your library where it can actually be played. If you run Radarr for films and
  Sonarr for TV, this is the missing one.


  ROMarr is not tied to one library. RomM, Gaseous and Retrom are all supported
  and chosen with a single setting. There is also a folder mode that writes a
  plain directory tree laid out by platform, which is what Batocera, RetroPie,
  ES-DE, EmuDeck, Pegasus, muOS and LaunchBox all read, with no URL and no
  account needed.


  Releases are scored for games rather than video: region, revision and
  verified No-Intro and Redump dumps count, prototypes, hacks and cross-console
  mismatches are rejected, and every score shows its reasoning so a wrong pick
  is a click to correct.


  🛠️ SETUP INSTRUCTIONS


  ROMarr needs a Prowlarr instance and at least one download client
  (qBittorrent, Transmission, SABnzbd or NZBGet). Install them from the Umbrel
  App Store first, then open ROMarr, set its password on the first visit and
  fill in the Settings page.


  Finished games are filed into the "roms" folder inside your Downloads storage,
  so they show up in the Files app and over the network.


  ⚠️ ROMarr includes no games or BIOS files. It is not affiliated with RomM,
  Gaseous or Retrom.
developer: Move Weight
website: https://romarr.app
dependencies:
  - prowlarr
repo: https://github.com/BlizzHacker/romarr
support: https://github.com/BlizzHacker/romarr/issues
port: 6868
gallery: []
path: ""
