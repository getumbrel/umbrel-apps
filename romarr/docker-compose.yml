version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: romarr_web_1
      APP_PORT: 6868
      PROXY_AUTH_WHITELIST: "/api/*"

  web:
    image: ghcr.io/blizzhacker/romarr:1.15.0@sha256:7d3b8eb8bff863dc5c3d9468e2c80034e9127c47faf4f6e7a7f800ece7cc69e9
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ}
      LIBRARY_PATH: /downloads/roms
