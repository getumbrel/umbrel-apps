version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: romarr_web_1
      APP_PORT: 6868
      PROXY_AUTH_WHITELIST: "/api/*"

  web:
    image: ghcr.io/blizzhacker/romarr:1.13.2@sha256:83aa20244b487b91461c756b9dcba8792e8b8b601094c8ac6c1018cf38a62dab
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ}
      LIBRARY_PATH: /downloads/roms
