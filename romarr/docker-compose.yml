version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: romarr_web_1
      APP_PORT: 6868
      PROXY_AUTH_WHITELIST: "/api/*"

  web:
    image: ghcr.io/blizzhacker/romarr:1.12.0@sha256:c21dd86feead49b382ee2f810929ff3b34fec6e6c5b73032a962ec5c329c33cb
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ}
      LIBRARY_PATH: /downloads/roms
