version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: romarr_web_1
      APP_PORT: 6868
      PROXY_AUTH_WHITELIST: "/api/*"

  web:
    image: ghcr.io/blizzhacker/romarr:1.14.2@sha256:fa02c67ee2af989ea06be94cf933118ac218f4f066b8453ea000350743fa2083
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ}
      LIBRARY_PATH: /downloads/roms
