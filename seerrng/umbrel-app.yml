manifestVersion: 1.2
id: seerrng
category: media
name: SeerrNG
version: "0.1.0"
tagline: Media requests and discovery across movies, TV, music, and books
description: >-
  SeerrNG is a self-hosted request and discovery application for Plex,
  Jellyfin, and Emby. It supports movie, TV, music, ebook, and audiobook
  requests and connects approved requests to Radarr, Sonarr, Lidarr, and
  Bookshelf or Readarr-compatible services.
