manifestVersion: 1
id: contrack
storage:
  dataRoot: data
category: files
name: Contrack
version: "2.0.6"
tagline: Personal CRM for contacts, notes, reminders, and local search
description: >-
  Contrack is a self-hosted personal CRM for keeping your contacts, notes, follow-ups, and relationship history in one place on your Umbrel.


  Open Contrack from your Umbrel dashboard on first launch to create the admin account. You can use it on your own or invite family members and teammates from Settings -> Administration -> Accounts, where each person gets a separate private address book.


  - Import contacts from Apple, Google, LinkedIn, Facebook, CSV, or vCard, and merge duplicates with a 90-day undo

  - Log notes with attachments and @mentions, set stay-in-touch reminders, and check your daily Pulse view of follow-ups, birthdays, and milestones

  - Search contacts and notes in plain language with local semantic search models bundled inside the container, with no external API keys required

  - Browse contacts on an interactive map and select areas to build lists

  - Sync contacts, calendars, and email history over CardDAV, CalDAV, IMAP, or Google

  - Connect MCP clients such as Claude or Cursor with scoped API tokens or OAuth


  All data stays in a local SQLite database and uploads folder on your Umbrel. Optional AI note parsing and contact research are off by default and can be configured with your own provider in Settings -> Administration -> AI.
releaseNotes: ""

developer: Arvind Arik
website: https://github.com/arvarik/contrack
