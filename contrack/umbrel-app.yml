repo: https://github.com/arvarik/contrack
support: https://github.com/arvarik/contrack/issues

port: 3210
gallery: []
path: ""

defaultUsername: ""
defaultPassword: ""
backupIgnore:
  - data/app/backups/*
  - data/app/.cache/*

