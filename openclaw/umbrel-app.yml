description: >-
  Clears your inbox, sends emails, manages your calendar, checks you in for flights.
  All from WhatsApp, Telegram, or any chat app you already use.


  The OpenClaw app on umbrelOS provides a seamless setup experience. Just enter your API key and go.
  A headless browser is configured out of the box so your new AI assistant can immediately interact with the entire internet.


  OpenClaw is running inside the umbrelOS app sandbox. It has complete freedom to install software inside its own environment
  while all your existing apps and data remain securely protected.


  OpenClaw is also running behind the umbrelOS app proxy, so only you can securely access your OpenClaw instance.


  ## Connect desktop apps and nodes

    - In the client, choose **Remote (another host) → Direct (ws/wss)**.

    - Use `ws://umbrel.local:18791`, `ws://<LAN-IP>:18791`, or `ws://<Tailscale-IP>:18791`.

    - Copy the password from OpenClaw's app settings in Umbrel and enter it in the client's **Gateway token** field.

    - Approve the new device or node in OpenClaw.


  Port 18791 is intended for a trusted private LAN or Tailnet. Do not forward it directly to the public internet;
  use a properly configured `wss://` endpoint over untrusted networks.


  ## What It Does
    - **Runs Locally** - Anthropic, OpenAI, or local models. Private by default—your data stays yours. On your Umbrel.
    - **Any Chat App** - Talk to it on WhatsApp, Telegram, Discord, Slack, Signal, or iMessage. Works in DMs and group chats.
    - **Persistent Memory** - Remembers you and becomes uniquely yours. Your preferences, your context, your AI.
    - **Browser Control** - It can browse the web, fill forms, and extract data from any site.
    - **Sandboxed System Access** - Read and write files, run shell commands, execute scripts within its own sandbox. Your existing data and apps are fully protected.
    - **Skills & Plugins** - Extend with community skills or build your own. It can even write its own.
