releaseNotes: >-
  OpenClaw now recovers more interrupted replies and queued work after Gateway
  restarts. This update also makes scheduled automations more reliable and
  keeps chats responsive during slow background operations.


  Back up your OpenClaw app data before updating. This update automatically
  migrates the database. To roll back, restore the pre-update backup with
  the matching OpenClaw version. Very old installations or retained legacy
  data may need intermediate upgrades.
  See https://docs.openclaw.ai/install/updating#upgrading-very-old-versions.


  If you are upgrading from before 2026.8.1, the bundled OpenProse plugin and
  /prose command have been removed. Your existing .prose files are preserved.
  See https://docs.openclaw.ai/prose for the maintained OpenProse Agent Skill.


  Full release notes can be found at https://github.com/openclaw/openclaw/releases/tag/v2026.11.7
