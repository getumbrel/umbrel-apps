releaseNotes: >-
  This update uses OpenClaw’s maintained extended-stable release, bringing
  additional security and reliability fixes. We’re temporarily holding back
  newer releases because of known bugs in OpenClaw itself. We’ll return to the
  latest release once the upstream fixes are included and pass our testing.


  This release strengthens workspace access restrictions, protects credentials,
  and fixes Microsoft Teams allowlists. It also improves memory use, message
  delivery, provider connections, and update recovery.


  Back up your OpenClaw app data before updating. Very old installations or
  retained legacy data may need intermediate upgrades; see
  https://docs.openclaw.ai/install/updating#upgrading-very-old-versions.
  Reverting the app version alone does not reverse database migrations.


  Full release notes can be found at https://github.com/openclaw/openclaw/releases/tag/v2026.9.36
