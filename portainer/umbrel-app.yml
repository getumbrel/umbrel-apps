releaseNotes: >-
  Portainer 2.45.0 LTS rolls up improvements from the 2.40 to 2.44 STS releases and includes the latest LTS security fixes. This package keeps the Docker runtime rollback that fixes a networking issue affecting other Umbrel apps.


  Highlights include:
    - Added advanced Kubernetes node drain options with agent failover
    - Added native Kubernetes APIs for secrets, configmaps, deployments, persistent volume claims, and manifest dry runs
    - Fixed critical Docker proxy authorization bypass and broadened bind-mount restrictions for non-admin users
    - Strengthened Kubernetes authorization for namespaces, secrets, registries, and shell access
    - Fixed Edge stack, Helm stack removal, Azure Blob backup settings, team-sync, API key metadata, and browser title bar issues
    - Updated Go, go-git, ORAS, OpenTelemetry, kubectl-shell dependencies, and other components to address CVEs


  Full release notes can be found at https://github.com/portainer/portainer/releases/tag/2.45.0.
