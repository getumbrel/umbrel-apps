releaseNotes: >-
  Portainer 2.39.6 LTS adds new security protections and includes fixes for Docker, Swarm, Kubernetes, and Edge environments. This package keeps the Docker runtime rollback from 2.39.4-1 that fixes a networking issue affecting other Umbrel apps.


  Highlights include:
    - Added SSRF protection settings with off, audit, and enforce modes
    - Fixed path traversal in Swarm compose deploys where config or secret paths could escape the project root
    - Fixed Swarm stack and private-registry image build/deploy issues
    - Fixed Kubernetes UI and port-forwarding issues
    - Updated Go, go-git, ORAS, OpenTelemetry, containerd, and other dependencies to address CVEs


  Full release notes can be found at https://github.com/portainer/portainer/releases/tag/2.39.6.
