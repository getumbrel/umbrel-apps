version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: opengist_server_1
      APP_PORT: 6157
      PROXY_AUTH_ADD: "false"

  server:
    image: ghcr.io/thomiceli/opengist:1.16.0@sha256:a6f90c5ce5f62b484e40646c84518fcb45b16da86e653913f7faef0f7f9509f0
    user: "1000:1000"
    restart: on-failure
    ports:
      - "2224:2224"
    volumes:
      - ${APP_DATA_DIR}/data:/opengist
    environment:
      OG_SSH_PORT: "2224"
