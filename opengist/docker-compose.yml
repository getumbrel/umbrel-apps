version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: opengist_server_1
      APP_PORT: 6157
      PROXY_AUTH_ADD: "false"

  server:
    image: ghcr.io/thomiceli/opengist:1.15.3@sha256:f5dd39cc9409b4006f8b090e5f9ed042cdb736d28a06b4f985c674dacafc94d5
    user: "1000:1000"
    restart: on-failure
    ports:
      - "2224:2224"
    volumes:
      - ${APP_DATA_DIR}/data:/opengist
    environment:
      OG_SSH_PORT: "2224"
