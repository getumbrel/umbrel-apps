version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: opengist_server_1
      APP_PORT: 6157
      PROXY_AUTH_ADD: "false"

  server:
    image: ghcr.io/thomiceli/opengist:1.15.0@sha256:dcb396040d2dc39875ba1d7a8f04d427193b5baca39bd6fbc159b6b77f62bb1f
    user: "1000:1000"
    restart: on-failure
    ports:
      - "2224:2224"
    volumes:
      - ${APP_DATA_DIR}/data:/opengist
    environment:
      OG_SSH_PORT: "2224"
