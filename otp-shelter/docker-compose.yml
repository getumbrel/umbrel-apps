version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: otpshelter_app_1
      APP_PORT: 3713

  app:
    image: ghcr.io/egzola/otp-shelter:1.0.0@sha256:66b9cd99b3a6aaa7e9cbae072552a4c00f5a18d60f06deb1517c233ab8ad5600
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PORT: 3713
    volumes:
      - ${APP_DATA_DIR}/data:/data
