version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: otpshelter_app_1
      APP_PORT: 3713

  app:
    image: ghcr.io/egzola/otp-shelter:1.0.0@sha256:17fdb5779d9d5dcdfdc32b284604d26deb75545e37aef868126db72698f2229d
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PORT: 3713
    volumes:
      - ${APP_DATA_DIR}/data:/data
