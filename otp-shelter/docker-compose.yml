version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: otpshelter_app_1
      APP_PORT: 3713

  app:
    image: ghcr.io/egzola/otp-shelter:1.0.0@sha256:e3d87fc47583abccba375d4a7883ef1a30d2acc56952d700a5340a28d91e4f36
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PORT: 3713
    volumes:
      - ${APP_DATA_DIR}/data:/data
