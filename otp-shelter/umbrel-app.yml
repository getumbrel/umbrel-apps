id: otp-shelter
name: OTP-Shelter
tagline: A self-hosted TOTP authenticator for Umbrel
category: security
version: "1.0.0"
port: 3713
description: >-
  A self-hosted TOTP authenticator designed to keep your authentication codes under your control.

  Store your TOTP accounts in an encrypted local vault protected by your master password.

  OTP-Shelter supports SHA-1, SHA-256, and SHA-512, 6- and 8-digit codes,
  configurable TOTP periods, otpauth:// imports, and encrypted backups.
