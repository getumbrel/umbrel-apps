version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: leafwiki_web_1
      APP_PORT: 8080

  web:
    image: ghcr.io/perber/leafwiki:v0.14.2@sha256:bc07b7d0f3de916233a570f6d4b54fe14de0e2cb77e179e6a07bf417fb109585
    restart: on-failure
    environment:
      LEAFWIKI_JWT_SECRET: ${APP_SEED}
      LEAFWIKI_ADMIN_PASSWORD: ${APP_PASSWORD}
      LEAFWIKI_ALLOW_INSECURE: "true"
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
