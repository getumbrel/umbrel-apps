version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: leafwiki_web_1
      APP_PORT: 8080

  web:
    image: ghcr.io/perber/leafwiki:v0.15.0@sha256:bacd15c0fb12c53d034d80c3cb1828f1eb6177fcac362fe90077d1f7f32e307c
    restart: on-failure
    environment:
      LEAFWIKI_JWT_SECRET: ${APP_SEED}
      LEAFWIKI_ADMIN_PASSWORD: ${APP_PASSWORD}
      LEAFWIKI_ALLOW_INSECURE: "true"
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
