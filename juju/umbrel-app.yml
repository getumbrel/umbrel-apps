manifestVersion: 1
id: juju
storage:
  dataRoot: data
category: files
name: Juju
version: "0.0.24"
tagline: Self-hosted family planner — calendar, tasks, shopping, meals & budget
description: >-
  Juju is a self-hosted, privacy-focused family planner that bundles everything
  a household needs into a single fast PWA — no cloud, no tracking, no ads.


  Everything runs on your Umbrel and stays on your Umbrel. The first account
  you create becomes the family admin and can invite the rest of the
  household from Settings.


  ✨ FEATURES


  - Shared family calendar with recurring events, reminders and birthdays

  - CalDAV / Google Calendar / Apple iCloud / ICS subscription sync

  - Tasks with multi-assignment, due dates, points and tags

  - Shopping lists, a kitchen/meal planner with recipes and pantry tracking

  - Notes, documents and contacts (CardDAV)

  - Household budget with accounts, recurring entries, split expenses and loans

  - Health tracking: vitals, activities, medications, lab reports

  - Rewards and housekeeping: staff, chores and supplies

  - Weather widget (Open-Meteo, no API key needed)

  - Optional single sign-on via OIDC

  - Full-text search across every module

  - Installable PWA, mobile-first, dark mode, 24 languages


  🔒 PRIVACY


  Juju keeps all data in a local SQLite database (encrypted with SQLCipher
  using a per-install key derived by umbrelOS). Nothing leaves your device
  unless you explicitly enable a calendar or contacts sync to a provider you
  choose.
releaseNotes: ""

developer: daiqiongzhao-bit
website: https://github.com/daiqiongzhao-bit/Juju
dependencies: []
repo: https://github.com/daiqiongzhao-bit/Juju
support: https://github.com/daiqiongzhao-bit/Juju/issues

port: 8184
gallery: []
path: ""

defaultUsername: ""
defaultPassword: ""

# Exclude regenerable/derived artifacts from Umbrel backups: the app's own
# scheduled database backups and the temporary plaintext copy the app creates
# from the encrypted database for full-text/CalDAV features.
backupIgnore:
  - data/app/juju.db.plaintext-backup*
  - data/app/backups/*.db

submitter: daiqiongzhao-bit
submission: ""
