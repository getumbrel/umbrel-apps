services:
  app_proxy:
    environment:
      APP_HOST: glasshome_server_1
      APP_PORT: 3123
      # GlassHome has its own authenticated device sessions, and its new-device
      # pairing flow must work on devices that do not have an Umbrel session.
      PROXY_AUTH_ADD: "false"

  server:
    image: ghcr.io/glasshome/dash:1.2.0@sha256:0ca541fcd07bfaec96687b73ffb0a41eda83c7d7e33c3cf7652097168c948e20
    restart: on-failure
    environment:
      PORT: 3123
      DATA_DIR: /data
    volumes:
      - ${APP_DATA_DIR}/data:/data
