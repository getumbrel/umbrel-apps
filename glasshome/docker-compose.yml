services:
  app_proxy:
    environment:
      APP_HOST: glasshome_server_1
      APP_PORT: 3123
      # GlassHome has its own authenticated device sessions, and its new-device
      # pairing flow must work on devices that do not have an Umbrel session.
      PROXY_AUTH_ADD: "false"

  server:
    image: ghcr.io/glasshome/dash:1.3.0@sha256:d55e4a11edc21fd02b5b01d4c3275d974738dffc4e03e6ebe2c5a2d35baa46d1
    restart: on-failure
    environment:
      PORT: 3123
      DATA_DIR: /data
    volumes:
      - ${APP_DATA_DIR}/data:/data
