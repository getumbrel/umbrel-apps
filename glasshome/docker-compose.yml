services:
  app_proxy:
    environment:
      APP_HOST: glasshome_server_1
      APP_PORT: 3123
      # GlassHome has its own authenticated device sessions, and its new-device
      # pairing flow must work on devices that do not have an Umbrel session.
      PROXY_AUTH_ADD: "false"

  server:
    image: ghcr.io/glasshome/dash:1.1.3@sha256:de5d64222c7f581d69d65a4ae29a5c091597f7e68478fab660adc62f07304901
    restart: on-failure
    environment:
      PORT: 3123
      DATA_DIR: /data
    volumes:
      - ${APP_DATA_DIR}/data:/data
