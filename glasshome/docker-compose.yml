services:
  app_proxy:
    environment:
      APP_HOST: glasshome_server_1
      APP_PORT: 3123
      # GlassHome has its own authenticated device sessions, and its new-device
      # pairing flow must work on devices that do not have an Umbrel session.
      PROXY_AUTH_ADD: "false"

  server:
    image: ghcr.io/glasshome/dash:1.3.1@sha256:8f4b914905da99580e108c235b2d45df4cd1e66c7118eabb3c8e440d3fcc00b7
    restart: on-failure
    environment:
      PORT: 3123
      DATA_DIR: /data
    volumes:
      - ${APP_DATA_DIR}/data:/data
