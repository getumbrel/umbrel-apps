services:
  app_proxy:
    environment:
      APP_HOST: glasshome_server_1
      APP_PORT: 3123
      # GlassHome has its own authenticated device sessions, and its new-device
      # pairing flow must work on devices that do not have an Umbrel session.
      PROXY_AUTH_ADD: "false"

  server:
    image: ghcr.io/glasshome/dash:1.1.2@sha256:0fd49b6bfd41168861e379fbf91c05f8e624d2879a5b6a73bae5359f86250b80
    restart: on-failure
    environment:
      PORT: 3123
      DATA_DIR: /data
    volumes:
      - ${APP_DATA_DIR}/data:/data
