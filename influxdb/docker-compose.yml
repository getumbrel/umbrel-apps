version: "3.7"

services:

  app_proxy:
    environment:
      APP_HOST: influxdb_chronograf_1
      APP_PORT: 8888

  influxdb:
    image: influxdb:1.13.1@sha256:f5eb5cd107f845529dac36359527ed6448d421c5359cedbfc9d66beffcf669af
    user: 1000:1000
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data/influxdb:/var/lib/influxdb
    environment:
      INFLUXDB_ADMIN_USER: admin
      INFLUXDB_ADMIN_PASSWORD: $APP_PASSWORD
      INFLUXDB_HTTP_AUTH_ENABLED: "true"

  chronograf:
    image: chronograf:1.11.4@sha256:1aa585346868ef0859c507b2c8544a175ad308024765929f5df5b64a9679031d
    user: "1000:1000"
    restart: on-failure
    environment:
      INFLUXDB_URL: "http://influxdb_influxdb_1:8086"
      INFLUXDB_USERNAME: admin
      INFLUXDB_PASSWORD: $APP_PASSWORD
    volumes:
      - ${APP_DATA_DIR}/data/chronograf:/var/lib/chronograf
    depends_on:
      - influxdb
