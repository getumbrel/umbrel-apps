name: kan
version: "0.7.0"
tagline: The open source Trello alternative
description: >-
  Kan is a modern, open-source alternative to Trello designed for seamless project and task management. It offers a clean, intuitive interface and a wide range of powerful features.


    - 👁️ **Board Visibility:** Control who can view and edit your boards
    - 🤝 **Workspace Members:** Invite members and collaborate with your team
    - 🚀 **Trello Imports:** Easily import your Trello boards
    - 🔍 **Labels & Filters:** Organise and find cards quickly
    - 💬 **Comments:** Discuss and collaborate with your team
    - 📝 **Activity Log:** Track all card changes with detailed activity history
    - 🎨 **Templates:** Save time with reusable custom board templates
releaseNotes: >-
  Kan 0.7.0 adds a calendar view, board invitations, and the ability to move boards between workspaces. Existing workspace members keep access to existing boards after the update.


  You can now submit comments with a keyboard shortcut, choose the order of card activity, and copy board links from the board menu.


  This release also improves drag-and-drop, board filters and scrolling, preserves custom label colours, and fixes card descriptions, login redirects, and MCP tools.


  Security improvements protect stored Trello tokens, redact secrets from request logs, and restrict card labels and member assignments to the appropriate board and workspace.


  Full release notes can be found at https://github.com/kanbn/kan/releases/tag/v0.7.0
