releaseNotes: >-
  ⚠️ Advanced users: CLI flags and environment variables have changed. Pass setup keys and hostnames to `up` or `login`, and configure daemon settings through `run`, `install`, or `reconfigure`. TCP daemon connections are no longer supported; use the Unix socket. Review custom scripts before upgrading.


  This update improves connection recovery when networks change, fixes relay reconnections and WireGuard handshake recovery, and improves DNS reliability.


  Linux firewall fixes ensure deny rules take priority for published container ports. Review custom access policies if you previously relied on traffic passing through a deny rule. Rosenpass support is now deprecated.


  Full release notes can be found at https://github.com/netbirdio/netbird/releases/tag/v0.84.0
