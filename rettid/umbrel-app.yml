id: rettid
category: social
name: Rettid
version: "0.1.2"
tagline: A private, installable, mobile-first front-end for Reddit
description: >-
  Rettid is a fork of Redlib (itself descended from Libreddit). It keeps Redlib's privacy
  guarantees — no ads, no trackers, no JavaScript required, and every request (including
  media) proxied server-side so your browser never talks to Reddit directly — and adds a
  mobile-app-style experience on top.


  Three additions on top of upstream Redlib:


  - Voyager layout: a mobile-first skin with a bottom tab bar, sticky top bar, and card-style
    feed, enabled by default

  - Installable PWA: service worker, web app manifest, offline fallback, and media caching so
    it can be added to your home screen and browsed on bad connections

  - Opt-in JSON API: an allowlisted, read-only passthrough to Reddit's JSON endpoints for
    building your own client against your own instance


  Everything else — strict Content Security Policy, server-side media proxying, and full
  compatibility with Redlib's REDLIB_* configuration — is inherited unchanged from Redlib.
