version: '3.7'

services:
  app_proxy:
    environment:
      APP_HOST: homarr_web_1
      APP_PORT: 7575

  web:
    image: ghcr.io/homarr-labs/homarr:v2.1.2@sha256:801f9a3d6dd1a58bc59f7d55869a1d83fb0c1e06571697f33122f7db010dc702
    restart: on-failure
    environment:
      AUTH_SECRET: ${APP_SEED}
      SECRET_ENCRYPTION_KEY: ${APP_SEED}
    volumes:
      - ${APP_DATA_DIR}/data:/appdata
