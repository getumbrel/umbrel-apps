manifestVersion: 1
id: argon-one
storage:
  dataRoot: data
category: automation
name: Argon ONE
version: "1.0.4"
tagline: Fan curve and power button for the Argon ONE case on Raspberry Pi 5
description: >-
  Needs a Raspberry Pi 5 in an Argon ONE case. On other devices the app starts and tells you the case is missing. Not affiliated with Argon 40.


  Set when the fan starts and how fast it spins from a curve you can drag, see the temperature and fan speed, and use the case's power button to reboot or shut down.


  umbrelOS resets its system partition at every boot, so Argon's normal install script is lost after a restart. This app downloads the official Argon scripts into its own data folder and keeps them running. Updates to those scripts are installed only when you press the button, and the previous version comes back automatically if the new one does not work.


  The fan and button service has no network, but it can use I2C and GPIO, and the system D-Bus to reboot or shut down. That is broad access to your Umbrel.
