  - 2.jpg
  - 3.jpg
defaultUsername: "umbrel@umbrel.local"
defaultPassword: "changeme"
deterministicPassword: false
dependencies: []
releaseNotes: >-
  This update includes security, login, reporting, and usability improvements:
    - Reset user security signatures when relevant profile fields change
    - Ensured login links always use two-factor authentication
    - Added ordering support for saved table column choices
    - Added export template columns and dropdown title patterns
    - Fixed team lead access to the Project details report
    - Fixed trusted-host handling for generated login links


  For full release notes, visit https://github.com/kimai/kimai/releases/tag/2.69.0
