releaseNotes: >-
  Kimai 2.66.0 includes several security fixes, and users are advised to upgrade as soon as possible.


  Other improvements include:
    - Added project lock dates to limit timesheet editing for past periods
    - Updated API permission handling for rate, budget, and time fields
    - Added budget fields to customer, project, and activity API collection responses
    - Added API endpoints for invoice deletion and favorites, plus timesheet API improvements
    - Fixed weekly invoice grouping across years and 2FA form visibility with SAML


  For full release notes, visit https://github.com/kimai/kimai/releases/tag/2.66.0
