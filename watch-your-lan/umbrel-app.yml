manifestVersion: 1
id: watch-your-lan
storage:
  dataRoot: data
name: WatchYourLAN
tagline: Lightweight network IP scanner
category: networking
version: "2.1.4-patch.2"
port: 8840
description: >-
  WatchYourLAN is a lightweight network IP scanner. It allows you to keep track of all devices that are connected to your local network.


  If your devices don't appear, open Config → Scan settings and enter your network interface name in Interfaces, then click Save. You can find interface names by running `ip link show` in your Umbrel's terminal. To scan multiple networks, enter their interface names separated by spaces.

releaseNotes: >-
  Network interfaces saved in Config → Scan settings now stay selected after restarting or updating the app. This lets you use WatchYourLAN on virtual machines and other systems with different network interface names, and scan multiple networks.


  Existing saved settings are preserved. If your devices don't appear, check the Interfaces field in Scan settings.

