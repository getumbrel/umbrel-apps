version: "3.7"

services:
  web:
    image: aceberg/watchyourlan:2.1.4@sha256:f77532ca7c3c9a4398cb094df7674013a3d7fcf4699386f1e456c24df6fef00e
    network_mode: "host"        
    restart: on-failure
    stop_grace_period: 1m
    init: true
    entrypoint:
      - /bin/sh
      - -c
      - >-
        IFACES="$$(ip route show default | sed -n 's/.* dev \([^ ]*\).*/\1/p' | head -n 1)";
        export IFACES="$${IFACES:-eth0}";
        exec ./WatchYourLAN
    environment:
      TZ: "UTC"                         # required: needs your TZ for correct time
      HOST: "0.0.0.0"                   # optional, default: 0.0.0.0
      PORT: "8840"                      # optional, default: 8840
      # Exclude to allow custom config:
      # TIMEOUT: "120"                    # optional, time in seconds, default: 120
      # THEME: "sand"                     # optional
      # COLOR: "dark"                     # optional
    volumes:
      - ${APP_DATA_DIR}/data:/data/WatchYourLAN
