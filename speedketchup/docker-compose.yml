services:
  app_proxy:
    environment:
      APP_HOST: speedketchup_web_1
      APP_PORT: 8080

  web:
    image: gatispei/speedketchup:0.9.0@sha256:e4df0aadaa859d650cffec7d34e5629253d0e3934cd5ee9e0ecab6328f227f3a
    user: "1000:1000"
    # speedketchup has no SIGTERM handler, as pid 1 it would only stop after
    # the stop timeout kills it
    init: true
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data/results:/data
