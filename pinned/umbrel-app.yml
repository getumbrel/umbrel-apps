manifestVersion: 1
id: pinned
storage:
  dataRoot: data
category: files
name: Pinned
version: "0.1.8"
tagline: Bookmarks and a start page for the services you run at home
description: >-
  Log in with the password Umbrel shows for this app. The extension, scripts with an API token and share links reach the app without the Umbrel login; the app's own password, tokens and share links protect them.


  Pinned is a bookmark manager and start page for one person. Folders instead of tags, one password, one SQLite file.


  Links to services on your network are kept apart by host and port, so two apps on one address with different ports are two bookmarks, and the port is always shown.


  Save with the Save button (a bookmarklet), as a home screen app on the phone, from the Android share sheet, with the browser extension, or from scripts with an API token. Folders can be locked with their own password, or shared as a read only link with an optional password and expiry.


  Import and export use the bookmarks file every browser reads, and a copy is written to the data folder every night at 03:00.


  The server contacts only the sites you save, to fetch their icons. No telemetry, no update checks.
releaseNotes: ""

