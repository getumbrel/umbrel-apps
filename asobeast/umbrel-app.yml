manifestVersion: 2.0
id: asobeast
storage:
  dataRoot: data
category: developer
name: AsoBeast
version: "1.14.0"
tagline: Track App Store and Google Play keyword rankings
description: >-
  The first account you create in AsoBeast becomes the owner, and sign-up closes after it.


  AsoBeast is an open source App Store Optimization (ASO) tool for the Apple App Store and Google Play. Add an app by its store link and AsoBeast checks where it ranks for your keywords every day, down to position 200, and keeps the history. It also follows your competitors, your reviews and every change to a store listing.


  It reads the same public store pages anyone can open, so you don't need an ASO vendor account or a paid API key, and your keyword list stays in your own database.


  - Daily keyword rankings in any App Store or Google Play country

  - Competitor discovery, keyword gaps and a diff of every listing change

  - Review sync with rating history

  - A to-do list built from 17 fixed rules, each showing the data behind it

  - Webhook alerts for rank drops and new reviews

  - A REST API and an MCP server for AI assistants such as Claude and Cursor


  AI assistants connect to the MCP server at /api/backend/mcp with an AsoBeast API token. AsoBeast needs about 2.5 GB of memory.
