version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: asobeast_web_1
      APP_PORT: 3000
      PROXY_AUTH_WHITELIST: "/api/backend/mcp"

  web:
    image: ghcr.io/asobeast/asobeast-web:1.14.0@sha256:f3c8bdceddd785a31e09beb16451f7e52b44733ea5d1cb5ac573c36ebd47c1a6
    restart: on-failure
    environment:
      API_INTERNAL_URL: http://asobeast_api_1:4000
      HOSTNAME: 0.0.0.0
      TRUST_PROXY: 1
    depends_on:
      api:
        condition: service_healthy

  api:
    image: ghcr.io/asobeast/asobeast-api:1.14.0@sha256:4e1b0e14ed89907dadd7d3a25e3b33d20695029d4171335a37a40340c9e5451f
    restart: on-failure
    stop_grace_period: 90s
    environment:
      DATABASE_URL: postgresql://asobeast:${APP_ASOBEAST_POSTGRES_PASSWORD}@asobeast_postgres_1:5432/asobeast
      REDIS_HOST: asobeast_redis_1
      REDIS_PORT: 6379
      PORT: 4000
      DEFAULT_COUNTRY: us
      NODE_ENV: production
      AUTH_SECRET: ${APP_ASOBEAST_AUTH_SECRET}
      AUTH_COOKIE_SECURE: "true"
      WEB_PUBLIC_URL: https://${DEVICE_DOMAIN_NAME}:${APP_PROXY_PORT}
      TRUST_PROXY: 1
      LOG_LEVEL: log
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  postgres:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    user: "1000:1000"
    restart: on-failure
    environment:
      POSTGRES_USER: asobeast
      POSTGRES_PASSWORD: ${APP_ASOBEAST_POSTGRES_PASSWORD}
      POSTGRES_DB: asobeast
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asobeast -d asobeast"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8.8.4-alpine@sha256:ab669f1420eaa05360a417b24f3bd210c9272e2c79a4bb35d3e50b4bfd50dbee
    user: "1000:1000"
    restart: on-failure
    command: ["redis-server", "--maxmemory", "192mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - ${APP_DATA_DIR}/data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
